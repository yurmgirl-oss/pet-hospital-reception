<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>23시 하단오거리 동물병원 · 접수 안내</title>
<style>
:root{--green:#16875a;--deep:#075b3c;--mint:#e8f8ee;--ink:#12382e;--muted:#648077;--line:#d6eee0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);background:#f5fbf6}
body{padding:clamp(8px,1.5vw,22px);background:radial-gradient(ellipse at 15% 8%,#e6f8e8 0,transparent 35%),radial-gradient(ellipse at 90% 15%,#d9f4e1 0,transparent 30%),#f7fbf8}
.screen{max-width:1500px;margin:auto;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,#effbf2 0%,#fff 48%,#e8f7ed 100%);border:1px solid #d6eee0;box-shadow:0 18px 55px #155e3b18}
header{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:16px;padding:18px 24px;background:linear-gradient(115deg,#e6f8e8,#fff 48%,#c9edcf);border-bottom:1px solid #dcefe2}
.brand{display:flex;align-items:center;gap:14px;min-width:0}.logo{width:76px;height:66px;display:grid;place-items:center;flex:none;border-radius:20px;background:#ffffffbd;border:1px solid #d2ead7;font-size:35px;box-shadow:0 5px 14px #14532d10}.brandname{font-size:clamp(22px,2.4vw,35px);font-weight:950;letter-spacing:-.05em;color:#103b2e}.tagline{font-size:clamp(11px,1vw,14px);color:#5d7c6e;margin-top:6px}
.datebox,.clockbox{border:1px solid #ffffffd9;background:#ffffffd9;border-radius:20px;box-shadow:0 7px 20px #14532d0b;text-align:center}.datebox{padding:11px 15px;min-width:130px;color:#4b7764;font-size:13px}.datebox strong{display:block;font-size:18px;color:#173f31;margin-top:4px}.clockbox{padding:8px 18px;min-width:225px;color:#07603d;font-size:clamp(30px,4vw,54px);font-weight:950;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:1.2}
.sectionbar{display:flex;align-items:center;gap:12px;padding:14px 24px 10px;background:#ffffffa8}.sectiontitle{font-size:clamp(20px,1.8vw,27px);font-weight:950;letter-spacing:-.04em}.hint{font-size:clamp(11px,.9vw,14px);color:#678174}.live{margin-left:auto;display:flex;align-items:center;gap:8px;background:#e6f8ec;color:#28784f;border-radius:99px;padding:9px 13px;font-size:12px;font-weight:900;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;background:#19b75a;box-shadow:0 0 0 4px #c8f1d5;animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.45;transform:scale(.8)}}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-items:stretch;gap:14px;padding:8px 18px 18px}.entry{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;text-align:center;border-radius:22px;border:2px solid #cde8d6;background:linear-gradient(180deg,#fff 0%,#f8fffa 70%,#e7f8ed 100%);box-shadow:0 8px 22px #155e3b12;min-height:0;padding:0 0 14px}.entry:before{content:"";position:absolute;inset:0 0 auto;height:8px;background:linear-gradient(90deg,#39bd7a,#b7edc8)}
.cardtop{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 14px 2px}.num{display:inline-flex;align-items:center;justify-content:center;min-width:66px;height:44px;padding:0 14px;border-radius:14px;background:linear-gradient(145deg,#36c885,#149c6b);color:white;font-size:clamp(24px,2vw,32px);font-weight:950;box-shadow:0 5px 12px #0f9f6c32}.patient{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}.animal{width:clamp(105px,10vw,150px);height:clamp(105px,10vw,150px);display:flex;align-items:center;justify-content:center;flex:none;border-radius:25px;background:radial-gradient(circle at 35% 25%,#fff 0,#e3f8e9 52%,#d8f0e2 100%);border:2px solid #d1ead9;font-size:clamp(75px,7.5vw,112px);line-height:1;box-shadow:inset 0 0 0 5px #ffffffa8;filter:drop-shadow(0 4px 5px #275b3a10)}.petinfo{min-width:0;width:100%}.pet{font-size:clamp(24px,2.2vw,34px);font-weight:950;letter-spacing:-.045em;line-height:1.2;overflow-wrap:anywhere;margin-top:3px}
.reason{margin:10px 12px 0;padding:14px 15px;border-radius:16px;background:linear-gradient(135deg,#fff1f0,#ffe1dc);border:2px solid #ffb6aa;color:#9f2418;font-size:clamp(22px,2vw,32px);font-weight:950;line-height:1.28;overflow-wrap:anywhere;text-align:left;min-height:74px;box-shadow:0 5px 12px #dc262610}.reason:before{content:"🩺  병명 · 행동 변화 / 내원 사유";display:block;color:#c2410c;font-size:clamp(12px,1vw,15px);font-weight:950;margin-bottom:7px}
.right{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 12px 0;margin-top:10px;border-top:1px solid #dcefe2}.status{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:99px;padding:8px 16px;font-size:clamp(15px,1.2vw,19px);font-weight:950}.status.wait{background:#d8f8e0;color:#14653e}.status.wait .sdot{width:10px;height:10px;background:#10b84f;border-radius:50%;animation:pulse 1.15s infinite}.status.treat{background:#e2efff;color:#1d4ed8}.status.treat .sdot{width:10px;height:10px;background:#3b82f6;border-radius:50%;animation:pulse 1.7s infinite}.estimate{font-size:clamp(25px,2.2vw,34px);font-weight:1000;color:#fff;line-height:1.25;background:linear-gradient(135deg,#2563eb,#4f46e5);border-radius:15px;padding:11px 15px;width:100%;box-shadow:0 7px 16px #4338ca30}.elapsed{font-size:clamp(14px,1.1vw,18px);font-weight:900;color:#5b6478;background:#f1f5f9;border-radius:10px;padding:7px 10px}.expected{font-size:clamp(22px,1.9vw,30px);font-weight:1000;color:#7c2d12;background:linear-gradient(135deg,#ffedd5,#fed7aa);border:2px solid #fb923c;border-radius:14px;padding:10px 13px;width:100%;box-shadow:0 5px 13px #ea580c20}.estimate strong{color:#15803d}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;border:1px dashed #b9dbc5;border-radius:22px;background:#ffffffbd;color:#5f7e70;font-size:clamp(20px,2vw,28px);white-space:pre-line}.notice{display:grid;grid-template-columns:minmax(180px,.7fr) minmax(0,2.3fr) 40px;align-items:center;gap:12px;padding:16px 20px;background:linear-gradient(105deg,#1a7457,#2d9b70);color:#fff}.notice-label{display:flex;align-items:center;gap:10px;font-size:clamp(16px,1.4vw,21px);font-weight:950}.notice-label small{display:block;font-size:9px;letter-spacing:.1em;opacity:.75;font-weight:800}.notice-text{border-radius:99px;background:#ffffffed;color:#244b3e;padding:14px 18px;font-size:clamp(14px,1.3vw,19px);font-weight:900;text-align:center;white-space:normal;line-height:1.4}.notice-end{text-align:center;font-size:25px}footer{display:flex;justify-content:space-between;gap:10px;padding:10px 18px;color:#739083;font-size:12px;background:#f4fbf6}
@media(max-width:760px){body{padding:0}.screen{border-radius:0;min-height:100vh}header{grid-template-columns:1fr auto;gap:9px;padding:14px}.brand{gap:8px}.logo{width:49px;height:48px;font-size:25px}.brandname{font-size:18px}.tagline{font-size:10px}.datebox{display:none}.clockbox{min-width:0;padding:7px 10px;font-size:clamp(22px,6vw,34px)}.sectionbar{padding:12px;gap:7px;flex-wrap:wrap}.sectiontitle{font-size:19px}.hint{display:none}.live{font-size:10px;padding:7px 9px}.list{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));padding:7px 9px 13px;gap:10px}.entry{border-radius:18px;padding-bottom:12px}.cardtop{padding:12px 10px 0;gap:6px}.num{min-width:58px;height:38px;font-size:23px;border-radius:12px}.animal{width:clamp(100px,28vw,145px);height:clamp(100px,28vw,145px);font-size:clamp(72px,20vw,105px);border-radius:20px}.pet{font-size:clamp(23px,6vw,30px)}.reason{margin:9px 9px 0;padding:12px;font-size:22px;min-height:65px}.reason:before{font-size:12px}.right{padding-top:10px;margin-top:9px;gap:7px}.status{font-size:15px;padding:8px 13px}.estimate{font-size:25px;padding:10px 12px}.elapsed{font-size:14px}.expected{font-size:22px;padding:9px 10px}.notice{grid-template-columns:1fr 30px;padding:12px;gap:7px}.notice-label{display:none}.notice-text{grid-column:1;font-size:13px;padding:11px 13px;border-radius:14px}.notice-end{grid-column:2;grid-row:1;font-size:20px}footer{font-size:10px;flex-direction:column;gap:5px}}
</style>
</head>
<body><div class="screen">
<header><div class="brand"><div class="logo">🐶🐱</div><div><div class="brandname">23시 하단오거리 동물병원</div><div class="tagline">우리 아이의 건강한 오늘, 23시 하단오거리가 함께합니다. 💚</div></div></div><div class="datebox" id="datebox">📅 날짜 확인 중<strong id="day">오늘</strong></div><div class="clockbox" id="clock">00:00:00</div></header>
<div class="sectionbar"><div class="sectiontitle">🐾 접수 현황 안내</div><div class="hint">순서와 예상 소요시간을 확인하세요</div><div class="live"><span class="dot"></span> 실시간 확인 중</div></div>
<main><section id="list" class="list"><div class="empty">접수 현황을 확인하고 있습니다…</div></section></main>
<div class="notice"><div class="notice-label"><span>📢</span><div>병원 안내 · 공지사항<small>HOSPITAL NOTICE</small></div></div><div class="notice-text" id="notice">병원 출발 전, 미리 사전접수! 기다림은 줄이고 진료는 편리하게 😊</div><div class="notice-end">🔊</div></div>
<footer><span>진료 상황에 따라 예상 소요시간은 달라질 수 있습니다.</span><span id="updated">연결 중</span></footer></div>
<script>
const API_BASE = "https://m5-api.yurmgirl.workers.dev";
const RECEPTION_API = "/api/receptions";
const listEl = document.getElementById("list");
const updatedEl = document.getElementById("updated");
let lastSignature = "";
function tickClock(){const d=new Date();document.getElementById("clock").textContent=d.toLocaleTimeString("ko-KR",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});document.getElementById("datebox").firstChild.textContent="📅 "+d.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"});document.getElementById("day").textContent=d.toLocaleDateString("ko-KR",{weekday:"long"});}
tickClock();setInterval(tickClock,1000);
function safeText(v){return v==null?"":String(v)}
function getPayload(item){let p=item?.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch{p={}}}return p&&typeof p==="object"?p:{}}
function statusOf(item){return safeText(item.status||"접수대기")}
function active(item){const s=statusOf(item);return !["완료","진료완료","취소","종료"].includes(s)}
function estimateMinutes(v){if(v===null||v===undefined||v===""||v==="unknown")return null;const n=Number(v);return Number.isFinite(n)&&n>0?n:null}
function elapsedText(item){const raw=item.created_at||item.createdAt||item.registered_at||item.registeredAt||item.received_at||item.receivedAt;const t=raw?Date.parse(raw):NaN;if(!Number.isFinite(t))return "누적 대기시간 확인 중";const mins=Math.max(0,Math.floor((Date.now()-t)/60000));const h=Math.floor(mins/60),m=mins%60;return `누적 대기 ${h>0?h+"시간 ":""}${m}분`}
function clockText(d){return d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false})}
function estimateText(v){const n=estimateMinutes(v);return n===null?"예상시간 미정":`예상 소요 ${n}분`}
function make(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
const ANIMALS={dog:{label:"강아지",emoji:"🐶"},cat:{label:"고양이",emoji:"🐱"},small_mammal:{label:"소동물",emoji:"🐹"},bird:{label:"조류",emoji:"🦜"},reptile:{label:"파충류",emoji:"🦎"},other:{label:"기타 동물",emoji:"🐾"}};
function render(items, estimates, animalTypes){
 const activeItems=(Array.isArray(items)?items:[]).filter(active).sort((a,b)=>{
   const ta=Date.parse(a.created_at||a.createdAt||0)||0, tb=Date.parse(b.created_at||b.createdAt||0)||0;
   return ta-tb;
 });
 listEl.replaceChildren();
 if(!activeItems.length){listEl.append(make("div","empty","현재 대기 중인 접수가 없습니다.\n접수가 등록되면 이 화면에 표시됩니다."));return}
 let cumulativeMinutes=0;let cumulativeKnown=true;
 activeItems.forEach((item,index)=>{
   const row=make("article","entry"),top=make("div","cardtop"),num=make("div","num",String(index+1).padStart(2,"0"));
   const key=String(item.id??item.reception_id??"");
   const pet=make("div","pet",safeText(item.pet_name||item.animal_name||"이름 미입력"));
   const animalType=animalTypes&&animalTypes[key]?animalTypes[key]:"other";
   const animal=ANIMALS[animalType]||ANIMALS.other;
   const illustration=make("div","animal",animal.emoji);illustration.setAttribute("aria-label",animal.label);
   const petinfo=make("div","petinfo");petinfo.append(pet);
   const patient=make("div","patient");patient.append(illustration,petinfo);top.append(num,patient);
   const payload=getPayload(item);const reason=safeText(payload.disease||item.disease||payload.diagnosis||item.diagnosis||payload.reason||item.symptom||item.symptoms||"병명·내원 사유 확인 중");
   const why=make("div","reason",reason);
   const right=make("div","right");const s=statusOf(item);const treating=/진료중|진료 중|치료중|치료 중/.test(s);
   const badge=make("div","status "+(treating?"treat":"wait"));badge.append(make("span","sdot"),document.createTextNode(treating?"진료 진행 중":"접수중"));
   const val=estimates&&Object.prototype.hasOwnProperty.call(estimates,key)?estimates[key]:null;
   const minutes=estimateMinutes(val);
   if(minutes===null)cumulativeKnown=false;else cumulativeMinutes+=minutes;
   const expected=cumulativeKnown?"예상 진료 시각 "+clockText(new Date(Date.now()+cumulativeMinutes*60000)):"예상 진료 시각 미정";
   const estimateLabel=minutes===null?"예상 소요시간 미정":"예상 소요시간 "+minutes+"분";
   right.append(badge,make("div","elapsed",elapsedText(item)),make("div","estimate",estimateLabel),make("div","expected",expected));
   row.append(top,why,right);listEl.append(row);
 });
}
async function refresh(){
 try{
   const [r,e]=await Promise.all([fetch(RECEPTION_API,{cache:"no-store"}),fetch(API_BASE+"/estimates",{cache:"no-store"})]);
   if(!r.ok)throw new Error("접수 목록을 읽지 못했습니다 ("+r.status+")");
   if(!e.ok)throw new Error("예상시간 서버에 연결할 수 없습니다 ("+e.status+")");
   const receptions=await r.json();const estimateData=await e.json();
   render(Array.isArray(receptions)?receptions:(receptions.items||[]),estimateData.estimates||{},estimateData.animalTypes||{});
   updatedEl.textContent="마지막 갱신 "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
 }catch(err){updatedEl.textContent="연결 확인 필요";if(!listEl.children.length||listEl.querySelector(".empty"))listEl.replaceChildren(make("div","empty","서버에 연결하지 못했습니다.\n관리자에게 연결 상태를 확인해 주세요."));console.error(err)}
}
refresh();setInterval(refresh,5000);
</script>
</body></html>
