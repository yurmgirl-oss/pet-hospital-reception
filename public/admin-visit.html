<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>방문·상담 현황판</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f4f7f8;color:#23343e;font-family:Pretendard,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto}h1{font-size:clamp(22px,4vw,32px)}.box{background:white;border:1px solid #e1e8eb;border-radius:15px;padding:16px;margin-bottom:12px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select,button{font:inherit;padding:10px;border:1px solid #d4dfe2;border-radius:9px;background:white}button{cursor:pointer;font-weight:800}.primary{background:#0b9e94;color:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:white;padding:12px;border-radius:12px;border:1px solid #e2e8eb}.stat strong{display:block;font-size:23px}.tablebox{overflow:auto;background:white;border-radius:12px;border:1px solid #e2e8eb}table{border-collapse:collapse;width:100%;min-width:850px}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f1;font-size:13px;vertical-align:top}th{background:#f7f9fa}.details{white-space:pre-wrap;max-width:280px;overflow-wrap:anywhere}.detail-preview{display:block;max-width:260px;white-space:pre-wrap;overflow-wrap:anywhere;color:#334155;margin-bottom:6px}.detail-open{padding:6px 9px;background:#e7f7f4;border:1px solid #8bd7ca;color:#087c73;font-size:12px}.modal{position:fixed;inset:0;background:#10202799;display:none;align-items:center;justify-content:center;padding:16px;z-index:9999}.modal.show{display:flex}.modal-card{width:min(760px,100%);max-height:90vh;overflow:auto;background:white;border-radius:16px;padding:20px;box-shadow:0 20px 60px #0004}.modal-card h2{margin:0 0 12px}.modal-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}.modal-meta div{background:#f4f7f8;border-radius:8px;padding:9px;overflow-wrap:anywhere}.modal-meta b{display:block;font-size:12px;color:#647580;margin-bottom:3px}.full-detail{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;background:#fffaf3;border:1px solid #f0e1cf;border-radius:10px;padding:14px;min-height:90px}.modal-actions{display:flex;justify-content:flex-end;margin-top:14px}.error{color:#b42318}@media(max-width:600px){.stats{gap:5px}.stat{padding:8px}.stat strong{font-size:18px}}</style></head><body><main class="wrap"><section id="login" class="box"><h2>🔐 직원 전용 현황판</h2><p>관리자 토큰을 입력하세요.</p><input id="token" type="password" placeholder="관리자 토큰"><button id="loginBtn" class="primary">로그인</button><p id="error" class="error"></p></section><section id="app" hidden><h1>방문·상담 현황판</h1><p>23시 하단오거리동물병원 · 방문/상담 전용</p><div class="stats"><div class="stat">전체<strong id="total">0</strong></div><div class="stat">접수·처리 중<strong id="pending">0</strong></div><div class="stat">완료<strong id="done">0</strong></div></div><div class="bar" style="margin-top:12px"><input id="q" placeholder="이름·동물·요청 검색"><select id="filter"><option value="">모든 상태</option><option>접수</option><option>처리 중</option><option>완료</option><option>취소</option></select><button id="refresh" class="primary">새로고침</button><button id="logout">로그아웃</button></div><div class="tablebox"><table><thead><tr><th>접수 시각</th><th>방문 예정</th><th>방문자</th><th>연락처</th><th>동물/업체</th><th>목적</th><th>요청 사항 · 전체 보기</th><th>상태 변경</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div id="detailModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal-card"><h2 id="detailTitle">📋 방문·상담 상세내용</h2><div id="detailMeta" class="modal-meta"></div><h3>요청 사항 전체 내용</h3><div id="detailText" class="full-detail"></div><div class="modal-actions"><button id="closeDetail" class="primary" type="button">닫기</button></div></div></div><script>
let token='',items=[];const $=id=>document.getElementById(id);async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(opts.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'요청 실패');return j}
function openDetail(x){const modal=$('detailModal'),meta=$('detailMeta');meta.replaceChildren();const rows=[['접수 시각',new Date(x.created_at).toLocaleString('ko-KR')],['방문 예정',x.scheduled_at?new Date(x.scheduled_at).toLocaleString('ko-KR',{dateStyle:'full',timeStyle:'short'}):'—'],['방문자',x.visitor_name],['연락처',x.phone],['동물이름 / 업체이름',x.animal_name],['방문 목적',x.purpose],['처리 상태',x.status]];for(const [label,value] of rows){const d=document.createElement('div'),b=document.createElement('b'),span=document.createElement('span');b.textContent=label;span.textContent=value||'—';d.append(b,span);meta.appendChild(d)}$('detailText').textContent=x.request_details||'요청 사항이 없습니다.';modal.classList.add('show')}function closeDetail(){$('detailModal').classList.remove('show')}$('closeDetail').onclick=closeDetail;$('detailModal').onclick=e=>{if(e.target===$('detailModal'))closeDetail()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});
$('loginBtn').onclick=async()=>{token=$('token').value.trim();try{await load();$('login').hidden=true;$('app').hidden=false;$('error').textContent=''}catch(e){$('error').textContent='인증 또는 연결 오류: '+e.message}};$('logout').onclick=()=>{token='';$('app').hidden=true;$('login').hidden=false};$('refresh').onclick=load;$('q').oninput=render;$('filter').onchange=render;
async function load(){items=(await api('/api/visits')).items||[];render()}function render(){let q=$('q').value.toLowerCase(),s=$('filter').value;let list=items.filter(x=>(!s||x.status===s)&&[x.visitor_name,x.animal_name,x.phone,x.purpose,x.request_details,x.scheduled_at].join(' ').toLowerCase().includes(q));$('total').textContent=items.length;$('pending').textContent=items.filter(x=>['접수','처리 중'].includes(x.status)).length;$('done').textContent=items.filter(x=>x.status==='완료').length;let body=$('rows');body.replaceChildren();if(!list.length){body.innerHTML='<tr><td colspan="8">표시할 접수가 없습니다.</td></tr>';return}for(const x of list){let tr=document.createElement('tr');[new Date(x.created_at).toLocaleString('ko-KR'),x.scheduled_at?new Date(x.scheduled_at).toLocaleString('ko-KR',{dateStyle:'short',timeStyle:'short'}):'—',x.visitor_name,x.phone||'—',x.animal_name||'—',x.purpose].forEach(v=>{let td=document.createElement('td');td.textContent=v||'—';tr.appendChild(td)});let detailTd=document.createElement('td');detailTd.className='details';let preview=document.createElement('div');preview.className='detail-preview';const detail=String(x.request_details||'');preview.textContent=detail.length>70?detail.slice(0,70)+'…':(detail||'—');detailTd.appendChild(preview);let detailBtn=document.createElement('button');detailBtn.type='button';detailBtn.className='detail-open';detailBtn.textContent='전체 내용 보기';detailBtn.onclick=()=>openDetail(x);detailTd.appendChild(detailBtn);tr.appendChild(detailTd);let td=document.createElement('td'),sel=document.createElement('select');['접수','처리 중','완료','취소'].forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;o.selected=x.status===v;sel.appendChild(o)});sel.onchange=async()=>{try{await api('/api/visits/'+x.id,{method:'PATCH',body:JSON.stringify({status:sel.value})});await load()}catch(e){alert(e.message)}};td.appendChild(sel);tr.appendChild(td);body.appendChild(tr)}};</script></body></html>
