<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>23시 하단오거리 동물병원 - 건강검진 예상 비용 견적서</title>
<style>
  :root {
    --bg: #cbd5e1;
    --ink: #0f172a;
    --muted: #475569;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* 숫자 입력칸 스피너(증감 화살표) 제거 */
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] {
    -moz-appearance: textfield;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 전체 화면 컨테이너 (16:9 모니터 풀스크린) */
  .app-shell {
    width: 100%;
    height: 100%;
    padding: 8px;
    display: flex;
  }

  /* 전체 레이아웃 시트: 좌측 메인 프레임(560px) + 우측 4개 프레임 균등 배분 */
  .sheet-container {
    width: 100%;
    height: 100%;
    background: #ffffff;
    border: 1.5px solid #94a3b8;
    border-radius: 14px;
    box-shadow: 0 8px 28px rgba(15, 23, 42, 0.12);
    padding: 8px;
    display: grid;
    grid-template-columns: 560px repeat(4, minmax(0, 1fr));
    gap: 8px;
    overflow: hidden;
  }

  /* ================= 좌측: 메인 컨트롤 & 견적서 프레임 ================= */
  .control-panel {
    background: linear-gradient(180deg, #f8fafc 0%, #eef2f6 100%);
    border: 2px solid #94a3b8;
    border-top: 6px solid #0f172a;
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    height: 100%;
    min-height: 0;
    overflow: hidden;
  }

  /* 병원 타이틀 블록 */
  .ctrl-brand {
    background: #ffffff;
    border: 1.5px solid #cbd5e1;
    border-radius: 11px;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    flex: none;
  }

  .ctrl-brand-top {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-badge {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 22px;
    font-weight: 900;
    flex: none;
  }

  .sheet-title {
    font-size: 23px;
    font-weight: 900;
    color: #0f172a;
    letter-spacing: -0.6px;
    line-height: 1.2;
  }

  .clinic-info-line {
    font-size: 14.5px;
    font-weight: 800;
    color: #334155;
    padding-top: 6px;
    border-top: 1.5px dashed #cbd5e1;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* 동물이름 & 실시간 시계 입력 카드 */
  .ctrl-meta-card {
    background: #ffffff;
    border: 1.5px solid #cbd5e1;
    border-radius: 11px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex: none;
  }

  .meta-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .meta-label {
    font-size: 15px;
    font-weight: 800;
    color: #1e293b;
    white-space: nowrap;
  }

  .pet-name-input {
    width: 145px;
    height: 36px;
    border: 2px solid #2563eb;
    background: #eff6ff;
    border-radius: 8px;
    padding: 0 10px;
    font-size: 17px;
    font-weight: 900;
    color: #0f172a;
    text-align: center;
  }

  .pet-name-input:focus {
    outline: none;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
  }

  .datetime-box {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 7px 12px;
    text-align: right;
    flex: 1;
  }

  .auto-datetime-text {
    font-size: 15px;
    font-weight: 800;
    color: #0f172a;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.3px;
    white-space: nowrap;
  }

  /* 예상 총 견적비용 강조 카드 */
  .total-card {
    background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
    color: #ffffff;
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.22);
    border: 1.5px solid #334155;
    flex: none;
  }

  .total-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .total-label {
    font-size: 15px;
    font-weight: 800;
    color: #e2e8f0;
  }

  .total-count {
    display: inline-block;
    width: fit-content;
    font-size: 13px;
    font-weight: 800;
    background: rgba(56, 189, 248, 0.2);
    color: #7dd3fc;
    padding: 2px 10px;
    border-radius: 999px;
  }

  .total-amount {
    font-size: 36px;
    font-weight: 900;
    color: #38bdf8;
    line-height: 1.1;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }

  /* 선택 내역 요약 리스트 (기준 규격: gap 10px, padding 10px 14px, font-size 17px) */
  .selected-box {
    background: #ffffff;
    border: 1.5px solid #cbd5e1;
    border-radius: 11px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  .selected-box-title {
    font-size: 16px;
    font-weight: 900;
    color: #0f172a;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex: none;
  }

  .selected-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 4px;
  }

  .selected-list::-webkit-scrollbar {
    width: 5px;
  }
  .selected-list::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
  }

  .sel-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 17px;
    flex: none;
  }

  .sel-name {
    font-weight: 800;
    color: #0f172a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sel-price {
    font-weight: 900;
    color: #2563eb;
    flex: none;
    font-variant-numeric: tabular-nums;
  }

  .empty-msg {
    font-size: 15px;
    color: #94a3b8;
    font-weight: 700;
    text-align: center;
    margin: auto 0;
    line-height: 1.5;
  }

  .note-text {
    font-size: 12.5px;
    color: #64748b;
    font-weight: 700;
    line-height: 1.35;
    flex: none;
    padding-top: 6px;
    border-top: 1px dashed #e2e8f0;
  }

  /* 좌측 하단 버튼 그룹 */
  .ctrl-actions {
    display: grid;
    grid-template-columns: 1.4fr 1.1fr 0.8fr 0.8fr;
    gap: 6px;
    flex: none;
  }

  .action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 44px;
    padding: 0 8px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.15s ease;
    font-family: inherit;
    white-space: nowrap;
  }

  .btn-save-img {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #ffffff;
    box-shadow: 0 3px 10px rgba(37, 99, 235, 0.3);
  }
  .btn-save-img:hover {
    background: linear-gradient(135deg, #1d4ed8, #1e40af);
    transform: translateY(-1px);
  }

  .btn-print {
    background: #0f766e;
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(15, 118, 110, 0.25);
  }
  .btn-print:hover {
    background: #115e59;
  }

  .btn-clear {
    background: #ffffff;
    border-color: #94a3b8;
    color: #1e293b;
  }
  .btn-clear:hover {
    background: #f8fafc;
  }

  .btn-reset {
    background: #fff1f2;
    border-color: #fda4af;
    color: #be123c;
  }
  .btn-reset:hover {
    background: #ffe4e6;
  }

  /* ================= 우측: 4개 세로 프레임 열 (좌측 선택 내역과 완전히 동일한 간격/글자크기 적용) ================= */
  .col-stack {
    display: flex;
    flex-direction: column;
    gap: 8px;
    height: 100%;
    min-height: 0;
  }

  /* 1열(신체검사 + 영상검사): 신체검사는 내용만큼만 차지하고 나머지는 영상검사가 채움 */
  .col-stack.split-col .frame:first-child {
    flex: 0 0 auto;
  }
  .col-stack.split-col .frame:last-child {
    flex: 1 1 auto;
  }

  /* 2, 3, 4열 단일 프레임은 전체 높이 유지 */
  .col-stack.single-col .frame {
    flex: 1;
  }

  .frame {
    background: var(--bg-tint);
    border: 1.5px solid var(--border-tint);
    border-top: 4px solid var(--color);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
  }

  .frame-head {
    padding: 7px 10px;
    background: var(--head-tint);
    border-bottom: 1.5px solid var(--border-tint);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    flex: none;
  }

  .frame-title-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .num-pill {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    background: var(--color);
    color: #fff;
    font-size: 13.5px;
    font-weight: 900;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }

  .frame-head h2 {
    font-size: 16.5px;
    font-weight: 900;
    color: #0f172a;
    letter-spacing: -0.5px;
    white-space: nowrap;
  }

  .frame-sub {
    font-size: 11.5px;
    color: #334155;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 검사항목 리스트: 좌측 선택 내역(.selected-list)과 100% 동일한 gap(10px) 적용 */
  .items {
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 10px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }

  .items::-webkit-scrollbar {
    width: 5px;
  }
  .items::-webkit-scrollbar-thumb {
    background: rgba(15, 23, 42, 0.25);
    border-radius: 4px;
  }

  /* 각 항목 행: 좌측 선택 내역(.sel-row)과 동일한 크기·패딩·라운딩·고정 높이 */
  .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    transition: border-color 0.1s ease, box-shadow 0.1s ease;
    flex: none;
  }

  .item:hover {
    border-color: var(--color);
  }

  .item.selected {
    background: #ffffff;
    border: 1.5px solid var(--color);
    box-shadow: 0 2px 5px rgba(15, 23, 42, 0.08);
  }

  .item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--color);
    cursor: pointer;
    flex: none;
  }

  .name-price-pair {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }

  /* 좌측 .sel-name(17px)과 동일한 폰트 크기 및 굵기 */
  .name-input {
    flex: 1;
    min-width: 0;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 4px;
    padding: 0 2px;
    font-size: 17px;
    font-weight: 800;
    color: #0f172a;
    font-family: inherit;
    letter-spacing: -0.6px;
    line-height: 1.25;
  }

  .item.selected .name-input {
    color: var(--color);
  }

  .name-input.extra-empty {
    color: #94a3b8;
    font-weight: 600;
    font-size: 15.5px;
  }

  .name-input:focus {
    background: #f8fafc;
    border-color: var(--color);
    color: #0f172a;
    outline: none;
  }

  .price-box {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    flex: none;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 2px 6px;
  }

  .item.selected .price-box {
    background: var(--head-tint);
    border-color: var(--color);
  }

  /* 좌측 .sel-price(17px)와 동일한 폰트 크기 및 굵기 */
  .price-input {
    width: 72px;
    border: none;
    background: transparent;
    text-align: right;
    font-size: 17px;
    font-weight: 900;
    color: #0f172a;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1.25;
  }

  .price-input:focus {
    outline: none;
  }

  .won {
    font-size: 13.5px;
    font-weight: 800;
    color: #475569;
  }

  .del-btn {
    border: none;
    background: #fee2e2;
    color: #dc2626;
    font-size: 11.5px;
    font-weight: 800;
    padding: 3px 6px;
    border-radius: 5px;
    cursor: pointer;
    flex: none;
  }
  .del-btn:hover {
    background: #fecaca;
  }

  /* 하단 항목 추가 바 */
  .add-bar {
    padding: 6px 8px;
    border-top: 1px dashed var(--border-tint);
    background: rgba(255, 255, 255, 0.75);
    display: flex;
    gap: 5px;
    flex: none;
  }

  .add-bar input {
    flex: 1;
    min-width: 0;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 13.5px;
    font-weight: 700;
    background: #ffffff;
    font-family: inherit;
  }

  .add-bar input:focus {
    border-color: var(--color);
    outline: none;
  }

  .add-bar button {
    background: var(--color);
    color: #ffffff;
    border: none;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
  }

  /* ================= A4 세로 규격(794px x 1123px) 견적서 이미지 저장 전용 스타일 ================= */
  .capture-a4-mode {
    width: 794px !important;
    min-height: 1123px !important;
    height: auto !important;
    background: #ffffff !important;
    border: 2px solid #94a3b8 !important;
    border-top: 10px solid #0f172a !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    padding: 32px 36px !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: space-between !important;
    gap: 18px !important;
  }

  .capture-a4-mode .ctrl-brand {
    padding: 18px 22px !important;
    border: 2px solid #cbd5e1 !important;
  }

  .capture-a4-mode .brand-badge {
    width: 50px !important;
    height: 50px !important;
    font-size: 26px !important;
  }

  .capture-a4-mode .sheet-title {
    font-size: 28px !important;
  }

  .capture-a4-mode .clinic-info-line {
    font-size: 16.5px !important;
    padding-top: 10px !important;
    margin-top: 4px !important;
  }

  .capture-a4-mode .ctrl-meta-card {
    padding: 14px 20px !important;
    border: 2px solid #cbd5e1 !important;
  }

  .capture-a4-mode .meta-label {
    font-size: 17px !important;
  }

  .capture-a4-mode .auto-datetime-text {
    font-size: 17px !important;
  }

  .capture-a4-mode .total-card {
    padding: 20px 26px !important;
  }

  .capture-a4-mode .total-label {
    font-size: 18px !important;
  }

  .capture-a4-mode .total-count {
    font-size: 14.5px !important;
    padding: 3px 12px !important;
  }

  .capture-a4-mode .total-amount {
    font-size: 44px !important;
  }

  .capture-a4-mode .selected-box {
    flex: 1 !important;
    padding: 18px 20px !important;
    border: 2px solid #cbd5e1 !important;
    overflow: visible !important;
  }

  .capture-a4-mode .selected-box-title {
    font-size: 19px !important;
    padding-bottom: 10px !important;
  }

  .capture-a4-mode .selected-list {
    overflow: visible !important;
    max-height: none !important;
    gap: 11px !important;
  }

  .capture-a4-mode .sel-row {
    padding: 12px 16px !important;
    font-size: 19px !important;
  }

  .capture-a4-mode .note-text {
    font-size: 14px !important;
    padding-top: 10px !important;
  }

  .capture-a4-mode .ctrl-actions {
    display: none !important;
  }

  .capture-meta-val {
    font-size: 20px;
    font-weight: 900;
    color: #0f172a;
    padding: 3px 12px;
    background: #eff6ff;
    border: 1.5px solid #93c5fd;
    border-radius: 7px;
  }

  /* ================= A4 인쇄 전용 스타일 ================= */
  @page {
    size: A4 portrait;
    margin: 8mm;
  }

  @media print {
    html, body {
      width: 210mm !important;
      height: auto !important;
      background: #ffffff !important;
      overflow: visible !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .app-shell {
      padding: 0 !important;
      display: block !important;
    }
    .sheet-container {
      display: block !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
    }
    .col-stack,
    .ctrl-actions {
      display: none !important;
    }
    #mainControlPanel {
      width: 100% !important;
      height: auto !important;
      min-height: 275mm !important;
      background: #ffffff !important;
      border: 2px solid #94a3b8 !important;
      border-top: 8px solid #0f172a !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      padding: 10mm !important;
      overflow: visible !important;
    }
    .selected-list {
      overflow: visible !important;
    }
    .pet-name-input {
      border: none !important;
      background: transparent !important;
      text-align: left !important;
    }
  }
</style>
</head>
<body>

<div class="app-shell">
  <div id="capture" class="sheet-container">
    
    <!-- 좌측 1열: 메인 컨트롤 & 견적서 요약 프레임 -->
    <aside id="mainControlPanel" class="control-panel">
      <!-- 병원 및 견적서 제목 -->
      <div class="ctrl-brand">
        <div class="ctrl-brand-top">
          <div class="brand-badge">🏥</div>
          <div class="sheet-title">반려동물 건강검진 예상 비용 견적서</div>
        </div>
        <div class="clinic-info-line">
          <span>23시 하단오거리 동물병원</span>
          <span>문의 및 예약 · 051) 264-8275</span>
        </div>
      </div>

      <!-- 동물이름 입력 & 현재 시각(분·초 단위) -->
      <div class="ctrl-meta-card">
        <div class="meta-group">
          <span class="meta-label">🐾 동물이름</span>
          <input type="text" id="petName" class="pet-name-input" placeholder="이름 입력" oninput="saveMeta()">
        </div>
        <div class="datetime-box">
          <div id="autoDateTime" class="auto-datetime-text"></div>
        </div>
      </div>

      <!-- 예상 총 견적비용 강조 카드 -->
      <div class="total-card">
        <div class="total-left">
          <span class="total-label">예상 총 견적비용</span>
          <span class="total-count" id="countBadge">총 0건 선택</span>
        </div>
        <div class="total-amount" id="total">0원</div>
      </div>

      <!-- 선택된 항목 실시간 요약 리스트 -->
      <div class="selected-box">
        <div class="selected-box-title">
          <span>📋 선택된 검사 및 처치 내역</span>
        </div>
        <div class="selected-list" id="selectedList">
          <div class="empty-msg">우측 항목을 체크하면<br>여기에 자동 정리됩니다.</div>
        </div>
        <div class="note-text">※ 위 금액은 예상 비용이며, 진료 및 정밀 검사 추가에 따라 변동될 수 있습니다.</div>
      </div>

      <!-- 각종 저장 및 초기화 버튼 모음 -->
      <div class="ctrl-actions">
        <button type="button" class="action-btn btn-save-img" onclick="saveImage()">🖼️ 견적서 이미지 저장 (A4)</button>
        <button type="button" class="action-btn btn-print" onclick="printSheet()">🖨️ 견적서 인쇄</button>
        <button type="button" class="action-btn btn-clear" onclick="resetChecks()">🔄 초기화</button>
        <button type="button" class="action-btn btn-reset" onclick="resetDefaults()">⚙️ 기본값</button>
      </div>
    </aside>

    <!-- 우측 2~5열: 4단 세로 검사·처치 프레임 -->
    <div class="col-stack split-col" id="col-0"></div>
    <div class="col-stack single-col" id="col-1"></div>
    <div class="col-stack single-col" id="col-2"></div>
    <div class="col-stack single-col" id="col-3"></div>

  </div>
</div>

<script>
const categories = [
  {
    col: 0,

    borderTint: '#5eead4',

      { name: '초음파 (기본 컷)', price: 55000 },
      { name: '상위초음파 (기본 컷)', price: 100000 },
      { name: '엑스레이 추가 컷 이상', price: 10000 },
      { name: '심장초음파', price: 80000 },
      { name: '심장CT', price: 150000 },

    ],

  },
  {

    sub: '혈구·혈청·전해질',
    color: '#e11d48',
    bgTint: '#fff1f2',
    headTint: '#ffe4e6',
    borderTint: '#fda4af',
    items: [
      { name: '혈구검사', price: 33000 },
      { name: '혈청 (기본종합검사)', price: 80000 },
      { name: '혈청 (17종)', price: 98000 },
      { name: '혈청+전해질 (27종)', price: 130000 },

      { name: '혈구검사단독검사', price: 50000 },

      { name: '신장기능 특화검사', price: 35000 },

    ],

  },
  {

    sub: '호르몬·면역·알러지',
    color: '#d97706',
    bgTint: '#fffbeb',
    headTint: '#fef3c7',
    borderTint: '#fcd34d',
    items: [
      { name: 'T4', price: 70000 },
      { name: 'proBNP', price: 80000 },
      { name: 'cortisol', price: 70000 },
      { name: 'CRP', price: 35000 },
      { name: 'IgG', price: 50000 },
      { name: '알러지 120종검사', price: 300000 },
      { name: '항체가검사', price: 66000 },
      { name: '암표지검사', price: 99000 },
      { name: '분변검사', price: 50000 },
      { name: '소변검사', price: 50000 }
    ],
    extra: 3
  },
  {
    col: 3,
    title: '처치 및 마취·기타',
    sub: '진정·마취·수액·처치',
    color: '#7c3aed',
    bgTint: '#f5f3ff',
    headTint: '#ede9fe',
    borderTint: '#c4b5fd',
    items: [
      { name: '마취 (기본)', price: 50000 },
      { name: '진정 / 부분마취', price: 50000 },
      { name: '수액처치 (정맥수액)', price: 60000 },
      { name: '발톱깎기', price: 10000 },
      { name: '귀세정 / 귀처치', price: 10000 },
      { name: '항문낭', price: 5000 },
      { name: '피하수액 처치', price: 40000 },
      { name: '주사처치 (1회당)', price: 12000 },
      { name: '외과처치', price: 0 },
      { name: '외과수술', price: 0 },
      { name: '구토유도처치', price: 120000 },
      { name: '위담배달', price: 30000 },
      { name: '소독처치', price: 0 },
      { name: '스케일링', price: 0 },
      { name: '발치', price: 0 }
    ],
    extra: 2
  }
];

const STORAGE_KEY = 'vet_checkup_price_v4_priced_quote1';
const META_STORAGE_KEY = 'vet_checkup_meta_v2_quote1';
let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let meta = JSON.parse(localStorage.getItem(META_STORAGE_KEY) || '{}');

function formatKoreanDateTimeFull(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const h = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0');
  const sec = String(d.getSeconds()).padStart(2, '0');
  return `${y}년 ${m}월 ${day}일 ${h}시 ${min}분 ${sec}초`;
}

function updateClock() {
  const el = document.getElementById('autoDateTime');
  if (el) el.textContent = formatKoreanDateTimeFull();
}

function initMeta() {
  const petInp = document.getElementById('petName');
  petInp.value = meta.petName || '';
  updateClock();
  setInterval(updateClock, 1000);
}

function saveMeta() {
  meta.petName = document.getElementById('petName').value;
  localStorage.setItem(META_STORAGE_KEY, JSON.stringify(meta));
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  renderSummary();
}

function key(c, i) {
  return c + '_' + i;
}

function getItem(c, i, defaultName, defaultPrice, isExtra) {
  const k = key(c, i);
  if (!data[k]) {
    data[k] = {
      name: defaultName,
      price: defaultPrice,
      checked: false,
      extra: isExtra,
      custom: false
    };
  }
  return data[k];
}

function money(n) {
  return Number(n || 0).toLocaleString('ko-KR') + '원';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[m]));
}

function render() {
  for (let k = 0; k < 4; k++) {
    document.getElementById('col-' + k).innerHTML = '';
  }

  categories.forEach((cat, c) => {
    const colContainer = document.getElementById('col-' + cat.col);
    const frame = document.createElement('section');
    frame.className = 'frame';
    frame.style.setProperty('--color', cat.color);
    frame.style.setProperty('--bg-tint', cat.bgTint);
    frame.style.setProperty('--head-tint', cat.headTint);
    frame.style.setProperty('--border-tint', cat.borderTint);

    frame.innerHTML = `
      <div class="frame-head">
        <div class="frame-title-wrap">
          <span class="num-pill">${c + 1}</span>
          <h2>${cat.title}</h2>
        </div>
        <span class="frame-sub">${cat.sub}</span>
      </div>
      <div class="items" id="items-${c}"></div>
    `;
    colContainer.appendChild(frame);

    const list = frame.querySelector('.items');

    cat.items.forEach((itemObj, i) => {
      addItemRow(list, c, i, itemObj.name, itemObj.price, false, false);
    });

    for (let j = 0; j < cat.extra; j++) {
      const idx = cat.items.length + j;
      addItemRow(list, c, idx, '', 0, true, false);
    }

    Object.keys(data).forEach(k => {
      if (k.startsWith(c + '_')) {
        const idx = Number(k.split('_')[1]);
        if (idx >= cat.items.length + cat.extra && data[k].custom) {
          addItemRow(list, c, idx, data[k].name, data[k].price, false, true);
        }
      }
    });

    const addBar = document.createElement('div');
    addBar.className = 'add-bar';
    addBar.innerHTML = `
      <input id="new-${c}" placeholder="새 항목 입력..." onkeydown="if(event.key==='Enter') addCustom(${c})">
      <button type="button" onclick="addCustom(${c})">+ 추가</button>
    `;
    frame.appendChild(addBar);
  });

  renderSummary();
}

function addItemRow(list, c, i, defaultName, defaultPrice, isExtra, isCustom) {
  const obj = getItem(c, i, defaultName, defaultPrice, isExtra);
  const row = document.createElement('div');
  const isBlankExtra = isExtra && !String(obj.name || '').trim() && Number(obj.price || 0) === 0;
  row.className = 'item' + (obj.checked ? ' selected' : '') + (isBlankExtra ? ' blank-extra' : '');

  const placeholderText = isExtra ? `여유 항목 ${(i - categories[c].items.length) + 1}` : '항목명';

  row.innerHTML = `
    <input type="checkbox" ${obj.checked ? 'checked' : ''}>
    <div class="name-price-pair">
      <input type="text" class="name-input ${isExtra && !obj.name ? 'extra-empty' : ''}" value="${escapeHtml(obj.name)}" placeholder="${placeholderText}" title="${escapeHtml(obj.name)}">
      <div class="price-box">
        <input class="price-input" type="text" inputmode="numeric" value="${Number(obj.price || 0).toLocaleString('ko-KR')}">
        <span class="won">원</span>
      </div>
    </div>
    ${isCustom ? '<button type="button" class="del-btn" title="삭제">삭제</button>' : ''}
  `;

  const cb = row.querySelector('input[type="checkbox"]');
  const ni = row.querySelector('.name-input');
  const pi = row.querySelector('.price-input');

  function updateBlankState() {
    if (!isExtra) return;
    const blank = !String(obj.name || '').trim() && Number(obj.price || 0) === 0 && !obj.checked;
    row.classList.toggle('blank-extra', blank);
  }

  cb.onchange = () => {
    obj.checked = cb.checked;
    row.classList.toggle('selected', obj.checked);
    updateBlankState();
    save();
  };

  ni.oninput = () => {
    obj.name = ni.value;
    ni.classList.toggle('extra-empty', isExtra && !obj.name);
    updateBlankState();
    save();
  };

  pi.oninput = () => {
    const raw = pi.value.replace(/[^0-9]/g, '');
    obj.price = Math.max(0, Number(raw) || 0);
    const formatted = obj.price.toLocaleString('ko-KR');
    if (pi.value !== formatted) pi.value = formatted;
    updateBlankState();
    save();
  };
  pi.onblur = () => { pi.value = Number(obj.price || 0).toLocaleString('ko-KR'); };
  pi.onfocus = () => { pi.select(); };

  if (isCustom) {
    row.querySelector('.del-btn').onclick = () => {
      delete data[key(c, i)];
      save();
      render();
    };
  }

  list.appendChild(row);
}

function addCustom(c) {
  const inp = document.getElementById('new-' + c);
  const name = inp.value.trim();
  if (!name) return;

  let idx = categories[c].items.length + categories[c].extra;
  while (data[key(c, idx)]) {
    idx++;
  }

  data[key(c, idx)] = {
    name: name,
    price: 0,
    checked: true,
    extra: false,
    custom: true
  };
  inp.value = '';
  save();
  render();
}

function renderSummary() {
  const out = document.getElementById('selectedList');
  let total = 0;
  const selected = [];

  categories.forEach((cat, c) => {
    const keys = Object.keys(data)
      .filter(k => k.startsWith(c + '_'))
      .sort((a, b) => Number(a.split('_')[1]) - Number(b.split('_')[1]));

    keys.forEach(k => {
      const o = data[k];
      if (o && o.checked) {
        const displayName = (o.name || '').trim() || '미지정 여분 항목';
        const price = Number(o.price) || 0;
        total += price;
        selected.push({ name: displayName, price: price });
      }
    });
  });

  if (selected.length > 0) {
    out.innerHTML = selected.map(item => `
      <div class="sel-row">
        <span class="sel-name">${escapeHtml(item.name)}</span>
        <span class="sel-price">${money(item.price)}</span>
      </div>
    `).join('');
  } else {
    out.innerHTML = '<div class="empty-msg">우측 항목을 체크하면<br>여기에 자동 정리됩니다.</div>';
  }

  document.getElementById('total').textContent = money(total);
  document.getElementById('countBadge').textContent = `총 ${selected.length}건 선택`;
}

function resetChecks() {
  Object.values(data).forEach(x => { x.checked = false; });
  document.getElementById('petName').value = '';
  saveMeta();
  updateClock();
  save();
  render();
}

function resetDefaults() {
  if (!confirm('여분 항목과 직접 수정한 검사명·단가를 초기 기본값으로 되돌릴까요?')) return;
  localStorage.removeItem(STORAGE_KEY);
  data = {};
  render();
}

function printSheet() {
  updateClock();
  window.print();
}

/* 좌측 메인 프레임을 A4 세로 규격(794px x 1123px) 양식에 맞춰 고해상도 이미지 저장 */
async function saveImage() {
  const target = document.getElementById('mainControlPanel');
  if (!window.html2canvas) {
    alert('이미지 저장 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
    return;
  }

  updateClock();

  const clone = target.cloneNode(true);
  clone.id = 'capture-clone';
  clone.classList.add('capture-a4-mode');
  clone.style.position = 'fixed';
  clone.style.left = '-9999px';
  clone.style.top = '0';

  const origPetInp = document.getElementById('petName');
  const clonePetInp = clone.querySelector('#petName');
  if (clonePetInp) {
    const span = document.createElement('span');
    span.className = 'capture-meta-val';
    span.textContent = (origPetInp.value || '').trim() || '-';
    clonePetInp.replaceWith(span);
  }

  document.body.appendChild(clone);

  try {
    const canvas = await html2canvas(clone, {
      scale: 2,
      width: 794,
      windowWidth: 794,
      backgroundColor: '#ffffff',
      useCORS: true
    });
    const petNameClean = (origPetInp.value || '').trim().replace(/[\\/:*?"<>|]/g, '');
    const fileName = petNameClean ? `건강검진_예상견적서_A4_${petNameClean}.png` : '건강검진_예상견적서_A4.png';
    const a = document.createElement('a');
    a.download = fileName;
    a.href = canvas.toDataURL('image/png');
    a.click();
  } catch (e) {
    alert('이미지 저장에 실패했습니다. 다시 시도해주세요.');
  } finally {
    clone.remove();
  }
}

initMeta();
render();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
