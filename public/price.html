<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>23시 하단오거리 동물병원 - 건강검진 및 처치 예상견적서</title>
<style>
  :root {
    --bg: #eef2f6;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --border: #dbe3ec;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    padding: 10px 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* A4 세로 비율(210mm x 297mm -> 794px x 1123px)에 맞춰 화면·이미지저장·인쇄 통일 */
  .wrap {
    width: 794px;
    max-width: 100%;
    margin: 0 auto;
  }

  /* 상단 헤더 (화면 조작 버튼 영역 - 캡처/인쇄 대상 제외) */
  header.toolbar {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 9px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .brand-badge {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 17px;
    font-weight: 900;
    box-shadow: 0 3px 8px rgba(37, 99, 235, 0.25);
  }
  .title {
    font-size: 17px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.4px;
  }
  .subtitle {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 1px;
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  button {
    border: 1px solid transparent;
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-outline {
    background: #fff;
    border-color: #cbd5e1;
    color: #334155;
  }
  .btn-outline:hover {
    background: #f8fafc;
    border-color: #94a3b8;
  }
  .btn-primary {
    background: #2563eb;
    color: #fff;
    box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
  }
  .btn-primary:hover {
    background: #1d4ed8;
  }

  /* A4 용지 시트 컨테이너 (상하 여백 컴팩트화) */
  #capture.a4-sheet {
    width: 794px;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 12px 16px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* 견적서 상단 타이틀 배너 (상하 여백 축소) */
  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #0f172a;
    padding-bottom: 5px;
    margin-bottom: 0;
    gap: 8px;
  }
  .sheet-title {
    font-size: 18px;
    font-weight: 900;
    color: #0f172a;
    letter-spacing: -0.4px;
  }
  .sheet-clinic {
    font-size: 11.5px;
    font-weight: 700;
    color: #475569;
    text-align: right;
  }

  /* 동물이름(축소) 및 자동 일시(연월일시분초) 바 */
  .patient-meta-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 3px 10px;
  }
  .meta-field {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .meta-label {
    font-size: 11.5px;
    font-weight: 800;
    color: #334155;
    white-space: nowrap;
  }
  .pet-name-input {
    width: 110px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 12px;
    font-weight: 700;
    color: #0f172a;
    font-family: inherit;
    height: 23px;
  }
  .pet-name-input:focus {
    border-color: #2563eb;
    outline: none;
  }
  .auto-datetime-text {
    font-size: 12px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.2px;
  }

  /* 좌우 2열 그리드 (상하 간격 축소) */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    align-items: start;
  }
  .col-stack {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  .frame {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-top: 3px solid var(--color);
    border-radius: 8px;
    display: block;
    overflow: hidden;
    width: 100%;
  }

  .frame-head {
    padding: 4px 9px;
    background: var(--tint);
    border-bottom: 1px solid #dbe3ec;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .frame-title-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .num-pill {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    background: var(--color);
    color: #fff;
    font-size: 10.5px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .frame-head h2 {
    margin: 0;
    font-size: 13.5px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.3px;
  }
  .frame-sub {
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
  }

  /* 검사/처치 항목 리스트 (상하 여백 타이트하게 조정) */
  .items {
    padding: 3px 7px 4px 9px;
    display: block;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 1px 3px;
    margin-bottom: 1.5px;
    border-radius: 5px;
    border: 1px solid transparent;
    width: 100%;
    min-height: 21px;
  }
  .item:last-child {
    margin-bottom: 0;
  }
  .item:hover {
    background: #f8fafc;
  }
  .item.selected {
    background: var(--tint);
    border-color: var(--color);
  }
  .item input[type="checkbox"] {
    width: 13.5px;
    height: 13.5px;
    accent-color: var(--color);
    margin: 0;
    cursor: pointer;
    flex: none;
  }

  .name-price-pair {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
    min-width: 0;
  }
  .name-input {
    width: 225px;
    max-width: calc(100% - 82px);
    flex: 1 1 auto;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 4px;
    padding: 1px 4px;
    font-size: 12px;
    font-weight: 700;
    color: #1e293b;
    line-height: 1.25;
  }
  .name-input.extra-empty {
    color: #94a3b8;
    font-weight: 500;
  }
  .name-input:focus {
    background: #fff;
    border-color: var(--color);
    color: #0f172a;
    outline: none;
  }

  .price-box {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    flex: none;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    padding: 0.5px 5px;
  }
  .item.selected .price-box {
    background: #fff;
    border-color: var(--color);
  }
  .price-input {
    width: 60px;
    border: none;
    background: transparent;
    text-align: right;
    font-size: 11.5px;
    font-weight: 700;
    color: #0f172a;
    padding: 0.5px 0;
    line-height: 1.25;
  }
  .price-input:focus {
    outline: none;
  }
  .won {
    font-size: 10.5px;
    font-weight: 600;
    color: #64748b;
  }
  .del-btn {
    border: none;
    background: #fee2e2;
    color: #dc2626;
    font-size: 9.5px;
    font-weight: 700;
    padding: 1.5px 5px;
    border-radius: 4px;
    flex: none;
  }

  /* 하단 추가 바 */
  .add-bar {
    margin-top: 3px;
    padding-top: 3px;
    border-top: 1px dashed #e2e8f0;
    display: flex;
    gap: 4px;
  }
  .add-bar input {
    flex: 1;
    min-width: 0;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    padding: 2.5px 6px;
    font-size: 10.5px;
    background: #f8fafc;
  }
  .add-bar input:focus {
    background: #fff;
    border-color: var(--color);
    outline: none;
  }
  .add-bar button {
    background: var(--color);
    color: #fff;
    padding: 2.5px 7px;
    font-size: 10.5px;
    border-radius: 4px;
    flex: none;
  }

  /* 하단 견적 요약 패널 (상하 여백 축소) */
  .summary {
    background: #f8fafc;
    border: 1.5px solid #cbd5e1;
    border-radius: 8px;
    padding: 8px 12px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 205px;
    gap: 10px;
    width: 100%;
  }
  .summary-title {
    margin: 0 0 4px;
    font-size: 13px;
    font-weight: 800;
    color: #0f172a;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .selected-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 3px 7px;
  }
  .sel-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 11px;
    padding: 2px 6px;
    background: #ffffff;
    border-radius: 4px;
    border: 1px solid #dbe3ec;
  }
  .sel-name {
    color: #1e293b;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sel-price {
    color: #0f172a;
    font-weight: 800;
    flex: none;
  }
  .empty-msg {
    font-size: 11px;
    color: #94a3b8;
    padding: 2px 0;
  }
  .total-card {
    background: linear-gradient(145deg, #0f172a, #1e293b);
    color: #fff;
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .total-label {
    font-size: 11px;
    color: #cbd5e1;
    font-weight: 600;
  }
  .total-amount {
    font-size: 22px;
    font-weight: 900;
    color: #38bdf8;
    margin: 1px 0;
    letter-spacing: -0.5px;
  }
  .total-count {
    font-size: 10px;
    background: rgba(255, 255, 255, 0.14);
    padding: 1.5px 8px;
    border-radius: 999px;
    color: #e2e8f0;
  }
  .note {
    margin-top: 4px;
    font-size: 10px;
    color: #64748b;
  }

  /* html2canvas 캡처 시 스타일 (상하 여백을 줄여 내용 높이만큼 깔끔하게 캡처) */
  .capture-mode .add-bar,
  .capture-mode .del-btn,
  .capture-mode .blank-extra {
    display: none !important;
  }
  .capture-meta-val {
    display: inline-block;
    font-size: 12px;
    font-weight: 800;
    color: #0f172a;
    padding: 1px 2px;
  }
  .capture-text-val {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: #1e293b;
    padding: 1px 4px;
    line-height: 1.25;
    flex: 1 1 auto;
    word-break: keep-all;
  }
  .capture-price-val {
    display: inline-block;
    min-width: 54px;
    text-align: right;
    font-size: 11.5px;
    font-weight: 700;
    color: #0f172a;
    padding: 0.5px 0;
    line-height: 1.25;
  }

  /* A4 세로 용지 인쇄 (상하 여백 축소 및 자연스러운 상단 밀착 배치) */
  @page {
    size: A4 portrait;
    margin: 5mm;
  }
  @media print {
    html, body {
      width: 210mm;
      margin: 0 !important;
      padding: 0 !important;
      background: #ffffff !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    header.toolbar,
    .add-bar,
    .del-btn,
    .blank-extra {
      display: none !important;
    }
    .wrap {
      width: 200mm !important;
      max-width: 200mm !important;
      margin: 0 auto !important;
    }
    #capture.a4-sheet {
      width: 200mm !important;
      max-width: 200mm !important;
      min-height: auto !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      padding: 1mm 2mm !important;
      gap: 2mm !important;
    }
    .sheet-header {
      padding-bottom: 1.5mm;
      margin-bottom: 0;
    }
    .sheet-title {
      font-size: 15pt;
    }
    .sheet-clinic {
      font-size: 9pt;
    }
    .patient-meta-bar {
      padding: 1mm 2.5mm !important;
      margin-bottom: 0 !important;
    }
    .meta-label {
      font-size: 9pt !important;
    }
    .pet-name-input {
      width: 28mm !important;
      height: auto !important;
      border: none !important;
      background: transparent !important;
      padding: 0 !important;
      font-size: 9.5pt !important;
    }
    .auto-datetime-text {
      font-size: 9.5pt !important;
    }
    .main-grid {
      grid-template-columns: 1fr 1fr !important;
      gap: 2.5mm !important;
      align-items: start !important;
    }
    .col-stack {
      gap: 2mm !important;
    }
    .frame {
      border: 1px solid #cbd5e1 !important;
      border-top: 2.5px solid var(--color) !important;
      border-radius: 5px !important;
      break-inside: avoid;
    }
    .frame-head {
      padding: 1.2mm 2.2mm !important;
    }
    .frame-head h2 {
      font-size: 10pt !important;
    }
    .frame-sub {
      font-size: 7.5pt !important;
    }
    .items {
      padding: 1mm 2mm !important;
    }
    .item {
      padding: 0.4mm 1mm !important;
      margin-bottom: 0.3mm !important;
      min-height: 4.8mm !important;
    }
    .item input[type="checkbox"] {
      width: 3.2mm !important;
      height: 3.2mm !important;
    }
    .name-input {
      font-size: 8.8pt !important;
      padding: 0 1mm !important;
    }
    .price-box {
      padding: 0.2mm 1.2mm !important;
    }
    .price-input {
      width: 13.5mm !important;
      font-size: 8.8pt !important;
    }
    .won {
      font-size: 7.8pt !important;
    }
    .summary {
      margin-top: 1.5mm !important;
      padding: 2mm 3mm !important;
      grid-template-columns: minmax(0, 1fr) 48mm !important;
      gap: 2.5mm !important;
      border-radius: 6px !important;
      break-inside: avoid;
    }
    .summary-title {
      font-size: 10pt !important;
      margin-bottom: 1mm !important;
    }
    .selected-grid {
      gap: 1mm 2mm !important;
    }
    .sel-row {
      font-size: 8.2pt !important;
      padding: 0.5mm 1.8mm !important;
    }
    .note {
      font-size: 7.5pt !important;
      margin-top: 1mm !important;
    }
    .total-card {
      padding: 2mm !important;
      border-radius: 5px !important;
    }
    .total-label {
      font-size: 8.5pt !important;
    }
    .total-amount {
      font-size: 16pt !important;
    }
    .total-count {
      font-size: 7.5pt !important;
    }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="toolbar">
    <div class="brand">
      <div class="brand-badge">🐾</div>
      <div>
        <div class="title">건강검진 및 처치 예상 견적 계산기</div>
        <div class="subtitle">동물이름을 입력하고 항목을 체크하면 자동 일시와 함께 A4 규격으로 저장·인쇄됩니다.</div>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn-outline" onclick="resetChecks()">선택 초기화</button>
      <button type="button" class="btn-primary" onclick="saveImage()">🖼 A4 이미지 저장</button>
      <button type="button" class="btn-outline" onclick="printSheet()">🖨 A4 인쇄</button>
      <button type="button" class="btn-outline" onclick="resetDefaults()">기본값 복원</button>
    </div>
  </header>

  <div id="capture" class="a4-sheet">
    <div class="sheet-header">
      <div class="sheet-title">반려동물 건강검진 및 처치 예상견적서</div>
      <div class="sheet-clinic">23시 하단오거리 동물병원 · 051) 264-8275</div>
    </div>

    <!-- 동물이름(작은 입력칸) 및 자동 생성 일시(연월일시분초) -->
    <div class="patient-meta-bar">
      <div class="meta-field">
        <span class="meta-label">동물이름 :</span>
        <input type="text" id="petName" class="pet-name-input" placeholder="이름 입력" oninput="saveMeta()">
      </div>
      <div class="meta-field">
        <span class="meta-label">견적일시 :</span>
        <span id="autoDateTime" class="auto-datetime-text"></span>
      </div>
    </div>

    <div class="main-grid">
      <!-- 1열: 1. 신체검사 + 2. 영상검사 + 3. 혈액검사 -->
      <div class="col-stack" id="col-0"></div>
      <!-- 2열: 4. 기타검사 + 5. 처치 및 마취·기타 -->
      <div class="col-stack" id="col-1"></div>
    </div>

    <section class="summary">
      <div>
        <h3 class="summary-title">📋 선택된 검사 및 처치 내역</h3>
        <div class="selected-grid" id="selectedList">
          <div class="empty-msg">선택된 항목이 없습니다.</div>
        </div>
        <div class="note">※ 본 견적은 예상 비용이며, 진료 및 정밀 검사·처치 진행에 따라 실제 비용은 달라질 수 있습니다.</div>
      </div>
      <div class="total-card">
        <div class="total-label">예상 총 비용</div>
        <div class="total-amount" id="total">0원</div>
        <div class="total-count" id="countBadge">총 0개 항목 선택</div>
      </div>
    </section>
  </div>
</div>

<script>
const categories = [
  {
    col: 0,
    title: '신체검사',
    sub: '기본 계측 및 안압·혈압',
    color: '#2563eb',
    tint: '#eff6ff',
    items: [
      { name: '신체검사 (눈,코,귀,치아,피부,슬개골촉지)', price: 30000 },
      { name: '안압검사', price: 15000 },
      { name: '혈압검사', price: 25000 }
    ],
    extra: 2
  },
  {
    col: 0,
    title: '영상검사',
    sub: '방사선 및 정밀 초음파',
    color: '#0d9488',
    tint: '#f0fdfa',
    items: [
      { name: '엑스레이 (기본 2컷)', price: 50000 },
      { name: '초음파 (기본 컷)', price: 55000 },
      { name: '심장초음파 (기본 컷)', price: 100000 },
      { name: '엑스레이 추가컷 장당', price: 10000 },
      { name: '치과엑스레이', price: 80000 },
      { name: '치과CT', price: 150000 },
      { name: '내시경검사', price: 200000 }
    ],
    extra: 2
  },
  {
    col: 0,

const STORAGE_KEY = 'vet_checkup_price_v3_priced';
const META_STORAGE_KEY = 'vet_checkup_meta_v2';
let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let meta = JSON.parse(localStorage.getItem(META_STORAGE_KEY) || '{}');

function formatKoreanDateTimeFull(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const h = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0');
  const sec = String(d.getSeconds()).padStart(2, '0');
  return `${y}년 ${m}월 ${day}일 ${h}시 ${min}분 ${sec}초`;
}

function updateClock() {
  const el = document.getElementById('autoDateTime');
  if (el) el.textContent = formatKoreanDateTimeFull();
}

function initMeta() {
  const petInp = document.getElementById('petName');
  petInp.value = meta.petName || '';
  updateClock();
  setInterval(updateClock, 1000);
}

function saveMeta() {
  meta.petName = document.getElementById('petName').value;
  localStorage.setItem(META_STORAGE_KEY, JSON.stringify(meta));
}

(function migrateMovedItems(){
  const videoCat = 1, otherCat = 3;
  [4,5].forEach(oldIdx => {
    const oldKey = `${videoCat}_${oldIdx}`;
    if (data[oldKey]) {
      const newKey = `${videoCat}_${oldIdx + 3}`;
      if (!data[newKey]) data[newKey] = data[oldKey];
      delete data[oldKey];
    }
  });
  const moved = [{old:8,new:4},{old:9,new:5},{old:12,new:6}];
  moved.forEach(({old,new:ni}) => {
    const oldKey = `${otherCat}_${old}`;
    if (data[oldKey]) {
      const newKey = `${videoCat}_${ni}`;
      if (!data[newKey]) data[newKey] = data[oldKey];
      delete data[oldKey];
    }
  });
  const remap = {};
  Object.keys(data).forEach(k => {
    if (!k.startsWith(otherCat + '_')) return;
    const idx = Number(k.split('_')[1]);
    if (idx === 10) remap[k] = `${otherCat}_8`;
    else if (idx === 11) remap[k] = `${otherCat}_9`;
    else if (idx === 13) remap[k] = `${otherCat}_10`;
    else if (idx === 14) remap[k] = `${otherCat}_11`;
    else if (idx >= 15) remap[k] = `${otherCat}_${idx - 3}`;
  });
  Object.entries(remap).forEach(([oldKey,newKey]) => {
    if (!data[newKey]) data[newKey] = data[oldKey];
    delete data[oldKey];
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
})();

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  renderSummary();
}

function key(c, i) {
  return c + '_' + i;
}

function getItem(c, i, defaultName, defaultPrice, isExtra) {
  const k = key(c, i);
  if (!data[k]) {
    data[k] = {
      name: defaultName,
      price: defaultPrice,
      checked: false,
      extra: isExtra,
      custom: false
    };
  }
  return data[k];
}

function money(n) {
  return Number(n || 0).toLocaleString('ko-KR') + '원';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[m]));
}

function render() {
  document.getElementById('col-0').innerHTML = '';
  document.getElementById('col-1').innerHTML = '';

  categories.forEach((cat, c) => {
    const colContainer = document.getElementById('col-' + cat.col);
    const frame = document.createElement('section');
    frame.className = 'frame';
    frame.style.setProperty('--color', cat.color);
    frame.style.setProperty('--tint', cat.tint);
    frame.innerHTML = `
      <div class="frame-head">
        <div class="frame-title-wrap">
          <span class="num-pill">${c + 1}</span>
          <h2>${cat.title}</h2>
        </div>
        <span class="frame-sub">${cat.sub}</span>
      </div>
      <div class="items" id="items-${c}"></div>
    `;
    colContainer.appendChild(frame);

    const list = frame.querySelector('.items');

    cat.items.forEach((itemObj, i) => {
      addItemRow(list, c, i, itemObj.name, itemObj.price, false, false);
    });

    for (let j = 0; j < cat.extra; j++) {
      const idx = cat.items.length + j;
      addItemRow(list, c, idx, '', 0, true, false);
    }

    Object.keys(data).forEach(k => {
      if (k.startsWith(c + '_')) {
        const idx = Number(k.split('_')[1]);
        if (idx >= cat.items.length + cat.extra && data[k].custom) {
          addItemRow(list, c, idx, data[k].name, data[k].price, false, true);
        }
      }
    });

    const addBar = document.createElement('div');
    addBar.className = 'add-bar';
    addBar.innerHTML = `
      <input id="new-${c}" placeholder="추가 항목 입력..." onkeydown="if(event.key==='Enter') addCustom(${c})">
      <button type="button" onclick="addCustom(${c})">+ 추가</button>
    `;
    list.appendChild(addBar);
  });

  renderSummary();
}

function addItemRow(list, c, i, defaultName, defaultPrice, isExtra, isCustom) {
  const obj = getItem(c, i, defaultName, defaultPrice, isExtra);
  const row = document.createElement('div');
  const isBlankExtra = isExtra && !String(obj.name || '').trim() && Number(obj.price || 0) === 0;
  row.className = 'item' + (obj.checked ? ' selected' : '') + (isBlankExtra ? ' blank-extra' : '');

  const placeholderText = isExtra ? `여유 항목 ${(i - categories[c].items.length) + 1}` : '항목명';

  row.innerHTML = `
    <input type="checkbox" ${obj.checked ? 'checked' : ''}>
    <div class="name-price-pair">
      <input type="text" class="name-input ${isExtra && !obj.name ? 'extra-empty' : ''}" value="${escapeHtml(obj.name)}" placeholder="${placeholderText}" title="${escapeHtml(obj.name)}">
      <div class="price-box">
        <input class="price-input" type="text" inputmode="numeric" value="${Number(obj.price || 0).toLocaleString('ko-KR')}">
        <span class="won">원</span>
      </div>
    </div>
    ${isCustom ? '<button type="button" class="del-btn" title="삭제">삭제</button>' : ''}
  `;

  const cb = row.querySelector('input[type="checkbox"]');
  const ni = row.querySelector('.name-input');
  const pi = row.querySelector('.price-input');

  function updateBlankState() {
    if (!isExtra) return;
    const blank = !String(obj.name || '').trim() && Number(obj.price || 0) === 0 && !obj.checked;
    row.classList.toggle('blank-extra', blank);
  }

  cb.onchange = () => {
    obj.checked = cb.checked;
    row.classList.toggle('selected', obj.checked);
    updateBlankState();
    save();
  };

  ni.oninput = () => {
    obj.name = ni.value;
    ni.classList.toggle('extra-empty', isExtra && !obj.name);
    updateBlankState();
    save();
  };

  pi.oninput = () => {
    const raw = pi.value.replace(/[^0-9]/g, '');
    obj.price = Math.max(0, Number(raw) || 0);
    const formatted = obj.price.toLocaleString('ko-KR');
    if (pi.value !== formatted) pi.value = formatted;
    updateBlankState();
    save();
  };
  pi.onblur = () => { pi.value = Number(obj.price || 0).toLocaleString('ko-KR'); };

  pi.onfocus = () => {
    pi.select();
  };

  if (isCustom) {
    row.querySelector('.del-btn').onclick = () => {
      delete data[key(c, i)];
      save();
      render();
    };
  }

  list.appendChild(row);
}

function addCustom(c) {
  const inp = document.getElementById('new-' + c);
  const name = inp.value.trim();
  if (!name) return;

  let idx = categories[c].items.length + categories[c].extra;
  while (data[key(c, idx)]) {
    idx++;
  }

  data[key(c, idx)] = {
    name: name,
    price: 0,
    checked: true,
    extra: false,
    custom: true
  };
  inp.value = '';
  save();
  render();
}

function renderSummary() {
  const out = document.getElementById('selectedList');
  let total = 0;
  const selected = [];

  categories.forEach((cat, c) => {
    const keys = Object.keys(data)
      .filter(k => k.startsWith(c + '_'))
      .sort((a, b) => Number(a.split('_')[1]) - Number(b.split('_')[1]));

    keys.forEach(k => {
      const o = data[k];
      if (o && o.checked) {
        const displayName = (o.name || '').trim() || '미입력 여유 항목';
        const price = Number(o.price) || 0;
        total += price;
        selected.push({ name: displayName, price: price });
      }
    });
  });

  if (selected.length > 0) {
    out.innerHTML = selected.map(item => `
      <div class="sel-row">
        <span class="sel-name">${escapeHtml(item.name)}</span>
        <span class="sel-price">${money(item.price)}</span>
      </div>
    `).join('');
  } else {
    out.innerHTML = '<div class="empty-msg">선택된 항목이 없습니다.</div>';
  }

  document.getElementById('total').textContent = money(total);
  document.getElementById('countBadge').textContent = `총 ${selected.length}개 항목 선택`;
}

function resetChecks() {
  Object.values(data).forEach(x => { x.checked = false; });
  document.getElementById('petName').value = '';
  saveMeta();
  updateClock();
  save();
  render();
}

function resetDefaults() {
  if (!confirm('입력하신 모든 가격과 처치 항목을 초기 기본값으로 되돌릴까요?')) return;
  localStorage.removeItem(STORAGE_KEY);
  data = {};
  render();
}

function printSheet() {
  updateClock();
  window.print();
}

async function saveImage() {
  const target = document.getElementById('capture');
  if (!window.html2canvas) {
    alert('이미지 저장 기능을 불러오지 못했습니다. 인쇄 기능을 이용해주세요.');
    return;
  }

  updateClock();

  const clone = target.cloneNode(true);
  clone.id = 'capture-clone';
  clone.classList.add('capture-mode');
  clone.style.position = 'fixed';
  clone.style.left = '-9999px';
  clone.style.top = '0';
  clone.style.width = '794px';
  clone.style.border = 'none';
  clone.style.borderRadius = '0';
  clone.style.boxShadow = 'none';
  clone.style.background = '#ffffff';
  clone.style.padding = '12px 16px';

  // 동물이름 input을 정적 텍스트로 치환
  const origPetInp = document.getElementById('petName');
  const clonePetInp = clone.querySelector('#petName');
  if (clonePetInp) {
    const span = document.createElement('span');
    span.className = 'capture-meta-val';
    span.textContent = (origPetInp.value || '').trim() || '-';
    clonePetInp.replaceWith(span);
  }

  // 원본 체크박스 상태 동기화 및 input -> 정적 텍스트 변환
  const origCheckboxes = target.querySelectorAll('input[type="checkbox"]');
  const cloneCheckboxes = clone.querySelectorAll('input[type="checkbox"]');
  origCheckboxes.forEach((cb, idx) => {
    if (cloneCheckboxes[idx]) cloneCheckboxes[idx].checked = cb.checked;
  });

  const origNameInputs = target.querySelectorAll('.name-input');
  const cloneNameInputs = clone.querySelectorAll('.name-input');
  origNameInputs.forEach((inp, idx) => {
    const cInp = cloneNameInputs[idx];
    if (!cInp) return;
    const span = document.createElement('span');
    span.className = 'capture-text-val';
    span.textContent = inp.value || inp.placeholder || '';
    cInp.replaceWith(span);
  });

  const origPriceInputs = target.querySelectorAll('.price-input');
  const clonePriceInputs = clone.querySelectorAll('.price-input');
  origPriceInputs.forEach((inp, idx) => {
    const cInp = clonePriceInputs[idx];
    if (!cInp) return;
    const span = document.createElement('span');
    span.className = 'capture-price-val';
    span.textContent = inp.value || '0';
    cInp.replaceWith(span);
  });

  document.body.appendChild(clone);

  try {
    const canvas = await html2canvas(clone, {
      scale: 2,
      width: 794,
      height: clone.scrollHeight,
      windowWidth: 794,
      backgroundColor: '#ffffff',
      useCORS: true
    });
    const petNameClean = (origPetInp.value || '').trim().replace(/[\/:*?"<>|]/g, '');
    const fileName = petNameClean ? `건강검진_예상견적서_${petNameClean}.png` : '건강검진_예상견적서.png';
    const a = document.createElement('a');
    a.download = fileName;
    a.href = canvas.toDataURL('image/png');
    a.click();
  } catch (e) {
    alert('이미지 저장에 실패했습니다. 인쇄 기능을 이용해주세요.');
  } finally {
    clone.remove();
  }
}

render();
