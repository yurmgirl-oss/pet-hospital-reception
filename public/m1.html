<script>
const t=new Date();
const today=t.toISOString().slice(0,10);
start.value=today;
endDate.value=30;
todayText.textContent=today;
const months=[0,1].map(i=>new Date(t.getFullYear(),t.getMonth()+i,1));
const selected=new Set(), events=[];
const painted=new Map();
function sync(){ppet.textContent=pet.value||'—';pdisease.textContent=disease.value||'—';pstart.textContent=start.value}
pet.oninput=disease.oninput=start.oninput=sync;sync();
memoInput.oninput=()=>{pmemo.textContent=memoInput.value;};
const cautionStyles=['#fff3cd|#f4b400','#fff3cd|#f4b400','#ffebee|#e53935','#f5f5f5|#757575','#e8f5e9|#43a047','#fff3e0|#fb8c00','#e3f2fd|#1e88e5','#f3e5f5|#8e24aa','#ffebee|#e53935'];
function refreshCautions(){
 const selectedCautions=[...document.querySelectorAll('.cautionCheck:checked')].map((el,i)=>({text:el.value,style:cautionStyles[[...document.querySelectorAll('.cautionCheck')].indexOf(el)]||cautionStyles[0]}));
 const custom=(document.getElementById('customCaution').value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map(text=>({text,style:'#fffdf2|#e0a800'}));
 const all=[...selectedCautions,...custom];
 const box=document.getElementById('printedCautionBox'),list=document.getElementById('printedCautionList');
 list.innerHTML='';
 all.forEach(item=>{const [bg,border]=item.style.split('|');const div=document.createElement('div');div.style.cssText=`background:${bg};border-left:4px solid ${border};padding:5px 7px;border-radius:4px;white-space:pre-wrap`;div.textContent=item.text;list.appendChild(div)});
 if(custom.length){[...list.children].slice(selectedCautions.length).forEach(el=>el.style.gridColumn='1 / -1')}
 box.style.display=all.length?'block':'none';
}
document.querySelectorAll('.cautionCheck').forEach(el=>el.addEventListener('change',refreshCautions));
document.getElementById('customCaution').addEventListener('input',refreshCautions);
refreshCautions();

function renderMonths(){
 cals.innerHTML='';
 months.forEach(m=>{
  let f=new Date(m.getFullYear(),m.getMonth(),1).getDay();
  let last=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  let h=`<div class=cal><h3>${m.getFullYear()}년 ${m.getMonth()+1}월</h3><table><tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr><tr>`;
  for(let i=0;i<f;i++)h+="<td></td>";
  for(let d=1;d<=last;d++){
    let key=`${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls="pick";
    if(key===today)cls+=" today";
    if(selected.has(key))cls+=" sel";
    const list=events.filter(e=>e.date===key).slice(0,3);
    const labels=list.map(ev=>{
      let t=(ev.text||'').replace(/\(.+?\)/g,'').trim().slice(0,6);
      const clean=(ev.text||'').replace(/\(.+?\)/g,'').trim();
      const uniqueTexts=[...new Set(events.map(e=>(e.text||'').replace(/\(.+?\)/g,'').trim()).filter(Boolean))];
      const idx=((uniqueTexts.indexOf(clean)%15)+15)%15;
      return `<span class="ev txt${idx}">${t}</span>`;
    }).join('');
    h+=`<td class="${cls}" data-date="${key}"><div class="daynum">${d}</div>${labels}</td>`;
    if((f+d)%7==0)h+="</tr><tr>";
  }
  h+="</tr></table></div>"; cals.insertAdjacentHTML('beforeend',h);
 });
 bind();
}
let dragging=false;
function bind(){
 document.querySelectorAll('.pick').forEach(td=>{
  td.onmousedown=e=>{dragging=true;pick(td);e.preventDefault();};
  td.onmouseenter=()=>{if(dragging)pick(td);};
 });
 document.body.onmouseup=()=>dragging=false;
 document.querySelectorAll('.pick').forEach(td=>{
   const c=painted.get(td.dataset.date);
   td.style.background='';
   td.style.color='';
   if(c==='yellow') td.style.background='#f4b400';
   if(c==='green'){ td.style.background='#2f8f68'; td.style.color='#fff';}
   if(c==='red'){ td.style.background='#d9534f'; td.style.color='#fff';}
 });
}
function pick(td){
 const k=td.dataset.date;
 if(selected.has(k)){selected.delete(k);td.classList.remove('sel');}
 else{selected.add(k);td.classList.add('sel');}
 count.textContent=selected.size;
}
function refresh(){
 days.innerHTML='';
 const map=new Map();
 events.sort((a,b)=>a.date.localeCompare(b.date));
 events.forEach(e=>{
   if(!map.has(e.date)) map.set(e.date,[]);
   if(e.text && !map.get(e.date).includes(e.text)) map.get(e.date).push(e.text);
 });
 [...painted.keys()].sort().forEach(date=>{
   if(!map.has(date)) map.set(date,[]);
 });
 [...map.keys()].sort().forEach(date=>{
   const texts=map.get(date);
   let div=document.createElement('div');
   div.className='card';
   const c=painted.get(date);
   if(c==='yellow'){div.style.background='#f4b400';div.style.color='#111';}
   if(c==='green'){div.style.background='#2f8f68';div.style.color='#fff';}
   if(c==='red'){div.style.background='#d9534f';div.style.color='#fff';}
   div.innerHTML=`<b>${date.slice(5)}</b><div class=small>${texts.map(t=>'☐ '+t).join('<br>')}</div>`;
   days.appendChild(div);
 });
 list.innerHTML=events.map(e=>`• ${e.date} - ${e.text}`).join("<br>")||"아직 일정이 없습니다.";
}
let lastSelectedDates=new Set();
function clearSel(){selected.clear();count.textContent=0;renderMonths();}
function quickFill(id,text){
 const el=document.getElementById(id);
 if(!el)return;
 el.value=text;
 el.focus();
 el.setSelectionRange(el.value.length,el.value.length);
}

function selectToday(){
 selected.clear();
 selected.add(today);
 lastSelectedDates=new Set(selected);
 count.textContent=selected.size;
 renderMonths();
}

function addSelected(){
 if(selected.size===0){
   if(lastSelectedDates.size===0)return alert("날짜를 선택하세요.");
   lastSelectedDates.forEach(d=>events.push({date:d,text:specificText.value,color:'none'}));
   refresh();
   return;
 }
 if(!specificText.value){lastSelectedDates=new Set(selected);clearSel();return;}
 lastSelectedDates=new Set(selected);
 selected.forEach(d=>events.push({date:d,text:specificText.value,color:'none'}));
 clearSel();refresh();
}

function deleteSelected(){
  const targets=selected.size>0 ? selected : lastSelectedDates;
  if(targets.size===0) return alert("삭제할 날짜를 선택하세요.");

  targets.forEach(d=>{
    painted.delete(d); // 색 제거

    // 해당 날짜의 모든 일정 삭제
    for(let i=events.length-1;i>=0;i--){
      if(events[i].date===d){
        events.splice(i,1);
      }
    }
  });

  lastSelectedDates=new Set();
  clearSel();
  renderMonths();
  refresh();
}

function paintSelected(color){
  const targets=selected.size>0 ? selected : lastSelectedDates;
  if(targets.size===0) return alert("날짜를 선택하세요.");

  lastSelectedDates=new Set(targets);
  targets.forEach(d=>{
    if(painted.get(d)===color){
      painted.delete(d);      // 같은 색이면 투명(해제)
    }else{
      painted.set(d,color);   // 다른 색이면 적용
    }
  });

  clearSel();
  renderMonths();
  refresh();
}

function addDragged(){
 const dragTextEl=document.getElementById('dragText');
 if(!dragTextEl) return alert("연속 날짜 드래그 입력 기능은 현재 화면에서 사용하지 않습니다. 반복 일정을 이용해 주세요.");
 if(selected.size===0||!dragTextEl.value)return alert("드래그한 날짜와 내용을 입력하세요.");
 selected.forEach(d=>events.push({date:d,text:dragTextEl.value,color:'green'}));
 clearSel();refresh();
}
function addRepeat(){
 if(!repeatText.value)return alert("내용을 입력하세요.");
 let startDate=new Date(start.value);
 let d=new Date(startDate);
 let end=new Date(startDate);
 let step=parseInt(interval.value);
 let days=parseInt(endDate.value)||0;
 end.setDate(end.getDate()+days);
 d.setDate(d.getDate()+step);
 while(d<=end){
   events.push({date:d.toISOString().slice(0,10),text:repeatText.value,color:'none'});
   d.setDate(d.getDate()+step);
 }
 renderMonths();
 refresh();
}




function issueOutputId(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const date=now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate());
  const time=pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds());
  const suffix=Math.floor(Math.random()*9000)+1000;
  const id='23SI-'+date+'-'+time+'-'+suffix;
  const value=document.getElementById('outputIdValue');
  if(value) value.textContent=id;
  return id;
}

function printPreview(){
  issueOutputId();
  const node=document.querySelector('.preview');
  html2canvas(node,{
    backgroundColor:'#ffffff',
    scale:3,
    useCORS:true,
    logging:false,
    width:node.scrollWidth,
    height:node.scrollHeight,
    windowWidth:node.scrollWidth,
    windowHeight:node.scrollHeight,
    scrollX:0,
    scrollY:0
  }).then(canvas=>{
    const w=window.open('','_blank');
    w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>인쇄</title>
      <style>
        @page{size:A4 portrait;margin:8mm;}
        html,body{margin:0;padding:0;background:#fff;width:100%;}
        img{width:100%;max-width:194mm;height:auto;display:block;margin:0 auto;}
      </style></head><body></body></html>`);
    const img=w.document.createElement('img');
    img.src=canvas.toDataURL('image/png');
    w.document.body.appendChild(img);
    w.document.close();
    img.onload=()=>{w.focus();w.print();};
  });
}

function savePreviewImage(){
  issueOutputId();
  const pet=(document.getElementById('pet')?.value||'동물').trim()||'동물';
  const start=(document.getElementById('start')?.value||new Date().toISOString().slice(0,10));
  const fileName=`${pet}_${start}.png`;
  const preview=document.querySelector('.preview');
  html2canvas(preview,{scale:2,backgroundColor:'#ffffff'}).then(canvas=>{
    const a=document.createElement('a');
    a.download=fileName;
    a.href=canvas.toDataURL('image/png');
    a.click();
  });
}

function applyPromisePlan(){
 const choice=document.getElementById('promisePlan')?.value;
 if(!choice)return alert('약속처방을 선택해 주세요.');
 if(!start.value)return alert('시작일을 먼저 선택해 주세요.');
 const base=new Date(start.value+'T12:00:00');
 const dateAt=(offset)=>{const d=new Date(base);d.setDate(d.getDate()+offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
 if(choice==='sevenDay' || choice==='specialAnimal' || choice==='dermatitis' || choice==='conjunctivitis' || choice==='otitis' || choice==='arthritisPain' || choice==='specialAnimalDisinfection' || choice==='renalFailure' || choice==='liverLipid' || choice==='gastroenteritis' || choice==='postOpCare' || choice==='parrotFracture' || choice==='temporaryBandage' || choice==='catGeneralCare'){
   const template=choice;
   // 같은 약속처방을 다시 적용할 때 해당 템플릿 일정만 교체합니다.
   for(let i=events.length-1;i>=0;i--){if(events[i].template===template)events.splice(i,1);}
   if(choice==='sevenDay'){
     for(let day=0;day<7;day++){
       events.push({date:dateAt(day),text:'내복약(아침)',color:'none',template});
       events.push({date:dateAt(day),text:'내복약(저녁)',color:'none',template});
     }
     events.push({date:dateAt(2),text:'사진 촬영 후 병원에 전송',color:'none',template});
     events.push({date:dateAt(7),text:'병원 재내원',color:'none',template});
     const note='약속처방 안내: 7일간 매일 아침·저녁 내복약을 투여해 주세요. 3일째 환부 사진을 촬영해 병원에 보내주시고, 시작일로부터 7일 후 병원에 내원해 주세요.';
     memoInput.value=memoInput.value.trim()?memoInput.value.trim()+'\n'+note:note;
   } else if(choice==='specialAnimal'){
     for(let day=0;day<7;day++) events.push({date:dateAt(day),text:'물약(저녁)',color:'none',template});
     events.push({date:dateAt(2),text:'사진촬영',color:'none',template});
     events.push({date:dateAt(6),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(6),text:'추가처방예정(7일)',color:'none',template});
   } else if(choice==='specialAnimalDisinfection'){
     // 특수동물(소독): 7일간 저녁 물약과 소독, 지정일 사진촬영 및 8일째 내원
     for(let day=0;day<7;day++){
       events.push({date:dateAt(day),text:'물약(저녁)',color:'none',template});
       events.push({date:dateAt(day),text:'소독(1회)',color:'none',template});
     }
     [2,5,8,14,29].forEach(day=>events.push({date:dateAt(day),text:'사진촬영',color:'none',template}));
     events.push({date:dateAt(7),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(7),text:'내복약 추가처방예정',color:'none',template});
   } else if(choice==='liverLipid'){
     // 간/고지혈증: 당일부터 15일째까지 저녁 내복약, 15일째 추가처방 및 장기 혈액검사
     for(let day=0;day<15;day++) events.push({date:dateAt(day),text:'내복약(저녁)',color:'none',template});
     events.push({date:dateAt(14),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(14),text:'내복약 추가처방예정',color:'none',template});
     [14,29,89,179,269].forEach(day=>events.push({date:dateAt(day),text:'혈액검사',color:'none',template}));
   } else if(choice==='parrotFracture'){
     // 앵무새 골절: 15일 저녁 물약, 2일 간격 칼슘제 30일, 사진촬영 및 내원 추적
     for(let day=0;day<15;day++) events.push({date:dateAt(day),text:'물약(저녁)',color:'none',template});
     for(let day=1;day<30;day+=2) events.push({date:dateAt(day),text:'물약(칼슘제)',color:'none',template});
     events.push({date:dateAt(1),text:'사진촬영',color:'none',template});

       events.push({date:dateAt(day),text:'병원내원',color:'yellow',template});
       events.push({date:dateAt(day),text:'혈액검사',color:'none',template});
     });
   } else if(choice==='renalFailure'){

     for(let day=2;day<15;day++) events.push({date:dateAt(day),text:'피하수액(집)',color:'none',template});

     events.push({date:dateAt(14),text:'병원내원',color:'yellow',template});
   } else if(choice==='dermatitis'){
     // 피부염: 7일 집중관리, 이후 3개월간 추적관리
     // 당일은 저녁 처치 2항목만, 2일째부터 7일째 전까지 아침·저녁 관리
     events.push({date:dateAt(0),text:'내복약(저녁)',color:'none',template});
     events.push({date:dateAt(0),text:'소독, 연고(저녁)',color:'none',template});
     for(let day=1;day<7;day++){
       events.push({date:dateAt(day),text:'내복약(아침)',color:'none',template});
       events.push({date:dateAt(day),text:'내복약(저녁)',color:'none',template});
       events.push({date:dateAt(day),text:'소독, 연고(하루 2회)',color:'none',template});
     }
     events.push({date:dateAt(2),text:'사진촬영',color:'none',template});
     events.push({date:dateAt(6),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(20),text:'처방식 사료 유지',color:'none',template});
     for(let day=14;day<=89;day+=15) events.push({date:dateAt(day),text:'사진촬영',color:'none',template});
     for(let day=29;day<=89;day+=30) events.push({date:dateAt(day),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(27),text:'혈액검사(간,신장)',color:'none',template});
   } else if(choice==='conjunctivitis'){
     // 결막염: 당일 저녁 1회 투약, 이후 7일 관리 및 지정일 촬영·내원
     events.push({date:dateAt(0),text:'내복약(저녁)',color:'none',template});
     events.push({date:dateAt(0),text:'안약 세트(1회)',color:'none',template});
     for(let day=1;day<7;day++){
       events.push({date:dateAt(day),text:'내복약(아침)',color:'none',template});
       events.push({date:dateAt(day),text:'내복약(저녁)',color:'none',template});
       events.push({date:dateAt(day),text:'안약 세트(4회)',color:'none',template});
     }
     // 8~15일째 안약 세트 아침·저녁, 15~21일째 아침만
     for(let day=7;day<=14;day++){
       events.push({date:dateAt(day),text:'안약 세트(아침,저녁)',color:'none',template});
     }
     for(let day=14;day<=20;day++){
       if(day!==14) events.push({date:dateAt(day),text:'안약 세트(아침)',color:'none',template});
     }
     events.push({date:dateAt(1),text:'사진촬영',color:'none',template});
     [9,19,29].forEach(day=>events.push({date:dateAt(day),text:'사진촬영',color:'none',template}));
     events.push({date:dateAt(2),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(7),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(7),text:'내복약 추가처방예정',color:'none',template});
     events.push({date:dateAt(14),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(29),text:'병원내원',color:'yellow',template});
   } else if(choice==='arthritisPain'){
     // 관절염/진통: 당일 저녁, 첫 7일 아침·저녁, 이후 15일째까지 저녁 복약
     events.push({date:dateAt(0),text:'내복약(저녁)',color:'none',template});
     for(let day=1;day<7;day++){
       events.push({date:dateAt(day),text:'내복약(아침)',color:'none',template});
       events.push({date:dateAt(day),text:'내복약(저녁)',color:'none',template});
     }
     for(let day=7;day<15;day++) events.push({date:dateAt(day),text:'내복약(저녁)',color:'none',template});
     [4,11,18,24].forEach(day=>events.push({date:dateAt(day),text:'사진촬영',color:'none',template}));
     [6,14,29].forEach(day=>events.push({date:dateAt(day),text:'병원내원',color:'yellow',template}));
     events.push({date:dateAt(14),text:'내복약 추가예정',color:'none',template});
     events.push({date:dateAt(27),text:'혈액검사(간,신장)',color:'none',template});
   } else if(choice==='otitis'){
     // 외이염: 첫 7일 내복약·귀연고, 이후 귀연고 간격을 늘리고 추적 촬영·내원
     events.push({date:dateAt(0),text:'내복약(저녁)',color:'none',template});
     events.push({date:dateAt(0),text:'귀연고 투약(1회)',color:'none',template});
     for(let day=1;day<7;day++){
       events.push({date:dateAt(day),text:'내복약(아침)',color:'none',template});
       events.push({date:dateAt(day),text:'내복약(저녁)',color:'none',template});
       events.push({date:dateAt(day),text:'귀연고 투약(1회)',color:'none',template});
     }
     // 8~15일째 매일 1회
     for(let day=7;day<=14;day++) events.push({date:dateAt(day),text:'귀연고 투약(1회)',color:'none',template});
     // 15~30일째 2일에 1회 (15, 17, ... 29일째)
     for(let day=14;day<=28;day+=2) events.push({date:dateAt(day),text:'귀연고 투약',color:'none',template});
     // 30~60일째 4일에 1회 (30, 34, ... 58일째)
     for(let day=29;day<=57;day+=4) events.push({date:dateAt(day),text:'귀연고 투약',color:'none',template});
     [12,25,38,56].forEach(day=>events.push({date:dateAt(day),text:'사진촬영',color:'none',template}));
     [14,29,44,59].forEach(day=>events.push({date:dateAt(day),text:'병원내원',color:'yellow',template}));
     events.push({date:dateAt(2),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(7),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(7),text:'내복약 추가처방예정',color:'none',template});
     events.push({date:dateAt(27),text:'혈액검사(간,신장)',color:'none',template});
   }
   pmemo.textContent=memoInput.value;
   renderMonths();refresh();
   alert('약속처방 일정이 추가되었습니다. 약 종류와 용량은 환자별로 직접 입력해 주세요.');
 }
}

renderMonths();refresh();
// iframe이 차단되는 환경에서는 새 창 링크를 이용할 수 있도록 안내 표시
setTimeout(()=>{const f=document.getElementById('counterFrame');const note=document.getElementById('counterFallback');if(f&&!f.contentWindow){note.hidden=false;}},4000);
</script>
