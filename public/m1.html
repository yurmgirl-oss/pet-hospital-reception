<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>23시 케어플랜 V17.5</title>
<style>
/* ==================== 1. 기본 스타일 및 복약관리 원본 스타일 ==================== */
body{margin:0;background:#eef3ef;font-family:"Malgun Gothic",sans-serif;font-size:13px}
label{font-size:11px;font-weight:bold;color:#345}
input,select{width:100%;padding:6px 8px;border:1px solid #b8c8be;border-radius:6px;box-sizing:border-box;font-size:12px}
button{padding:8px 12px;border:none;border-radius:6px;background:#2f8f68;color:#fff;font-weight:bold;cursor:pointer;font-size:11px}
button.yellow{background:#f4b400;color:#111}

/* 달력 테이블 */
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #e2ece5;height:22px;text-align:center;font-size:10px}
td.pick{cursor:pointer;user-select:none;vertical-align:top;padding:2px;height:48px}
.daynum{font-size:10px;font-weight:bold}
.ev{display:block;margin-top:1px;padding:1px 2px;border-radius:3px;font-size:8px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.txt0{background:#ececec;color:#444}
.ev.txt1{background:#d6ecff;color:#124b7a}
.ev.txt2{background:#d8f3dc;color:#1b6b3a}
.ev.txt3{background:#ffe6cc;color:#8a4b08}
.ev.txt4{background:#eadcff;color:#5b2d86}
.ev.txt5{background:#d9fff3;color:#11695a}
.ev.txt6{background:#ffe0ec;color:#8c1f50}
.ev.txt7{background:#fff3bf;color:#6b5200}
.ev.txt8{background:#e3f2fd;color:#0d47a1}
.ev.txt9{background:#f3e5f5;color:#6a1b9a}
.ev.txt10{background:#e8f5e9;color:#1b5e20}
.ev.txt11{background:#fff8e1;color:#795548}
.ev.txt12{background:#fce4ec;color:#ad1457}
.ev.txt13{background:#e0f7fa;color:#006064}
.ev.txt14{background:#ede7f6;color:#4527a0}
td.today{background:#2f8f68;color:#fff;font-weight:bold}
td.sel{background:#1b5e20;color:#fff}

.quickItems{display:flex;flex-wrap:nowrap;gap:3px;align-items:center;margin:4px 0;overflow-x:auto}
.quickItem{padding:3px 5px !important;border:1px solid #b9cdbd !important;border-radius:4px !important;background:#f4f8f5 !important;color:#234 !important;font-size:9px !important;font-weight:bold !important;white-space:nowrap;line-height:1.1}
.quickItem:hover{background:#e2f0e6 !important}
.small{font-size:10px}

/* ==================== 2. 원본 3분할(4:3:3) 통합 쉘 레이아웃 완벽 복원 ==================== */
html,body{width:100%;height:100%;overflow:hidden}
#integratedShell{
  display:grid;
  grid-template-columns:minmax(0,4fr) minmax(0,3fr) minmax(0,3fr);
  gap:8px;
  padding:8px;
  width:100vw;
  height:100vh;
  box-sizing:border-box;
  background:#eef3ef;
}

/* 좌측 1번 컬럼: 접수 현황판 */
#counterPanel{
  grid-column:1;
  grid-row:1;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#fff;
  border:1px solid #dce6ee;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.05);
}
#counterHeader{
  height:40px;
  flex:0 0 40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:0 10px;
  border-bottom:1px solid #e5eaf0;
  font-size:13px;
}
#counterHeader a{font-size:11px;color:#1769aa;text-decoration:none;white-space:nowrap}
#counterFrame{border:0;width:100%;height:100%;flex:1;min-height:0;background:#f7f9fc}

/* 우측 2~3번 컬럼 (기본: 복약관리 시스템 2패널) */
#medicationPanel{
  grid-column:2 / 4;
  grid-row:1;
  min-width:0;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:8px;
}
#medicationPanel .panel{
  min-width:0;
  padding:10px;
  height:calc(100vh - 16px);
  box-sizing:border-box;
  border-radius:12px;
  background:#fff;
  overflow:auto;
  box-shadow:0 2px 6px rgba(0,0,0,.05);
}
#medicationPanel h2{font-size:15px;margin:0 0 8px}
#medicationPanel h3{font-size:12px;margin:8px 0 4px}
#medicationPanel .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#medicationPanel .toolbar{border:1px solid #c7d8cc;border-radius:8px;padding:6px;margin-top:6px}
#medicationPanel .section{margin-top:10px}
#medicationPanel .calendarWrap{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
#medicationPanel .row{display:grid;grid-template-columns:minmax(50px,.65fr) minmax(50px,.8fr) minmax(80px,1.4fr) 44px;gap:6px;align-items:end}
#medicationPanel .cautionOptions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 6px}
#medicationPanel .cautionOptions label{display:flex;align-items:center;gap:4px;min-height:20px;font-size:11px}
#medicationPanel .cautionOptions input[type="checkbox"]{width:14px;height:14px;margin:0;accent-color:#2f8f68}

/* 프리뷰 영역 */
.preview{background:#fff;border:1px solid #b9cdbd;border-radius:12px;padding:4mm;width:100%;box-sizing:border-box;margin:0 auto}
.banner{background:linear-gradient(135deg,#4f8f6b,#74b08a);color:#fff;border-radius:10px;padding:6px}
.dayGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:8px}
.card{border:1px solid #b9cdbd;border-radius:6px;padding:4px;min-height:48px}
.notice{margin-top:8px;border:1px solid #b9cdbd;border-radius:8px;padding:6px;min-height:40px}

/* ==================== 3. 2화면 전환 (집중챠트 모드) ==================== */
#chronicPanel{
  grid-row:1;
  min-width:0;
  min-height:0;
  height:calc(100vh - 16px);
  background:#fff;
  border:1px solid #dce6ee;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.05);
}
#integratedShell[data-layout="medication"] #chronicPanel{display:none !important}
#integratedShell[data-layout="medication"] #medicationPanel{display:grid !important}

#integratedShell[data-layout="focus"]{
  grid-template-columns:minmax(0,4fr) minmax(0,6fr) !important;
}
#integratedShell[data-layout="focus"] #counterPanel{grid-column:1;grid-row:1}
#integratedShell[data-layout="focus"] #chronicPanel{display:block !important;grid-column:2;grid-row:1}
#integratedShell[data-layout="focus"] #medicationPanel{display:none !important}

#integratedShell[data-layout="focus-expanded"]{
  grid-template-columns:minmax(0,1fr) !important;
  gap:0 !important;
  padding:0 !important;
}
#integratedShell[data-layout="focus-expanded"] #counterPanel{display:none !important}
#integratedShell[data-layout="focus-expanded"] #medicationPanel{display:none !important}
#integratedShell[data-layout="focus-expanded"] #chronicPanel{
  display:block !important;
  grid-column:1 !important;
  width:100vw !important;
  height:100vh !important;
  border:0 !important;
  border-radius:0 !important;
}
#integratedShell[data-layout="focus-expanded"] #chronicFrame{width:100% !important;height:100% !important}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

<!-- 펼쳐보기 모드용 플로팅 컨트롤 바 -->
<div id="expandedGlobalControls" style="display:none;position:fixed;top:8px;right:12px;z-index:999999;gap:6px;align-items:center;">
  <button type="button" id="globalInitialScreenBtn" style="padding:6px 10px;background:#059669;color:#fff;border:0;border-radius:6px;font-weight:bold;cursor:pointer">🏠 현황+복약</button>
  <button type="button" id="globalRefreshChartBtn" style="padding:6px 10px;background:#334155;color:#fff;border:0;border-radius:6px;font-weight:bold;cursor:pointer">🔄 현황+챠트</button>

<script>
// ==================== 복약관리 달력 / 프리뷰 스크립트 ====================
const t=new Date();
const today=t.toISOString().slice(0,10);
start.value=today;
endDate.value=30;
const months=[0,1].map(i=>new Date(t.getFullYear(),t.getMonth()+i,1));
const selected=new Set(), events=[];
const painted=new Map();

function sync(){ppet.textContent=pet.value||'—';pdisease.textContent=disease.value||'—';pstart.textContent=start.value}
pet.oninput=disease.oninput=start.oninput=sync;sync();
memoInput.oninput=()=>{pmemo.textContent=memoInput.value;};

function refreshCautions(){
  const checked=[...document.querySelectorAll('.cautionCheck:checked')];
  const box=document.getElementById('printedCautionBox');
  const list=document.getElementById('printedCautionList');
  list.innerHTML='';
  checked.forEach(el=>{
    const div=document.createElement('div');
    div.textContent='• '+el.value;
    list.appendChild(div);
  });
  box.style.display=checked.length?'block':'none';
}
document.querySelectorAll('.cautionCheck').forEach(el=>el.addEventListener('change',refreshCautions));

function renderMonths(){
  cals.innerHTML='';
  months.forEach(m=>{
    let f=new Date(m.getFullYear(),m.getMonth(),1).getDay();
    let last=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
    let h=`<div class=cal><h3>${m.getFullYear()}년 ${m.getMonth()+1}월</h3><table><tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr><tr>`;
    for(let i=0;i<f;i++)h+="<td></td>";
    for(let d=1;d<=last;d++){
      let key=`${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      let cls="pick";
      if(key===today)cls+=" today";
      if(selected.has(key))cls+=" sel";
      const list=events.filter(e=>e.date===key).slice(0,2);
      const labels=list.map(ev=>`<span class="ev txt1">${(ev.text||'').slice(0,5)}</span>`).join('');
      h+=`<td class="${cls}" data-date="${key}"><div class="daynum">${d}</div>${labels}</td>`;
      if((f+d)%7==0)h+="</tr><tr>";
    }
    h+="</tr></table></div>";
    cals.insertAdjacentHTML('beforeend',h);
  });
  bind();
}

function bind(){
  document.querySelectorAll('.pick').forEach(td=>{
    td.onclick=()=>{
      const k=td.dataset.date;
      if(selected.has(k)){selected.delete(k);td.classList.remove('sel');}
      else{selected.add(k);td.classList.add('sel');}
      count.textContent=selected.size;
    };
  });
}

function refresh(){
  days.innerHTML='';
  const map=new Map();
  events.sort((a,b)=>a.date.localeCompare(b.date));
  events.forEach(e=>{
    if(!map.has(e.date)) map.set(e.date,[]);
    if(e.text && !map.get(e.date).includes(e.text)) map.get(e.date).push(e.text);
  });
  [...map.keys()].sort().forEach(date=>{
    const texts=map.get(date);
    let div=document.createElement('div');
    div.className='card';
    div.innerHTML=`<b>${date.slice(5)}</b><div class=small>${texts.map(t=>'☐ '+t).join('<br>')}</div>`;

  let step=parseInt(interval.value), dLimit=parseInt(endDate.value)||0;
  end.setDate(end.getDate()+dLimit);

    d.setDate(d.getDate()+step);
  }
  renderMonths(); refresh();
}

    const RISK_CONFIG = {

    function updateStats() {
      document.getElementById("statActiveCount").textContent = dogs.filter(d => d.category === "active").length;
      document.getElementById("statChronicCount").textContent = dogs.filter(d => d.category === "chronic").length;

      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return \`\${d.getFullYear()}-\${pad(d.getMonth()+1)}-\${pad(d.getDate())} \${pad(d.getHours())}:\${pad(d.getMinutes())}\`;
    }
    function getTodayString() { return new Date().toISOString().slice(0, 10); }

    function toggleDogCard(id) {
      const dog = dogs.find(d => d.id === id);
      if(dog) { dog.isExpanded = !dog.isExpanded; saveState(); renderAll(); }
    }

    function toggleAllCards(category, expand) {
      dogs.filter(d => d.category === category).forEach(d => d.isExpanded = expand);
      saveState(); renderAll();
    }

    function handleSortChange(cat, val) {
      if(cat === 'active') activeSortMode = val;
      else chronicSortMode = val;
      renderAll();
    }

    function sortList(list, mode) {
      return [...list].sort((a, b) => {
        const oA = (RISK_CONFIG[a.risk] || { order: 99 }).order;
        const oB = (RISK_CONFIG[b.risk] || { order: 99 }).order;
        const tA = (a.dones && a.dones.length) ? a.dones[a.dones.length - 1].doneAt : "";
        const tB = (b.dones && b.dones.length) ? b.dones[b.dones.length - 1].doneAt : "";
        if(mode === "risk_asc") return oA !== oB ? oA - oB : b.name.localeCompare(a.name, 'ko');
        if(mode === "latest_desc") return tB.localeCompare(tA);
        return a.name.localeCompare(b.name, 'ko');
      });
    }

      updateStats();
      renderFrame("active", "activeDogCardList", activeSortMode);
      renderFrame("chronic", "chronicDogCardList", chronicSortMode);

        list = list.filter(d => 
          (d.name && d.name.toLowerCase().includes(searchQuery)) ||
          (d.guardian && d.guardian.toLowerCase().includes(searchQuery)) ||
          (d.phone && d.phone.includes(searchQuery)) ||
          (d.diagnosis && d.diagnosis.toLowerCase().includes(searchQuery))
        );

                <span class="text-[10px] font-bold text-violet-700 bg-violet-50 px-1 py-0.2 rounded">\${dog.gender || '성별-'}</span>
                <span class="text-[10px] font-semibold text-slate-600 bg-slate-100 px-1 py-0.2 rounded">\${dog.age || '나이-'}</span>
                <span class="text-[10px] font-bold text-rose-700 bg-rose-50 px-1 py-0.2 rounded">\${dog.weight || '체중-'}</span>
                <span class="text-[10px] font-mono text-slate-500">\${dog.phone || ''}</span>
                <span class="text-[10px] text-amber-900 bg-amber-50 px-1.5 py-0.2 rounded truncate max-w-[160px]" title="\${dog.diagnosis}">\${dog.diagnosis}</span>
              </div>

              <!-- 우측 수정/카운트/아코디언 -->
              <div class="flex items-center gap-1 shrink-0">
                <button type="button" onclick="event.stopPropagation(); openEditDogModal('\${dog.id}')" class="px-1.5 py-0.5 bg-slate-200 hover:bg-indigo-100 text-slate-700 hover:text-indigo-700 rounded text-[10px] font-bold" title="인적사항 수정">
                  ✏️수정
                </button>
                <span class="text-[9px] font-bold bg-amber-50 text-amber-800 px-1 py-0.2 rounded border border-amber-200">할일 \${todos.length}</span>
                <span class="text-[9px] font-bold bg-emerald-50 text-emerald-800 px-1 py-0.2 rounded border border-emerald-200">완료 \${dones.length}</span>
                <button onclick="event.stopPropagation(); deleteDog('\${dog.id}', '\${dog.name}')" class="text-slate-300 hover:text-red-500 p-0.5" title="삭제"><i class="fa-solid fa-trash-can text-[10px]"></i></button>
                <i class="fa-solid \${dog.isExpanded ? 'fa-chevron-up' : 'fa-chevron-down'} text-[10px] text-slate-400"></i>
              </div>
            </div>

            <!-- 2. 펼침 영역 : 불필요한 입력칸 없이 [할 일(달력포함)]과 [한 일(시간누적)]에만 100% 집중 -->
            \${dog.isExpanded ? \`
              <div class="p-2.5 bg-white border-t border-slate-200 space-y-2">
                
                <!-- 액션 툴바 -->
                <div class="flex justify-between items-center text-[10px] pb-1 border-b border-slate-100">
                  <span class="text-slate-400 font-mono">등록일: \${dog.registeredAt || '-'}</span>
                  <div class="flex items-center gap-1.5">
                    <button type="button" onclick="saveDogChartText('\${dog.id}')" class="px-2 py-0.5 bg-slate-700 hover:bg-slate-800 text-white rounded text-[10px] font-bold">
                      <i class="fa-solid fa-file-arrow-down mr-1"></i>챠트기록 저장
                    </button>
                    \${category === 'active' ? \`
                      <button type="button" onclick="transferCategory('\${dog.id}', 'chronic')" class="px-2 py-0.5 bg-teal-600 text-white font-bold text-[10px] rounded">🟢 만성이관</button>
                    \` : \`
                      <button type="button" onclick="transferCategory('\${dog.id}', 'active')" class="px-2 py-0.5 bg-rose-600 text-white font-bold text-[10px] rounded">🔴 집중복귀</button>
                    \`}
                  </div>
                </div>

                <!-- 2열 그리드 : 할 일 스케줄 vs 한 일 시간누적 기록 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                  
                  <!-- 좌측 : 할 일 (스케줄 달력 + 내용 입력) -->
                  <div class="bg-amber-50/50 rounded-lg p-2 border border-amber-200 flex flex-col">
                    <div class="flex justify-between items-center mb-1 text-[11px] font-bold text-amber-950">
                      <span><i class="fa-solid fa-calendar-days text-amber-600 mr-1"></i>할 일 (스케줄)</span>
                      <span class="text-[9px] text-amber-700">체크 시 즉시 '한 일'로 이동</span>
                    </div>

                    <!-- 달력(input date) 완벽 복원 -->
                    <div class="flex gap-1 mb-1.5">
                      <input type="date" id="todoDate_\${dog.id}" value="\${getTodayString()}" class="bg-white border rounded px-1.5 py-0.5 text-xs font-mono shrink-0">
                      <input type="text" id="todoInput_\${dog.id}" placeholder="할 일 내용 입력 후 엔터" class="flex-1 bg-white border rounded px-2 py-0.5 text-xs" onkeydown="if(event.key==='Enter') addTodoItem('\${dog.id}')">
                      <button type="button" onclick="addTodoItem('\${dog.id}')" class="px-2.5 py-0.5 bg-amber-600 text-white text-xs font-bold rounded shrink-0">등록</button>
                    </div>

                    <div class="space-y-1 max-h-48 overflow-y-auto pr-0.5">
                      \${!todos.length ? '<div class="text-[10px] text-slate-400 text-center py-4">등록된 할 일이 없습니다.</div>' : todos.map(t => \`
                        <div class="flex items-center justify-between p-1 bg-white rounded border border-slate-200 text-xs">
                          <label class="flex items-center gap-1.5 truncate flex-1 cursor-pointer">
                            <input type="checkbox" onchange="completeTodoItem('\${dog.id}', '\${t.id}')" class="w-3.5 h-3.5 text-emerald-600 rounded">
                            <span class="text-[9px] font-bold font-mono text-amber-800 bg-amber-100 px-1 py-0.2 rounded shrink-0">\${t.date ? t.date.slice(5) : '일정'}</span>
                            <span class="truncate">\${t.text}</span>
                          </label>
                          <button type="button" onclick="removeTodoItem('\${dog.id}', '\${t.id}')" class="text-slate-300 hover:text-red-500 px-1">&times;</button>
                        </div>
                      \`).join('')}
                    </div>
                  </div>

                  <!-- 우측 : 한 일 (스케줄 완료 vs 수동직접입력 구분 + 시간 자동기록) -->
                  <div class="bg-emerald-50/50 rounded-lg p-2 border border-emerald-200 flex flex-col">
                    <div class="flex justify-between items-center mb-1 text-[11px] font-bold text-emerald-950">
                      <span><i class="fa-solid fa-clock-rotate-left text-emerald-600 mr-1"></i>한 일 (시간대별 누적)</span>
                      <span class="text-[9px] text-emerald-700">클릭 시 자동복사</span>
                    </div>

                    <!-- 수동 직접 입력줄 -->
                    <div class="flex gap-1 mb-1.5">
                      <input type="text" id="directDoneInput_\${dog.id}" placeholder="현장 수동 직접입력 (현재시간 자동기록)" class="flex-1 bg-white border border-emerald-300 rounded px-2 py-0.5 text-xs" onkeydown="if(event.key==='Enter') addDirectDone('\${dog.id}')">
                      <button type="button" onclick="addDirectDone('\${dog.id}')" class="px-2.5 py-0.5 bg-emerald-600 text-white text-xs font-bold rounded shrink-0">기록</button>
                    </div>

                    <div class="space-y-1 max-h-48 overflow-y-auto pr-0.5">
                      \${!dones.length ? '<div class="text-[10px] text-slate-400 text-center py-4">완료 기록이 없습니다.</div>' : [...dones].reverse().map(d => \`
                        <div class="copyable-row flex items-center justify-between p-1 bg-white rounded border border-emerald-100 text-xs cursor-pointer select-none" onclick="copyDoneText('\${d.text}', '\${d.doneAt}')" title="클릭 시 시간과 내용이 복사됩니다">
                          <div class="flex items-center gap-1 min-w-0 flex-1 truncate">
                            \${d.source === 'schedule' ? \`
                              <span class="px-1 py-0.2 rounded bg-blue-50 text-blue-700 border border-blue-200 text-[8px] font-bold shrink-0">스케줄</span>
                            \` : \`
                              <span class="px-1 py-0.2 rounded bg-amber-50 text-amber-700 border border-amber-200 text-[8px] font-bold shrink-0">수동</span>
                            \`}
                            <span class="truncate font-medium text-slate-800">\${d.text}</span>
                          </div>
                          <div class="flex items-center gap-1 shrink-0">
                            <span class="text-[9px] text-emerald-800 bg-emerald-100 px-1 py-0.2 rounded font-mono font-bold">\${d.doneAt}</span>
                            <button type="button" onclick="event.stopPropagation(); removeDoneItem('\${dog.id}', '\${d.id}')" class="text-slate-300 hover:text-red-500 px-1">&times;</button>
                          </div>
                        </div>
                      \`).join('')}
                    </div>
                  </div>

                </div>

              </div>
            \` : ''}
          </div>
        \`;
      }).join('');
    }

    // 할 일 추가 (달력 날짜 반영)
    function addTodoItem(dogId) {
      const input = document.getElementById(\`todoInput_\${dogId}\`);
      const dateInput = document.getElementById(\`todoDate_\${dogId}\`);
      const text = input ? input.value.trim() : '';
      const date = dateInput ? dateInput.value : getTodayString();
      if(!text) return;
      const dog = dogs.find(d => d.id === dogId);
      if(dog) {
        if(!dog.todos) dog.todos = [];
        dog.todos.push({ id: "t_" + Date.now(), text, date });
        saveState(); renderAll(); showToast("할 일 추가 완료");
      }
    }

    // 수동 직접입력 (source = 'manual')
    function addDirectDone(dogId) {
      const input = document.getElementById(\`directDoneInput_\${dogId}\`);
      const text = input ? input.value.trim() : '';
      if(!text) return;
      const dog = dogs.find(d => d.id === dogId);
      if(dog) {
        if(!dog.dones) dog.dones = [];
        dog.dones.push({ id: "d_" + Date.now(), text, doneAt: getNowString(), source: "manual" });
        saveState(); renderAll(); showToast("한 일 수동 기록 완료");
      }
    }

    // 할 일 체크 시 한 일로 이동 (source = 'schedule')
    function completeTodoItem(dogId, todoId) {
      const dog = dogs.find(d => d.id === dogId);
      if(!dog) return;
      const idx = (dog.todos || []).findIndex(t => t.id === todoId);
      if(idx !== -1) {
        const item = dog.todos.splice(idx, 1)[0];
        if(!dog.dones) dog.dones = [];
        dog.dones.push({ id: "d_" + Date.now(), text: item.text, doneAt: getNowString(), source: "schedule" });
        saveState(); renderAll(); showToast("완료되어 '한 일'로 이동되었습니다.");
      }
    }

    function removeTodoItem(dogId, todoId) {
      const dog = dogs.find(d => d.id === dogId);
      if(dog) { dog.todos = (dog.todos || []).filter(t => t.id !== todoId); saveState(); renderAll(); }
    }

    function removeDoneItem(dogId, doneId) {
      const dog = dogs.find(d => d.id === dogId);
      if(dog) { dog.dones = (dog.dones || []).filter(d => d.id !== doneId); saveState(); renderAll(); }
    }

    function copyDoneText(text, doneAt) {
      navigator.clipboard.writeText(\`[\${doneAt}] \${text}\`).then(() => showToast("시간과 내용이 복사되었습니다."));
    }

    function saveDogChartText(dogId) {
      const dog = dogs.find(d => d.id === dogId);
      if(!dog) return;
      const lines = [
        "23시 하단오거리동물병원 - 집중관리 챠트",
        "========================================",
        \`환자명: \${dog.name}\`,
        \`보호자: \${dog.guardian || '-'}\`,
        \`연락처: \${dog.phone || '-'}\`,
        \`체중: \${dog.weight || '-'}\`,
        \`성별: \${dog.gender || '-'}\`,
        \`나이: \${dog.age || '-'}\`,
        \`내원사유/진단: \${dog.diagnosis || '-'}\`,
        \`구분: \${dog.category === 'active' ? '집중관리' : '만성관리'}\`,
        "",
        "[완료 기록 (한 일)]",
        "----------------------------------------"
      ];
      const records = dog.dones || [];
      if(!records.length) lines.push("기록된 내용이 없습니다.");
      else records.forEach((r, i) => lines.push(\`\${i+1}. [\${r.doneAt}] [\${r.source === 'schedule' ? '스케줄' : '수동'}] \${r.text}\`));
      lines.push("", \`저장일시: \${getNowString()}\`);

      const blob = new Blob(["\\uFEFF" + lines.join("\\r\\n")], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = \`챠트_\${dog.name}_\${getTodayString()}.txt\`;
      a.click();
      showToast("챠트 텍스트 파일 저장 완료");
    }

    function transferCategory(id, target) {
      const dog = dogs.find(d => d.id === id);
      if(dog) {
        dog.category = target;
        saveState(); renderAll();
        showToast(\`'\${dog.name}' 환자가 \${target==='chronic'?'만성':'집중'}관리로 이동되었습니다.\`);
      }
    }

    function deleteDog(id, name) {
      if(!confirm(\`'\${name}' 환자 챠트를 삭제하시겠습니까?\`)) return;
      dogs = dogs.filter(d => d.id !== id);
      saveState(); renderAll();
      showToast(\`'\${name}' 삭제 완료\`);
    }

    // 모달 등록 및 수정 열기
    function openDogModal(cat = "active") {
      document.getElementById("editDogId").value = "";
      document.getElementById("inputTargetCategory").value = cat;
      document.getElementById("modalTitle").innerHTML = '<i class="fa-solid fa-paw"></i> 환자 신규 등록';
      document.getElementById("dogForm").reset();
      document.getElementById("dogModal").classList.remove("hidden");
    }

    function openEditDogModal(id) {
      const dog = dogs.find(d => d.id === id);
      if(!dog) return;
      document.getElementById("editDogId").value = dog.id;
      document.getElementById("inputTargetCategory").value = dog.category;
      document.getElementById("modalTitle").innerHTML = '<i class="fa-solid fa-pen-to-square"></i> 환자 인적사항 수정';
      
      document.getElementById("inputDogName").value = dog.name || "";
      document.getElementById("inputGuardian").value = dog.guardian || "";
      document.getElementById("inputDogWeight").value = dog.weight || "";
      document.getElementById("inputDogPhone").value = dog.phone || "";
      document.getElementById("inputDogGender").value = dog.gender || "";
      document.getElementById("inputDogAge").value = dog.age || "";
      document.getElementById("inputDogDiagnosis").value = dog.diagnosis || "";
      document.getElementById("inputRiskLevel").value = dog.risk || "G";

      document.getElementById("dogModal").classList.remove("hidden");
    }

    function closeDogModal() {
      document.getElementById("dogModal").classList.add("hidden");
      document.getElementById("dogForm").reset();
    }

    function handleDogFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById("editDogId").value;
      const name = document.getElementById("inputDogName").value.trim();
      const guardian = document.getElementById("inputGuardian").value.trim();
      const weight = document.getElementById("inputDogWeight").value.trim();
      const phone = document.getElementById("inputDogPhone").value.trim();
      const gender = document.getElementById("inputDogGender").value.trim();
      const age = document.getElementById("inputDogAge").value.trim();
      const diagnosis = document.getElementById("inputDogDiagnosis").value.trim();
      const risk = document.getElementById("inputRiskLevel").value;
      const category = document.getElementById("inputTargetCategory").value;

      if(editId) {
        // 기존 환자 수정
        const dog = dogs.find(d => d.id === editId);
        if(dog) {
          dog.name = name; dog.guardian = guardian; dog.weight = weight;
          dog.phone = phone; dog.gender = gender; dog.age = age;
          dog.diagnosis = diagnosis; dog.risk = risk;
        }
        showToast(\`'\${name}' 환자 정보가 수정되었습니다.\`);
      } else {
        // 신규 등록
        const newDog = {
          id: "dog_" + Date.now(),
          name, guardian, weight, phone, gender, age, diagnosis, risk,
          category,
          isExpanded: true,
          todos: [],
          dones: [{ id: "d_" + Date.now(), text: "신규 등록", doneAt: getNowString(), source: "manual" }],
          registeredAt: getNowString()
        };
        dogs.unshift(newDog);
        showToast(\`'\${name}' 환자 등록 완료!\`);
      }

      saveState(); renderAll(); closeDogModal();
    }

    // 접수 현황판에서 전송 수신
    window.addEventListener("message", (e) => {
      if(e.data && e.data.type === "RECEIVE_TRANSFER_TO_CHART") {
        const item = e.data.payload;
        const targetCategory = e.data.targetCategory || 'active';
        
        const newDog = {
          id: "dog_" + Date.now(),
          name: item.petName || '이름미상',
          guardian: item.guardian || '보호자미상',
          weight: item.weight || '체중미기재',
          phone: item.phone || '연락처미상',
          gender: item.gender || '미상',
          age: item.age || '나이미상',
          diagnosis: item.reason || '접수 내원 사유 없음',
          risk: targetCategory === 'active' ? 'B' : 'F',
          category: targetCategory,
          isExpanded: true,
          todos: [],
          dones: [{ id: "d_" + Date.now(), text: "원내 접수 자동 전송 등록", doneAt: getNowString(), source: "manual" }],
          registeredAt: getNowString()
        };

        dogs.unshift(newDog);
        saveState(); renderAll();
        setCareView(targetCategory);
        showToast(\`🏥 '\${newDog.name}' 환자가 \${targetCategory==='active'?'집중관리':'만성관리'}로 전송 등록되었습니다!\`);
      }
    });

    function setCareView(view) {
      const db = document.getElementById('careDashboard');
      if(db) db.dataset.view = view;
      document.querySelectorAll('.care-tab').forEach(btn => btn.classList.remove('active-tab'));
      const t = document.getElementById(view==='active'?'tabActive':view==='chronic'?'tabChronic':'tabBoth');
      if(t) t.classList.add('active-tab');
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dogs, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = \`CarePlan_Chart_\${new Date().toISOString().slice(0,10)}.json\`;
      document.body.appendChild(a); a.click(); a.remove();
    }
    function triggerImport() { document.getElementById("importFileInput").click(); }
    function importData(e) {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          dogs = JSON.parse(evt.target.result);
          saveState(); renderAll(); showToast("복원 완료");
        } catch(err) { alert("파일 형식 오류"); }
      };
      reader.readAsText(file);
    }
    function handleSearch(val) { searchQuery = val.trim().toLowerCase(); renderAll(); }

    window.addEventListener("DOMContentLoaded", () => {
      setCareView('active');
      loadState();
    });
  <\/script>
</body>
</html>`;

// =========================================================================
const counterAppHTML = `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원내 접수 현황판</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body { font-family: 'Pretendard', sans-serif; font-size: 14px; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-2.5">
  <div class="space-y-3">
    <!-- 헤더 -->
    <header class="flex justify-between items-center bg-white p-3 rounded-xl shadow-xs border border-slate-200">
      <h1 class="text-base font-bold text-slate-900 flex items-center gap-1.5">
        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span>
        원내 접수 현황판
      </h1>
      <button onclick="fetchReceptions()" class="px-2.5 py-1 bg-slate-900 text-white rounded-lg text-xs font-semibold hover:bg-slate-800">새로고침</button>
    </header>

    <!-- 요약 카운터 -->
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-white p-2 rounded-lg border border-slate-200 shadow-2xs">
        <p class="text-[10px] font-semibold text-slate-400">접수 대기</p>
        <p id="count-waiting" class="text-lg font-bold text-amber-600 mt-0.5">0</p>
      </div>
      <div class="bg-white p-2 rounded-lg border border-slate-200 shadow-2xs">
        <p class="text-[10px] font-semibold text-slate-400">진료 중</p>
        <p id="count-progress" class="text-lg font-bold text-emerald-600 mt-0.5">0</p>
      </div>
      <div class="bg-white p-2 rounded-lg border border-slate-200 shadow-2xs">
        <p class="text-[10px] font-semibold text-slate-400">오늘 완료</p>
        <p id="count-done" class="text-lg font-bold text-slate-500 mt-0.5">0</p>
      </div>
    </div>

    <!-- 접수 목록 리스트 -->
    <div id="list-container" class="space-y-2">
      <div class="text-center py-6 text-slate-400 text-xs">접수 내역 조회 중...</div>
    </div>
  </div>

  <script>
    let currentList = [];

    function unwrapPayload(raw) {
      if (!raw) return {};
      let cur = raw;
      try { while(typeof cur === 'string') cur = JSON.parse(cur); } catch(e){}
      return (cur && typeof cur === 'object') ? cur : {};
    }

    function calculateAge(bDate) {
      if(!bDate) return '';
      const m = String(bDate).match(/^(\\d{4})[.\\-/년 ]\\s*(\\d{1,2})?/);
      if(!m) return '';
      const diff = new Date().getFullYear() - Number(m[1]);
      return diff <= 0 ? '1년 미만' : \`\${diff}세\`;
    }

    async function fetchReceptions() {
      try {
        const res = await fetch('/api/receptions');
        const data = await res.json();
        if(!Array.isArray(data)) return;
        currentList = data;
        let w=0, p=0, d=0;
        data.forEach(item => {
          if(item.status==='접수대기'||item.status==='대기') w++;
          else if(item.status==='진료중') p++;
          else if(item.status==='완료') d++;
        });
        document.getElementById('count-waiting').textContent = w;
        document.getElementById('count-progress').textContent = p;
        document.getElementById('count-done').textContent = d;
        renderList(data);
      } catch(e) { console.error(e); }
    }

    function handleStatusSelect(selectEl, itemId) {
      const val = selectEl.value;
      if (val === "집중관리전송") {
        sendToCareChart(itemId, 'active');
        selectEl.value = "접수대기";
      } else if (val === "만성관리전송") {
        sendToCareChart(itemId, 'chronic');
        selectEl.value = "접수대기";
      } else {
        updateStatus(itemId, val);
      }
    }

    function sendToCareChart(itemId, targetCategory) {
      const item = currentList.find(x => x.id === itemId);
      if(!item) return;
      const p = unwrapPayload(item.payload);

      const petName = item.pet_name || p.pet_name || '환자';
      const guardian = p.guardian_name || item.owner_name || '보호자미상';
      const phone = item.phone || item.owner_phone || p.phone || '-';
      const weight = p.weight ? \`\${p.weight}kg (\${p.breed || '품종미상'})\` : (p.breed || '체중미상');
      
      let gender = p.gender || item.gender || '미상';
      const neutered = p.neutered ?? p.is_neutered ?? item.neutered;
      if(neutered && !gender.includes('✓')) gender += '✓';

      const birthDate = p.birth_date || p.birthDate || item.birth_date || '';
      const age = calculateAge(birthDate) || (birthDate ? \`\${birthDate}\` : '나이미상');
      const reason = p.reason || item.symptom || item.symptoms || '내원 사유 없음';

      const transferData = { petName, guardian, phone, weight, gender, age, reason };

      window.parent.postMessage({
        type: 'SEND_TO_CARE_CHART',
        targetCategory: targetCategory,
        payload: transferData
      }, '*');
    }

    function renderList(list) {
      const c = document.getElementById('list-container');
      if(!list.length) {
        c.innerHTML = '<div class="bg-white p-6 text-center rounded-xl border text-xs text-slate-400">접수된 환자가 없습니다.</div>';
        return;
      }
      c.innerHTML = list.map(item => {
        const p = unwrapPayload(item.payload);
        const isWait = (item.status === '접수대기' || item.status === '대기');
        const isProg = (item.status === '진료중');
        const isComp = (item.status === '완료');
        const reason = p.reason || item.symptom || '사유 미기재';

        return \`
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-2xs flex justify-between items-center gap-2">
            <div class="flex-1 min-w-0 space-y-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="px-1.5 py-0.2 rounded text-[10px] font-bold \${item.type==='FIRST'?'bg-sky-100 text-sky-800':'bg-emerald-100 text-emerald-800'}">
                  \${item.type==='FIRST'?'초진':'재진'}
                </span>
                <strong class="text-sm text-slate-900">\${item.pet_name || '이름없음'}</strong>
                <span class="text-xs text-slate-500 font-semibold">보호자: \${p.guardian_name || item.owner_name || '-'}</span>
                <span class="text-xs text-slate-500 font-mono">\${item.phone || '-'}</span>
              </div>
              <div class="text-[11px] text-slate-500">
                \${p.breed || ''} \${p.gender ? '· '+p.gender : ''} \${p.weight ? '· '+p.weight+'kg' : ''}
              </div>
              <div class="text-[11px] text-slate-700 bg-slate-50 p-1.5 rounded border border-slate-100 truncate">
                <strong>[사유]</strong> \${reason}
              </div>
            </div>

            <!-- 상태 선택창 : 외부 버튼 없이 드롭다운 안에 깔끔히 수납하여 가로 프레임 깨짐 완전 방지 -->
            <div class="shrink-0">
              <select onchange="handleStatusSelect(this, \${item.id})" class="text-xs font-bold px-2 py-1.5 rounded-lg border border-slate-300 bg-white cursor-pointer shadow-2xs">
                <option value="접수대기" \${isWait?'selected':''}>⏳ 접수 대기</option>
                <option value="진료중" \${isProg?'selected':''}>🩺 진료 중</option>
                <option value="완료" \${isComp?'selected':''}>✅ 진료 완료</option>
                <option disabled>──────────</option>
                <option value="집중관리전송" style="color:#e11d48;font-weight:bold">🔴 집중관리 전송</option>
                <option value="만성관리전송" style="color:#0d9488;font-weight:bold">🟢 만성관리 전송</option>
              </select>
            </div>
          </div>
        \`;
      }).join('');
    }

    async function updateStatus(id, newStatus) {
      try {
        await fetch('/api/receptions', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, status: newStatus })
        });
        fetchReceptions();
      } catch (err) { alert('상태 변경 실패'); }
    }

    fetchReceptions();
    setInterval(fetchReceptions, 5000);
  <\/script>
</body>
</html>`;

const counterFrame = document.getElementById('counterFrame');
const chronicFrame = document.getElementById('chronicFrame');
const chronicToggle = document.getElementById('chronicChartToggle');
const integratedShell = document.getElementById('integratedShell');

if (counterFrame) counterFrame.srcdoc = counterAppHTML;

let chronicLoaded = false;
function loadChronicOnce(){
  if(!chronicLoaded){ 
    chronicFrame.srcdoc = chronicAppHTML; 
    chronicLoaded = true; 
  }
}

function setLayout(mode){
  if(mode === 'focus' || mode === 'focus-expanded') loadChronicOnce();
  integratedShell.dataset.layout = mode;
  const globalControls = document.getElementById('expandedGlobalControls');
  if(globalControls) globalControls.style.display = mode === 'focus-expanded' ? 'flex' : 'none';
  if(mode === 'focus'){
    chronicToggle.textContent = '💊 복약관리 2화면으로';
  } else if(mode === 'focus-expanded'){
    chronicToggle.textContent = '↩️ 기본 화면으로';
  } else {
    chronicToggle.textContent = '📋 집중관리 2화면';
  }
}

chronicToggle.addEventListener('click', () => {
  setLayout(['focus','focus-expanded'].includes(integratedShell.dataset.layout) ? 'medication' : 'focus');
});

function showInitialScreen(){ setLayout('medication'); }
function refreshReceptionAndChart(){
  setLayout('focus');
  try { if(counterFrame) counterFrame.srcdoc = counterAppHTML; } catch(e){}
  try { if(chronicFrame) { chronicFrame.srcdoc = chronicAppHTML; chronicLoaded = true; } } catch(e){}
}

document.getElementById('globalInitialScreenBtn')?.addEventListener('click', showInitialScreen);
document.getElementById('globalRefreshChartBtn')?.addEventListener('click', refreshReceptionAndChart);

// iframe 간 메시지 중계 (접수 현황판 → 집중/만성관리)
window.addEventListener('message', (event) => {
  if (!event.data) return;
  if (event.data.type === 'show-focus-chart') setLayout('focus');
  if (event.data.type === 'show-focus-expanded') setLayout('focus-expanded');
  if (event.data.type === 'show-initial-screen') showInitialScreen();
  if (event.data.type === 'refresh-integrated-page') refreshReceptionAndChart();

  if (event.data.type === 'SEND_TO_CARE_CHART') {
    setLayout('focus');
    loadChronicOnce();
    
    setTimeout(() => {
      chronicFrame.contentWindow.postMessage({
        type: 'RECEIVE_TRANSFER_TO_CHART',
        targetCategory: event.data.targetCategory,
        payload: event.data.payload
      }, '*');
    }, 250);
  }
});
</script>
</body>
</html>
