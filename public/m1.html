<script>
const t=new Date();
const today=t.toISOString().slice(0,10);
start.value=today;
endDate.value=30;
todayText.textContent=today;
const months=[0,1].map(i=>new Date(t.getFullYear(),t.getMonth()+i,1));
const selected=new Set(), events=[];
const painted=new Map();
function sync(){ppet.textContent=pet.value||'—';pdisease.textContent=disease.value||'—';pstart.textContent=start.value}
pet.oninput=disease.oninput=start.oninput=sync;sync();
memoInput.oninput=()=>{pmemo.textContent=memoInput.value;};
const cautionStyles=['#fff3cd|#f4b400','#fff3cd|#f4b400','#ffebee|#e53935','#f5f5f5|#757575','#e8f5e9|#43a047','#fff3e0|#fb8c00','#e3f2fd|#1e88e5','#f3e5f5|#8e24aa','#ffebee|#e53935'];
function refreshCautions(){
 const selectedCautions=[...document.querySelectorAll('.cautionCheck:checked')].map((el,i)=>({text:el.value,style:cautionStyles[[...document.querySelectorAll('.cautionCheck')].indexOf(el)]||cautionStyles[0]}));
 const all=selectedCautions;
 const box=document.getElementById('printedCautionBox'),list=document.getElementById('printedCautionList');
 list.innerHTML='';
 all.forEach(item=>{const [bg,border]=item.style.split('|');const div=document.createElement('div');div.style.cssText=`background:${bg};border-left:4px solid ${border};padding:5px 7px;border-radius:4px;white-space:pre-wrap`;div.textContent=item.text;list.appendChild(div)});
 box.style.display=all.length?'block':'none';
}
document.querySelectorAll('.cautionCheck').forEach(el=>el.addEventListener('change',refreshCautions));
refreshCautions();

function renderMonths(){
 cals.innerHTML='';
 months.forEach(m=>{
  let f=new Date(m.getFullYear(),m.getMonth(),1).getDay();
  let last=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  let h=`<div class=cal><h3>${m.getFullYear()}년 ${m.getMonth()+1}월</h3><table><tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr><tr>`;
  for(let i=0;i<f;i++)h+="<td></td>";
  for(let d=1;d<=last;d++){
    let key=`${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls="pick";
    if(key===today)cls+=" today";
    if(selected.has(key))cls+=" sel";
    const list=events.filter(e=>e.date===key).slice(0,3);
    const labels=list.map(ev=>{
      let t=(ev.text||'').replace(/\(.+?\)/g,'').trim().slice(0,6);
      const clean=(ev.text||'').replace(/\(.+?\)/g,'').trim();
      const uniqueTexts=[...new Set(events.map(e=>(e.text||'').replace(/\(.+?\)/g,'').trim()).filter(Boolean))];
      const idx=((uniqueTexts.indexOf(clean)%15)+15)%15;
      return `<span class="ev txt${idx}">${t}</span>`;
    }).join('');
    h+=`<td class="${cls}" data-date="${key}"><div class="daynum">${d}</div>${labels}</td>`;
    if((f+d)%7==0)h+="</tr><tr>";
  }
  h+="</tr></table></div>"; cals.insertAdjacentHTML('beforeend',h);
 });
 bind();
}
let dragging=false;
function bind(){
 document.querySelectorAll('.pick').forEach(td=>{
  td.onmousedown=e=>{dragging=true;pick(td);e.preventDefault();};
  td.onmouseenter=()=>{if(dragging)pick(td);};
 });
 document.body.onmouseup=()=>dragging=false;
 document.querySelectorAll('.pick').forEach(td=>{
   const c=painted.get(td.dataset.date);
   td.style.background='';
   td.style.color='';
   if(c==='yellow') td.style.background='#f4b400';
   if(c==='green'){ td.style.background='#2f8f68'; td.style.color='#fff';}
   if(c==='red'){ td.style.background='#d9534f'; td.style.color='#fff';}
 });
}
function pick(td){
 const k=td.dataset.date;
 if(selected.has(k)){selected.delete(k);td.classList.remove('sel');}
 else{selected.add(k);td.classList.add('sel');}
 count.textContent=selected.size;
}
function refresh(){
 days.innerHTML='';
 const map=new Map();
 events.sort((a,b)=>a.date.localeCompare(b.date));
 events.forEach(e=>{
   if(!map.has(e.date)) map.set(e.date,[]);
   if(e.text && !map.get(e.date).includes(e.text)) map.get(e.date).push(e.text);
 });
 [...painted.keys()].sort().forEach(date=>{
   if(!map.has(date)) map.set(date,[]);
 });
 [...map.keys()].sort().forEach(date=>{
   const texts=map.get(date);
   let div=document.createElement('div');
   div.className='card';
   const c=painted.get(date);
   if(c==='yellow'){div.style.background='#f4b400';div.style.color='#111';}
   if(c==='green'){div.style.background='#2f8f68';div.style.color='#fff';}
   if(c==='red'){div.style.background='#d9534f';div.style.color='#fff';}
   div.innerHTML=`<b>${date.slice(5)}</b><div class=small>${texts.map(t=>'☐ '+t).join('<br>')}</div>`;
   days.appendChild(div);
 });
}
let lastSelectedDates=new Set();
function clearSel(){selected.clear();count.textContent=0;renderMonths();}
function quickFill(id,text){
 const el=document.getElementById(id);
 if(!el)return;
 el.value=text;
 el.focus();
 el.setSelectionRange(el.value.length,el.value.length);
}
function selectToday(){
 selected.clear();
 selected.add(today);
 lastSelectedDates=new Set(selected);
 count.textContent=selected.size;
 renderMonths();
}
function addSelected(){
 if(selected.size===0){
   if(lastSelectedDates.size===0)return alert("날짜를 선택하세요.");
   lastSelectedDates.forEach(d=>events.push({date:d,text:specificText.value,color:'none'}));
   refresh();
   return;
 }
 if(!specificText.value){lastSelectedDates=new Set(selected);clearSel();return;}
 lastSelectedDates=new Set(selected);
 selected.forEach(d=>events.push({date:d,text:specificText.value,color:'none'}));
 clearSel();refresh();
}
function deleteSelected(){
  const targets=selected.size>0 ? selected : lastSelectedDates;
  if(targets.size===0) return alert("삭제할 날짜를 선택하세요.");
  targets.forEach(d=>{
    painted.delete(d);
    for(let i=events.length-1;i>=0;i--){
      if(events[i].date===d){
        events.splice(i,1);
      }
    }
  });
  lastSelectedDates=new Set();
  clearSel();
  renderMonths();
  refresh();
}
function paintSelected(color){
  const targets=selected.size>0 ? selected : lastSelectedDates;
  if(targets.size===0) return alert("날짜를 선택하세요.");
  lastSelectedDates=new Set(targets);
  targets.forEach(d=>{
    if(painted.get(d)===color){
      painted.delete(d);
    }else{
      painted.set(d,color);
    }
  });
  clearSel();
  renderMonths();
  refresh();
}
function addRepeat(){
 if(!repeatText.value)return alert("내용을 입력하세요.");
 let startDate=new Date(start.value);
 let d=new Date(startDate);
 let end=new Date(startDate);
 let step=parseInt(interval.value);
 let days=parseInt(endDate.value)||0;
 end.setDate(end.getDate()+days);
 d.setDate(d.getDate()+step);
 while(d<=end){
   events.push({date:d.toISOString().slice(0,10),text:repeatText.value,color:'none'});
   d.setDate(d.getDate()+step);
 }
 renderMonths();
 refresh();
}
function issueOutputId(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const date=now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate());
  const time=pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds());
  const suffix=Math.floor(Math.random()*9000)+1000;
  const id='23SI-'+date+'-'+time+'-'+suffix;
  const value=document.getElementById('outputIdValue');
  if(value) value.textContent=id;
  return id;
}
function savePreviewImage(){
  issueOutputId();
  const pet=(document.getElementById('pet')?.value||'동물').trim()||'동물';
  const start=(document.getElementById('start')?.value||new Date().toISOString().slice(0,10));
  const fileName=`${pet}_${start}.png`;
  const preview=document.querySelector('.preview');
  html2canvas(preview,{scale:2,backgroundColor:'#ffffff'}).then(canvas=>{
    const a=document.createElement('a');
    a.download=fileName;
    a.href=canvas.toDataURL('image/png');
    a.click();
  });
}

renderMonths();refresh();

            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-0.5">나이 (생년월일)</label>
            <input type="text" id="inputDogAge" placeholder="예: 5세 (2021-05)" class="w-full bg-slate-50 border rounded px-2 py-1.5 text-xs">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-0.5">진료타이틀 / 병명 / 내원사유 *</label>
          <input type="text" id="inputDogDiagnosis" required placeholder="예: 좌측 슬개골 수술 후 재활" class="w-full bg-slate-50 border rounded px-2 py-1.5 text-xs">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-0.5">분류 위험도 *</label>
          <select id="inputRiskLevel" required class="w-full bg-slate-50 border rounded px-2 py-1.5 text-xs font-bold text-slate-800">
            <option value="A">A (당일사망 고위험 - 초응급)</option>
            <option value="B">B (3일내 사망 - 준응급/집중)</option>
            <option value="C">C (7일 사망 - 중환자 케어)</option>
            <option value="D">D (30일 사망 - 고위험 모니터링)</option>
            <option value="E">E (호스피스 - 완화 케어)</option>
            <option value="F">F (만성관리 - 안정적 투약)</option>
            <option value="G" selected>G (수술관리 - 수술 후 회복/재활)</option>
            <option value="H">H (모니터 지속관찰)</option>
          </select>
        </div>

        <div class="pt-2 flex justify-end gap-1.5">
          <button type="button" onclick="closeDogModal()" class="px-3 py-1.5 bg-slate-100 rounded text-xs font-bold">취소</button>
          <button type="submit" class="px-4 py-1.5 bg-rose-500 hover:bg-rose-600 text-white rounded text-xs font-bold shadow-xs">등록 완료</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="fixed bottom-4 right-4 bg-slate-900 text-white px-3.5 py-2 rounded-xl shadow-xl text-xs font-bold flex items-center gap-2 transform translate-y-16 opacity-0 transition-all z-50">
    <span id="toastMsg">완료되었습니다.</span>
  </div>

  <script>
    const RISK_CONFIG = {
      'A': { label: 'A (당일사망)', bg: 'bg-red-600 text-white' },
      'B': { label: 'B (3일내)', bg: 'bg-rose-500 text-white' },
      'C': { label: 'C (7일)', bg: 'bg-amber-500 text-white' },
      'D': { label: 'D (30일)', bg: 'bg-yellow-500 text-slate-900' },
      'E': { label: 'E (호스피스)', bg: 'bg-purple-600 text-white' },
      'F': { label: 'F (만성관리)', bg: 'bg-teal-600 text-white' },
      'G': { label: 'G (수술관리)', bg: 'bg-blue-600 text-white' },
      'H': { label: 'H (관찰)', bg: 'bg-slate-600 text-white' },
    };

    let dogs = [];
    let searchQuery = "";

    function loadState() {
      try {
        const saved = localStorage.getItem("careflow_vet_data_v6");
        dogs = saved ? JSON.parse(saved) : [];
      } catch(e) { dogs = []; }
      renderAll();
    }

    function saveState() {
      localStorage.setItem("careflow_vet_data_v6", JSON.stringify(dogs));
      updateStats();
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMsg").textContent = msg;
      toast.classList.remove("translate-y-16", "opacity-0");
      setTimeout(() => toast.classList.add("translate-y-16", "opacity-0"), 2200);
    }

    function updateStats() {
      document.getElementById("statActiveCount").textContent = dogs.filter(d => d.category === "active").length;
      document.getElementById("statChronicCount").textContent = dogs.filter(d => d.category === "chronic").length;
    }

    function toggleDogCard(id) {
      const dog = dogs.find(d => d.id === id);
      if(dog) { dog.isExpanded = !dog.isExpanded; saveState(); renderAll(); }
    }

    function getNowString() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return \`\${d.getFullYear()}-\${pad(d.getMonth()+1)}-\${pad(d.getDate())} \${pad(d.getHours())}:\${pad(d.getMinutes())}\`;
    }

    function getTodayString() {
      return new Date().toISOString().slice(0, 10);
    }

    function renderAll() {
      updateStats();
      renderFrame("active", "activeDogCardList");
      renderFrame("chronic", "chronicDogCardList");
    }

    function renderFrame(category, containerId) {
      const container = document.getElementById(containerId);
      let list = dogs.filter(d => d.category === category);
      if(searchQuery) {
        list = list.filter(d => 
          (d.name && d.name.toLowerCase().includes(searchQuery)) ||
          (d.guardian && d.guardian.toLowerCase().includes(searchQuery)) ||
          (d.phone && d.phone.includes(searchQuery)) ||
          (d.diagnosis && d.diagnosis.toLowerCase().includes(searchQuery))
        );
      }

      if(!list.length) {
        container.innerHTML = \`<div class="text-center py-8 text-xs text-slate-400">등록된 환자가 없습니다.</div>\`;
        return;
      }

      container.innerHTML = list.map(dog => {
        const rCfg = RISK_CONFIG[dog.risk] || RISK_CONFIG['G'];
        const todos = dog.todos || [];
        const dones = dog.dones || [];
        const lastDone = dones.length > 0 ? dones[dones.length - 1] : null;

        return \`
          <div class="bg-white rounded-xl border \${dog.isExpanded ? (category==='active'?'border-rose-400 ring-1 ring-rose-100':'border-teal-400 ring-1 ring-teal-100') : 'border-slate-200'} shadow-2xs overflow-hidden">
            <!-- 요약 헤더 (클릭 시 아코디언 펼침) -->
            <div class="px-3 py-2 flex items-center justify-between gap-2 cursor-pointer select-none bg-slate-50/70 hover:bg-slate-50" onclick="toggleDogCard('\${dog.id}')">
              <div class="flex items-center gap-1.5 flex-wrap flex-1 min-w-0">
                <span class="px-1.5 py-0.5 rounded text-[10px] font-black \${rCfg.bg}">\${rCfg.label}</span>
                <strong class="text-sm font-extrabold text-slate-900">\${dog.name}</strong>
                <span class="text-xs text-slate-500 font-semibold">(\${dog.guardian || '보호자미상'})</span>
                <span class="text-xs font-bold text-violet-700 bg-violet-50 px-1.5 py-0.5 rounded">\${dog.gender || '성별-'}</span>
                <span class="text-xs font-semibold text-slate-600 bg-slate-100 px-1.5 py-0.5 rounded">\${dog.age || '나이-'}</span>
                <span class="text-xs font-bold text-rose-700 bg-rose-50 px-1.5 py-0.5 rounded">\${dog.weight || '체중-'}</span>
                <span class="text-xs font-mono text-slate-600">\${dog.phone || ''}</span>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <span class="text-[10px] font-bold bg-amber-50 text-amber-800 px-1.5 py-0.5 rounded border border-amber-200">할일 \${todos.length}</span>
                <span class="text-[10px] font-bold bg-emerald-50 text-emerald-800 px-1.5 py-0.5 rounded border border-emerald-200">완료 \${dones.length}</span>
                <button onclick="event.stopPropagation(); deleteDog('\${dog.id}', '\${dog.name}')" class="text-slate-300 hover:text-red-500 p-1" title="삭제"><i class="fa-solid fa-trash-can text-xs"></i></button>
                <i class="fa-solid \${dog.isExpanded ? 'fa-chevron-up' : 'fa-chevron-down'} text-xs text-slate-400"></i>
              </div>
            </div>

            <!-- 요약 사유 및 최근 작업 -->
            <div class="px-3 py-1.5 text-xs text-slate-700 flex justify-between items-center bg-white border-t border-slate-100">
              <div class="truncate flex-1 pr-2"><strong>내원사유/진단:</strong> \${dog.diagnosis}</div>
              \${lastDone ? \`<div class="text-[10px] text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded shrink-0">최근: \${lastDone.text} (\${lastDone.doneAt})</div>\` : ''}
            </div>

            <!-- 펼침 영역: 상단 '환자 정보 즉시 수정' + 하단 '할일/한일 일정표' -->
            \${dog.isExpanded ? \`
              <div class="p-3 bg-white border-t border-slate-200 space-y-2.5">
                
                <!-- [수정 가능 폼 영역] : 자동 입력된 항목들을 자유롭게 수정하고 즉시 저장 -->
                <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 space-y-2">
                  <div class="flex items-center justify-between text-xs font-bold text-slate-700 pb-1 border-b border-slate-200">
                    <span class="flex items-center gap-1"><i class="fa-solid fa-pen-to-square text-indigo-500"></i>환자 기본정보 수정</span>
                    <button type="button" onclick="updateDogInfo('\${dog.id}')" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded font-bold text-xs shadow-2xs">
                      💾 수정내용 저장
                    </button>
                  </div>
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-1.5">
                    <div>
                      <span class="text-[10px] text-slate-500 font-semibold block">동물이름</span>
                      <input type="text" id="edit_name_\${dog.id}" value="\${dog.name || ''}" class="w-full bg-white border rounded px-1.5 py-1 text-xs font-bold">
                    </div>
                    <div>
                      <span class="text-[10px] text-slate-500 font-semibold block">보호자</span>
                      <input type="text" id="edit_guardian_\${dog.id}" value="\${dog.guardian || ''}" class="w-full bg-white border rounded px-1.5 py-1 text-xs">
                    </div>
                    <div>
                      <span class="text-[10px] text-slate-500 font-semibold block">체중</span>
                      <input type="text" id="edit_weight_\${dog.id}" value="\${dog.weight || ''}" class="w-full bg-white border rounded px-1.5 py-1 text-xs font-bold text-rose-700">
                    </div>
                    <div>
                      <span class="text-[10px] text-slate-500 font-semibold block">휴대폰번호</span>
                      <input type="text" id="edit_phone_\${dog.id}" value="\${dog.phone || ''}" class="w-full bg-white border rounded px-1.5 py-1 text-xs font-mono">
                    </div>
                  </div>
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-1.5">
                    <div>
                      <span class="text-[10px] text-slate-500 font-semibold block">성별</span>
                      <input type="text" id="edit_gender_\${dog.id}" value="\${dog.gender || ''}" class="w-full bg-white border rounded px-1.5 py-1 text-xs font-bold text-violet-700">
                    </div>
                    <div>
                      <span class="text-[10px] text-slate-500 font-semibold block">나이</span>
                      <input type="text" id="edit_age_\${dog.id}" value="\${dog.age || ''}" class="w-full bg-white border rounded px-1.5 py-1 text-xs">
                    </div>
                    <div>
                      <span class="text-[10px] text-slate-500 font-semibold block">위험도</span>
                      <select id="edit_risk_\${dog.id}" class="w-full bg-white border rounded px-1 py-1 text-xs font-bold">
                        \${Object.keys(RISK_CONFIG).map(k => \`<option value="\${k}" \${dog.risk===k?'selected':''}>\${RISK_CONFIG[k].label}</option>\`).join('')}
                      </select>
                    </div>
                    <div class="flex items-end gap-1">
                      \${category === 'active' ? \`
                        <button type="button" onclick="transferCategory('\${dog.id}', 'chronic')" class="w-full py-1 bg-teal-600 text-white font-bold text-xs rounded">🟢 만성이관</button>
                      \` : \`
                        <button type="button" onclick="transferCategory('\${dog.id}', 'active')" class="w-full py-1 bg-rose-600 text-white font-bold text-xs rounded">🔴 집중복귀</button>
                      \`}
                      <button type="button" onclick="saveDogChartText('\${dog.id}')" class="w-full py-1 bg-slate-700 text-white font-bold text-xs rounded" title="텍스트 다운로드">📥 챠트저장</button>
                    </div>
                  </div>
                  <div>
                    <span class="text-[10px] text-slate-500 font-semibold block">진료타이틀 / 병명 / 내원사유</span>
                    <input type="text" id="edit_diagnosis_\${dog.id}" value="\${dog.diagnosis || ''}" class="w-full bg-white border rounded px-1.5 py-1 text-xs">
                  </div>
                </div>

                <!-- 2열 그리드: 할일(To-Do 달력포함) vs 한일(Done) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                  <!-- 좌: 할일 등록 (달력 완벽 복원) -->
                  <div class="bg-amber-50/40 rounded-lg p-2 border border-amber-200 flex flex-col">
                    <div class="flex justify-between items-center mb-1 text-[11px] font-bold text-amber-900">
                      <span><i class="fa-solid fa-calendar-days text-amber-600 mr-1"></i>할 일 일정표 (스케줄)</span>
                      <span class="text-[9px] text-amber-700">체크 시 '한 일'로 자동 이동</span>
                    </div>
                    <!-- 달력(input type="date") + 내용 + 등록 버튼 -->
                    <div class="flex gap-1 mb-1.5">
                      <input type="date" id="todoDate_\${dog.id}" value="\${getTodayString()}" class="bg-white border rounded px-1.5 py-1 text-xs font-mono shadow-2xs">
                      <input type="text" id="todoInput_\${dog.id}" placeholder="할 일 내용 입력" class="flex-1 bg-white border rounded px-2 py-1 text-xs" onkeydown="if(event.key==='Enter') addTodoItem('\${dog.id}')">
                      <button onclick="addTodoItem('\${dog.id}')" class="px-2.5 py-1 bg-amber-600 text-white text-xs font-bold rounded shrink-0">등록</button>
                    </div>
                    <div class="space-y-1 max-h-40 overflow-y-auto">
                      \${!todos.length ? '<div class="text-[10px] text-slate-400 text-center py-4">등록된 할 일 일정이 없습니다.</div>' : todos.map(t => \`
                        <div class="flex items-center justify-between p-1 bg-white rounded border border-slate-200 text-xs">
                          <label class="flex items-center gap-1.5 truncate flex-1 cursor-pointer">
                            <input type="checkbox" onchange="completeTodoItem('\${dog.id}', '\${t.id}')" class="w-3.5 h-3.5 text-emerald-600 rounded">
                            <span class="text-[10px] font-bold font-mono text-amber-800 bg-amber-100 px-1 py-0.5 rounded shrink-0">\${t.date ? t.date.slice(5) : '일정'}</span>
                            <span class="truncate">\${t.text}</span>
                          </label>
                          <button onclick="removeTodoItem('\${dog.id}', '\${t.id}')" class="text-slate-300 hover:text-red-500 px-1">&times;</button>
                        </div>
                      \`).join('')}
                    </div>
                  </div>

                  <!-- 우: 한일 수동기록 및 누적 -->
                  <div class="bg-emerald-50/40 rounded-lg p-2 border border-emerald-200 flex flex-col">
                    <div class="flex justify-between items-center mb-1 text-[11px] font-bold text-emerald-900">
                      <span><i class="fa-solid fa-clock-rotate-left text-emerald-600 mr-1"></i>한 일 (실행/수동기록)</span>
                      <span class="text-[9px] text-emerald-700">클릭 시 자동복사</span>
                    </div>
                    <div class="flex gap-1 mb-1.5">
                      <input type="text" id="directDoneInput_\${dog.id}" placeholder="즉시 한 일 수동입력 (엔터)" class="flex-1 bg-white border rounded px-2 py-1 text-xs" onkeydown="if(event.key==='Enter') addDirectDone('\${dog.id}')">
                      <button onclick="addDirectDone('\${dog.id}')" class="px-2.5 py-1 bg-emerald-600 text-white text-xs font-bold rounded shrink-0">기록</button>
                    </div>
                    <div class="space-y-1 max-h-40 overflow-y-auto">
                      \${!dones.length ? '<div class="text-[10px] text-slate-400 text-center py-4">완료된 기록이 없습니다.</div>' : [...dones].reverse().map(d => \`
                        <div class="copyable-row flex items-center justify-between p-1 bg-white rounded border border-emerald-100 text-xs cursor-pointer select-none" onclick="copyDoneText('\${d.text}', '\${d.doneAt}')" title="클릭 시 텍스트 복사">
                          <div class="truncate flex-1 pr-1 font-medium text-slate-800">✓ \${d.text}</div>
                          <div class="flex items-center gap-1 shrink-0">
                            <span class="text-[9px] text-slate-400 font-mono">\${d.doneAt}</span>
                            <button onclick="event.stopPropagation(); removeDoneItem('\${dog.id}', '\${d.id}')" class="text-slate-300 hover:text-red-500 px-1">&times;</button>
                          </div>
                        </div>
                      \`).join('')}
                    </div>
                  </div>
                </div>

              </div>
            \` : ''}
          </div>
        \`;
      }).join('');
    }

    // 기본정보 즉시 수정 함수
    function updateDogInfo(dogId) {
      const dog = dogs.find(d => d.id === dogId);
      if(!dog) return;

      dog.name = document.getElementById(\`edit_name_\${dogId}\`).value.trim();
      dog.guardian = document.getElementById(\`edit_guardian_\${dogId}\`).value.trim();
      dog.weight = document.getElementById(\`edit_weight_\${dogId}\`).value.trim();
      dog.phone = document.getElementById(\`edit_phone_\${dogId}\`).value.trim();
      dog.gender = document.getElementById(\`edit_gender_\${dogId}\`).value.trim();
      dog.age = document.getElementById(\`edit_age_\${dogId}\`).value.trim();
      dog.risk = document.getElementById(\`edit_risk_\${dogId}\`).value;
      dog.diagnosis = document.getElementById(\`edit_diagnosis_\${dogId}\`).value.trim();

      saveState();
      renderAll();
      showToast(\`'\${dog.name}' 환자 정보가 수정되었습니다.\`);
    }

    // 할 일 추가 (달력 날짜 반영)
    function addTodoItem(dogId) {
      const input = document.getElementById(\`todoInput_\${dogId}\`);
      const dateInput = document.getElementById(\`todoDate_\${dogId}\`);
      const text = input ? input.value.trim() : '';
      const date = dateInput ? dateInput.value : getTodayString();
      if(!text) return;
      const dog = dogs.find(d => d.id === dogId);
      if(dog) {
        if(!dog.todos) dog.todos = [];
        dog.todos.push({ id: "t_" + Date.now(), text, date });
        saveState(); renderAll(); showToast("할 일 일정이 추가되었습니다.");
      }
    }

    function addDirectDone(dogId) {
      const input = document.getElementById(\`directDoneInput_\${dogId}\`);
      const text = input ? input.value.trim() : '';
      if(!text) return;
      const dog = dogs.find(d => d.id === dogId);
      if(dog) {
        if(!dog.dones) dog.dones = [];
        dog.dones.push({ id: "d_" + Date.now(), text, doneAt: getNowString() });
        saveState(); renderAll(); showToast("한 일 기록이 추가되었습니다.");
      }
    }

    function completeTodoItem(dogId, todoId) {
      const dog = dogs.find(d => d.id === dogId);
      if(!dog) return;
      const idx = (dog.todos || []).findIndex(t => t.id === todoId);
      if(idx !== -1) {
        const item = dog.todos.splice(idx, 1)[0];
        if(!dog.dones) dog.dones = [];
        dog.dones.push({ id: "d_" + Date.now(), text: item.text, doneAt: getNowString() });
        saveState(); renderAll(); showToast("완료되어 '한 일'로 이동되었습니다.");
      }
    }

    function removeTodoItem(dogId, todoId) {
      const dog = dogs.find(d => d.id === dogId);
      if(dog) { dog.todos = (dog.todos || []).filter(t => t.id !== todoId); saveState(); renderAll(); }
    }

    function removeDoneItem(dogId, doneId) {
      const dog = dogs.find(d => d.id === dogId);
      if(dog) { dog.dones = (dog.dones || []).filter(d => d.id !== doneId); saveState(); renderAll(); }
    }

    function copyDoneText(text, doneAt) {
      navigator.clipboard.writeText(\`[\${doneAt}] \${text}\`).then(() => showToast("클립보드 복사 완료"));
    }

    function saveDogChartText(dogId) {
      const dog = dogs.find(d => d.id === dogId);
      if(!dog) return;
      const lines = [
        "23시 하단오거리동물병원 - 집중관리 챠트",
        "========================================",
        \`환자명: \${dog.name}\`,
        \`보호자: \${dog.guardian || '-'}\`,
        \`연락처: \${dog.phone || '-'}\`,
        \`체중: \${dog.weight || '-'}\`,
        \`성별: \${dog.gender || '-'}\`,
        \`나이: \${dog.age || '-'}\`,
        \`내원사유/진단: \${dog.diagnosis || '-'}\`,
        \`구분: \${dog.category === 'active' ? '집중관리' : '만성관리'}\`,
        "",
        "[완료 기록 (한 일)]",
        "----------------------------------------"
      ];
      const records = dog.dones || [];
      if(!records.length) lines.push("기록된 내용이 없습니다.");
      else records.forEach((r, i) => lines.push(\`\${i+1}. [\${r.doneAt}] \${r.text}\`));
      lines.push("", \`저장일시: \${getNowString()}\`);

      const blob = new Blob(["\\uFEFF" + lines.join("\\r\\n")], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = \`챠트_\${dog.name}_\${getTodayString()}.txt\`;
      a.click();
      showToast("챠트 텍스트 파일 저장 완료");
    }

    function transferCategory(id, target) {
      const dog = dogs.find(d => d.id === id);
      if(dog) {
        dog.category = target;
        saveState(); renderAll();
        showToast(\`'\${dog.name}' 환자가 \${target==='chronic'?'만성':'집중'}관리로 이동되었습니다.\`);
      }
    }

    function deleteDog(id, name) {
      if(!confirm(\`'\${name}' 환자 챠트를 삭제하시겠습니까?\`)) return;
      dogs = dogs.filter(d => d.id !== id);
      saveState(); renderAll();
      showToast(\`'\${name}' 삭제 완료\`);
    }

    function openDogModal(cat = "active") {
      document.getElementById("inputTargetCategory").value = cat;
      document.getElementById("modalTitle").textContent = cat === "active" ? "집중관리 신규 환자 등록" : "만성관리 신규 환자 등록";
      document.getElementById("dogModal").classList.remove("hidden");
    }

    function closeDogModal() {
      document.getElementById("dogModal").classList.add("hidden");
      document.getElementById("newDogForm").reset();
    }

    function handleNewDogSubmit(e) {
      e.preventDefault();
      const newPatient = {
        id: "dog_" + Date.now(),
        name: document.getElementById("inputDogName").value.trim(),
        guardian: document.getElementById("inputGuardian").value.trim(),
        weight: document.getElementById("inputDogWeight").value.trim(),
        phone: document.getElementById("inputDogPhone").value.trim(),
        gender: document.getElementById("inputDogGender").value,
        age: document.getElementById("inputDogAge").value.trim(),
        diagnosis: document.getElementById("inputDogDiagnosis").value.trim(),
        risk: document.getElementById("inputRiskLevel").value,
        category: document.getElementById("inputTargetCategory").value,
        isExpanded: true,
        todos: [],
        dones: [{ id: "d_" + Date.now(), text: "신규 등록", doneAt: getNowString() }],
        registeredAt: getNowString()
      };
      dogs.unshift(newPatient);
      saveState(); renderAll(); closeDogModal();
      showToast(\`'\${newPatient.name}' 환자 등록 완료!\`);
    }

    window.addEventListener("message", (e) => {
      if(e.data && e.data.type === "RECEIVE_TRANSFER_TO_CHART") {
        const item = e.data.payload;
        const targetCategory = e.data.targetCategory || 'active';
        
        const newDog = {
          id: "dog_" + Date.now(),
          name: item.petName || '이름미상',
          guardian: item.guardian || '보호자미상',
          weight: item.weight || '체중미기재',
          phone: item.phone || '연락처미상',
          gender: item.gender || '미상',
          age: item.age || '나이미상',
          diagnosis: item.reason || '접수 내원 사유 없음',
          risk: targetCategory === 'active' ? 'B' : 'F',
          category: targetCategory,
          isExpanded: true,
          todos: [],
          dones: [{ id: "d_" + Date.now(), text: "원내 접수에서 자동 전송 등록됨", doneAt: getNowString() }],
          registeredAt: getNowString()
        };

        dogs.unshift(newDog);
        saveState(); renderAll();
        setCareView(targetCategory);
        showToast(\`🏥 '\${newDog.name}' 환자가 \${targetCategory==='active'?'집중관리':'만성관리'}로 전송 등록되었습니다!\`);
      }
    });

    function setCareView(view) {
      const db = document.getElementById('careDashboard');
      if(db) db.dataset.view = view;
      document.querySelectorAll('.care-tab').forEach(btn => btn.classList.remove('active-tab'));
      const t = document.getElementById(view==='active'?'tabActive':view==='chronic'?'tabChronic':'tabBoth');
      if(t) t.classList.add('active-tab');
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dogs, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = \`CarePlan_Chart_\${new Date().toISOString().slice(0,10)}.json\`;
      document.body.appendChild(a); a.click(); a.remove();
    }
    function triggerImport() { document.getElementById("importFileInput").click(); }
    function importData(e) {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          dogs = JSON.parse(evt.target.result);
          saveState(); renderAll(); showToast("복원 완료");
        } catch(err) { alert("파일 형식 오류"); }
      };
      reader.readAsText(file);
    }
    function handleSearch(val) { searchQuery = val.trim().toLowerCase(); renderAll(); }

    window.addEventListener("DOMContentLoaded", () => {
      setCareView('active');
      loadState();
    });
  <\/script>
</body>
</html>`;

// -------------------------------------------------------------
// [원내 접수 현황판 APP HTML]
// 드롭다운(Select) 안에 집중관리전송 / 만성관리전송을 배치하여 외부 버튼 깨짐 완벽 방지
// -------------------------------------------------------------
const counterAppHTML = `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원내 접수 현황판</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body { font-family: 'Pretendard', sans-serif; font-size: 15px; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-3 md:p-5">
  <div class="max-w-5xl mx-auto space-y-4">
    <header class="flex justify-between items-center bg-white p-3.5 rounded-xl shadow-xs border border-slate-200">
      <h1 class="text-lg font-bold text-slate-900 flex items-center gap-2">
        <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping"></span>
        원내 접수 현황판
      </h1>
      <button onclick="fetchReceptions()" class="px-3 py-1.5 bg-slate-900 text-white rounded-lg text-xs font-semibold hover:bg-slate-800">새로고침</button>
    </header>

    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-white p-2.5 rounded-lg border border-slate-200 shadow-2xs">
        <p class="text-[11px] font-semibold text-slate-400">접수 대기</p>
        <p id="count-waiting" class="text-xl font-bold text-amber-600 mt-0.5">0</p>
      </div>
      <div class="bg-white p-2.5 rounded-lg border border-slate-200 shadow-2xs">
        <p class="text-[11px] font-semibold text-slate-400">진료 중</p>
        <p id="count-progress" class="text-xl font-bold text-emerald-600 mt-0.5">0</p>
      </div>
      <div class="bg-white p-2.5 rounded-lg border border-slate-200 shadow-2xs">
        <p class="text-[11px] font-semibold text-slate-400">오늘 완료</p>
        <p id="count-done" class="text-xl font-bold text-slate-500 mt-0.5">0</p>
      </div>
    </div>

    <div id="list-container" class="space-y-3">
      <div class="text-center py-8 text-slate-400 text-xs">접수 내역을 확인하는 중...</div>
    </div>
  </div>

  <script>
    let currentList = [];

    function unwrapPayload(raw) {
      if (!raw) return {};
      let cur = raw;
      try { while(typeof cur === 'string') cur = JSON.parse(cur); } catch(e){}
      return (cur && typeof cur === 'object') ? cur : {};
    }

    function calculateAge(bDate) {
      if(!bDate) return '';
      const m = String(bDate).match(/^(\\d{4})[.\\-/년 ]\\s*(\\d{1,2})?/);
      if(!m) return '';
      const diff = new Date().getFullYear() - Number(m[1]);
      return diff <= 0 ? '1년 미만' : \`\${diff}세\`;
    }

    async function fetchReceptions() {
      try {
        const res = await fetch('/api/receptions');
        const data = await res.json();
        if(!Array.isArray(data)) return;
        currentList = data;
        let w=0, p=0, d=0;
        data.forEach(item => {
          if(item.status==='접수대기'||item.status==='대기') w++;
          else if(item.status==='진료중') p++;
          else if(item.status==='완료') d++;
        });
        document.getElementById('count-waiting').textContent = w;
        document.getElementById('count-progress').textContent = p;
        document.getElementById('count-done').textContent = d;
        renderList(data);
      } catch(e) { console.error(e); }
    }

    function handleStatusSelect(selectEl, itemId) {
      const val = selectEl.value;
      if (val === "집중관리전송") {
        sendToCareChart(itemId, 'active');
        selectEl.value = "접수대기";
      } else if (val === "만성관리전송") {
        sendToCareChart(itemId, 'chronic');
        selectEl.value = "접수대기";
      } else {
        updateStatus(itemId, val);
      }
    }

    function sendToCareChart(itemId, targetCategory) {
      const item = currentList.find(x => x.id === itemId);
      if(!item) return;
      const p = unwrapPayload(item.payload);

      const petName = item.pet_name || p.pet_name || '환자';
      const guardian = p.guardian_name || item.owner_name || '보호자미상';
      const phone = item.phone || item.owner_phone || p.phone || '-';
      const weight = p.weight ? \`\${p.weight}kg (\${p.breed || '품종미상'})\` : (p.breed || '체중미상');
      
      let gender = p.gender || item.gender || '미상';
      const neutered = p.neutered ?? p.is_neutered ?? item.neutered;
      if(neutered && !gender.includes('✓')) gender += '✓';

      const birthDate = p.birth_date || p.birthDate || item.birth_date || '';
      const age = calculateAge(birthDate) || (birthDate ? \`\${birthDate}\` : '나이미상');
      const reason = p.reason || item.symptom || item.symptoms || '내원 사유 없음';

      const transferData = { petName, guardian, phone, weight, gender, age, reason };

      window.parent.postMessage({
        type: 'SEND_TO_CARE_CHART',
        targetCategory: targetCategory,
        payload: transferData
      }, '*');
    }

    function renderList(list) {
      const c = document.getElementById('list-container');
      if(!list.length) {
        c.innerHTML = '<div class="bg-white p-8 text-center rounded-xl border text-xs text-slate-400">접수된 환자가 없습니다.</div>';
        return;
      }
      c.innerHTML = list.map(item => {
        const p = unwrapPayload(item.payload);
        const isWait = (item.status === '접수대기' || item.status === '대기');
        const isProg = (item.status === '진료중');
        const isComp = (item.status === '완료');
        const reason = p.reason || item.symptom || '사유 미기재';

        return \`
          <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-2xs flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
            <div class="flex-1 space-y-1">
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded text-[11px] font-bold \${item.type==='FIRST'?'bg-sky-100 text-sky-800':'bg-emerald-100 text-emerald-800'}">
                  \${item.type==='FIRST'?'초진':'재진'}
                </span>
                <strong class="text-base text-slate-900">\${item.pet_name || '이름없음'}</strong>
                <span class="text-xs text-slate-500 font-semibold">보호자: \${p.guardian_name || item.owner_name || '-'}</span>
                <span class="text-xs text-slate-500 font-mono">\${item.phone || '-'}</span>
              </div>
              <div class="text-xs text-slate-600">
                \${p.breed || ''} \${p.gender ? '· '+p.gender : ''} \${p.weight ? '· '+p.weight+'kg' : ''}
              </div>
              <div class="text-xs text-slate-700 bg-slate-50 p-2 rounded-lg border border-slate-100 mt-1">
                <strong>[내원사유]</strong> \${reason}
              </div>
            </div>

            <!-- 상태 선택창 : 드롭다운 안에 집중/만성 전송 수납 (외부 버튼 삭제로 프레임 깨짐 완전 해결) -->
            <div class="shrink-0 self-end md:self-center">
              <select onchange="handleStatusSelect(this, \${item.id})" class="text-xs font-bold px-3 py-2 rounded-xl border border-slate-300 bg-white cursor-pointer shadow-2xs">
                <option value="접수대기" \${isWait?'selected':''}>⏳ 접수 대기</option>
                <option value="진료중" \${isProg?'selected':''}>🩺 진료 중</option>
                <option value="완료" \${isComp?'selected':''}>✅ 진료 완료</option>
                <option disabled>──────────</option>
                <option value="집중관리전송" style="color:#e11d48;font-weight:bold">🔴 집중관리 전송</option>
                <option value="만성관리전송" style="color:#0d9488;font-weight:bold">🟢 만성관리 전송</option>
              </select>
            </div>
          </div>
        \`;
      }).join('');
    }

    async function updateStatus(id, newStatus) {
      try {
        await fetch('/api/receptions', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, status: newStatus })
        });
        fetchReceptions();
      } catch (err) { alert('상태 변경 실패'); }
    }

    fetchReceptions();
    setInterval(fetchReceptions, 5000);
  <\/script>
</body>
</html>`;

const counterFrame = document.getElementById('counterFrame');
const chronicFrame = document.getElementById('chronicFrame');
const chronicToggle = document.getElementById('chronicChartToggle');
const integratedShell = document.getElementById('integratedShell');

if (counterFrame) counterFrame.srcdoc = counterAppHTML;

let chronicLoaded = false;
function loadChronicOnce(){
  if(!chronicLoaded){ 
    chronicFrame.srcdoc = chronicAppHTML; 
    chronicLoaded = true; 
  }
}

function setLayout(mode){
  if(mode === 'focus' || mode === 'focus-expanded') loadChronicOnce();
  integratedShell.dataset.layout = mode;
  const globalControls = document.getElementById('expandedGlobalControls');
  if(globalControls) globalControls.style.display = mode === 'focus-expanded' ? 'flex' : 'none';
  if(mode === 'focus'){
    chronicToggle.textContent = '💊 복약관리 2화면으로';
  } else if(mode === 'focus-expanded'){
    chronicToggle.textContent = '↩️ 기본 화면으로';
  } else {
    chronicToggle.textContent = '📋 집중관리 2화면';
  }
}

chronicToggle.addEventListener('click', () => {
  setLayout(['focus','focus-expanded'].includes(integratedShell.dataset.layout) ? 'medication' : 'focus');
});

function showInitialScreen(){ setLayout('medication'); }
function refreshReceptionAndChart(){
  setLayout('focus');
  try { if(counterFrame) counterFrame.srcdoc = counterAppHTML; } catch(e){}
  try { if(chronicFrame) { chronicFrame.srcdoc = chronicAppHTML; chronicLoaded = true; } } catch(e){}
}

document.getElementById('globalInitialScreenBtn')?.addEventListener('click', showInitialScreen);
document.getElementById('globalRefreshChartBtn')?.addEventListener('click', refreshReceptionAndChart);

// iframe 간 메시지 중계 (접수 현황판 → 집중/만성관리)
window.addEventListener('message', (event) => {
  if (!event.data) return;
  if (event.data.type === 'show-focus-chart') setLayout('focus');
  if (event.data.type === 'show-focus-expanded') setLayout('focus-expanded');
  if (event.data.type === 'show-initial-screen') showInitialScreen();
  if (event.data.type === 'refresh-integrated-page') refreshReceptionAndChart();

  if (event.data.type === 'SEND_TO_CARE_CHART') {
    setLayout('focus');
    loadChronicOnce();
    
    setTimeout(() => {
      chronicFrame.contentWindow.postMessage({
        type: 'RECEIVE_TRANSFER_TO_CHART',
        targetCategory: event.data.targetCategory,
        payload: event.data.payload
      }, '*');
    }, 250);
  }
});
</script>
</body>
</html>
