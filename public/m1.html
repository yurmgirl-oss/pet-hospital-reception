<script>
const t=new Date();
const today=t.toISOString().slice(0,10);
start.value=today;
endDate.value=30;
todayText.textContent=today;
const months=[0,1].map(i=>new Date(t.getFullYear(),t.getMonth()+i,1));
const selected=new Set(), events=[];
const painted=new Map();
function sync(){ppet.textContent=pet.value||'—';pdisease.textContent=disease.value||'—';pstart.textContent=start.value}
pet.oninput=disease.oninput=start.oninput=sync;sync();
memoInput.oninput=()=>{pmemo.textContent=memoInput.value;};
const cautionStyles=['#fff3cd|#f4b400','#fff3cd|#f4b400','#ffebee|#e53935','#f5f5f5|#757575','#e8f5e9|#43a047','#fff3e0|#fb8c00','#e3f2fd|#1e88e5','#f3e5f5|#8e24aa','#ffebee|#e53935'];
function refreshCautions(){
 const selectedCautions=[...document.querySelectorAll('.cautionCheck:checked')].map((el,i)=>({text:el.value,style:cautionStyles[[...document.querySelectorAll('.cautionCheck')].indexOf(el)]||cautionStyles[0]}));
 const all=selectedCautions;
 const box=document.getElementById('printedCautionBox'),list=document.getElementById('printedCautionList');
 list.innerHTML='';
 all.forEach(item=>{const [bg,border]=item.style.split('|');const div=document.createElement('div');div.style.cssText=`background:${bg};border-left:4px solid ${border};padding:5px 7px;border-radius:4px;white-space:pre-wrap`;div.textContent=item.text;list.appendChild(div)});
 box.style.display=all.length?'block':'none';
}
document.querySelectorAll('.cautionCheck').forEach(el=>el.addEventListener('change',refreshCautions));
refreshCautions();

function renderMonths(){
 cals.innerHTML='';
 months.forEach(m=>{
  let f=new Date(m.getFullYear(),m.getMonth(),1).getDay();
  let last=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  let h=`<div class=cal><h3>${m.getFullYear()}년 ${m.getMonth()+1}월</h3><table><tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr><tr>`;
  for(let i=0;i<f;i++)h+="<td></td>";
  for(let d=1;d<=last;d++){
    let key=`${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls="pick";
    if(key===today)cls+=" today";
    if(selected.has(key))cls+=" sel";
    const list=events.filter(e=>e.date===key).slice(0,3);
    const labels=list.map(ev=>{
      let t=(ev.text||'').replace(/\(.+?\)/g,'').trim().slice(0,6);
      const clean=(ev.text||'').replace(/\(.+?\)/g,'').trim();
      const uniqueTexts=[...new Set(events.map(e=>(e.text||'').replace(/\(.+?\)/g,'').trim()).filter(Boolean))];
      const idx=((uniqueTexts.indexOf(clean)%15)+15)%15;
      return `<span class="ev txt${idx}">${t}</span>`;
    }).join('');
    h+=`<td class="${cls}" data-date="${key}"><div class="daynum">${d}</div>${labels}</td>`;
    if((f+d)%7==0)h+="</tr><tr>";
  }
  h+="</tr></table></div>"; cals.insertAdjacentHTML('beforeend',h);
 });
 bind();
}
let dragging=false;
function bind(){
 document.querySelectorAll('.pick').forEach(td=>{
  td.onmousedown=e=>{dragging=true;pick(td);e.preventDefault();};
  td.onmouseenter=()=>{if(dragging)pick(td);};
 });
 document.body.onmouseup=()=>dragging=false;
 document.querySelectorAll('.pick').forEach(td=>{
   const c=painted.get(td.dataset.date);
   td.style.background='';
   td.style.color='';
   if(c==='yellow') td.style.background='#f4b400';
   if(c==='green'){ td.style.background='#2f8f68'; td.style.color='#fff';}
   if(c==='red'){ td.style.background='#d9534f'; td.style.color='#fff';}
 });
}
function pick(td){
 const k=td.dataset.date;
 if(selected.has(k)){selected.delete(k);td.classList.remove('sel');}
 else{selected.add(k);td.classList.add('sel');}
 count.textContent=selected.size;
}
function refresh(){
 days.innerHTML='';
 const map=new Map();
 events.sort((a,b)=>a.date.localeCompare(b.date));
 events.forEach(e=>{
   if(!map.has(e.date)) map.set(e.date,[]);
   if(e.text && !map.get(e.date).includes(e.text)) map.get(e.date).push(e.text);
 });
 [...painted.keys()].sort().forEach(date=>{
   if(!map.has(date)) map.set(date,[]);
 });
 [...map.keys()].sort().forEach(date=>{
   const texts=map.get(date);
   let div=document.createElement('div');
   div.className='card';
   const c=painted.get(date);
   if(c==='yellow'){div.style.background='#f4b400';div.style.color='#111';}
   if(c==='green'){div.style.background='#2f8f68';div.style.color='#fff';}
   if(c==='red'){div.style.background='#d9534f';div.style.color='#fff';}
   div.innerHTML=`<b>${date.slice(5)}</b><div class=small>${texts.map(t=>'☐ '+t).join('<br>')}</div>`;
   days.appendChild(div);
 });
 // 일정 목록 표시 요소가 없는 통합 레이아웃이므로 list 접근을 생략합니다.
}
let lastSelectedDates=new Set();
function clearSel(){selected.clear();count.textContent=0;renderMonths();}
function quickFill(id,text){
 const el=document.getElementById(id);
 if(!el)return;
 el.value=text;
 el.focus();
 el.setSelectionRange(el.value.length,el.value.length);
}

function selectToday(){
 selected.clear();
 selected.add(today);
 lastSelectedDates=new Set(selected);
 count.textContent=selected.size;
 renderMonths();
}

function addSelected(){
 if(selected.size===0){
   if(lastSelectedDates.size===0)return alert("날짜를 선택하세요.");
   lastSelectedDates.forEach(d=>events.push({date:d,text:specificText.value,color:'none'}));
   refresh();
   return;
 }
 if(!specificText.value){lastSelectedDates=new Set(selected);clearSel();return;}
 lastSelectedDates=new Set(selected);
 selected.forEach(d=>events.push({date:d,text:specificText.value,color:'none'}));
 clearSel();refresh();
}

function deleteSelected(){
  const targets=selected.size>0 ? selected : lastSelectedDates;
  if(targets.size===0) return alert("삭제할 날짜를 선택하세요.");

  targets.forEach(d=>{
    painted.delete(d); // 색 제거

    // 해당 날짜의 모든 일정 삭제
    for(let i=events.length-1;i>=0;i--){
      if(events[i].date===d){
        events.splice(i,1);
      }
    }
  });

  lastSelectedDates=new Set();
  clearSel();
  renderMonths();
  refresh();
}

function paintSelected(color){
  const targets=selected.size>0 ? selected : lastSelectedDates;
  if(targets.size===0) return alert("날짜를 선택하세요.");

  lastSelectedDates=new Set(targets);
  targets.forEach(d=>{
    if(painted.get(d)===color){
      painted.delete(d);      // 같은 색이면 투명(해제)
    }else{
      painted.set(d,color);   // 다른 색이면 적용
    }
  });

  clearSel();
  renderMonths();
  refresh();
}

function addDragged(){
 const dragTextEl=document.getElementById('dragText');
 if(!dragTextEl) return alert("연속 날짜 드래그 입력 기능은 현재 화면에서 사용하지 않습니다. 반복 일정을 이용해 주세요.");

function issueOutputId(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const date=now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate());
  const time=pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds());
  const suffix=Math.floor(Math.random()*9000)+1000;
  const id='23SI-'+date+'-'+time+'-'+suffix;
  const value=document.getElementById('outputIdValue');
  if(value) value.textContent=id;
  return id;
}

function printPreview(){
  issueOutputId();
  const node=document.querySelector('.preview');
  html2canvas(node,{
    backgroundColor:'#ffffff',
    scale:3,
    useCORS:true,
    logging:false,
    width:node.scrollWidth,
    height:node.scrollHeight,
    windowWidth:node.scrollWidth,
    windowHeight:node.scrollHeight,
    scrollX:0,
    scrollY:0
  }).then(canvas=>{
    const w=window.open('','_blank');
    w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>인쇄</title>
      <style>
        @page{size:A4 portrait;margin:8mm;}
        html,body{margin:0;padding:0;background:#fff;width:100%;}
        img{width:100%;max-width:194mm;height:auto;display:block;margin:0 auto;}
      </style></head><body></body></html>`);
    const img=w.document.createElement('img');
    img.src=canvas.toDataURL('image/png');
    w.document.body.appendChild(img);
    w.document.close();
    img.onload=()=>{w.focus();w.print();};
  });
}

function savePreviewImage(){
  issueOutputId();
  const pet=(document.getElementById('pet')?.value||'동물').trim()||'동물';
  const start=(document.getElementById('start')?.value||new Date().toISOString().slice(0,10));
  const fileName=`${pet}_${start}.png`;
  const preview=document.querySelector('.preview');
  html2canvas(preview,{scale:2,backgroundColor:'#ffffff',onclone:(clonedDoc)=>{const headline=clonedDoc.querySelector('.bookingHeadline');if(headline){headline.style.setProperty('font-size','10px','important');headline.style.setProperty('letter-spacing','-0.5px','important');headline.style.setProperty('white-space','nowrap','important');headline.style.setProperty('line-height','1.1','important');}const banner=clonedDoc.querySelector('.preview .banner');if(banner){banner.style.setProperty('padding','5px','important');}}}).then(canvas=>{
    const a=document.createElement('a');
    a.download=fileName;
    a.href=canvas.toDataURL('image/png');
    a.click();
  });
}

function applyPromisePlan(){
 const choice=document.getElementById('promisePlan')?.value;
 if(!choice)return alert('약속처방을 선택해 주세요.');
 if(!start.value)return alert('시작일을 먼저 선택해 주세요.');
 const base=new Date(start.value+'T12:00:00');
 const dateAt=(offset)=>{const d=new Date(base);d.setDate(d.getDate()+offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
 if(choice==='sevenDay' || choice==='specialAnimal' || choice==='dermatitis' || choice==='conjunctivitis' || choice==='otitis' || choice==='arthritisPain' || choice==='specialAnimalDisinfection' || choice==='renalFailure' || choice==='liverLipid' || choice==='gastroenteritis' || choice==='postOpCare' || choice==='parrotFracture' || choice==='temporaryBandage' || choice==='catGeneralCare'){
   const template=choice;
   // 같은 약속처방을 다시 적용할 때 해당 템플릿 일정만 교체합니다.
   for(let i=events.length-1;i>=0;i--){if(events[i].template===template)events.splice(i,1);}
   if(choice==='sevenDay'){
     for(let day=0;day<7;day++){
       events.push({date:dateAt(day),text:'내복약(아침)',color:'none',template});
       events.push({date:dateAt(day),text:'내복약(저녁)',color:'none',template});
     }
     events.push({date:dateAt(2),text:'사진 촬영 후 병원에 전송',color:'none',template});
     events.push({date:dateAt(7),text:'병원 재내원',color:'none',template});
     const note='약속처방 안내: 7일간 매일 아침·저녁 내복약을 투여해 주세요. 3일째 환부 사진을 촬영해 병원에 보내주시고, 시작일로부터 7일 후 병원에 내원해 주세요.';
     memoInput.value=memoInput.value.trim()?memoInput.value.trim()+'\n'+note:note;
   } else if(choice==='specialAnimal'){
     for(let day=0;day<7;day++) events.push({date:dateAt(day),text:'물약(저녁)',color:'none',template});
     events.push({date:dateAt(2),text:'사진촬영',color:'none',template});
     events.push({date:dateAt(6),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(6),text:'추가처방예정(7일)',color:'none',template});
   } else if(choice==='specialAnimalDisinfection'){
     // 특수동물(소독): 7일간 저녁 물약과 소독, 지정일 사진촬영 및 8일째 내원
     for(let day=0;day<7;day++){
       events.push({date:dateAt(day),text:'물약(저녁)',color:'none',template});
       events.push({date:dateAt(day),text:'소독(1회)',color:'none',template});
     }
     [2,5,8,14,29].forEach(day=>events.push({date:dateAt(day),text:'사진촬영',color:'none',template}));
     events.push({date:dateAt(7),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(7),text:'내복약 추가처방예정',color:'none',template});
   } else if(choice==='liverLipid'){
     // 간/고지혈증: 당일부터 15일째까지 저녁 내복약, 15일째 추가처방 및 장기 혈액검사
     for(let day=0;day<15;day++) events.push({date:dateAt(day),text:'내복약(저녁)',color:'none',template});
     events.push({date:dateAt(14),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(14),text:'내복약 추가처방예정',color:'none',template});
     [14,29,89,179,269].forEach(day=>events.push({date:dateAt(day),text:'혈액검사',color:'none',template}));
   } else if(choice==='parrotFracture'){
     // 앵무새 골절: 15일 저녁 물약, 2일 간격 칼슘제 30일, 사진촬영 및 내원 추적
     for(let day=0;day<15;day++) events.push({date:dateAt(day),text:'물약(저녁)',color:'none',template});
     for(let day=1;day<30;day+=2) events.push({date:dateAt(day),text:'물약(칼슘제)',color:'none',template});
     events.push({date:dateAt(1),text:'사진촬영',color:'none',template});
     events.push({date:dateAt(3),text:'사진촬영',color:'none',template});
     events.push({date:dateAt(7),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(14),text:'병원내원-엑스레이 촬영',color:'yellow',template});
     events.push({date:dateAt(29),text:'병원내원-엑스레이 촬영',color:'yellow',template});
     events.push({date:dateAt(29),text:'붕대제거',color:'none',template});
     events.push({date:dateAt(59),text:'병원내원-엑스레이 촬영',color:'yellow',template});
   } else if(choice==='temporaryBandage'){
     // 임시붕대: 당일 저녁 복약, 다음날부터 7일간 아침·저녁 복약, 4일째 붕대 제거, 5~8일째 소독 연고
     events.push({date:dateAt(0),text:'내복약(저녁)',color:'none',template});
     for(let day=1;day<=7;day++) events.push({date:dateAt(day),text:'내복약(아침,저녁)',color:'none',template});
     events.push({date:dateAt(3),text:'병원내원-붕대제거',color:'yellow',template});
     for(let day=4;day<=7;day++) events.push({date:dateAt(day),text:'소독(연고)',color:'none',template});
   } else if(choice==='catGeneralCare'){
     // 고양이 일반처치: 당일 캡슐약 저녁, 7일까지 저녁 캡슐약, 8일째 내원 및 추가처방 안내
     events.push({date:dateAt(0),text:'내복약캡슐-저녁',color:'none',template});
     for(let day=1;day<=6;day++) events.push({date:dateAt(day),text:'내복캡슐약-저녁',color:'none',template});
     events.push({date:dateAt(7),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(7),text:'캡슐약추가처방예정',color:'none',template});
   } else if(choice==='postOpCare'){
     // 수술후처치: 당일 잠재우기, 이후 후처치·복약·소독, 실밥 제거 및 CRP 검사
     events.push({date:dateAt(0),text:'잠재우기',color:'none',template});
     // 다음날부터 3일까지 병원 내원 및 후처치
     for(let day=1;day<=3;day++){
       events.push({date:dateAt(day),text:'병원내원-후처치',color:'yellow',template});
     }
     // 2~4일째는 병원내원-후처치만 표시하고, 5~11일째 7일간 내복약·소독
     for(let day=4;day<=10;day++){
       events.push({date:dateAt(day),text:'내복약(아침,저녁)',color:'none',template});
       events.push({date:dateAt(day),text:'소독',color:'none',template});
     }
     events.push({date:dateAt(4),text:'사진촬영',color:'none',template});
     events.push({date:dateAt(7),text:'사진촬영',color:'none',template});
     events.push({date:dateAt(10),text:'병원내원-실밥제거',color:'yellow',template});
     events.push({date:dateAt(14),text:'혈액검사(CRP)',color:'none',template});
   } else if(choice==='gastroenteritis'){
     // 장염처치: 당일 저녁 복약, 7일 관리, 초기 수액·식이 관리 및 추적 내원/검사
     events.push({date:dateAt(0),text:'내복약(저녁)',color:'none',template});
     for(let day=1;day<7;day++){
       events.push({date:dateAt(day),text:'내복약(아침,저녁)',color:'none',template});
     }
     // 2~4일째: 병원 내원, 피하수액 처치, 내복약 및 유동식(처방식캔)
     for(let day=1;day<4;day++){
       events.push({date:dateAt(day),text:'병원내원',color:'yellow',template});
       events.push({date:dateAt(day),text:'피하수액처치',color:'none',template});

     }
     events.push({date:dateAt(4),text:'처방식 위장사료(불려서) 2회',color:'none',template});
     events.push({date:dateAt(5),text:'처방식 위장사료 급여시작',color:'none',template});
     [6,14,29].forEach(day=>{
       events.push({date:dateAt(day),text:'병원내원',color:'yellow',template});
       events.push({date:dateAt(day),text:'혈액검사',color:'none',template});
     });
   } else if(choice==='renalFailure'){
     // 신부전: 당일 저녁 레나메진, 15일간 아조딜·레나메진 및 내복약, 수액·검사 일정

       events.push({date:dateAt(day),text:'내복약(아침,저녁)',color:'none',template});
       events.push({date:dateAt(day),text:'아조딜(아침)',color:'none',template});
       events.push({date:dateAt(day),text:'레나메진(저녁)',color:'none',template});

     for(let day=0;day<3;day++) events.push({date:dateAt(day),text:'수액처치(병원)',color:'none',template});

     [2,6,14,29].forEach(day=>events.push({date:dateAt(day),text:'혈액검사(신장)',color:'none',template}));
     events.push({date:dateAt(14),text:'병원내원',color:'yellow',template});
   } else if(choice==='dermatitis'){
     // 피부염: 7일 집중관리, 이후 3개월간 추적관리
     // 당일은 저녁 처치 2항목만, 2일째부터 7일째 전까지 아침·저녁 관리
     events.push({date:dateAt(0),text:'내복약(저녁)',color:'none',template});
     events.push({date:dateAt(0),text:'소독, 연고(저녁)',color:'none',template});
     for(let day=1;day<7;day++){
       events.push({date:dateAt(day),text:'내복약(아침)',color:'none',template});

       events.push({date:dateAt(day),text:'소독, 연고(하루 2회)',color:'none',template});
     }
     events.push({date:dateAt(2),text:'사진촬영',color:'none',template});
     events.push({date:dateAt(6),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(20),text:'처방식 사료 유지',color:'none',template});
     for(let day=14;day<=89;day+=15) events.push({date:dateAt(day),text:'사진촬영',color:'none',template});
     for(let day=29;day<=89;day+=30) events.push({date:dateAt(day),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(27),text:'혈액검사(간,신장)',color:'none',template});
   } else if(choice==='conjunctivitis'){
     // 결막염: 당일 저녁 1회 투약, 이후 7일 관리 및 지정일 촬영·내원
     events.push({date:dateAt(0),text:'내복약(저녁)',color:'none',template});

     }

     for(let day=7;day<=14;day++){
       events.push({date:dateAt(day),text:'안약 세트(아침,저녁)',color:'none',template});

     }
     events.push({date:dateAt(1),text:'사진촬영',color:'none',template});
     [9,19,29].forEach(day=>events.push({date:dateAt(day),text:'사진촬영',color:'none',template}));
     events.push({date:dateAt(2),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(7),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(7),text:'내복약 추가처방예정',color:'none',template});
     events.push({date:dateAt(14),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(29),text:'병원내원',color:'yellow',template});
   } else if(choice==='arthritisPain'){
     // 관절염/진통: 당일 저녁, 첫 7일 아침·저녁, 이후 15일째까지 저녁 복약
     events.push({date:dateAt(0),text:'내복약(저녁)',color:'none',template});
     for(let day=1;day<7;day++){
       events.push({date:dateAt(day),text:'내복약(아침)',color:'none',template});
       events.push({date:dateAt(day),text:'내복약(저녁)',color:'none',template});
     }

     [4,11,18,24].forEach(day=>events.push({date:dateAt(day),text:'사진촬영',color:'none',template}));
     [6,14,29].forEach(day=>events.push({date:dateAt(day),text:'병원내원',color:'yellow',template}));
     events.push({date:dateAt(14),text:'내복약 추가예정',color:'none',template});
     events.push({date:dateAt(27),text:'혈액검사(간,신장)',color:'none',template});
   } else if(choice==='otitis'){
     // 외이염: 첫 7일 내복약·귀연고, 이후 귀연고 간격을 늘리고 추적 촬영·내원
     events.push({date:dateAt(0),text:'내복약(저녁)',color:'none',template});

       events.push({date:dateAt(day),text:'내복약(아침)',color:'none',template});
       events.push({date:dateAt(day),text:'내복약(저녁)',color:'none',template});
       events.push({date:dateAt(day),text:'귀연고 투약(1회)',color:'none',template});
     }
     // 8~15일째 매일 1회
     for(let day=7;day<=14;day++) events.push({date:dateAt(day),text:'귀연고 투약(1회)',color:'none',template});
     // 15~30일째 2일에 1회 (15, 17, ... 29일째)
     for(let day=14;day<=28;day+=2) events.push({date:dateAt(day),text:'귀연고 투약',color:'none',template});
     // 30~60일째 4일에 1회 (30, 34, ... 58일째)
     for(let day=29;day<=57;day+=4) events.push({date:dateAt(day),text:'귀연고 투약',color:'none',template});
     [12,25,38,56].forEach(day=>events.push({date:dateAt(day),text:'사진촬영',color:'none',template}));
     [14,29,44,59].forEach(day=>events.push({date:dateAt(day),text:'병원내원',color:'yellow',template}));
     events.push({date:dateAt(2),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(7),text:'병원내원',color:'yellow',template});
     events.push({date:dateAt(7),text:'내복약 추가처방예정',color:'none',template});
     events.push({date:dateAt(27),text:'혈액검사(간,신장)',color:'none',template});
   }
   pmemo.textContent=memoInput.value;
   renderMonths();refresh();
   alert('약속처방 일정이 추가되었습니다. 약 종류와 용량은 환자별로 직접 입력해 주세요.');
 }

3 text-white flex justify-between items-center\">\n        <h3 id=\"modalTitle\" class=\"font-bold text-xs flex items-center gap-1.5\">\n          <i class=\"fa-solid fa-paw\"></i> 환견 등록\n        </h3>\n        <button onclick=\"closeDogModal()\" class=\"text-white/80 hover:text-white text-base leading-none\">&times;</button>\n      </div>\n      <form id=\"newDogForm\" onsubmit=\"handleNewDogSubmit(event)\" class=\"p-3 space-y-2\">\n        <input type=\"hidden\" id=\"inputTargetCategory\" value=\"active\">\n        <input type=\"hidden\" id=\"inputEditDogId\" value=\"\">\n        <div class=\"flex items-center gap-2\">\n          <label class=\"shrink-0 text-[11px] font-bold text-slate-700\">분류위험도</label>\n          <select id=\"inputRiskLevel\" required class=\"flex-1 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs font-semibold\">\n            <option value=\"I\">I (JS관리)</option><option value=\"A\">A (당일사망 고위험 - 초응급)</option><option value=\"B\">B (3일내 사망 - 준응급/집중)</option><option value=\"C\">C (7일 사망 - 중환자 케어)</option><option value=\"D\">D (30일 사망 - 고위험 모니터링)</option><option value=\"E\">E (호스피스 - 완화 케어)</option><option value=\"F\">F (만성관리 - 안정적 투약)</option><option value=\"G\" selected>G (수술관리 - 수술 후 회복/재활)</option><option value=\"H\">H (모니터 지속관찰)</option>\n          </select>\n        </div>\n        <div class=\"flex items-center gap-2\">\n          <label class=\"shrink-0 text-[11px] font-bold\">원내접수에서 가져오기</label>\n          <select id=\"receptionImportSelect\" class=\"min-w-0 flex-1 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs\"><option value=\"\">접수 목록 불러오기를 누르세요</option></select>\n          <button type=\"button\" onclick=\"loadReceptionChoices()\" class=\"shrink-0 px-2 py-1.5 bg-sky-600 text-white rounded-lg text-[11px]\">접수 목록 불러오기</button>\n          <button type=\"button\" onclick=\"applyReceptionChoice()\" class=\"shrink-0 px-2 py-1.5 bg-sky-700 text-white rounded-lg text-[11px]\">선택 적용</button>\n        </div>\n        <div class=\"grid grid-cols-3 gap-2\">\n          <div><label class=\"block text-[10px] font-bold mb-1\">동물이름 *</label><input id=\"inputDogName\" required placeholder=\"동물이름\" class=\"w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs\"></div>\n          <div><label class=\"block text-[10px] font-bold mb-1\">보호자 *</label><input id=\"inputDogGuardian\" placeholder=\"보호자 성함\" class=\"w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs\"></div>\n          <div><label class=\"block text-[10px] font-bold mb-1\">휴대폰번호 *</label><input type=\"tel\" id=\"inputDogPhone\" required placeholder=\"010-1234-5678\" class=\"w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs\"></div>\n          <div><label class=\"block text-[10px] font-bold mb-1\">성별</label><select id=\"inputDogGender\" class=\"w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs\"><option value=\"\">미기재</option><option>수컷</option><option>암컷</option><option>미상</option></select></div>\n          <div><label class=\"block text-[10px] font-bold mb-1\">나이</label><input id=\"inputDogAge\" placeholder=\"예: 3세 / 5개월\" class=\"w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs\"></div>\n          <div><label class=\"block text-[10px] font-bold mb-1\">체중 *</label><input id=\"inputDogWeight\" required placeholder=\"예: 2.5kg\" class=\"w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs\"></div>\n          <div class=\"col-span-3\"><label class=\"block text-[10px] font-bold mb-1\">병명 / 진료타이틀 *</label><input id=\"inputDogDiagnosis\" required placeholder=\"병명 또는 진료 요약\" class=\"w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs\"></div>\n        </div>\n        <div class=\"pt-1 flex justify-end gap-2\"><button type=\"button\" onclick=\"closeDogModal()\" class=\"px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg text-xs\">취소</button><button id=\"dogSubmitButton\" type=\"submit\" class=\"px-4 py-1.5 bg-rose-500 text-white rounded-lg text-xs font-bold\">등록 완료</button></div>\n      </form>\n    </div>\n  </div>\n\n  <!-- Toast Notification -->\n  <div id=\"toast\" class=\"fixed bottom-5 right-5 bg-slate-900 text-white px-3.5 py-2.5 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 z-50\">\n    <i id=\"toastIcon\" class=\"fa-solid fa-check text-emerald-400\"></i>\n    <span id=\"toastMsg\">완료되었습니다.</span>\n  </div>\n\n  <!-- Script Application Logic -->\n  <script>\n    // Risk Definition Helper (Badge Styles & Tooltips)\n    const RISK_CONFIG = {\n      'I': { label: 'I (JS관리)', order: 0, bg: 'bg-indigo-700 text-white border-indigo-800', badgeClass: '' },\n      'A': { label: 'A (당일사망)', order: 1, bg: 'bg-red-600 text-white border-red-700', badgeClass: 'animate-pulse' },\n      'B': { label: 'B (3일내 사망)', order: 2, bg: 'bg-rose-500 text-white border-rose-600', badgeClass: '' },\n      'C': { label: 'C (7일 사망)', order: 3, bg: 'bg-amber-500 text-white border-amber-600', badgeClass: '' },\n      'D': { label: 'D (30일 사망)', order: 4, bg: 'bg-yellow-500 text-slate-900 border-yellow-600', badgeClass: '' },\n      'E': { label: 'E (호스피스)', order: 5, bg: 'bg-purple-600 text-white border-purple-700', badgeClass: '' },\n      'F': { label: 'F (만성관리)', order: 6, bg: 'bg-teal-600 text-white border-teal-700', badgeClass: '' },\n      'G': { label: 'G (수술관리)', order: 7, bg: 'bg-blue-600 text-white border-blue-700', badgeClass: '' },\n      'H': { label: 'H (모니터 지속관찰)', order: 8, bg: 'bg-orange-500 text-white border-orange-600', badgeClass: '' },\n    };\n\n    function getRiskBadge(risk) {\n      const cfg = RISK_CONFIG[risk] || RISK_CONFIG['G'];\n      return `<span class=\"px-1.5 py-0.5 rounded text-[10px] font-black tracking-tight shrink-0 shadow-2xs border ${cfg.bg} ${cfg.badgeClass}\" title=\"위험도 분류: ${cfg.label}\">\n        ${cfg.label}\n      </span>`;\n    }\n\n    // Helper: Source Icon (Schedule vs Manual)\n    function getSourceIcon(source) {\n      if (source === 'manual') {\n        return `<span class=\"inline-flex items-center gap-0.5 px-1 py-0.2 rounded bg-amber-50 text-amber-700 border border-amber-200 text-[9px] font-bold shrink-0\" title=\"수동 직접입력 작업\">\n          <i class=\"fa-solid fa-keyboard text-[8px] text-amber-600\"></i> 수동\n        </span>`;\n      }\n      return `<span class=\"inline-flex items-center gap-0.5 px-1 py-0.2 rounded bg-blue-50 text-blue-700 border border-blue-200 text-[9px] font-bold shrink-0\" title=\"할 일 스케줄 완료로 자동 이동됨\">\n        <i class=\"fa-solid fa-calendar-check text-[8px] text-blue-500\"></i> 스케줄\n      </span>`;\n    }\n\n    // Initial Seed Data with source tags\n    const INITIAL_DATA = [];\n\n    // State\n    let dogs = [];\n    let searchQuery = \"\";\n    let activeSortMode = \"risk_asc\";\n    let chronicSortMode = \"risk_asc\";\n\n    // 서버 저장: 실제 환자 데이터만 사용하며 예제 데이터는 불러오지 않습니다.\n    let focusServerReady = false;\n    let focusServerPin = sessionStorage.getItem(\"focus_management_pin\") || \"\";\n    let focusSaveQueue = Promise.resolve();\n\n    async function requestFocusPin() {\n      if (focusServerPin) return focusServerPin;\n      const entered = prompt(\"집중관리 서버 데이터에 접속하려면 관리자 PIN을 입력하세요.\");\n      if (entered === null || !entered.trim()) return \"\";\n      focusServerPin = entered.trim();\n      sessionStorage.setItem(\"focus_management_pin\", focusServerPin);\n      return focusServerPin;\n    }\n\n    async function loadState() {\n      dogs = [];\n      renderAll();\n      const pin = await requestFocusPin();\n      if (!pin) {\n        showToast(\"PIN 입력이 취소되었습니다. 서버 데이터를 불러오지 못했습니다.\", \"fa-circle-exclamation\", true);\n        return;\n      }\n      try {\n        const res = await fetch(\"/api/focus-management?dataset=real\", {\n          method: \"GET\",\n          headers: { \"X-Clinic-Pin\": pin },\n          cache: \"no-store\"\n        });\n        const result = await res.json();\n        if (res.status === 401) {\n          sessionStorage.removeItem(\"focus_management_pin\");\n          focusServerPin = \"\";\n          throw new Error(\"PIN 인증에 실패했습니다. 새로고침 후 다시 입력해 주세요.\");\n        }\n        if (!res.ok) throw new Error(result.error || \"서버 데이터를 불러오지 못했습니다.\");\n        dogs = Array.isArray(result.data) ? result.data : [];\n        focusServerReady = true;\n        localStorage.setItem(\"careflow_vet_data_v6\", JSON.stringify(dogs));\n        renderAll();\n        showToast(\"서버 데이터 불러오기 완료\");\n      } catch (err) {\n        focusServerReady = false;\n        dogs = [];\n        renderAll();\n        showToast(\"서버 연결 실패: \" + err.message, \"fa-circle-exclamation\", true);\n        console.error(\"집중관리 서버 불러오기 실패:\", err);\n      }\n    }\n\n\n    let metricDragState = null;\n    function toggleMetricEdit(dogId) {\n      const dog = dogs.find(d => d.id === dogId);\n      if (!dog) return;\n      dog.metricEditing = !dog.metricEditing;\n      saveState();\n      renderAll();\n    }\n    function startMetricDrag(event, dogId, key, track) {\n      const dog = dogs.find(d => d.id === dogId);\n      if (!dog || !dog.metricEditing) return;\n      event.preventDefault();\n      event.stopPropagation();\n      metricDragState = { dogId, key, track };\n      try { track.setPointerCapture(event.pointerId); } catch (_) {}\n      const update = ev => {\n        if (!metricDragState) return;\n        const rect = metricDragState.track.getBoundingClientRect();\n        const value = Math.max(0, Math.min(100, Math.round((ev.clientX - rect.left) / rect.width * 100)));\n        const currentDog = dogs.find(d => d.id === metricDragState.dogId);\n        if (!currentDog) return;\n        currentDog[metricDragState.key] = value;\n        const marker = metricDragState.track.querySelector('.care-metric-marker');\n        if (marker) marker.style.left = value + '%';\n        const fill = metricDragState.track.querySelector('.care-metric-fill');\n        if (metricDragState.key === 'treatmentProgress' && fill) fill.style.width = value + '%';\n      };\n      const finish = () => {\n        if (!metricDragState) return;\n        metricDragState = null;\n        window.removeEventListener('pointermove', update);\n        window.removeEventListener('pointerup', finish);\n        window.removeEventListener('pointercancel', finish);\n        saveState();\n      };\n      update(event);\n      window.addEventListener('pointermove', update);\n      window.addEventListener('pointerup', finish, { once: true });\n      window.addEventListener('pointercancel', finish, { once: true });\n    }\n\n    function saveState() {\n      localStorage.setItem(\"careflow_vet_data_v6\", JSON.stringify(dogs));\n      updateStats();\n      if (!focusServerReady || !focusServerPin) return;\n      const snapshot = JSON.stringify(dogs);\n      focusSaveQueue = focusSaveQueue.then(async () => {\n        const res = await fetch(\"/api/focus-management\", {\n          method: \"POST\",\n          headers: {\n            \"Content-Type\": \"application/json\",\n            \"X-Clinic-Pin\": focusServerPin\n          },\n          body: JSON.stringify({ dataset: \"real\", data: JSON.parse(snapshot) })\n        });\n        const result = await res.json();\n        if (!res.ok || !result.success) throw new Error(result.error || \"서버 저장 실패\");\n      }).catch(err => {\n        showToast(\"서버 저장 실패. 백업 파일을 보관해 주세요.\", \"fa-circle-exclamation\", true);\n        console.error(\"집중관리 서버 저장 실패:\", err);\n      });\n    }\n\n    function getTodayString() {\n      const d = new Date();\n      const pad = n => String(n).padStart(2, '0');\n      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;\n    }\n\n    function getNowString() {\n      const d = new Date();\n      const pad = n => String(n).padStart(2, '0');\n      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;\n    }\n\n    function showToast(msg, icon = \"fa-check\", isError = false) {\n      const toast = document.getElementById(\"toast\");\n      const toastMsg = document.getElementById(\"toastMsg\");\n      const toastIcon = document.getElementById(\"toastIcon\");\n\n      toastMsg.textContent = msg;\n      toastIcon.className = `fa-solid ${icon} ${isError ? 'text-rose-400' : 'text-emerald-400'}`;\n      \n      toast.classList.remove(\"translate-y-20\", \"opacity-0\");\n      setTimeout(() => {\n        toast.classList.add(\"translate-y-20\", \"opacity-0\");\n      }, 2000);\n    }\n\n    // Copy to clipboard helper\n    function copyDoneText(text, doneAt) {\n      const fullCopyString = `[${doneAt}] ${text}`;\n      navigator.clipboard.writeText(fullCopyString).then(() => {\n        showToast(`클립보드에 복사되었습니다: \"${fullCopyString}\"`, \"fa-copy\");\n      }).catch(() => {\n        // Fallback for older browsers\n        const textarea = document.createElement(\"textarea\");\n        textarea.value = fullCopyString;\n        document.body.appendChild(textarea);\n        textarea.select();\n        document.execCommand(\"copy\");\n        document.body.removeChild(textarea);\n        showToast(`클립보드 복사 완료!`, \"fa-copy\");\n      });\n    }\n\n    function updateStats() {\n      const activeCount = dogs.filter(d => d.category === \"active\").length;\n      const chronicCount = dogs.filter(d => d.category === \"chronic\").length;\n      document.getElementById(\"statActiveCount\").textContent = activeCount;\n      document.getElementById(\"statChronicCount\").textContent = chronicCount;\n    }\n\n    function toggleDogCard(dogId) {\n      const dog = dogs.find(d => d.id === dogId);\n      if (dog) {\n        dog.isExpanded = !dog.isExpanded;\n        saveState();\n        renderAll();\n      }\n    }\n\n    function toggleAllCards(category, shouldExpand) {\n      dogs.filter(d => d.category === category).forEach(d => d.isExpanded = shouldExpand);\n      saveState();\n      renderAll();\n    }\n\n    function handleSortChange(category, mode) {\n      if (category === 'active') activeSortMode = mode;\n      else chronicSortMode = mode;\n      renderAll();\n    }\n\n    function sortPatientList(list, mode) {\n      return [...list].sort((a, b) => {\n        const orderA = (RISK_CONFIG[a.risk] || { order: 99 }).order;\n        const orderB = (RISK_CONFIG[b.risk] || { order: 99 }).order;\n\n        const latestTimeA = a.dones.length > 0 ? a.dones[a.dones.length - 1].doneAt : \"\";\n        const latestTimeB = b.dones.length > 0 ? b.dones[b.dones.length - 1].doneAt : \"\";\n\n        if (mode === \"risk_asc\") {\n          if (orderA !== orderB) return orderA - orderB;\n          if (latestTimeA !== latestTimeB) return latestTimeB.localeCompare(latestTimeA);\n          return a.name.localeCompare(b.name, 'ko');\n        } else if (mode === \"latest_desc\") {\n          if (latestTimeA !== latestTimeB) return latestTimeB.localeCompare(latestTimeA);\n          if (orderA !== orderB) return orderA - orderB;\n          return a.name.localeCompare(b.name, 'ko');\n        } else if (mode === \"name_asc\") {\n          const nameCmp = a.name.localeCompare(b.name, 'ko');\n          if (nameCmp !== 0) return nameCmp;\n          return orderA - orderB;\n        }\n        return 0;\n      });\n    }\n\n    function handleSearch(val) {\n      searchQuery = val.trim().toLowerCase();\n      document.getElementById(\"clearSearchBtn\").classList.toggle(\"hidden\", !searchQuery);\n      renderAll();\n    }\n\n    function clearSearch() {\n      document.getElementById(\"globalSearchInput\").value = \"\";\n      searchQuery = \"\";\n      document.getElementById(\"clearSearchBtn\").classList.add(\"hidden\");\n      renderAll();\n    }\n\n    function getFilteredDogs(category) {\n      let list = dogs.filter(d => d.category === category);\n      if (searchQuery) {\n        list = list.filter(d => \n          d.name.toLowerCase().includes(searchQuery) ||\n          d.phone.includes(searchQuery) ||\n          d.diagnosis.toLowerCase().includes(searchQuery) ||\n          (d.risk && d.risk.toLowerCase().includes(searchQuery)) ||\n          (d.weight && d.weight.toLowerCase().includes(searchQuery))\n        );\n      }\n      const sortMode = category === 'active' ? activeSortMode : chronicSortMode;\n      return sortPatientList(list, sortMode);\n    }\n\n    // -------------------------------------------------------------\n    // RENDER LOGIC\n    // -------------------------------------------------------------\n    function renderAll() {\n      updateStats();\n      renderActiveFrame();\n      renderChronicFrame();\n    }\n\n    // Render Left (Active) Frame\n    function renderActiveFrame() {\n      const container = document.getElementById(\"activeDogCardList\");\n      const list = getFilteredDogs(\"active\");\n\n      if (list.length === 0) {\n        container.innerHTML = `\n          <div class=\"text-center py-10 bg-slate-50/70 rounded-xl border border-dashed border-rose-200 p-4\">\n            <i class=\"fa-solid fa-notes-medical text-2xl text-rose-300 mb-1.5\"></i>\n            <p class=\"text-xs font-bold text-slate-600\">${searchQuery ? '검색 결과와 일치하는 집중관리 환자가 없습니다.' : '집중관리 환자가 없습니다.'}</p>\n          </div>\n        `;\n        return;\n      }\n\n      container.innerHTML = list.map(dog => {\n        const lastDone = dog.dones.length > 0 ? dog.dones[dog.dones.length - 1] : null;\n        const lastDoneTooltip = lastDone ? `최근작업: ${lastDone.text} (${lastDone.doneAt}) [${lastDone.source === 'manual' ? '수동입력' : '스케줄'}]` : '작업 기록 없음';\n\n        return `\n          <div class=\"bg-white rounded-xl border ${dog.isExpanded ? 'border-rose-400 ring-2 ring-rose-100 shadow-md' : 'border-slate-200 shadow-2xs hover:border-rose-300'} card-transition overflow-hidden\">\n            \n            <!-- Compact Single-Line Namecard Header (30% 앞쪽 배치 & 툴팁 호버 지원) -->\n            <div class=\"group relative px-3 py-2 flex items-center justify-between gap-3 cursor-pointer select-none bg-gradient-to-r ${dog.isExpanded ? 'from-rose-50/90 to-amber-50/40 border-b border-rose-100' : 'from-slate-50/90 to-white hover:bg-slate-50'}\"\n                 onclick=\"toggleDogCard('${dog.id}')\"\n                 title=\"${lastDoneTooltip}\">\n              \n              <!-- 1. 좌측 기본 정보 (약 30% 영역 차지) -->\n              <div class=\"flex items-center gap-1.5 text-xs shrink-0 min-w-max\">\n                <span class=\"w-2 h-2 rounded-full bg-rose-500 shrink-0 ${dog.isExpanded ? 'badge-pulse' : ''}\"></span>\n                \n                <!-- 위험도 배지 -->\n                ${getRiskBadge(dog.risk || 'G')}\n\n                <!-- 동물이름 -->\n                <span class=\"font-extrabold text-slate-900 text-xs shrink-0\">${dog.name}</span>\n\n                <button onclick=\"event.stopPropagation(); editDog('${dog.id}')\" class=\"p-1 text-indigo-600 hover:bg-indigo-50 rounded-md\" title=\"등록정보 수정\"><i class=\"fa-solid fa-pen text-[10px]\"></i></button>\n                <!-- 이름 바로 옆 사망 시 삭제 휴지통 아이콘 -->\n                <button onclick=\"event.stopPropagation(); deleteDogForDeath('${dog.id}', '${dog.name}')\" \n                        class=\"p-1 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-md transition\" \n                        title=\"사망 시 환견 차트 삭제\">\n                  <i class=\"fa-solid fa-trash-can text-[11px]\"></i>\n                </button>\n                \n                <!-- 보호자·환자 정보: 휴지통 뒤 작은 글씨 한 줄 -->\n                <span class=\"text-[9px] text-slate-500 shrink-0 whitespace-nowrap\" title=\"보호자 이름\">${dog.guardian || '-'} </span>\n                <span class=\"text-[9px] text-slate-500 font-mono shrink-0 whitespace-nowrap\" title=\"휴대폰번호\">${dog.phone || '-'} </span>\n                <span class=\"text-[9px] text-slate-500 shrink-0 whitespace-nowrap\" title=\"성별\">${dog.gender || '-'} </span>\n                <span class=\"text-[9px] text-slate-500 shrink-0 whitespace-nowrap\" title=\"나이\">${dog.age || '-'} </span>\n                <span class=\"text-[9px] text-rose-600 font-semibold shrink-0 whitespace-nowrap\" title=\"체중\">${dog.weight || '-'} </span>\n\n                <!-- 병명은 조금 더 크게 강조 -->\n                <span class=\"px-2 py-0.5 bg-amber-50 text-amber-900 font-bold rounded text-[12px] border border-amber-200/70 truncate max-w-[180px] shrink-0\" title=\"${dog.diagnosis}\">\n                  ${dog.diagnosis}\n                </span>\n              </div>\n\n              <div class=\"care-metrics ${dog.metricEditing ? 'editing' : ''}\" title=\"체력·치료 진행 상태\">\n                <div class=\"care-metric\"><span class=\"care-metric-label\">체력</span><div class=\"care-metric-track fitness\" onpointerdown=\"startMetricDrag(event, '${dog.id}', 'fitness', this)\" aria-label=\"체력 기준선 조절\"><span class=\"care-metric-marker\" style=\"left:${Number.isFinite(Number(dog.fitness)) ? Math.max(0,Math.min(100,Number(dog.fitness))) : 70}%\"></span></div></div>\n                <div class=\"care-metric\"><span class=\"care-metric-label\">치료</span><div class=\"care-metric-track treatment\" onpointerdown=\"startMetricDrag(event, '${dog.id}', 'treatmentProgress', this)\" aria-label=\"치료 진행 조절\"><span class=\"care-metric-fill\" style=\"width:${Number.isFinite(Number(dog.treatmentProgress)) ? Math.max(0,Math.min(100,Number(dog.treatmentProgress))) : 40}%\"></span><span class=\"care-metric-marker\" style=\"left:${Number.isFinite(Number(dog.treatmentProgress)) ? Math.max(0,Math.min(100,Number(dog.treatmentProgress))) : 40}%\"></span></div></div>\n                <button type=\"button\" class=\"care-metric-edit\" title=\"체력·치료 바 수정\" onclick=\"event.stopPropagation();toggleMetricEdit('${dog.id}')\">${dog.metricEditing ? '완료' : '수정'}</button>\n              </div>\n\n              <!-- 2. 중앙 앞쪽(30% 지점부터) 넓게 펼쳐지는 최근 작업 내역 + 호버 툴팁 -->\n              <div class=\"flex-1 min-w-0 flex items-center px-2 relative\">\n                ${!dog.isExpanded ? `\n                  <div class=\"flex items-center gap-1.5 text-[11px] text-slate-600 w-full truncate bg-white/80 py-0.5 px-2 rounded border border-slate-200/70\">\n                    <span class=\"text-emerald-600 font-bold text-[10px] shrink-0 flex items-center gap-1\">\n                      <i class=\"fa-solid fa-circle-check text-[10px]\"></i> 최근작업:\n                    </span>\n                    ${lastDone ? getSourceIcon(lastDone.source) : ''}\n                    <span class=\"truncate font-medium text-slate-800 text-[11px] flex-1\">\n                      ${lastDone ? lastDone.text : '작업 기록 없음'}\n                    </span>\n                    ${lastDone ? `\n                      <span class=\"text-[9px] text-slate-500 font-mono bg-slate-100 px-1.5 py-0.5 rounded font-medium shrink-0 flex items-center gap-1\">\n                        <i class=\"fa-regular fa-clock text-[8px] text-slate-400\"></i>${lastDone.doneAt}\n                      </span>\n                    ` : ''}\n                  </div>\n\n                  <!-- 마우스 오버 시 전체 내용이 살짝 뜨는 플로팅 툴팁 (잘림 방지) -->\n                  ${lastDone ? `\n                    <div class=\"absolute left-2 -top-9 hidden group-hover:flex items-center gap-1.5 bg-slate-900 text-white text-[11px] font-semibold px-3 py-1.5 rounded-lg shadow-xl z-30 pointer-events-none whitespace-nowrap border border-slate-700 animate-fade-in\">\n                      <i class=\"fa-solid fa-circle-info text-emerald-400 text-[10px]\"></i>\n                      <span>${lastDone.text}</span>\n                      <span class=\"text-slate-400 text-[9px] font-mono border-l border-slate-700 pl-1.5\">${lastDone.doneAt}</span>\n                      <span class=\"text-[9px] text-amber-300 font-normal\">(${lastDone.source === 'manual' ? '수동입력' : '스케줄완료'})</span>\n                    </div>\n                  ` : ''}\n                ` : '<div class=\"text-[11px] text-rose-500 font-bold flex ite ap-1.5 min-w-0 flex-1\">\n                            <!-- 스케줄 vs 수동 아이콘 분류 -->\n                            ${getSourceIcon(d.source)}\n                            <span class=\"text-[9px] text-emerald-800 bg-emerald-100/90 px-1 py-0.2 rounded font-mono font-bold shrink-0\">${d.doneAt || '일시 미기록'}</span>\n                            <span class=\"text-xs font-medium text-slate-800 truncate\">${d.text}</span>\n                          </div>\n\n                          <div class=\"flex items-center gap-1 shrink-0\">\n                            <!-- 복사 힌트 아이콘 -->\n                            <span class=\"text-slate-400 hover:text-emerald-600 text-[10px] p-0.5\" title=\"복사\">\n                              <i class=\"fa-regular fa-copy\"></i>\n                            </span>\n                            <!-- 삭제 버튼 -->\n                            <button onclick=\"event.stopPropagation(); removeDoneItem('${dog.id}', '${d.id}')\" title=\"삭제\" class=\"text-slate-300 hover:text-rose-500 text-[10px] p-0.5\">\n                              <i class=\"fa-solid fa-trash-can\"></i>\n                            </button>\n                          </div>\n                        </div>\n                      `).join('')}\n                    </div>\n                  </div>\n\n                </div>\n\n              </div>\n            ` : ''}\n\n          </div>\n        `;\n      }).join('');\n    }\n\n    // Render Right (Chronic) Frame\n    function renderChronicFrame() {\n      const container = document.getElementById(\"chronicDogCardList\");\n      const list = getFilteredDogs(\"chronic\");\n\n      if (list.length === 0) {\n        container.innerHTML = `\n          <div class=\"text-center py-10 bg-slate-50/70 rounded-xl border border-dashed border-teal-200 p-4\">\n            <i class=\"fa-solid fa-shield-cat text-2xl text-teal-300 mb-1.5\"></i>\n            <p class=\"text-xs font-bold text-slate-600\">${searchQuery ? '검색 결과와 일치하는 만성관리 환자가 없습니다.' : '만성관리 환자가 없습니다.'}</p>\n          </div>\n        `;\n        return;\n      }\n\n      container.innerHTML = list.map(dog => {\n        const lastDone = dog.dones.length > 0 ? dog.dones[dog.dones.length - 1] : null;\n        const lastDoneTooltip = lastDone ? `최근작업: ${lastDone.text} (${lastDone.doneAt}) [${lastDone.source === 'manual' ? '수동입력' : '스케줄'}]` : '작업 기록 없음';\n\n        return `\n          <div class=\"bg-white rounded-xl border ${dog.isExpanded ? 'border-teal-400 ring-2 ring-teal-100 shadow-md' : 'border-slate-200 shadow-2xs hover:border-teal-300'} card-transition overflow-hidden\">\n            \n            <!-- Compact Single-Line Namecard Header (30% 앞쪽 배치 & 툴팁 호버 지원) -->\n            <div class=\"group relative px-3 py-2 flex items-center justify-between gap-3 cursor-pointer select-none bg-gradient-to-r ${dog.isExpanded ? 'from-teal-50/90 to-cyan-50/40 border-b border-teal-100' : 'from-slate-50/90 to-white hover:bg-slate-50'}\"\n                 onclick=\"toggleDogCard('${dog.id}')\"\n                 title=\"${lastDoneTooltip}\">\n              \n              <!-- 1. 좌측 기본 정보 (약 30% 영역 차지) -->\n              <div class=\"flex items-center gap-1.5 text-xs shrink-0 min-w-max\">\n                <span class=\"w-2 h-2 rounded-full bg-teal-500 shrink-0\"></span>\n\n                <!-- 위험도 배지 -->\n                ${getRiskBadge(dog.risk || 'F')}\n\n                <!-- 동물이름 -->\n                <span class=\"font-extrabold text-slate-900 text-xs shrink-0\">${dog.name}</span>\n\n                <button onclick=\"event.stopPropagation(); editDog('${dog.id}')\" class=\"p-1 text-indigo-600 hover:bg-indigo-50 rounded-md\" title=\"등록정보 수정\"><i class=\"fa-solid fa-pen text-[10px]\"></i></button>\n                <!-- 이름 바로 옆 사망 시 삭제 휴지통 아이콘 -->\n                <button onclick=\"event.stopPropagation(); deleteDogForDeath('${dog.id}', '${dog.name}')\" \n                        class=\"p-1 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-md transition\" \n                        title=\"사망 시 환견 차트 삭제\">\n                  <i class=\"fa-solid fa-trash-can text-[11px]\"></i>\n                </button>\n                \n                <!-- 체중 -->\n                <span class=\"px-1.5 py-0.5 bg-teal-100 text-teal-800 font-bold rounded text-[10px] shrink-0\">${dog.weight}</span>\n                \n                <!-- 휴대폰 풀 번호 -->\n                <span class=\"px-1.5 py-0.5 bg-slate-100 text-slate-700 font-semibold rounded text-[10px] shrink-0 font-mono tracking-tight flex items-center gap-1\">\n                  <i class=\"fa-solid fa-phone text-[8px] text-slate-400\"></i> ${dog.phone}\n                </span>\n\n                <!-- 진료타이틀 -->\n                <span class=\"px-2 py-0.5 bg-cyan-50 text-cyan-900 font-semibold rounded text-[10px] border border-cyan-200/60 truncate max-w-[140px]\" title=\"${dog.diagnosis}\">\n                  ${dog.diagnosis}\n                </span>\n              </div>\n\n              <div class=\"care-metrics ${dog.metricEditing ? 'editing' : ''}\" title=\"체력·치료 진행 상태\">\n                <div class=\"care-metric\"><span class=\"care-metric-label\">체력</span><div class=\"care-metric-track fitness\" onpointerdown=\"startMetricDrag(event, '${dog.id}', 'fitness', this)\" aria-label=\"체력 기준선 조절\"><span class=\"care-metric-marker\" style=\"left:${Number.isFinite(Number(dog.fitness)) ? Math.max(0,Math.min(100,Number(dog.fitness))) : 70}%\"></span></div></div>\n                <div class=\"care-metric\"><span class=\"care-metric-label\">치료</span><div class=\"care-metric-track treatment\" onpointerdown=\"startMetricDrag(event, '${dog.id}', 'treatmentProgress', this)\" aria-label=\"치료 진행 조절\"><span class=\"care-metric-fill\" style=\"width:${Number.isFinite(Number(dog.treatmentProgress)) ? Math.max(0,Math.min(100,Number(dog.treatmentProgress))) : 40}%\"></span><span class=\"care-metric-marker\" style=\"left:${Number.isFinite(Number(dog.treatmentProgress)) ? Math.max(0,Math.min(100,Number(dog.treatmentProgress))) : 40}%\"></span></div></div>\n                <button type=\"button\" class=\"care-metric-edit\" title=\"체력·치료 바 수정\" onclick=\"event.stopPropagation();toggleMetricEdit('${dog.id}')\">${dog.metricEditing ? '완료' : '수정'}</button>\n              </div>\n\n              <!-- 2. 중앙 앞쪽(30% 지점부터) 넓게 펼쳐지는 최근 작업 내역 + 호버 툴팁 -->\n              <div class=\"flex-1 min-w-0 flex items-center px-2 relative\">\n                ${!dog.isExpanded ? `\n                  <div class=\"flex items-center gap-1.5 text-[11px] text-slate-600 w-full truncate bg-white/80 py-0.5 px-2 rounded border border-slate-200/70\">\n                    <span class=\"text-teal-600 font-bold text-[10px] shrink-0 flex items-center gap-1\">\n                      <i class=\"fa-solid fa-clock-rotate-left text-[10px]\"></i> 최근작업:\n                    </span>\n                    ${lastDone ? getSourceIcon(lastDone.source) : ''}\n                    <span class=\"truncate font-medium text-slate-800 text-[11px] flex-1\">\n                      ${lastDone ? lastDone.text : '작업 기록 없음'}\n                    </span>\n                    ${lastDone ? `\n                      <span class=\"text-[9px] text-slate-500 font-mono bg-slate-100 px-1.5 py-0.5 rounded font-medium shrink-0 flex items-center gap-1\">\n                        <i class=\"fa-regular fa-clock text-[8px] text-slate-400\"></i>${lastDone.doneAt}\n                      </span>\n                    ` : ''}\n                  </div>\n\n                  <!-- 마우스 오버 시 플로팅 툴팁 -->\n                  ${lastDone ? `\n                    <div class=\"absolute left-2 -top-9 hidden group-hover:flex items-center gap-1.5 bg-slate-900 text-white text-[11px] font-semibold px-3 py-1.5 rounded-lg shadow-xl z-30 pointer-events-none whitespace-nowrap border border-slate-700 animate-fade-in\">\n                      <i class=\"fa-solid fa-circle-info text-teal-400 text-[10px]\"></i>\n                      <span>${lastDone.text}</span>\n                      <span class=\"text-slate-400 text-[9px] font-mono border-l border-slate-700 pl-1.5\">${lastDone.doneAt}</span>\n                      <span class=\"text-[9px] text-teal-300 font-normal\">(${lastDone.source === 'manual' ? '수동입력' : '스케줄완료'})</span>\n                    </div>\n                  ` : ''}\n                ` : '<div class=\"text-[11px] text-teal-600 font-bold flex items-center gap-1\"><i class=\"fa-solid fa-pen-to-square\"></i> 만성 루틴 작업 중</div>'}\n              </div>\n\n              <!-- 만성관리 환자 차트 텍스트 저장 -->\n              <button type=\"button\" onclick=\"event.stopPropagation(); saveDogChartText('${dog.id}')\" title=\"${(dog.dones || []).map(d => ((d.doneAt || '일시 미기록') + '  ' + (d.text || '')).replace(/&/g, '&amp;').replace(/\"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;')).join('&#10;') || '누적 기록이 없습니다.'}\" class=\"px-2 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md text-[10px] font-bold whitespace-nowrap shrink-0\"><i class=\"fa-solid fa-file-arrow-down mr-1\"></i>챠트기록</button>\n\n              <!-- 3. 우측 컨트롤 -->\n              <div class=\"flex items-center gap-2 shrink-0\">\n                <div class=\"flex items-center gap-1 text-[9px] font-bold\">\n                  <span class=\"px-1.5 py-0.5 rounded bg-cyan-50 text-cyan-800 border border-cyan-200\">정기 ${dog.todos.length}</span>\n                  <span class=\"px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700 border border-indigo-200\">과거 ${dog.dones.length}</span>\n                </div>\n\n                <i class=\"fa-solid ${dog.isExpanded ? 'fa-chevron-up text-teal-600' : 'fa-chevron-down text-slate-400'} text-xs\"></i>\n              </div>\n\n            </div>\n\n            <!-- EXPANDED INLINE WORKSPACE -->\n            ${dog.isExpanded ? `\n              <div class=\"p-3 bg-white space-y-2.5\">\n                \n                                <!-- 2-Subframe Layout: 만성 정기 할일 vs 만성 한일(수동기록+누적아카이브) -->\n                <div class=\"grid grid-cols-1 md:grid-cols-2 gap-2.5\">\n                  \n                  <!-- SUBFRAME 1: 만성 루틴 할 일 -->\n                  <div class=\"bg-cyan-50/30 rounded-xl p-2.5 border border-cyan-200/70 flex flex-col\">\n                    <div class=\"flex items-center justify-between pb-1.5 mb-1.5 border-b border-cyan-200/50 text-xs\">\n                      <span class=\"font-bold text-cyan-950 flex items-center gap-1 text-[11px]\">\n                        <i class=\"fa-solid fa-calendar-check text-cyan-600\"></i> 만성 정기 케어 할 일\n                      </span>\n                      <span class=\"text-[9px] text-cyan-700\">체크 시 과거 내역으로 누적</span>\n                    </div>\n\n                    <!-- Input Line -->\n                    <div class=\"flex items-center gap-1 mb-2\">\n                      <input type=\"date\" id=\"dateInput_${dog.id}\" value=\"${getTodayString()}\"\n                             class=\"bg-white border border-slate-200 rounded px-1.5 py-1 text-[10px] text-slate-700 font-mono shadow-2xs\">\n                      <input type=\"text\" id=\"todoInput_${dog.id}\" placeholder=\"만성 투약/루틴 (엔터 등록)\"\n                             class=\"flex-1 bg-white border border-slate-200 rounded px-2 py-1 text-xs text-slate-800 focus:outline-hidden focus:border-teal-400 shadow-2xs\"\n                             onkeydown=\"if(event.key==='Enter') addTodoItem('${dog.id}')\">\n                      <button onclick=\"addTodoItem('${dog.id}')\" class=\"px-2.5 py-1 bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs rounded transition shrink-0\">\n                        등록\n                      </button>\n                    </div>\n\n                    <!-- Item List -->\n                    <div class=\"space-y-1 max-h-48 overflow-y-auto pr-0.5\">\n                      ${dog.todos.length === 0 ? `\n                        <div class=\"text-center py-4 text-[10px] text-slate-400\">등록된 만성 일정이 없습니다.</div>\n                      ` : dog.todos.map(t => `\n                        <div class=\"group flex items-center justify-between gap-1.5 p-1.5 rounded bg-white border border-slate-200/80 hover:border-cyan-300 shadow-2xs\">\n                          <div class=\"flex items-center gap-1.5 min-w-0 flex-1\">\n                            <input type=\"checkbox\" onchange=\"completeTodoItem('${dog.id}', '${t.id}')\"\n                                   class=\"w-3.5 h-3.5 text-teal-600 rounded border-cyan-300 focus:ring-0 cursor-pointer shrink-0\">\n                            <span class=\"text-xs font-semibold text-slate-800 truncate\">${t.text}</span>\n                          </div>\n                          <div class=\"flex items-center gap-1 shrink-0\">\n                            <span class=\"text-[9px] text-cyan-700 font-mono bg-cyan-50 px-1 py-0.2 rounded\">${t.date ? t.date.slice(5) : ''}</span>\n                            <button onclick=\"removeTodoItem('${dog.id}', '${t.id}')\" class=\"text-slate-300 hover:text-rose-500 text-[10px] p-0.5\">\n                              <i class=\"fa-solid fa-xmark\"></i>\n                            </button>\n                          </div>\n                        </div>\n                      `).join('')}\n                    </div>\n                  </div>\n\n                  <!-- SUBFRAME 2: 과거 전체 내역 조회 & 즉시 수동 기록 -->\n                  <div class=\"bg-indigo-50/30 rounded-xl p-2.5 border border-indigo-200/70 flex flex-col\">\n                    <div class=\"flex items-center justify-between pb-1.5 mb-1.5 border-b border-indigo-200/50 text-xs\">\n                      <div class=\"flex items-center gap-1.5\">\n                        <span class=\"font-bold text-indigo-950 flex items-center gap-1 text-[11px]\">\n                          <i class=\"fa-solid fa-timeline text-indigo-600\"></i> 과거 내역 & 즉시 수동기록\n                        </span>\n                        <span class=\"text-[9px] text-slate-400 bg-indigo-100/60 px-1.5 py-0.2 rounded font-medium\">클릭 시 자동복사</span>\n                      </div>\n                      <span class=\"text-[9px] text-indigo-700 font-semibold\">${dog.dones.length}건 누적</span>\n                    </div>\n\n                    <!-- Direct Done Input -->\n                    <div class=\"flex flex-wrap items-center gap-1 mb-2\">\n                      <input type=\"text\" id=\"directDoneInput_${dog.id}\" placeholder=\"만성 케어 즉시 수동기록 (시간 자동저장)\"\n                             class=\"flex-1 min-w-[150px] bg-white border border-indigo-300 rounded px-2 py-1 text-xs text-slate-800 focus:outline-hidden focus:border-indigo-500 shadow-2xs\"\n                             onkeydown=\"if(event.key==='Enter') addDirectDone('${dog.id}')\">\n                      <button onclick=\"addDirectDone('${dog.id}')\" class=\"px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded transition shrink-0 flex items-center gap-1\">\n                        <i class=\"fa-solid fa-check text-[9px]\"></i> 등록\n                      </button>\n                      <button type=\"button\" onclick=\"event.stopPropagation(); saveDogChartText('${dog.id}')\" title=\"누적 기록을 날짜·시간과 함께 텍스트로 저장\" class=\"px-2 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md text-[10px] font-bold whitespace-nowrap shrink-0\"><i class=\"fa-solid fa-file-arrow-down mr-1\"></i>챠트기록</button>\n                      <button type=\"button\" onclick=\"event.stopPropagation(); reopenToActive('${dog.id}')\" class=\"px-2 py-1 bg-slate-100 hover:bg-rose-50 text-slate-700 hover:text-rose-600 font-bold text-[10px] rounded border border-slate-200 transition flex items-center gap-1 whitespace-nowrap shrink-0\"><i class=\"fa-solid fa-rotate-left text-[9px]\"></i><span>집중관리 복귀</span></button>\n                    </div>\n\n                    <!-- Done List (클릭 시 자동 복사) -->\n                    <div class=\"space-y-1 max-h-48 overflow-y-auto pr-0.5\">\n                      ${dog.dones.length === 0 ? `\n                        <div class=\"text-center py-4 text-[10px] text-slate-400\">과거 기록이 없습니다.</div>\n                      ` : [...dog.dones].reverse().map(d => `\n                        <div class=\"group copyable-row flex items-center justify-between gap-1.5 p-1.5 rounded bg-indigo-50/70 border border-indigo-100 cursor-pointer transition select-none\"\n                             onclick=\"copyDoneText('${d.text.replace(/'/g, \"\\'\")}', '${d.doneAt}')\"\n                             title=\"클릭 시 내용과 일시가 클립보드에 자동 복사됩니다.\">\n                          \n                          <div class=\"flex items-center gap-1.5 min-w-0 flex-1\">\n                            ${getSourceIcon(d.source)}\n                            <span class=\"text-[9px] text-emerald-800 bg-emerald-100/90 px-1 py-0.2 rounded font-mono font-bold shrink-0\">${d.doneAt || '일시 미기록'}</span>\n                            <span class=\"text-xs font-medium text-slate-800 truncate\">${d.text}</span>\n                          </div>\n\n                          <div class=\"flex items-center gap-1 shrink-0\">\n                            <span class=\"text-slate-400 hover:text-indigo-600 text-[10px] p-0.5\" title=\"복사\">\n                              <i class=\"fa-regular fa-copy\"></i>\n                            </span>\n                            <button onclick=\"event.stopPropagation(); removeDoneItem('${dog.id}', '${d.id}')\" title=\"삭제\" class=\"text-slate-300 hover:text-rose-500 text-[10px] p-0.5\">\n                              <i class=\"fa-solid fa-trash-can\"></i>\n                            </button>\n                          </div>\n                        </div>\n                      `).join('')}\n                    </div>\n                  </div>\n\n                </div>\n\n              </div>\n            ` : ''}\n\n          </div>\n        `;\n      }).join('');\n    }\n\n    // -------------------------------------------------------------\n    // INTERACTION ACTIONS\n    // -------------------------------------------------------------\n    \n    // Add To-Do Item\n    function addTodoItem(dogId) {\n      const input = document.getElementById(`todoInput_${dogId}`);\n      const dateInput = document.getElementById(`dateInput_${dogId}`);\n      const text = input.value.trim();\n      const date = dateInput ? dateInput.value : getTodayString();\n\n      if (!text) return;\n\n      const dog = dogs.find(d => d.id === dogId);\n      if (dog) {\n        dog.todos.push({\n          id: \"t_\" + Date.now(),\n          text: text,\n          date: date\n        });\n        saveState();\n        renderAll();\n        showToast(\"할 일이 등록되었습니다.\");\n      }\n    }\n\n    // Direct Done Item (수동 직접 입력: source = \"manual\")\n    function addDirectDone(dogId) {\n      const input = document.getElementById(`directDoneInput_${dogId}`);\n      const text = input.value.trim();\n      if (!text) return;\n\n      const dog = dogs.find(d => d.id === dogId);\n      if (dog) {\n        dog.dones.push({\n          id: \"d_direct_\" + Date.now(),\n          text: text,\n          doneAt: getNowString(),\n          source: \"manual\" // 수동 입력 태그\n        });\n        saveState();\n        renderAll();\n        showToast(`즉시 실행 기록 완료: \"${text.substring(0, 10)}...\"`);\n      }\n    }\n\n    // Complete To-Do Item -> Moves to Done with source = \"schedule\"\n    function completeTodoItem(dogId, todoId) {\n      const dog = dogs.find(d => d.id === dogId);\n      if (!dog) return;\n\n      const idx = dog.todos.findIndex(t => t.id === todoId);\n      if (idx !== -1) {\n        const item = dog.todos.splice(idx, 1)[0];\n        dog.dones.push({\n          id: \"d_\" + Date.now(),\n          text: item.text,\n          doneAt: getNowString(),\n          source: \"schedule\" // 스케줄 완료 태그\n        });\n        saveState();\n        renderAll();\n        showToast(\"완료 표시되어 '한 일' 목록으로 즉시 이동되었습니다.\");\n      }\n    }\n\n    // Remove To-Do\n    function removeTodoItem(dogId, todoId) {\n      const dog = dogs.find(d => d.id === dogId);\n      if (dog) {\n        dog.todos = dog.todos.filter(t => t.id !== todoId);\n        saveState();\n        renderAll();\n      }\n    }\n\n    // Remove Done item\n    function removeDoneItem(dogId, doneId) {\n      const dog = dogs.find(d => d.id === dogId);\n      if (dog) {\n        dog.dones = dog.dones.filter(d => d.id !== doneId);\n        saveState();\n        renderAll();\n        showToast(\"완료 기록이 삭제되었습니다.\", \"fa-trash\", true);\n      }\n    }\n\n    // Transfer dog to chronic\n    function promoteSingleToChronic(dogId) {\n      const dog = dogs.find(d => d.id === dogId);\n      if (!dog) return;\n\n      if (!confirm(`'${dog.name}'의 집중관리를 종료하고 [만성관리]로 이관하시겠습니까?`)) {\n        return;\n      }\n\n      dog.dones.push({\n        id: \"promo_\" + Date.now(),\n        text: `[관리이관] 집중치료 완료 후 만성관리 모니터링 체제로 전환`,\n        doneAt: getNowString(),\n        source: \"manual\"\n      });\n\n      dog.category = \"chronic\";\n      dog.isExpanded = true;\n\n      saveState();\n      renderAll();\n      showToast(`'${dog.name}'이(가) 만성관리로 이관되었습니다!`);\n    }\n\n    // Reopen to active\n    function reopenToActive(dogId) {\n      const dog = dogs.find(d => d.id === dogId);\n      if (!dog) return;\n\n      dog.dones.push({\n        id: \"reopen_\" + Date.now(),\n        text: `[재입원/재집중치료] 집중관리 상태로 재이관`,\n        doneAt: getNowString(),\n        source: \"manual\"\n      });\n\n      dog.category = \"active\";\n      dog.isExpanded = true;\n\n      saveState();\n      renderAll();\n      showToast(`'${dog.name}' 환견이 집중관리 영역으로 복귀되었습니다.`);\n    }\n\n    // Delete Patient on Death (동물이름 바로 옆 휴지통)\n    function deleteDogForDeath(dogId, dogName) {\n      if (!confirm(`[사망/퇴원 처리] 정말로 '${dogName}' 환견의 챠트를 삭제하시겠습니까?\n삭제된 데이터는 복구할 수 없습니다.`)) {\n        return;\n      }\n\n      dogs = dogs.filter(d => d.id !== dogId);\n      saveState();\n      renderAll();\n      showToast(`'${dogName}' 환견의 챠트가 삭제되었습니다.`, \"fa-trash\", true);\n    }\n\n    // Modal\n    function openDogModal(category = \"active\") {\n      document.getElementById(\"newDogForm\").reset();\n      document.getElementById(\"inputEditDogId\").value = \"\";\n      document.getElementById(\"dogSubmitButton\").textContent = \"등록 완료\";\n      const modal = document.getElementById(\"dogModal\");\n      const targetInput = document.getElementById(\"inputTargetCategory\");\n      const title = document.getElementById(\"modalTitle\");\n      const headerBg = document.getElementById(\"modalHeaderBg\");\n\n      targetInput.value = category;\n\n      if (category === \"active\") {\n        title.innerHTML = '<i class=\"fa-solid fa-heart-pulse\"></i> 집중관리 환견 신규 등록';\n        headerBg.className = \"bg-gradient-to-r from-rose-500 to-amber-500 px-4 py-3 text-white flex justify-between items-center\";\n      } else {\n        title.innerHTML = '<i class=\"fa-solid fa-shield-heart\"></i> 만성관리 환견 신규 등록';\n        headerBg.className = \"bg-gradient-to-r from-teal-600 to-cyan-600 px-4 py-3 text-white flex justify-between items-center\";\n      }\n\n      modal.classList.remove(\"hidden\");\n    }\n\n    function editDog(id) {\n      const dog = dogs.find(d => String(d.id) === String(id)); if (!dog) return;\n      openDogModal(dog.category || \"active\");\n      document.getElementById(\"inputEditDogId\").value = dog.id;\n      document.getElementById(\"modalTitle\").textContent = \"환자정보 수정\";\n      document.getElementById(\"inputDogName\").value = dog.name || \"\";\n      document.getElementById(\"inputDogGuardian\").value = dog.guardian || \"\";\n      document.getElementById(\"inputDogPhone\").value = dog.phone || \"\";\n      document.getElementById(\"inputDogGender\").value = dog.gender || \"\";\n      document.getElementById(\"inputDogAge\").value = dog.age || \"\";\n      document.getElementById(\"inputDogWeight\").value = dog.weight || \"\";\n      document.getElementById(\"inputDogDiagnosis\").value = dog.diagnosis || \"\";\n      document.getElementById(\"inputRiskLevel\").value = dog.risk || \"G\";\n      document.getElementById(\"dogSubmitButton\").textContent = \"수정 저장\";\n    }\n\n    let receptionChoices = [];\n    async function loadReceptionChoices() {\n      const sel = document.getElementById(\"receptionImportSelect\");\n      sel.innerHTML = '<option value=\"\">불러오는 중...</option>';\n      try {\n        const res = await fetch('/api/receptions', { cache: 'no-store' });\n        const raw = await res.json();\n        receptionChoices = Array.isArray(raw) ? raw : (raw.receptions || raw.data || raw.items || []);\n        sel.innerHTML = '<option value=\"\">접수 환자를 선택하세요</option>';\n        receptionChoices.forEach((item, i) => {\n          const payload = typeof item.payload === 'string' ? (() => { try{return JSON.parse(item.payload)}catch(e){return {}} })() : (item.payload || {});\n          const pet = item.pet_name || item.petName || payload.pet_name || payload.petName || payload.pet || '';\n          const owner = item.owner_name || item.ownerName || payload.guardian_name || payload.owner_name || '';\n          const phone = item.phone || item.owner_phone || payload.phone || payload.owner_phone || '';\n          const reason = item.symptom || item.reason || payload.reason || '';\n          const opt = document.createElement('option'); opt.value = String(i);\n          opt.textContent = `${pet || '이름 미기재'} · ${owner || '보호자 미기재'} · ${phone || '번호 미기재'}${reason ? ' · '+reason : ''}`;\n          sel.appendChild(opt);\n        });\n        if (!receptionChoices.length) sel.innerHTML = '<option value=\"\">접수 자료가 없거나 불러오지 못했습니다</option>';\n      } catch (e) { sel.innerHTML = '<option value=\"\">접수 목록을 불러오지 못했습니다</option>'; showToast('접수 목록 불러오기 실패', 'fa-circle-exclamation', true); }\n    }\n    function applyReceptionChoice() {\n      const i = document.getElementById('receptionImportSelect').value;\n      if (i === '' || !receptionChoices[Number(i)]) return;\n      const item = receptionChoices[Number(i)];\n      const payload = typeof item.payload === 'string' ? (() => { try{return JSON.parse(item.payload)}catch(e){return {}} })() : (item.payload || {});\n      const set = (id, value) => { if (value !== undefined && value !== null && String(value).trim()) document.getElementById(id).value = String(value); };\n      set('inputDogName', item.pet_name || item.petName || payload.pet_name || payload.petName || payload.pet);\n      set('inputDogGuardian', item.owner_name || item.ownerName || payload.guardian_name || payload.owner_name);\n      set('inputDogPhone', item.phone || item.owner_phone || payload.phone || payload.owner_phone);\n      let gender = payload.gender || item.gender || ''; if (/^(m|male|수컷|남)$/i.test(gender)) gender='수컷'; else if (/^(f|female|암컷|여)$/i.test(gender)) gender='암컷';\n      set('inputDogGender', gender);\n      set('inputDogAge', payload.age || item.age || '');\n      const weight = payload.weight || item.weight || ''; set('inputDogWeight', weight ? (String(weight).match(/kg/i) ? weight : weight+'kg') : '');\n      set('inputDogDiagnosis', item.symptom || item.reason || payload.reason || payload.diagnosis || '');\n      showToast('접수 정보를 입력폼으로 가져왔습니다. 확인 후 저장하세요.');\n    }\n\n    // 원내 접수현황판에서 전달된 환자 정보를 신규등록 폼에 채웁니다. 자동 저장은 하지 않습니다.\n    window.addEventListener('message', (event) => {\n      const data = event.data;\n      if (!data || data.type !== 'prefill-care-registration' || !data.patient) return;\n      const p = data.patient;\n      openDogModal(p.category === 'chronic' ? 'chronic' : 'active');\n      document.getElementById('inputEditDogId').value = '';\n      document.getElementById('dogSubmitButton').textContent = '등록 완료';\n      document.getElementById('inputRiskLevel').value = p.risk || 'I';\n      const setIf = (id, value) => { if (value !== undefined && value !== null && String(value).trim()) document.getElementById(id).value = String(value); };\n      setIf('inputDogName', p.petName);\n      setIf('inputDogGuardian', p.guardian);\n      setIf('inputDogPhone', p.phone);\n      let gender = p.gender || '';\n      if (/^(m|male|수컷|남)$/i.test(gender)) gender = '수컷'; else if (/^(f|female|암컷|여)$/i.test(gender)) gender = '암컷';\n      setIf('inputDogGender', gender);\n      setIf('inputDogAge', p.age);\n      if (p.weight) setIf('inputDogWeight', /kg/i.test(String(p.weight)) ? p.weight : String(p.weight) + 'kg');\n      setIf('inputDogDiagnosis', p.diagnosis || p.content);\n      const importSelect = document.getElementById('receptionImportSelect');\n      if (importSelect) importSelect.value = '';\n      showToast('접수 환자정보를 불러왔습니다. 확인 후 등록 완료를 눌러주세요.');\n    });\n\n    function closeDogModal() {\n      document.getElementById(\"dogModal\").classList.add(\"hidden\");\n      document.getElementById(\"newDogForm\").reset();\n    }\n\n    // 휴대폰 번호 입력 시 010-1234-5678 형식으로 자동 구분\n    const dogPhoneInput = document.getElementById(\"inputDogPhone\");\n    if (dogPhoneInput) {\n      dogPhoneInput.addEventListener(\"input\", () => {\n        const phoneDigits = Array.from(dogPhoneInput.value)\n          .filter(ch => ch >= \"0\" && ch <= \"9\")\n          .join(\"\")\n          .slice(0, 11);\n        if (phoneDigits.length <= 3) {\n          dogPhoneInput.value = phoneDigits;\n        } else if (phoneDigits.length <= 7) {\n          dogPhoneInput.value = phoneDigits.slice(0, 3) + \"-\" + phoneDigits.slice(3);\n        } else {\n          dogPhoneInput.value = phoneDigits.slice(0, 3) + \"-\" + phoneDigits.slice(3, 7) + \"-\" + phoneDigits.slice(7);\n        }\n      });\n    }\n\n    function handleNewDogSubmit(e) {\n      e.preventDefault();\n      const name = document.getElementById(\"inputDogName\").value.trim();\n      const guardian = document.getElementById(\"inputDogGuardian\").value.trim();\n      const weight = document.getElementById(\"inputDogWeight\").value.trim();\n      const phone = document.getElementById(\"inputDogPhone\").value.trim();\n      const gender = document.getElementById(\"inputDogGender\").value;\n      const age = document.getElementById(\"inputDogAge\").value.trim();\n      const diagnosis = document.getElementById(\"inputDogDiagnosis\").value.trim();\n      const risk = document.getElementById(\"inputRiskLevel\").value;\n      const category = document.getElementById(\"inputTargetCategory\").value;\n      const editId = document.getElementById(\"inputEditDogId\").value;\n      if (!name || !weight || !phone || !diagnosis || !risk) return;\n      if (editId) {\n        const dog = dogs.find(d => String(d.id) === String(editId));\n        if (!dog) { showToast('수정할 환자 정보를 찾지 못했습니다.', 'fa-circle-exclamation', true); return; }\n        Object.assign(dog, {name, guardian, weight, phone, gender, age, diagnosis, risk, content: diagnosis, category});\n        dog.dones = Array.isArray(dog.dones) ? dog.dones : [];\n        dog.dones.unshift({id:'d_edit_'+Date.now(), text:'환자정보 수정 저장', doneAt:getNowString(), source:'manual'});\n        showToast(`'${name}' 환자정보 수정 완료`);\n      } else {\n        const newDog = { id: \"dog_\" + Date.now(), name, guardian, weight, phone, gender, age, diagnosis, risk, content: diagnosis, category, isExpanded: true, todos: [], dones: [{ id: \"d_init_\" + Date.now(), text: `신규 등록 (위험도: ${risk})`, doneAt: getNowString(), source: \"manual\" }] };\n        dogs.unshift(newDog);\n        showToast(`'${name}' 환자 (위험도 ${risk}) 등록 완료!`);\n      }\n      saveState(); renderAll(); closeDogModal();\n    }\n\n    // Save all completed \"한 일\" records for one patient as a plain-text chart\n    function saveDogChartText(dogId) {\n      const dog = dogs.find(d => d.id === dogId);\n      if (!dog) { showToast(\"환자 챠트를 찾을 수 없습니다.\", \"fa-circle-xmark\", true); return; }\n      const lines = [\n        \"23시 하단오거리동물병원 - 집중관리 챠트\",\n        \"========================================\",\n        `동물이름: ${dog.name || \"-\"}`,\n        `보호자: ${dog.guardian || \"-\"}`,\n        `성별/나이: ${(dog.gender || \"-\")} / ${(dog.age || \"-\")}`,\n        `체중: ${dog.weight || \"-\"}`,\n        `연락처: ${dog.phone || \"-\"}`,\n        `진료타이틀: ${dog.diagnosis || \"-\"}`,\n        `위험도: ${dog.risk || \"-\"}`,\n        `분류: ${dog.category === \"active\" ? \"집중관리\" : \"만성관리\"}`,\n        \"\",\n        \"완료 기록 (한 일)\",\n        \"----------------------------------------\"\n      ];\n      const records = Array.isArray(dog.dones) ? dog.dones : [];\n      if (!records.length) lines.push(\"기록된 내용이 없습니다.\");\n      else records.forEach((d, i) => lines.push(`${i+1}. [${d.doneAt || \"일시 미기록\"}] [${d.source === \"schedule\" ? \"스케줄\" : \"수동\"}] ${d.text || \"\"}`));\n      lines.push(\"\", `저장일시: ${getNowString()}`);\n      const blob = new Blob([\"\\uFEFF\" + lines.join(\"\\r\\n\")], {type:\"text/plain;charset=utf-8\"});\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement(\"a\");\n      a.href = url;\n      a.download = `챠트_${(dog.name || \"환자\").replace(/[\\\\/:*?\"<>|]/g, \"_\")}_${getTodayString()}.txt`;\n      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);\n      showToast(`'${dog.name}' 한 일 기록을 텍스트로 저장했습니다.`);\n    }\n\n    // Export / Import\n    function exportData() {\n      const dataStr = \"data:text/json;charset=utf-8,\" + encodeURIComponent(JSON.stringify(dogs, null, 2));\n      const a = document.createElement('a');\n      a.setAttribute(\"href\", dataStr);\n      a.setAttribute(\"download\", `CareFlow_Backup_${new Date().toISOString().slice(0,10)}.json`);\n      document.body.appendChild(a);\n      a.click();\n      a.remove();\n      showToast(\"데이터 백업(JSON) 완료!\");\n    }\n\n    function triggerImport() {\n      document.getElementById(\"importFileInput\").click();\n    }\n\n    function importData(e) {\n      const file = e.target.files[0];\n      if (!file) return;\n\n      const reader = new FileReader();\n      reader.onload = function(evt) {\n        try {\n          const imported = JSON.parse(evt.target.result);\n          if (Array.isArray(imported)) {\n            dogs = imported;\n            saveState();\n            renderAll();\n            showToast(\"백업 데이터 복원 완료!\");\n          }\n        } catch(err) {\n          showToast(\"잘못된 파일입니다.\", \"fa-circle-xmark\", true);\n        }\n      };\n      reader.readAsText(file);\n    }\n\n    function updateClock() {\n      const el = document.getElementById(\"clockText\");\n      if (el) {\n        const now = new Date();\n        el.textContent = now.toLocaleTimeString('ko-KR', { hour12: false });\n      }\n    }\n\n    function setCareView(view) {\n      const dashboard = document.getElementById('careDashboard');\n      if (!dashboard) return;\n      dashboard.dataset.view = view;\n      document.querySelectorAll('.care-tab').forEach(btn => btn.classList.remove('active-tab'));\n      const activeTab = document.getElementById(view === 'active' ? 'tabActive' : view === 'chronic' ? 'tabChronic' : 'tabBoth');\n      if (activeTab) activeTab.classList.add('active-tab');\n      // View-only change; patient data remains untouched.\n    }\n\n    window.addEventListener(\"DOMContentLoaded\", () => {\n      setCareView('active');\n      loadState();\n      parent.postMessage({ type: 'care-chart-ready' }, '*');\n      setInterval(updateClock, 1000);\n      updateClock();\n    });\n  <\\/script>\n</body>\n</html>\n";
