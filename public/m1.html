n</head>\n<body class=\"bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8\">\n\n  <div class=\"max-w-6xl mx-auto space-y-6\">\n    \n    <!-- 1. 헤더 (원본 규격) -->\n    <header class=\"flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-5 rounded-2xl shadow-sm border border-slate-200 gap-4\">\n      <div>\n        <div class=\"flex items-center gap-2\">\n          <span class=\"w-3 h-3 bg-emerald-500 rounded-full animate-ping\"></span>\n          <h1 class=\"text-2xl font-bold text-slate-900 tracking-tight\">원내 접수 현황판</h1>\n        </div>\n        <p class=\"text-sm text-slate-500 mt-1\">실시간 접수 현황 및 초진 서식 출력 관리</p>\n      </div>\n      \n      <!-- 컨트롤 버튼 -->\n      <div class=\"flex items-center gap-3\">\n        <button id=\"soundToggleBtn\" onclick=\"toggleSound()\" class=\"px-3.5 py-2 rounded-xl border text-sm font-medium transition flex items-center gap-1.5 bg-slate-100 text-slate-600 border-slate-300\">\n          <span id=\"soundIcon\">🔔</span>\n          <span id=\"soundText\">알림음 켜짐</span>\n        </button>\n        <button onclick=\"fetchReceptions(true)\" class=\"px-4 py-2 bg-slate-900 text-white rounded-xl text-sm font-semibold hover:bg-slate-800 transition\">\n          새로고침\n        </button>\n      </div>\n    </header>\n\n    <!-- [원내 공지사항 관리 바 - 원본 스타일에 녹아들도록 정돈] -->\n    <div class=\"flex flex-col sm:flex-row items-stretch sm:items-center gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm\">\n      <div class=\"inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-800 text-xs font-bold px-3 py-1.5 rounded-full border border-emerald-200 shrink-0 w-fit\">\n        <span>📢</span>\n        <span>원내 공지 설정</span>\n      </div>\n      <textarea \n        id=\"adminNoticeInput\" \n        rows=\"1\"\n        placeholder=\"접수 키오스크에 띄울 소식을 입력하세요 (엔터를 치면 여러 공지가 순차 롤링됩니다)\" \n        class=\"flex-1 w-full text-sm bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-slate-800 focus:outline-none focus:border-emerald-500 focus:bg-white transition resize-y min-h-[38px] max-h-[100px]\"\n      ></textarea>\n      <div class=\"flex items-center gap-2 shrink-0 self-end sm:self-center\">\n        <button \n          type=\"button\" \n          id=\"btnNoticeSave\" \n          onclick=\"saveNoticeToDB()\" \n          class=\"px-4 py-2 bg-slate-900 text-white text-xs font-bold rounded-xl hover:bg-slate-800 transition shadow-sm cursor-pointer\">\n          게시하기\n        </button>\n        <button \n          type=\"button\" \n          onclick=\"clearNoticeInDB()\" \n          class=\"px-3 py-2 bg-slate-100 text-slate-600 border border-slate-200 text-xs font-medium rounded-xl hover:bg-slate-200 transition cursor-pointer\">\n          내용 지우기\n        </button>\n      </div>\n    </div>\n\n    <!-- 2. 요약 통계 (원본 가로 3개 배치 완벽 복원) -->\n    <div class=\"grid grid-cols-3 gap-4\">\n      <div class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center\">\n        <p class=\"text-xs font-semibold text-slate-400\">접수 대기</p>\n        <p id=\"count-waiting\" class=\"text-2xl font-bold text-amber-600 mt-1\">0</p>\n      </div>\n      <div class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center\">\n        <p class=\"text-xs font-semibold text-slate-400\">진료 중</p>\n        <p id=\"count-progress\" class=\"text-2xl font-bold text-emerald-600 mt-1\">0</p>\n      </div>\n      <div class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center\">\n        <p class=\"text-xs font-semibold text-slate-400\">오늘 완료</p>\n        <p id=\"count-done\" class=\"text-2xl font-bold text-slate-500 mt-1\">3</p>\n      </div>\n    </div>\n\n    <!-- 3. 접수 목록 (원본 카드 레이아웃 완벽 복원) -->\n    <div id=\"list-container\" class=\"space-y-4\">\n      <div class=\"text-center py-12 text-slate-400 text-sm\">접수 내역을 확인하는 중입니다...</div>\n    </div>\n  </div>\n\n  <!-- 원클릭 복사 시 뜨는 플로팅 토스트 알림 -->\n  <div id=\"copyToast\" class=\"fixed bottom-6 right-6 z-50 transform transition-all duration-300 opacity-0 translate-y-4 pointer-events-none bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2 border border-slate-700\">\n    <span class=\"text-emerald-400\">✓</span>\n    <span id=\"toastMsg\">클립보드에 복사되었습니다!</span>\n  </div>\n\n  <!-- A4 맞춤형 초진접수 및 개인정보 동의서 템플릿 (화면 밖 렌더링) -->\n  <div id=\"print-sheet\">\n    <div>\n      <div class=\"flex justify-between items-end border-b-2 border-slate-900 pb-3\">\n        <div>\n          <span class=\"text-xs font-bold tracking-widest text-[#006257]\">23시 하단오거리동물병원 · CLINIC FLOW</span>\n          <h2 class=\"text-2xl font-black text-slate-900 mt-0.5 tracking-tight\">초진접수 및 개인정보 동의서</h2>\n          <p class=\"text-[11px] text-slate-500 mt-0.5\">본 서식은 내원 시 보호자가 직접 작성한 전자 접수 및 법적 동의서 원본입니다.</p>\n        </div>\n        <div class=\"text-right pb-0.5\">\n          <div class=\"text-xs font-mono font-bold text-slate-500\" id=\"doc-id\">접수번호: #0</div>\n          <div class=\"text-sm font-black text-slate-900 mt-0.5 tracking-tight\" id=\"doc-date\">접수일시: 2026-00-00 00:00:00</div>\n        </div>\n      </div>\n\n      <div class=\"mt-4 mb-3\">\n        <h3 class=\"text-xs font-bold text-slate-800 mb-1.5 flex items-center gap-1\">\n          <span class=\"w-1.5 h-3 bg-[#006257] rounded-sm\"></span> 1. 보호자 및 반려동물 인적사항\n        </h3>\n        <table class=\"w-full border-collapse border border-slate-300 text-xs\">\n          <tr>\n            <th class=\"border border-slate-300 bg-slate-100 text-slate-700 py-2 px-3 w-24 text-left align-middle font-bold\">보호자 성함</th>\n            <td class=\"border border-slate-300 py-2 px-3 font-semibold w-56 align-middle\" id=\"doc-guardian\">-</td>\n            <th class=\"border border-slate-300 bg-slate-100 text-slate-700 py-2 px-3 w-24 text-left align-middle font-bold\">연락처</th>\n            <td class=\"border border-slate-300 py-2 px-3 font-mono font-semibold align-middle\" id=\"doc-phone\">-</td>\n          </tr>\n          <tr>\n            <th class=\"border border-slate-300 bg-slate-100 text-slate-700 py-2 px-3 text-left align-middle font-bold\">주소</th>\n            <td class=\"border border-slate-300 py-2 px-3 text-slate-800 align-middle\" id=\"doc-address\">-</td>\n            <th class=\"border border-slate-300 bg-slate-100 text-slate-700 py-2 px-3 text-left align-middle font-bold\">이메일</th>\n            <td class=\"border border-slate-300 py-2 px-3 font-mono text-slate-800 align-middle\" id=\"doc-email\"></td>\n          </tr>\n          <tr>\n            <th class=\"border border-slate-300 bg-slate-100 text-slate-700 py-2 px-3 text-left align-middle font-bold\">동물 이름</th>\n            <td class=\"border border-slate-300 py-2 px-3 font-bold text-teal-800 text-sm align-middle\" id=\"doc-pet\">-</td>\n            <th class=\"border border-slate-300 bg-slate-100 text-slate-700 py-2 px-3 text-left align-middle font-bold\">축종 / 품종</th>\n            <td class=\"border border-slate-300 py-2 px-3 align-middle\" id=\"doc-species\">-</td>\n          </tr>\n          <tr>\n            <th class=\"border border-slate-300 bg-slate-100 text-slate-700 py-2 px-3 text-left align-middle font-bold\">성별 / 중성화</th>\n            <td class=\"border border-slate-300 py-2 px-3 font-medium align-middle\" id=\"doc-gender\">-</td>\n            <th class=\"border border-slate-300 bg-slate-100 text-slate-700 py-2 px-3 text-left align-middle font-bold\">생년월일 / 체중</th>\n            <td class=\"border border-slate-300 py-2 px-3 font-medium align-middle\" id=\"doc-birth-weight\">-</td>\n          </tr>\n          <tr>\n            <th class=\"border border-slate-300 bg-amber-50 text-amber-900 py-2 px-3 text-left align-middle font-bold\">성격 및 기질</th>\n            <td colspan=\"3\" class=\"border border-slate-300 py-2 px-3 font-semibold text-amber-900 align-middle\" id=\"doc-character\">특이사항 없음</td>\n          </tr>\n        </table>\n      </div>\n\n      <div class=\"mb-3\">\n        <h3 class=\"text-xs font-bold text-slate-800 mb-1.5 flex items-center gap-1\">\n          <span class=\"w-1.5 h-3 bg-[#006257] rounded-sm\"></span> 2. 주요 증상 및 내원 사유\n        </h3>\n        <div class=\"border border-slate-300 rounded p-3 min-h-[78px] text-xs leading-relaxed text-slate-800 whitespace-pre-wrap bg-slate-50/50 flex items-center\" id=\"doc-reason\">\n          -\n        </div>\n      </div>\n\n      <div class=\"mb-3\">\n        <h3 class=\"text-xs font-bold text-slate-800 mb-1.5 flex items-center gap-1\">\n          <span class=\"w-1.5 h-3 bg-[#006257] rounded-sm\"></span> 3. 추가 처치 희망 항목\n        </h3>\n        <div class=\"border border-slate-300 rounded p-2.5 px-3 text-xs font-medium text-slate-800 bg-white min-h-[36px] flex items-center\" id=\"doc-treatments\">\n          선택 처치 없음\n        </div>\n      </div>\n\n      <div class=\"border-2 border-slate-300 rounded-xl p-3.5 bg-slate-50/70\">\n        <h3 class=\"text-xs font-bold text-slate-900 mb-2 flex items-center justify-between\">\n          <span class=\"flex items-center gap-1\">\n            <span class=\"w-1.5 h-3 bg-emerald-600 rounded-sm\"></span> 4. 개인정보 수집·이용 및 병원 내 안전 수칙 동의 확인\n          </span>\n          <span class=\"text-[11px] text-emerald-700 font-bold bg-emerald-100 px-2 py-0.5 rounded\">✓ 보호자 전자 서명 완료</span>\n        </h3>\n\n        <div class=\"space-y-2 text-[11px] leading-relaxed text-slate-700\">\n          <div class=\"bg-white p-2.5 rounded-lg border border-slate-200 space-y-1\">\n            <div class=\"flex items-center justify-between\">\n              <p class=\"font-bold text-slate-800\">① 개인정보 수집 및 이용 동의</p>\n              <span class=\"text-emerald-600 font-semibold\">[동의함]</span>\n            </div>\n            <ul class=\"list-disc pl-4 space-y-0.5 text-slate-600\">\n              <li><strong class=\"text-slate-700\">수집 항목:</strong> 보호자 성명, 연락처, 접수 정보</li>\n              <li><strong class=\"text-slate-700\">이용 목적:</strong> 진료기록 관리, 접수·예약 및 재진 안내, 휴진·공휴일 관련 SMS·알림톡 발송</li>\n              <li><strong class=\"text-slate-700\">보유 기간:</strong> 목적 달성 시까지 또는 관련 법령에 따른 보존 기간</li>\n              <li><strong class=\"text-slate-700\">동의 거부:</strong> 동의를 거부할 수 있으나, 일부 서비스 이용이 제한될 수 있습니다.</li>\n            </ul>\n            <p class=\"font-medium text-teal-800 pt-0.5 text-[10.5px]\">본원은 개인정보를 명시된 목적에 따라 안전하게 관리합니다.</p>\n          </div>\n\n          <div class=\"bg-white p-2.5 rounded-lg border border-slate-200 space-y-1\">\n            <div class=\"flex items-center justify-between\">\n              <p class=\"font-bold text-slate-800\">② 병원 내 안전 및 유의사항 안내 동의</p>\n              <span class=\"text-emerald-600 font-semibold\">[동의함]</span>\n            </div>\n            <p class=\"text-slate-600\">병원 내에서는 사람과 동물 간의 접촉이나 예기치 못한 상황으로 다툼, 상해, 물품 파손 등이 발생할 수 있습니다. 보호자님께서는 반려동물을 안전하게 관리해 주시고, 다른 보호자와 동물을 배려해 주시기 바랍니다.</p>\n            <p class=\"text-slate-600\">개인 간 분쟁이나 피해가 발생한 경우 당사자 간의 원만한 해결을 원칙으로 하며, 병원은 관련 상황과 책임 범위에 따라 필요한 조치를 취합니다.</p>\n            <p class=\"font-bold text-teal-700 text-[10.5px]\">모두의 안전하고 편안한 진료 환경을 위해 보호자님의 협조와 배려를 부탁드립니다.</p>\n          </div>\n        </div>\n\n        <div class=\"mt-3 pt-3 border-t border-slate-300 flex justify-between items-center px-1\">\n          <div class=\"text-xs space-y-0.5\">\n            <p class=\"text-slate-600\">위 안내 및 동의 조항을 충분히 숙지하였으며, 이에 정식 동의합니다.</p>\n            <p class=\"text-slate-800 font-bold\">동의자(보호자 성함): <span id=\"doc-sign-guardian\" class=\"text-teal-900\">-</span></p>\n          </div>\n\n          <div class=\"flex items-center gap-2\">\n            <span class=\"text-xs font-bold text-slate-500\">서명 (인):</span>\n            <div class=\"w-36 h-16 border border-slate-300 bg-white rounded-lg flex items-center justify-center p-1 shadow-inner overflow-hidden\">\n              <img id=\"doc-signature-img\" src=\"\" alt=\"보호자 전자 서명\" class=\"max-h-full max-w-full object-contain\">\n              <span id=\"doc-no-sign\" class=\"text-[11px] text-slate-400 hidden\">서명 없음</span>\n            </div>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"border-t border-slate-300 pt-2 text-[10px] text-slate-400 flex justify-between items-center\">\n        <span>• 23시 하단오거리동물병원 전자 의무기록 관리 시스템 (CLINIC FLOW)</span>\n        <span>인쇄일시: <script>document.write(new Date().toLocaleDateString('ko-KR'))<\/script></span>\n      </div>\n    </div>\n  </div>\n\n  <script>\n    let soundEnabled = true;\n    let knownIds = new Set();\n    let isFirstLoad = true;\n    let currentList = [];\n\n    function copyText(text, label = '텍스트') {\n      if (!text || text === '-' || text === '미기재') return;\n\n      if (navigator.clipboard && window.isSecureContext) {\n        navigator.clipboard.writeText(text).then(() => {\n          showToast(`📋 ${label} 복사 완료!`);\n        }).catch(() => fallbackCopy(text, label));\n      } else {\n        fallbackCopy(text, label);\n      }\n    }\n\n    function fallbackCopy(text, label) {\n      const ta = document.createElement('textarea');\n      ta.value = text;\n      ta.style.position = 'fixed';\n      ta.style.left = '-9999px';\n      document.body.appendChild(ta);\n      ta.select();\n      try {\n        document.execCommand('copy');\n        showToast(`📋 ${label} 복사 완료!`);\n      } catch (err) {\n        alert('복사에 실패했습니다. 내용을 직접 드래그해 주세요.');\n      }\n      document.body.removeChild(ta);\n    }\n\n    function copyReason(id) {\n      const item = currentList.find(x => x.id === id);\n      if (!item) return;\n      const payload = unwrapPayload(item.payload);\n      const reason = (payload.reason && payload.reason.trim())\n        || (item.symptom && item.symptom.trim())\n        || (item.symptoms && item.symptoms.trim())\n        || '';\n\n      if (!reason || reason === '작성된 내원 사유가 없습니다.') {\n        showToast('복사할 내원 사유가 없습니다.');\n        return;\n      }\n      copyText(reason, '내원 사유');\n    }\n\n    function showToast(msg) {\n      const toast = document.getElementById('copyToast');\n      const toastMsg = document.getElementById('toastMsg');\n      if (!toast) return;\n\n      toastMsg.innerText = msg;\n      toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');\n      toast.classList.add('opacity-100', 'translate-y-0');\n\n      clearTimeout(window.toastTimer);\n      window.toastTimer = setTimeout(() => {\n        toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');\n        toast.classList.remove('opacity-100', 'translate-y-0');\n      }, 2200);\n    }\n\n    async function deleteReception(id, petName) {\n      if (!confirm(`[${petName}] 환자의 접수 내역을 정말 삭제하시겠습니까?\\n삭제 후에는 복구할 수 없습니다.`)) {\n        return;\n      }\n\n      try {\n        const res = await fetch(`/api/receptions?id=${id}`, {\n          method: 'DELETE',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ id: id })\n        });\n\n        if (!res.ok) {\n          throw new Error('삭제 처리 오류 (' + res.status + ')');\n        }\n\n        showToast(`🗑️ [${petName}] 접수 내역이 삭제되었습니다.`);\n        fetchReceptions();\n      } catch (err) {\n        alert('삭제 실패: ' + err.message);\n      }\n    }\n\n    function playDingDong() {\n      if (!soundEnabled) return;\n      try {\n        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n        const now = audioCtx.currentTime;\n\n        const osc1 = audioCtx.createOscillator();\n        const gain1 = audioCtx.createGain();\n        osc1.frequency.setValueAtTime(659.25, now);\n        gain1.gain.setValueAtTime(0.2, now);\n        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.45);\n        osc1.connect(gain1);\n        gain1.connect(audioCtx.destination);\n        osc1.start(now);\n        osc1.stop(now + 0.45);\n\n        const osc2 = audioCtx.createOscillator();\n        const gain2 = audioCtx.createGain();\n        osc2.frequency.setValueAtTime(523.25, now + 0.22);\n        gain2.gain.setValueAtTime(0.25, now + 0.22);\n        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.85);\n        osc2.connect(gain2);\n        gain2.connect(audioCtx.destination);\n        osc2.start(now + 0.22);\n        osc2.stop(now + 0.85);\n      } catch (err) {}\n    }\n\n    function toggleSound() {\n      soundEnabled = !soundEnabled;\n      const btn = document.getElementById('soundToggleBtn');\n      const icon = document.getElementById('soundIcon');\n      const text = document.getElementById('soundText');\n      if (soundEnabled) {\n        btn.className = \"px-3.5 py-2 rounded-xl border text-sm font-medium transition flex items-center gap-1.5 bg-emerald-50 text-emerald-700 border-emerald-300\";\n        icon.innerText = \"🔔\";\n        text.innerText = \"알림음 켜짐\";\n        playDingDong();\n      } else {\n        btn.className = \"px-3.5 py-2 rounded-xl border text-sm font-medium transition flex items-center gap-1.5 bg-slate-100 text-slate-600 border-slate-300\";\n        icon.innerText = \"🔇\";\n        text.innerText = \"알림음 켜기\";\n      }\n    }\n\n    function sendReceptionToCare(id) {\n      const item = (currentList || []).find(row => String(row.id) === String(id));\n      if (!item) { alert('접수 정보를 찾지 못했습니다. 현황판을 새로고침한 뒤 다시 시도해 주세요.'); return; }\n      const payload = unwrapPayload(item.payload);\n      const patient = {\n        petName: item.pet_name || item.petName || payload.pet_name || payload.petName || payload.pet || '',\n        guardian: payload.guardian_name || item.owner_name || item.ownerName || payload.owner_name || '',\n        phone: item.phone || item.owner_phone || payload.phone || payload.owner_phone || '',\n        gender: payload.gender || item.gender || '',\n        age: payload.age || item.age || '',\n        weight: payload.weight || item.weight || '',\n        diagnosis: item.symptom || item.reason || payload.reason || payload.diagnosis || '',\n        content: item.symptom || item.reason || payload.reason || payload.diagnosis || '',\n        category: 'active', risk: 'I'\n      };\n      if (!patient.petName) { alert('동물이름이 없어 전송할 수 없습니다.'); return; }\n      parent.postMessage({ type: 'send-reception-to-care', patient }, '*');\n    }\n\n    async function fetchReceptions(manual = false) {\n      try {\n        const res = await fetch('/api/receptions');\n        const data = await res.json();\n        if (!Array.isArray(data)) return;\n\n        currentList = data;\n\n        let waiting = 0, progress = 0, done = 0;\n        let hasNew = false;\n\n        data.forEach(item => {\n          const isWait = (item.status === '접수대기' || item.status === '대기');\n          const isProg = (item.status === '진료중');\n          const isComp = (item.status === '완료');\n\n          if (isWait) waiting++;\n          else if (isProg) progress++;\n          else if (isComp) done++;\n\n          if (!isFirstLoad && !knownIds.has(item.id) && isWait) {\n            hasNew = true;\n          }\n        });\n\n        document.getElementById('count-waiting').innerText = waiting;\n        document.getElementById('count-progress').innerText = progress;\n        document.getElementById('count-done').innerText = done;\n\n        if (hasNew) playDingDong();\n\n        knownIds = new Set(data.map(d => d.id));\n        isFirstLoad = false;\n\n        renderList(data);\n      } catch (e) {\n        console.error(\"조회 실패:\", e);\n      }\n    }\n\n    function unwrapPayload(raw) {\n      if (!raw) return {};\n      let current = raw;\n      try {\n        while (typeof current === 'string') {\n          current = JSON.parse(current);\n        }\n      } catch (e) {}\n      return (current && typeof current === 'object') ? current : {};\n    }\n\n    function getBirthDate(payload, item) {\n      return payload.birth_date || payload.birthDate || payload.birth || payload.birthday || item.birth_date || item.birthday || '';\n    }\n\n    function calculateAgeText(birthDateValue) {\n      if (!birthDateValue) return '';\n      const match = String(birthDateValue).trim().match(/^(\\d{4})[.\\-/년 ]\\s*(\\d{1,2})?(?:[.\\-/월 ]\\s*(\\d{1,2})일?)?$/);\n      if (!match) return '';\n\n      const year = Number(match[1]);\n      const month = match[2] ? Number(match[2]) : 1;\n      const day = match[3] ? Number(match[3]) : 1;\n      if (year < 1900 || month < 1 || month > 12 || day < 1 || day > 31) return '';\n\n      const birth = new Date(year, month - 1, day);\n      if (birth.getFullYear() !== year || birth.getMonth() !== month - 1 || birth.getDate() !== day) return '';\n\n      const today = new Date();\n      if (birth > today) return '';\n\n      let years = today.getFullYear() - year;\n      let months = today.getMonth() - (month - 1);\n      if (today.getDate() < day) months--;\n      if (months < 0) {\n        years--;\n        months += 12;\n      }\n      if (years < 0) return '';\n      if (years === 0) return `${months}개월`;\n      return months === 0 ? `${years}년` : `${years}년 ${months}개월`;\n    }\n\n    function getGenderText(payload, item) {\n      const rawGender = (payload.gender || item.gender || '').trim().toLowerCase();\n      const neuteredRaw = payload.neutered ?? payload.is_neutered ?? item.neutered;\n      const neutered = neuteredRaw === true || neuteredRaw === 'true'\n        || neuteredRaw === 'Y' || neuteredRaw === 'y' || neuteredRaw === 1\n        || neuteredRaw === '1';\n\n      let symbol = '';\n      if (['수컷', '남', 'male', 'm', '♂'].includes(rawGender)) symbol = '♂';\n      else if (['암컷', '여', 'female', 'f', '♀'].includes(rawGender)) symbol = '♀';\n      else if (rawGender) return `${payload.gender || item.gender}${neutered ? ' ✓' : ''}`;\n\n      if (!symbol) return '';\n      return neutered ? `${symbol}✓` : symbol;\n    }\n\n    function getPetCharacter(payload, item) {\n      const val = payload.character \n        || payload.personality \n        || payload.temperament \n        || payload.temper \n        || payload.traits \n        || item.character \n        || item.personality \n        || '';\n      if (Array.isArray(val)) return val.join(', ');\n      return typeof val === 'string' ? val.trim() : '';\n    }\n\n    // ==========================================================\n    // 🎨 [1번 캡처 원본 그대로 100% 완벽 복원된 렌더링 함수]\n    // ==========================================================\n    function isFocusManaged(payload, item) {\n      try {\n        const saved = localStorage.getItem(\"careflow_vet_data_v6\");\n        if (!saved) return false;\n        const dogs = JSON.parse(saved);\n        if (!Array.isArray(dogs)) return false;\n        const digits = value => String(value || \"\").replace(/\\D/g, \"\");\n        const petName = String(item.pet_name || \"\").trim().replace(/\\s+/g, \"\").toLowerCase();\n        const receptionPhone = digits(item.phone || item.owner_phone || payload.phone || payload.owner_phone);\n        if (!petName) return false;\n        return dogs.some(dog => {\n          if (dog.category !== \"active\") return false;\n          const chartName = String(dog.name || \"\").trim().replace(/\\s+/g, \"\").toLowerCase();\n          if (!chartName || chartName !== petName) return false;\n          const chartPhone = digits(dog.phone);\n          // 양쪽에 전화번호가 있으면 전체 번호까지 일치해야 같은 환자로 판단\n          if (chartPhone && receptionPhone) return chartPhone === receptionPhone;\n          // 전화번호가 한쪽이라도 없으면 이름 일치로만 표시\n          return true;\n        });\n      } catch (e) {\n        console.error(\"집중관리 차트 확인 오류:\", e);\n        return false;\n      }\n    }\n\n    function renderList(list) {\n      const container = document.getElementById('list-container');\n      if (list.length === 0) {\n        container.innerHTML = `<div class=\"bg-white p-12 text-center rounded-2xl border border-slate-200 text-slate-400 text-sm\">현재 대기 중인 접수 환자가 없습니다.</div>`;\n        return;\n      }\n\n      container.innerHTML = list.map(item => {\n        const payload = unwrapPayload(item.payload);\n\n        const isFirst = item.type === 'FIRST' || item.type === '초진';\n        const typeBadge = isFirst\n          ? `<span class=\"bg-sky-100 text-sky-800 text-xs px-2.5 py-1 rounded-md font-bold\">초진</span>`\n          : `<span class=\"bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-md font-bold\">재진</span>`;\n\n        const focusBadge = isFocusManaged(payload, item)\n          ? `<span class=\"inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-red-100 text-red-800 border border-red-300 text-xs font-extrabold shadow-sm\" title=\"집중관리 차트에 등록된 환자\">🔴 집중관리</span>`\n          : '';\n\n        const isWait = (item.status === '접수대기' || item.status === '대기');\n        const isProg = (item.status === '진료중');\n        const isComp = (item.status === '완료');\n\n        let statusClass = \"bg-amber-50 text-amber-700 border-amber-200\";\n        if (isProg) statusClass = \"bg-emerald-50 text-emerald-700 border-emerald-200\";\n        if (isComp) statusClass = \"bg-slate-100 text-slate-400 border-slate-200\";\n\n        const downloadBtn = isFirst ? `\n          <button onclick='downloadIntakeSheet(${JSON.stringify(item)})' class=\"px-2.5 py-1 text-xs font-semibold rounded-lg bg-sky-50 hover:bg-sky-100 text-sky-700 transition flex items-center gap-1 border border-sky-200 shadow-sm\">\n            📄 A4 초진·동의서 저장\n          </button>\n        ` : '';\n\n        const dateStrRaw = item.created_at ? item.created_at.replace(' ', 'T') : '';\n        const timeStr = dateStrRaw ? new Date(dateStrRaw).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';\n        const phone = item.phone || item.owner_phone || '-';\n        const email = (payload.email || item.email || '').trim();\n\n        const birthDateVal = getBirthDate(payload, item);\n        const ageText = calculateAgeText(birthDateVal);\n\n        const speciesText = String(payload.species || item.species || '').trim().toLowerCase();\n        const breedText = String(payload.breed || item.breed || '').trim().toLowerCase();\n        const isHamster = speciesText.includes('햄스터') || speciesText.includes('hamster')\n          || breedText.includes('햄스터') || breedText.includes('hamster');\n\n        const ageYearsMatch = ageText.match(/^(\\d+)년/);\n        const ageMonthsMatch = ageText.match(/^(\\d+)개월$/);\n        const ageYearPart = ageYearsMatch ? Number(ageYearsMatch[1]) : 0;\n        const ageMonthPart = ageText.match(/년\\s*(\\d+)개월/);\n        const ageMonthsOnly = ageMonthsMatch ? Number(ageMonthsMatch[1]) : 0;\n        const totalAgeMonths = ageMonthsMatch\n          ? ageMonthsOnly\n          : (ageYearPart * 12) + (ageMonthPart ? Number(ageMonthPart[1]) : 0);\n        const isSeniorPatient = isHamster\n          ? totalAgeMonths >= 18\n          : ageYearPart >= 10;\n\n        const seniorWarningText = isHamster\n          ? '햄스터 1년 6개월 이상 - 고령 환자 주의'\n          : '10년 이상 고령 환자 - 주의 깊은 확인 필요';\n\n        const birthBadge = birthDateVal\n          ? ` · 🎂 ${birthDateVal}${ageText ? ` <span class=\"inline-flex items-center ml-1 px-2 py-0.5 rounded-full ${isSeniorPatient ? 'bg-red-100 border-2 border-red-600 text-red-900 font-black ring-1 ring-red-300' : 'bg-gradient-to-r from-amber-100 via-pink-100 to-violet-100 border border-violet-300 text-violet-800 font-extrabold'} shadow-sm\" ${isSeniorPatient ? `title=\"${seniorWarningText}\"` : ''}>${ageText}</span>` : ''}`\n          : '';\n        const genderVal = getGenderText(payload, item);\n\n        function getGenderBadgeHtml(value) {\n          if (value === '♂✓') {\n            return `<span class=\"inline-flex items-center gap-1 ml-1 px-2 py-0.5 rounded-full bg-violet-50 border-2 border-violet-500 text-violet-900 font-extrabold shadow-sm\" title=\"중성화수컷\"><span class=\"text-blue-700\">♂</span><span class=\"text-violet-800\">✓</span><span class=\"text-[10px]\">중성화</span></span>`;\n          }\n          if (value === '♀✓') {\n            return `<span class=\"inline-flex items-center gap-1 ml-1 px-2 py-0.5 rounded-full bg-violet-50 border-2 border-violet-500 text-violet-900 font-extrabold shadow-sm\" title=\"중성화암컷\"><span class=\"text-rose-600\">♀</span><span class=\"text-violet-800\">✓</span><span class=\"text-[10px]\">중성화</span></span>`;\n          }\n          if (value === '♂') {\n            return `<span class=\"inline-flex items-center justify-center ml-1 min-w-8 px-2 py-0.5 rounded-lg bg-blue-50 border-2 border-blue-400 text-blue-700 text-base font-black shadow-sm\" title=\"수컷\">♂</span>`;\n          }\n          if (value === '♀') {\n            return `<span class=\"inline-flex items-center justify-center ml-1 min-w-8 px-2 py-0.5 rounded-lg bg-rose-50 border-2 border-rose-400 text-rose-600 text-base font-black shadow-sm\" title=\"암컷\">♀</span>`;\n          }\n          return value ? `<span class=\"ml-1 font-semibold\">${value}</span>` : '';\n        }\n        const genderBadge = getGenderBadgeHtml(genderVal);\n\n        const characterVal = getPetCharacter(payload, item);\n        const characterBadge = characterVal ? `\n          <span class=\"inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-bold bg-amber-50 text-amber-800 border border-amber-200\">\n            🐾 성격: ${characterVal}\n          </span>\n        ` : '';\n\n        const displayReason = (payload.reason && payload.reason.trim())\n          || (item.symptom && item.symptom.trim())\n          || (item.symptoms && item.symptoms.trim())\n          || '기재된 내원 사유가 없습니다.';\n\n        let scheduleBadge = '';\n        if (payload.expected_date || payload.expected_time) {\n          const dStr = payload.expected_date || '';\n          const tSlot = payload.expected_time ? `(${payload.expected_time})` : '';\n          scheduleBadge = `\n            <span class=\"inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200\">\n              📅 내원예정: ${dStr} ${tSlot}\n            </span>\n          `;\n        }\n\n        let treatmentsArray = [];\n        if (Array.isArray(payload.treatments)) treatmentsArray = payload.treatments;\n        else if (Array.isArray(payload.extras)) treatmentsArray = payload.extras;\n\n        let treatmentsHtml = '';\n        if (treatmentsArray.length > 0) {\n          treatmentsHtml = `\n            <div class=\"flex flex-wrap items-center gap-1.5 mt-2\">\n              <span class=\"text-[11px] font-bold text-slate-500 mr-0.5\">추가 의뢰:</span>\n              ${treatmentsArray.map(t => `\n                <span class=\"px-2 py-0.5 text-xs font-semibold rounded-md bg-teal-50 text-[#0d9488] border border-teal-200\">\n                  + ${t}\n                </span>\n              `).join('')}\n            </div>\n          `;\n        }\n\n        const phoneButtonHtml = (phone && phone !== '-') ? `\n          <button \n            type=\"button\" \n            onclick=\"copyText('${phone}', '전화번호')\" \n            title=\"클릭 시 전화번호가 복사됩니다\"\n            class=\"inline-flex items-center gap-1 font-mono font-bold text-slate-900 bg-slate-100 hover:bg-teal-50 hover:text-teal-800 px-2 py-0.5 rounded-lg border border-slate-200 hover:border-teal-300 transition group cursor-pointer\"\n          >\n            <span>${phone}</span>\n            <svg class=\"w-3 h-3 text-slate-400 group-hover:text-teal-600 transition\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n              <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z\"/>\n            </svg>\n          </button>\n        ` : `<strong>-</strong>`;\n\n        const emailButtonHtml = email ? `\n          <button \n            type=\"button\" \n            onclick=\"copyText('${email}', '이메일')\" \n            title=\"클릭 시 이메일이 복사됩니다\"\n            class=\"inline-flex items-center gap-1 font-mono text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-sky-50 hover:text-sky-800 px-2 py-0.5 rounded-lg border border-slate-200 hover:border-sky-300 transition group cursor-pointer\"\n          >\n            <span>✉️ ${email}</span>\n            <svg class=\"w-3 h-3 text-slate-400 group-hover:text-sky-600 transition\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n              <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z\"/>\n            </svg>\n          </button>\n        ` : '';\n\n        const safePetName = (item.pet_name || '환자').replace(/'/g, \"\\\\'\");\n\n        return `\n          <div class=\"bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-slate-300 transition\">\n            <div class=\"space-y-1.5 flex-1\">\n              <div class=\"flex flex-wrap items-center gap-2\">\n                ${typeBadge}\n                <h3 class=\"text-lg font-bold text-slate-900\">${item.pet_name || '이름 없음'}</h3>\n                ${focusBadge}\n                <span class=\"text-xs text-slate-400 font-mono\">${timeStr}</span>\n                ${scheduleBadge}\n                ${characterBadge}\n                ${downloadBtn}\n              </div>\n\n              <div class=\"text-sm text-slate-600 flex flex-wrap items-center gap-1.5\">\n                <span>보호자:</span>\n                ${phoneButtonHtml}\n                ${emailButtonHtml}\n                <span>${payload.guardian_name || item.owner_name ? `(${payload.guardian_name || item.owner_name})` : ''}</span>\n                <span class=\"text-slate-500 font-medium\">${payload.breed ? ` · ${payload.breed}` : ''}${genderBadge}${birthBadge}${payload.weight ? ` · ${payload.weight}kg` : ''}</span>\n              </div>\n\n              <!-- 내원 사유 상자 (1번 원본과 동일한 박스형 디자인) -->\n              <div \n                onclick=\"copyReason(${item.id})\" \n                title=\"클릭 시 내원 사유가 복사됩니다\"\n                class=\"group relative text-xs text-slate-700 bg-slate-50 hover:bg-teal-50/40 p-3 rounded-xl border border-slate-200 hover:border-teal-300 transition mt-2 cursor-pointer select-none\"\n              >\n                <div class=\"flex justify-between items-center mb-1\">\n                  <strong class=\"text-slate-800\">[내원 사유]</strong>\n                  <span class=\"text-[11px] font-bold text-slate-400 group-hover:text-teal-700 flex items-center gap-1 transition\">\n                    <svg class=\"w-3 h-3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n                      <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z\"/>\n                    </svg>\n                    <span>클릭하여 복사</span>\n                  </span>\n                </div>\n                <div class=\"leading-relaxed whitespace-pre-line text-slate-700\">${displayReason}</div>\n              </div>\n\n              ${treatmentsHtml}\n            </div>\n\n            <!-- 우측 액션: 상태 셀렉트박스 & 삭제 버튼 (1번 원본 크기 및 마진) -->\n            <div class=\"flex items-center gap-2 self-end md:self-center\">\n              <div class=\"flex flex-col items-stretch gap-1.5\">\n                <select onchange=\"updateStatus(${item.id}, this.value)\" class=\"text-xs font-bold px-3 py-2 rounded-xl border ${statusClass} focus:outline-none cursor-pointer\">\n                  <option value=\"접수대기\" ${isWait ? 'selected' : ''}>⏳ 접수 대기</option>\n                  <option value=\"진료중\" ${isProg ? 'selected' : ''}>🩺 진료 중</option>\n                  <option value=\"완료\" ${isComp ? 'selected' : ''}>✅ 진료 완료</option>\n                </select>\n                <button type=\"button\" onclick=\"sendReceptionToCare(${item.id})\" title=\"이 접수 환자를 집중관리 신규등록으로 전송\" class=\"px-2.5 py-2 rounded-xl border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-xs flex items-center justify-center gap-1 transition whitespace-nowrap\">\n                  <span>↗</span><span>집중관리 전송</span>\n                </button>\n              </div>\n\n              <button \n                type=\"button\" \n                onclick=\"deleteReception(${item.id}, '${safePetName}')\" \n                title=\"접수 내역 삭제\"\n                class=\"px-2.5 py-2 rounded-xl border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs flex items-center gap-1 transition shadow-sm\"\n              >\n                <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\">\n                  <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16\" />\n                </svg>\n                <span>삭제</span>\n              </button>\n            </div>\n          </div>\n        `;\n      }).join('');\n    }\n\n    async function updateStatus(id, newStatus) {\n      try {\n        await fetch('/api/receptions', {\n          method: 'PATCH',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ id, status: newStatus })\n        });\n        fetchReceptions();\n      } catch (err) {\n        alert('상태 변경 실패: ' + err.message);\n      }\n    }\n\n    async function downloadIntakeSheet(item) {\n      const payload = unwrapPayload(item.payload);\n\n      document.getElementById('doc-id').innerText = `접수번호: #${item.id}`;\n      document.getElementById('doc-date').innerText = `접수일시: ${item.created_at || new Date().toLocaleString('ko-KR')}`;\n      \n      const guardian = payload.guardian_name || item.owner_name || '미기재';\n      document.getElementById('doc-guardian').innerText = guardian;\n      document.getElementById('doc-sign-guardian').innerText = guardian;\n      \n      document.getElementById('doc-phone').innerText = item.phone || item.owner_phone || '-';\n      document.getElementById('doc-address').innerText = payload.address || '미기재';\n\n      const email = payload.email || item.email || '';\n      document.getElementById('doc-email').innerText = email.trim();\n\n      document.getElementById('doc-pet').innerText = item.pet_name || '-';\n      document.getElementById('doc-species').innerText = `${payload.species || '반려동물'} / ${payload.breed || '미기재'}`;\n      \n      const genderSymbol = getGenderText(payload, item);\n      const neuteredRaw = payload.neutered ?? payload.is_neutered ?? item.neutered;\n      const isNeutered = neuteredRaw === true || neuteredRaw === 'true'\n        || neuteredRaw === 'Y' || neuteredRaw === 'y' || neuteredRaw === 1\n        || neuteredRaw === '1';\n      const rawGender = String(payload.gender || item.gender || '').trim().toLowerCase();\n      const isFemale = ['암컷', '여', 'female', 'f', '♀'].includes(rawGender);\n      const isMale = ['수컷', '남', 'male', 'm', '♂'].includes(rawGender);\n      const genderLabel = isFemale ? '암컷' : isMale ? '수컷' : (payload.gender || item.gender || '성별 미선택');\n      const neuterText = isNeutered ? '중성화' : '미중성화';\n      const genderColor = isFemale ? 'text-rose-600' : isMale ? 'text-blue-700' : 'text-slate-700';\n      const neuterColor = isNeutered ? 'text-violet-800 font-extrabold' : 'text-slate-600';\n      document.getElementById('doc-gender').innerHTML =\n        `<span class=\"${genderColor} font-black text-base\">${genderSymbol || ''} ${genderLabel}</span> ` +\n        `<span class=\"${neuterColor}\">· ${neuterText}</span>`;\n\n      const bDate = getBirthDate(payload, item) || '미기재';\n      const ageText = calculateAgeText(bDate);\n      const wt = payload.weight ? `${payload.weight} kg` : '미기재';\n      const birthWeightEl = document.getElementById('doc-birth-weight');\n      birthWeightEl.innerHTML =\n        `<span>${bDate}</span>` +\n        `${ageText ? ` <span style=\"display:inline-block;margin-left:4px;padding:2px 7px;border-radius:999px;background:linear-gradient(90deg,#fef3c7,#fce7f3,#ede9fe);border:1px solid #c4b5fd;color:#5b21b6;font-weight:800;\">${ageText}</span>` : ''}` +\n        ` <span style=\"color:#64748b;\"> / ${wt}</span>`;\n\n      const charVal = getPetCharacter(payload, item) || '특이사항 없음';\n      const docCharEl = document.getElementById('doc-character');\n      if (docCharEl) docCharEl.innerText = charVal;\n\n      document.getElementById('doc-reason').innerText = payload.reason || item.symptom || '기재된 증상 없음';\n\n      let treatmentsArray = [];\n      if (Array.isArray(payload.treatments)) treatmentsArray = payload.treatments;\n      else if (Array.isArray(payload.extras)) treatmentsArray = payload.extras;\n      document.getElementById('doc-treatments').innerText = treatmentsArray.length > 0 ? treatmentsArray.join('  |   ') : '선택 처치 없음';\n\n      const sigImg = document.getElementById('doc-signature-img');\n      const noSigText = document.getElementById('doc-no-sign');\n\n      if (payload.signature && payload.signature.startsWith('data:image')) {\n        sigImg.src = payload.signature;\n        sigImg.classList.remove('hidden');\n        noSigText.classList.add('hidden');\n      } else {\n        sigImg.classList.add('hidden');\n        noSigText.classList.remove('hidden');\n      }\n\n      const sheetElement = document.getElementById('print-sheet');\n\n      try {\n        const canvas = await html2canvas(sheetElement, { \n          scale: 2, \n          useCORS: true, \n          backgroundColor: '#ffffff' \n        });\n        const imageURL = canvas.toDataURL('image/png');\n        const link = document.createElement('a');\n        \n        const petName = (item.pet_name || '환자').trim();\n        const cleanPhone = (item.phone || item.owner_phone || '0000').slice(-4);\n        link.download = `${petName}_${cleanPhone}_초진동의서.png`;\n        \n        link.href = imageURL;\n        link.click();\n      } catch (err) {\n        alert('동의서 이미지 생성 실패: ' + err.message);\n      }\n    }\n\n    fetchReceptions();\n    setInterval(() => fetchReceptions(), 5000);\n\n    // ==========================================\n    // 📢 원내 공지사항 관리 스크립트 (PIN 인증)\n    // ==========================================\n    async function loadNoticeFromDB() {\n      try {\n        const res = await fetch('/api/notice');\n        if (res.ok) {\n          const data = await res.json();\n          const input = document.getElementById('adminNoticeInput');\n          if (input && data.notice !== undefined) {\n            input.value = data.notice;\n          }\n        }\n      } catch (err) {\n        console.error('공지 로드 오류:', err);\n      }\n    }\n\n    async function saveNoticeToDB() {\n      const input = document.getElementById('adminNoticeInput');\n      const text = input ? input.value.trim() : '';\n      const btn = document.getElementById('btnNoticeSave');\n\n      const enteredPin = prompt('공지사항을 등록/수정하려면 관리자 비밀번호(PIN)를 입력하세요:');\n      if (enteredPin === null) return;\n      if (!enteredPin.trim()) {\n        alert('비밀번호를 입력해야 합니다.');\n        return;\n      }\n\n      btn.disabled = true;\n      btn.innerText = '저장 중...';\n\n      try {\n        const res = await fetch('/api/notice', {\n          method: 'POST',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ \n            notice: text,\n            pin: enteredPin.trim() \n          })\n        });\n        \n        const result = await res.json();\n\n        if (res.ok && result.success) {\n          showToast('📢 공지가 키오스크에 반영되었습니다.');\n        } else {\n          alert(result.message || '인증에 실패했습니다. 비밀번호를 확인해 주세요.');\n        }\n      } catch (err) {\n        alert('네트워크 오류가 발생했습니다.');\n      } finally {\n        btn.disabled = false;\n        btn.innerText = '게시하기';\n      }\n    }\n\n    async function clearNoticeInDB() {\n      const enteredPin = prompt('공지사항을 지우시겠습니까? 관리자 비밀번호(PIN)를 입력하세요:');\n      if (enteredPin === null) return;\n      if (!enteredPin.trim()) {\n        alert('비밀번호를 입력해야 합니다.');\n        return;\n      }\n\n      try {\n        const res = await fetch('/api/notice', {\n          method: 'POST',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ \n            notice: '', \n            pin: enteredPin.trim() \n          })\n        });\n\n        const result = await res.json();\n\n        if (res.ok && result.success) {\n          document.getElementById('adminNoticeInput').value = '';\n          showToast('🗑️ 공지사항이 삭제되었습니다.');\n        } else {\n          alert(result.message || '비밀번호가 올바르지 않습니다.');\n        }\n      } catch (err) {\n        alert('오류가 발생했습니다.');\n      }\n    }\n\n    loadNoticeFromDB();\n  <\/script>\n</body>\n</html>";
// 원내 접수 현황판 안에서도 집중관리/전체 화면 전환 가능
const counterWithShortcuts = counterAppHTML.replace('</body>', `<div id="counterViewShortcuts" style="position:fixed;right:12px;bottom:12px;z-index:99999;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"></div></body>`);
if (counterFrame) counterFrame.srcdoc = counterWithShortcuts;
const chronicToggle = document.getElementById('chronicChartToggle');
const leftPanelTitle = document.getElementById('leftPanelTitle');
const counterOpenLink = document.getElementById('counterOpenLink');
const integratedShell = document.getElementById('integratedShell');
let chronicLoaded = false;
function loadChronicOnce(){
  if(!chronicLoaded){ chronicFrame.srcdoc = chronicAppHTML; chronicLoaded = true; }
}
function setLayout(mode){
  if(mode === 'focus' || mode === 'focus-expanded' || mode === 'three') loadChronicOnce();
  integratedShell.dataset.layout = mode;
  const globalControls = document.getElementById('expandedGlobalControls');
  if(globalControls) globalControls.style.display = mode === 'focus-expanded' ? 'flex' : 'none';
  if(mode === 'focus'){
    chronicToggle.textContent = '💊 복약관리 2화면으로';
  } else if(mode === 'focus-expanded'){
    chronicToggle.textContent = '↩️ 기본 화면으로';
  } else if(mode === 'three'){
    chronicToggle.textContent = '📋 집중관리 2화면';
  } else {
    chronicToggle.textContent = '📋 집중관리 2화면';
  }
}
chronicToggle.addEventListener('click', () => {
  setLayout(['focus','focus-expanded'].includes(integratedShell.dataset.layout) ? 'medication' : 'focus');
});
function showInitialScreen(){
  // 초기화면은 접수현황판 + 복약관리 화면으로 복귀
  setLayout('medication');
}
function refreshReceptionAndChart(){
  // 전체 페이지를 새로고침하지 않고 접수현황판과 챠트만 갱신한 뒤 현황+챠트 화면 표시
  setLayout('focus');
  try {
    if(counterFrame) counterFrame.srcdoc = counterWithShortcuts;
  } catch(err) { console.warn('접수현황판 갱신 실패:', err); }
  try {
    if(chronicFrame) {
      chronicFrame.srcdoc = chronicAppHTML;
      chronicLoaded = true;
    }
  } catch(err) { console.warn('집중관리 챠트 갱신 실패:', err); }
}
document.getElementById('globalInitialScreenBtn')?.addEventListener('click', showInitialScreen);
document.getElementById('globalRefreshChartBtn')?.addEventListener('click', refreshReceptionAndChart);
let pendingCarePatient = null;
window.addEventListener('message', (event) => {
  if(event.data && event.data.type === 'send-reception-to-care' && event.data.patient) {
    const patient = event.data.patient;
    const chartWasLoaded = chronicLoaded;
    setLayout('focus');
    if (chartWasLoaded && chronicFrame && chronicFrame.contentWindow) {
      chronicFrame.contentWindow.postMessage({ type: 'prefill-care-registration', patient }, '*');
    } else {
      pendingCarePatient = patient;
    }
  }
  if(event.data && event.data.type === 'care-chart-ready' && pendingCarePatient && chronicFrame && chronicFrame.contentWindow) {
    chronicFrame.contentWindow.postMessage({ type: 'prefill-care-registration', patient: pendingCarePatient }, '*');
    pendingCarePatient = null;
  }
  if(event.data && event.data.type === 'show-focus-chart') setLayout('focus');
  if(event.data && event.data.type === 'show-focus-expanded') setLayout('focus-expanded');
  if(event.data && event.data.type === 'show-initial-screen') showInitialScreen();
  if(event.data && event.data.type === 'refresh-integrated-page') refreshReceptionAndChart();
});
