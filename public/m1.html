        <div class="flex items-center gap-2">
          <span class="text-lg">📅</span>

          <span class="text-xs text-amber-700 font-medium">· 내원 시 [대기 복귀] 클릭</span>

  <div id="copyToast" class="fixed bottom-6 right-6 z-50 transform transition-all duration-300 opacity-0 translate-y-4 pointer-events-none bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2 border border-slate-700">
    <span class="text-emerald-400">✓</span>
    <span id="toastMsg">클립보드에 복사되었습니다!</span>
  </div>

  <script>
    var soundEnabled = true;
    var currentList = [];

    function showToast(msg) {
      var toast = document.getElementById('copyToast');
      var toastMsg = document.getElementById('toastMsg');
      if (!toast) return;
      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(function() {
        toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      var icon = document.getElementById('soundIcon');
      var text = document.getElementById('soundText');
      if (soundEnabled) {
        icon.innerText = "🔔"; text.innerText = "알림음 켜짐";
      } else {
        icon.innerText = "🔇"; text.innerText = "알림음 켜기";
      }
    }

    function toggleCounterReserveBox() {
      var box = document.getElementById('counter-reserve-container');
      var arrow = document.getElementById('reserve-toggle-arrow');
      if (box.classList.contains('hidden')) {
        box.classList.remove('hidden'); arrow.innerText = '접기 ▲';
      } else {
        box.classList.add('hidden'); arrow.innerText = '펼치기 ▼';
      }
    }

    // 🚀 [핵심 복원]: 현황판에서 집중관리 차트로 환자 정보 1초 만에 전송
    function sendReceptionToCare(id) {
      var item = (currentList || []).find(function(row) { return String(row.id) === String(id); });
      if (!item) { alert('접수 정보를 찾지 못했습니다.'); return; }
      var payload = unwrapPayload(item.payload);
      var patient = {
        petName: item.pet_name || item.petName || payload.pet_name || payload.petName || payload.pet || '',
        guardian: payload.guardian_name || item.owner_name || item.ownerName || payload.owner_name || '',
        phone: item.phone || item.owner_phone || payload.phone || payload.owner_phone || '',
        gender: payload.gender || item.gender || '',
        age: payload.age || item.age || '',
        weight: payload.weight || item.weight || '',
        diagnosis: item.symptom || item.reason || payload.reason || payload.diagnosis || '',
        content: item.symptom || item.reason || payload.reason || payload.diagnosis || '',
        category: 'active', risk: 'I'
      };
      if (!patient.petName) { alert('동물이름이 없어 전송할 수 없습니다.'); return; }
      parent.postMessage({ type: 'send-reception-to-care', patient: patient }, '*');
    }

    function deleteReception(id, petName) {
      var choice = confirm("[" + petName + "] 환자를 어떻게 처리할까요?\n\n• [확인] 누름: 목록에서 가리고 【예약대기로 안전보관】 (추천 - 데이터 보존)\n• [취소] 누름: 영구 삭제할지 다시 선택");
      if (choice) {
        updateStatus(id, '예약대기');
        showToast("📅 [" + petName + "] 환자가 예약대기로 안전 보관되었습니다.");
        return;
      }
      if (confirm("⚠️ [" + petName + "] 환자의 데이터를 영구적으로 완전히 삭제하시겠습니까?\n(원장실 및 대기판에서도 완전히 지워집니다)")) {
        fetch('/api/receptions?id=' + id, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id })
        }).then(function(res) {
          if (!res.ok) throw new Error('삭제 처리 오류');
          showToast("🗑️ [" + petName + "] 접수 내역이 삭제되었습니다.");
          fetchReceptions();
        }).catch(function(err) { alert('삭제 실패: ' + err.message); });
      }
    }

    function updateStatus(id, newStatus) {
      fetch('/api/receptions', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id, status: newStatus })
      }).then(function(res) {
        showToast(newStatus === '예약대기' ? '📅 예약대기로 보관되었습니다.' : '상태가 변경되었습니다.');
        fetchReceptions();
      }).catch(function(err) { alert('상태 변경 실패: ' + err.message); });
    }

    function unwrapPayload(raw) {
      if (!raw) return {};
      var cur = raw;
      try { while (typeof cur === 'string') cur = JSON.parse(cur); } catch(e){}
      return (cur && typeof cur === 'object') ? cur : {};
    }

    function isFocusManaged(payload, item) {
      try {
        var saved = localStorage.getItem("careflow_vet_data_v6");
        if (!saved) return false;
        var dogs = JSON.parse(saved);
        if (!Array.isArray(dogs)) return false;
        var digits = function(v) { return String(v || "").replace(/\D/g, ""); };
        var petName = String(item.pet_name || "").trim().replace(/\s+/g, "").toLowerCase();
        var recPhone = digits(item.phone || item.owner_phone || payload.phone || payload.owner_phone);
        if (!petName) return false;
        return dogs.some(function(dog) {
          if (dog.category !== "active") return false;
          var chartName = String(dog.name || "").trim().replace(/\s+/g, "").toLowerCase();
          if (!chartName || chartName !== petName) return false;
          var chartPhone = digits(dog.phone);
          if (chartPhone && recPhone) return chartPhone === recPhone;
          return true;
        });
      } catch(e) { return false; }
    }

    function fetchReceptions(manual) {
      fetch('/api/receptions')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (!Array.isArray(data)) return;
          currentList = data;
          var waiting = 0, progress = 0, done = 0, reserved = 0;

          data.forEach(function(item) {
            var st = item.status || '접수대기';
            if (st === '접수대기' || st === '대기') waiting++;
            else if (st === '진료중') progress++;
            else if (st === '완료') done++;
            else if (st === '예약대기') reserved++;
          });

          document.getElementById('count-waiting').innerText = waiting;
          document.getElementById('count-progress').innerText = progress;
          document.getElementById('count-done').innerText = done;
          document.getElementById('count-reserved').innerText = reserved;
          document.getElementById('box-reserved-count').innerText = reserved;

          renderList(data);
        }).catch(function(e) { console.error("조회 실패:", e); });
    }

    function renderList(list) {
      var container = document.getElementById('list-container');
      var reserveContainer = document.getElementById('counter-reserve-container');

      var activeList = list.filter(function(i) { return i.status !== '예약대기'; });
      var reservedList = list.filter(function(i) { return i.status === '예약대기'; });

      // 1. 보관함 렌더링
      if (!reservedList.length) {
        reserveContainer.innerHTML = '<div class="text-xs text-amber-700/70 py-2 text-center">보관함에 대기 중인 예약 환자가 없습니다.</div>';
      } else {
        reserveContainer.innerHTML = reservedList.map(function(item) {
          var payload = unwrapPayload(item.payload);
          var petName = item.pet_name || item.animal_name || '이름 없음';
          var safeName = petName.replace(/'/g, "\\'");
          var gName = payload.guardian_name || item.owner_name || '보호자';
          var exp = payload.expected_date ? ("📅 " + payload.expected_date) : '';

          return '<div class="bg-white p-3 rounded-xl border border-amber-200 flex items-center justify-between gap-2 shadow-xs">' +
                   '<div class="flex items-center gap-2 min-w-0">' +
                     '<span class="bg-amber-100 text-amber-900 font-bold text-[10px] px-1.5 py-0.5 rounded">예약대기</span>' +
                     '<span class="font-bold text-xs text-slate-800 truncate">' + petName + '</span>' +
                     '<span class="text-[11px] text-slate-500">(' + gName + ')</span>' +
                     '<span class="text-[11px] text-indigo-600 font-medium">' + exp + '</span>' +
                   '</div>' +
                   '<div class="flex items-center gap-1.5 shrink-0">' +
                     '<button onclick="updateStatus(' + item.id + ', \'접수대기\')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[11px] font-bold transition shadow-xs">🐾 내원함 (대기 복귀)</button>' +
                     '<button onclick="deleteReception(' + item.id + ', \'' + safeName + '\')" class="px-2 py-1 bg-slate-100 hover:bg-rose-50 text-slate-500 hover:text-rose-600 rounded text-[11px] font-bold border border-slate-200 transition">삭제</button>' +
                   '</div>' +
                 '</div>';
        }).join('');
      }

      // 2. 메인 오늘 접수 리스트 (예약대기는 안 보임)
      if (!activeList.length) {
        container.innerHTML = '<div class="bg-white p-12 text-center rounded-2xl border border-slate-200 text-slate-400 text-sm">현재 대기 중인 접수 환자가 없습니다.</div>';
        return;
      }

      container.innerHTML = activeList.map(function(item) {
        var payload = unwrapPayload(item.payload);
        var isWait = (item.status === '접수대기' || item.status === '대기');
        var isProg = (item.status === '진료중');
        var isComp = (item.status === '완료');
        var isRes = (item.status === '예약대기');

        var statusClass = "bg-amber-50 text-amber-700 border-amber-200";
        if (isProg) statusClass = "bg-emerald-50 text-emerald-700 border-emerald-200";
        if (isComp) statusClass = "bg-slate-100 text-slate-400 border-slate-200";
        if (isRes) statusClass = "bg-amber-100 text-amber-900 border-amber-300";

        var focusBadge = isFocusManaged(payload, item) ?
          '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-red-100 text-red-800 border border-red-300 text-xs font-extrabold shadow-sm" title="집중관리 차트에 등록된 환자">🔴 집중관리</span>' : '';

        var petName = item.pet_name || item.animal_name || '이름 없음';
        var safeName = petName.replace(/'/g, "\\'");
        var timeStr = item.created_at ? item.created_at.slice(11, 16) : '';
        var guardian = payload.guardian_name || item.owner_name || '-';
        var phone = item.phone || item.owner_phone || '-';
        var breed = payload.breed ? (" · " + payload.breed) : '';
        var reason = payload.reason || item.symptom || '내원 사유 없음';

        return '<div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-slate-300 transition">' +
                 '<div class="space-y-1.5 flex-1">' +
                   '<div class="flex flex-wrap items-center gap-2">' +
                     '<span class="bg-sky-100 text-sky-800 text-xs px-2.5 py-1 rounded-md font-bold">' + (item.type === 'FIRST' ? '초진' : '재진') + '</span>' +
                     '<h3 class="text-lg font-bold text-slate-900">' + petName + '</h3>' +
                     focusBadge +
                     '<span class="text-xs text-slate-400 font-mono">' + timeStr + '</span>' +
                   '</div>' +
                   '<div class="text-sm text-slate-600 flex flex-wrap items-center gap-1.5">' +
                     '<span>보호자: ' + guardian + '</span>' +
                     '<span class="text-slate-400">|</span>' +
                     '<span>' + phone + '</span>' +
                     '<span class="text-slate-500">' + breed + '</span>' +
                   '</div>' +
                   '<div class="text-xs bg-slate-50 p-3 rounded-xl border border-slate-200 text-slate-700 leading-relaxed mt-2">' +
                     reason +
                   '</div>' +
                 '</div>' +
                 '<div class="flex items-center gap-2 self-end md:self-center">' +
                   '<div class="flex flex-col items-stretch gap-1.5">' +
                     '<select onchange="updateStatus(' + item.id + ', this.value)" class="text-xs font-bold px-3 py-2 rounded-xl border ' + statusClass + ' focus:outline-none cursor-pointer">' +
                       '<option value="접수대기" ' + (isWait ? 'selected' : '') + '>⏳ 접수 대기</option>' +
                       '<option value="예약대기" ' + (isRes ? 'selected' : '') + '>📅 예약대기 (보관)</option>' +
                       '<option value="진료중" ' + (isProg ? 'selected' : '') + '>🩺 진료 중</option>' +
                       '<option value="완료" ' + (isComp ? 'selected' : '') + '>✅ 진료 완료</option>' +
                     '</select>' +
                     '<button type="button" onclick="sendReceptionToCare(' + item.id + ')" title="이 접수 환자를 집중관리 신규등록으로 전송" class="px-2.5 py-2 rounded-xl border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-xs flex items-center justify-center gap-1 transition whitespace-nowrap">' +
                       '<span>↗</span><span>집중관리 전송</span>' +
                     '</button>' +
                   '</div>' +
                   '<button type="button" onclick="deleteReception(' + item.id + ', \'' + safeName + '\')" class="px-2.5 py-2 rounded-xl border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs">삭제</button>' +
                 '</div>' +
               '</div>';
      }).join('');
    }

    fetchReceptions();
    setInterval(fetchReceptions, 5000);
  </script>
</body>
</html>
</template>

<script>
// =========================================================================
// 2. 통합 제어 스크립트 (현황판 + 집중관리 차트 + 전송 연동 완벽 유지)
// =========================================================================
const counterFrame = document.getElementById('counterFrame');
const chronicFrame = document.getElementById('chronicFrame');
const chronicToggle = document.getElementById('chronicChartToggle');
const integratedShell = document.getElementById('integratedShell');

function initCounterFrame() {
  const tpl = document.getElementById('tpl-counter');
  if (counterFrame && tpl) {
    counterFrame.srcdoc = tpl.innerHTML;
  }
}
initCounterFrame();

let chronicLoaded = false;
function loadChronicOnce(){
  if(!chronicLoaded && chronicFrame){ 
    chronicFrame.src = "https://23si.net/counter";
    chronicLoaded = true; 
  }
}

function setLayout(mode){
  if(mode === 'focus' || mode === 'focus-expanded' || mode === 'three') loadChronicOnce();
  integratedShell.dataset.layout = mode;
  const globalControls = document.getElementById('expandedGlobalControls');
  if(globalControls) globalControls.style.display = mode === 'focus-expanded' ? 'flex' : 'none';
  if(mode === 'focus'){
    chronicToggle.textContent = '💊 복약관리 2화면으로';
  } else if(mode === 'focus-expanded'){
    chronicToggle.textContent = '↩️ 기본 화면으로';
  } else {
    chronicToggle.textContent = '📋 집중관리 2화면';
  }
}

chronicToggle.addEventListener('click', () => {
  setLayout(['focus','focus-expanded'].includes(integratedShell.dataset.layout) ? 'medication' : 'focus');
});

function showInitialScreen(){ setLayout('medication'); }
function refreshReceptionAndChart(){
  setLayout('focus');
  try { initCounterFrame(); } catch(err){}
}

document.getElementById('globalInitialScreenBtn')?.addEventListener('click', showInitialScreen);
document.getElementById('globalRefreshChartBtn')?.addEventListener('click', refreshReceptionAndChart);

// 🚀 [핵심 복원]: 현황판에서 '집중관리 전송' 버튼 누르면 챠트 화면을 열고 데이터 자동 입력
let pendingCarePatient = null;
window.addEventListener('message', (event) => {
  if(event.data && event.data.type === 'send-reception-to-care' && event.data.patient) {
    const patient = event.data.patient;
    const chartWasLoaded = chronicLoaded;
    setLayout('focus');
    if (chartWasLoaded && chronicFrame && chronicFrame.contentWindow) {
      chronicFrame.contentWindow.postMessage({ type: 'prefill-care-registration', patient: patient }, '*');
    } else {
      pendingCarePatient = patient;
    }
  }
  if(event.data && event.data.type === 'care-chart-ready' && pendingCarePatient && chronicFrame && chronicFrame.contentWindow) {
    chronicFrame.contentWindow.postMessage({ type: 'prefill-care-registration', patient: pendingCarePatient }, '*');
    pendingCarePatient = null;
  }
  if(event.data && event.data.type === 'show-focus-chart') setLayout('focus');
  if(event.data && event.data.type === 'show-focus-expanded') setLayout('focus-expanded');
  if(event.data && event.data.type === 'show-initial-screen') showInitialScreen();
  if(event.data && event.data.type === 'refresh-integrated-page') refreshReceptionAndChart();
});
</script>
</body>
</html>
