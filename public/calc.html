<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>동물 처방 약량 계산기</title>
  <!-- 화면 캡처용 html2canvas 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 8px; color: #1e293b; background: #f8fafc; margin: 0; }
    h2 { margin: 0 0 8px 0; font-size: 15px; color: #0f172a; display: flex; align-items: center; justify-content: space-between; }

    /* 숫자 입력 화살표 숨김 */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }

    /* 캡처 대상 영역 */
    #capture-area {
      background: #ffffff;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      display: inline-block;
      min-width: 100%;
      box-sizing: border-box;
    }

    /* 상단 컨트롤 바 */
    .top-panel {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      background: #f8fafc; padding: 6px 10px; border-radius: 6px;
      border: 1px solid #e2e8f0; margin-bottom: 8px;
    }
    .input-box { display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 14px; }
    .input-box input { padding: 4px 6px; font-size: 14px; font-weight: 900; border-radius: 4px; }
    
    /* 신규 환자 이름 입력창 */
    .input-patient { width: 75px; border: 2px solid #6366f1; color: #4338ca; text-align: left; }
    .input-weight { width: 55px; border: 2px solid #2563eb; color: #1d4ed8; text-align: right; font-size: 15px; }
    .input-days { width: 50px; border: 2px solid #059669; color: #047857; text-align: right; font-size: 15px; }

    .pattern-box { display: flex; align-items: center; gap: 6px; border-left: 2px solid #cbd5e1; padding-left: 8px; }
    .pattern-box input, .pattern-box select { padding: 4px 6px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 12px; font-weight: 600; }

    /* 테이블 스타일링 */
    .table-container { overflow-x: auto; background: white; border-radius: 6px; border: 1px solid #cbd5e1; }
    table { width: 100%; border-collapse: collapse; text-align: center; }
    th { border: 1px solid #cbd5e1; padding: 4px 1px; font-size: 12px; font-weight: 800; line-height: 1.15; }
    td { border: 1px solid #e2e8f0; padding: 2px 1px; font-size: 14px; height: 30px; white-space: nowrap; }

    /* 그룹 헤더 */
    .group-header-bid {
      background: #ffedd5; color: #9a3412; font-weight: 900; font-size: 12px; text-align: left; padding: 4px 10px;
    }
    .group-header-sid {
      background: #ede9fe; color: #5b21b6; font-weight: 900; font-size: 12px; text-align: left; padding: 4px 10px;
    }

    /* 컬럼 색상 */
    .col-drug { background: #eff6ff; }
    th.col-drug { background: #dbeafe; color: #1e40af; }
    .col-dose { background: #f0fdf4; }
    th.col-dose { background: #dcfce7; color: #166534; }
    .col-sched { background: #faf5ff; }
    th.col-sched { background: #f3e8ff; color: #6b21a8; }
    
    /* 총 조제량 (청록) */
    .col-total { background: #f0fdfa; }
    th.col-total { background: #ccfbf1; color: #115e59; }

    /* 1회 조제량 & 역산 (캡처 시 숨겨지는 영역) */
    .col-single { background: #fffbeb; }
    th.col-single { background: #fef3c7; color: #92400e; }
    .col-rev { background: #fff1f2; }
    th.col-rev { background: #ffe4e6; color: #9f1239; }

    /* 핵심 강조: 총 필요량 */
    .res-total-highlight {
      font-size: 16px; font-weight: 900; color: #047857;
      background: #a7f3d0 !important; border: 1.5px solid #059669 !important;
    }
    .res-single-num { color: #d97706; font-weight: 800; font-size: 14px; }
    .res-rev-num { color: #e11d48; font-weight: 800; font-size: 13px; }

    /* 입력창 */
    td input {
      width: 100%; height: 26px; padding: 0 2px; border: 1px solid #cbd5e0;
      border-radius: 3px; font-size: 14px; font-weight: 700; color: #0f172a;
      text-align: center; box-sizing: border-box; background: #fff;
    }
    td input.text-left { text-align: left; padding-left: 4px; }
    td input:focus { outline: none; border-color: #2563eb; background: #f8fafc; }

    /* 버튼 */
    button { padding: 5px 12px; border: none; border-radius: 4px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.15s; }
    .btn-main { background: #2563eb; color: white; }
    .btn-main:hover { background: #1d4ed8; }
    .btn-sub { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .btn-sub:hover { background: #e2e8f0; }
    .btn-danger { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

    .btn-img-save {
      background: #059669; color: white; font-size: 13px; display: inline-flex; align-items: center; gap: 5px;
      box-shadow: 0 2px 4px rgba(5, 150, 105, 0.25);
    }
    .btn-img-save:hover { background: #047857; }

    .bottom-actions { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <!-- 캡처 영역 시작 -->
  <div id="capture-area">
    <h2>
      <span>🐾 동물 처방 약량 계산서</span>
      <span id="capture-timestamp" style="font-size: 12px; font-weight: normal; color: #64748b;"></span>
    </h2>

    <!-- 상단: 이름 + 체중 + 공통 처방 일수 -->
    <div class="top-panel">
      <div class="input-box">
        <label for="patientName">이름:</label>
        <input type="text" id="patientName" class="input-patient" placeholder="환자명">
      </div>

      <div class="input-box">
        <label for="commonWeight">체중:</label>
        <input type="number" step="any" id="commonWeight" class="input-weight" placeholder="0.0" oninput="calculateAll()"> kg
      </div>

      <div class="input-box">
        <label for="commonDays">처방 일수:</label>
        <input type="number" id="commonDays" class="input-days" placeholder="일수" oninput="applyCommonDays()"> 일분
      </div>

      <div class="pattern-box no-export">
        <input type="text" id="patternName" placeholder="패턴명" style="width: 85px;">
        <button class="btn-sub" onclick="saveCurrentPattern()">저장</button>
      </div>

      <div class="pattern-box no-export">
        <label for="savedPatternSelect">패턴:</label>
        <select id="savedPatternSelect" onchange="loadSelectedPattern()" style="max-width: 110px;">
          <option value="">-- 선택 --</option>
        </select>
        <button class="btn-danger" onclick="deleteSelectedPattern()">삭제</button>
      </div>
    </div>

    <!-- 계산 테이블 -->
    <div class="table-container">
      <table id="mainCalcTable">
        <thead>
          <tr>
            <th rowspan="2" style="width: 22px; background: #f1f5f9;">No</th>
            <th colspan="2" class="col-drug">약물 규격</th>
            <th class="col-dose">처방</th>
            <th colspan="2" class="col-sched">주기</th>
            <!-- 총 조제량 (이미지 캡처의 마지막 열) -->
            <th colspan="2" class="col-total">총 조제량 (핵심)</th>
            <!-- 캡처 시 자동 제외되는 1회 조제량 & 역산 -->
            <th colspan="2" class="col-single hide-on-capture">1회 조제량</th>
            <th colspan="2" class="col-rev hide-on-capture">역산 (총량 1 맞춤)</th>
          </tr>
          <tr>
            <th class="col-drug" style="width: 78px;">약품명</th>
            <th class="col-drug" style="width: 48px;">농도<br><small>(단위)</small></th>
            <th class="col-dose" style="width: 50px;">용량<br><small>(mg/kg)</small></th>
            <th class="col-sched" style="width: 45px;">구분</th>
            <th class="col-sched" style="width: 36px;">일수</th>
            <!-- 총 조제량 -->
            <th class="col-total" style="width: 54px;">총성분<br><small>(mg)</small></th>
            <th class="col-total" style="width: 72px;">총 필요량<br><small>(정,mL)</small></th>
            <!-- 1회 조제량 & 역산 (캡처 제외) -->
            <th class="col-single hide-on-capture" style="width: 46px;">성분<br><small>(mg)</small></th>
            <th class="col-single hide-on-capture" style="width: 52px;">분량<br><small>(단위)</small></th>
            <th class="col-rev hide-on-capture" style="width: 55px;">1일1회<br><small>(SID)</small></th>
            <th class="col-rev hide-on-capture" style="width: 55px;">1일2회<br><small>(BID)</small></th>
          </tr>
        </thead>
        <tbody id="calcTableBody"></tbody>
      </table>
    </div>
  </div>
  <!-- 캡처 영역 끝 -->

  <div class="bottom-actions">
    <div>
      <button class="btn-main" onclick="calculateAll()">일괄 재계산</button>
      <button class="btn-sub" onclick="resetForm()">전체 리셋</button>
    </div>
    <div>
      <button class="btn-img-save" onclick="saveAsImage()">
        📷 처방내역 이미지(PNG) 저장
      </button>
    </div>
  </div>

  <script>
    const ROWS_COUNT = 10;
    const STORAGE_KEY = 'vet_prescription_patterns_v3';

    function initRows() {
      const tbody = document.getElementById('calcTableBody');
      tbody.innerHTML = '';

      for (let i = 1; i <= ROWS_COUNT; i++) {
        if (i === 1) {
          const h1 = document.createElement('tr');
          h1.className = 'group-header-row';
          h1.innerHTML = `<td colspan="12" class="group-header-bid">🟠 [그룹 1] 1일 2회 투약 (BID) — 1~5번 약물</td>`;
          tbody.appendChild(h1);
        } else if (i === 6) {
          const h2 = document.createElement('tr');
          h2.className = 'group-header-row';
          h2.innerHTML = `<td colspan="12" class="group-header-sid">🟣 [그룹 2] 1일 1회 투약 (SID) — 6~10번 약물</td>`;
          tbody.appendChild(h2);
        }

        const defaultFreq = i <= 5 ? 2 : 1;
        const freqLabel = i <= 5 ? '<b style="color:#c2410c;">2회</b>' : '<b style="color:#6d28d9;">1회</b>';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="background: #f1f5f9; font-weight: 800; color: #64748b; font-size: 12px;">${i}</td>
          <td class="col-drug"><input type="text" class="text-left" id="name_${i}" placeholder="약품${i}"></td>
          <td class="col-drug"><input type="number" step="any" id="strength_${i}" placeholder="규격" oninput="calculateRow(${i})"></td>
          <td class="col-dose"><input type="number" step="any" id="dose_${i}" placeholder="용량" oninput="calculateRow(${i})"></td>
          <td class="col-sched" style="font-size: 13px;" id="freq_label_${i}">${freqLabel}<input type="hidden" id="freq_${i}" value="${defaultFreq}"></td>
          <td class="col-sched"><input type="number" id="days_${i}" placeholder="일" oninput="calculateRow(${i})"></td>
          
          <!-- 총 조제량 셀 -->
          <td class="col-total" id="res_total_mg_${i}">-</td>
          <td class="col-total res-total-highlight" id="res_total_unit_${i}">-</td>
          
          <!-- 1회 조제량 & 역산 셀 (캡처 제외 대상) -->
          <td class="col-single hide-on-capture" id="res_single_mg_${i}">-</td>
          <td class="col-single res-single-num hide-on-capture" id="res_single_unit_${i}">-</td>
          <td class="col-rev res-rev-num hide-on-capture" id="res_sid_${i}">-</td>
          <td class="col-rev res-rev-num hide-on-capture" id="res_bid_${i}">-</td>
        `;
        tbody.appendChild(tr);
      }
    }

    function applyCommonDays() {
      const commonDays = document.getElementById('commonDays').value;
      for (let i = 1; i <= ROWS_COUNT; i++) {
        document.getElementById(`days_${i}`).value = commonDays;
      }
      calculateAll();
    }

    function calculateRow(i) {
      const weight = parseFloat(document.getElementById('commonWeight').value);
      const strength = parseFloat(document.getElementById(`strength_${i}`).value);
      const dose = parseFloat(document.getElementById(`dose_${i}`).value);
      const freq = parseFloat(document.getElementById(`freq_${i}`).value) || 0;
      const days = parseFloat(document.getElementById(`days_${i}`).value) || 0;

      const singleMgEl = document.getElementById(`res_single_mg_${i}`);
      const singleUnitEl = document.getElementById(`res_single_unit_${i}`);
      const totalMgEl = document.getElementById(`res_total_mg_${i}`);
      const totalUnitEl = document.getElementById(`res_total_unit_${i}`);
      const sidEl = document.getElementById(`res_sid_${i}`);
      const bidEl = document.getElementById(`res_bid_${i}`);

      if (weight > 0 && strength > 0 && dose > 0) {
        const singleMg = dose * weight;
        const singleUnit = singleMg / strength;
        
        singleMgEl.textContent = singleMg.toFixed(2);
        singleUnitEl.textContent = singleUnit.toFixed(2);

        if (freq > 0 && days > 0) {
          const totalCount = freq * days;
          const totalMg = singleMg * totalCount;
          const totalUnit = singleUnit * totalCount;

          totalMgEl.textContent = totalMg.toFixed(2);
          totalUnitEl.textContent = totalUnit.toFixed(2);
        } else {
          totalMgEl.textContent = '-';
          totalUnitEl.textContent = '-';
        }

        if (singleUnit > 0) {
          const totalDosesForOne = 1 / singleUnit;
          sidEl.textContent = `${totalDosesForOne.toFixed(1)}일`;
          bidEl.textContent = `${(totalDosesForOne / 2).toFixed(1)}일`;
        } else {
          sidEl.textContent = '-';
          bidEl.textContent = '-';
        }
      } else {
        singleMgEl.textContent = '-';
        singleUnitEl.textContent = '-';
        totalMgEl.textContent = '-';
        totalUnitEl.textContent = '-';
        sidEl.textContent = '-';
        bidEl.textContent = '-';
      }
    }

    function calculateAll() {
      for (let i = 1; i <= ROWS_COUNT; i++) calculateRow(i);
    }

    /* 이미지 저장: 총 조제량까지만 슬림하게 캡처 */
    async function saveAsImage() {
      const captureArea = document.getElementById('capture-area');
      const patient = document.getElementById('patientName').value.trim() || '미지정';
      const weight = document.getElementById('commonWeight').value || '0';
      const days = document.getElementById('commonDays').value || '0';

      const now = new Date();
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const timeElem = document.getElementById('capture-timestamp');
      timeElem.textContent = `[환자: ${patient} | 체중: ${weight}kg | 처방일시: ${dateStr}]`;

      // 1. 패턴 컨트롤 버튼 숨김
      const noExportElements = document.querySelectorAll('.no-export');
      noExportElements.forEach(el => el.style.display = 'none');

      // 2. 1회 조제량 및 역산 컬럼 일시 숨김 (display: none 처리)
      const hideCols = document.querySelectorAll('.hide-on-capture');
      hideCols.forEach(el => el.style.display = 'none');

      // 3. 그룹 헤더 colspan을 12 -> 8로 일시 축소
      const groupHeaders = document.querySelectorAll('.group-header-row td');
      groupHeaders.forEach(td => td.colSpan = 8);

      try {
        const canvas = await html2canvas(captureArea, {
          scale: 2,
          backgroundColor: '#ffffff',
          useCORS: true
        });

        const link = document.createElement('a');
        const filenameDate = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
        link.download = `처방_${patient}_${weight}kg_${days}일분_${filenameDate}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        console.error('캡처 오류:', err);
        alert('이미지 저장 중 오류가 발생했습니다.');
      } finally {
        // UI 원상 복구
        noExportElements.forEach(el => el.style.display = '');
        hideCols.forEach(el => el.style.display = '');
        groupHeaders.forEach(td => td.colSpan = 12);
      }
    }

    function saveCurrentPattern() {
      const name = document.getElementById('patternName').value.trim();
      if (!name) return alert('패턴명을 입력해주세요.');

      const rowsData = [];
      for (let i = 1; i <= ROWS_COUNT; i++) {
        rowsData.push({
          name: document.getElementById(`name_${i}`).value,
          strength: document.getElementById(`strength_${i}`).value,
          dose: document.getElementById(`dose_${i}`).value,
          days: document.getElementById(`days_${i}`).value
        });
      }

      const patterns = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      patterns[name] = {
        days: document.getElementById('commonDays').value,
        rows: rowsData
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(patterns));

      document.getElementById('patternName').value = '';
      refreshPatternSelect();
      document.getElementById('savedPatternSelect').value = name;
      alert(`'${name}' 패턴이 저장되었습니다.`);
    }

    function refreshPatternSelect() {
      const select = document.getElementById('savedPatternSelect');
      const patterns = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      select.innerHTML = '<option value="">-- 선택 --</option>';
      Object.keys(patterns).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name;
        select.appendChild(opt);
      });
    }

    function loadSelectedPattern() {
      const name = document.getElementById('savedPatternSelect').value;
      if (!name) return;
      const patterns = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const target = patterns[name];
      if (!target) return;

      if (target.days) {
        document.getElementById('commonDays').value = target.days;
      }

      const rows = target.rows || target;
      rows.forEach((row, idx) => {
        const i = idx + 1;
        document.getElementById(`name_${i}`).value = row.name || '';
        document.getElementById(`strength_${i}`).value = row.strength || '';
        document.getElementById(`dose_${i}`).value = row.dose || '';
        document.getElementById(`days_${i}`).value = row.days || target.days || '';
      });
      calculateAll();
    }

    function deleteSelectedPattern() {
      const select = document.getElementById('savedPatternSelect');
      if (!select.value) return alert('삭제할 패턴을 선택해주세요.');
      if (confirm(`'${select.value}' 패턴을 삭제하시겠습니까?`)) {
        const patterns = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        delete patterns[select.value];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(patterns));
        refreshPatternSelect();
      }
    }

    function resetForm() {
      document.getElementById('patientName').value = '';
      document.getElementById('commonWeight').value = '';
      document.getElementById('commonDays').value = '';
      document.getElementById('savedPatternSelect').value = '';
      document.getElementById('capture-timestamp').textContent = '';
      initRows();
    }

    window.onload = function() {
      initRows();
      refreshPatternSelect();
    };
  </script>
</body>
</html>
