<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>접수 관리 및 소요시간 설정 (m6)</title>
<style>
  :root {
    --primary: #16875a;
    --border: #e2e8f0;
    --bg: #f8fafc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", system-ui, sans-serif;
    background: #f1f5f9;
    padding: 12px;
    color: #1e293b;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  h2 {
    font-size: 15px;
    font-weight: 900;
    margin-bottom: 10px;
    color: #0f172a;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .badge-range {
    font-size: 11px;
    background: #e2e8f0;
    color: #475569;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .auto-notice {
    font-size: 11px;
    color: #16a34a;
    font-weight: 800;
  }

  /* 입력 폼 */
  .manual-form {
    display: grid;
    grid-template-columns: 1.2fr 1.5fr 80px 80px;
    gap: 6px;
    margin-top: 6px;
  }
  input, select {
    padding: 6px 8px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 12px;
    outline: none;
    width: 100%;
  }
  input:focus, select:focus { border-color: var(--primary); }

  /* 숫자 입력창 화살표(▲▼ 스핀 버튼) 완전히 없애기 */
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] {
    -moz-appearance: textfield; /* Firefox 지원 */
  }

  .btn-add {
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
  }

  /* 테이블 */
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  th { background: #f8fafc; padding: 7px 6px; border-bottom: 1px solid var(--border); color: #64748b; font-weight: 800; }
  td { padding: 7px 6px; border-bottom: 1px solid #f1f5f9; text-align: center; }
  
  .time-badge {
    font-size: 11px;
    font-weight: 800;
    color: #475569;
    background: #f1f5f9;
    padding: 2px 5px;
    border-radius: 4px;
  }

  .status-select {
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }
  .status-wait { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
  .status-treat { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  .status-done { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }

  .btn-del {
    background: #ef4444;
    color: #fff;
    border: none;
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
  }

  /* 분 입력창 커스텀 스타일 */
  .min-input {
    width: 60px;
    text-align: center;
    font-weight: 900;
    color: #0f172a;
    background: #fdfdfd;
  }
  .min-input:focus {
    background: #fff;
    border-color: #16a34a;
    box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.15);
  }
</style>
</head>
<body>

  <!-- [1] 일반예약 직접 등록 (31번대~) -->
  <div class="card">
    <h2>
      <span>🏥 일반예약 직접 등록 <span class="badge-range">31번대</span></span>
      <span class="auto-notice">⚡ 숫자 입력 후 Enter 치면 즉시 반영</span>
    </h2>
    <div class="manual-form">
      <input type="text" id="m-name" placeholder="동물명 (예: 보리)" onkeydown="if(event.key==='Enter') addManualBooking()">
      <select id="m-category">
        <option value="일반진료">일반진료</option>
        <option value="예방접종">예방접종</option>
        <option value="건강검진">건강검진</option>
        <option value="처치수술">처치수술</option>
        <option value="상담처방">상담처방</option>
        <option value="내복약조제">내복약조제</option>
        <option value="특수동물진료">특수동물진료</option>
      </select>
      <input type="number" id="m-minutes" class="min-input" placeholder="분" value="15" onkeydown="if(event.key==='Enter') addManualBooking()">
      <button class="btn-add" onclick="addManualBooking()">추가</button>
    </div>

    <table id="table-manual">
      <thead>
        <tr>
          <th>번호</th>
          <th>등록시각</th>
          <th>동물명</th>
          <th>분류</th>
          <th>소요(분)</th>
          <th>진료상태 (선택 시 즉시반영)</th>
          <th>삭제</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- [2] 원내 QR접수 환자 관리 (21번대~) -->
  <div class="card">
    <h2>
      <span>📱 QR접수 관리 <span class="badge-range">21번대</span></span>
      <span class="auto-notice">⚡ 숫자 입력 후 Enter 치면 즉시 자동 저장</span>
    </h2>
    <table id="table-qr">
      <thead>
        <tr>
          <th>번호</th>
          <th>접수시각</th>
          <th>동물명</th>
          <th>분류 선택</th>
          <th>소요(분)</th>
          <th>진료상태 (선택 시 즉시반영)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
const API_BASE = "https://m5-api.yurmgirl.workers.dev";
const RECEPTION_API = "/api/receptions";
const CATEGORIES = ["예방접종", "일반진료", "건강검진", "처치수술", "상담처방", "내복약조제", "특수동물진료"];

function formatTime(d){
  const date = d ? new Date(d) : new Date();
  return date.toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", hour12: false});
}

// --- 일반예약 로직 ---
function getManualBookings(){
  return JSON.parse(localStorage.getItem("m6_manual_bookings") || "[]");
}
function setManualBookings(data){
  localStorage.setItem("m6_manual_bookings", JSON.stringify(data));
  renderManualTable();
}

function addManualBooking(){
  const name = document.getElementById("m-name").value.trim();
  const category = document.getElementById("m-category").value;
  const minutes = document.getElementById("m-minutes").value.trim() || 15;
  if(!name){ alert("동물명을 입력하세요."); return; }

  const list = getManualBookings();
  list.push({
    id: Date.now(),
    petName: name,
    category: category,
    minutes: Number(minutes),
    status: "접수대기",
    time: formatTime()
  });
  setManualBookings(list);
  document.getElementById("m-name").value = "";
}

function updateManualStatus(id, newStatus){
  const list = getManualBookings().map(item => {
    if(item.id === id) item.status = newStatus;
    return item;
  });
  setManualBookings(list);
}

function updateManualCategory(id, newCat){
  const list = getManualBookings().map(item => {
    if(item.id === id) item.category = newCat;
    return item;
  });
  setManualBookings(list);
}

function updateManualMinutes(id, newMin){
  const val = Number(newMin);
  if(isNaN(val) || val <= 0) return;
  const list = getManualBookings().map(item => {
    if(item.id === id) item.minutes = val;
    return item;
  });
  setManualBookings(list);
}

function deleteManualBooking(id){
  const list = getManualBookings().filter(item => item.id !== id);
  setManualBookings(list);
}

function renderManualTable(){
  const list = getManualBookings();
  const tbody = document.querySelector("#table-manual tbody");
  tbody.innerHTML = "";

  if(!list.length){
    tbody.innerHTML = `<tr><td colspan="7" style="color:#94a3b8; padding:14px;">등록된 일반예약이 없습니다.</td></tr>`;
    return;
  }

  list.forEach((item, idx) => {
    const tr = document.createElement("tr");
    let catOpts = CATEGORIES.map(c => `<option value="${c}" ${item.category===c?'selected':''}>${c}</option>`).join("");
    
    tr.innerHTML = `
      <td style="font-weight:900; color:#b45309;">${31 + idx}</td>
      <td><span class="time-badge">${item.time || formatTime()}</span></td>
      <td style="font-weight:900;">${item.petName}</td>
      <td>
        <select onchange="updateManualCategory(${item.id}, this.value)">${catOpts}</select>
      </td>
      <td>
        <input type="number" 
               class="min-input" 
               value="${item.minutes}" 
               onchange="updateManualMinutes(${item.id}, this.value)" 
               onkeydown="if(event.key==='Enter'){ this.blur(); }">
      </td>
      <td>
        <select class="status-select ${item.status === '진료중' ? 'status-treat' : item.status === '진료완료' ? 'status-done' : 'status-wait'}" 
                onchange="updateManualStatus(${item.id}, this.value)">
          <option value="접수대기" ${item.status === '접수대기' ? 'selected' : ''}>접수대기</option>
          <option value="진료중" ${item.status === '진료중' ? 'selected' : ''}>진료중</option>
          <option value="진료완료" ${item.status === '진료완료' ? 'selected' : ''}>진료완료</option>
        </select>
      </td>
      <td><button class="btn-del" onclick="deleteManualBooking(${item.id})">삭제</button></td>
    `;
    tbody.appendChild(tr);
  });
}

// --- QR 접수 로직 ---
async function loadQrList(){
  try {
    const [r, e] = await Promise.all([
      fetch(RECEPTION_API, { cache: "no-store" }),
      fetch(API_BASE + "/estimates", { cache: "no-store" })
    ]);
    const receptions = r.ok ? await r.json() : [];
    const estimateData = e.ok ? await e.json() : {};
    const items = Array.isArray(receptions) ? receptions : (receptions.items || []);
    
    const savedCategories = JSON.parse(localStorage.getItem("m6_categories") || "{}");
    const savedStatuses = JSON.parse(localStorage.getItem("m6_qr_statuses") || "{}");
    const estimates = estimateData.estimates || {};

    const tbody = document.querySelector("#table-qr tbody");
    tbody.innerHTML = "";

    const activeList = items.filter(i => {
      const k = String(i.id ?? i.reception_id ?? "");
      const st = savedStatuses[k] || i.status || "접수대기";
      return !["완료", "진료완료", "취소", "종료"].includes(st);
    });

    if(!activeList.length){
      tbody.innerHTML = `<tr><td colspan="6" style="color:#94a3b8; padding:14px;">대기 중인 QR접수가 없습니다.</td></tr>`;
      return;
    }

    activeList.forEach((item, idx) => {
      const key = String(item.id ?? item.reception_id ?? "");
      const currentCat = savedCategories[key] || "일반진료";
      const currentMin = estimates[key] || 15;
      const currentStatus = savedStatuses[key] || item.status || "접수대기";
      const regTime = formatTime(item.created_at || item.createdAt || item.registered_at);

      let catOptions = CATEGORIES.map(c => `<option value="${c}" ${currentCat === c ? "selected" : ""}>${c}</option>`).join("");

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td style="font-weight:900; color:#0369a1;">${21 + idx}</td>
        <td><span class="time-badge">${regTime}</span></td>
        <td style="font-weight:900;">${item.pet_name || item.animal_name || "이름 미입력"}</td>
        <td>
          <select onchange="autoSaveQrCategory('${key}', this.value)">${catOptions}</select>
        </td>
        <td>
          <input type="number" 
                 class="min-input" 
                 value="${currentMin}" 
                 onchange="autoSaveQrMinutes('${key}', this.value)" 
                 onkeydown="if(event.key==='Enter'){ this.blur(); }">
        </td>
        <td>
          <select class="status-select ${currentStatus === '진료중' ? 'status-treat' : currentStatus === '진료완료' ? 'status-done' : 'status-wait'}"
                  onchange="autoSaveQrStatus('${key}', this.value)">
            <option value="접수대기" ${currentStatus === '접수대기' ? 'selected' : ''}>접수대기</option>
            <option value="진료중" ${currentStatus === '진료중' ? 'selected' : ''}>진료중</option>
            <option value="진료완료" ${currentStatus === '진료완료' ? 'selected' : ''}>진료완료</option>
          </select>
        </td>
      `;
      tbody.appendChild(tr);
    });
  } catch (err) {
    console.error(err);
  }
}

function autoSaveQrCategory(key, val){
  const savedCategories = JSON.parse(localStorage.getItem("m6_categories") || "{}");
  savedCategories[key] = val;
  localStorage.setItem("m6_categories", JSON.stringify(savedCategories));
}

function autoSaveQrStatus(key, val){
  const savedStatuses = JSON.parse(localStorage.getItem("m6_qr_statuses") || "{}");
  savedStatuses[key] = val;
  localStorage.setItem("m6_qr_statuses", JSON.stringify(savedStatuses));
  loadQrList();
}

async function autoSaveQrMinutes(key, val){
  const minVal = Number(val);
  if(isNaN(minVal) || minVal <= 0) return;
  try {
    await fetch(API_BASE + "/estimates", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: key, minutes: minVal })
    });
  } catch(e) { console.error(e); }
}

renderManualTable();
loadQrList();
setInterval(loadQrList, 3000);
</script>
</body>
</html>
