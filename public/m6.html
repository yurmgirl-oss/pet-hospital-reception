<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>접수 관리 및 타이머·상태 설정 (m6)</title>
<style>
  :root {
    --primary: #16875a;
    --border: #e2e8f0;
    --bg: #f8fafc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", system-ui, sans-serif;
    background: #f1f5f9;
    padding: 12px;
    color: #1e293b;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  h2 {
    font-size: 15px;
    font-weight: 900;
    margin-bottom: 10px;
    color: #0f172a;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .badge-range {
    font-size: 11px;
    background: #e2e8f0;
    color: #475569;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .auto-notice {
    font-size: 11px;
    color: #16a34a;
    font-weight: 800;
  }

  /* 긴급 공지 컨트롤 카드 */
  .urgent-card {
    border: 2px solid #f87171;
    background: #fff5f5;
  }
  .urgent-card h2 { color: #991b1b; }
  .quick-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .quick-btn {
    background: #ffffff;
    border: 1px solid #fca5a5;
    color: #b91c1c;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }
  .quick-btn:hover { background: #fee2e2; }
  .urgent-form { display: flex; gap: 6px; }
  .urgent-input {
    flex: 1;
    padding: 7px 10px;
    border: 1.5px solid #fca5a5;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 800;
    color: #7f1d1d;
    outline: none;
    background: #ffffff;
  }
  .urgent-input:focus { border-color: #ef4444; }
  .btn-urgent-on {
    background: #ef4444;
    color: #ffffff;
    border: none;
    padding: 0 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-urgent-on:hover { background: #dc2626; }
  .btn-urgent-off {
    background: #64748b;
    color: #ffffff;
    border: none;
    padding: 0 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-urgent-off:hover { background: #475569; }

  /* 폼 */
  .manual-form {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 88px;
    gap: 8px;
    margin-top: 6px;
    align-items: stretch;
  }
  .manual-form input { min-width: 0; }
  .manual-form .btn-add { min-height: 34px; }
  input, select {
    padding: 7px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    width: 100%;
  }
  input:focus, select:focus { border-color: var(--primary); }

  .btn-add {
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-add:hover { background: #1d4ed8; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  th { background: #f8fafc; padding: 8px 6px; border-bottom: 1px solid var(--border); color: #64748b; font-weight: 800; }
  td { padding: 8px 6px; border-bottom: 1px solid #f1f5f9; text-align: center; }
  
  tr.row-done { background: #f8fafc; opacity: 0.75; }
  tr.row-done td { color: #64748b; }
  tr.row-reserve { background: #fffbeb; }

  .time-badge {
    font-size: 11px;
    font-weight: 800;
    color: #475569;
    background: #f1f5f9;
    padding: 3px 6px;
    border-radius: 4px;
  }

  .timer-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-family: monospace;
    font-size: 12px;
    font-weight: 900;
    padding: 4px 8px;
    border-radius: 6px;
    background: #f1f5f9;
    color: #64748b;
  }
  .timer-running {
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #93c5fd;
    animation: pulseTimer 1s infinite alternate;
  }
  .timer-finished {
    background: #f1f5f9;
    color: #64748b;
    border: 1px solid #cbd5e1;
  }
  @keyframes pulseTimer {
    0% { opacity: 0.85; }
    100% { opacity: 1; transform: scale(1.02); }
  }

  .status-select {
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }
  .status-wait { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
  .status-reserve { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
  .status-treat { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  .status-done { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
  .status-delete { background: #fef2f2; color: #b91c1c; border: 1px solid #fca5a5; }

  .btn-del {
    background: #ef4444;
    color: #fff;
    border: none;
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-del:hover { background: #dc2626; }
</style>
</head>
<body>

  <!-- [1] 긴급 공지 컨트롤 (문구 프리셋 관리 + 저장/선택 기능) -->
  <div class="card urgent-card">
    <h2>
      <span>🚨 전 병원 모니터 긴급공지 발령 (중앙 서버 연동)</span>
      <span id="urgent-status-tag" style="font-size:11px; font-weight:800; color:#dc2626;">[현재: 미발령]</span>
    </h2>
    
    <!-- 저장된 공지문 선택 & 관리 바 -->
    <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; background:#fff; padding:6px 10px; border-radius:8px; border:1px solid #fecaca;">
      <div style="display:flex; align-items:center; gap:6px; flex:1; min-width:240px;">
        <span style="font-size:11px; font-weight:800; color:#991b1b; white-space:nowrap;">📋 저장된 공지문:</span>
        <select id="preset-select" onchange="onSelectPreset()" style="font-size:12px; font-weight:800; padding:4px 8px; border:1px solid #f87171; border-radius:6px; background:#fff; color:#7f1d1d; flex:1; outline:none; cursor:pointer;">
          <option value="">-- 자주 쓰는 공지문 선택 --</option>
        </select>
      </div>
      <div style="display:flex; gap:4px;">
        <button type="button" class="quick-btn" onclick="saveCurrentPreset()" style="background:#059669; color:#fff; border-color:#059669;" title="현재 입력창의 문구를 목록에 저장">💾 문구 저장</button>
        <button type="button" class="quick-btn" onclick="deleteCurrentPreset()" style="background:#f1f5f9; color:#64748b; border-color:#cbd5e1;" title="선택한 문구를 목록에서 삭제">🗑️ 삭제</button>
      </div>
    </div>

    <!-- 기본 바로가기 빠른 칩 -->
    <div class="quick-btns" id="preset-chips"></div>

    <!-- 입력창 및 전광판 ON/OFF 버튼 -->
    <div class="urgent-form">
      <input type="text" id="urgent-text" class="urgent-input" placeholder="m5/대기실에 띄울 긴급 안내 문구를 직접 입력하거나 위에서 선택하세요" onkeydown="if(event.key==='Enter') activateUrgentNotice()">
      <button class="btn-urgent-on" onclick="activateUrgentNotice()">화면 띄우기 (ON)</button>
      <button class="btn-urgent-off" onclick="clearUrgentNotice()">공지 해제 (OFF)</button>
    </div>
  </div>

  <!-- [2] 일반예약 등록 -->
  <div class="card">
    <h2>
      <span>🏥 일반예약 직접 등록 <span class="badge-range">31번대</span></span>
      <span class="auto-notice">🌐 전 컴퓨터 실시간 동기화 모드</span>
    </h2>
    <div class="manual-form">
      <input type="text" id="m-name" placeholder="동물 이름 입력" onkeydown="if(event.key==='Enter') addManualBooking()">
      <button class="btn-add" onclick="addManualBooking()">추가</button>
    </div>

    <table id="table-manual">
      <thead>
        <tr>
          <th>번호</th>
          <th>등록시각</th>
          <th>동물명</th>
          <th>진료 타이머</th>
          <th>진료상태</th>
          <th>진료분류</th>
          <th>F8 전송</th>
          <th>삭제</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- [3] QR접수 환자 관리 -->
  <div class="card">
    <h2>
      <span>📱 QR 접수 관리 <span class="badge-range">통합 대기목록</span></span>
      <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
        <span id="qr-sync-status" class="auto-notice">⚡ 서버 확인 중...</span>
        <button type="button" id="qr-restore-hidden-btn" onclick="restoreHiddenQrItems()" style="display:none;padding:5px 9px;border:1px solid #f59e0b;background:#fffbeb;color:#92400e;border-radius:7px;font-size:11px;font-weight:800;cursor:pointer;">숨김 접수 복원</button>
      </span>
    </h2>
    <table id="table-qr">
      <thead>
        <tr>
          <th>번호</th>
          <th>접수시각</th>
          <th>동물명</th>
          <th>진료 타이머</th>
          <th>진료상태</th>
          <th>진료분류</th>
          <th>F8 전송</th>
          <th>삭제</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
const SYNC_API = "https://m5-api.yurmgirl.workers.dev/sync";
const RECEPTION_API = "/api/receptions";

// 신규 QR 접수 알림음
// 첫 조회 때는 기존 접수 목록을 기준값으로만 저장하고, 이후 새로 들어온 건만 알립니다.
let knownReceptionIds = null;
let m6AudioContext = null;
let m6AudioUnlocked = false;

function unlockM6Audio(){
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    if(!m6AudioContext) m6AudioContext = new AudioCtx();
    if(m6AudioContext.state === "suspended") m6AudioContext.resume();
    m6AudioUnlocked = true;
  } catch(e) {
    console.warn("알림음 초기화 실패:", e);
  }
}

function playM6ReceptionChime(count = 1){
  if(!m6AudioUnlocked || !m6AudioContext) return;
  try {
    if(m6AudioContext.state === "suspended") m6AudioContext.resume();
    const now = m6AudioContext.currentTime;
    const tones = [880, 1174.66];
    const repeat = Math.min(Math.max(1, count), 3);

    for(let i = 0; i < repeat; i++){
      const start = now + i * 0.62;
      tones.forEach((frequency, index) => {
        const oscillator = m6AudioContext.createOscillator();
        const gain = m6AudioContext.createGain();
        const at = start + index * 0.13;
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequency, at);
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(0.16, at + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.22);
        oscillator.connect(gain);
        gain.connect(m6AudioContext.destination);
        oscillator.start(at);
        oscillator.stop(at + 0.24);
      });
    }
  } catch(e) {
    console.warn("접수 알림음 재생 실패:", e);
  }
}

// 브라우저 자동재생 제한 해제: M6 화면에서 첫 클릭/키 입력 시 오디오를 활성화합니다.
window.addEventListener("pointerdown", unlockM6Audio, { once: true });
window.addEventListener("keydown", unlockM6Audio, { once: true });

function detectNewReceptionAndNotify(receptionItems, receptionOk){
  if(!receptionOk) return;
  const ids = new Set(receptionItems.map(item => String(item.id ?? item.reception_id ?? "")).filter(Boolean));
  if(knownReceptionIds === null){
    knownReceptionIds = ids;
    return;
  }
  let newCount = 0;
  for(const id of ids) if(!knownReceptionIds.has(id)) newCount++;
  knownReceptionIds = ids;
  if(newCount > 0) playM6ReceptionChime(newCount);
}
const CATEGORIES = ["단순관리", "코드블루", "4days", "호스피스", "수술관리", "심폐관리", "신부전", "종양관리", "골관절", "피부알러지", "발작경련", "추적관리", "호르몬장애", "특수관리"];

let isUserInputting = false;

let GlobalState = {
  manualBookings: [],
  categories: {},
  qrStatuses: {},
  qrDeleted: [],
  urgentNotice: null
};

function formatTime(d){
  const date = d ? new Date(d) : new Date();
  return date.toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", hour12: false});
}

function getElapsedText(startTime, endTime){
  if(!startTime) return "00:00";
  const end = endTime || Date.now();
  const diffSec = Math.max(0, Math.floor((end - startTime) / 1000));
  const m = String(Math.floor(diffSec / 60)).padStart(2, "0");
  const s = String(diffSec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function buildTimerBadge(key, startTime, status, endTime){
  if(status === "진료완료"){
    return `<span class="timer-badge timer-finished" id="timer-${key}">🏁 ${getElapsedText(startTime, endTime)}</span>`;
  }
  if(status === "예약대기"){
    return `<span class="timer-badge" id="timer-${key}" style="color:#b45309; background:#fffbeb;">📅 예약보관</span>`;
  }
  if(status !== "진료중" || !startTime){
    return `<span class="timer-badge" id="timer-${key}">대기중</span>`;
  }
  return `<span class="timer-badge timer-running" id="timer-${key}">⏱️ ${getElapsedText(startTime)}</span>`;
}

function getStatusClass(status){
  if(status === "진료중") return "status-treat";
  if(status === "진료완료") return "status-done";
  if(status === "예약대기") return "status-reserve";
  return "status-wait";
}

// 1초마다 실시간 타이머 UI 갱신
setInterval(() => {
  const list = GlobalState.manualBookings || [];
  list.forEach(item => {
    if(item.status === "진료중" && item.startTime){
      const el = document.getElementById(`timer-m-${item.id}`);
      if(el) el.textContent = `⏱️ ${getElapsedText(item.startTime)}`;
    }
  });

  const qrTimers = JSON.parse(localStorage.getItem("m6_qr_timers") || "{}");
  const statuses = GlobalState.qrStatuses || {};
  Object.keys(qrTimers).forEach(key => {
    const currentStatus = statuses[key];
    if(currentStatus === "진료중" && qrTimers[key]?.start){
      const el = document.getElementById(`timer-qr-${key}`);
      if(el) el.textContent = `⏱️ ${getElapsedText(qrTimers[key].start)}`;
    }
  });
}, 1000);

// 서버 동기화 함수
async function pushStateToServer(partialState){
  GlobalState = { ...GlobalState, ...partialState };
  try {
    await fetch(SYNC_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(partialState)
    });
  } catch(e) {
    console.error("서버 동기화 실패:", e);
  }
  notifyLocalFrames();
}

async function fetchStateFromServer(){
  try {
    const res = await fetch(SYNC_API, { cache: "no-store" });
    if(res.ok){
      const data = await res.json();
      GlobalState = { ...GlobalState, ...data };
      updateUrgentUI();
      if(!isUserInputting) {
        renderManualTable();
        loadQrList();
      }
    }
  } catch(e) {}
}

function notifyLocalFrames(){
  try {
    if(window.parent){
      window.parent.postMessage("reload_m5", "*");
      const m5Frame = window.parent.document.getElementById("frame-m5");
      if(m5Frame && m5Frame.contentWindow && m5Frame.contentWindow.refresh){
        m5Frame.contentWindow.refresh();
      }
    }
  } catch(e){}
}

// 긴급 공지 제어
function setUrgentQuick(text){
  document.getElementById("urgent-text").value = text;
}
function activateUrgentNotice(){
  const text = document.getElementById("urgent-text").value.trim();
  if(!text){ alert("공지 내용을 입력하세요."); return; }
  const notice = { active: true, text: text, time: Date.now() };
  pushStateToServer({ urgentNotice: notice });
}
function clearUrgentNotice(){
  document.getElementById("urgent-text").value = "";
  pushStateToServer({ urgentNotice: { active: false, text: "" } });
}
function updateUrgentUI(){
  const tag = document.getElementById("urgent-status-tag");
  const un = GlobalState.urgentNotice;
  if(un && un.active){
    tag.textContent = "🔴 [현재: 전 병원 모니터에 긴급공지 팝업 중!]";
    tag.style.color = "#dc2626";
    if(!document.getElementById("urgent-text").value) {
      document.getElementById("urgent-text").value = un.text;
    }
  } else {
    tag.textContent = "⚪ [현재: 미발령]";
    tag.style.color = "#64748b";
  }
}

// 일반 예약 로직
function addManualBooking(){
  const name = document.getElementById("m-name").value.trim();
  // 일반예약은 우선 단순관리로 등록하고, 필요한 경우 아래 목록에서 진료분류를 변경한다.
  const category = "단순관리";
  if(!name){ alert("동물명을 입력하세요."); return; }

  const list = [...(GlobalState.manualBookings || [])];
  list.push({
    id: Date.now(),
    petName: name,
    phone: "",
    category: category,
    status: "접수대기",
    startTime: null,
    endTime: null,
    time: formatTime()
  });

  pushStateToServer({ manualBookings: list });
  document.getElementById("m-name").value = "";
  renderManualTable();
}

function updateManualStatus(id, newStatus){
  if(newStatus === "자료삭제"){
    deleteManualBooking(id);
    return;
  }
  const list = (GlobalState.manualBookings || []).map(item => {
    if(item.id === id){
      item.status = newStatus;
      if(newStatus === "진료중"){
        if(!item.startTime) item.startTime = Date.now();
        item.endTime = null;
      } else if(newStatus === "진료완료"){
        if(item.startTime && !item.endTime) item.endTime = Date.now();
      } else if(newStatus === "접수대기" || newStatus === "예약대기"){
        item.startTime = null;
        item.endTime = null;
      }
    }
    return item;
  });
  pushStateToServer({ manualBookings: list });
  renderManualTable();
}

function updateManualCategory(id, newCat){
  const list = (GlobalState.manualBookings || []).map(item => {
    if(item.id === id) item.category = newCat;
    return item;
  });
  pushStateToServer({ manualBookings: list });
}

function deleteManualBooking(id){
  const list = (GlobalState.manualBookings || []).filter(item => item.id !== id);
  pushStateToServer({ manualBookings: list });
  renderManualTable();
}

function renderManualTable(){
  if(isUserInputting) return;
  const list = GlobalState.manualBookings || [];
  const tbody = document.querySelector("#table-manual tbody");
  tbody.innerHTML = "";

  if(!list.length){
    tbody.innerHTML = `<tr><td colspan="8" style="color:#94a3b8; padding:14px;">등록된 일반예약이 없습니다.</td></tr>`;
    return;
  }

  list.forEach((item, idx) => {
    const tr = document.createElement("tr");
    if(item.status === "진료완료") tr.className = "row-done";
    if(item.status === "예약대기") tr.className = "row-reserve";

    const safeCategory = CATEGORIES.includes(item.category) ? item.category : "특수관리";
    let catOpts = CATEGORIES.map(c => `<option value="${c}" ${safeCategory===c?'selected':''}>${c}</option>`).join("");
    
    tr.innerHTML = `
      <td style="font-weight:900; color:#b45309;">${31 + idx}</td>
      <td><span class="time-badge">${item.time || formatTime()}</span></td>

          <option value="예약대기" ${item.status === '예약대기' ? 'selected' : ''}>📅 예약대기</option>
          <option value="진료중" ${item.status === '진료중' ? 'selected' : ''}>진료중</option>
          <option value="진료완료" ${item.status === '진료완료' ? 'selected' : ''}>진료완료</option>

        </select>
      </td>
      <td><select id="mcat-${item.id}" onchange="updateManualCategory(${item.id}, this.value)">${catOpts}</select></td>

      <td><button class="btn-del" onclick="deleteManualBooking(${item.id})">삭제</button></td>
    `;
    tbody.appendChild(tr);
  });
}

// QR 접수 목록은 /api/receptions만 조회하고 상태는 /sync로 공유합니다.
async function loadQrList(){
  if(isUserInputting) return;
  const syncStatus = document.getElementById("qr-sync-status");
  try {
    const response = await fetch(RECEPTION_API, { cache: "no-store" });
    if(!response.ok) throw new Error("QR 접수 조회 실패");
    const data = await response.json();
    const receptionItems = Array.isArray(data) ? data : (Array.isArray(data.items) ? data.items : []);
    detectNewReceptionAndNotify(receptionItems, true);

    const items = receptionItems.map(item => ({
      ...item, __m6Key: String(item.id ?? item.reception_id ?? "")
    })).filter(item => item.__m6Key);

    const categories = GlobalState.categories || {};
    const statuses = GlobalState.qrStatuses || {};
    const deleted = GlobalState.qrDeleted || [];
    const qrTimers = JSON.parse(localStorage.getItem("m6_qr_timers") || "{}");
    const keyOf = item => item.__m6Key || String(item.id ?? item.reception_id ?? "");
    const statusOf = item => item.status || statuses[keyOf(item)] || "접수대기";
    const hiddenByDeleted = items.filter(item => deleted.includes(keyOf(item)));
    const hiddenByStatus = items.filter(item => {
      const key = keyOf(item), st = statusOf(item);
      return !deleted.includes(key) && (st === "자료삭제" || ["취소", "종료"].includes(st));
    });

    if(syncStatus){
      syncStatus.textContent = `⚡ QR 접수 ${receptionItems.length}건 · 정상 연결됨`;
      syncStatus.style.color = "#16a34a";
    }
    const restoreBtn = document.getElementById("qr-restore-hidden-btn");
    if(restoreBtn){
      restoreBtn.style.display = hiddenByDeleted.length ? "inline-block" : "none";
      restoreBtn.textContent = `숨김 접수 ${hiddenByDeleted.length}건 복원`;
      restoreBtn.disabled = false;
    }

    const activeList = items.filter(item => {
      const key = keyOf(item), st = statusOf(item);
      return !deleted.includes(key) && st !== "자료삭제" && !["취소", "종료"].includes(st);
    });
    const tbody = document.querySelector("#table-qr tbody");
    if(!tbody) return;
    if(!activeList.length){
      const hiddenTotal = hiddenByDeleted.length + hiddenByStatus.length;
      tbody.innerHTML = `<tr><td colspan="8" style="color:#94a3b8; padding:14px;">현재 대기 중인 QR 접수가 없습니다.${hiddenTotal ? ` (숨김 ${hiddenTotal}건)` : ""}</td></tr>`;
      return;
    }
    tbody.innerHTML = "";
    activeList.forEach((item, idx) => {
      const key = keyOf(item);
      const currentCat = CATEGORIES.includes(categories[key]) ? categories[key] : "특수관리";
      const currentStatus = statusOf(item);
      const regTime = formatTime(item.created_at || item.createdAt || item.registered_at);
      const timerData = qrTimers[key] || {};
      const petName = item.pet_name || item.animal_name || "이름 미입력";
      const catOptions = CATEGORIES.map(c => `<option value="${c}" ${currentCat === c ? "selected" : ""}>${c}</option>`).join("");
      const tr = document.createElement("tr");
      tr.dataset.phone = item.phone || item.owner_phone || "";
      tr.dataset.receptionTime = item.created_at || item.createdAt || item.registered_at || "";
      if(currentStatus === "진료완료") tr.className = "row-done";
      if(currentStatus === "예약대기") tr.className = "row-reserve";
      tr.innerHTML = `
        <td style="font-weight:900; color:#0369a1;">${21 + idx}</td>
        <td><span class="time-badge">${regTime}</span></td>
        <td style="font-weight:900; font-size:13px;">${petName}</td>
        <td>${buildTimerBadge(`qr-${key}`, timerData.start, currentStatus, timerData.end)}</td>
        <td><select class="status-select ${getStatusClass(currentStatus)}" onchange="saveQrStatus('${key}', this.value)">
          <option value="접수대기" ${currentStatus === "접수대기" ? "selected" : ""}>접수대기</option>
          <option value="예약대기" ${currentStatus === "예약대기" ? "selected" : ""}>📅 예약대기</option>
          <option value="진료중" ${currentStatus === "진료중" ? "selected" : ""}>진료중</option>
          <option value="진료완료" ${currentStatus === "진료완료" ? "selected" : ""}>진료완료</option>
          <option value="자료삭제" class="status-delete">자료삭제</option>
        </select></td>
        <td><select id="qcat-${key}" onchange="saveQrCategory('${key}', this.value)">${catOptions}</select></td>
        <td>${currentCat === "단순관리" ? '<span style="color:#94a3b8;font-size:11px;">전송 불필요</span>' : `<button class="btn-add" onclick="sendQrToM8('${key}')">선택 후 보내기</button>`}</td>
        <td><button class="btn-del" onclick="deleteQrItem('${key}')">삭제</button></td>`;
      tbody.appendChild(tr);
    });
  } catch(e) {
    console.error("M6 QR 접수 목록 오류:", e);
    if(syncStatus){ syncStatus.textContent = "⚠️ QR 접수 목록 조회 오류"; syncStatus.style.color = "#b91c1c"; }
  }
}

async function postPatientToM8({name,phone,category,receptionTime}){
  if(!name || !category){alert("동물 이름과 진료분류를 확인해 주세요.");return;}
  if(category==="단순관리"){alert("단순관리는 F8로 전송하지 않습니다.");return;}
  try{
    const check=await fetch("/api/m8-management",{cache:"no-store"});
    if(!check.ok) throw new Error("F8 환자 목록을 불러오지 못했습니다.");
    const existing=await check.json();
    const patients=Array.isArray(existing.patients)?existing.patients:[];
    const normalizedPhone=(phone||"").replace(/\D/g,"");
    const duplicate=patients.find(p=>String(p.name||"").trim()===name.trim() && (!normalizedPhone || String(p.phone||"").replace(/\D/g,"")===normalizedPhone));
    if(duplicate){alert("이미 F8에 등록된 환자입니다. 기존 기록은 자동 변경하지 않았습니다.");return;}
    const res=await fetch("/api/m8-management",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      name, phone:phone||"", category, registered_at:receptionTime||new Date().toISOString()
    })});
    const result=await res.json();
    if(!res.ok || !result.success) throw new Error(result.message||"F8 전송에 실패했습니다.");
    alert(`${name} 환자를 F8 ${category} 방으로 전송했습니다.`);
  }catch(e){alert("F8 전송 오류: "+e.message);}
}
function sendQrToM8(key){
  const tr=Array.from(document.querySelectorAll("#table-qr tbody tr")).find(row=>row.querySelector(`[id="qcat-${key}"]`));
  if(!tr)return;
  const cat=tr.querySelector(`[id="qcat-${key}"]`).value;
  postPatientToM8({name:tr.children[2]?.textContent.trim()||"",phone:tr.dataset.phone||"",category:cat,receptionTime:tr.dataset.receptionTime||""});
}
function sendManualToM8(id){
  const item=(GlobalState.manualBookings||[]).find(x=>String(x.id)===String(id));
  if(!item)return;
  postPatientToM8({name:item.petName,phone:item.phone||"",category:item.category,receptionTime:item.time||""});
}
function saveQrCategory(key, val){
  const cats = { ...(GlobalState.categories || {}) };
  cats[key] = val;
  pushStateToServer({ categories: cats });
}

async function saveQrStatus(key, val){
  if(val === "자료삭제"){ deleteQrItem(key); return; }
  try {
    const res = await fetch(RECEPTION_API, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: Number(key), status: val })
    });
    const result = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(result.error || `상태 변경 실패 (${res.status})`);

    const qrTimers = JSON.parse(localStorage.getItem("m6_qr_timers") || "{}");
    if(!qrTimers[key]) qrTimers[key] = {};
    if(val === "진료중"){
      if(!qrTimers[key].start) qrTimers[key].start = Date.now();
      qrTimers[key].end = null;
    } else if(val === "진료완료" || val === "완료"){
      if(qrTimers[key].start && !qrTimers[key].end) qrTimers[key].end = Date.now();
    } else if(val === "접수대기" || val === "예약대기"){
      delete qrTimers[key];
    }
    localStorage.setItem("m6_qr_timers", JSON.stringify(qrTimers));
    await loadQrList();
  } catch(e) {
    alert("접수 상태 변경 오류: " + (e.message || e));
    loadQrList();
  }
}

function deleteQrItem(key){
  if(!confirm("이 접수 건을 목록에서 완전히 삭제하시겠습니까?")) return;
  const dels = [...(GlobalState.qrDeleted || [])];
  if(!dels.includes(key)) dels.push(key);
  pushStateToServer({ qrDeleted: dels });
  loadQrList();
}

// M6에서 숨김 처리한 QR접수만 복원합니다. 원본 receptions 데이터는 삭제/수정하지 않습니다.
async function restoreHiddenQrItems(){
  const deleted = Array.isArray(GlobalState.qrDeleted) ? GlobalState.qrDeleted : [];
  if(!deleted.length){ alert("복원할 숨김 접수가 없습니다."); return; }
  if(!confirm(`M6에서 숨김 처리한 QR접수 ${deleted.length}건을 다시 표시할까요?\n원본 접수 데이터는 변경하지 않습니다.`)) return;
  const btn = document.getElementById("qr-restore-hidden-btn");
  if(btn){ btn.disabled = true; btn.textContent = "복원 중..."; }
  try {
    await pushStateToServer({ qrDeleted: [] });
    await fetchStateFromServer();
    await loadQrList();
    alert("숨김 처리된 QR접수를 복원했습니다.");
  } catch(e) {
    alert("복원에 실패했습니다: " + (e.message || e));
  } finally {
    if(btn) btn.disabled = false;
  }
}

// ========================================================
// 📢 긴급공지 문구 프리셋 관리 (저장, 선택, 삭제)
// ========================================================
const DEFAULT_PRESETS = [
  "📱 [접수안내] 안녕하세요. 어서오세요. 진료를 원하시면 QR코드로 접수해 주시기 바랍니다. 어려우시면 직원을 호출해 주세요.",
  "🚨 응급 수술 진행 중입니다. 잠시만 대기해 주세요.",
  "⏳ 잠시 자리를 비웁니다. 곧 돌아오겠습니다.",
  "🍱 직원 식사 및 휴게 시간입니다. (문의는 벨을 눌러주세요)",
  "⚠️ 응급 환자 처치로 인해 진료가 일시 지연되고 있습니다.",
  "🩺 지금은 원내 소독 및 준비 시간입니다."
];

function getSavedPresets() {
  const guidePreset = "📱 [접수안내] 안녕하세요. 어서오세요. 진료를 원하시면 QR코드로 접수해 주시기 바랍니다. 어려우시면 직원을 호출해 주세요.";
  const saved = localStorage.getItem("m6_notice_presets");
  if (!saved) return DEFAULT_PRESETS;
  try {
    let parsed = JSON.parse(saved);
    if (Array.isArray(parsed) && parsed.length > 0) {
      if (!parsed.some(p => p.includes("QR코드로 접수해 주시기 바랍니다"))) {
        parsed.unshift(guidePreset);
        localStorage.setItem("m6_notice_presets", JSON.stringify(parsed));
      }
      return parsed;
    }
    return DEFAULT_PRESETS;
  } catch(e) {
    return DEFAULT_PRESETS;
  }
}

function renderPresetsUI() {
  const presets = getSavedPresets();
  const select = document.getElementById("preset-select");
  const chipsContainer = document.getElementById("preset-chips");
  
  if (select) {
    select.innerHTML = '<option value="">-- 자주 쓰는 공지문 선택 --</option>';
    presets.forEach((text) => {
      const opt = document.createElement("option");
      opt.value = text;
      opt.textContent = text.length > 30 ? text.substring(0, 30) + "..." : text;
      select.appendChild(opt);
    });
  }

  if (chipsContainer) {
    chipsContainer.innerHTML = "";
    presets.slice(0, 4).forEach(text => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "quick-btn";
      const shortText = text.replace(/^[📱🚨⏳🍱⚠️🩺\s]+/, "").substring(0, 10);
      btn.textContent = text.substring(0, 2) + " " + shortText;
      btn.title = text;
      btn.onclick = () => setUrgentQuick(text);
      chipsContainer.appendChild(btn);
    });
  }
}

function onSelectPreset() {
  const select = document.getElementById("preset-select");
  if (select && select.value) {
    document.getElementById("urgent-text").value = select.value;
  }
}

function saveCurrentPreset() {
  const input = document.getElementById("urgent-text");
  const text = (input ? input.value : "").trim();
  if (!text) {
    alert("저장할 공지 문구를 입력창에 먼저 적어주세요.");
    if (input) input.focus();
    return;
  }

  let presets = getSavedPresets();
  if (presets.includes(text)) {
    alert("이미 저장되어 있는 공지 문구입니다.");
    return;
  }

  presets.push(text);
  localStorage.setItem("m6_notice_presets", JSON.stringify(presets));
  renderPresetsUI();

  const select = document.getElementById("preset-select");
  if (select) select.value = text;
  alert("새 공지 문구가 목록에 저장되었습니다!");
}

function deleteCurrentPreset() {
  const select = document.getElementById("preset-select");
  const text = select ? select.value : "";
  if (!text) {
    alert("삭제할 공지 문구를 선택박스에서 먼저 선택해 주세요.");
    return;
  }

  if (!confirm(`선택한 공지 문구를 목록에서 삭제하시겠습니까?\n"${text}"`)) {
    return;
  }

  let presets = getSavedPresets();
  presets = presets.filter(item => item !== text);
  if (presets.length === 0) presets = [...DEFAULT_PRESETS];
  localStorage.setItem("m6_notice_presets", JSON.stringify(presets));
  renderPresetsUI();
  document.getElementById("urgent-text").value = "";
  alert("삭제되었습니다.");
}

// 초기 프리셋 UI 로드
renderPresetsUI();

// 선택 조작 중 화면이 다시 그려져 항목이 사라지는 현상 방지
// 드롭다운에 포커스가 있는 동안에는 자동 갱신을 멈추고,
// 포커스가 빠진 뒤에도 최소 5초간 화면을 유지한 다음 갱신한다.
let interactionReleaseTimer = null;

function holdTableDuringSelection() {
  isUserInputting = true;
  if (interactionReleaseTimer) {
    clearTimeout(interactionReleaseTimer);
    interactionReleaseTimer = null;
  }
}

function releaseTableAfterSelection() {
  if (interactionReleaseTimer) clearTimeout(interactionReleaseTimer);

  interactionReleaseTimer = setTimeout(() => {
    isUserInputting = false;
    interactionReleaseTimer = null;
    fetchStateFromServer();
  }, 5000);
}

["table-manual", "table-qr"].forEach(tableId => {
  const table = document.getElementById(tableId);
  if (!table) return;

  table.addEventListener("focusin", holdTableDuringSelection);
  table.addEventListener("focusout", (event) => {
    // 다른 선택 항목으로 바로 이동하는 경우에는 잠금을 유지한다.
    if (event.relatedTarget && table.contains(event.relatedTarget)) return;
    releaseTableAfterSelection();
  });

  // 선택 변경 후에도 최소 5초간 화면을 보존한다.
  table.addEventListener("change", () => {
    holdTableDuringSelection();
    releaseTableAfterSelection();
  });
});

// 초기 동기화 후 7초 주기로 서버 동기화
fetchStateFromServer();
setInterval(() => {
  if (!isUserInputting) fetchStateFromServer();
}, 7000);
</script>
