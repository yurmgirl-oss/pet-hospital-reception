<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>접수 관리 및 타이머·상태 설정 (m6)</title>
<style>
  :root {
    --primary: #16875a;
    --border: #e2e8f0;
    --bg: #f8fafc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", system-ui, sans-serif;
    background: #f1f5f9;
    padding: 12px;
    color: #1e293b;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  h2 {
    font-size: 15px;
    font-weight: 900;
    margin-bottom: 10px;
    color: #0f172a;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .badge-range {
    font-size: 11px;
    background: #e2e8f0;
    color: #475569;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .auto-notice {
    font-size: 11px;
    color: #16a34a;
    font-weight: 800;
  }

  /* 긴급 공지 컨트롤 카드 */
  .urgent-card {
    border: 2px solid #f87171;
    background: #fff5f5;
  }
  .urgent-card h2 { color: #991b1b; }
  .quick-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .quick-btn {
    background: #ffffff;
    border: 1px solid #fca5a5;
    color: #b91c1c;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }
  .quick-btn:hover { background: #fee2e2; }
  .urgent-form { display: flex; gap: 6px; }
  .urgent-input {
    flex: 1;
    padding: 7px 10px;
    border: 1.5px solid #fca5a5;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 800;
    color: #7f1d1d;
    outline: none;
    background: #ffffff;
  }
  .urgent-input:focus { border-color: #ef4444; }
  .btn-urgent-on {
    background: #ef4444;
    color: #ffffff;
    border: none;
    padding: 0 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-urgent-on:hover { background: #dc2626; }
  .btn-urgent-off {
    background: #64748b;
    color: #ffffff;
    border: none;
    padding: 0 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-urgent-off:hover { background: #475569; }

  /* 폼 */
  .manual-form {
    display: grid;
    grid-template-columns: 1fr 180px 100px;
    gap: 8px;
    margin-top: 6px;
  }
  input, select {
    padding: 7px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    width: 100%;
  }
  input:focus, select:focus { border-color: var(--primary); }

  .btn-add {
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-add:hover { background: #1d4ed8; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  th { background: #f8fafc; padding: 8px 6px; border-bottom: 1px solid var(--border); color: #64748b; font-weight: 800; }
  td { padding: 8px 6px; border-bottom: 1px solid #f1f5f9; text-align: center; }
  
  tr.row-done { background: #f8fafc; opacity: 0.75; }
  tr.row-done td { color: #64748b; }
  tr.row-reserve { background: #fffbeb; }

  .time-badge {
    font-size: 11px;
    font-weight: 800;
    color: #475569;
    background: #f1f5f9;
    padding: 3px 6px;
    border-radius: 4px;
  }

  .timer-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-family: monospace;
    font-size: 12px;
    font-weight: 900;
    padding: 4px 8px;
    border-radius: 6px;
    background: #f1f5f9;
    color: #64748b;
  }
  .timer-running {
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #93c5fd;
    animation: pulseTimer 1s infinite alternate;
  }
  .timer-finished {
    background: #f1f5f9;
    color: #64748b;
    border: 1px solid #cbd5e1;
  }
  @keyframes pulseTimer {
    0% { opacity: 0.85; }
    100% { opacity: 1; transform: scale(1.02); }
  }

  .status-select {
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }
  .status-wait { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
  .status-reserve { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; } /* 📅 예약대기 스타일 */
  .status-treat { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  .status-done { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
  .status-delete { background: #fef2f2; color: #b91c1c; border: 1px solid #fca5a5; }

  .btn-del {
    background: #ef4444;
    color: #fff;
    border: none;
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-del:hover { background: #dc2626; }
</style>
</head>
<body>

  <!-- [1] 긴급 공지 컨트롤 -->
  <div class="card urgent-card">
    <h2>
      <span>🚨 전 병원 모니터 긴급공지 발령 (중앙 서버 연동)</span>
      <span id="urgent-status-tag" style="font-size:11px; font-weight:800; color:#dc2626;">[현재: 미발령]</span>
    </h2>
    <div class="quick-btns">
      <button class="quick-btn" onclick="setUrgentQuick('🚨 응급 수술 진행 중입니다. 잠시만 대기해 주세요.')">🚨 응급 수술 중</button>
      <button class="quick-btn" onclick="setUrgentQuick('⏳ 잠시 자리를 비웁니다. 곧 돌아오겠습니다.')">⏳ 잠시 자리 비움</button>
      <button class="quick-btn" onclick="setUrgentQuick('🍱 직원 식사 및 휴게 시간입니다. (문의는 벨을 눌러주세요)')">🍱 식사/휴게 시간</button>
      <button class="quick-btn" onclick="setUrgentQuick('⚠️ 응급 환자 처치로 인해 진료가 일시 지연되고 있습니다.')">⚠️ 진료 일시 지연</button>
    </div>
    <div class="urgent-form">
      <input type="text" id="urgent-text" class="urgent-input" placeholder="m5 중앙에 띄울 긴급 안내 문구를 입력하세요">
      <button class="btn-urgent-on" onclick="activateUrgentNotice()">화면 띄우기 (ON)</button>
      <button class="btn-urgent-off" onclick="clearUrgentNotice()">공지 해제 (OFF)</button>
    </div>
  </div>

  <!-- [2] 일반예약 등록 -->
  <div class="card">
    <h2>
      <span>🏥 일반예약 직접 등록 <span class="badge-range">31번대</span></span>
      <span class="auto-notice">🌐 전 컴퓨터 실시간 동기화 모드</span>
    </h2>
    <div class="manual-form">
      <input type="text" id="m-name" placeholder="동물명 (예: 보리)" onkeydown="if(event.key==='Enter') addManualBooking()">
      <select id="m-category">
        <option value="일반진료">일반진료</option>
        <option value="예방접종">예방접종</option>
        <option value="건강검진">건강검진</option>
        <option value="처치수술">처치수술</option>
        <option value="상담처방">상담처방</option>
        <option value="내복약조제">내복약조제</option>
        <option value="특수동물진료">특수동물진료</option>
      </select>
      <button class="btn-add" onclick="addManualBooking()">추가</button>
    </div>

    <table id="table-manual">
      <thead>
        <tr>
          <th>번호</th>
          <th>등록시각</th>
          <th>동물명</th>
          <th>진료분류</th>
          <th>진료 타이머</th>
          <th>진료상태</th>
          <th>삭제</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- [3] QR접수 환자 관리 -->
  <div class="card">
    <h2>
      <span>📱 QR접수 관리 <span class="badge-range">21번대</span></span>
      <span class="auto-notice">⚡ 변경 시 키오스크 및 현황판 실시간 반영</span>
    </h2>
    <table id="table-qr">
      <thead>
        <tr>
          <th>번호</th>
          <th>접수시각</th>
          <th>동물명</th>
          <th>진료분류</th>
          <th>진료 타이머</th>
          <th>진료상태</th>
          <th>삭제</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
const SYNC_API = "https://m5-api.yurmgirl.workers.dev/sync";
const RECEPTION_API = "/api/receptions";
const CATEGORIES = ["일반진료", "예방접종", "건강검진", "처치수술", "상담처방", "내복약조제", "특수동물진료"];

let isUserInputting = false;

let GlobalState = {
  manualBookings: [],
  categories: {},
  qrStatuses: {},
  qrDeleted: [],
  urgentNotice: null
};

function formatTime(d){
  const date = d ? new Date(d) : new Date();
  return date.toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", hour12: false});
}

function getElapsedText(startTime, endTime){
  if(!startTime) return "00:00";
  const end = endTime || Date.now();
  const diffSec = Math.max(0, Math.floor((end - startTime) / 1000));
  const m = String(Math.floor(diffSec / 60)).padStart(2, "0");
  const s = String(diffSec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function buildTimerBadge(key, startTime, status, endTime){
  if(status === "진료완료"){
    return `<span class="timer-badge timer-finished" id="timer-${key}">🏁 ${getElapsedText(startTime, endTime)}</span>`;
  }
  if(status === "예약대기"){
    return `<span class="timer-badge" id="timer-${key}" style="color:#b45309; background:#fffbeb;">📅 예약보관</span>`;
  }
  if(status !== "진료중" || !startTime){
    return `<span class="timer-badge" id="timer-${key}">대기중</span>`;
  }
  return `<span class="timer-badge timer-running" id="timer-${key}">⏱️ ${getElapsedText(startTime)}</span>`;
}

function getStatusClass(status){
  if(status === "진료중") return "status-treat";
  if(status === "진료완료") return "status-done";
  if(status === "예약대기") return "status-reserve";
  return "status-wait";
}

// 1초마다 실시간 타이머 UI 갱신
setInterval(() => {
  const list = GlobalState.manualBookings || [];
  list.forEach(item => {
    if(item.status === "진료중" && item.startTime){
      const el = document.getElementById(`timer-m-${item.id}`);
      if(el) el.textContent = `⏱️ ${getElapsedText(item.startTime)}`;
    }
  });

  const qrTimers = JSON.parse(localStorage.getItem("m6_qr_timers") || "{}");
  const statuses = GlobalState.qrStatuses || {};
  Object.keys(qrTimers).forEach(key => {
    if(statuses[key] === "진료중" && qrTimers[key]?.start){
      const el = document.getElementById(`timer-qr-${key}`);
      if(el) el.textContent = `⏱️ ${getElapsedText(qrTimers[key].start)}`;
    }
  });
}, 1000);

// 서버 동기화 함수
async function pushStateToServer(partialState){
  GlobalState = { ...GlobalState, ...partialState };
  try {
    await fetch(SYNC_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(partialState)
    });
  } catch(e) {
    console.error("서버 동기화 실패:", e);
  }
  notifyLocalFrames();
}

async function fetchStateFromServer(){
  try {
    const res = await fetch(SYNC_API, { cache: "no-store" });
    if(res.ok){
      const data = await res.json();
      GlobalState = { ...GlobalState, ...data };
      updateUrgentUI();
      if(!isUserInputting) {
        renderManualTable();
        loadQrList();
      }
    }
  } catch(e) {}
}

function notifyLocalFrames(){
  try {
    if(window.parent){
      window.parent.postMessage("reload_m5", "*");
      const m5Frame = window.parent.document.getElementById("frame-m5");
      if(m5Frame && m5Frame.contentWindow && m5Frame.contentWindow.refresh){
        m5Frame.contentWindow.refresh();
      }
    }
  } catch(e){}
}

// 긴급 공지 제어
function setUrgentQuick(text){
  document.getElementById("urgent-text").value = text;
}
function activateUrgentNotice(){
  const text = document.getElementById("urgent-text").value.trim();
  if(!text){ alert("공지 내용을 입력하세요."); return; }
  const notice = { active: true, text: text, time: Date.now() };
  pushStateToServer({ urgentNotice: notice });
}
function clearUrgentNotice(){
  document.getElementById("urgent-text").value = "";
  pushStateToServer({ urgentNotice: { active: false, text: "" } });
}
function updateUrgentUI(){
  const tag = document.getElementById("urgent-status-tag");
  const un = GlobalState.urgentNotice;
  if(un && un.active){
    tag.textContent = "🔴 [현재: 전 병원 모니터에 긴급공지 팝업 중!]";
    tag.style.color = "#dc2626";
    if(!document.getElementById("urgent-text").value) {
      document.getElementById("urgent-text").value = un.text;
    }
  } else {
    tag.textContent = "⚪ [현재: 미발령]";
    tag.style.color = "#64748b";
  }
}

// 일반 예약 로직
function addManualBooking(){
  const name = document.getElementById("m-name").value.trim();
  const category = document.getElementById("m-category").value;
  if(!name){ alert("동물명을 입력하세요."); return; }

  const list = [...(GlobalState.manualBookings || [])];
  list.push({
    id: Date.now(),
    petName: name,
    category: category,
    status: "접수대기",
    startTime: null,
    endTime: null,
    time: formatTime()
  });

  pushStateToServer({ manualBookings: list });
  document.getElementById("m-name").value = "";
  renderManualTable();
}

function updateManualStatus(id, newStatus){
  if(newStatus === "자료삭제"){
    deleteManualBooking(id);
    return;
  }
  const list = (GlobalState.manualBookings || []).map(item => {
    if(item.id === id){
      item.status = newStatus;
      if(newStatus === "진료중"){
        if(!item.startTime) item.startTime = Date.now();
        item.endTime = null;
      } else if(newStatus === "진료완료"){
        if(item.startTime && !item.endTime) item.endTime = Date.now();
      } else if(newStatus === "접수대기" || newStatus === "예약대기"){
        item.startTime = null;
        item.endTime = null;
      }
    }
    return item;
  });
  pushStateToServer({ manualBookings: list });
  renderManualTable();
}

function updateManualCategory(id, newCat){
  const list = (GlobalState.manualBookings || []).map(item => {
    if(item.id === id) item.category = newCat;
    return item;
  });
  pushStateToServer({ manualBookings: list });
}

function deleteManualBooking(id){
  const list = (GlobalState.manualBookings || []).filter(item => item.id !== id);
  pushStateToServer({ manualBookings: list });
  renderManualTable();
}

function renderManualTable(){
  if(isUserInputting) return;
  const list = GlobalState.manualBookings || [];
  const tbody = document.querySelector("#table-manual tbody");
  tbody.innerHTML = "";

  if(!list.length){
    tbody.innerHTML = `<tr><td colspan="7" style="color:#94a3b8; padding:14px;">등록된 일반예약이 없습니다.</td></tr>`;
    return;
  }

  list.forEach((item, idx) => {
    const tr = document.createElement("tr");
    if(item.status === "진료완료") tr.className = "row-done";
    if(item.status === "예약대기") tr.className = "row-reserve";

    let catOpts = CATEGORIES.map(c => `<option value="${c}" ${item.category===c?'selected':''}>${c}</option>`).join("");
    
    tr.innerHTML = `
      <td style="font-weight:900; color:#b45309;">${31 + idx}</td>
      <td><span class="time-badge">${item.time || formatTime()}</span></td>
      <td style="font-weight:900; font-size:13px;">${item.petName}</td>
      <td><select onchange="updateManualCategory(${item.id}, this.value)">${catOpts}</select></td>
      <td>${buildTimerBadge(`m-${item.id}`, item.startTime, item.status, item.endTime)}</td>
      <td>
        <select class="status-select ${getStatusClass(item.status)}" 
                onchange="updateManualStatus(${item.id}, this.value)">
          <option value="접수대기" ${item.status === '접수대기' ? 'selected' : ''}>접수대기</option>
          <option value="예약대기" ${item.status === '예약대기' ? 'selected' : ''}>📅 예약대기</option>
          <option value="진료중" ${item.status === '진료중' ? 'selected' : ''}>진료중</option>
          <option value="진료완료" ${item.status === '진료완료' ? 'selected' : ''}>진료완료</option>
          <option value="자료삭제" class="status-delete">자료삭제</option>
        </select>
      </td>
      <td><button class="btn-del" onclick="deleteManualBooking(${item.id})">삭제</button></td>
    `;
    tbody.appendChild(tr);
  });
}

// QR 접수 로직
async function loadQrList(){
  if(isUserInputting) return;
  try {
    const res = await fetch(RECEPTION_API, { cache: "no-store" });
    const receptions = res.ok ? await res.json() : [];
    const items = Array.isArray(receptions) ? receptions : (receptions.items || []);

    const categories = GlobalState.categories || {};
    const statuses = GlobalState.qrStatuses || {};
    const deleted = GlobalState.qrDeleted || [];
    const qrTimers = JSON.parse(localStorage.getItem("m6_qr_timers") || "{}");

    const tbody = document.querySelector("#table-qr tbody");
    if(!tbody) return;

    const activeList = items.filter(i => {
      const k = String(i.id ?? i.reception_id ?? "");
      if(deleted.includes(k)) return false;
      const st = statuses[k] || i.status || "접수대기";
      return st !== "자료삭제" && !["취소", "종료"].includes(st);
    });

    if(!activeList.length){
      tbody.innerHTML = `<tr><td colspan="7" style="color:#94a3b8; padding:14px;">대기 중인 QR접수가 없습니다.</td></tr>`;
      return;
    }

    tbody.innerHTML = "";

    activeList.forEach((item, idx) => {
      const key = String(item.id ?? item.reception_id ?? "");
      const currentCat = categories[key] || "일반진료";
      const currentStatus = statuses[key] || item.status || "접수대기";
      const regTime = formatTime(item.created_at || item.createdAt || item.registered_at);
      const timerData = qrTimers[key] || {};

      const tr = document.createElement("tr");
      if(currentStatus === "진료완료") tr.className = "row-done";
      if(currentStatus === "예약대기") tr.className = "row-reserve";

      let catOptions = CATEGORIES.map(c => `<option value="${c}" ${currentCat === c ? "selected" : ""}>${c}</option>`).join("");

      tr.innerHTML = `
        <td style="font-weight:900; color:#0369a1;">${21 + idx}</td>
        <td><span class="time-badge">${regTime}</span></td>
        <td style="font-weight:900; font-size:13px;">${item.pet_name || item.animal_name || "이름 미입력"}</td>
        <td><select onchange="saveQrCategory('${key}', this.value)">${catOptions}</select></td>
        <td>${buildTimerBadge(`qr-${key}`, timerData.start, currentStatus, timerData.end)}</td>
        <td>
          <select class="status-select ${getStatusClass(currentStatus)}"
                  onchange="saveQrStatus('${key}', this.value)">
            <option value="접수대기" ${currentStatus === '접수대기' ? 'selected' : ''}>접수대기</option>
            <option value="예약대기" ${currentStatus === '예약대기' ? 'selected' : ''}>📅 예약대기</option>
            <option value="진료중" ${currentStatus === '진료중' ? 'selected' : ''}>진료중</option>
            <option value="진료완료" ${currentStatus === '진료완료' ? 'selected' : ''}>진료완료</option>
            <option value="자료삭제" class="status-delete">자료삭제</option>
          </select>
        </td>
        <td><button class="btn-del" onclick="deleteQrItem('${key}')">삭제</button></td>
      `;
      tbody.appendChild(tr);
    });
  } catch(e){}
}

function saveQrCategory(key, val){
  const cats = { ...(GlobalState.categories || {}) };
  cats[key] = val;
  pushStateToServer({ categories: cats });
}

function saveQrStatus(key, val){
  if(val === "자료삭제"){
    deleteQrItem(key);
    return;
  }
  const sts = { ...(GlobalState.qrStatuses || {}) };
  sts[key] = val;

  const qrTimers = JSON.parse(localStorage.getItem("m6_qr_timers") || "{}");
  if(!qrTimers[key]) qrTimers[key] = {};

  if(val === "진료중"){
    if(!qrTimers[key].start) qrTimers[key].start = Date.now();
    qrTimers[key].end = null;
  } else if(val === "진료완료"){
    if(qrTimers[key].start && !qrTimers[key].end) qrTimers[key].end = Date.now();
  } else if(val === "접수대기" || val === "예약대기"){
    delete qrTimers[key];
  }
  localStorage.setItem("m6_qr_timers", JSON.stringify(qrTimers));

  pushStateToServer({ qrStatuses: sts });
  loadQrList();
}

function deleteQrItem(key){
  if(!confirm("이 접수 건을 목록에서 완전히 삭제하시겠습니까?")) return;
  const dels = [...(GlobalState.qrDeleted || [])];
  if(!dels.includes(key)) dels.push(key);
  pushStateToServer({ qrDeleted: dels });
  loadQrList();
}

// 3초 주기 서버 동기화
fetchStateFromServer();
setInterval(fetchStateFromServer, 3000);
</script>
</body>
</html>
