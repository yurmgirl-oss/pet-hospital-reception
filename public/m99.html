<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>23시 하단오거리 동물병원 · M9 통합 운영 포털</title>
<style>
:root{--nav:#12382e;--nav2:#1b4d3e;--accent:#16a05a;--bg:#edf2ef;--line:#d8e2dc;--text:#1c2b24;--muted:#718078}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--text)}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:58px minmax(0,1fr);width:100%;height:100%}
.topbar{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--nav);color:#effcf4;border-bottom:2px solid #24634d}
.brand{font-weight:900;font-size:16px;letter-spacing:-.4px;display:flex;align-items:center;gap:9px}
.top-actions{display:flex;align-items:center;gap:8px}
.top-btn{border:1px solid #4c806b;background:#1d6048;color:#fff;border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer}
.top-btn:hover{background:#267958}
.sidebar{grid-row:2;min-height:0;background:#102e25;color:#e8f5ed;padding:14px 10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.nav-caption{font-size:10px;font-weight:900;color:#91b8a4;letter-spacing:1px;padding:7px 10px 3px}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;border:1px solid transparent;border-radius:9px;background:transparent;color:#dcebe2;padding:11px 10px;text-align:left;font-size:13px;font-weight:800;cursor:pointer}
.nav-btn:hover{background:#1b4436}
.nav-btn.active{background:#176344;border-color:#3c9870;color:#fff;box-shadow:inset 3px 0 #7ce0a8}
.nav-code{font-size:10px;min-width:26px;color:#9dd9b6;font-weight:900}
.sidebar-foot{margin-top:auto;border-top:1px solid #2b4e40;padding:12px 9px 4px;color:#9eb8aa;font-size:10px;line-height:1.6}
.workspace{grid-row:2;grid-column:2;min-width:0;min-height:0;padding:10px;display:flex;flex-direction:column;gap:8px}
.room-head{height:42px;flex:0 0 42px;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;box-shadow:0 2px 5px rgba(0,0,0,.04)}
.room-title{font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px}
.room-status{font-size:11px;color:var(--muted)}
.room-actions{display:flex;gap:6px}
.room-btn{border:1px solid #cddbd2;background:#f7faf8;color:#315543;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:800;cursor:pointer}
.room-btn:hover{background:#e8f3ec}
.room-stage{position:relative;flex:1;min-height:0;border:1px solid #d7e2db;border-radius:11px;background:#fff;overflow:hidden;box-shadow:0 3px 9px rgba(0,0,0,.05)}
.room-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
.room-frame.active{display:block}
.room-placeholder{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#68786f;text-align:center;padding:25px}
.room-placeholder strong{font-size:18px;color:#294b39}
.room-placeholder small{font-size:12px;line-height:1.7}
@media(max-width:760px){.app{grid-template-columns:66px minmax(0,1fr)}.brand{font-size:13px}.sidebar{padding:10px 6px}.nav-btn{justify-content:center;padding:12px 4px}.nav-label,.nav-caption,.sidebar-foot{display:none}.nav-code{font-size:11px}.workspace{padding:6px}.topbar{padding:0 10px}.room-status{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span style="font-size:23px">🐾</span><span>23시 하단오거리 동물병원 <span style="color:#a7e6c1">· M9 통합 운영</span></span></div>
    <div class="top-actions">
      <button class="top-btn" type="button" onclick="refreshCurrentRoom()">↻ 현재 방 새로고침</button>
      <button class="top-btn" type="button" onclick="refreshAllRooms()">⟳ 전체 새로고침</button>
    </div>
  </header>
  <aside class="sidebar">
    <div class="nav-caption">병원 관리실</div>
    <button class="nav-btn active" data-room="m1" onclick="openRoom('m1')"><span class="nav-code">M1</span><span class="nav-label">원내 접수 현황판</span></button>
    <button class="nav-btn" data-room="m2" onclick="openRoom('m2')"><span class="nav-code">M2</span><span class="nav-label">복약관리 시스템</span></button>
    <button class="nav-btn" data-room="m3" onclick="openRoom('m3')"><span class="nav-code">M3</span><span class="nav-label">실시간 출력</span></button>
    <button class="nav-btn" data-room="m4" onclick="openRoom('m4')"><span class="nav-code">M4</span><span class="nav-label">약량 계산기</span></button>
    <button class="nav-btn" data-room="m5" onclick="openRoom('m5')"><span class="nav-code">M5</span><span class="nav-label">접수 대기판</span></button>
    <button class="nav-btn" data-room="m6" onclick="openRoom('m6')"><span class="nav-code">M6</span><span class="nav-label">접수 관리</span></button>
    <button class="nav-btn" data-room="m7" onclick="openRoom('m7')"><span class="nav-code">M7</span><span class="nav-label">특수동물 관리</span></button>
    <button class="nav-btn" data-room="m8" onclick="openRoom('m8')"><span class="nav-code">M8</span><span class="nav-label">특수환자 관리</span></button>
    <div class="sidebar-foot">M9는 통합 메뉴와 화면 전환을 담당합니다.<br>각 관리실은 기존 파일과 데이터를 유지하며 연결됩니다.</div>
  </aside>
  <main class="workspace">
    <div class="room-head">
      <div><div class="room-title" id="roomTitle">📋 M1 · 원내 접수 현황판</div><div class="room-status" id="roomStatus">기존 접수 현황판을 그대로 연결합니다.</div></div>
      <div class="room-actions">
        <button class="room-btn" type="button" onclick="openCurrentRoomNewWindow()">새 창</button>
        <button class="room-btn" type="button" onclick="refreshCurrentRoom()">새로고침</button>
      </div>
    </div>
    <section class="room-stage">
      <iframe id="frame-m1" class="room-frame active" src="/counter.html" title="M1 원내 접수 현황판"></iframe>
      <iframe id="frame-med" class="room-frame" src="/m1.html" title="M2 복약관리 및 M3 실시간 출력" onload="prepareMedicationRoom()"></iframe>
      <iframe id="frame-m4" class="room-frame" src="/calc.html" title="M4 약량 계산기"></iframe>
      <iframe id="frame-m5" class="room-frame" src="/m5.html" title="M5 접수 대기판"></iframe>
      <iframe id="frame-m6" class="room-frame" src="/m6" title="M6 접수 관리"></iframe>
      <iframe id="frame-m7" class="room-frame" src="/exotic.html" title="M7 특수동물 관리"></iframe>
      <iframe id="frame-m8" class="room-frame" src="/m8.html" title="M8 특수환자 관리"></iframe>
    </section>
  </main>
</div>
<script>
const roomInfo={
 m1:{title:'📋 M1 · 원내 접수 현황판',status:'기존 접수 현황판을 그대로 연결합니다.',frame:'frame-m1',url:'/counter.html'},
 m2:{title:'💊 M2 · 복약관리 시스템',status:'복약 입력과 실시간 출력이 한 데이터 화면을 공유합니다.',frame:'frame-med',url:'/m1.html'},
 m3:{title:'🖨️ M3 · 실시간 출력',status:'M2에서 입력한 내용을 유지한 채 출력 미리보기만 크게 표시합니다.',frame:'frame-med',url:'/m1.html'},
 m4:{title:'🧮 M4 · 약량 계산기',status:'기존 약량 계산기를 연결합니다.',frame:'frame-m4',url:'/calc.html'},
 m5:{title:'🐾 M5 · 접수 대기판',status:'기존 접수 대기판을 그대로 연결합니다.',frame:'frame-m5',url:'/m5.html'},
 m6:{title:'🩺 M6 · 접수 관리',status:'기존 접수 관리 화면을 그대로 연결합니다.',frame:'frame-m6',url:'/m6'},
 m7:{title:'🦎 M7 · 특수동물 관리',status:'기존 특수동물 관리 화면을 그대로 연결합니다.',frame:'frame-m7',url:'/exotic.html'},
 m8:{title:'⭐ M8 · 특수환자 관리',status:'기존 특수환자 관리 화면을 그대로 연결합니다.',frame:'frame-m8',url:'/m8.html'}
};
let currentRoom='m1';
function openRoom(id){
 const info=roomInfo[id];if(!info)return;
 currentRoom=id;
 document.querySelectorAll('.room-frame').forEach(f=>f.classList.remove('active'));
 const frame=document.getElementById(info.frame);frame.classList.add('active');
 document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.room===id));
 document.getElementById('roomTitle').textContent=info.title;
 document.getElementById('roomStatus').textContent=info.status;
 if(id==='m2'||id==='m3')applyMedicationView(id);
}
function getFrameForRoom(){return document.getElementById(roomInfo[currentRoom].frame)}
function refreshCurrentRoom(){
 const f=getFrameForRoom();if(!f)return;
 if((currentRoom==='m2'||currentRoom==='m3')&&f.contentWindow){try{f.contentWindow.location.reload()}catch(e){}}
 else {try{f.contentWindow.location.reload()}catch(e){}}
}
function refreshAllRooms(){document.querySelectorAll('.room-frame').forEach(f=>{try{f.contentWindow.location.reload()}catch(e){}})}
function openCurrentRoomNewWindow(){const info=roomInfo[currentRoom];if(info)window.open(info.url,'_blank','noopener')}
function prepareMedicationRoom(){applyMedicationView(currentRoom==='m3'?'m3':'m2')}
function applyMedicationView(mode){
 const f=document.getElementById('frame-med');if(!f)return;
 try{
  const doc=f.contentDocument||f.contentWindow.document;if(!doc)return;
  let style=doc.getElementById('m9-room-style');
  if(!style){style=doc.createElement('style');style.id='m9-room-style';doc.head.appendChild(style)}
  const common=`
   html,body{width:100%!important;height:100%!important;overflow:auto!important}
   #counterPanel,#expandedGlobalControls{display:none!important}
   #integratedShell{display:block!important;width:100%!important;height:100%!important;padding:8px!important;margin:0!important;background:#eef3ef!important}
   #medicationPanel{display:block!important;width:100%!important;height:100%!important;overflow:auto!important}
   #medicationPanel .wrap{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:10px!important;width:100%!important;max-width:none!important;padding:0!important;margin:0!important}
   #medicationPanel .panel{min-width:0!important;height:calc(100vh - 74px)!important;overflow:auto!important;padding:12px!important}
  `;
  const outputOnly=`
   #medicationPanel .panel:first-child{display:none!important}
   #medicationPanel .panel:nth-child(2){display:flex!important;width:100%!important;height:calc(100vh - 74px)!important;overflow:auto!important}
   #medicationPanel .preview{width:196mm!important;max-width:100%!important;margin:8px auto!important}
  `;
  style.textContent=common+(mode==='m3'?outputOnly:'');
 }catch(e){console.warn('복약관리 화면 스타일 적용 실패:',e)}
}
window.addEventListener('keydown',e=>{
 if(e.target&&(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable))return;
 const map={F1:'m1',F2:'m2',F4:'m4',F5:'m5',F6:'m6',F7:'m7',F8:'m8'};
 if(map[e.key]){e.preventDefault();openRoom(map[e.key])}
});
</script>
</body>
</html>
