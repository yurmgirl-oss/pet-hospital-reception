<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>23시 하단오거리 동물병원 · M9 통합 포털</title>
<style>
:root{--green:#12382e;--green2:#1b5945;--accent:#27a36a;--bg:#e9efeb;--line:#cfdcd4;--ink:#1c3027;--muted:#6d7d74}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Pretendard,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
.app{height:100%;display:grid;grid-template-rows:58px 48px minmax(0,1fr)}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--green);color:#f3fff7;border-bottom:2px solid #2b6c53}
.brand{font-size:16px;font-weight:900;letter-spacing:-.3px}.topright{display:flex;gap:8px;align-items:center}.topbtn{border:1px solid #4c806b;background:#1c5944;color:white;border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer}
.screenbar{display:flex;align-items:center;gap:10px;padding:6px 16px;background:#fff;border-bottom:1px solid var(--line)}
.screenbtn{border:1px solid #cbd8d0;background:#f5f8f6;color:#385448;padding:8px 18px;border-radius:9px;font-weight:900;cursor:pointer}.screenbtn.active{background:#1c674b;color:#fff;border-color:#1c674b}.screenhint{margin-left:auto;font-size:12px;color:var(--muted)}
.workspace{min-height:0;padding:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px}
.workspace.screen-one{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.workspace.screen-one #tile-m1{grid-column:1;grid-row:1 / span 2}
.workspace.screen-one #tile-m6{grid-column:2;grid-row:1}
.workspace.screen-one #tile-m5{grid-column:2;grid-row:2}
.workspace.screen-one #tile-m2{grid-column:3;grid-row:1 / span 2}
.workspace.screen-one #tile-m3{grid-column:4;grid-row:1 / span 2}
.workspace.screen-two{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.workspace.screen-three{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.tile{display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid #cbd9d0;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 3px 10px #183d2b12}
.tilehead{height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#f9fbfa;border-bottom:1px solid #e0e9e3}.tiletitle{font-size:13px;font-weight:900;display:flex;gap:7px;align-items:center}.tilecode{font-size:10px;font-weight:900;color:#fff;background:#286449;border-radius:5px;padding:4px 6px}.tiletools{display:flex;gap:5px}.tilebtn{border:1px solid #cbd8d0;background:white;color:#315442;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:800;cursor:pointer}.tilebtn:hover{background:#e9f4ed}.tile iframe{width:100%;height:100%;border:0;background:white;min-height:0;flex:1}
.workspace.focus-mode{display:block;position:relative}.workspace.focus-mode .tile{display:none}.workspace.focus-mode .tile.maximized{display:flex;position:absolute;inset:10px;z-index:5}
.tile.hidden{display:none!important}
@media(max-width:1050px){.workspace.screen-one{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}.workspace.screen-one #tile-m1,.workspace.screen-one #tile-m2,.workspace.screen-one #tile-m3,.workspace.screen-one #tile-m6,.workspace.screen-one #tile-m5{grid-column:auto;grid-row:auto}.workspace.screen-two{grid-template-columns:minmax(0,1fr)}.workspace.screen-three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){.app{grid-template-rows:52px 46px minmax(0,1fr)}.brand{font-size:13px}.top{padding:0 8px}.topbtn{padding:6px 8px;font-size:11px}.screenbar{padding:5px 8px;overflow-x:auto}.screenbtn{padding:7px 10px;font-size:12px;white-space:nowrap}.screenhint{display:none}.workspace,.workspace.screen-one,.workspace.screen-two,.workspace.screen-three{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(5,minmax(220px,1fr));overflow:auto}.workspace.screen-two{grid-template-rows:minmax(500px,1fr)}.workspace.screen-three{grid-template-rows:repeat(2,minmax(300px,1fr))}.workspace.screen-one #tile-m1,.workspace.screen-one #tile-m2,.workspace.screen-one #tile-m3,.workspace.screen-one #tile-m6,.workspace.screen-one #tile-m5{grid-column:auto;grid-row:auto}.tile{min-height:220px}.workspace.focus-mode{overflow:hidden}.workspace.focus-mode .tile.maximized{inset:4px}}
</style></head><body>
<div class="app">
<header class="top"><div class="brand">🏥 23시 하단오거리 동물병원 · M9 통합 운영 포털</div><div class="topright"><button class="topbtn" onclick="refreshVisible()">현재 화면 새로고침</button><button class="topbtn" onclick="refreshAll()">전체 새로고침</button></div></header>
<nav class="screenbar"><button class="screenbtn active" data-screen="one" onclick="showScreen('one')">화면 1 · 원내 운영</button><button class="screenbtn" data-screen="two" onclick="showScreen('two')">화면 2 · 특수관리</button><button class="screenbtn" data-screen="three" onclick="showScreen('three')">화면 3 · 계산·특수동물</button><span class="screenhint">화면 1: M1 · M6/M5 · M2 · M3 / 화면 2: M8 / 화면 3: M4 · M7</span></nav>
<main id="workspace" class="workspace">
<section class="tile" data-screen="one" id="tile-m1"><div class="tilehead"><div class="tiletitle"><span class="tilecode">M1</span> 원내 접수 현황판</div><div class="tiletools"><button class="tilebtn" onclick="openRoom('m1')">새 창</button><button class="tilebtn" onclick="maximize('tile-m1')">⛶ 확대</button></div></div><iframe id="frame-m1" src="/counter.html" title="원내 접수 현황판"></iframe></section>
<section class="tile" data-screen="one" id="tile-m2"><div class="tilehead"><div class="tiletitle"><span class="tilecode">M2</span> 약속처방 관리 · 복약관리</div><div class="tiletools"><button class="tilebtn" onclick="openRoom('m2')">새 창</button><button class="tilebtn" onclick="maximize('tile-m2')">⛶ 확대</button></div></div><iframe id="frame-m2" src="/m9_medication.html?view=input" title="현재 약속처방 관리"></iframe></section>
<section class="tile" data-screen="one" id="tile-m3"><div class="tilehead"><div class="tiletitle"><span class="tilecode">M3</span> 실시간 출력 미리보기</div><div class="tiletools"><button class="tilebtn" onclick="openRoom('m3')">새 창</button><button class="tilebtn" onclick="maximize('tile-m3')">⛶ 확대</button></div></div><iframe id="frame-m3" src="/m9_medication.html?view=output" title="실시간 출력 미리보기"></iframe></section>
<section class="tile" data-screen="one" id="tile-m5"><div class="tilehead"><div class="tiletitle"><span class="tilecode">M5</span> 접수 대기판</div><div class="tiletools"><button class="tilebtn" onclick="openRoom('m5')">새 창</button><button class="tilebtn" onclick="maximize('tile-m5')">⛶ 확대</button></div></div><iframe id="frame-m5" src="/m5.html" title="접수 대기판"></iframe></section>
<section class="tile" data-screen="one" id="tile-m6"><div class="tilehead"><div class="tiletitle"><span class="tilecode">M6</span> 접수 관리</div><div class="tiletools"><button class="tilebtn" onclick="openRoom('m6')">새 창</button><button class="tilebtn" onclick="maximize('tile-m6')">⛶ 확대</button></div></div><iframe id="frame-m6" src="/m6" title="접수 관리"></iframe></section>
<section class="tile hidden" data-screen="two" data-screen="three" id="tile-m4"><div class="tilehead"><div class="tiletitle"><span class="tilecode">M4</span> 약량 계산기</div><div class="tiletools"><button class="tilebtn" onclick="openRoom('m4')">새 창</button><button class="tilebtn" onclick="maximize('tile-m4')">⛶ 확대</button></div></div><iframe id="frame-m4" src="/calc.html" title="약량 계산기"></iframe></section>
<section class="tile hidden" data-screen="two" data-screen="three" id="tile-m7"><div class="tilehead"><div class="tiletitle"><span class="tilecode">M7</span> 특수동물 관리</div><div class="tiletools"><button class="tilebtn" onclick="openRoom('m7')">새 창</button><button class="tilebtn" onclick="maximize('tile-m7')">⛶ 확대</button></div></div><iframe id="frame-m7" src="/exotic.html" title="특수동물 관리"></iframe></section>
<section class="tile hidden" data-screen="two" data-screen="two" id="tile-m8"><div class="tilehead"><div class="tiletitle"><span class="tilecode">M8</span> 특수환자 관리</div><div class="tiletools"><button class="tilebtn" onclick="openRoom('m8')">새 창</button><button class="tilebtn" onclick="maximize('tile-m8')">⛶ 확대</button></div></div><iframe id="frame-m8" src="/m8.html" title="특수환자 관리"></iframe></section>
</main></div>
<script>
const roomUrls={m1:'/counter.html',m2:'/m9_medication.html?view=input',m3:'/m9_medication.html?view=output',m4:'/calc.html',m5:'/m5.html',m6:'/m6',m7:'/exotic.html',m8:'/m8.html'};
let currentScreen='one',maximizedId=null;
function showScreen(which){if(!['one','two','three'].includes(which))which='one';currentScreen=which;const ws=document.getElementById('workspace');ws.classList.remove('focus-mode');maximizedId=null;document.querySelectorAll('.tile').forEach(t=>{const visible=t.dataset.screen===which;t.classList.toggle('hidden',!visible);t.classList.remove('maximized')});ws.classList.toggle('screen-two',which==='two');ws.classList.toggle('screen-one',which==='one');ws.classList.toggle('screen-three',which==='three');document.querySelectorAll('.screenbtn').forEach(b=>b.classList.toggle('active',b.dataset.screen===which));}
function maximize(id){const ws=document.getElementById('workspace'),tile=document.getElementById(id);if(maximizedId===id){restoreTiles();return}maximizedId=id;ws.classList.add('focus-mode');document.querySelectorAll('.tile').forEach(t=>t.classList.remove('maximized'));tile.classList.remove('hidden');tile.classList.add('maximized');const b=tile.querySelector('.tilebtn:nth-child(2)');if(b)b.textContent='↙ 분할 복귀';}
function restoreTiles(){const ws=document.getElementById('workspace');ws.classList.remove('focus-mode');document.querySelectorAll('.tile').forEach(t=>{t.classList.remove('maximized');const b=t.querySelector('.tilebtn:nth-child(2)');if(b)b.textContent='⛶ 확대'});maximizedId=null;showScreen(currentScreen)}
function openRoom(id){const u=roomUrls[id];if(u)window.open(u,'_blank','noopener')}
function refreshVisible(){document.querySelectorAll('.tile:not(.hidden) iframe').forEach(f=>{try{f.contentWindow.location.reload()}catch(e){}})}
function refreshAll(){document.querySelectorAll('.tile iframe').forEach(f=>{try{f.contentWindow.location.reload()}catch(e){}})}
showScreen('one');
</script></body></html>
