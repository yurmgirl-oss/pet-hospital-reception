<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재진 접수서</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8faf9] min-h-screen p-4 sm:p-8 flex justify-center">
  <div class="w-full max-w-xl bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-8">
    <div class="border-b-2 border-teal-700 pb-3 mb-6">
      <span class="text-xs font-bold text-teal-700 tracking-wide uppercase">Return Visit Intake</span>
      <h1 class="text-2xl font-serif font-bold text-slate-800">재진 접수서</h1>
      <p class="text-xs text-slate-500 mt-1">이전에 방문하신 적이 있으신가요? 간단히 작성해주세요.</p>
    </div>

    <form id="revisitForm" class="space-y-6">
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">전화번호 *</label>
          <input type="tel" id="phone" required placeholder="010-0000-0000" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-teal-600">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">동물 이름 *</label>
          <input type="text" id="pet_name" required placeholder="아이 이름" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-teal-600">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">내원 사유</label>
        <textarea id="symptom" rows="3" placeholder="지금 가장 걱정되는 점을 간단히 적어주세요." class="w-full border border-slate-200 rounded-xl p-3 text-sm outline-teal-600"></textarea>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-2">추가 처치 의뢰 (선택)</label>
        <div class="grid grid-cols-2 gap-2 text-xs text-slate-700">
          <label class="flex items-center gap-2 p-2.5 border rounded-lg hover:bg-slate-50 cursor-pointer">
            <input type="checkbox" name="extra" value="항문낭짜기"> 항문낭짜기 (5,000원)
          </label>
          <label class="flex items-center gap-2 p-2.5 border rounded-lg hover:bg-slate-50 cursor-pointer">
            <input type="checkbox" name="extra" value="발톱깎기"> 발톱깎기 (10,000원)
          </label>
          <label class="flex items-center gap-2 p-2.5 border rounded-lg hover:bg-slate-50 cursor-pointer">
            <input type="checkbox" name="extra" value="귀청소"> 귀청소 (10,000원)
          </label>
          <label class="flex items-center gap-2 p-2.5 border rounded-lg hover:bg-slate-50 cursor-pointer">
            <input type="checkbox" name="extra" value="심장사상충"> 심장사상충
          </label>
        </div>
      </div>

      <button type="submit" class="w-full py-3.5 bg-teal-700 hover:bg-teal-800 text-white font-bold rounded-xl shadow transition">
        재진 접수 제출하기 →
      </button>
    </form>
  </div>

  <script>
    document.getElementById('revisitForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const extras = Array.from(document.querySelectorAll('input[name="extra"]:checked')).map(el => el.value);

      const body = {
        type: '재진',
        owner_name: '',
        pet_name: document.getElementById('pet_name').value,
        phone: document.getElementById('phone').value,
        symptom: document.getElementById('symptom').value,
        payload: { extras }
      };

      const res = await fetch('/api/receptions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (res.ok) {
        alert('접수가 완료되었습니다.');
        window.location.href = 'index.html';
      } else {
        alert('접수 처리 중 오류가 발생했습니다.');
      }
    });
  </script>
</body>
</html>
