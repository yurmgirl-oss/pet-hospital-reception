<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>23시 동물병원 - 재진 접수서</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap">
  <style>
    body { 
      font-family: 'Pretendard', sans-serif; 
      background-color: #f8fafc;
      background-image: 
        linear-gradient(to right, rgba(203, 213, 225, 0.45) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(203, 213, 225, 0.45) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .font-serif-title {
      font-family: 'Nanum Myeongjo', serif;
    }
    textarea::-webkit-scrollbar { width: 4px; }
    textarea::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }

    /* 입력창 기본 테두리 */
    input[type="tel"],
    input[type="text"],
    input[type="number"],
    input[type="date"],
    textarea {
      border: 1.5px solid #64748b !important;
      background-color: #ffffff;
      color: #0f172a !important;
      font-weight: 500;
    }

    /* 필수 입력창 */
    input.required-field,
    textarea.required-field {
      border-color: #475569 !important;
      background-color: #fffdf5 !important;
    }

    /* 터치/포커스 */
    input[type="tel"]:focus,
    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="date"]:focus,
    textarea:focus {
      border: 2px solid #0d9488 !important;
      box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.15) !important;
      outline: none !important;
    }

    /* 시간 선택 버튼 및 추가처치 카드 테두리 */
    .time-slot-btn,
    .treatment-card {
      border: 1.5px solid #94a3b8 !important;
    }

    /* 형광펜 효과 */
    .highlight-pen {
      background: linear-gradient(to top, #fde047 65%, transparent 65%);
      padding: 0 3px;
      border-radius: 2px;
      font-weight: 700;
      color: #0f172a;
    }

    /* 필수 뱃지 */
    .badge-required {
      display: inline-flex;
      align-items: center;
      background-color: #ef4444;
      color: #ffffff;
      font-size: 9px;
      font-weight: 700;
      padding: 0px 5px;
      border-radius: 9999px;
      margin-left: 3px;
      line-height: 1.3;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 p-3 md:p-6 flex justify-center items-start">

  <div class="w-full max-w-2xl space-y-3.5 my-1">
    
    <!-- 헤더 -->
    <header class="space-y-1">
      <p class="text-[10px] font-bold tracking-widest text-[#0d9488] uppercase">Return Visit Intake</p>
      <div class="flex items-baseline justify-between">
        <h1 class="text-2xl md:text-3xl font-extrabold text-[#0f172a] font-serif-title tracking-tight">재진 접수서</h1>
        <p class="text-xs text-slate-500 font-medium">이전 방문 이력이 있으시면 간편히 입력해 주세요.</p>
      </div>
      <div class="h-1 w-full bg-[#0d9488] rounded-full mt-1.5"></div>
    </header>

    <!-- 접수 폼 -->
    <form id="receptionForm" onsubmit="submitForm(event)" class="space-y-3">

      <!-- 카드 1: 보호자 정보 -->
      <div class="bg-white rounded-2xl p-3.5 md:p-4 border border-slate-300 shadow-sm space-y-3">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-full bg-teal-50 text-[#0d9488] flex items-center justify-center font-bold flex-shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <div>
            <h2 class="text-sm font-bold text-slate-900 leading-tight">보호자 정보</h2>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5">
          <div>
            <label class="block text-xs mb-1 flex items-center">
              <span class="highlight-pen">전화번호</span>
              <span class="badge-required">필수</span>
            </label>
            <input 
              type="tel" 
              id="phone" 
              required
              maxlength="13"
              placeholder="010-0000-0000" 
              oninput="formatPhone(this)"
              class="required-field w-full px-3 py-2 rounded-xl placeholder-slate-400 text-sm transition"
            >
          </div>

          <div>
            <label class="block text-xs mb-1 flex items-center">
              <span class="highlight-pen">동물 이름</span>
              <span class="badge-required">필수</span>
            </label>
            <input 
              type="text" 
              id="petName" 
              required
              placeholder="아이의 이름" 
              class="required-field w-full px-3 py-2 rounded-xl placeholder-slate-400 text-sm transition"
            >
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">체중 (kg) <span class="text-slate-400 font-normal text-[11px]">(선택)</span></label>
            <input 
              type="number" 
              id="petWeight" 
              step="0.01"
              min="0"
              placeholder="예: 4.5" 
              class="w-full px-3 py-2 rounded-xl placeholder-slate-400 text-sm transition"
            >
          </div>
        </div>
      </div>

      <!-- 카드 2: 내원 사유 & 내원 예정일 -->
      <div class="bg-white rounded-2xl p-3.5 md:p-4 border border-slate-300 shadow-sm space-y-3">
        
        <!-- 카드 상단: 타이틀 & 이메일 안내 버튼 컴팩트화 -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold flex-shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
              </svg>
            </div>
            <div>
              <h2 class="text-sm font-bold text-slate-900 leading-tight">내원 사유 & 내원 예정일</h2>
            </div>
          </div>

          <a href="mailto:admin@23si.net?subject=[23시 동물병원] 진료 참고자료 제출" class="bg-indigo-50 border border-indigo-200 hover:border-indigo-400 px-3 py-1.5 rounded-xl flex items-center justify-between gap-2 shadow-sm transition">
            <span class="text-[11px] font-semibold text-slate-600">진료 자료/사진 발송</span>
            <span class="text-xs font-bold text-indigo-700 tracking-tight">📧 admin@23si.net</span>
          </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-10 gap-3 items-stretch">
          
          <!-- 좌측 65%: 내원 사유 -->
          <div class="md:col-span-6 flex flex-col">
            <div class="flex items-center justify-between mb-1">
              <label class="flex items-center">
                <span class="highlight-pen text-xs">내원 사유</span>
                <span class="badge-required">필수</span>
              </label>
            </div>
            <textarea 
              id="reason" 
              required
              rows="4"
              placeholder="증상, 발생 시기, 현재 상태 등을 가능한 구체적으로 적어주시면 빠른 진료 준비에 도움이 됩니다." 
              class="required-field w-full p-2.5 rounded-xl placeholder-slate-400 text-xs sm:text-sm leading-relaxed transition resize-none flex-1 min-h-[95px]"
            ></textarea>
          </div>

          <!-- 우측 35%: 내원 예정일 및 희망시간 -->
          <div class="md:col-span-4 flex flex-col justify-between">
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs font-bold text-slate-700">내원 예정일</label>
              <span class="text-[10px] text-slate-400">선택사항</span>
            </div>

            <div class="flex flex-col justify-center bg-slate-50 p-2.5 rounded-xl border border-slate-300 flex-1 space-y-2">
              <div>
                <label class="block text-[10px] font-semibold text-slate-500 mb-0.5">날짜</label>
                <input 
                  type="date" 
                  id="expectedDate" 
                  class="w-full px-2 py-1.5 rounded-lg text-xs font-medium"
                >
              </div>

              <div class="pt-1.5 border-t border-slate-200">
                <label class="block text-[10px] font-semibold text-slate-500 mb-1">시간대</label>
                <div class="grid grid-cols-3 gap-1">
                  <button type="button" onclick="selectTimeSlot('오전')" id="slot-오전" class="time-slot-btn py-1.5 text-xs font-semibold rounded-lg bg-white text-slate-700 hover:bg-slate-100 transition">
                    오전
                  </button>
                  <button type="button" onclick="selectTimeSlot('오후')" id="slot-오후" class="time-slot-btn py-1.5 text-xs font-semibold rounded-lg bg-white text-slate-700 hover:bg-slate-100 transition">
                    오후
                  </button>
                  <button type="button" onclick="selectTimeSlot('야간')" id="slot-야간" class="time-slot-btn py-1.5 text-xs font-semibold rounded-lg bg-white text-slate-700 hover:bg-slate-100 transition">
                    야간
                  </button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
            
      <!-- 카드 3: 추가 처치 의뢰 -->
      <div class="bg-white rounded-2xl p-3.5 md:p-4 border border-slate-300 shadow-sm space-y-2.5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center font-bold flex-shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
              </svg>
            </div>
            <h2 class="text-sm font-bold text-slate-900 leading-tight">추가 처치 의뢰</h2>
          </div>
          <span class="text-[11px] text-slate-400">중복 선택 가능</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
          <label class="treatment-card flex items-center justify-between py-2 px-3 rounded-xl bg-white hover:border-teal-500 transition cursor-pointer select-none">
            <div class="flex items-center gap-2">
              <input type="checkbox" name="treatment" value="항문낭짜기" class="w-3.5 h-3.5 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">항문낭짜기</span>
            </div>
            <span class="font-extrabold text-[#0d9488]">5,000원</span>
          </label>

          <label class="treatment-card flex items-center justify-between py-2 px-3 rounded-xl bg-white hover:border-teal-500 transition cursor-pointer select-none">
            <div class="flex items-center gap-2">
              <input type="checkbox" name="treatment" value="발톱깎기" class="w-3.5 h-3.5 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">발톱깎기</span>
            </div>
            <span class="font-extrabold text-[#0d9488]">10,000원</span>
          </label>

          <label class="treatment-card flex items-center justify-between py-2 px-3 rounded-xl bg-white hover:border-teal-500 transition cursor-pointer select-none">
            <div class="flex items-center gap-2">
              <input type="checkbox" name="treatment" value="귀청소" class="w-3.5 h-3.5 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">귀청소</span>
            </div>
            <span class="font-extrabold text-[#0d9488]">10,000원</span>
          </label>

          <div class="treatment-card flex items-center justify-start gap-4 py-2 px-3 rounded-xl bg-white hover:border-teal-500 transition select-none">
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="checkbox" name="treatment" value="심장사상충" class="w-3.5 h-3.5 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">심장사상충</span>
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="checkbox" name="treatment" value="예방접종" class="w-3.5 h-3.5 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">예방접종</span>
            </label>
          </div>

          <label class="treatment-card flex items-center justify-between py-2 px-3 rounded-xl bg-white hover:border-teal-500 transition cursor-pointer select-none">
            <div class="flex items-center gap-2">
              <input type="checkbox" name="treatment" value="심장사상충 키트검사" class="w-3.5 h-3.5 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">심장사상충 키트검사</span>
            </div>
            <span class="font-extrabold text-[#0d9488]">38,500원</span>
          </label>

          <label class="treatment-card flex items-center justify-between py-2 px-3 rounded-xl bg-white hover:border-teal-500 transition cursor-pointer select-none">
            <div class="flex items-center gap-2">
              <input type="checkbox" name="treatment" value="외견건강검진" class="w-3.5 h-3.5 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">외견건강검진</span>
            </div>
            <span class="font-extrabold text-[#0d9488]">30,000원</span>
          </label>

          <label class="treatment-card flex items-center justify-between py-2 px-3 rounded-xl bg-white hover:border-teal-500 transition cursor-pointer select-none">
            <div class="flex items-center gap-2">
              <input type="checkbox" name="treatment" value="동물등록신청" class="w-3.5 h-3.5 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">동물등록신청</span>
            </div>
            <span class="font-extrabold text-[#0d9488]">50,000원</span>
          </label>

          <label class="treatment-card flex items-center justify-between py-2 px-3 rounded-xl bg-white hover:border-teal-500 transition cursor-pointer select-none">
            <div class="flex items-center gap-2">
              <input type="checkbox" name="treatment" value="혈액검사(노령기초)" class="w-3.5 h-3.5 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">혈액검사(노령기초)</span>
            </div>
            <span class="font-extrabold text-[#0d9488]">98,000원</span>
          </label>
        </div>
      </div>

      <!-- 하단 버튼 바 (2 : 2 : 6 비율, 패딩 축소) -->
      <div class="pt-1 flex items-center gap-2 w-full">
        <a href="index.html" style="flex: 2;" class="py-3 px-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs flex items-center justify-center gap-1 transition shadow-sm text-center">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
          <span>홈</span>
        </a>

        <button 
          type="button" 
          onclick="resetFormWithConfirm()" 
          style="flex: 2;"
          class="py-3 px-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs flex items-center justify-center gap-1 transition shadow-sm"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          <span>초기화</span>
        </button>

        <button 
          type="submit" 
          id="submitBtn" 
          style="flex: 6;"
          class="py-3 px-3 rounded-xl bg-[#0d9488] hover:bg-[#0f766e] active:scale-[0.99] text-white font-bold text-sm shadow-md shadow-teal-700/10 flex items-center justify-center gap-1.5 transition"
        >
          <span>재진 접수 제출하기</span>
          <span>→</span>
        </button>
      </div>

    </form>
  </div>

  <script>
    let selectedTimeSlot = '';

    function formatPhone(input) {
      let val = input.value.replace(/[^0-9]/g, '');
      if (val.length < 4) {
        input.value = val;
      } else if (val.length < 8) {
        input.value = val.slice(0, 3) + '-' + val.slice(3);
      } else {
        input.value = val.slice(0, 3) + '-' + val.slice(3, 7) + '-' + val.slice(7, 11);
      }
    }

    function selectTimeSlot(slot) {
      const buttons = document.querySelectorAll('.time-slot-btn');
      if (selectedTimeSlot === slot) {
        selectedTimeSlot = '';
        buttons.forEach(btn => {
          btn.style.borderColor = '#94a3b8';
          btn.style.backgroundColor = '#ffffff';
          btn.style.color = '#334155';
        });
        return;
      }

      selectedTimeSlot = slot;
      buttons.forEach(btn => {
        if (btn.id === `slot-${slot}`) {
          btn.style.borderColor = '#0d9488';
          btn.style.backgroundColor = '#0d9488';
          btn.style.color = '#ffffff';
        } else {
          btn.style.borderColor = '#94a3b8';
          btn.style.backgroundColor = '#ffffff';
          btn.style.color = '#334155';
        }
      });
    }

    document.querySelectorAll('.treatment-card input[type="checkbox"]').forEach(chk => {
      chk.addEventListener('change', function() {
        const card = this.closest('.treatment-card');
        if (this.checked) {
          card.style.borderColor = '#0d9488';
          card.style.backgroundColor = '#f0fdfa';
        } else {
          const otherChecked = card.querySelectorAll('input[type="checkbox"]:checked').length > 0;
          if (!otherChecked) {
            card.style.borderColor = '#94a3b8';
            card.style.backgroundColor = '#ffffff';
          }
        }
      });
    });

    function resetFormWithConfirm() {
      if (confirm('작성 중인 내용을 모두 지우고 처음부터 다시 작성하시겠습니까?')) {
        document.getElementById('receptionForm').reset();
        selectedTimeSlot = '';
        document.querySelectorAll('.time-slot-btn').forEach(btn => {
          btn.style.borderColor = '#94a3b8';
          btn.style.backgroundColor = '#ffffff';
          btn.style.color = '#334155';
        });
        document.querySelectorAll('.treatment-card').forEach(card => {
          card.style.borderColor = '#94a3b8';
          card.style.backgroundColor = '#ffffff';
        });
      }
    }

    async function submitForm(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.innerHTML;

      const phone = document.getElementById('phone').value.trim();
      const petName = document.getElementById('petName').value.trim();
      const petWeight = document.getElementById('petWeight').value.trim();
      const reason = document.getElementById('reason').value.trim();
      const expectedDate = document.getElementById('expectedDate').value;

      const treatmentCheckboxes = document.querySelectorAll('input[name="treatment"]:checked');
      const treatments = Array.from(treatmentCheckboxes).map(c => c.value);

      const payloadData = {
        weight: petWeight,
        reason: reason,
        expected_date: expectedDate,
        expected_time: selectedTimeSlot,
        treatments: treatments
      };

      const requestBody = {
        type: 'RETURN',
        status: '접수대기',
        pet_name: petName,
        phone: phone,
        symptom: reason,
        payload: payloadData
      };

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span>접수 중...</span>`;

        const res = await fetch('/api/receptions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        if (!res.ok) {
          throw new Error('서버 응답 오류 (' + res.status + ')');
        }

        alert('✅ 재진 접수가 완료되었습니다!\n카운터 화면에서 확인해 보세요.');
        window.location.href = 'index.html';

      } catch (err) {
        alert('접수 처리 중 오류가 발생했습니다: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    }
  </script>
</body>
</html>
