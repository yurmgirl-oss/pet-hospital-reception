<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>23시 동물병원 - 재진 접수서</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap">
  <style>
    body { 
      font-family: 'Pretendard', sans-serif; 
      background-color: #f8fafc;
      background-image: 
        linear-gradient(to right, rgba(203, 213, 225, 0.45) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(203, 213, 225, 0.45) 1px, transparent 1px);
      background-size: 26px 26px;
    }
    .font-serif-title {
      font-family: 'Nanum Myeongjo', serif;
    }
    textarea::-webkit-scrollbar { width: 6px; }
    textarea::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }

    /* 1. 입력창 테두리 굵고 진하게 (#64748b, 2px) */
    input[type="tel"],
    input[type="text"],
    input[type="number"],
    input[type="date"],
    textarea {
      border: 2px solid #64748b !important;
      background-color: #ffffff;
      color: #0f172a !important;
      font-weight: 500;
    }

    /* 필수 입력창: 은은한 연노랑 틴트로 터치 유도 및 또렷한 테두리 */
    input.required-field,
    textarea.required-field {
      border-color: #475569 !important;
      background-color: #fffdf5 !important;
    }

    /* 터치/포커스 시 더 두껍고 선명하게 */
    input[type="tel"]:focus,
    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="date"]:focus,
    textarea:focus {
      border: 2.5px solid #0d9488 !important;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.2) !important;
      outline: none !important;
    }

    /* 시간 선택 버튼 및 추가처치 카드 테두리 강화 */
    .time-slot-btn,
    .treatment-card {
      border: 2px solid #94a3b8 !important;
    }

    /* 2. 형광펜 강조 효과 (라벨) */
    .highlight-pen {
      background: linear-gradient(to top, #fde047 65%, transparent 65%);
      padding: 0 4px;
      border-radius: 2px;
      font-weight: 800;
      color: #0f172a;
    }

    /* 필수 뱃지 스타일 */
    .badge-required {
      display: inline-flex;
      align-items: center;
      background-color: #ef4444;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 9999px;
      margin-left: 4px;
      box-shadow: 0 1px 2px rgba(239, 68, 68, 0.4);
      animation: pulse-subtle 2s infinite ease-in-out;
    }

    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.88; transform: scale(1.04); }
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 p-4 md:p-8 flex justify-center items-start">

  <div class="w-full max-w-3xl space-y-6 my-4">
    
    <!-- 헤더 -->
    <header class="space-y-2">
      <p class="text-xs font-bold tracking-widest text-[#0d9488] uppercase">Return Visit Intake</p>
      <h1 class="text-4xl md:text-5xl font-extrabold text-[#0f172a] font-serif-title tracking-tight">재진 접수서</h1>
      <p class="text-sm text-slate-600 font-medium">이전에 방문하신 적이 있으신가요? 간단히 작성해주세요.</p>
      <div class="h-1.5 w-full bg-[#0d9488] rounded-full mt-3"></div>
    </header>

    <!-- 접수 폼 -->
    <form id="receptionForm" onsubmit="submitForm(event)" class="space-y-5">

      <!-- 카드 1: 보호자 정보 -->
      <div class="bg-white rounded-3xl p-6 md:p-7 border-2 border-slate-300 shadow-md space-y-5">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-teal-50 text-[#0d9488] flex items-center justify-center font-bold">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <div>
            <h2 class="text-base font-bold text-slate-900">보호자 정보</h2>
            <p class="text-xs text-slate-500">이전에 등록하신 정보로 빠르게 접수해 드려요.</p>
          </div>
        </div>

        <!-- 전화번호, 동물 이름, 체중 한 줄 배치 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs mb-1.5 flex items-center">
              <span class="highlight-pen">전화번호</span>
              <span class="badge-required">필수</span>
            </label>
            <input 
              type="tel" 
              id="phone" 
              required
              maxlength="13"
              placeholder="010-0000-0000" 
              oninput="formatPhone(this)"
              class="required-field w-full px-4 py-3.5 rounded-2xl placeholder-slate-400 text-sm transition"
            >
          </div>

          <div>
            <label class="block text-xs mb-1.5 flex items-center">
              <span class="highlight-pen">동물 이름</span>
              <span class="badge-required">필수</span>
            </label>
            <input 
              type="text" 
              id="petName" 
              required
              placeholder="아이의 이름" 
              class="required-field w-full px-4 py-3.5 rounded-2xl placeholder-slate-400 text-sm transition"
            >
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1.5">체중 (kg) <span class="text-slate-400 font-normal">(선택)</span></label>
            <input 
              type="number" 
              id="petWeight" 
              step="0.01"
              min="0"
              placeholder="예: 4.5" 
              class="w-full px-4 py-3.5 rounded-2xl placeholder-slate-400 text-sm transition"
            >
          </div>
        </div>
      </div>

      <!-- 카드 2: 내원 사유 & 예정일 (7:3 비율, 상단 라벨 및 본체 박스 높이 일치) -->
      <div class="bg-white rounded-3xl p-6 md:p-7 border-2 border-slate-300 shadow-md space-y-5">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
          </div>
          <div>
            <h2 class="text-base font-bold text-slate-900">내원 사유 & 내원 예정일</h2>
            <p class="text-xs text-slate-500">증상 내용과 방문 일정을 간단히 알려주세요.</p>
          </div>
        </div>

        <!-- 10열 그리드로 7:3 분할 및 items-stretch로 높이 일치 -->
        <div class="grid grid-cols-1 md:grid-cols-10 gap-4 items-stretch">
          
          <!-- 좌측 70%: 내원 사유 (필수) -->
          <div class="md:col-span-7 flex flex-col">
            <div class="flex items-center h-6 mb-1.5">
              <label class="text-xs flex items-center">
                <span class="highlight-pen">내원 사유</span>
                <span class="badge-required">필수</span>
              </label>
            </div>
            <textarea 
              id="reason" 
              required
              placeholder="💚 원활한 진료와 정확한 대기시간 안내를 위해 내원 사유를 조금 더 구체적으로 작성해 주세요. ‘아파요’, ‘피부염’보다는 증상, 발생 시기, 현재 상태 등을 자세히 적어주시면 필요한 검사와 진료를 미리 준비하는 데 큰 도움이 됩니다. 보호자님의 협조에 감사드립니다." 
              class="required-field w-full h-[145px] md:h-full p-3.5 rounded-2xl placeholder-slate-400 text-xs md:text-sm leading-relaxed transition resize-none flex-1"
            ></textarea>
          </div>

          <!-- 우측 30%: 내원 예정일 및 희망시간 -->
          <div class="md:col-span-3 flex flex-col">
            <div class="flex items-center justify-between h-6 mb-1.5">
              <label class="text-xs font-bold text-slate-700">내원 예정일</label>
              <span class="text-[11px] text-slate-400 font-normal">선택</span>
            </div>
            <div class="flex flex-col justify-between bg-slate-50 p-3 rounded-2xl border-2 border-slate-300 flex-1 space-y-2.5">
              <div>
                <input 
                  type="date" 
                  id="expectedDate" 
                  class="w-full px-2.5 py-2 rounded-xl text-xs font-semibold"
                >
              </div>

              <div>
                <div class="grid grid-cols-3 gap-1">
                  <button type="button" onclick="selectTimeSlot('오전')" id="slot-오전" class="time-slot-btn py-2 text-xs font-bold rounded-xl bg-white text-slate-700 hover:bg-slate-100 transition">
                    오전
                  </button>
                  <button type="button" onclick="selectTimeSlot('오후')" id="slot-오후" class="time-slot-btn py-2 text-xs font-bold rounded-xl bg-white text-slate-700 hover:bg-slate-100 transition">
                    오후
                  </button>
                  <button type="button" onclick="selectTimeSlot('야간')" id="slot-야간" class="time-slot-btn py-2 text-xs font-bold rounded-xl bg-white text-slate-700 hover:bg-slate-100 transition">
                    야간
                  </button>
                </div>
                <p class="text-[10px] text-slate-400 text-center mt-1.5">시간대 선택</p>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- 카드 3: 추가 처치 의뢰 -->
      <div class="bg-white rounded-3xl p-6 md:p-7 border-2 border-slate-300 shadow-md space-y-5">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center font-bold">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
            </svg>
          </div>
          <div>
            <h2 class="text-base font-bold text-slate-900">추가 처치 의뢰</h2>
            <p class="text-xs text-slate-500">원하시는 항목을 선택해주세요. 여러 항목을 선택할 수 있어요.</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs md:text-sm">
          <label class="treatment-card flex items-center justify-between p-3.5 rounded-2xl bg-white hover:border-teal-500 transition cursor-pointer select-none">
            <div class="flex items-center gap-2.5">
              <input type="checkbox" name="treatment" value="항문낭짜기" class="w-4 h-4 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">항문낭짜기</span>
            </div>
            <span class="font-extrabold text-[#0d9488]">5,000원</span>
          </label>

          <label class="treatment-card flex items-center justify-between p-3.5 rounded-2xl bg-white hover:border-teal-500 transition cursor-pointer select-none">
            <div class="flex items-center gap-2.5">
              <input type="checkbox" name="treatment" value="발톱깎기" class="w-4 h-4 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">발톱깎기</span>
            </div>
            <span class="font-extrabold text-[#0d9488]">10,000원</span>
          </label>

          <label class="treatment-card flex items-center justify-between p-3.5 rounded-2xl bg-white hover:border-teal-500 transition cursor-pointer select-none">
            <div class="flex items-center gap-2.5">
              <input type="checkbox" name="treatment" value="귀청소" class="w-4 h-4 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">귀청소</span>
            </div>
            <span class="font-extrabold text-[#0d9488]">10,000원</span>
          </label>

          <div class="treatment-card flex items-center justify-start gap-6 p-3.5 rounded-2xl bg-white hover:border-teal-500 transition select-none">
            <label class="flex items-center gap-2.5 cursor-pointer">
              <input type="checkbox" name="treatment" value="심장사상충" class="w-4 h-4 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">심장사상충</span>
            </label>
            <label class="flex items-center gap-2.5 cursor-pointer">
              <input type="checkbox" name="treatment" value="예방접종" class="w-4 h-4 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">예방접종</span>
            </label>
          </div>

          <label class="treatment-card flex items-center justify-between p-3.5 rounded-2xl bg-white hover:border-teal-500 transition cursor-pointer select-none">
            <div class="flex items-center gap-2.5">
              <input type="checkbox" name="treatment" value="심장사상충 키트검사" class="w-4 h-4 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">심장사상충 키트검사</span>
            </div>
            <span class="font-extrabold text-[#0d9488]">38,500원</span>
          </label>

          <label class="treatment-card flex items-center justify-between p-3.5 rounded-2xl bg-white hover:border-teal-500 transition cursor-pointer select-none">
            <div class="flex items-center gap-2.5">
              <input type="checkbox" name="treatment" value="외견건강검진" class="w-4 h-4 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">외견건강검진</span>
            </div>
            <span class="font-extrabold text-[#0d9488]">30,000원</span>
          </label>

          <label class="treatment-card flex items-center justify-between p-3.5 rounded-2xl bg-white hover:border-teal-500 transition cursor-pointer select-none">
            <div class="flex items-center gap-2.5">
              <input type="checkbox" name="treatment" value="동물등록신청" class="w-4 h-4 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">동물등록신청</span>
            </div>
            <span class="font-extrabold text-[#0d9488]">50,000원</span>
          </label>

          <label class="treatment-card flex items-center justify-between p-3.5 rounded-2xl bg-white hover:border-teal-500 transition cursor-pointer select-none">
            <div class="flex items-center gap-2.5">
              <input type="checkbox" name="treatment" value="혈액검사(노령기초)" class="w-4 h-4 rounded text-[#0d9488] focus:ring-0">
              <span class="font-bold text-slate-800">혈액검사(노령기초)</span>
            </div>
            <span class="font-extrabold text-[#0d9488]">98,000원</span>
          </label>
        </div>
      </div>

      <!-- 하단 버튼 바 (2.5 : 2.5 : 5 비율) -->
      <div class="pt-2 flex items-center gap-2.5 w-full">
        <a href="index.html" style="flex: 2.5;" class="py-4 px-2 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition shadow-sm text-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
          <span>홈으로</span>
        </a>

        <button 
          type="button" 
          onclick="resetFormWithConfirm()" 
          style="flex: 2.5;"
          class="py-4 px-2 rounded-2xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 transition shadow-sm"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          <span>다시 작성</span>
        </button>

        <button 
          type="submit" 
          id="submitBtn" 
          style="flex: 5;"
          class="py-4 px-4 rounded-2xl bg-[#0d9488] hover:bg-[#0f766e] active:scale-[0.99] text-white font-bold text-xs sm:text-base shadow-md shadow-teal-700/20 flex items-center justify-center gap-1.5 transition"
        >
          <span>재진 접수 제출하기</span>
          <span class="text-base sm:text-lg">→</span>
        </button>
      </div>

    </form>
  </div>

  <script>
    let selectedTimeSlot = '';

    function formatPhone(input) {
      let val = input.value.replace(/[^0-9]/g, '');
      if (val.length < 4) {
        input.value = val;
      } else if (val.length < 8) {
        input.value = val.slice(0, 3) + '-' + val.slice(3);
      } else {
        input.value = val.slice(0, 3) + '-' + val.slice(3, 7) + '-' + val.slice(7, 11);
      }
    }

    function selectTimeSlot(slot) {
      const buttons = document.querySelectorAll('.time-slot-btn');
      if (selectedTimeSlot === slot) {
        selectedTimeSlot = '';
        buttons.forEach(btn => {
          btn.style.borderColor = '#94a3b8';
          btn.style.backgroundColor = '#ffffff';
          btn.style.color = '#334155';
        });
        return;
      }

      selectedTimeSlot = slot;
      buttons.forEach(btn => {
        if (btn.id === `slot-${slot}`) {
          btn.style.borderColor = '#0d9488';
          btn.style.backgroundColor = '#0d9488';
          btn.style.color = '#ffffff';
        } else {
          btn.style.borderColor = '#94a3b8';
          btn.style.backgroundColor = '#ffffff';
          btn.style.color = '#334155';
        }
      });
    }

    document.querySelectorAll('.treatment-card input[type="checkbox"]').forEach(chk => {
      chk.addEventListener('change', function() {
        const card = this.closest('.treatment-card');
        if (this.checked) {
          card.style.borderColor = '#0d9488';
          card.style.backgroundColor = '#f0fdfa';
        } else {
          const otherChecked = card.querySelectorAll('input[type="checkbox"]:checked').length > 0;
          if (!otherChecked) {
            card.style.borderColor = '#94a3b8';
            card.style.backgroundColor = '#ffffff';
          }
        }
      });
    });

    function resetFormWithConfirm() {
      if (confirm('작성 중인 내용을 모두 지우고 처음부터 다시 작성하시겠습니까?')) {
        document.getElementById('receptionForm').reset();
        selectedTimeSlot = '';
        document.querySelectorAll('.time-slot-btn').forEach(btn => {
          btn.style.borderColor = '#94a3b8';
          btn.style.backgroundColor = '#ffffff';
          btn.style.color = '#334155';
        });
        document.querySelectorAll('.treatment-card').forEach(card => {
          card.style.borderColor = '#94a3b8';
          card.style.backgroundColor = '#ffffff';
        });
      }
    }

    async function submitForm(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.innerHTML;

      const phone = document.getElementById('phone').value.trim();
      const petName = document.getElementById('petName').value.trim();
      const petWeight = document.getElementById('petWeight').value.trim();
      const reason = document.getElementById('reason').value.trim();
      const expectedDate = document.getElementById('expectedDate').value;

      const treatmentCheckboxes = document.querySelectorAll('input[name="treatment"]:checked');
      const treatments = Array.from(treatmentCheckboxes).map(c => c.value);

      const payloadData = {
        weight: petWeight,
        reason: reason,
        expected_date: expectedDate,
        expected_time: selectedTimeSlot,
        treatments: treatments
      };

      const requestBody = {
        type: 'RETURN',
        status: '접수대기',
        pet_name: petName,
        phone: phone,
        symptom: reason,
        payload: payloadData
      };

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span>접수 중...</span>`;

        const res = await fetch('/api/receptions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        if (!res.ok) {
          throw new Error('서버 응답 오류 (' + res.status + ')');
        }

        alert('✅ 재진 접수가 완료되었습니다!\n카운터 화면에서 확인해 보세요.');
        window.location.href = 'index.html';

      } catch (err) {
        alert('접수 처리 중 오류가 발생했습니다: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    }
  </script>
</body>
</html>
