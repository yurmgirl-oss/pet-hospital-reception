<style>

</style></head><body><div class="shell">
<header><div class="brand"><div class="logo">+</div><div><h1>23시 하단오거리 동물병원</h1><div class="subtitle">접수 안내 · 우리 아이의 진료 진행 상황을 확인하세요</div></div></div><div class="live"><span class="dot"></span><span class="liveword">접수 현황 실시간 확인 중</span></div></header>

<script>
const API_BASE="https://m5-api.23si.net",RECEPTION_API="/api/receptions",listEl=document.getElementById("list"),countEl=document.getElementById("count"),updatedEl=document.getElementById("updated");let lastSignature="";
function tx(v){return v==null?"":String(v)}function payloadOf(x){let p=x?.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch{p={}}}return p&&typeof p==="object"?p:{}}function statusOf(x){return tx(x.status||"접수대기")}function active(x){return !["완료","진료완료","취소","종료"].includes(statusOf(x))}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}

items.forEach((x,i)=>{const row=el("div","item"),key=tx(x.id??x.reception_id??""),p=payloadOf(x);const num=el("div","num",String(i+1).padStart(2,"0")),patient=el("div","");patient.append(el("div","petname",tx(x.pet_name||x.animal_name||"이름 미입력")),el("div","petmeta","접수 순서 "+String(i+1).padStart(2,"0")));const why=el("div","reason");why.append(el("small","","내원 사유"),document.createTextNode(tx(p.reason||x.symptom||x.symptoms||"내원 사유 확인 중")));const treating=/진료중|진료 중|치료중|치료 중/.test(statusOf(x)),state=el("div","state "+(treating?"treat":"wait"));state.append(el("span","point"),document.createTextNode(treating?"진료 진행 중":"접수중"));const t=el("div","time"),et=estimate(Object.prototype.hasOwnProperty.call(est,key)?est[key]:null);t.append(el("strong","",et[0]),el("span","",et[1]));row.append(num,patient,why,state,t);listEl.append(row)})}
async function refresh(){try{const [r,e]=await Promise.all([fetch(RECEPTION_API,{cache:"no-store"}),fetch(API_BASE+"/estimates",{cache:"no-store"})]);if(!r.ok)throw Error("접수 API "+r.status);if(!e.ok)throw Error("예상시간 API "+e.status);const rr=await r.json(),ee=await e.json();render(Array.isArray(rr)?rr:(rr.items||[]),ee.estimates||{});updatedEl.textContent="실시간 연결 · "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}catch(err){updatedEl.textContent="서버 연결 확인 필요";console.error(err)}}refresh();setInterval(refresh,5000);
</script></body></html>
