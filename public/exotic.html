<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>특수동물 약물 용량 계산기 (100g Formulary)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 Pro/Free Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: Inter & Pretendard-like Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700;800&family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', 'system-ui', 'sans-serif'],
            mono: ['"Fira Code"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; font-size: 11px; }
      #drugTable { border: 1px solid #cbd5e1; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-black">

  <!-- 컴팩트 최상단 헤더 -->
  <header class="bg-slate-950 border-b border-slate-800 px-4 py-2 sticky top-0 z-30 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-emerald-500 text-slate-950 flex items-center justify-center font-black text-sm">
        <i class="fa-solid fa-syringe"></i>
      </div>
      <h1 class="text-sm sm:text-base font-extrabold text-white tracking-tight flex items-center gap-2">
        특수동물 100g 기준 약물 계산기
        <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">v2.5 Fast</span>
      </h1>
    </div>
    
    <div class="flex items-center gap-2 no-print">
      <button onclick="resetForm()" class="px-2.5 py-1 text-xs font-semibold rounded bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center gap-1">
        <i class="fa-solid fa-rotate-left text-[11px]"></i> 초기화
      </button>
      <button onclick="window.print()" class="px-3 py-1 text-xs font-bold rounded bg-emerald-500 hover:bg-emerald-400 text-slate-950 transition flex items-center gap-1 shadow-sm">
        <i class="fa-solid fa-print text-[11px]"></i> 인쇄
      </button>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto p-3 sm:p-4 space-y-3">

    <!-- 1. 동물 8종 원터치 슬림 가로 1줄 탭바 -->
    <section class="no-print">
      <div class="grid grid-cols-4 sm:grid-cols-8 gap-1.5" id="speciesTabsContainer">
        <!-- 8종 가로 1줄 렌더링 -->
      </div>
    </section>

    <!-- 2. 환자 & 체중 초간결 1줄 입력 바 -->
    <section class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 shadow-sm">
      <div class="flex flex-wrap items-center gap-2.5 justify-between">
        
        <!-- 환자명 + 체중 입력부 -->
        <div class="flex items-center gap-2 flex-grow min-w-[280px]">
          <div class="relative w-40 sm:w-52">
            <span class="absolute inset-y-0 left-2.5 flex items-center text-slate-500 text-xs">
              <i class="fa-regular fa-user"></i>
            </span>
            <input type="text" id="patientName" placeholder="환자명 / 차트No" 
              class="w-full pl-8 pr-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500"
              oninput="handlePatientInfoUpdate()">
          </div>

          <div class="flex items-center rounded-lg bg-slate-900 border border-slate-700 overflow-hidden focus-within:border-emerald-500">
            <input type="number" id="weightInput" min="0.01" step="any" placeholder="체중" 
              class="w-24 sm:w-32 px-3 py-1.5 bg-transparent text-sm sm:text-base font-black font-mono text-emerald-400 focus:outline-none"
              oninput="calculateAllDoses()">
            <div class="flex p-0.5 gap-0.5 bg-slate-800">
              <button type="button" id="unitG" onclick="setUnit('g')" class="px-2 py-0.5 text-xs font-bold rounded bg-emerald-500 text-slate-950">g</button>
              <button type="button" id="unitKg" onclick="setUnit('kg')" class="px-2 py-0.5 text-xs font-bold rounded text-slate-400 hover:text-white">kg</button>
            </div>
          </div>

          <div class="hidden sm:inline-flex items-center px-2.5 py-1 rounded bg-slate-900 text-xs font-mono font-bold text-slate-300 border border-slate-800" id="convertedWeightText">
            ≈ 0.000 kg
          </div>
        </div>

        <!-- 선택 동물 핵심 주의사항 배지 -->
        <div class="flex items-center gap-2 text-xs">
          <span id="speciesBadge" class="px-2 py-1 rounded-md font-extrabold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5">
            <i id="speciesBadgeIcon" class="fa-solid fa-dragon"></i>
            <span id="selectedSpeciesName">게코</span>
          </span>
          <span id="speciesNotesShort" class="text-[11px] font-bold text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2 py-1 rounded-md truncate max-w-[320px] sm:max-w-none">
            전반신 근육/피하 투여 (신문맥계 우회)
          </span>
        </div>

      </div>
    </section>

    <!-- 3. 초강렬 계산 테이블 (눈금 & ml 강조) -->
    <section class="bg-slate-950 rounded-xl border border-slate-800 overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse" id="drugTable">
          <thead>
            <tr class="bg-slate-900 text-slate-400 text-xs font-bold border-b border-slate-800 uppercase tracking-wider">
              <th class="py-2.5 px-3 w-40">약물 제형 (원내규격)</th>
              <th class="py-2.5 px-3 w-36 bg-amber-950/20 text-amber-300 border-x border-slate-800/80">100g당 기준량</th>
              <th class="py-2.5 px-3 w-32">총 처방량</th>
              <th class="py-2.5 px-4 w-60 bg-emerald-950/40 text-emerald-300 border-x border-emerald-800/50 font-black">실제 주사량 (Volume / U-100)</th>
              <th class="py-2.5 px-3">투여 경로 & 간격</th>
            </tr>
          </thead>
          <tbody id="drugTableBody" class="divide-y divide-slate-800/80 text-xs sm:text-sm">
            <!-- 동적 주사제 로우 삽입 -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- 4. 원클릭 EMR 복사 & 슬림 하단 바 -->
    <section class="bg-slate-950 rounded-xl border border-slate-800 p-2.5 flex flex-col sm:flex-row gap-2.5 items-center">
      <div class="flex-grow w-full">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-bold text-slate-400 flex items-center gap-1.5">
            <i class="fa-regular fa-clipboard text-emerald-400"></i> 전자 차트(EMR) 복사용 텍스트
          </span>
          <button onclick="copyChartSummary()" class="px-2.5 py-1 text-xs font-bold rounded bg-emerald-500 hover:bg-emerald-400 text-slate-950 flex items-center gap-1 transition">
            <i class="fa-regular fa-copy"></i> 복사하기
          </button>
        </div>
        <textarea id="chartSummaryText" readonly rows="2" 
          class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs font-mono text-emerald-300 focus:outline-none resize-none leading-relaxed"></textarea>
      </div>
      <div id="copyAlertToast" class="hidden px-3 py-1.5 bg-emerald-500 text-slate-950 font-bold rounded text-xs shrink-0 whitespace-nowrap shadow-lg">
        ✓ EMR 복사 완료!
      </div>
    </section>

  </main>

  <script>
    /* ==========================================================================
       1. 데이터 정의 (8종 동물 및 6개 핵심 제형)
       ========================================================================== */
    const SPECIES_CONFIG = [
      { id: 'gecko', name: '게코', icon: 'fa-dragon', defaultUnit: 'g', typicalWeight: 45, notes: '전반신 근육/피하 필수 (신문맥계 우회)' },
      { id: 'parrot', name: '앵무새', icon: 'fa-dove', defaultUnit: 'g', typicalWeight: 100, notes: '흉근 IM 분할 투여 (q12h 위주)' },
      { id: 'tortoise', name: '육지거북', icon: 'fa-shield-halved', defaultUnit: 'g', typicalWeight: 350, notes: '앞다리 상완근 IM (신문맥계 우회)' },
      { id: 'hamster', name: '햄스터', icon: 'fa-cubes-stacked', defaultUnit: 'g', typicalWeight: 120, notes: '목덜미 피하 SC (초미량 U-100 시린지)' },
      { id: 'snake', name: '뱀', icon: 'fa-staff-snake', defaultUnit: 'g', typicalWeight: 250, notes: '상체 1/3 근육 IM (신문맥계 우회)' },
      { id: 'chameleon', name: '카멜레온', icon: 'fa-eye', defaultUnit: 'g', typicalWeight: 80, notes: '앞다리 상완골 근육 IM / SC' },
      { id: 'chinchilla', name: '친칠라', icon: 'fa-otter', defaultUnit: 'g', typicalWeight: 500, notes: '목덜미 SC · 장내 세균총 불균형 주의' },
      { id: 'hedgehog', name: '고슴도치', icon: 'fa-burst', defaultUnit: 'g', typicalWeight: 400, notes: '가시 사이 느슨한 피부 SC / 대퇴 IM' }
    ];

    const DRUG_DATABASE = [
      {
        id: 'baytril',
        name: '바이트릴 (엔로플록사신)',
        concentration: 5.0,
        unitType: 'mg',
        speciesDosing: {
          gecko: { defaultDose100g: 1.0, unit: 'mg', originalKg: '10mg/kg', interval: 'q24h', route: '전반신 IM/SC' },
          parrot: { defaultDose100g: 1.5, unit: 'mg', originalKg: '15mg/kg', interval: 'q24h (또는 q12h)', route: '흉근 IM/SC' },
          tortoise: { defaultDose100g: 1.0, unit: 'mg', originalKg: '10mg/kg', interval: 'q24~48h', route: '앞다리 IM/SC' },
          hamster: { defaultDose100g: 1.0, unit: 'mg', originalKg: '10mg/kg', interval: 'q24h', route: '목덜미 SC' },
          snake: { defaultDose100g: 1.0, unit: 'mg', originalKg: '10mg/kg', interval: 'q48h', route: '상체 1/3 IM/SC' },
          chameleon: { defaultDose100g: 1.0, unit: 'mg', originalKg: '10mg/kg', interval: 'q24~48h', route: '앞다리 IM/SC' },
          chinchilla: { defaultDose100g: 1.0, unit: 'mg', originalKg: '10mg/kg', interval: 'q12~24h', route: '목덜미 SC' },
          hedgehog: { defaultDose100g: 1.0, unit: 'mg', originalKg: '10mg/kg', interval: 'q12~24h', route: '등쪽 SC/대퇴 IM' }
        }
      },
      {
        id: 'metacam',
        name: '메타캄 (멜록시캄)',
        concentration: 0.1,
        unitType: 'mg',
        speciesDosing: {
          gecko: { defaultDose100g: 0.02, unit: 'mg', originalKg: '0.2mg/kg', interval: 'q24h (탈수시 보류)', route: '전반신 SC/PO' },
          parrot: { defaultDose100g: 0.05, unit: 'mg', originalKg: '0.5mg/kg', interval: 'q12~24h', route: '흉근 IM/PO' },
          tortoise: { defaultDose100g: 0.02, unit: 'mg', originalKg: '0.2mg/kg', interval: 'q24h', route: '앞다리 SC/IM' },
          hamster: { defaultDose100g: 0.03, unit: 'mg', originalKg: '0.3mg/kg', interval: 'q24h', route: 'SC/PO' },
          snake: { defaultDose100g: 0.02, unit: 'mg', originalKg: '0.2mg/kg', interval: 'q24~48h', route: '상체 1/3 SC' },
          chameleon: { defaultDose100g: 0.02, unit: 'mg', originalKg: '0.2mg/kg', interval: 'q24h', route: '앞다리 SC' },
          chinchilla: { defaultDose100g: 0.03, unit: 'mg', originalKg: '0.3mg/kg', interval: 'q24h', route: '목덜미 SC/PO' },
          hedgehog: { defaultDose100g: 0.02, unit: 'mg', originalKg: '0.2mg/kg', interval: 'q24h', route: '등쪽 SC/PO' }
        }
      },
      {
        id: 'ceftazidime',
        name: '세프타지딤 (3세대 세파)',
        concentration: 10.0,
        unitType: 'mg',
        speciesDosing: {
          gecko: { defaultDose100g: 2.0, unit: 'mg', originalKg: '20mg/kg', interval: 'q72h (3일1회)', route: '앞다리 IM' },
          parrot: { defaultDose100g: 2.0, unit: 'mg', originalKg: '20mg/kg', interval: 'q12h (교대)', route: '흉근 IM' },
          tortoise: { defaultDose100g: 2.0, unit: 'mg', originalKg: '20mg/kg', interval: 'q72h (3일1회)', route: '앞다리 IM' },
          hamster: { defaultDose100g: 2.0, unit: 'mg', originalKg: '20mg/kg', interval: 'q24h', route: 'SC' },
          snake: { defaultDose100g: 2.0, unit: 'mg', originalKg: '20mg/kg', interval: 'q72h (3일1회)', route: '상체 1/3 IM' },
          chameleon: { defaultDose100g: 2.0, unit: 'mg', originalKg: '20mg/kg', interval: 'q72h (3일1회)', route: '앞다리 IM' },
          chinchilla: { defaultDose100g: 2.0, unit: 'mg', originalKg: '20mg/kg', interval: 'q12~24h', route: 'SC' },
          hedgehog: { defaultDose100g: 2.0, unit: 'mg', originalKg: '20mg/kg', interval: 'q12~24h', route: '등쪽 SC/대퇴 IM' }
        }
      },
      {
        id: 'draxxin',
        name: '드락신 (툴라스로마이신)',
        concentration: 2.5,
        unitType: 'mg',
        speciesDosing: {
          gecko: { defaultDose100g: 0.5, unit: 'mg', originalKg: '5mg/kg', interval: 'q7d (주1회)', route: 'SC/IM (전반신)' },
          parrot: { defaultDose100g: 1.0, unit: 'mg', originalKg: '10mg/kg', interval: 'q5~7d', route: '흉근 IM' },
          tortoise: { defaultDose100g: 0.5, unit: 'mg', originalKg: '5mg/kg', interval: 'q7d (주1회)', route: '앞다리 IM' },
          hamster: { defaultDose100g: 0.25, unit: 'mg', originalKg: '2.5mg/kg', interval: 'q7d (주1회)', route: 'SC' },
          snake: { defaultDose100g: 0.5, unit: 'mg', originalKg: '5mg/kg', interval: 'q7d (주1회)', route: '상체 1/3 SC/IM' },
          chameleon: { defaultDose100g: 0.5, unit: 'mg', originalKg: '5mg/kg', interval: 'q7d (주1회)', route: '앞다리 IM' },
          chinchilla: { defaultDose100g: 0.25, unit: 'mg', originalKg: '2.5mg/kg', interval: 'q7d', route: 'SC' },
          hedgehog: { defaultDose100g: 0.25, unit: 'mg', originalKg: '2.5mg/kg', interval: 'q7d', route: '등쪽 SC' }
        }
      },
      {
        id: 'adek',
        name: '비타민 ADEK 복합제',
        concentration: 1.0,
        unitType: 'ml',
        speciesDosing: {
          gecko: { defaultDose100g: 0.02, unit: 'ml', originalKg: '0.2ml/kg', interval: '1~2주 1회', route: 'SC/IM' },
          parrot: { defaultDose100g: 0.01, unit: 'ml', originalKg: '0.1ml/kg', interval: '주 1회', route: '흉근 IM' },
          tortoise: { defaultDose100g: 0.05, unit: 'ml', originalKg: '0.5ml/kg', interval: '격주 1회', route: '앞다리 IM' },
          hamster: { defaultDose100g: 0.02, unit: 'ml', originalKg: '0.2ml/kg', interval: '필요시 단회', route: 'SC' },
          snake: { defaultDose100g: 0.02, unit: 'ml', originalKg: '0.2ml/kg', interval: '10~14일 간격', route: 'SC/IM' },
          chameleon: { defaultDose100g: 0.02, unit: 'ml', originalKg: '0.2ml/kg', interval: '주1회/단회', route: '앞다리 IM' },
          chinchilla: { defaultDose100g: 0.02, unit: 'ml', originalKg: '0.2ml/kg', interval: '필요시 단회', route: 'SC' },
          hedgehog: { defaultDose100g: 0.02, unit: 'ml', originalKg: '0.2ml/kg', interval: '필요시 단회', route: 'SC' }
        }
      },
      {
        id: 'hartmann',
        name: '하트만 수액 (LRS)',
        concentration: 1.0,
        unitType: 'ml',
        speciesDosing: {
          gecko: { defaultDose100g: 2.5, unit: 'ml', originalKg: '25ml/kg', interval: 'q24h (미온 가온)', route: 'SC / ICe' },
          parrot: { defaultDose100g: 5.0, unit: 'ml', originalKg: '50ml/kg', interval: 'q12~24h 분할', route: '서혜부 SC' },
          tortoise: { defaultDose100g: 2.0, unit: 'ml', originalKg: '20ml/kg', interval: 'q24h (가온 주입)', route: '상완와 SC / ICe' },
          hamster: { defaultDose100g: 6.0, unit: 'ml', originalKg: '60ml/kg', interval: 'q12~24h 분할', route: '목덜미 SC' },
          snake: { defaultDose100g: 2.0, unit: 'ml', originalKg: '20ml/kg', interval: 'q24h (미온 가온)', route: 'SC / ICe' },
          chameleon: { defaultDose100g: 2.5, unit: 'ml', originalKg: '25ml/kg', interval: 'q24h (가온/온욕)', route: 'SC' },
          chinchilla: { defaultDose100g: 6.0, unit: 'ml', originalKg: '60ml/kg', interval: 'q12~24h 분할', route: '목덜미 SC' },
          hedgehog: { defaultDose100g: 5.0, unit: 'ml', originalKg: '50ml/kg', interval: 'q12~24h 분할', route: '등쪽 SC' }
        }
      }
    ];

    let currentSpeciesId = 'gecko';
    let currentUnit = 'g';
    let customDoses = {};

    window.addEventListener('DOMContentLoaded', () => {
      renderSpeciesTabs();
      initDefaultValues();
      calculateAllDoses();
    });

    function renderSpeciesTabs() {
      const container = document.getElementById('speciesTabsContainer');
      container.innerHTML = '';

      SPECIES_CONFIG.forEach(sp => {
        const isActive = sp.id === currentSpeciesId;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `py-2 px-1.5 rounded-lg border text-center transition-all duration-150 flex flex-col items-center justify-center gap-0.5 ${
          isActive 
            ? 'bg-emerald-500 text-slate-950 font-black border-emerald-400 shadow-md scale-[1.02]' 
            : 'bg-slate-950 text-slate-300 border-slate-800 hover:border-slate-600 hover:text-white'
        }`;
        btn.onclick = () => selectSpecies(sp.id);
        btn.innerHTML = `
          <i class="fa-solid ${sp.icon} text-sm ${isActive ? 'text-slate-950' : 'text-emerald-400'}"></i>
          <span class="text-xs truncate w-full">${sp.name}</span>
        `;
        container.appendChild(btn);
      });
    }

    function initDefaultValues() {
      const sp = getCurrentSpecies();
      const weightInput = document.getElementById('weightInput');
      currentUnit = sp.defaultUnit;
      updateUnitButtons();
      weightInput.value = sp.typicalWeight;
      customDoses = {};
      updateSpeciesCard();
    }

    function selectSpecies(speciesId) {
      if (currentSpeciesId === speciesId) return;
      currentSpeciesId = speciesId;
      customDoses = {};
      const sp = getCurrentSpecies();
      
      currentUnit = sp.defaultUnit;
      updateUnitButtons();
      
      document.getElementById('weightInput').value = sp.typicalWeight;
      renderSpeciesTabs();
      updateSpeciesCard();
      calculateAllDoses();
    }

    function getCurrentSpecies() {
      return SPECIES_CONFIG.find(s => s.id === currentSpeciesId) || SPECIES_CONFIG[0];
    }

    function setUnit(unit) {
      if (currentUnit === unit) return;
      const weightInput = document.getElementById('weightInput');
      let val = parseFloat(weightInput.value);

      if (!isNaN(val) && val > 0) {
        if (unit === 'kg' && currentUnit === 'g') {
          weightInput.value = (val / 1000).toFixed(4).replace(/\.?0+$/, "");
        } else if (unit === 'g' && currentUnit === 'kg') {
          weightInput.value = Math.round(val * 1000);
        }
      }

      currentUnit = unit;
      updateUnitButtons();
      calculateAllDoses();
    }

    function updateUnitButtons() {
      const btnG = document.getElementById('unitG');
      const btnKg = document.getElementById('unitKg');
      if (currentUnit === 'g') {
        btnG.className = 'px-2 py-0.5 text-xs font-bold rounded bg-emerald-500 text-slate-950';
        btnKg.className = 'px-2 py-0.5 text-xs font-bold rounded text-slate-400 hover:text-white';
      } else {
        btnKg.className = 'px-2 py-0.5 text-xs font-bold rounded bg-emerald-500 text-slate-950';
        btnG.className = 'px-2 py-0.5 text-xs font-bold rounded text-slate-400 hover:text-white';
      }
    }

    function updateSpeciesCard() {
      const sp = getCurrentSpecies();
      document.getElementById('selectedSpeciesName').textContent = sp.name;
      document.getElementById('speciesNotesShort').textContent = sp.notes;
      document.getElementById('speciesBadgeIcon').className = `fa-solid ${sp.icon}`;
    }

    function getWeightInGrams() {
      const raw = parseFloat(document.getElementById('weightInput').value);
      if (isNaN(raw) || raw <= 0) return 0;
      return currentUnit === 'kg' ? raw * 1000 : raw;
    }

    function handlePatientInfoUpdate() {
      generateChartSummaryText();
    }

    function calculateAllDoses() {
      const weightG = getWeightInGrams();
      const weightKg = weightG / 1000;
      
      const convertedText = document.getElementById('convertedWeightText');
      convertedText.textContent = currentUnit === 'g' 
        ? `≈ ${(weightKg).toFixed(4)} kg` 
        : `≈ ${Math.round(weightG)} g`;

      const tbody = document.getElementById('drugTableBody');
      tbody.innerHTML = '';

      DRUG_DATABASE.forEach(drug => {
        const specGuide = drug.speciesDosing[currentSpeciesId];
        const targetDose100g = customDoses[drug.id] !== undefined ? customDoses[drug.id] : specGuide.defaultDose100g;

        let totalPrescribed = 0;
        let volumeMl = 0;

        if (weightG > 0) {
          const multiplier = weightG / 100;
          if (drug.unitType === 'mg') {
            totalPrescribed = targetDose100g * multiplier;
            volumeMl = totalPrescribed / drug.concentration;
          } else {
            volumeMl = targetDose100g * multiplier;
            totalPrescribed = volumeMl;
          }
        }

        const formattedTotalDose = drug.unitType === 'mg' 
          ? (totalPrescribed < 0.01 && totalPrescribed > 0 ? totalPrescribed.toFixed(4) : totalPrescribed.toFixed(3)) + ' mg'
          : (totalPrescribed < 0.01 && totalPrescribed > 0 ? totalPrescribed.toFixed(4) : totalPrescribed.toFixed(2)) + ' ml';

        let formattedVolume = '0.000 ml';
        if (volumeMl > 0) {
          formattedVolume = (volumeMl < 0.05 ? volumeMl.toFixed(4) : (volumeMl < 1 ? volumeMl.toFixed(3) : volumeMl.toFixed(2))) + ' ml';
        }

        const insulinUnits = volumeMl * 100;
        const formattedInsulinUnits = insulinUnits > 0 
          ? (insulinUnits < 1 ? insulinUnits.toFixed(2) : insulinUnits.toFixed(1)) + ' IU'
          : '-';

        const isMicro = volumeMl > 0 && volumeMl < 0.05;

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-900/60 transition-colors";
        tr.innerHTML = `
          <!-- 약물 & 농도 -->
          <td class="py-2.5 px-3">
            <div class="font-extrabold text-white text-xs sm:text-sm tracking-tight">${drug.name}</div>
            <div class="text-[11px] text-slate-400 font-mono mt-0.5">
              원내: <span class="text-emerald-400 font-bold">${drug.concentration} ${drug.unitType === 'mg' ? 'mg/ml' : '제형'}</span>
            </div>
          </td>

          <!-- 100g당 기준량 (인라인 수정) -->
          <td class="py-2.5 px-3 bg-amber-950/10 border-x border-slate-800/80">
            <div class="flex items-center gap-1">
              <input type="number" step="any" min="0" value="${targetDose100g}" 
                class="w-16 px-1.5 py-1 text-xs font-black rounded bg-slate-900 border border-amber-500/50 text-amber-300 focus:outline-none focus:ring-1 focus:ring-amber-400 font-mono text-center"
                onchange="handleDoseChange('${drug.id}', this.value)">
              <span class="text-[11px] font-bold text-amber-400">${specGuide.unit}/100g</span>
            </div>
            <div class="text-[10px] text-slate-500 font-mono mt-0.5">(${specGuide.originalKg})</div>
          </td>

          <!-- 총 처방량 -->
          <td class="py-2.5 px-3">
            <span class="font-mono font-bold text-slate-200 text-xs px-2 py-0.5 rounded bg-slate-900 border border-slate-800">
              ${formattedTotalDose}
            </span>
          </td>

          <!-- 주사량 & U-100 눈금 (초강조) -->
          <td class="py-2.5 px-4 bg-emerald-950/20 border-x border-emerald-800/40">
            <div class="flex items-baseline gap-2">
              <span class="text-sm sm:text-base font-black text-emerald-300 font-mono tracking-tight">${formattedVolume}</span>
              <span class="text-xs font-extrabold text-slate-950 bg-emerald-400 px-1.5 py-0.5 rounded font-mono shadow-sm">
                ${formattedInsulinUnits}
              </span>
            </div>
            ${isMicro ? '<div class="text-[10px] text-amber-400 font-bold mt-0.5"><i class="fa-solid fa-triangle-exclamation"></i> 초미량(0.3ml 시린지/희석)</div>' : ''}
          </td>

          <!-- 경로 및 간격 -->
          <td class="py-2.5 px-3">
            <div class="text-xs font-bold text-slate-200">${specGuide.interval}</div>
            <div class="text-[11px] text-slate-400 mt-0.5 font-medium">${specGuide.route}</div>
          </td>
        `;
        tbody.appendChild(tr);
      });

      generateChartSummaryText();
    }

    function handleDoseChange(drugId, newVal) {
      const val = parseFloat(newVal);
      if (!isNaN(val) && val >= 0) {
        customDoses[drugId] = val;
      }
      calculateAllDoses();
    }

    function generateChartSummaryText() {
      const name = document.getElementById('patientName').value.trim() || '환자';
      const weightRaw = parseFloat(document.getElementById('weightInput').value) || 0;
      const weightG = getWeightInGrams();
      const sp = getCurrentSpecies();

      let lines = [];
      lines.push(`[${sp.name} / ${name} (${currentUnit === 'g' ? weightRaw + 'g' : weightRaw + 'kg'})]`);
      
      DRUG_DATABASE.forEach(drug => {
        const specGuide = drug.speciesDosing[currentSpeciesId];
        const targetDose100g = customDoses[drug.id] !== undefined ? customDoses[drug.id] : specGuide.defaultDose100g;
        
        let vol = 0;
        let doseMg = 0;
        if (weightG > 0) {
          const multiplier = weightG / 100;
          if (drug.unitType === 'mg') {
            doseMg = targetDose100g * multiplier;
            vol = doseMg / drug.concentration;
          } else {
            vol = targetDose100g * multiplier;
            doseMg = vol;
          }
        }

        const volStr = vol < 0.05 ? vol.toFixed(4) : (vol < 1 ? vol.toFixed(3) : vol.toFixed(2));
        const iuStr = (vol * 100).toFixed(1);
        lines.push(`${drug.name.split(' ')[0]}: ${volStr}ml (${iuStr}IU) [${specGuide.route}, ${specGuide.interval}]`);
      });

      document.getElementById('chartSummaryText').value = lines.join(' | ');
    }

    function copyChartSummary() {
      const copyTextarea = document.getElementById('chartSummaryText');
      copyTextarea.select();
      copyTextarea.setSelectionRange(0, 99999);

      try {
        document.execCommand('copy');
        const toast = document.getElementById('copyAlertToast');
        toast.classList.remove('hidden');
        setTimeout(() => {
          toast.classList.add('hidden');
        }, 1800);
      } catch (err) {
        console.error(err);
      }
    }

    function resetForm() {
      document.getElementById('patientName').value = '';
      customDoses = {};
      initDefaultValues();
      calculateAllDoses();
    }
  </script>
</body>
</html>
