<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>23시 하단오거리 동물병원 · 접수 안내</title>
<style>
:root {
  --green: #16875a;
  --deep: #075b3c;
  --mint: #e8f8ee;
  --ink: #12382e;
  --line: #d6eee0;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  color: var(--ink);
  background: #edf5f0;
}
body {
  padding: 8px;
  background: radial-gradient(ellipse at 15% 8%, #e0f6e5 0, transparent 40%),
              radial-gradient(ellipse at 88% 12%, #d5f2dc 0, transparent 35%),
              #edf5f0;
}
.screen {
  max-width: 100%;
  margin: auto;
  border-radius: 18px;
  overflow: hidden;
  background: #ffffff;
  border: 1px solid #cce8d4;
  box-shadow: 0 10px 30px rgba(18, 64, 42, 0.08);
}

/* Header 영역 (3분할 뷰에 맞춰 슬림화) */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: linear-gradient(115deg, #e4f7e6, #ffffff 48%, #c9edcf);
  border-bottom: 2px solid #dcefe2;
  gap: 8px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.logo {
  font-size: 24px;
}
.brandname {
  font-size: clamp(16px, 1.8vw, 22px);
  font-weight: 950;
  letter-spacing: -0.04em;
  color: #0b3425;
  white-space: nowrap;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.clockbox {
  background: #ffffffd9;
  border: 1px solid #d2ead7;
  padding: 4px 10px;
  border-radius: 10px;
  font-size: clamp(16px, 1.6vw, 22px);
  font-weight: 950;
  color: #055535;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* 섹션 타이틀 바 */
.sectionbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: #f7fcf9;
  border-bottom: 1px solid #e1f2e6;
}
.sectiontitle {
  font-size: 15px;
  font-weight: 950;
  color: #0b3a29;
}
.live {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #d8f5e1;
  color: #17683e;
  border-radius: 99px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 900;
  white-space: nowrap;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b84f;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  50% { opacity: .45; transform: scale(.8); }
}

/* 동물 리스트 컨테이너 (세로 쌓기형 대신 가로 롱 카드 목록) */
.list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px;
}

/* 가로형 접수 카드 (모든 정보가 좌우 한 줄로 정렬) */
.entry {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 14px;
  background: #ffffff;
  border: 1.5px solid #bce1c7;
  box-shadow: 0 4px 12px rgba(12, 58, 36, 0.08);
  transition: transform 0.15s ease;
}
.entry:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(12, 58, 36, 0.12);
}

/* 1. 순번 뱃지 */
.num {
  flex: none;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: linear-gradient(145deg, #16a34a, #0d7945);
  color: #fff;
  font-size: 18px;
  font-weight: 950;
  box-shadow: 0 3px 8px rgba(15, 159, 108, 0.25);
}

/* 2. 아이콘 + 이름 묶음 */
.patient-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  min-width: 110px;
}
.animal {
  font-size: 32px;
  line-height: 1;
}
.pet {
  font-size: 19px;
  font-weight: 1000;
  color: #064029;
  letter-spacing: -0.04em;
  white-space: nowrap;
}

/* 3. 병명 / 사유 (가운데 영역을 넓고 유연하게 차지) */
.reason-box {
  flex: 1.2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 6px 10px;
  background: linear-gradient(135deg, #fff3f1, #ffe9e5);
  border: 1.5px solid #fca595;
  border-radius: 10px;
  min-width: 100px;
  text-align: center;
}
.reason-title {
  font-size: 10px;
  font-weight: 900;
  color: #c2410c;
  margin-bottom: 2px;
}
.reason-text {
  font-size: 14px;
  font-weight: 950;
  color: #991b1b;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* 4. 상태 뱃지 (접수대기 / 진료진행) */
.status {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 950;
  white-space: nowrap;
}
.status.wait {
  background: linear-gradient(135deg, #15803d, #166534);
  color: #fff;
}
.status.wait .sdot {
  width: 8px;
  height: 8px;
  background: #4ade80;
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.35);
  animation: pulse 1.1s infinite;
}
.status.treat {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff;
}
.status.treat .sdot {
  width: 8px;
  height: 8px;
  background: #93c5fd;
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.4);
  animation: pulse 1.3s infinite;
}

/* 5. 시간 정보 묶음 (예상소요 + 예상진료) */
.times-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: none;
  min-width: 130px;
}
.estimate {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 1000;
  color: #0d5f3a;
  background: #eaf8ef;
  border: 1px solid #8be4a7;
  border-radius: 6px;
  padding: 4px 6px;
  white-space: nowrap;
}
.expected {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 1000;
  color: #7c2d12;
  background: #fff0db;
  border: 1px solid #fb923c;
  border-radius: 6px;
  padding: 4px 6px;
  white-space: nowrap;
}

.empty {
  text-align: center;
  padding: 40px 14px;
  border: 2px dashed #b1d8bf;
  border-radius: 14px;
  background: #ffffffbd;
  color: #4d7060;
  font-size: 15px;
  white-space: pre-line;
  line-height: 1.5;
}

/* 하단 푸터 */
footer {
  display: flex;
  justify-content: space-between;
  padding: 6px 14px;
  color: #638475;
  font-size: 11px;
  font-weight: 700;
  background: #f1f9f3;
  border-top: 1px solid #e1f2e6;
}
</style>
</head>
<body>
<div class="screen">
  <header>
    <div class="brand">
      <div class="logo">🐶🐱</div>
      <div class="brandname">23시 하단오거리 동물병원</div>
    </div>
    <div class="header-right">
      <div class="clockbox" id="clock">00:00:00</div>
    </div>
  </header>

  <div class="sectionbar">
    <div class="sectiontitle">🐾 실시간 접수 대기 현황</div>
    <div class="live"><span class="dot"></span> 실시간 안내 중</div>
  </div>

  <main>
    <section id="list" class="list">
      <div class="empty">접수 현황을 확인하고 있습니다…</div>
    </section>
  </main>

  <footer>
    <span>진료 상황에 따라 시간이 변동될 수 있습니다.</span>
    <span id="updated">연결 중</span>
  </footer>
</div>

<script>
const API_BASE = "https://m5-api.yurmgirl.workers.dev";
const RECEPTION_API = "/api/receptions";
const listEl = document.getElementById("list");
const updatedEl = document.getElementById("updated");

function tickClock(){
  const d = new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString("ko-KR", {hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit"});
}
tickClock();
setInterval(tickClock, 1000);

function safeText(v){ return v == null ? "" : String(v); }
function getPayload(item){
  let p = item?.payload;
  if(typeof p === "string"){
    try{ p = JSON.parse(p); }catch{ p = {}; }
  }
  return p && typeof p === "object" ? p : {};
}
function statusOf(item){ return safeText(item.status || "접수대기"); }
function active(item){
  const s = statusOf(item);
  return !["완료", "진료완료", "취소", "종료"].includes(s);
}
function estimateMinutes(v){
  if(v === null || v === undefined || v === "" || v === "unknown") return null;
  const n = Number(v);
  return Number.isFinite(n) && n > 0 ? n : null;
}
function clockText(d){
  return d.toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", hour12: false});
}
function make(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}

const ANIMALS = {
  dog: { label: "강아지", emoji: "🐶" },
  cat: { label: "고양이", emoji: "🐱" },
  small_mammal: { label: "소동물", emoji: "🐹" },
  bird: { label: "조류", emoji: "🦜" },
  reptile: { label: "파충류", emoji: "🦎" },
  other: { label: "기타 동물", emoji: "🐾" }
};

function render(items, estimates, animalTypes){
  const activeItems = (Array.isArray(items) ? items : []).filter(active).sort((a,b)=>{
    const ta = Date.parse(a.created_at || a.createdAt || 0) || 0;
    const tb = Date.parse(b.created_at || b.createdAt || 0) || 0;
    return ta - tb;
  });

  listEl.replaceChildren();
  if(!activeItems.length){
    listEl.append(make("div", "empty", "현재 대기 중인 접수가 없습니다.\n접수가 등록되면 실시간 표시됩니다."));
    return;
  }

  let cumulativeMinutes = 0;
  let cumulativeKnown = true;

  activeItems.forEach((item, index)=>{
    const row = make("article", "entry");
    
    // 1. 순번 뱃지
    const num = make("div", "num", String(index + 1).padStart(2, "0"));

    // 2. 동물 아이콘 + 이름
    const key = String(item.id ?? item.reception_id ?? "");
    const animalType = animalTypes && animalTypes[key] ? animalTypes[key] : "other";
    const animal = ANIMALS[animalType] || ANIMALS.other;
    const patientWrap = make("div", "patient-wrap");
    const illustration = make("div", "animal", animal.emoji);
    const pet = make("div", "pet", safeText(item.pet_name || item.animal_name || "이름 미입력"));
    patientWrap.append(illustration, pet);

    // 3. 병명 / 사유 (중앙 정렬)
    const payload = getPayload(item);
    const reasonText = safeText(payload.disease || item.disease || payload.diagnosis || item.diagnosis || payload.reason || item.symptom || item.symptoms || "병명 확인 중");
    const reasonBox = make("div", "reason-box");
    reasonBox.append(
      make("div", "reason-title", "🩺 증상·내원사유"),
      make("div", "reason-text", reasonText)
    );

    // 4. 상태 뱃지
    const s = statusOf(item);
    const treating = /진료중|진료 중|치료중|치료 중/.test(s);
    const badge = make("div", "status " + (treating ? "treat" : "wait"));
    badge.append(make("span", "sdot"), document.createTextNode(treating ? "진료 진행 중" : "접수 대기중"));

    // 5. 예상 소요시간 & 예상 진료시간
    const val = estimates && Object.prototype.hasOwnProperty.call(estimates, key) ? estimates[key] : null;
    const minutes = estimateMinutes(val);
    if(minutes === null) cumulativeKnown = false;
    else cumulativeMinutes += minutes;

    const timesWrap = make("div", "times-wrap");
    const estimateLabel = minutes === null ? "예상 소요 미정" : `예상 소요 ${minutes}분`;
    const expectedLabel = cumulativeKnown 
      ? "예상 진료 " + clockText(new Date(Date.now() + cumulativeMinutes * 60000))
      : "예상 진료 미정";

    timesWrap.append(
      make("div", "estimate", estimateLabel),
      make("div", "expected", expectedLabel)
    );

    // 가로 한 줄로 연결
    row.append(num, patientWrap, reasonBox, badge, timesWrap);
    listEl.append(row);
  });
}

async function refresh(){
  try {
    const [r, e] = await Promise.all([
      fetch(RECEPTION_API, { cache: "no-store" }),
      fetch(API_BASE + "/estimates", { cache: "no-store" })
    ]);
    if(!r.ok) throw new Error("접수 목록 조회 실패 (" + r.status + ")");
    if(!e.ok) throw new Error("예상시간 서버 조회 실패 (" + e.status + ")");
    const receptions = await r.json();
    const estimateData = await e.json();
    render(
      Array.isArray(receptions) ? receptions : (receptions.items || []),
      estimateData.estimates || {},
      estimateData.animalTypes || {}
    );
    updatedEl.textContent = "갱신 " + new Date().toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", second: "2-digit"});
  } catch(err) {
    updatedEl.textContent = "연결 확인 필요";
    if(!listEl.children.length || listEl.querySelector(".empty")) {
      listEl.replaceChildren(make("div", "empty", "서버에 연결하지 못했습니다."));
    }
    console.error(err);
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
