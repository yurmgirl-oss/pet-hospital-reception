<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>23시 동물병원 - 접수 안내</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap">
  <style>
    body { 
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; 
      background-color: #f8fafc;
      background-image: 
        linear-gradient(to right, rgba(203, 213, 225, 0.35) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(203, 213, 225, 0.35) 1px, transparent 1px);
      background-size: 20px 20px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-serif-title {
      font-family: 'Nanum Myeongjo', serif;
    }
    .screen-fit {
      min-height: 100dvh;
      height: 100dvh;
    }
  </style>
</head>
<body class="screen-fit text-slate-800 px-3.5 py-4 sm:p-6 flex flex-col justify-between items-center overflow-hidden">

  <!-- 상단 간격 조절용 공간 -->
  <div class="h-1"></div>

  <!-- 메인 인터랙션 컨테이너 (스크롤 없이 원스크린 집중) -->
  <main class="w-full max-w-md flex flex-col items-center gap-3.5 sm:gap-6 my-auto">
    
    <!-- 병원 타이틀 헤더 -->
    <header class="text-center space-y-1 sm:space-y-2">
      <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-teal-50 border border-teal-200 text-[#0d9488] text-xs font-bold shadow-xs">
        <span class="text-sm">🐾</span> <span>23시 동물병원 진료 접수</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-black text-[#0f172a] font-serif-title tracking-tight">
        어서오세요
      </h1>
      <p class="text-slate-600 text-xs sm:text-sm font-semibold">
        원하시는 접수 구분을 선택해 주세요
      </p>
      <div class="h-1 w-14 sm:w-16 bg-[#0d9488] rounded-full mx-auto mt-2"></div>
    </header>

    <!-- 초진 / 재진 2개 프레임 좌우 나란히 배치 (grid-cols-2 유지) -->
    <section class="w-full grid grid-cols-2 gap-3 sm:gap-4.5" aria-label="진료 접수 구분 선택">
      
      <!-- 1. 초진 접수 카드 -->
      <a 
        href="first.html"
        class="group relative bg-white rounded-2xl sm:rounded-3xl p-3.5 sm:p-5 border-2 border-teal-100 hover:border-teal-500 active:scale-[0.98] shadow-lg shadow-teal-900/5 flex flex-col items-center justify-between text-center transition-all duration-200"
      >
        <div class="w-full flex flex-col items-center">
          <!-- 1) 크게 키운 '첫 방문' 뱃지 -->
          <span class="inline-flex items-center gap-1 text-xs sm:text-sm font-extrabold text-teal-800 bg-teal-100/80 border border-teal-200 px-3 py-1 rounded-full mb-2.5 shadow-2xs">
            <span>✨</span> 첫 방문
          </span>
          
          <!-- 아이콘 -->
          <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-teal-50 text-[#0d9488] group-hover:bg-[#0d9488] group-hover:text-white flex items-center justify-center mb-1.5 transition-colors duration-200 shadow-xs">
            <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
            </svg>
          </div>
          
          <!-- 2) 큼직하게 강조된 제목 '초진' -->
          <h2 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight mb-2">
            초진
          </h2>
          
          <!-- 3) '오랜만인 경우'가 큼직하게 돋보이는 설명 박스 -->
          <div class="w-full bg-slate-50/90 rounded-xl py-2 px-1 border border-slate-100/90 mb-3 space-y-0.5">
            <p class="text-[11px] sm:text-xs text-slate-500 font-medium leading-none">
              첫 방문이거나
            </p>
            <p class="text-sm sm:text-base font-black text-teal-700 tracking-tight leading-snug">
              오랜만인 경우
            </p>
          </div>
        </div>
        
        <!-- 4) '작성하기' -> '초진 접수하기 →' 로 변경된 버튼 -->
        <div class="w-full py-2.5 sm:py-3 rounded-xl bg-teal-600 text-white font-extrabold text-xs sm:text-sm tracking-tight group-hover:bg-teal-700 shadow-md shadow-teal-600/20 transition">
          초진 접수하기 →
        </div>
      </a>

      <!-- 2. 재진 접수 카드 -->
      <a 
        href="revisit.html"
        class="group relative bg-white rounded-2xl sm:rounded-3xl p-3.5 sm:p-5 border-2 border-indigo-100 hover:border-indigo-500 active:scale-[0.98] shadow-lg shadow-indigo-900/5 flex flex-col items-center justify-between text-center transition-all duration-200"
      >
        <div class="w-full flex flex-col items-center">
          <!-- 1) 크게 키운 '재방문' 뱃지 -->
          <span class="inline-flex items-center gap-1 text-xs sm:text-sm font-extrabold text-indigo-800 bg-indigo-100/80 border border-indigo-200 px-3 py-1 rounded-full mb-2.5 shadow-2xs">
            <span>🔄</span> 재방문
          </span>
          
          <!-- 아이콘 -->
          <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-indigo-50 text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white flex items-center justify-center mb-1.5 transition-colors duration-200 shadow-xs">
            <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
          </div>
          
          <!-- 2) 큼직하게 강조된 제목 '재진' -->
          <h2 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight mb-2">
            재진
          </h2>
          
          <!-- 3) '다시 오신 경우'가 큼직하게 돋보이는 설명 박스 -->
          <div class="w-full bg-slate-50/90 rounded-xl py-2 px-1 border border-slate-100/90 mb-3 space-y-0.5">
            <p class="text-[11px] sm:text-xs text-slate-500 font-medium leading-none">
              차트가 있고
            </p>
            <p class="text-sm sm:text-base font-black text-indigo-700 tracking-tight leading-snug">
              다시 오신 경우
            </p>
          </div>
        </div>

        <!-- 4) '작성하기' -> '재진 접수하기 →' 로 변경된 버튼 -->
        <div class="w-full py-2.5 sm:py-3 rounded-xl bg-indigo-600 text-white font-extrabold text-xs sm:text-sm tracking-tight group-hover:bg-indigo-700 shadow-md shadow-indigo-600/20 transition">
          재진 접수하기 →
        </div>
      </a>

    </section>

  </main>

  <!-- 하단 관리자 데스크 바로가기 링크 -->
  <footer class="w-full text-center pb-1">
    <button 
      type="button" 
      onclick="openPasswordModal()" 
      class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs text-slate-400 hover:text-slate-600 active:text-slate-800 rounded-lg hover:bg-slate-100/80 transition"
    >
      <span>🔒</span>
      <span class="underline underline-offset-4">데스크 / 카운터 현황판 바로가기</span>
    </button>
  </footer>

  <!-- 비밀번호 52 입력 모달 (직원 전용) -->
  <div id="passwordModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-2xl text-center space-y-4">
      <div class="w-10 h-10 mx-auto rounded-full bg-slate-100 flex items-center justify-center text-lg">
        🔐
      </div>
      <div>
        <h3 class="text-base font-bold text-slate-900">직원 전용 인증</h3>
        <p class="text-xs text-slate-500 mt-1">카운터 관리 비밀번호를 입력해주세요.</p>
      </div>
      <div>
        <input 
          type="password" 
          id="deskPwInput" 
          inputmode="numeric" 
          pattern="[0-9]*" 
          maxlength="6"
          placeholder="비밀번호" 
          class="w-full px-3 py-2.5 text-center text-lg font-bold tracking-widest border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500"
          onkeydown="if(event.key==='Enter') verifyPassword()"
        />
        <p id="pwError" class="text-xs text-red-500 mt-1.5 hidden font-medium">❌ 비밀번호가 올바르지 않습니다.</p>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button 
          type="button" 
          onclick="closePasswordModal()" 
          class="w-full py-2.5 text-xs font-semibold text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200 transition"
        >
          취소
        </button>
        <button 
          type="button" 
          onclick="verifyPassword()" 
          class="w-full py-2.5 text-xs font-bold text-white bg-teal-600 rounded-xl hover:bg-teal-700 shadow-sm transition"
        >
          확인
        </button>
      </div>
    </div>
  </div>

  <script>
    // 카운터 모달 제어 로직
    function openPasswordModal() {
      const modal = document.getElementById('passwordModal');
      const input = document.getElementById('deskPwInput');
      const err = document.getElementById('pwError');
      err.classList.add('hidden');
      input.value = '';
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => input.focus(), 60);
    }

    function closePasswordModal() {
      const modal = document.getElementById('passwordModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // 비밀번호 '52' 검증 로직
    function verifyPassword() {
      const pwInput = document.getElementById('deskPwInput');
      const err = document.getElementById('pwError');
      if (pwInput.value === '52') {
        window.location.href = 'counter.html';
      } else {
        err.classList.remove('hidden');
        pwInput.value = '';
        pwInput.focus();
      }
    }
  </script>

</body>
</html>
