</style></head><body><div class="screen">
<header class="top"><div class="brand"><div class="logo" aria-label="동물병원 로고">🐶🐱</div><div><div class="brandname">23시 하단오거리 동물병원</div><div class="english">HADAN OGEORI VETERINARY HOSPITAL</div><div class="tagline">우리 아이의 건강한 오늘, 23시 하단오거리가 함께합니다. 💚</div></div></div><div class="datebox" id="datebox">📅 날짜 확인 중<strong id="day">오늘</strong></div><div class="clockbox" id="clock">00:00:00</div></header>

<script>
const API_BASE="https://m5-api.yurmgirl.workers.dev",RECEPTION_API="/api/receptions";const cardsEl=document.getElementById("cards"),updatedEl=document.getElementById("updated");let lastSignature="";

function tick(){const d=new Date();document.getElementById("clock").textContent=d.toLocaleTimeString("ko-KR",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});document.getElementById("datebox").firstChild.textContent="📅 "+d.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"});document.getElementById("day").textContent=d.toLocaleDateString("ko-KR",{weekday:"long"})}tick();setInterval(tick,1000);
function safe(v){return v==null?"":String(v)}function payloadOf(i){let p=i?.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch{p={}}}return p&&typeof p==="object"?p:{}}function statusOf(i){return safe(i.status||"접수대기")}function active(i){return !["완료","진료완료","취소","종료"].includes(statusOf(i))}function make(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}function estimateText(v){if(v===null||v===undefined||v==="")return "확인 중";if(v==="unknown")return "시간 미정";const n=Number(v);return Number.isFinite(n)&&n>0?`약 ${n}분`:"확인 중"}

async function refresh(){try{const [r,e]=await Promise.all([fetch(RECEPTION_API,{cache:"no-store"}),fetch(API_BASE+"/estimates",{cache:"no-store"})]);if(!r.ok)throw Error("접수 목록 API 오류 "+r.status);if(!e.ok)throw Error("예상시간 API 오류 "+e.status);const rr=await r.json(),ee=await e.json();render(Array.isArray(rr)?rr:(rr.items||[]),ee.estimates||{},ee.animalTypes||{});updatedEl.textContent="마지막 갱신 "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}catch(err){updatedEl.textContent="연결 확인 필요";if(!cardsEl.children.length||cardsEl.querySelector(".empty"))cardsEl.replaceChildren(make("div","empty","서버에 연결하지 못했습니다. 관리자에게 연결 상태를 확인해 주세요."));console.error(err)}}refresh();setInterval(refresh,5000);
