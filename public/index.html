<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>23시 하단오거리동물병원 - 진료접수</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap">
  <style>
    body { 
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; 
      background-color: #f8fafc;
      background-image: 
        linear-gradient(to right, rgba(203, 213, 225, 0.35) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(203, 213, 225, 0.35) 1px, transparent 1px);
      background-size: 20px 20px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-serif-title {
      font-family: 'Nanum Myeongjo', serif;
    }
    .screen-fit {
      min-height: 100dvh;
      height: 100dvh;
    }

    /* 공지 전환 시 부드러운 페이드인 효과 */
    .notice-fade {
      animation: noticeFadeIn 0.4s ease-in-out;
    }
    @keyframes noticeFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="screen-fit text-slate-800 px-3.5 py-4 sm:p-6 flex flex-col justify-center items-center overflow-hidden">

  <!-- 메인 인터랙션 컨테이너 -->
  <main class="w-full max-w-md flex flex-col items-center gap-3.5 sm:gap-5">
    
    <!-- 병원 타이틀 헤더 -->
    <header class="text-center space-y-2 w-full">
      <!-- 23시 하단오거리동물병원 진료접수로 명칭 변경 -->
      <div class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-teal-50 border border-teal-200 text-[#0d9488] text-sm font-extrabold shadow-xs">
        <span class="text-base">🐾</span> <span>23시 하단오거리동물병원 진료접수</span>
      </div>

      <!-- 📢 [공지사항 배너: 글자 잘림 없는 자연스러운 줄바꿈 카드] -->
      <div id="kioskNoticeWrapper" style="display: none;" class="items-start gap-2.5 max-w-sm w-full mx-auto mt-2 p-2.5 px-3.5 bg-amber-50/95 border border-amber-300 rounded-xl shadow-xs">
        <span class="inline-flex items-center text-[11px] font-extrabold text-amber-800 bg-amber-100 border border-amber-300 px-2 py-0.5 rounded-full shrink-0 mt-0.5 shadow-2xs">
          📢 소식
        </span>
        <div class="flex-1 text-left">
          <p id="kioskNoticeText" class="text-xs sm:text-[13px] font-bold text-amber-950 tracking-tight leading-snug break-keep">
            <!-- 공지 문구 자동 표시 -->
          </p>
        </div>
      </div>
    </header>

    <!-- 초진 / 재진 2개 프레임 좌우 나란히 배치 (grid-cols-2) -->
    <section class="w-full grid grid-cols-2 gap-3 sm:gap-4.5" aria-label="진료 접수 구분 선택">
      
      <!-- 1. 초진 접수 카드 -->
      <a 
        href="first.html"
        class="group relative bg-white rounded-2xl sm:rounded-3xl p-3.5 sm:p-5 border-2 border-teal-100 hover:border-teal-500 active:scale-[0.98] shadow-lg shadow-teal-900/5 flex flex-col items-center justify-between text-center transition-all duration-200"
      >
        <div class="w-full flex flex-col items-center">
          <span class="inline-flex items-center gap-1 text-xs sm:text-sm font-extrabold text-teal-800 bg-teal-100/80 border border-teal-200 px-3 py-1 rounded-full mb-2.5 shadow-2xs">
            <span>✨</span> 첫 방문
          </span>
          
          <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-teal-50 text-[#0d9488] group-hover:bg-[#0d9488] group-hover:text-white flex items-center justify-center mb-1.5 transition-colors duration-200 shadow-xs">
            <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
            </svg>
          </div>
          
          <h2 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight mb-2">
            초진
          </h2>
          
          <div class="w-full bg-slate-50/90 rounded-xl py-2 px-1 border border-slate-100/90 mb-3 space-y-0.5">
            <p class="text-[11px] sm:text-xs text-slate-500 font-medium leading-none">
              첫 방문이거나
            </p>
            <p class="text-sm sm:text-base font-black text-teal-700 tracking-tight leading-snug">
              오랜만인 경우
            </p>
          </div>
        </div>
        
        <div class="w-full py-2.5 sm:py-3 rounded-xl bg-teal-600 text-white font-extrabold text-xs sm:text-sm tracking-tight group-hover:bg-teal-700 shadow-md shadow-teal-600/20 transition">
          초진 접수하기 →
        </div>
      </a>

      <!-- 2. 재진 접수 카드 -->
      <a 
        href="revisit.html"
        class="group relative bg-white rounded-2xl sm:rounded-3xl p-3.5 sm:p-5 border-2 border-indigo-100 hover:border-indigo-500 active:scale-[0.98] shadow-lg shadow-indigo-900/5 flex flex-col items-center justify-between text-center transition-all duration-200"
      >
        <div class="w-full flex flex-col items-center">
          <span class="inline-flex items-center gap-1 text-xs sm:text-sm font-extrabold text-indigo-800 bg-indigo-100/80 border border-indigo-200 px-3 py-1 rounded-full mb-2.5 shadow-2xs">
            <span>🔄</span> 재방문
          </span>

          <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-indigo-50 text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white flex items-center justify-center mb-1.5 transition-colors duration-200 shadow-xs">
            <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
          </div>

          <h2 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight mb-2">
            재진
          </h2>

          <div class="w-full bg-slate-50/90 rounded-xl py-2 px-1 border border-slate-100/90 mb-3 space-y-0.5">
            <p class="text-[11px] sm:text-xs text-slate-500 font-medium leading-none">
              차트가 있고
            </p>
            <p class="text-sm sm:text-base font-black text-indigo-600 tracking-tight leading-snug">
              다시 오신 경우
            </p>
          </div>
        </div>

        <div class="w-full py-2.5 sm:py-3 rounded-xl bg-indigo-600 text-white font-extrabold text-xs sm:text-sm tracking-tight group-hover:bg-indigo-700 shadow-md shadow-indigo-600/20 transition">
          재진 접수하기 →
        </div>
      </a>
    </section>

    <!-- 하단 메일 안내 박스 -->
    <div class="w-full bg-indigo-50/70 border border-indigo-100/80 rounded-2xl p-3 sm:p-4 text-center space-y-1">
      <p class="text-xs sm:text-sm text-slate-700 font-bold">다른 병원 자료나 사진자료 등은 메일로 보내주세요</p>
      <div class="flex items-center justify-center gap-1.5 text-xs sm:text-sm font-black text-indigo-700 font-mono">
        <span>✉️</span>
        <a href="mailto:admin@23si.net" class="underline hover:text-indigo-900">admin@23si.net</a>
      </div>
    </div>

  </main>

  <!-- 하단 관리자 데스크 바로가기 링크 (바짝 당김) -->
  <footer class="w-full text-center mt-2.5">
    <button 
      type="button" 
      onclick="openPasswordModal()" 
      class="inline-flex items-center gap-1.5 px-3 py-1 text-[11px] sm:text-xs text-slate-400 hover:text-slate-600 active:text-slate-800 rounded-lg hover:bg-slate-200/50 transition cursor-pointer"
    >
      <span>🔒</span>
      <span class="underline underline-offset-4">데스크 / 카운터 현황판 바로가기</span>
    </button>
  </footer>

  <!-- 비밀번호 52 입력 모달 (직원 전용) -->
  <div id="passwordModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-2xl text-center space-y-4">
      <div class="w-10 h-10 mx-auto rounded-full bg-slate-100 flex items-center justify-center text-lg">
        🔐
      </div>
      <div>
        <h3 class="text-base font-bold text-slate-900">직원 전용 인증</h3>
        <p class="text-xs text-slate-500 mt-1">카운터 관리 비밀번호를 입력해주세요.</p>
      </div>
      <div>
        <input 
          type="password" 
          id="deskPwInput" 
          inputmode="numeric" 
          pattern="[0-9]*" 
          maxlength="6" 
          placeholder="비밀번호" 
          class="w-full px-3 py-2.5 text-center text-lg font-bold tracking-widest border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500"
          onkeydown="if(event.key==='Enter') verifyPassword()"
        />
        <p id="pwError" class="text-xs text-red-500 mt-1.5 hidden font-medium">❌ 비밀번호가 올바르지 않습니다.</p>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button 
          type="button" 
          onclick="closePasswordModal()" 
          class="w-full py-2.5 text-xs font-semibold text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200 transition"
        >
          취소
        </button>
        <button 
          type="button" 
          onclick="verifyPassword()" 
          class="w-full py-2.5 text-xs font-bold text-white bg-teal-600 rounded-xl hover:bg-teal-700 shadow-sm transition"
        >
          확인
        </button>
      </div>
    </div>
  </div>

  <script>
    // 1. 관리자 모달 제어
    function openPasswordModal() {
      const modal = document.getElementById('passwordModal');
      const input = document.getElementById('deskPwInput');
      const err = document.getElementById('pwError');
      err.classList.add('hidden');
      input.value = '';
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => input.focus(), 60);
    }

    function closePasswordModal() {
      const modal = document.getElementById('passwordModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function verifyPassword() {
      const pwInput = document.getElementById('deskPwInput');
      const err = document.getElementById('pwError');
      if (pwInput.value === '52') {
        window.location.href = 'counter.html';
      } else {
        err.classList.remove('hidden');
        pwInput.value = '';
        pwInput.focus();
      }
    }

    // 2. 다중 공지사항 순차 페이드 전환 (줄바꿈 온전 표시)
    let switchTimer = null;
    let currentIdx = 0;
    let noticeItems = [];

    async function fetchKioskNotice() {
      try {
        const res = await fetch('/api/notice');
        if (!res.ok) return;

        const data = await res.json();
        const wrapper = document.getElementById('kioskNoticeWrapper');
        const textElem = document.getElementById('kioskNoticeText');

        if (!wrapper || !textElem) return;

        const rawNotice = (data.notice || '').trim();
        if (!rawNotice) {
          wrapper.style.display = 'none';
          if (switchTimer) clearInterval(switchTimer);
          return;
        }

        // 엔터 기준으로 공지 분리
        noticeItems = rawNotice.split('\n').map(s => s.trim()).filter(Boolean);
        if (noticeItems.length === 0) {
          wrapper.style.display = 'none';
          return;
        }

        wrapper.style.display = 'flex';
        showCurrentNotice();

        // 공지가 여러 개일 때 4.5초마다 부드럽게 다음 공지로 전환
        if (switchTimer) clearInterval(switchTimer);
        if (noticeItems.length > 1) {
          switchTimer = setInterval(() => {
            currentIdx = (currentIdx + 1) % noticeItems.length;
            showCurrentNotice();
          }, 4500);
        }
      } catch (err) {
        console.error('공지 로드 오류:', err);
      }
    }

    function showCurrentNotice() {
      const textElem = document.getElementById('kioskNoticeText');
      if (!textElem || noticeItems.length === 0) return;

      textElem.textContent = noticeItems[currentIdx];
      textElem.classList.remove('notice-fade');
      void textElem.offsetWidth; // 리플로우 트리거
      textElem.classList.add('notice-fade');
    }

    // 화면 로드 즉시 실행 및 20초마다 갱신
    fetchKioskNotice();
    setInterval(fetchKioskNotice, 20000);
  </script>
</body>
</html>
