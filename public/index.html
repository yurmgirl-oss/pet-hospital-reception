<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>23시 하단오거리동물병원 - 진료접수</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{--ink:#20323d;--teal:#0ba99f;--mint:#b6e9df;--orange:#ff7628;--orange-deep:#f25419;--yellow:#ffdf35;--gold:#684000;--cream:#fffaf4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--ink)}
body{min-height:100dvh;padding:22px 22px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:hidden;background:radial-gradient(ellipse at 0 0,#fff0d9 0,transparent 22%),radial-gradient(ellipse at 100% 100%,#ffe7d8 0,transparent 22%),#fffdfa;-webkit-tap-highlight-color:transparent}
main{width:min(100%,920px);margin:auto;display:flex;flex-direction:column;gap:19px}
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px}
.brand{width:min(100%,850px);min-height:86px;padding:14px 22px;display:flex;align-items:center;justify-content:center;gap:12px;border:3px solid var(--mint);border-radius:28px;background:linear-gradient(180deg,#fff 0%,#fffaf6 100%);box-shadow:0 7px 0 #dcefe8,0 16px 30px #304c3c12}
.brand-mark{width:44px;height:44px;flex:0 0 auto}
.brand h1{margin:0;font-size:clamp(25px,3.5vw,39px);line-height:1.12;letter-spacing:-.05em;font-weight:950;white-space:nowrap}
.brand h1 .time{color:var(--teal)}
.welcome{padding:4px 0 8px}
.welcome h2{font-size:clamp(40px,5.1vw,56px);font-weight:950;line-height:1.08;letter-spacing:-.06em;margin:0;color:#1f3039}
.welcome p{font-size:clamp(22px,2.9vw,31px);font-weight:800;color:#465966;margin:12px 0 0;letter-spacing:-.035em}
.paw-deco{position:fixed;z-index:0;pointer-events:none;color:#ffd9b4;font-size:58px;opacity:.72}
.paw-a{top:26%;left:max(14px,calc((100vw - 1050px)/2));transform:rotate(-20deg)}
.paw-b{top:26%;right:max(14px,calc((100vw - 1050px)/2));transform:rotate(18deg)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;position:relative;z-index:1}
.card{display:flex;flex-direction:column;align-items:stretch;min-width:0;min-height:0;height:clamp(570px,61vh,660px);padding:0 12px 13px;border-radius:35px;overflow:hidden;text-decoration:none;position:relative;isolation:isolate;transition:transform .15s ease,filter .15s ease}
.card:active{transform:translateY(4px) scale(.992);filter:saturate(1.08)}
.card.first{background:linear-gradient(150deg,#ff9b46 0%,#ff7628 38%,#ff5b1e 100%);border:4px solid #ff8c2b;box-shadow:inset 0 4px 0 #fff7df,inset 0 -6px 0 #e94d17,0 9px 0 #f4c5a5,0 18px 28px #b64c2525}
.card.return{background:linear-gradient(150deg,#fff16d 0%,#ffdf35 48%,#ffcb20 100%);border:4px solid #ffd22a;box-shadow:inset 0 4px 0 #fffedb,inset 0 -6px 0 #e9a70a,0 9px 0 #f2dfa3,0 18px 28px #a47a1c20}
.pill{align-self:center;position:relative;z-index:2;margin:0 0 10px;padding:8px 18px;border:1px solid #ffffff80;border-radius:999px;background:#ffffff42;color:#fff;font-size:16px;line-height:1.1;font-weight:850;box-shadow:0 3px 8px #783c1715}
.return .pill{color:#70450a;background:#fff9d87a;border-color:#fff4b4}
.mascot-frame{width:calc(100% + 24px);height:clamp(215px,27vw,280px);margin:0 -12px;overflow:hidden;flex:0 0 auto;background:#ff7a2c}
.mascot-frame img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center}
.return .mascot-frame{background:#ffdf35}
.card h3{font-size:clamp(42px,4.6vw,56px);font-weight:950;line-height:1.05;letter-spacing:-.06em;text-align:center;margin:12px 0 12px}
.first h3{color:white;text-shadow:0 3px 0 #e64d17,0 5px 8px #8a2e1f45}
.return h3{color:#593600;text-shadow:0 2px 0 #fff3a0}
.description{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:80px;margin:0 4px 18px;padding:8px 8px;border-radius:16px;background:#ffffff2c;font-size:clamp(18px,2.1vw,23px);line-height:1.42;font-weight:800;letter-spacing:-.035em;word-break:keep-all}
.first .description{color:#fff;background:#ffffff24;text-shadow:0 1px 2px #9a351e20}
.return .description{color:#65420b;background:#fff9e8e8}
.action{margin-top:auto;min-height:74px;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 10px;border:2px solid #fffaf4;border-radius:24px;background:linear-gradient(180deg,#fff 0%,#fff0e7 100%);font-size:clamp(20px,2.35vw,27px);font-weight:950;letter-spacing:-.035em;box-shadow:0 5px 0 #edb99b,0 9px 15px #9d381e22,inset 0 2px 0 #fff;color:#e94e1b}
.return .action{color:#87500a;box-shadow:0 5px 0 #e4b84f,0 9px 15px #9d741522,inset 0 2px 0 #fff}
.notice{width:100%;display:flex;align-items:center;justify-content:center;gap:16px;padding:17px 20px;border:2px solid #ffdfc7;border-radius:24px;background:#fff8ef;box-shadow:0 8px 20px #9e5b170d;position:relative;z-index:1}
.megaphone{font-size:42px;flex:0 0 auto}
.notice-label{padding:9px 16px;border-radius:999px;background:#ff5b1e;color:#fff;font-size:19px;font-weight:900;white-space:nowrap}
.notice-copy{font-size:clamp(16px,1.9vw,21px);line-height:1.45;font-weight:750;color:#4b3b30;text-align:left}
#kioskNoticeWrapper{display:none}
#kioskNoticeText{font-weight:850}
footer{width:100%;text-align:center;margin-top:0;color:#75838e;font-size:13px;line-height:1.8;position:relative;z-index:1}
footer button{border:0;background:transparent;color:#83909b;font:inherit;cursor:pointer;padding:5px 10px;border-radius:9px;text-decoration:underline;text-underline-offset:3px}
footer button:hover{background:#e8edf0}
footer a{color:inherit;text-decoration:none}
#passwordModal{position:fixed;inset:0;z-index:1000;background:#17232dcc;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(5px)}
#passwordModal.show{display:flex}
.modal-card{background:#fff;border-radius:24px;width:min(100%,340px);padding:25px;box-shadow:0 24px 80px #0003;text-align:center}
.modal-card h4{font-size:20px;margin:6px 0}
.modal-card p{color:#65727c;font-size:14px;margin:0 0 16px}
#deskPwInput{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;text-align:center;font-size:22px;letter-spacing:5px}
#pwError{color:#dc2626;font-size:13px;margin:8px 0}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.modal-actions button{padding:12px;border:0;border-radius:12px;font-weight:800;cursor:pointer}
.cancel{background:#eef2f6;color:#344454}.confirm{background:#0d9488;color:white}
.notice-fade{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){
 body{padding:15px 14px 14px;justify-content:flex-start}
 main{gap:16px}
 header{gap:15px}
 .brand{min-height:66px;padding:12px 10px;border-radius:22px;gap:7px}
 .brand-mark{width:31px;height:31px}
 .brand h1{font-size:clamp(18px,4.6vw,28px)}
 .welcome h2{font-size:clamp(32px,7.5vw,43px)}
 .welcome p{font-size:clamp(18px,4.4vw,24px);margin-top:8px}
 .paw-deco{font-size:34px;top:22%;opacity:.48}
 .cards{gap:10px}
 .card{height:clamp(430px,57vh,560px);padding:0 7px 10px;border-radius:25px;border-width:3px}
 .pill{font-size:12px;padding:7px 10px;margin-bottom:7px}
 .mascot-frame{width:calc(100% + 14px);height:clamp(150px,23vh,190px);margin:0 -7px}
 .card h3{font-size:clamp(29px,7vw,41px);margin:10px 0 8px}
 .description{font-size:clamp(13px,3.25vw,16px);min-height:64px;margin:0 1px 10px;padding:5px 3px;border-radius:12px}
 .action{min-height:56px;padding:8px 2px;border-radius:17px;font-size:clamp(13px,3.25vw,18px);gap:4px}
 .notice{gap:9px;padding:12px 10px;border-radius:18px}
 .megaphone{font-size:29px}
 .notice-label{font-size:14px;padding:7px 10px}
 .notice-copy{font-size:clamp(12px,3vw,15px)}
 footer{font-size:11px}
}
@media(max-width:390px){
 .card{height:420px}
 .mascot-frame{height:125px}
 .card h3{font-size:27px}
 .description{font-size:12px}
 .action{font-size:12px}
 .notice{gap:6px}
 .megaphone{font-size:24px}
 .notice-label{font-size:12px;padding:6px 8px}
}
@media(max-height:800px) and (min-width:701px){
 body{padding:12px}
 main{gap:12px}
 .card{height:clamp(460px,56vh,560px)}
 .mascot-frame{height:clamp(165px,22vh,210px)}
 .welcome h2{font-size:42px}
 .welcome p{font-size:24px;margin-top:6px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

 <div class="modal-card"><div style="font-size:30px">🔐</div><h4 id="modalTitle">직원 전용 인증</h4><p>카운터 관리 비밀번호를 입력해주세요.</p>
 <input type="password" id="deskPwInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="비밀번호" onkeydown="if(event.key==='Enter') verifyPassword()">
 <div id="pwError" hidden>❌ 비밀번호가 올바르지 않습니다.</div>
 <div class="modal-actions"><button class="cancel" type="button" onclick="closePasswordModal()">취소</button><button class="confirm" type="button" onclick="verifyPassword()">확인</button></div></div>
</div>
<script>
function openPasswordModal(){const m=document.getElementById('passwordModal'),i=document.getElementById('deskPwInput'),e=document.getElementById('pwError');e.hidden=true;i.value='';m.classList.add('show');setTimeout(()=>i.focus(),60)}
function closePasswordModal(){document.getElementById('passwordModal').classList.remove('show')}
function verifyPassword(){const i=document.getElementById('deskPwInput'),e=document.getElementById('pwError');if(i.value==='52'){window.location.href='counter.html'}else{e.hidden=false;i.value='';i.focus()}}
let switchTimer=null,currentIdx=0,noticeItems=[];
async function fetchKioskNotice(){try{const res=await fetch('/api/notice');if(!res.ok)return;const data=await res.json(),w=document.getElementById('kioskNoticeWrapper');const raw=(data.notice||'').trim();if(!raw){w.style.display='none';if(switchTimer)clearInterval(switchTimer);return}noticeItems=raw.split('\n').map(s=>s.trim()).filter(Boolean);if(!noticeItems.length){w.style.display='none';return}w.style.display='flex';showCurrentNotice();if(switchTimer)clearInterval(switchTimer);if(noticeItems.length>1)switchTimer=setInterval(()=>{currentIdx=(currentIdx+1)%noticeItems.length;showCurrentNotice()},4500)}catch(err){console.error('공지 로드 오류:',err)}}
function showCurrentNotice(){const el=document.getElementById('kioskNoticeText');if(!el||!noticeItems.length)return;el.textContent=noticeItems[currentIdx];el.classList.remove('notice-fade');void el.offsetWidth;el.classList.add('notice-fade')}
fetchKioskNotice();setInterval(fetchKioskNotice,20000);
</script>
</body>
</html>
