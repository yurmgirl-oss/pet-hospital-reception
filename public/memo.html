<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>메모천국 · 메인 작업책상</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Pretendard,'Malgun Gothic',system-ui,sans-serif;background:#17251d;color:#eef5ef;overflow:hidden}button{cursor:pointer;font:inherit}.app{height:100dvh;display:flex;flex-direction:column;min-height:0}.top{background:#102019;border-bottom:1px solid #506a59;padding:7px 9px;display:flex;flex-direction:column;gap:6px;flex:0 0 auto}.brandrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.brand{font-weight:950;font-size:18px;white-space:nowrap}.toolbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #718976;background:#2d4838;color:#f2f6ef;border-radius:8px;padding:7px 10px;font-weight:800;font-size:12px}.btn.gold{background:#e7c25c;color:#27352b;border-color:#f3d982}.btn:hover{filter:brightness(1.08)}.cats{display:flex;gap:5px;overflow:auto;flex:1;min-width:100%;padding:1px 0}.cat{border:1px solid #6a8875;background:#233a2d;color:#e6efe8;border-radius:20px;padding:5px 9px;white-space:nowrap;font-size:11px;font-weight:800}.main{flex:1;min-height:0;display:grid;grid-template-columns:185px minmax(0,1fr);gap:8px;padding:8px}.left{display:flex;flex-direction:column;gap:8px;min-height:0}.capture{border:2px dashed #9d875d;background:#e9d4a5;color:#403522;border-radius:12px;min-height:180px;flex:1;padding:9px;display:flex;flex-direction:column;gap:5px;overflow:hidden}.capture.active{border-color:#24533a;background:#f2e2bc;box-shadow:inset 0 0 0 3px #31564030}.capture h3{margin:0;font-size:13px}.capture .hint{font-size:11px;line-height:1.4;opacity:.8}.capture-content{flex:1;min-height:45px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-word}.capture-content img{max-width:100%;max-height:180px;object-fit:contain;display:block;margin:auto}.capture-actions{display:flex;gap:4px}.capture-actions button{flex:1;font-size:10px;padding:5px}.left-bottom{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}.board-wrap{min-width:0;min-height:0;display:flex;flex-direction:column;background:#a98959;border-radius:13px;padding:7px;box-shadow:inset 0 0 0 3px #987744}.board-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;background:#314b38;border-radius:9px;flex:0 0 auto}.board-head strong{font-size:13px}.board{flex:1;min-height:0;position:relative;overflow:auto;margin-top:7px;border-radius:9px;background-color:#d5bd92;background-image:radial-gradient(#80674440 1px,transparent 1px);background-size:18px 18px;outline:2px dashed #806744;outline-offset:-3px;isolation:isolate}.empty{text-align:center;color:#59452a;padding:30px 18px;line-height:1.65;pointer-events:none}.obj{position:absolute;min-width:220px;max-width:none;min-height:130px;background:#fffdf4;color:#30372e;box-shadow:4px 7px 14px #4c3d2855;border-radius:5px;padding:12px;resize:both;overflow:auto;cursor:move;user-select:none}.obj.note{width:560px;height:auto;min-height:620px;background:#fffdf4;border:1px solid #c9b98b;overflow:auto}.obj.caption{width:280px;height:180px;min-width:180px;min-height:100px;background:#fff8a8;border:1px solid #c6ad44}.obj.imageobj{width:600px;height:auto;min-width:320px;min-height:150px;background:#fff;padding:8px;resize:both;overflow:auto}.obj.imageobj img{display:block;width:100%;height:auto;max-width:none;max-height:none;object-fit:contain;margin:0 auto;cursor:default}.obj .obj-title{font-weight:900;font-size:15px;margin:0 24px 7px 0;outline:none;cursor:text}.obj .obj-body{white-space:pre-wrap;word-break:break-word;line-height:1.6;font-size:15px;outline:none;min-height:80px;cursor:text;user-select:text}.obj.note .obj-body{min-height:420px}.obj.caption .obj-body{min-height:85px;font-size:13px}.obj-close{position:absolute;right:5px;top:5px;border:0;background:#2c3b2e;color:white;border-radius:50%;width:22px;height:22px;z-index:3}.obj-tools{display:flex;gap:4px;margin-top:8px;justify-content:flex-end}.obj-tools button{font-size:10px;border:1px solid #8c7957;background:#e8d49a;color:#3c3425;border-radius:6px;padding:4px 6px}.obj .obj-body:empty:before{content:attr(data-placeholder);color:#8a8a7b}.status{font-size:11px;color:#51432c;display:flex;justify-content:space-between;padding:5px 3px;flex:0 0 auto}.modal{position:fixed;inset:0;background:#07130dbb;z-index:30;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.card{width:min(720px,96vw);background:#f5eedf;color:#29352d;border-radius:14px;padding:17px;display:flex;flex-direction:column;gap:8px}.card textarea,.card input,.card select{width:100%;border:1px solid #c9bda7;border-radius:8px;padding:10px;font:inherit;background:#fffdf7;color:#29352d}.card textarea{min-height:190px;resize:vertical}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#10251a;color:#fff;padding:10px 16px;border-radius:22px;opacity:0;transition:.2s;z-index:90;pointer-events:none}.toast.show{opacity:1}.archive-card{background:#f4e7b3;color:#26342c;border-radius:10px;padding:12px;box-shadow:0 3px 8px #0002}.archive-card h3{margin:0 0 6px}.archive-card p{white-space:pre-wrap;max-height:90px;overflow:auto;font-size:12px}.archive-card .meta{font-size:11px;opacity:.75;margin:5px 0}.archive-card .preview{max-height:150px;overflow:hidden;background:#fff8e8;padding:5px;border-radius:6px}.archive-card img{max-width:100%;max-height:110px;object-fit:contain}.archive-card .actions{display:flex;flex-wrap:wrap;gap:5px}.archive-category{background:#253d31;color:#eaf2eb;border:1px solid #698471;border-radius:18px;padding:7px 10px;font-weight:800}.archive-category.active{background:#e7c25c;color:#27352b}.preview-modal{position:fixed;inset:0;background:#07130de8;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.preview-modal.open{display:flex}.preview-modal img{max-width:96vw;max-height:92vh;object-fit:contain;background:#fff}.preview-close{position:absolute;right:20px;top:20px;font-size:24px;background:#e7c25c;color:#203127;border:0;border-radius:30px;padding:8px 16px;font-weight:900}.preview-text{background:#fffdf4;color:#26342c;width:min(900px,94vw);max-height:90vh;overflow:auto;padding:25px;border-radius:12px}.preview-text pre{white-space:pre-wrap;font:18px/1.7 sans-serif}#drawLayer{position:absolute;left:0;top:0;z-index:40;pointer-events:none}.board.pen-mode #drawLayer{pointer-events:auto;touch-action:none;cursor:crosshair}.board.pen-mode{cursor:crosshair}.board.caption-mode{cursor:copy}
@media(max-width:900px){.main{grid-template-columns:150px minmax(0,1fr)}.obj.note{width:450px;height:500px}.obj.note .obj-body{min-height:300px}}@media(max-width:650px){.main{grid-template-columns:1fr;grid-template-rows:150px minmax(0,1fr);overflow:hidden}.left{display:grid;grid-template-columns:1fr 1fr;min-height:0}.capture{min-height:0}.left-bottom{grid-column:1/-1;flex-direction:row}.board-wrap{min-height:0}.toolbar{max-height:80px;overflow:auto}.obj.note{width:350px;height:430px}.obj.note .obj-body{min-height:250px}}
</style></head><body><div class="app">
<header class="top"><div class="brandrow"><div class="brand">🧠 메모천국 · 메인 작업책상</div><div class="toolbar"><button class="btn gold" id="selectMove">↖ 선택·이동</button><button class="btn" id="addText">✍️ 긴 노트</button><button class="btn" id="quickCaption">📝 위치 주석</button><button class="btn" id="penToggle">✏️ 펜</button><input type="color" id="penColor" value="#d62828" title="펜 색상" style="width:36px;height:32px;border-radius:7px"><button class="btn" id="clearDraw">그림 지우기</button><button class="btn gold" id="boardShot">📸 칠판 이미지 저장</button><button class="btn gold" id="saveProject">📁 분류 저장</button><button class="btn" id="archive">📚 보관소</button><button class="btn" id="addImage">🖼️ 이미지 추가</button><button class="btn" id="pasteBoard">📋 칠판 붙여넣기</button><button class="btn" id="backup">📦 백업</button><button class="btn" id="restore">📥 복원</button><button class="btn" id="clearBoard">🧹 비우기</button></div></div><nav class="cats" id="cats"></nav><input type="file" id="imgFile" accept="image/*" multiple hidden><input type="file" id="restoreFile" accept="application/json" hidden></header>
<div class="main"><aside class="left"><section class="capture active" id="cap1"><h3>📋 붙여넣기 공간 1</h3><div class="hint">클릭해 선택 · 캡처/복사한 이미지나 글을 Ctrl+V</div><div class="capture-content" id="capContent1">클릭 후 Ctrl+V</div><div class="capture-actions"><button class="btn" id="send1">칠판에 놓기</button><button class="btn" id="clear1">비우기</button></div></section><section class="capture" id="cap2"><h3>📋 붙여넣기 공간 2</h3><div class="hint">두 번째 자료를 잠시 모아두는 공간</div><div class="capture-content" id="capContent2">클릭 후 Ctrl+V</div><div class="capture-actions"><button class="btn" id="send2">칠판에 놓기</button><button class="btn" id="clear2">비우기</button></div></section><div class="left-bottom"><button class="btn" id="addCaptureText">＋ 붙여넣을 글 작성</button><button class="btn" id="addCaptureImage">＋ 이미지 선택</button></div></aside>
<main class="board-wrap"><div class="board-head"><strong>🪵 통합 작업 칠판 — 빈 곳 클릭하면 바로 긴 메모</strong><span id="count">0개 항목</span></div><div class="board" id="board"><canvas id="drawLayer"></canvas><div class="empty" id="empty">빈 칠판을 클릭하면 긴 노트가 바로 생깁니다.<br>사진이나 글을 끌어오거나 Ctrl+V로 붙여넣으세요.<br>노트는 길게 작성할 수 있고, 모서리로 크기 조절도 가능합니다.</div></div><div class="status"><span>이 브라우저에 자동 저장</span><span id="saveState">자동 저장 대기</span></div></main></div></div>
<div class="modal" id="saveModal"><div class="card"><b>📁 분류별 자료 저장</b><input id="projectTitle" placeholder="자료 제목 / 케이스명"><select id="projectCategory"></select><textarea id="projectDesc" placeholder="간단한 설명 (선택)"></textarea><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" id="cancelSave">취소</button><button class="btn gold" id="confirmSave">저장</button></div></div></div>
<div class="modal" id="archiveModal"><div class="card" style="width:min(1100px,96vw);max-height:90vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>📚 분류별 자료 보관소</b><button class="btn" id="closeArchive">닫기</button></div><div style="display:flex;gap:6px;flex-wrap:wrap" id="archiveCats"></div><div id="archiveList" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px"></div></div></div>
<div class="preview-modal" id="imagePreview"><button class="preview-close" id="closeImagePreview">닫기</button><img id="previewImage"></div><div class="preview-modal" id="textPreview"><button class="preview-close" id="closeTextPreview">닫기</button><div class="preview-text" id="previewText"></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const KEY='memoHeavenBoardV1',CAPKEY='memoHeavenCapturesV1',ARCHKEY='memoHeavenArchiveV1',CATKEY='memoHeavenCategoriesV1',DRAWKEY='memoHeavenDrawV1';
const DEFAULT_CATS=[['🩺 외과','surgery'],['💊 내과','internal'],['🩻 영상','imaging'],['🦎 특수동물','exotic'],['🦷 치과','dental'],['🚨 응급','emergency'],['💉 마취','anesthesia'],['🔬 검사·병리','lab'],['📚 논문·자료','papers'],['💡 아이디어','ideas']];
let categories=DEFAULT_CATS,archive=[],archiveFilter='all',items=[],captures=[[],[]],activeCapture=0,drag=null,penMode=false,captionPlacement=false,drawings=[],currentPath=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
const board=$('board'),canvas=$('drawLayer'),ctx=canvas.getContext('2d');
function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2300)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(CAPKEY,JSON.stringify(captures));localStorage.setItem(DRAWKEY,JSON.stringify(drawings));$('saveState').textContent='✓ 저장됨';$('count').textContent=items.length+'개 항목';$('empty').style.display=items.length?'none':'block'}catch(e){$('saveState').textContent='저장공간 부족';toast('브라우저 저장공간이 부족합니다. 백업 후 큰 이미지를 줄여주세요')}}
function load(){try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{items=[]}try{captures=JSON.parse(localStorage.getItem(CAPKEY)||'[[],[]]')}catch{captures=[[],[]]}try{archive=JSON.parse(localStorage.getItem(ARCHKEY)||'[]')}catch{archive=[]}try{let c=JSON.parse(localStorage.getItem(CATKEY)||'null');if(Array.isArray(c)&&c.length)categories=c}catch{}try{drawings=JSON.parse(localStorage.getItem(DRAWKEY)||'[]')}catch{drawings=[]}renderCategories();render();renderCaptures();save();resizeCanvas()}
function renderCategories(){let cats=$('cats');cats.innerHTML=categories.map(c=>`<button class="cat" data-cat="${esc(c[1])}">${esc(c[0])}</button>`).join('')+`<button class="cat" id="addCat">＋ 분류 추가</button>`;cats.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{archiveFilter=b.dataset.cat;openArchive()});$('projectCategory').innerHTML=categories.map(c=>`<option value="${esc(c[1])}">${esc(c[0])}</option>`).join('');$('addCat').onclick=()=>{let name=prompt('새 분류 이름');if(!name)return;categories.push([name,'custom_'+Date.now()]);localStorage.setItem(CATKEY,JSON.stringify(categories));renderCategories();toast('분류를 추가했습니다')}}
function render(){board.querySelectorAll('.obj').forEach(e=>e.remove());items.forEach((it,i)=>{let el=document.createElement('article');el.className='obj '+(it.image?'imageobj':it.type==='caption'?'caption':'note');el.dataset.id=it.id;el.style.left=(it.x??30)+'px';el.style.top=(it.y??30)+'px';el.style.width=(it.w||(it.image?600:it.type==='caption'?280:560))+'px';if(!it.image&&it.type==='caption')el.style.height=(it.h||180)+'px';el.style.zIndex=it.z||i+1;
el.innerHTML=`<button class="obj-close" title="삭제">×</button>${it.image?`<img src="${it.data}" alt="이미지 자료">`:`${it.title?`<div class="obj-title" contenteditable="true">${esc(it.title)}</div>`:''}<div class="obj-body" contenteditable="true" data-placeholder="여기를 클릭해서 바로 작성하세요...">${esc(it.text||'')}</div>`}<div class="obj-tools"><button class="zoom">🔎 크게 보기</button><button class="copy">📋 텍스트/이미지 복사</button></div>`;board.appendChild(el);
if(it.image){let img=el.querySelector('img');img.draggable=false;img.addEventListener('dragstart',e=>e.preventDefault());img.onload=()=>{if(!it.h){it.h=img.offsetHeight;it.w=el.offsetWidth;save()}}}
if(!it.image){el.querySelector('.obj-title')?.addEventListener('input',e=>{it.title=e.target.innerText;save()});el.querySelector('.obj-body').addEventListener('input',e=>{it.text=e.target.innerText;autoGrow(e.target);save()});el.querySelector('.obj-body').addEventListener('keydown',e=>{if(e.key==='Escape')e.target.blur()});}
el.querySelector('.obj-close').onclick=()=>{items=items.filter(x=>x.id!==it.id);render();save()};el.querySelector('.zoom').onclick=()=>{if(it.image){$('previewImage').src=it.data;$('imagePreview').classList.add('open')}else{$('previewText').innerHTML=(it.title?'<h2>'+esc(it.title)+'</h2>':'')+'<pre>'+esc(it.text||'')+'</pre>';$('textPreview').classList.add('open')}};
el.querySelector('.copy').onclick=async()=>{try{if(it.image&&it.data.startsWith('data:')){let res=await fetch(it.data),blob=await res.blob();await navigator.clipboard.write([new ClipboardItem({[blob.type]:blob})]);toast('이미지를 복사했습니다')}else await navigator.clipboard.writeText((it.title||'')+'\n\n'+(it.text||''));toast('복사했습니다')}catch{toast('복사 권한이 없거나 지원되지 않습니다')}};
el.addEventListener('pointerdown',e=>{if(e.target.closest('[contenteditable]')||e.target.closest('button')||e.target.tagName==='IMG'||e.target.closest('.resize-handle'))return;drag={id:it.id,dx:e.clientX-el.getBoundingClientRect().left,dy:e.clientY-el.getBoundingClientRect().top};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!drag||drag.id!==it.id)return;let r=board.getBoundingClientRect();it.x=Math.max(0,e.clientX-drag.dx-r.left+board.scrollLeft);it.y=Math.max(0,e.clientY-drag.dy-r.top+board.scrollTop);el.style.left=it.x+'px';el.style.top=it.y+'px'});el.addEventListener('pointerup',()=>{if(drag?.id===it.id){drag=null;save()}});
let ro=new ResizeObserver(()=>{it.w=el.offsetWidth;if(!it.image)it.h=el.offsetHeight;else{let img=el.querySelector('img');if(img?.naturalWidth){let targetH=img.offsetHeight+16;it.h=targetH}}save();resizeCanvas()});ro.observe(el);
});save();resizeCanvas()}
function autoGrow(el){el.style.height='auto';el.style.height=Math.max(el.scrollHeight,el.parentElement.classList.contains('note')?420:85)+'px';let card=el.closest('.obj');if(card.classList.contains('note'))card.style.height='auto';let it=items.find(x=>x.id===card.dataset.id);if(it)it.h=null}
function addText(text='',x=null,y=null,type='note'){let w=type==='caption'?280:560,h=type==='caption'?180:620;let it={id:uid(),title:'',text,x:x??board.scrollLeft+35,y:y??board.scrollTop+35,w,h,type,z:items.length+1};items.push(it);render();let el=board.querySelector(`[data-id="${it.id}"] .obj-body`);el?.focus();toast(type==='caption'?'주석창에 바로 입력하세요':'긴 노트에 바로 입력하세요')}
function addImage(data,name='이미지',x=null,y=null){items.push({id:uid(),image:true,type:'image',data,name,x:x??board.scrollLeft+40,y:y??board.scrollTop+40,w:600,h:null,z:items.length+1});render()}
function renderCaptures(){captures.forEach((arr,i)=>{$('capContent'+(i+1)).innerHTML=arr.map(c=>c.image?`<img src="${c.data}">`:`<div>${esc(c.text)}</div>`).join('<hr>')||'클릭 후 Ctrl+V';$('cap'+(i+1)).classList.toggle('active',i===activeCapture)})}
function readData(f){return new Promise(ok=>{let r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)})}
async function pasteHandler(e){let dt=e.clipboardData;if(!dt)return;let direct=e.target===board||e.target.closest?.('#board');let added=false;for(let ci of [...dt.items])if(ci.type.startsWith('image/')){let f=ci.getAsFile();if(f){let data=await readData(f);if(direct)addImage(data,'붙여넣은 이미지');else captures[activeCapture].push({image:true,data,name:f.name||'캡처'});added=true}}let text=dt.getData('text/plain');if(text.trim()){if(direct)addText(text,board.scrollLeft+35,board.scrollTop+35);else captures[activeCapture].push({image:false,text});added=true}if(added){e.preventDefault();renderCaptures();save();toast(direct?'칠판에 붙였습니다':'붙여넣기 공간에 모았습니다')}}
document.addEventListener('paste',pasteHandler);$('cap1').onclick=()=>{activeCapture=0;renderCaptures();toast('공간 1 선택 · 이제 Ctrl+V')};$('cap2').onclick=()=>{activeCapture=1;renderCaptures();toast('공간 2 선택 · 이제 Ctrl+V')};
function sendCapture(i){if(!captures[i].length){toast('먼저 자료를 붙여넣으세요');return}let arr=[...captures[i]];captures[i]=[];arr.forEach(c=>c.image?addImage(c.data,c.name):addText(c.text));renderCaptures();save();toast('칠판에 옮겼습니다')}
$('send1').onclick=()=>sendCapture(0);$('send2').onclick=()=>sendCapture(1);$('clear1').onclick=()=>{captures[0]=[];renderCaptures();save()};$('clear2').onclick=()=>{captures[1]=[];renderCaptures();save()};$('addCaptureText').onclick=()=>{let t=prompt('붙여넣기 공간 1에 모을 글');if(t!==null){captures[0].push({image:false,text:t});renderCaptures();save()}};$('addCaptureImage').onclick=()=>$('imgFile').click();
$('addText').onclick=()=>addText('',board.scrollLeft+35,board.scrollTop+35,'note');$('quickCaption').onclick=()=>{captionPlacement=true;board.classList.add('caption-mode');toast('칠판에서 주석을 놓을 위치를 한 번 클릭하세요')};$('addImage').onclick=()=>$('imgFile').click();$('imgFile').onchange=async e=>{for(let f of e.target.files)if(f.type.startsWith('image/'))addImage(await readData(f),f.name);e.target.value=''};$('pasteBoard').onclick=()=>{board.focus();toast('칠판을 클릭한 뒤 Ctrl+V')};
board.addEventListener('click',e=>{if(e.target.closest('.obj')||e.target.closest('button')||penMode)return;let r=board.getBoundingClientRect(),x=e.clientX-r.left+board.scrollLeft,y=e.clientY-r.top+board.scrollTop;if(captionPlacement){captionPlacement=false;board.classList.remove('caption-mode');addText('',x,y,'caption');return}/* 기본 선택·이동 모드: 빈 칠판 클릭은 아무것도 만들지 않음 */});
$('selectMove').onclick=()=>{penMode=false;captionPlacement=false;board.classList.remove('pen-mode','caption-mode');$('penToggle').classList.remove('gold');toast('선택·이동 모드: 빈 칠판을 눌러도 새 메모가 생성되지 않습니다')};
window.addEventListener('dragover',e=>e.preventDefault(),true);window.addEventListener('drop',e=>e.preventDefault(),true);board.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'});board.addEventListener('drop',async e=>{e.preventDefault();e.stopPropagation();let r=board.getBoundingClientRect(),x=e.clientX-r.left+board.scrollLeft,y=e.clientY-r.top+board.scrollTop,dt=e.dataTransfer,fs=[...dt.files].filter(f=>f.type.startsWith('image/'));for(let [i,f] of fs.entries())addImage(await readData(f),f.name,x+i*24,y+i*24);if(!fs.length){let html=dt.getData('text/html'),url=(dt.getData('text/uri-list')||dt.getData('text/plain')).split('\n').find(s=>s.trim()&&!s.startsWith('#'))||'',src='';if(html){let m=html.match(/<img[^>]+src=["']([^"']+)["']/i);if(m)src=m[1]}if(src||/^https?:\/\//i.test(url)&&/\.(png|jpe?g|gif|webp|bmp)(\?|#|$)/i.test(url)){addImage(src||url,'웹 이미지',x,y)}else if(dt.getData('text/plain'))addText(dt.getData('text/plain'),x,y,'note')}toast('칠판에 자료를 놓았습니다')});document.addEventListener('dragstart',e=>{if(e.target.closest('#board')||e.target.tagName==='IMG')e.preventDefault()},true);
$('clearBoard').onclick=()=>{if(confirm('칠판의 자료를 모두 지울까요?')){items=[];drawings=[];render();save()}};
function resizeCanvas(){let w=Math.max(board.clientWidth,board.scrollWidth),h=Math.max(board.clientHeight,board.scrollHeight);canvas.width=w;canvas.height=h;redraw()}
function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);drawings.forEach(p=>{if(!p.points?.length)return;ctx.strokeStyle=p.color;ctx.lineWidth=p.width||4;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();p.points.forEach((pt,i)=>i?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y));ctx.stroke()})}
$('penToggle').onclick=()=>{penMode=!penMode;board.classList.toggle('pen-mode',penMode);$('penToggle').classList.toggle('gold',penMode);toast(penMode?'펜 켜짐: 칠판 위에 드래그':'펜 꺼짐')};canvas.addEventListener('pointerdown',e=>{if(!penMode)return;let r=board.getBoundingClientRect();currentPath={color:$('penColor').value,width:4,points:[{x:e.clientX-r.left+board.scrollLeft,y:e.clientY-r.top+board.scrollTop}]};drawings.push(currentPath);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!currentPath)return;let r=board.getBoundingClientRect();currentPath.points.push({x:e.clientX-r.left+board.scrollLeft,y:e.clientY-r.top+board.scrollTop});redraw()});canvas.addEventListener('pointerup',()=>{currentPath=null;save()});canvas.addEventListener('pointercancel',()=>{currentPath=null;save()});$('clearDraw').onclick=()=>{if(confirm('펜 표시를 모두 지울까요?')){drawings=[];redraw();save()}};board.addEventListener('scroll',()=>{if(penMode)redraw()});window.addEventListener('resize',resizeCanvas);
function saveProject(){if(!items.length&&!captures.some(a=>a.length)&&!drawings.length){toast('저장할 자료가 없습니다');return}$('projectTitle').value='';$('projectDesc').value='';$('saveModal').classList.add('open')};function confirmSaveProject(){let title=$('projectTitle').value.trim();if(!title){alert('자료 제목을 입력하세요');return}archive.push({id:uid(),title,category:$('projectCategory').value,description:$('projectDesc').value,items:structuredClone(items),captures:structuredClone(captures),drawings:structuredClone(drawings),updated:Date.now()});localStorage.setItem(ARCHKEY,JSON.stringify(archive));$('saveModal').classList.remove('open');toast('분류 보관소에 저장했습니다')}
$('saveProject').onclick=saveProject;$('confirmSave').onclick=confirmSaveProject;$('cancelSave').onclick=()=>$('saveModal').classList.remove('open');$('archive').onclick=()=>{archiveFilter='all';openArchive()};$('closeArchive').onclick=()=>$('archiveModal').classList.remove('open');
function openArchive(){$('archiveModal').classList.add('open');renderArchive()}function renderArchive(){let c=$('archiveCats');c.innerHTML=`<button class="archive-category ${archiveFilter==='all'?'active':''}" data-filter="all">전체</button>`+categories.map(x=>`<button class="archive-category ${archiveFilter===x[1]?'active':''}" data-filter="${esc(x[1])}">${esc(x[0])}</button>`).join('');c.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{archiveFilter=b.dataset.filter;renderArchive()});let arr=archive.filter(a=>archiveFilter==='all'||a.category===archiveFilter).sort((a,b)=>b.updated-a.updated);$('archiveList').innerHTML=arr.length?arr.map(a=>`<article class="archive-card"><h3>${esc(a.title)}</h3><div class="meta">${esc(categories.find(c=>c[1]===a.category)?.[0]||a.category)} · ${new Date(a.updated).toLocaleString()}</div><p>${esc(a.description||'')}</p><div class="preview">${(a.items||[]).slice(0,3).map(it=>it.image?`<img src="${it.data}">`:`<b>${esc(it.title||'메모')}</b><div>${esc((it.text||'').slice(0,150))}</div>`).join('<hr>')}<small>${a.items?.length||0}개 항목</small></div><div class="actions"><button class="btn gold" data-open="${a.id}">작업책상으로 열기</button><button class="btn" data-del="${a.id}">삭제</button></div></article>`).join(''):'<div style="padding:20px;color:#333">저장된 자료가 없습니다.</div>';$('archiveList').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{let a=archive.find(x=>x.id===b.dataset.open);if(!a)return;items=structuredClone(a.items||[]);captures=structuredClone(a.captures||[[],[]]);drawings=structuredClone(a.drawings||[]);save();render();renderCaptures();$('archiveModal').classList.remove('open');toast('자료를 작업책상으로 불러왔습니다')});$('archiveList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('자료를 삭제할까요?')){archive=archive.filter(x=>x.id!==b.dataset.del);localStorage.setItem(ARCHKEY,JSON.stringify(archive));renderArchive()}})}
function exportBoardImage(){let W=Math.max(board.clientWidth,board.scrollWidth),H=Math.max(board.clientHeight,board.scrollHeight),c=document.createElement('canvas');c.width=W;c.height=H;let x=c.getContext('2d');x.fillStyle='#d5bd92';x.fillRect(0,0,W,H);let pending=[];for(let it of items){let el=board.querySelector(`[data-id="${it.id}"]`);if(!el)continue;let left=it.x||0,top=it.y||0,w=el.offsetWidth,h=el.offsetHeight;x.fillStyle=it.image?'#fff':it.type==='caption'?'#fff8a8':'#fffdf4';x.fillRect(left,top,w,h);x.strokeStyle='#8c7957';x.strokeRect(left,top,w,h);if(it.image){let im=new Image();im.src=it.data;pending.push(new Promise(ok=>{im.onload=()=>{try{x.drawImage(im,left+6,top+6,w-12,h-12)}catch{}ok()};im.onerror=ok}))}else{x.fillStyle='#29352d';x.font='15px Malgun Gothic,sans-serif';let txt=(it.title?it.title+'\n':'')+(it.text||''),lines=[];for(let para of txt.split('\n')){let line='';for(let ch of para){if(x.measureText(line+ch).width>w-24){lines.push(line);line=ch}else line+=ch}lines.push(line)}lines.slice(0,Math.floor((h-24)/22)).forEach((line,i)=>x.fillText(line,left+12,top+24+i*22))}}drawings.forEach(p=>{x.strokeStyle=p.color;x.lineWidth=p.width||4;x.lineCap='round';x.beginPath();p.points.forEach((pt,i)=>i?x.lineTo(pt.x,pt.y):x.moveTo(pt.x,pt.y));x.stroke()});Promise.all(pending).then(()=>{try{let a=document.createElement('a');a.download='메모천국_칠판_'+new Date().toISOString().slice(0,10)+'.png';a.href=c.toDataURL('image/png');a.click();toast('칠판 이미지를 저장했습니다')}catch{toast('외부 웹 이미지가 포함되어 이미지 저장이 제한될 수 있습니다')}})}$('boardShot').onclick=exportBoardImage;
$('backup').onclick=()=>{let data={app:'MemoHeaven',version:3,items,captures,archive,categories,drawings};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='메모천국_백업_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)};$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.items))throw Error('백업 형식이 아닙니다');if(confirm('백업 내용으로 복원할까요?')){items=d.items;captures=d.captures||[[],[]];archive=d.archive||archive;categories=d.categories||categories;drawings=d.drawings||[];localStorage.setItem(ARCHKEY,JSON.stringify(archive));localStorage.setItem(CATKEY,JSON.stringify(categories));renderCategories();render();renderCaptures();toast('복원했습니다')}}catch(err){alert('복원 실패: '+err.message)}e.target.value=''};
$('closeImagePreview').onclick=()=>$('imagePreview').classList.remove('open');$('closeTextPreview').onclick=()=>$('textPreview').classList.remove('open');document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('imagePreview').classList.remove('open');$('textPreview').classList.remove('open');$('archiveModal').classList.remove('open');$('saveModal').classList.remove('open');if(captionPlacement){captionPlacement=false;board.classList.remove('caption-mode')}}});
load();
</script></body></html>
