<script>
const CATS=[['🩺 외과','surgery'],['💊 내과','internal'],['🩻 영상','imaging'],['🦎 특수동물','exotic'],['🦷 치과','dental'],['🚨 응급','emergency'],['💉 마취','anesthesia'],['🔬 검사·병리','lab'],['📚 논문·자료','papers'],['💡 아이디어','ideas']];const COLORS=['#f4e7b3','#d4e8c6','#f4d0b8','#d4dff0','#e6cde8','#c6e5e2','#f2c8c9','#f5dba6'];const DB='memoHeavenDB2';let db,notes=[],pendingSendSlots=[0,1,2,3],cat='inbox',page=1,search='',slots=Array.from({length:4},()=>[]),specialFrames=Array.from({length:3},()=>[]),activeSlot=0,draft=null,editing=null,priority=1,photos=[],saveTimer;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function uid(){return 'memo_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('notes',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function all(){return new Promise((ok,no)=>{let r=db.transaction('notes').objectStore('notes').getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)})}function put(n){return new Promise((ok,no)=>{let t=db.transaction('notes','readwrite');t.objectStore('notes').put(n);t.oncomplete=ok;t.onerror=()=>no(t.error)})}function del(id){return new Promise(ok=>{let t=db.transaction('notes','readwrite');t.objectStore('notes').delete(id);t.oncomplete=ok})}
function initCats(){ $('cats').innerHTML='<button class="cat active" data-cat="inbox">🪵 작업 책상</button><button class="cat" data-cat="all">🌈 전체 칠판</button>'+CATS.map(c=>`<button class="cat" data-cat="${c[1]}">${c[0]}</button>`).join('');['category','qCategory'].forEach(id=>$(id).innerHTML=CATS.map(c=>`<option value="${c[1]}">${c[0]}</option>`).join(''));$('cats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;page=1;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x===b));if(cat==='inbox')showWork();else showBoard()})}
function showWork(){$('workView').classList.add('active');$('boardView').classList.remove('active')}function showBoard(){$('workView').classList.remove('active');$('boardView').classList.add('active');renderBoard()}
function renderBoard(){let arr=notes.filter(n=>(cat==='all'||n.category===cat)&&(!search||(`${n.title} ${n.summary} ${n.body} ${(n.tags||[]).join(' ')}`).toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>(b.updated||b.date||'').localeCompare(a.updated||a.date||''));const per=25,max=Math.max(1,Math.ceil(arr.length/per));if(page>max)page=max;let shown=arr.slice((page-1)*per,page*per);$('boardTitle').textContent=(cat==='all'?'🌈 전체 칠판':CATS.find(c=>c[1]===cat)?.[0]||'📚 칠판')+` · ${arr.length}개`;$('notes').innerHTML=shown.length?shown.map((n,i)=>`<article class="note" data-id="${n.id}" style="--p:${n.color||COLORS[(i+(page-1)*per)%COLORS.length]}"><h4>${esc(n.title||'제목 없음')} ${n.priority===3?'🌟':n.priority===2?'⭐':''}</h4><p>${esc(bodyPlain(n.body)||n.summary||'')}</p><div class="meta"><span>${esc(n.date||'')}</span><span>${n.photos?.length?'🖼️':''} ${(n.tags||[]).length?'🏷️':''}</span></div><button class="note-edit" data-edit-note="${n.id}">✏️ 수정</button></article>`).join(''):`<div class="empty">아직 메모가 없습니다.<br>작업 책상에 자료를 모은 뒤 분류해보세요.</div>`;$('notes').querySelectorAll('[data-edit-note]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();openEdit(e.dataset.editNote)});$('pageinfo').textContent=`${page} / ${max}`;$('prev').disabled=page<=1;$('next').disabled=page>=max}
function showCaptures(){let grid=$('slotsGrid');grid.innerHTML=slots.map((items,i)=>{if(i===3){let count=specialFrames.reduce((a,f)=>a+f.length,0);return `<div class="slot ${i===activeSlot?'active':''} ${count?'filled':''}" data-slot="3"><div class="slot-title"><span>🧩 특수공간 4</span><span>${count?`자료 ${count}개`:'3단 프레임'}</span></div><div class="special4"><div class="special-frames">${specialFrames.map((frame,fi)=>`<div class="special-frame ${fi===0?'frame-tall':fi===1?'frame-square-top':'frame-square-bottom'}" data-frame="${fi}"><div class="special-frame-label">${fi+1}단 · 드래그해서 자료 배치</div>${frame.map((c,ci)=>`<div class="special-item" draggable="true" data-frame-item="${fi}" data-item="${ci}">${c.image?`<img src="${c.data}">`:`${esc(c.text||'')}`}</div>`).join('')||'<span style="opacity:.55;font-size:10px">자료 공간 1~3의 항목을 이곳으로 드래그</span>'}</div>`).join('')}</div><div class="special-actions"><button class="btn" data-pick="3">파일</button><button class="btn slot-send" data-send="3">보내기</button><button class="btn" data-zoom="4">확대하기</button><button class="btn" data-image="4">이미지 저장</button><button class="btn" data-clear="3">비우기</button></div></div></div>`}return `<div class="slot ${i===activeSlot?'active':''} ${items.length?'filled':''}" data-slot="${i}"><div class="slot-title"><span>📎 자료 공간 ${i+1}</span><span>${items.length?'자료 '+items.length+'개':'비어 있음'}</span></div><div class="slot-content">${items.map((c,ci)=>`<div class="special-item" draggable="true" data-source-slot="${i}" data-item="${ci}">${c.image?`<img src="${c.data}" alt="붙여넣은 이미지">`:`<div>${esc((c.text||'').slice(0,1800))}</div>`}</div>`).join('<hr>')||'<span style="opacity:.65">여기에 클릭 후 붙여넣기 / 파일 드롭</span>'}</div><div class="slot-actions"><button class="btn" data-pick="${i}">파일</button><button class="btn slot-send" data-send="${i}">보내기</button><button class="btn" data-clear="${i}">비우기</button></div></div>`}).join('');
 grid.querySelectorAll('.slot').forEach(el=>{let i=+el.dataset.slot;el.onclick=e=>{if(e.target.closest('button')||e.target.closest('.special-item')||e.target.closest('.special-frame'))return;activeSlot=i;showCaptures()};el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag')});el.addEventListener('dragleave',()=>el.classList.remove('drag'));el.addEventListener('drop',async e=>{e.preventDefault();el.classList.remove('drag');activeSlot=i;let payload=e.dataTransfer.getData('application/x-memo-item');if(i===3&&payload){let d=JSON.parse(payload);specialFrames[0].push(slots[d.slot][d.item]);showCaptures();return}await addFiles([...e.dataTransfer.files],i);let txt=e.dataTransfer.getData('text/plain');if(txt){if(i===3)specialFrames[0].push({image:false,text:txt});else slots[i].push({image:false,text:txt})}showCaptures()})});
 grid.querySelectorAll('[data-source-slot]').forEach(el=>el.addEventListener('dragstart',e=>{e.dataTransfer.setData('application/x-memo-item',JSON.stringify({slot:+el.dataset.sourceSlot,item:+el.dataset.item}));e.dataTransfer.effectAllowed='copy'}));
 grid.querySelectorAll('.special-frame').forEach(el=>{let fi=+el.dataset.frame;el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag')});el.addEventListener('dragleave',()=>el.classList.remove('drag'));el.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();el.classList.remove('drag');let payload=e.dataTransfer.getData('application/x-memo-item');if(payload){let d=JSON.parse(payload);specialFrames[fi].push(slots[d.slot][d.item]);showCaptures()}else if(e.dataTransfer.files.length){addFiles([...e.dataTransfer.files],3).then(()=>{let newly=slots[3].splice(0);specialFrames[fi].push(...newly);showCaptures()})}else{let txt=e.dataTransfer.getData('text/plain');if(txt){specialFrames[fi].push({image:false,text:txt});showCaptures()}}})});
 grid.querySelectorAll('[data-pick]').forEach(b=>b.onclick=e=>{e.stopPropagation();activeSlot=+b.dataset.pick;$('files').dataset.slot=activeSlot;$('files').click()});grid.querySelectorAll('[data-clear]').forEach(b=>b.onclick=e=>{e.stopPropagation();let i=+b.dataset.clear;if(i===3)specialFrames=Array.from({length:3},()=>[]);else slots[i]=[];showCaptures()});grid.querySelectorAll('[data-send]').forEach(b=>b.onclick=e=>{e.stopPropagation();openQuick([+b.dataset.send])});grid.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=e=>{e.stopPropagation();showSpecialZoom()});grid.querySelectorAll('[data-image]').forEach(b=>b.onclick=e=>{e.stopPropagation();saveSpecialImage()});$('deskCount').textContent=`분할자료 ${slots.slice(0,3).filter(s=>s.length).length}/3 · 특수공간 ${specialFrames.reduce((a,f)=>a+f.length,0)}개 · 총 ${slots.slice(0,3).reduce((a,s)=>a+s.length,0)+specialFrames.reduce((a,f)=>a+f.length,0)}개`;
}
function frameHtml(frame){return frame.map(c=>c.image?`<div class="zoom-frame"><img src="${c.data}" alt="자료 이미지"></div>`:`<div class="zoom-frame"><pre style="white-space:pre-wrap;margin:0">${esc(c.text||'')}</pre></div>`).join('')}
function showSpecialZoom(){let content=$('specialZoomContent');content.innerHTML=specialFrames.map((f,i)=>`<div class="zoom-frame ${i===0?'frame-tall':i===1?'frame-square-top':'frame-square-bottom'}"><b>${i===0?'긴 세로공간':i===1?'정사각형 공간 · 위':'정사각형 공간 · 아래'}</b><div>${f.map(c=>c.image?`<img src="${c.data}" style="max-width:100%;max-height:100%">`:`<pre style="white-space:pre-wrap">${esc(c.text||'')}</pre>`).join('')||'<span style="opacity:.6">비어 있음</span>'}</div></div>`).join('');$('specialZoom').classList.add('open')}
async function saveSpecialImage(){const canvas=document.createElement('canvas');canvas.width=1600;canvas.height=1200;const ctx=canvas.getContext('2d');ctx.fillStyle='#f4e7b3';ctx.fillRect(0,0,canvas.width,canvas.height);const boxes=[{x:24,y:24,w:760,h:1152,label:'긴 세로 프레임'},{x:800,y:24,w:776,h:564,label:'작은 프레임 · 위'},{x:800,y:612,w:776,h:564,label:'작은 프레임 · 아래'}];for(let i=0;i<3;i++){const b=boxes[i];ctx.fillStyle='#fff3d2';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle='#987c4d';ctx.lineWidth=3;ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#6d5534';ctx.font='bold 26px sans-serif';ctx.fillText(b.label,b.x+18,b.y+38);let x=b.x+18,y=b.y+65,maxW=b.w-36,maxH=b.h-90;for(const c of specialFrames[i]){if(c.image){const im=new Image();await new Promise(resolve=>{im.onload=resolve;im.onerror=resolve;im.src=c.data});if(im.complete&&im.naturalWidth){const scale=Math.min(maxW/im.naturalWidth,maxH/im.naturalHeight,1);const iw=im.naturalWidth*scale,ih=im.naturalHeight*scale;ctx.drawImage(im,x,y,iw,ih);y+=ih+12}}else{ctx.fillStyle='#3d3527';ctx.font='18px sans-serif';const lines=(c.text||'').split(/\n/);for(const line of lines){let text=line.slice(0,140);ctx.fillText(text,x,y,maxW);y+=25;if(y>b.y+b.h-20)break}y+=8}}}canvas.toBlob(blob=>{if(!blob){toast('이미지 저장 실패');return}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='메모천국_특수공간4_'+today()+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('특수공간 이미지 저장')},'image/png')}
function flattenedCaptures(){return [...slots.slice(0,3).flat(),...specialFrames.flat()]}
function openQuick(slotIndices=null){pendingSendSlots=slotIndices===null?[0,1,2,3]:slotIndices;let captures=(slotIndices===null?flattenedCaptures():slotIndices.flatMap(i=>i===3?specialFrames.flat():slots[i]));if(!captures.length){toast('먼저 분할공간에 자료를 붙여넣거나 드롭하세요');return}draft={id:uid(),title:'',summary:'',body:captures.filter(c=>!c.image).map(c=>c.text).join('\n\n'),category:'surgery',date:today(),priority:1,tags:[],photos:captures.filter(c=>c.image).map(c=>({name:c.name,data:c.data})),color:null,rotation:null};$('quickPreview').innerHTML=captures.map(c=>c.image?`<img src="${c.data}" style="max-width:100%;max-height:120px;display:block;margin:5px auto">`:`<div>${esc(c.text.slice(0,2000))}</div>`).join('<hr>');$('qTitle').value='';$('qCategory').value='surgery';$('qPriority').value='1';$('quick').classList.add('open')}
function bodyPlain(html){return String(html||'').replace(/<br\s*\/?\s*>/gi,'\n').replace(/<\/div>|<\/p>/gi,'\n').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim()}function suggestTitle(t){let lines=(t||'').split(/\n/).map(x=>x.trim()).filter(x=>x.length>4&&!/^https?:/.test(x));return (lines[0]||'').slice(0,55)}async function saveQuick(){if(!draft)return;draft.title=$('qTitle').value.trim()||'스크랩 메모';draft.category=$('qCategory').value;draft.date=today();draft.priority=+$('qPriority').value;draft.tags=[];draft.updated=new Date().toISOString();await put(draft);notes=await all();pendingSendSlots.forEach(i=>{if(i===3)specialFrames=Array.from({length:3},()=>[]);else slots[i]=[]});showCaptures();$('quick').classList.remove('open');cat=draft.category;page=1;document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));showBoard();toast('칠판에 저장했습니다');draft=null}
function openEdit(id){editing=id;let n=notes.find(n=>n.id===id);if(!n)return;photos=[...(n.photos||[])];priority=n.priority||1;$('title').value=n.title||'';$('category').value=n.category;$('date').value=today();$('body').innerHTML=(n.body&&n.body.includes('<'))?n.body:esc(n.body||'').replace(/\n/g,'<br>');$('sheetLabel').textContent='메모 수정 · '+(CATS.find(c=>c[1]===n.category)?.[0]||'');document.querySelectorAll('[data-pr]').forEach(b=>b.classList.toggle('sel',+b.dataset.pr===priority));renderPhotos();$('overlay').classList.add('open');$('sheet').classList.add('open')}
function renderPhotos(){$('photoList').innerHTML=photos.map(p=>`<img src="${p.data}" title="${esc(p.name||'첨부')}">`).join('')}
function current(){let old=notes.find(n=>n.id===editing)||{};let html=$('body').innerHTML;return {...old,id:editing,title:$('title').value,category:$('category').value,date:today(),priority,tags:[],summary:bodyPlain(html).slice(0,180),body:html,photos,color:old.color||null,rotation:old.rotation,updated:new Date().toISOString()}}
async function saveEdit(){if(!editing)return;let n=current();n.date=today();await put(n);notes=await all();renderBoard();$('saveStatus').textContent='✓ 자동 저장됨';closeSheet()}
function closeSheet(){$('overlay').classList.remove('open');$('sheet').classList.remove('open');editing=null}
async function addFiles(files,slotIndex=activeSlot){let target=slotIndex===3?specialFrames[0]:slots[slotIndex];for(const f of files){if(f.type.startsWith('image/')){let data=await readData(f);target.push({image:true,name:f.name,data})}else{let txt='';try{txt=await f.text()}catch{}target.push({image:false,text:txt||`파일: ${f.name}`})}}showCaptures()}

function setupCapture(){document.addEventListener('paste',async e=>{let items=[...(e.clipboardData?.items||[])],imgs=[];for(let it of items)if(it.type.startsWith('image/')){let f=it.getAsFile();if(f)imgs.push({image:true,name:f.name||'clipboard.png',data:await readData(f)})}let text=e.clipboardData?.getData('text/plain')||'';if(imgs.length||text.trim()){e.preventDefault();if(activeSlot===3){specialFrames[0].push(...imgs);if(text.trim())specialFrames[0].push({image:false,text})}else{let target=slots[activeSlot];target.push(...imgs);if(text.trim())target.push({image:false,text})}showCaptures();toast(`자료를 ${activeSlot+1}번 공간에 붙였습니다`)}});let z=$('dropzone');z.addEventListener('dragover',e=>e.preventDefault());$('files').onchange=e=>addFiles(e.target.files,+$('files').dataset.slot||activeSlot)}

async function saveDeskImage(){
 const desk=$('desk');const clone=desk.cloneNode(true);clone.style.width=desk.offsetWidth+'px';clone.style.height=desk.offsetHeight+'px';clone.style.position='static';clone.style.overflow='visible';clone.querySelectorAll('button').forEach(b=>b.style.display='');

 const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=desk.offsetWidth*2;canvas.height=desk.offsetHeight*2;const ctx=canvas.getContext('2d');ctx.scale(2,2);ctx.drawImage(img,0,0,desk.offsetWidth,desk.offsetHeight);canvas.toBlob(b=>{if(!b){toast('이미지 변환 실패');URL.revokeObjectURL(url);return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='메모천국_작업책상_'+today()+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);URL.revokeObjectURL(url);toast('전체 작업책상 이미지 저장 완료')},'image/png')};img.onerror=()=>{URL.revokeObjectURL(url);toast('이미지 저장에 실패했습니다. 브라우저 보안 제한일 수 있습니다')};img.src=url;
}

async function restore(file){try{let d=JSON.parse(await file.text());if(!Array.isArray(d.notes))throw Error('백업 형식 오류');if(!confirm(`${d.notes.length}개 메모를 복원할까요? 같은 ID는 덮어씁니다.`))return;for(let n of d.notes)await put(n);notes=await all();renderBoard();toast('복원 완료')}catch(e){alert('복원 실패: '+e.message)}}function toast(m){let t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}

iles)if(f.type.startsWith('image/'))photos.push({name:f.name,data:await readData(f)});renderPhotos()};$('highlightBtn').onclick=()=>{let sel=window.getSelection();if(!sel||!sel.rangeCount||!$('body').contains(sel.anchorNode)){toast('형광펜을 적용할 글자를 먼저 선택하세요');return}let range=sel.getRangeAt(0);let mark=document.createElement('mark');try{range.surroundContents(mark)}catch(err){let content=range.extractContents();mark.appendChild(content);range.insertNode(mark)}sel.removeAllRanges()};$('clearHighlight').onclick=()=>{$('body').querySelectorAll('mark').forEach(m=>{m.replaceWith(...m.childNodes)});$('saveStatus').textContent='형광펜 제거됨 · 저장 버튼을 누르세요'};['title','category','date','body'].forEach(id=>$(id).addEventListener('input',()=>{$('saveStatus').textContent='변경됨 · 저장 버튼을 누르세요'}));document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='n'){e.preventDefault();openQuick()}if(e.key==='Escape'){closeSheet();$('quick').classList.remove('open')}});
