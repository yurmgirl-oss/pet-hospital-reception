<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>23시 동물병원 - 데스크 접수 현황판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML을 이미지로 변환해주는 초경량 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body { font-family: 'Pretendard', sans-serif; }
    /* 이미지 다운로드용 숨김 서식 컨테이너 */
    #print-sheet {
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 700px;
      background: #ffffff;
      padding: 36px;
      color: #1f2937;
      box-sizing: border-box;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- 헤더 -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-5 rounded-2xl shadow-sm border border-slate-200 gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span>
          <h1 class="text-2xl font-bold text-slate-900 tracking-tight">원내 접수 현황판</h1>
        </div>
        <p class="text-sm text-slate-500 mt-1">보호자가 접수한 내역이 실시간으로 반영됩니다.</p>
      </div>
      
      <!-- 컨트롤 바 -->
      <div class="flex items-center gap-3">
        <button id="soundToggleBtn" onclick="toggleSound()" class="px-3.5 py-2 rounded-xl border text-sm font-medium transition flex items-center gap-1.5 bg-slate-100 text-slate-600 border-slate-300">
          <span id="soundIcon">🔇</span> <span id="soundText">알림음 켜기</span>
        </button>
        <button onclick="fetchReceptions(true)" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm font-semibold hover:bg-slate-800 transition">
          새로고침
        </button>
      </div>
    </header>

    <!-- 현황 요약 카드 -->
    <div class="grid grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
        <p class="text-xs font-semibold text-slate-400">접수 대기</p>
        <p id="count-waiting" class="text-2xl font-bold text-amber-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
        <p class="text-xs font-semibold text-slate-400">진료 중</p>
        <p id="count-progress" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
        <p class="text-xs font-semibold text-slate-400">오늘 완료</p>
        <p id="count-done" class="text-2xl font-bold text-slate-500 mt-1">0</p>
      </div>
    </div>

    <!-- 접수 목록 -->
    <div id="list-container" class="space-y-3">
      <div class="text-center py-12 text-slate-400 text-sm">접수 내역을 불러오는 중입니다...</div>
    </div>
  </div>

  <!-- 이미지 다운로드용 A4 서식 템플릿 (화면 밖 렌더링) -->
  <div id="print-sheet">
    <div class="border-2 border-slate-800 p-6 rounded-lg">
      <div class="flex justify-between items-end border-b-2 border-slate-800 pb-4 mb-5">
        <div>
          <span class="text-xs tracking-widest text-emerald-700 font-bold uppercase">23시 동물병원</span>
          <h2 class="text-2xl font-black text-slate-900 mt-0.5">초진 접수 및 문진 기록지</h2>
        </div>
        <div class="text-right text-xs text-slate-500">
          <p id="doc-date">접수일시: -</p>
          <p id="doc-id" class="font-mono mt-0.5">접수번호: -</p>
        </div>
      </div>

      <div class="space-y-4 text-sm">
        <div class="bg-slate-100 p-3 rounded font-bold text-slate-700">1. 보호자 정보</div>
        <div class="grid grid-cols-2 gap-2 pl-2">
          <div><span class="text-slate-500">성함:</span> <strong id="doc-guardian">-</strong></div>
          <div><span class="text-slate-500">연락처:</span> <strong id="doc-phone">-</strong></div>
          <div class="col-span-2"><span class="text-slate-500">주소:</span> <span id="doc-address">-</span></div>
        </div>

        <div class="bg-slate-100 p-3 rounded font-bold text-slate-700">2. 반려동물 정보</div>
        <div class="grid grid-cols-3 gap-2 pl-2">
          <div><span class="text-slate-500">이름:</span> <strong id="doc-pet">-</strong></div>
          <div><span class="text-slate-500">종/품종:</span> <span id="doc-species">-</span></div>
          <div><span class="text-slate-500">체중:</span> <span id="doc-weight">-</span></div>
        </div>

        <div class="bg-slate-100 p-3 rounded font-bold text-slate-700">3. 내원 사유 및 주요 증상</div>
        <div class="p-3 border border-slate-200 rounded min-h-[90px] whitespace-pre-wrap pl-3 bg-white" id="doc-reason">-</div>

        <div class="bg-slate-100 p-3 rounded font-bold text-slate-700">4. 추가 처치 요청 내역</div>
        <div class="p-2 pl-3 text-slate-700" id="doc-treatments">-</div>
      </div>

      <div class="mt-8 pt-4 border-t border-slate-300 flex justify-between items-center text-xs text-slate-400">
        <span>본 문진표는 보호자가 직접 모바일/키오스크로 입력한 전자접수 원본입니다.</span>
        <span>23시 동물병원 원무과</span>
      </div>
    </div>
  </div>

  <script>
    let soundEnabled = false;
    let knownIds = new Set();
    let isFirstLoad = true;

    // 브라우저 내장 Web Audio를 이용한 "띵동" 차임벨 생성
    function playDingDong() {
      if (!soundEnabled) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;

        // 1음 ("띵" - 659.25Hz E5)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.2, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.5);

        // 2음 ("동" - 523.25Hz C5)
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.frequency.setValueAtTime(523.25, now + 0.25);
        gain2.gain.setValueAtTime(0.25, now + 0.25);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.25);
        osc2.stop(now + 0.9);
      } catch (err) {
        console.error("오디오 재생 오류:", err);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundToggleBtn');
      const icon = document.getElementById('soundIcon');
      const text = document.getElementById('soundText');
      if (soundEnabled) {
        btn.className = "px-3.5 py-2 rounded-xl border text-sm font-medium transition flex items-center gap-1.5 bg-emerald-50 text-emerald-700 border-emerald-300";
        icon.innerText = "🔔";
        text.innerText = "알림음 켜짐";
        playDingDong(); // 켜졌음을 알려주는 확인음
      } else {
        btn.className = "px-3.5 py-2 rounded-xl border text-sm font-medium transition flex items-center gap-1.5 bg-slate-100 text-slate-600 border-slate-300";
        icon.innerText = "🔇";
        text.innerText = "알림음 켜기";
      }
    }

    // 접수 목록 조회 & 상태 카운트 & 새 환자 감지
    async function fetchReceptions(manual = false) {
      try {
        const res = await fetch('/api/receptions');
        const data = await res.json();
        if (!Array.isArray(data)) return;

        let waiting = 0, progress = 0, done = 0;
        let hasNew = false;

        data.forEach(item => {
          if (item.status === '대기') waiting++;
          else if (item.status === '진료중') progress++;
          else if (item.status === '완료') done++;

          if (!isFirstLoad && !knownIds.has(item.id) && item.status === '대기') {
            hasNew = true;
          }
        });

        document.getElementById('count-waiting').innerText = waiting;
        document.getElementById('count-progress').innerText = progress;
        document.getElementById('count-done').innerText = done;

        if (hasNew) playDingDong();

        knownIds = new Set(data.map(d => d.id));
        isFirstLoad = false;

        renderList(data);
      } catch (e) {
        console.error("조회 실패:", e);
      }
    }

    function renderList(list) {
      const container = document.getElementById('list-container');
      if (list.length === 0) {
        container.innerHTML = `<div class="bg-white p-12 text-center rounded-2xl border border-slate-200 text-slate-400 text-sm">현재 대기 중인 접수 환자가 없습니다.</div>`;
        return;
      }

      container.innerHTML = list.map(item => {
        let payload = {};
        try { payload = typeof item.payload === 'string' ? JSON.parse(item.payload) : (item.payload || {}); } catch(e){}

        const isFirst = item.type === 'FIRST' || item.type === '초진';
        const typeBadge = isFirst
          ? `<span class="bg-sky-100 text-sky-800 text-xs px-2.5 py-1 rounded-md font-bold">초진</span>`
          : `<span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-md font-bold">재진</span>`;

        let statusClass = "bg-amber-50 text-amber-700 border-amber-200";
        if (item.status === '진료중') statusClass = "bg-emerald-50 text-emerald-700 border-emerald-200";
        if (item.status === '완료') statusClass = "bg-slate-100 text-slate-400 border-slate-200";

        // 초진인 경우 이미지 다운로드 버튼 표시
        const downloadBtn = isFirst ? `
          <button onclick='downloadIntakeSheet(${JSON.stringify(item)})' class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition flex items-center gap-1 border border-slate-300">
            📥 초진표 이미지 저장
          </button>
        ` : '';

        const timeStr = item.created_at ? new Date(item.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';

        return `
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-slate-300 transition">
            <div class="space-y-1.5 flex-1">
              <div class="flex items-center gap-2">
                ${typeBadge}
                <h3 class="text-lg font-bold text-slate-900">${item.pet_name || '이름 없음'}</h3>
                <span class="text-xs text-slate-400 font-mono">${timeStr}</span>
                ${downloadBtn}
              </div>
              <p class="text-sm text-slate-600">
                보호자: <strong>${item.owner_phone || '-'}</strong> ${payload.guardian_name ? `(${payload.guardian_name})` : ''}
                ${payload.breed ? ` · ${payload.breed}` : ''} ${payload.weight ? ` · ${payload.weight}kg` : ''}
              </p>
              <p class="text-xs text-slate-500 bg-slate-50 p-2.5 rounded-lg border border-slate-100 mt-1">
                증상: ${payload.reason || item.symptoms || '작성된 내원 사유가 없습니다.'}
              </p>
            </div>

            <!-- 상태 변경 버튼 묶음 -->
            <div class="flex items-center gap-2 self-end md:self-center">
              <select onchange="updateStatus(${item.id}, this.value)" class="text-xs font-bold px-3 py-2 rounded-xl border ${statusClass} focus:outline-none cursor-pointer">
                <option value="대기" ${item.status === '대기' ? 'selected' : ''}>⏳ 접수 대기</option>
                <option value="진료중" ${item.status === '진료중' ? 'selected' : ''}>🩺 진료 중</option>
                <option value="완료" ${item.status === '완료' ? 'selected' : ''}>✅ 진료 완료</option>
              </select>
            </div>
          </div>
        `;
      }).join('');
    }

    // 상태 변경 API 호출
    async function updateStatus(id, newStatus) {
      try {
        await fetch('/api/receptions', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, status: newStatus })
        });
        fetchReceptions();
      } catch (err) {
        alert('상태 변경 실패: ' + err.message);
      }
    }

    // 초진 서식을 HTML에 채운 뒤 1장의 이미지로 다운로드
    async function downloadIntakeSheet(item) {
      let payload = {};
      try { payload = typeof item.payload === 'string' ? JSON.parse(item.payload) : (item.payload || {}); } catch(e){}

      document.getElementById('doc-id').innerText = `접수번호: #${item.id}`;
      document.getElementById('doc-date').innerText = `접수일시: ${item.created_at || new Date().toLocaleString('ko-KR')}`;
      document.getElementById('doc-guardian').innerText = payload.guardian_name || '미기재';
      document.getElementById('doc-phone').innerText = item.owner_phone || '-';
      document.getElementById('doc-address').innerText = payload.address || '미기재';
      document.getElementById('doc-pet').innerText = item.pet_name || '-';
      document.getElementById('doc-species').innerText = `${payload.species || '기타'} / ${payload.breed || '미기재'}`;
      document.getElementById('doc-weight').innerText = payload.weight ? `${payload.weight} kg` : '미기재';
      document.getElementById('doc-reason').innerText = payload.reason || item.symptoms || '기재 내용 없음';

      // 추가 처치 목록
      const extraList = [];
      if (payload.anal_sac) extraList.push('항문낭짜기 (5,000원)');
      if (payload.nail_trim) extraList.push('발톱깎기 (10,000원)');
      if (payload.ear_clean) extraList.push('귀청소 (10,000원)');
      if (payload.heartworm) extraList.push('심장사상충 예방');
      document.getElementById('doc-treatments').innerText = extraList.length > 0 ? extraList.join(', ') : '선택 처치 없음';

      const sheetElement = document.getElementById('print-sheet');

      try {
        const canvas = await html2canvas(sheetElement, { scale: 2 });
        const imageURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        const cleanPhone = (item.owner_phone || '0000').slice(-4);
        link.download = `초진문진표_${item.pet_name || '환자'}_${cleanPhone}.png`;
        link.href = imageURL;
        link.click();
      } catch (err) {
        alert('이미지 생성 중 오류가 발생했습니다: ' + err.message);
      }
    }

    // 초기 실행 및 5초 주기 자동 갱신
    fetchReceptions();
    setInterval(() => fetchReceptions(), 5000);
  </script>
</body>
</html>
