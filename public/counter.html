<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>23시 동물병원 - 데스크 접수 현황판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 고해상도 캡처를 위한 html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body { font-family: 'Pretendard', sans-serif; }
    
    /* A4 표준 1장 규격 (794px x 1123px, 96 DPI 기준 정확한 1 : 1.414 비율) */
    #print-sheet {
      position: fixed;
      left: -9999px;
      top: -9999px;
      width: 794px;
      height: 1123px;
      background: #ffffff;
      padding: 38px 44px;
      box-sizing: border-box;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- 헤더 -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-5 rounded-2xl shadow-sm border border-slate-200 gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span>
          <h1 class="text-2xl font-bold text-slate-900 tracking-tight">원내 접수 현황판</h1>
        </div>
        <p class="text-sm text-slate-500 mt-1">실시간 접수 현황 및 초진 서식 출력 관리</p>
      </div>
      
      <!-- 컨트롤 버튼 -->
      <div class="flex items-center gap-3">
        <button id="soundToggleBtn" onclick="toggleSound()" class="px-3.5 py-2 rounded-xl border text-sm font-medium transition flex items-center gap-1.5 bg-slate-100 text-slate-600 border-slate-300">
          <span id="soundIcon">🔇</span> <span id="soundText">알림음 켜기</span>
        </button>
        <button onclick="fetchReceptions(true)" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm font-semibold hover:bg-slate-800 transition">
          새로고침
        </button>
      </div>
    </header>

    <!-- 요약 통계 -->
    <div class="grid grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
        <p class="text-xs font-semibold text-slate-400">접수 대기</p>
        <p id="count-waiting" class="text-2xl font-bold text-amber-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
        <p class="text-xs font-semibold text-slate-400">진료 중</p>
        <p id="count-progress" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
        <p class="text-xs font-semibold text-slate-400">오늘 완료</p>
        <p id="count-done" class="text-2xl font-bold text-slate-500 mt-1">0</p>
      </div>
    </div>

    <!-- 접수 목록 -->
    <div id="list-container" class="space-y-3">
      <div class="text-center py-12 text-slate-400 text-sm">접수 내역을 확인하는 중입니다...</div>
    </div>
  </div>

  <!-- 복사 알림 토스트 팝업 (클릭 시 화면 우측 하단에 표시) -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-12 opacity-0 pointer-events-none transition-all duration-300 bg-slate-900 text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 border border-slate-700">
    <span id="toast-message">📋 복사 완료!</span>
  </div>

  <!-- A4 맞춤형 초진접수 및 개인정보 동의서 템플릿 (화면 밖 렌더링) -->
  <div id="print-sheet">
    <div>
      <!-- 1. 타이틀 & 병원 확인 결재란 -->
      <div class="flex justify-between items-start border-b-2 border-slate-900 pb-2.5">
        <div>
          <span class="text-xs font-bold tracking-widest text-[#0d9488]">23시 동물병원 · CLINIC FLOW</span>
          <h2 class="text-2xl font-black text-slate-900 mt-0.5 tracking-tight">초진접수 및 개인정보 동의서</h2>
          <p class="text-[11px] text-slate-500 mt-0.5">본 서식은 내원 시 보호자가 직접 작성한 전자 접수 및 법적 동의서 원본입니다.</p>
        </div>
        
        <table class="border-collapse border border-slate-400 text-xs text-center w-36">
          <tr class="bg-slate-100 font-semibold text-slate-700">
            <td class="border border-slate-400 py-1 w-1/2">원무확인</td>
            <td class="border border-slate-400 py-1 w-1/2">담당의사</td>
          </tr>
          <tr>
            <td class="border border-slate-400 h-9"></td>
            <td class="border border-slate-400 h-9"></td>
          </tr>
        </table>
      </div>

      <!-- 접수 번호 및 일시 -->
      <div class="flex justify-between text-xs text-slate-600 font-mono mt-1.5 mb-3 px-1">
        <span id="doc-id">접수번호: #0</span>
        <span id="doc-date">접수일시: 2026-00-00 00:00:00</span>
      </div>

      <!-- 2. 보호자 및 환자 기본 정보 표 -->
      <div class="mb-3">
        <h3 class="text-xs font-bold text-slate-800 mb-1.5 flex items-center gap-1">
          <span class="w-1.5 h-3 bg-[#0d9488] rounded-sm"></span> 1. 보호자 및 반려동물 인적사항
        </h3>
        <table class="w-full border-collapse border border-slate-300 text-xs">
          <tr>
            <th class="border border-slate-300 bg-slate-100 text-slate-700 py-1.5 px-3 w-24 text-left">보호자 성함</th>
            <td class="border border-slate-300 py-1.5 px-3 font-semibold w-56" id="doc-guardian">-</td>
            <th class="border border-slate-300 bg-slate-100 text-slate-700 py-1.5 px-3 w-24 text-left">연락처</th>
            <td class="border border-slate-300 py-1.5 px-3 font-mono font-semibold" id="doc-phone">-</td>
          </tr>
          <tr>
            <th class="border border-slate-300 bg-slate-100 text-slate-700 py-1.5 px-3 text-left">주소</th>
            <td colspan="3" class="border border-slate-300 py-1.5 px-3 text-slate-800" id="doc-address">-</td>
          </tr>
          <tr>
            <th class="border border-slate-300 bg-slate-100 text-slate-700 py-1.5 px-3 text-left">동물 이름</th>
            <td class="border border-slate-300 py-1.5 px-3 font-bold text-teal-800 text-sm" id="doc-pet">-</td>
            <th class="border border-slate-300 bg-slate-100 text-slate-700 py-1.5 px-3 text-left">축종 / 품종</th>
