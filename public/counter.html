<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>23시 하단오거리동물병원 - 통합 원내 현황판 (진료 & 방문·상담)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- 엑셀 다운로드용 SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body { font-family: 'Pretendard', sans-serif; font-size: 14px; }
    #print-sheet {
      position: fixed; left: -9999px; top: -9999px;
      width: 794px; height: 1123px; background: #ffffff;
      padding: 38px 44px; box-sizing: border-box; color: #1e293b;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    #print-sheet table { border-collapse: collapse; }
    #print-sheet table th, #print-sheet table td { vertical-align: middle !important; line-height: 1.4; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-2 sm:p-4">

  <div class="max-w-6xl mx-auto space-y-4">
    
    <!-- 1. 헤더 -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping"></span>
          <h1 class="text-xl font-bold text-slate-900 tracking-tight">통합 원내 현황판</h1>
          <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-bold border border-slate-300">진료 & 방문·상담</span>
        </div>
        <p class="text-xs text-slate-500 mt-0.5">실시간 진료 대기 및 방문·상담 통합 모니터링</p>
      </div>
      
      <!-- 컨트롤 버튼 -->
      <div class="flex items-center gap-2 flex-wrap">
        <button id="soundToggleBtn" onclick="toggleSound()" class="px-2.5 py-1.5 rounded-lg border text-xs font-medium transition flex items-center gap-1 bg-emerald-50 text-emerald-700 border-emerald-300">
          <span id="soundIcon">🔔</span>
          <span id="soundText">알림음 켜짐</span>
        </button>
        <button onclick="exportVisitExcel()" class="px-3 py-1.5 bg-teal-700 text-white rounded-lg text-xs font-semibold hover:bg-teal-800 transition">
          📊 상담 엑셀 다운
        </button>
        <button onclick="openImageSearch()" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-semibold hover:bg-indigo-700 transition">
          🗂️ A4 기록 검색
        </button>
        <button onclick="fetchAllData(true)" class="px-3 py-1.5 bg-slate-900 text-white rounded-lg text-xs font-semibold hover:bg-slate-800 transition">
          새로고침
        </button>
      </div>
    </header>

    <!-- 2. 공지사항 바 -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
      <div class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-800 text-[11px] font-bold px-2.5 py-1 rounded-full border border-emerald-200 shrink-0 w-fit">
        <span>📢</span><span>공지 설정</span>
      </div>
      <textarea id="adminNoticeInput" rows="1" placeholder="접수 키오스크에 띄울 소식을 입력하세요" class="flex-1 w-full text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-800 focus:outline-none focus:border-emerald-500 focus:bg-white transition resize-y min-h-[32px] max-h-[80px]"></textarea>
      <div class="flex items-center gap-1.5 shrink-0 self-end sm:self-center">
        <button type="button" id="btnNoticeSave" onclick="saveNoticeToDB()" class="px-3 py-1.5 bg-slate-900 text-white text-[11px] font-bold rounded-lg hover:bg-slate-800 transition shadow-sm">게시</button>
        <button type="button" onclick="clearNoticeInDB()" class="px-2.5 py-1.5 bg-slate-100 text-slate-600 border border-slate-200 text-[11px] font-medium rounded-lg hover:bg-slate-200 transition">지우기</button>
      </div>
    </div>

    <!-- 3. 요약 통계 -->
    <div class="grid grid-cols-4 gap-2.5">
      <div class="bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm text-center">
        <p class="text-[11px] font-semibold text-slate-400">접수 대기</p>
        <p id="count-waiting" class="text-xl font-bold text-amber-600 mt-0.5">0</p>
      </div>
      <div class="bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm text-center">
        <p class="text-[11px] font-semibold text-slate-400">진료/처리 중</p>
        <p id="count-progress" class="text-xl font-bold text-emerald-600 mt-0.5">0</p>
      </div>
      <div class="bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm text-center">
        <p class="text-[11px] font-semibold text-slate-400">오늘 완료</p>
        <p id="count-done" class="text-xl font-bold text-slate-500 mt-0.5">0</p>
      </div>
      <div class="bg-amber-50/60 p-2.5 rounded-lg border border-amber-200 shadow-sm text-center">
        <p class="text-[11px] font-semibold text-amber-700">📅 예약 보관</p>
        <p id="count-reserved" class="text-xl font-bold text-amber-800 mt-0.5">0</p>
      </div>
    </div>

    <!-- 4. 탭 및 검색 필터 -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-2 bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm">
      <div class="flex items-center gap-1.5 w-full sm:w-auto">
        <button onclick="setTab('ALL')" id="tab-ALL" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition">전체보기</button>
        <button onclick="setTab('RECEPTION')" id="tab-RECEPTION" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🩺 진료 접수</button>
        <button onclick="setTab('VISIT')" id="tab-VISIT" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">💬 방문·상담</button>
      </div>
      <div class="w-full sm:w-72">
        <input id="searchInput" oninput="renderCombinedList()" placeholder="환자명, 보호자명, 연락처, 사유 검색..." class="w-full text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-teal-600 focus:bg-white transition">
      </div>
    </div>

    <!-- 5. 활성 목록 (진료 접수 & 방문·상담 통합) -->
    <div id="list-container" class="space-y-2.5">
      <div class="text-center py-8 text-slate-400 text-xs">내역을 확인하는 중입니다...</div>
    </div>

    <!-- 6. 📅 사전예약 및 대기 보관함 -->
    <div class="bg-white rounded-xl border border-amber-200 shadow-sm overflow-hidden">
      <div onclick="toggleCounterReserveBox()" class="p-3 bg-amber-50/70 border-b border-amber-200 flex justify-between items-center cursor-pointer select-none">
        <div class="flex items-center gap-2">
          <span class="text-base">📅</span>
          <span class="font-bold text-xs text-amber-900">사전접수 및 예약대기 보관함 (<span id="box-reserved-count">0</span>건)</span>
          <span class="text-[11px] text-amber-700 font-medium">· 내원 시 [대기 복귀] 클릭</span>
        </div>
        <span id="reserve-toggle-arrow" class="text-xs text-amber-800 font-bold">펼치기 ▼</span>
      </div>
      <div id="counter-reserve-container" class="p-3 space-y-2 hidden bg-amber-50/20"></div>
    </div>

  </div>

  <!-- 방문·상담 상세 모달 -->
  <div id="detailModal" class="fixed inset-0 z-50 bg-slate-950/70 hidden items-center justify-center p-3" onclick="if(event.target===this) closeDetailModal()">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden p-5 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-base text-slate-900">📋 방문·상담 상세 내용</h3>
        <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>
      <div id="modalMeta" class="grid grid-cols-2 gap-2 text-xs bg-slate-50 p-3 rounded-xl border border-slate-200"></div>
      <div>
        <h4 class="text-xs font-bold text-slate-700 mb-1">요청 사항 전체</h4>
        <div id="modalDetails" class="p-3 rounded-xl bg-amber-50/40 border border-amber-200 text-xs text-slate-800 whitespace-pre-wrap leading-relaxed min-h-[90px]"></div>
      </div>
      <div class="flex justify-end pt-2">
        <button onclick="closeDetailModal()" class="px-4 py-2 bg-slate-900 text-white rounded-lg text-xs font-bold">닫기</button>
      </div>
    </div>
  </div>

  <!-- 토스트 알림 -->
  <div id="copyToast" class="fixed bottom-6 right-6 z-50 transform transition-all duration-300 opacity-0 translate-y-4 pointer-events-none bg-slate-900 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl shadow-xl flex items-center gap-1.5 border border-slate-700">
    <span class="text-emerald-400">✓</span>
    <span id="toastMsg">클립보드에 복사되었습니다!</span>
  </div>

  <!-- A4 인쇄용 숨김 시트 (기존 유지) -->
  <div id="print-sheet"></div>
  <div id="revisit-print-sheet" style="position:fixed;left:-9999px;top:-9999px;width:794px;height:1123px;background:#fff;padding:48px 52px;box-sizing:border-box;"></div>

  <script>
    let soundEnabled = true;
    let currentTab = 'ALL';
    let rawReceptions = [];
    let rawVisits = [];
    let knownRecepIds = new Set();
    let knownVisitIds = new Set();
    let isFirstLoad = true;

    // 1. 소리 알림
    function playDingDong() {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator(), gain1 = ctx.createGain();
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.2, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc1.connect(gain1); gain1.connect(ctx.destination);
        osc1.start(now); osc1.stop(now + 0.45);

        const osc2 = ctx.createOscillator(), gain2 = ctx.createGain();
        osc2.frequency.setValueAtTime(523.25, now + 0.22);
        gain2.gain.setValueAtTime(0.25, now + 0.22);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
        osc2.connect(gain2); gain2.connect(ctx.destination);
        osc2.start(now + 0.22); osc2.stop(now + 0.85);
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundToggleBtn');
      btn.className = soundEnabled 
        ? "px-2.5 py-1.5 rounded-lg border text-xs font-medium transition flex items-center gap-1 bg-emerald-50 text-emerald-700 border-emerald-300"
        : "px-2.5 py-1.5 rounded-lg border text-xs font-medium transition flex items-center gap-1 bg-slate-100 text-slate-600 border-slate-300";
      document.getElementById('soundIcon').innerText = soundEnabled ? "🔔" : "🔇";
      document.getElementById('soundText').innerText = soundEnabled ? "알림음 켜짐" : "알림음 켜기";
      if (soundEnabled) playDingDong();
    }

    function showToast(msg) {
      const toast = document.getElementById('copyToast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
      }, 2200);
    }

    function setTab(tab) {
      currentTab = tab;
      ['ALL', 'RECEPTION', 'VISIT'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition";
        } else {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition";
        }
      });
      renderCombinedList();
    }

    // 2. 통합 데이터 로드
    async function fetchAllData(manual = false) {
      try {
        const [resRecep, resVisits] = await Promise.allSettled([
          fetch('/api/receptions').then(r => r.ok ? r.json() : []),
          fetch('/api/visits').then(r => r.ok ? r.json() : { items: [] })
        ]);

        rawReceptions = (resRecep.status === 'fulfilled' && Array.isArray(resRecep.value)) ? resRecep.value : [];
        const visitJson = resVisits.status === 'fulfilled' ? resVisits.value : {};
        rawVisits = Array.isArray(visitJson) ? visitJson : (visitJson.items || []);

        let hasNew = false;
        if (!isFirstLoad) {
          const newRecep = rawReceptions.some(x => !knownRecepIds.has(x.id) && (x.status === '접수대기' || x.status === '대기'));
          const newVisit = rawVisits.some(x => !knownVisitIds.has(x.id) && (x.status === '접수' || x.status === '접수대기'));
          if (newRecep || newVisit) hasNew = true;
        }

        if (hasNew) playDingDong();

        knownRecepIds = new Set(rawReceptions.map(x => x.id));
        knownVisitIds = new Set(rawVisits.map(x => x.id));
        isFirstLoad = false;

        renderCombinedList();
      } catch (err) {
        console.error('데이터 갱신 실패:', err);
      }
    }

    function unwrapPayload(raw) {
      if (!raw) return {};
      let c = raw;
      try { while (typeof c === 'string') c = JSON.parse(c); } catch(e) {}
      return (c && typeof c === 'object') ? c : {};
    }

    // 3. 결합 및 렌더링
    function renderCombinedList() {
      const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();

      // 진료 데이터 규격화
      const normReceptions = rawReceptions.filter(x => x.status !== '목록숨김').map(x => {
        const payload = unwrapPayload(x.payload);
        return {
          typeKind: 'RECEPTION',
          id: x.id,
          raw: x,
          status: x.status,
          title: x.pet_name || '이름 없음',
          subtitle: payload.guardian_name || x.owner_name || '보호자',
          phone: x.phone || x.owner_phone || '',
          time: x.created_at || '',
          scheduled: payload.expected_date ? `${payload.expected_date} ${payload.expected_time || ''}` : '',
          detail: (payload.reason || x.symptom || x.symptoms || '').trim(),
          badge: (x.type === 'FIRST' || x.type === '초진') ? '초진' : '재진',
          extraInfo: `${payload.breed ? ` · ${payload.breed}` : ''}${payload.weight ? ` · ${payload.weight}kg` : ''}`
        };
      });

      // 방문·상담 데이터 규격화
      const normVisits = rawVisits.map(x => ({
        typeKind: 'VISIT',
        id: x.id,
        raw: x,
        status: x.status,
        title: x.animal_name || '동물/업체 미기재',
        subtitle: x.visitor_name || '방문자',
        phone: x.phone || '',
        time: x.created_at || '',
        scheduled: x.scheduled_at ? new Date(x.scheduled_at).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' }) : '',
        detail: (x.request_details || '').trim(),
        badge: x.purpose || '일반 상담',
        extraInfo: ''
      }));

      // 합치기 및 탭 필터링
      let merged = [];
      if (currentTab === 'ALL') merged = [...normReceptions, ...normVisits];
      else if (currentTab === 'RECEPTION') merged = [...normReceptions];
      else if (currentTab === 'VISIT') merged = [...normVisits];

      // 검색어 필터
      if (q) {
        merged = merged.filter(x => 
          [x.title, x.subtitle, x.phone, x.detail, x.badge].join(' ').toLowerCase().includes(q)
        );
      }

      // 상태별 통계 계산 (전체 기준)
      const allMerged = [...normReceptions, ...normVisits];
      let waiting = 0, progress = 0, done = 0, reserved = 0;
      allMerged.forEach(x => {
        if (['접수대기', '대기', '접수'].includes(x.status)) waiting++;
        else if (['진료중', '처리 중'].includes(x.status)) progress++;
        else if (['완료'].includes(x.status)) done++;
        else if (['예약대기'].includes(x.status)) reserved++;
      });
      document.getElementById('count-waiting').innerText = waiting;
      document.getElementById('count-progress').innerText = progress;
      document.getElementById('count-done').innerText = done;
      document.getElementById('count-reserved').innerText = reserved;
      document.getElementById('box-reserved-count').innerText = reserved;

      // 예약 보관함과 메인 리스트 분리
      const activeList = merged.filter(x => x.status !== '예약대기' && x.status !== '완료');
      const reservedList = merged.filter(x => x.status === '예약대기');

      renderActiveList(activeList);
      renderReservedBox(reservedList);
    }

    function renderActiveList(list) {
      const container = document.getElementById('list-container');
      if (!list.length) {
        container.innerHTML = `<div class="bg-white p-8 text-center rounded-xl border border-slate-200 text-slate-400 text-xs">표시할 대기 접수가 없습니다.</div>`;
        return;
      }

      // 최신순 정렬
      list.sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));

      container.innerHTML = list.map(item => {
        const isVisit = item.typeKind === 'VISIT';
        const typeBadgeClass = isVisit 
          ? 'bg-amber-100 text-amber-900 border-amber-300' 
          : (item.badge === '초진' ? 'bg-sky-100 text-sky-800 border-sky-300' : 'bg-emerald-100 text-emerald-800 border-emerald-300');

        const kindLabel = isVisit ? '💬 방문·상담' : '🩺 진료접수';
        const kindLabelClass = isVisit ? 'text-amber-700 bg-amber-50 border-amber-200' : 'text-teal-700 bg-teal-50 border-teal-200';

        const timeStr = item.time ? new Date(item.time.replace(' ', 'T')).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';
        const scheduledBadge = item.scheduled ? `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-200">📅 ${item.scheduled}</span>` : '';

        // 상태값 선택지 구성
        const statusOptions = isVisit
          ? ['접수', '처리 중', '완료', '취소']
          : ['접수대기', '예약대기', '진료중', '완료'];

        const actionBtn = isVisit
          ? `<button onclick='openVisitModal(${JSON.stringify(item.raw)})' class="px-2 py-0.5 text-[11px] font-bold rounded bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 shadow-sm">📋 상세 내용</button>`
          : `<button onclick='downloadIntakeSheet(${JSON.stringify(item.raw)})' class="px-2 py-0.5 text-[11px] font-bold rounded bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 shadow-sm">📄 A4 서식</button>`;

        return `
          <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 hover:border-slate-300 transition">
            <div class="space-y-1 flex-1 min-w-0 w-full">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border ${kindLabelClass}">${kindLabel}</span>
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border ${typeBadgeClass}">${item.badge}</span>
                <h3 class="text-base font-bold text-slate-900">${escapeHtml(item.title)}</h3>
                <span class="text-[11px] text-slate-400 font-mono">${timeStr}</span>
                ${scheduledBadge}
                ${actionBtn}
              </div>

              <div class="text-xs text-slate-600 flex flex-wrap items-center gap-1">
                <span>신청/보호자: <strong>${escapeHtml(item.subtitle)}</strong></span>
                ${item.phone ? `<button type="button" onclick="copyText('${item.phone}','연락처')" class="font-mono font-bold text-slate-800 bg-slate-100 px-1.5 py-0.2 rounded hover:bg-teal-50 text-[11px] border">${item.phone}</button>` : ''}
                <span class="text-slate-500 font-medium">${escapeHtml(item.extraInfo)}</span>
              </div>

              ${item.detail ? `
                <div onclick="copyText('${escapeHtml(item.detail)}','내용')" class="text-xs text-slate-700 bg-slate-50 hover:bg-teal-50/40 p-2 rounded-lg border border-slate-200 mt-1 cursor-pointer select-none">
                  <div class="line-clamp-2 leading-relaxed">${escapeHtml(item.detail)}</div>
                </div>
              ` : ''}
            </div>

            <!-- 우측 액션: 상태 셀렉트 및 삭제 -->
            <div class="flex items-center gap-1.5 shrink-0 self-end sm:self-center mt-1 sm:mt-0">
              <select onchange="changeStatus('${item.typeKind}', ${item.id}, this.value)" class="text-xs font-bold px-2 py-1.5 rounded-lg border bg-white border-slate-300 focus:outline-none cursor-pointer">
                ${statusOptions.map(opt => `<option value="${opt}" ${item.status === opt ? 'selected' : ''}>${opt}</option>`).join('')}
              </select>
              <button onclick="deleteUnifiedItem('${item.typeKind}', ${item.id}, '${escapeHtml(item.title)}')" class="px-2 py-1.5 rounded-lg border border-rose-200 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs">삭제</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderReservedBox(list) {
      const box = document.getElementById('counter-reserve-container');
      if (!list.length) {
        box.innerHTML = `<div class="text-xs text-amber-700/70 py-2 text-center">보관함에 대기 중인 예약 환자가 없습니다.</div>`;
        return;
      }
      box.innerHTML = list.map(item => `
        <div class="bg-white p-2.5 rounded-lg border border-amber-200 flex items-center justify-between gap-2 shadow-xs">
          <div class="flex items-center gap-2 min-w-0">
            <span class="bg-amber-100 text-amber-900 font-bold text-[10px] px-1.5 py-0.5 rounded">예약대기</span>
            <span class="font-bold text-xs text-slate-800 truncate">${escapeHtml(item.title)}</span>
            <span class="text-[11px] text-slate-500">(${escapeHtml(item.subtitle)})</span>
            <span class="text-[11px] text-indigo-600 font-medium">${item.scheduled ? `📅 ${item.scheduled}` : ''}</span>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="changeStatus('${item.typeKind}', ${item.id}, '접수대기')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[11px] font-bold">🐾 내원함 (대기 복귀)</button>
            <button onclick="deleteUnifiedItem('${item.typeKind}', ${item.id}, '${escapeHtml(item.title)}')" class="px-2 py-1 bg-slate-100 hover:bg-rose-50 text-slate-500 hover:text-rose-600 rounded text-[11px] font-bold border border-slate-200">삭제</button>
          </div>
        </div>
      `).join('');
    }

    // 4. 상태 변경 및 삭제 라우팅
    async function changeStatus(typeKind, id, newStatus) {
      try {
        const url = typeKind === 'VISIT' ? `/api/visits/${id}` : '/api/receptions';
        const body = typeKind === 'VISIT' ? { status: newStatus } : { id, status: newStatus };
        const res = await fetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('상태 변경 실패');
        showToast('상태가 변경되었습니다.');
        fetchAllData();
      } catch (e) {
        alert(e.message);
      }
    }

    async function deleteUnifiedItem(typeKind, id, title) {
      if (!confirm(`[${title}] 내역을 삭제 또는 숨김 처리할까요?`)) return;
      try {
        if (typeKind === 'VISIT') {
          const res = await fetch(`/api/visits/${id}`, { method: 'DELETE' });
          if (!res.ok) throw new Error('방문 내역 삭제 실패');
        } else {
          // 진료는 DB 보존을 위해 목록숨김 처리
          const res = await fetch('/api/receptions', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, status: '목록숨김' })
          });
          if (!res.ok) throw new Error('진료 접수 숨김 실패');
        }
        showToast(`[${title}] 처리 완료`);
        fetchAllData();
      } catch (e) {
        alert(e.message);
      }
    }

    // 5. 모달 및 유틸
    function openVisitModal(v) {
      const meta = document.getElementById('modalMeta');
      meta.innerHTML = `
        <div><b class="text-slate-400 block">방문자</b><span>${v.visitor_name || '-'}</span></div>
        <div><b class="text-slate-400 block">연락처</b><span>${v.phone || '-'}</span></div>
        <div><b class="text-slate-400 block">동물/업체</b><span>${v.animal_name || '-'}</span></div>
        <div><b class="text-slate-400 block">방문 목적</b><span>${v.purpose || '-'}</span></div>
        <div><b class="text-slate-400 block">방문 예정</b><span>${v.scheduled_at ? new Date(v.scheduled_at).toLocaleString('ko-KR') : '즉시/미정'}</span></div>
        <div><b class="text-slate-400 block">접수 시각</b><span>${v.created_at ? new Date(v.created_at).toLocaleString('ko-KR') : '-'}</span></div>
      `;
      document.getElementById('modalDetails').innerText = v.request_details || '작성된 요청 사항이 없습니다.';
      document.getElementById('detailModal').classList.remove('hidden');
      document.getElementById('detailModal').classList.add('flex');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('hidden');
      document.getElementById('detailModal').classList.remove('flex');
    }

    function copyText(text, label = '텍스트') {
      if (!text || text === '-') return;
      navigator.clipboard.writeText(text).then(() => showToast(`📋 ${label} 복사 완료!`));
    }

    function escapeHtml(val) {
      return String(val ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
    }

    function toggleCounterReserveBox() {
      const box = document.getElementById('counter-reserve-container');
      const arrow = document.getElementById('reserve-toggle-arrow');
      if (box.classList.contains('hidden')) {
        box.classList.remove('hidden');
        arrow.innerText = '접기 ▲';
      } else {
        box.classList.add('hidden');
        arrow.innerText = '펼치기 ▼';
      }
    }

    // 6. 방문·상담 엑셀 다운로드
    function exportVisitExcel() {
      if (!window.XLSX) { alert('엑셀 모듈이 로드되지 않았습니다.'); return; }
      if (!rawVisits.length) { alert('다운로드할 방문·상담 내역이 없습니다.'); return; }
      const headers = ['접수번호', '접수시각', '방문예정', '방문자', '연락처', '동물/업체', '목적', '요청사항', '상태'];
      const rows = rawVisits.map(x => [
        x.id ?? '',
        x.created_at ? new Date(x.created_at).toLocaleString('ko-KR') : '',
        x.scheduled_at ? new Date(x.scheduled_at).toLocaleString('ko-KR') : '',
        x.visitor_name || '',
        x.phone || '',
        x.animal_name || '',
        x.purpose || '',
        x.request_details || '',
        x.status || ''
      ]);
      const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '방문상담');
      XLSX.writeFile(wb, `방문상담_${new Date().toISOString().slice(0, 10)}.xlsx`);
    }

    // 초기 실행 및 5초 주기 폴링
    fetchAllData();
    setInterval(fetchAllData, 5000);
  </script>
</body>
</html>
