<!doctype html>
<html lang="ko">
<head>

<title>C3 · 23시 하오동 진상 소탕 해전</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    background: #0b192c;
    color: #f8fafc;
    font-family: 'Malgun Gothic', 'Pretendard', sans-serif;

  }
  .hud {
    display: flex;
    justify-content: space-between;

    border-bottom: 2px solid #38bdf8;

    flex-wrap: wrap;

  .hud-left { display: flex; align-items: center; gap: 8px; }

  .stat-pill {

    padding: 3px 8px;
    border-radius: 7px;

    white-space: nowrap;

  .stat-pill b { color: #fbbf24; font-size: 14.5px; }
  .stat-pill.hp b { color: #34d399; }
  .stat-pill.hp.danger b { color: #f87171; }

  /* 5종 무기 & 쿨타임 게이지 버튼 */
  .weapons { display: flex; gap: 4px; flex-wrap: wrap; }
  .w-btn {

    left: 0;

  /* 지정 출격 등록 패널 */

  .queue-list {

  .canvas-wrap {

    display: none;

    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    z-index: 25;

</style>

<body>

<header class="hud">
  <div class="hud-left">
    <div class="title">🚢 C3 · 23시 하오동 진상 소탕</div>
    <div class="stat-pill hp" id="shipHpPill">함선HP: <b id="shipHpVal">100</b></div>
    <div class="stat-pill">격침: <b id="killCnt">0</b>척</div>
    <div class="stat-pill">점수: <b id="scoreVal">0</b></div>
  </div>

  <div class="weapons">
    <button class="w-btn active" id="w0" onclick="selectWeapon(0)">

    <button class="w-btn" id="w1" onclick="selectWeapon(1)">
      [A] 💉주사기 (10)
      <span class="w-sub" id="wSub1">준비 (5초)</span>
      <div class="w-cd-bar" id="wBar1"></div>
    </button>
    <button class="w-btn" id="w2" onclick="selectWeapon(2)">
      [S] 🪨돌맹이 (20)
      <span class="w-sub" id="wSub2">준비 (10초)</span>
      <div class="w-cd-bar" id="wBar2"></div>
    </button>
    <button class="w-btn" id="w3" onclick="selectWeapon(3)">
      [D] 💣폭탄 (40)

      <div class="w-cd-bar" id="wBar3"></div>
    </button>
    <button class="w-btn torpedo" id="w4" onclick="selectWeapon(4)">
      [W] 🚀어뢰 (필살)
      <span class="w-sub" id="wSub4">준비 (60초)</span>
      <div class="w-cd-bar" id="wBar4"></div>
    </button>
    <button class="w-btn special" id="wSpec" onclick="deployNayoungCommando()">
      [Q] 🤿나영이특전사
      <span class="w-sub" id="wSubSpec">발사관봉쇄 (2분)</span>
      <div class="w-cd-bar" id="wBarSpec"></div>
    </button>
  </div>

  <div style="display:flex;gap:5px">
    <button class="btn orange" onclick="spawnRandomWave()">🎲 랜덤 진상 출격</button>
    <button class="btn blue" id="pauseBtn" onclick="togglePause()">⏸ 일시정지</button>
    <button class="btn mute" id="soundBtn" onclick="toggleSound()">🔊 기계음 ON</button>
  </div>
</header>

<!-- 지정 출격 등록 및 대기열 바 (진상 1~4단계 통합 등급 체계) -->
<div class="roster-bar">
  <div class="roster-inputs">
    <select id="newLevel">
      <option value="1">🟢 1단계 진상 (HP 100)</option>
      <option value="2">🔵 2단계 진상 (HP 180)</option>
      <option value="3">🟣 3단계 진상 (HP 280 · 2연발)</option>
      <option value="4">🔴 4단계 보스 (HP 400 · 3연발)</option>
    </select>
    <input id="newVillain" placeholder="진상 이름 입력" onkeydown="if(event.key==='Enter')enqueueVillain()">
    <button class="btn blue" onclick="enqueueVillain()">+ 대기열 등록</button>
    <button class="btn" onclick="launchNextFromQueue()">▶ 즉시 출격</button>
    <button class="btn red" onclick="clearQueue()">비움</button>
  </div>
  <div class="queue-list" id="queueList"></div>
</div>

<div class="canvas-wrap">
  <canvas id="gameCanvas"></canvas>
  <div class="toast-msg" id="toastBox"></div>

  <div class="pause-overlay" id="pauseBox">
    <div style="font-size:34px;font-weight:900;color:#fbbf24">⏸ 작전 일시정지</div>
    <div style="font-size:15px;color:#e2e8f0"><b>[Backspace]</b> 또는 아래 버튼을 누르면 전투를 재개합니다.</div>
    <button class="btn" style="font-size:16px;padding:10px 24px" onclick="togglePause()">▶ 작전 계속하기</button>
  </div>

  <div class="gameover-overlay" id="gameOverBox">
    <div style="font-size:32px;font-weight:900;color:#f87171">💥 23시 하오동 선체 대파!</div>
    <div style="font-size:16px;color:#e2e8f0">진상 잠수함의 폭격에 피격되어 긴급 수리가 필요합니다.</div>
    <button class="btn" style="font-size:16px;padding:10px 22px" onclick="repairShip()">🔧 선체 수리 후 즉시 재출격</button>
  </div>

  <div class="guide-bar">
    이동: <b>[←/→]</b> · 즉시투하: <b>[Space]</b>똥 <b>[A]</b>주사기 <b>[S]</b>돌맹이 <b>[D]</b>폭탄 <b>[W]</b>어뢰 · 특수: <b>[Q]</b>나영이특전사(발사관 5초봉쇄) · 정지: <b>[Backspace]</b>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W = 1280, H = 720, waterY = 135;
let toastTimer = null;

function showToast(msg) {
  const box = document.getElementById('toastBox');
  if (!box) return;
  box.textContent = msg;
  box.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.style.opacity = '0'; }, 2400);
}

function resize() {
  if (!canvas || !canvas.parentElement) return;
  W = canvas.width = canvas.parentElement.clientWidth;
  H = canvas.height = canvas.parentElement.clientHeight;
  waterY = Math.round(H * 0.21);
  buildSeabed();
  buildCurrentStreams();
}
window.addEventListener('resize', resize);

/* ==================== 감정 성우 보이스 & 합성 효과음 엔진 ==================== */
let soundOn = true;
let audioCtx = null;
let cachedKoVoices = [];

function refreshVoices() {
  if (!('speechSynthesis' in window)) return;
  const all = window.speechSynthesis.getVoices();
  const ko = all.filter(v => v.lang && v.lang.toLowerCase().includes('ko'));
  if (ko.length > 0) {
    // 자연스러운 고음질 한국어 보이스(SunHi, Google, Yuna, Heami 등)를 우선 정렬
    ko.sort((a, b) => {
      const score = v => (/SunHi|Natural|Google|Yuna|Heami|서연|유나/i.test(v.name) ? 10 : 0);
      return score(b) - score(a);
    });
    cachedKoVoices = ko;
  }
}
if ('speechSynthesis' in window) {
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function initAudio() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) audioCtx = new AudioContextClass();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
}

function toggleSound() {
  soundOn = !soundOn;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundOn ? '🔊 기계음 ON' : '🔇 기계음 OFF';
  btn.className = soundOn ? 'btn mute' : 'btn';
  if (!soundOn && 'speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
}

// 물결표 등 특수기호 없이 깔끔하게 한 문장으로 발화하는 기계음 엔진
function speakRobotLine(text, weaponType = 0) {
  if (!soundOn || !('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const cleanText = String(text || '').replace(/[~!@#$%^&*()_+=\[\]{};:'",.<>/?\\|-]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!cleanText) return;

    const u = new SpeechSynthesisUtterance(cleanText);
    u.lang = 'ko-KR';
    const voices = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().includes('ko'));
    if (voices.length > 0) u.voice = voices[0];

    // 기계음 느낌을 살린 피치 및 속도 설정
    u.pitch = weaponType >= 3 ? 0.78 : 1.05;
    u.rate = 1.15;
    u.volume = 1.0;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function playWeaponEmotionalVoice(villainName, weaponType) {
  const wInfo = WEAPONS[weaponType];
  if (!wInfo) return;
  const line = villainName ? `${villainName} ${wInfo.scream}` : wInfo.scream;
  speakRobotLine(line, weaponType);
}

function playDropSound(wType) {
  if (!soundOn) return;
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    if (wType === 4) {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.35);
    } else if (wType === 0) {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(95, now + 0.14);
    } else if (wType === 1) {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(780, now);
      osc.frequency.exponentialRampToValueAtTime(260, now + 0.18);
    } else if (wType === 2) {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(170, now);
      osc.frequency.exponentialRampToValueAtTime(55, now + 0.22);
    } else {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(950, now);
      osc.frequency.exponentialRampToValueAtTime(220, now + 0.45);
    }
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.46);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.47);
  } catch (e) {}
}

function playEnemyBombSound(level) {
  if (!soundOn) return;
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    const startF = 160 + level * 45;
    osc.frequency.setValueAtTime(startF, now);
    osc.frequency.exponentialRampToValueAtTime(startF * 2.4, now + 0.2);
    gain.gain.setValueAtTime(0.09, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.23);
  } catch (e) {}
}

function playImpactSound(isMega) {
  if (!soundOn) return;
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const duration = isMega ? 0.72 : 0.22;
    const bufferSize = Math.floor(audioCtx.sampleRate * duration);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(isMega ? 780 : 380, now);
    filter.frequency.exponentialRampToValueAtTime(38, now + duration);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(isMega ? 0.4 : 0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(now);
  } catch (e) {}
}

/* ==================== 무기 설정 (5종 · 기계음 대사 매핑) ==================== */
const WEAPONS = [
  { name: '똥',     dmg: 5,   cdMs: 250,   scream: '더러' },
  { name: '주사기', dmg: 10,  cdMs: 5000,  scream: '똥침' },
  { name: '돌맹이', dmg: 20,  cdMs: 10000, scream: '찰싹' },
  { name: '폭탄',   dmg: 40,  cdMs: 60000, scream: '뒤져라' },
  { name: '어뢰',   dmg: 999, cdMs: 60000, scream: '꺼져라' }
];
const lastFireTime = [0, 0, 0, 0, 0];
let currentWeapon = 0;

// 특수무기 [Q] 나영이 특전사 (쿨타임 2분 = 120,000ms, 잠수함 발사관 5초 = 300프레임 봉쇄)
const SPECIAL_CD_MS = 120000;
let lastSpecialTime = 0;
let commandoUnits = [];

function selectWeapon(idx) {
  currentWeapon = idx;
  [0, 1, 2, 3, 4].forEach(i => {
    const el = document.getElementById('w' + i);
    if (el) el.classList.toggle('active', i === idx);
  });
}

function updateWeaponCooldownUI() {
  if (isPaused) return;
  const now = Date.now();
  WEAPONS.forEach((w, idx) => {
    const elapsed = now - lastFireTime[idx];
    const remainMs = Math.max(0, w.cdMs - elapsed);
    const pct = Math.min(100, (elapsed / w.cdMs) * 100);
    const btn = document.getElementById('w' + idx);
    const bar = document.getElementById('wBar' + idx);
    const sub = document.getElementById('wSub' + idx);
    if (!btn || !bar || !sub) return;

    bar.style.width = pct.toFixed(1) + '%';
    if (remainMs > 0 && idx > 0) {
      btn.classList.add('cooling');
      sub.textContent = `${(remainMs / 1000).toFixed(1)}초`;
    } else {
      btn.classList.remove('cooling');
      if (idx === 0) sub.textContent = '더러';
      else if (idx === 1) sub.textContent = '준비 (5초)';
      else if (idx === 2) sub.textContent = '준비 (10초)';
      else sub.textContent = '준비 (60초)';
    }
  });

  // 나영이 특전사 [Q] 쿨타임 게이지 업데이트
  const specElapsed = lastSpecialTime === 0 ? SPECIAL_CD_MS : (now - lastSpecialTime);
  const specRemainMs = Math.max(0, SPECIAL_CD_MS - specElapsed);
  const specPct = Math.min(100, (specElapsed / SPECIAL_CD_MS) * 100);
  const specBtn = document.getElementById('wSpec');
  const specBar = document.getElementById('wBarSpec');
  const specSub = document.getElementById('wSubSpec');
  if (specBtn && specBar && specSub) {
    specBar.style.width = specPct.toFixed(1) + '%';
    if (specRemainMs > 0) {
      specBtn.classList.add('cooling');
      specSub.textContent = `${Math.ceil(specRemainMs / 1000)}초 대기`;
    } else {
      specBtn.classList.remove('cooling');
      specSub.textContent = '발사관봉쇄 (2분)';
    }
  }
}

// 특수무기 [Q]: 나영이 특전사 투하 (위험 시 함선에서 뛰어내려 잠수함 발사관을 5초 동안 봉쇄)
function deployNayoungCommando() {
  if (ship.isDestroyed || isPaused) return;
  initAudio();
  const now = Date.now();
  if (lastSpecialTime > 0 && now - lastSpecialTime < SPECIAL_CD_MS) {
    const leftSec = Math.ceil((SPECIAL_CD_MS - (now - lastSpecialTime)) / 1000);
    showToast(`🤿 나영이 특전사 재정비 중! (${leftSec}초 후 출격 가능)`);
    return;
  }

  const activeSubs = submarines.filter(s => s.strippingTimer === 0);
  if (activeSubs.length === 0) {
    showToast('🤿 봉쇄할 적 잠수함이 수중에 없습니다!');
    return;
  }

  // 가장 위협적인(고단계 우선, 동일 단계면 함선과 가까운) 잠수함을 목표물로 포착
  let targetSub = activeSubs[0];
  let bestScore = -999999;
  activeSubs.forEach(s => {
    const dist = Math.hypot(s.x - ship.x, s.y - waterY);
    const priority = s.level * 1000 - dist;
    if (priority > bestScore) {
      bestScore = priority;
      targetSub = s;
    }
  });

  lastSpecialTime = now;
  playDropSound(1);
  speakRobotLine('나영이 특전사 투입', 1);
  createEffect(ship.x, waterY - 8, '#34d399', 22, '🤿 나영이 특전사 다이빙!', '🛡️ 특수작전 개시 (5초 방어)');

  commandoUnits.push({
    x: ship.x,
    y: waterY - 12,
    vx: 0,
    vy: 2.5,
    targetSub,
    state: 'diving', // 'diving' -> 'clinging' -> 'returning'
    clingTimer: 300, // 60fps 기준 5초(300프레임) 동안 발사관 차단
    swimPhase: 0
  });
}

const CURRENT_LAYERS = [
  { name: '표층 난류 (동쪽 강류 →)',   vx:  1.45, color: 'rgba(186, 230, 253, 0.22)' },
  { name: '중상층 해류 (← 서쪽 역류)', vx: -1.15, color: 'rgba(125, 211, 252, 0.18)' },
  { name: '중하층 해류 (동쪽 완류 →)', vx:  0.85, color: 'rgba(56, 189, 248, 0.16)' },
  { name: '심층 저류 (← 서쪽 급류)',   vx: -1.75, color: 'rgba(14, 165, 233, 0.20)' }
];
let currentStreams = [];

function getWaterLayerIndex(y) {
  const depthRatio = Math.max(0, Math.min(0.999, (y - waterY) / Math.max(1, H - waterY)));
  return Math.floor(depthRatio * CURRENT_LAYERS.length);
}

function getCurrentVxAtDepth(y) {
  if (y <= waterY) return 0;
  const idx = getWaterLayerIndex(y);
  return CURRENT_LAYERS[idx].vx;
}

function buildCurrentStreams() {
  currentStreams = [];
  const waterH = Math.max(100, H - waterY);
  const bandH = waterH / CURRENT_LAYERS.length;
  CURRENT_LAYERS.forEach((layer, idx) => {
    const count = 9;
    for (let i = 0; i < count; i++) {
      currentStreams.push({
        x: Math.random() * W,
        y: waterY + idx * bandH + 14 + Math.random() * Math.max(10, bandH - 28),
        len: 32 + Math.random() * 48,
        layerIdx: idx
      });
    }
  });
}

function togglePause() {
  if (ship.isDestroyed) return;

  const overlay = document.getElementById('pauseBox');

  if (isPaused) {
    pauseStartTime = Date.now();

      btn.classList.add('paused-active');
    }
    if (overlay) overlay.style.display = 'flex';
    if ('speechSynthesis' in window) {
      try { window.speechSynthesis.pause(); } catch (e) {}
    }
  } else {
    const pausedDuration = Date.now() - pauseStartTime;
    for (let i = 0; i < lastFireTime.length; i++) {
      if (lastFireTime[i] > 0) lastFireTime[i] += pausedDuration;
    }
    if (lastSpecialTime > 0) lastSpecialTime += pausedDuration;

    }
    if (overlay) overlay.style.display = 'none';
    if ('speechSynthesis' in window) {

    }
  }
}

window.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  if (e.code === 'Backspace') {
    e.preventDefault();
    togglePause();
    return;
  }

  if (isPaused) return;

  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); fireWeapon(0); }
  else if (e.code === 'KeyA') { e.preventDefault(); fireWeapon(1); }
  else if (e.code === 'KeyS') { e.preventDefault(); fireWeapon(2); }
  else if (e.code === 'KeyD') { e.preventDefault(); fireWeapon(3); }
  else if (e.code === 'KeyW') { e.preventDefault(); fireWeapon(4); }
  else if (e.code === 'KeyQ') { e.preventDefault(); deployNayoungCommando(); }
  else if (e.key === '1') selectWeapon(0);
  else if (e.key === '2') selectWeapon(1);
  else if (e.key === '3') selectWeapon(2);
  else if (e.key === '4') selectWeapon(3);
  else if (e.key === '5') selectWeapon(4);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

/* ==================== 업데이트 루프 ==================== */
function update() {
  if (isPaused) return;

  waveTick += 0.04;
  if (shakeTime > 0) shakeTime--;
  if (ship.hitFlash > 0) ship.hitFlash--;
  updateWeaponCooldownUI();

  // 대기열 자동 순차 출격
  if (autoDeployCooldown > 0) autoDeployCooldown--;
  if (spawnQueue.length > 0 && submarines.length < 5 && autoDeployCooldown === 0) {
    launchNextFromQueue();
    autoDeployCooldown = 130;
  }

  // 아군 구축함 이동 (방향키 전용: A/D 무기 단축키와 충돌 방지)
  if (!ship.isDestroyed) {
    if (keys['ArrowLeft']) ship.vx = -ship.speed;
    else if (keys['ArrowRight']) ship.vx = ship.speed;
    else ship.vx *= 0.85;

    ship.x += ship.vx;
    ship.x = Math.max(85, Math.min(W - 85, ship.x));
  }

  // 수중 기포 (조류에 약간 휩쓸리며 상승)
  bubbles.forEach(b => {
    b.y -= b.vy;
    b.x += getCurrentVxAtDepth(b.y) * 0.35;
    if (b.x > W) b.x -= W;
    if (b.x < 0) b.x += W;
    if (b.y < waterY + 5) { b.y = H - 20; b.x = Math.random() * W; }
  });

  // 수중 조류 흐름선 애니메이션 업데이트
  currentStreams.forEach(st => {
    const layer = CURRENT_LAYERS[st.layerIdx];
    st.x += layer.vx * 1.4;
    if (layer.vx > 0 && st.x - st.len > W) st.x = -st.len;
    if (layer.vx < 0 && st.x + st.len < 0) st.x = W + st.len;
  });

  // 격침된 진상 잔해(포식 구역) 업데이트
  for (let i = carcassFeedZones.length - 1; i >= 0; i--) {
    const cz = carcassFeedZones[i];
    cz.timer--;
    cz.y = Math.min(H - 26, cz.y + 0.35);
    cz.x += getCurrentVxAtDepth(cz.y) * 0.25;
    if (cz.timer <= 0) {
      carcassFeedZones.splice(i, 1);
    }
  }

  // 수중 생물군 AI 업데이트 (빈사 상태의 진상 포위 방해 + 격침 잔해 포식)
  const criticalSubs = submarines.filter(s => s.strippingTimer === 0 && (s.hp / s.maxHp) < 0.3);
  submarines.forEach(s => { s.swarmCount = 0; });

  seaCreatures.forEach(c => {
    c.orbitAngle += 0.065;
    if (c.biteTimer > 0) c.biteTimer--;

    let targetSub = null;
    let minSubDist = 99999;
    criticalSubs.forEach(s => {
      const d = Math.hypot(s.x - c.x, s.y - c.y);
      if (d < minSubDist) {
        minSubDist = d;
        targetSub = s;
      }
    });

    if (targetSub) {
      c.state = 'swarm';
      const orbitR = targetSub.w * 0.48 + 14;
      const destX = targetSub.x + Math.cos(c.orbitAngle) * orbitR;
      const destY = targetSub.y + Math.sin(c.orbitAngle) * (targetSub.h * 0.72 + 12);
      const dx = destX - c.x;
      const dy = destY - c.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 4) {
        const chaseSpd = c.baseSpeed * 2.1;
        c.vx = (dx / dist) * chaseSpd;
        c.vy = (dy / dist) * chaseSpd;
      } else {
        c.vx = -Math.sin(c.orbitAngle) * 2.4;
        c.vy = Math.cos(c.orbitAngle) * 1.8;
      }
      c.x += c.vx;
      c.y += c.vy;

      if (Math.hypot(targetSub.x - c.x, targetSub.y - c.y) < targetSub.w * 0.75) {
        targetSub.swarmCount++;
      }
    } else if (carcassFeedZones.length > 0) {
      c.state = 'feast';
      const cz = carcassFeedZones[0];
      const orbitR = 26 + (c.id % 4) * 10;
      const destX = cz.x + Math.cos(c.orbitAngle * 1.4) * orbitR;
      const destY = cz.y + Math.sin(c.orbitAngle * 1.4) * 16;
      const dx = destX - c.x;
      const dy = destY - c.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 5) {
        c.vx = (dx / dist) * (c.baseSpeed * 2.2);
        c.vy = (dy / dist) * (c.baseSpeed * 2.2);
      } else {
        c.vx = (Math.random() - 0.5) * 3.5;
        c.vy = (Math.random() - 0.5) * 2.5;
        if (c.biteTimer === 0) {
          c.biteTimer = 28;
          particles.push({
            x: cz.x + (Math.random() - 0.5) * 24,
            y: cz.y + (Math.random() - 0.5) * 12,
            vx: (Math.random() - 0.5) * 2.2,
            vy: -1.2 - Math.random(),
            r: 3.5,
            color: '#fbbf24',
            alpha: 0.9,
            isSmoke: false
          });
        }
      }
      c.x += c.vx;
      c.y += c.vy;
    } else {
      c.state = 'roam';
      const curVx = getCurrentVxAtDepth(c.y);
      const dir = c.vx >= 0 ? 1 : -1;
      c.vx = dir * c.baseSpeed;
      c.vy = Math.sin(waveTick + c.id) * 0.35;
      c.x += c.vx + curVx * 0.45;
      c.y += c.vy;
      if (c.vx > 0 && c.x > W + 90) c.x = -90;
      if (c.vx < 0 && c.x < -90) c.x = W + 90;
    }

    c.y = Math.max(waterY + 25, Math.min(H - 22, c.y));
  });

  // 1) 아군 투하 무기 업데이트 (깊이에 따른 조류 흐름 물리 적용)
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life--;

    const streamVx = getCurrentVxAtDepth(p.y);

    if (p.type === 0) {
      p.vy = Math.min(6.2, p.vy + 0.07);
      p.vx = Math.sin(p.life * 0.2) * 0.65 + streamVx * 0.85;
    } else if (p.type === 1) {
      p.vy = 7.4;
      p.vx = streamVx * 0.45;
    } else if (p.type === 2) {
      p.vy = Math.min(8.8, p.vy + 0.16);
      p.vx = streamVx * 0.35;
      p.rot += 0.12;
    } else if (p.type === 3) {
      p.vy = Math.min(7.8, p.vy + 0.12);
      p.vx = streamVx * 0.6;
    } else if (p.type === 4) {
      let nearest = null, minDist = 99999;
      submarines.forEach(s => {
        if (s.strippingTimer > 0) return;
        const d = Math.hypot(s.x - p.x, s.y - p.y);
        if (d < minDist) { minDist = d; nearest = s; }
      });
      if (nearest) {
        const ang = Math.atan2(nearest.y - p.y, nearest.x - p.x);
        p.vx += Math.cos(ang) * 0.58 + streamVx * 0.08;
        p.vy += Math.sin(ang) * 0.58;
        const spd = Math.hypot(p.vx, p.vy);
        if (spd > 7.4) { p.vx = (p.vx / spd) * 7.4; p.vy = (p.vy / spd) * 7.4; }
        p.rot = Math.atan2(p.vy, p.vx) - Math.PI / 2;
      } else {
        p.vy += 0.1;
        p.vx += streamVx * 0.12;
      }
      if (Math.random() < 0.7) {
        particles.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*0.6, vy: -0.6, r: 3, color: '#fca5a5', alpha: 0.9, isSmoke: false });
      }
    }

    p.x += p.vx;
    p.y += p.vy;

    // 적 역습 폭탄 수중 요격 판정
    let intercepted = false;
    for (let k = enemyBombs.length - 1; k >= 0; k--) {
      const eb = enemyBombs[k];
      if (Math.hypot(p.x - eb.x, p.y - eb.y) < 23) {
        intercepted = true;
        enemyBombs.splice(k, 1);
        score += 35;
        const scoreEl = document.getElementById('scoreVal');
        if (scoreEl) scoreEl.textContent = score;
        playImpactSound(false);
        createEffect(eb.x, eb.y, '#38bdf8', 16, '', '🛡️ 역습 폭탄 요격! +35');
        break;
      }
    }
    if (intercepted) {
      projectiles.splice(i, 1);
      continue;
    }

    let hitRock = false;
    for (const r of seabedRocks) {
      if (Math.abs(p.x - r.x) < r.w * 0.42 && p.y > H - r.h * 0.75) {
        hitRock = true;
        break;
      }
    }
    if (hitRock || p.y > H - 15 || p.life <= 0) {
      createEffect(p.x, p.y, '#94a3b8', 8);
      projectiles.splice(i, 1);
      continue;
    }

    // 진상 잠수함 명중 판정
    let hitSub = false;
    for (let j = submarines.length - 1; j >= 0; j--) {
      const s = submarines[j];
      if (s.strippingTimer > 0) continue;
      if (Math.abs(p.x - s.x) < s.w * 0.52 && Math.abs(p.y - s.y) < s.h * 0.62) {
        hitSub = true;
        s.hitFlash = 8;

        const wInfo = WEAPONS[p.type];
        const robotScream = `${s.name} ${wInfo.scream}`;
        playWeaponEmotionalVoice(s.name, p.type);

        if (p.type === 4) {
          s.strippingTimer = 75;
          s.strippedLayers = 0;
          shakeTime = 12;
          playImpactSound(false);
          createEffect(p.x, p.y, '#f43f5e', 25, robotScream, '🚀 어뢰 직격!! 선체 분해!');
        } else {
          s.hp = Math.max(0, s.hp - p.dmg);
          if (p.type === 0) {
            s.slowTimer = 300;
            createEffect(p.x, p.y, '#854d0e', 18, robotScream, `-${p.dmg} (속도저하!)`);
            playImpactSound(false);
          } else if (p.type === 1) {
            s.smokeTimer = 360;
            createEffect(p.x, p.y, '#e2e8f0', 22, robotScream, `-${p.dmg} (연기폴폴!)`);
            playImpactSound(false);
          } else if (p.type === 2) {
            s.spinTimer = 210;
            createEffect(p.x, p.y, '#94a3b8', 24, robotScream, `-${p.dmg} (빙글빙글!)`);
            playImpactSound(false);
          } else if (p.type === 3) {
            shakeTime = 16;
            createEffect(p.x, p.y, '#ef4444', 42, robotScream, `-${p.dmg} 대폭발!!`);
            playImpactSound(true);
          }

          if (s.hp <= 0) {
            destroySubmarine(j, false);
          }
        }
        break;
      }
    }
    if (hitSub) {
      projectiles.splice(i, 1);
    }
  }

  // 2) 진상 잠수함 이동 (조류 영향 + HP 30% 미만 생물 포위 방해) & 단계별 폭탄 발사
  for (let i = submarines.length - 1; i >= 0; i--) {
    const s = submarines[i];
    if (s.hitFlash > 0) s.hitFlash--;
    if (s.sealedTimer > 0) s.sealedTimer--;

    if (s.strippingTimer > 0) {
      s.strippingTimer--;
      s.x += (Math.random() - 0.5) * 6;
      s.y += (Math.random() - 0.5) * 4;
      if (s.strippingTimer % 14 === 0 && s.strippedLayers < 4) {
        s.strippedLayers++;
        spawnHullArmorPeel(s, s.strippedLayers);
        playImpactSound(false);
        createEffect(s.x, s.y, '#fbbf24', 12);
      }
      if (s.strippingTimer <= 0) {
        destroySubmarine(i, true);
      }
      continue;
    }

    // 단계가 높을수록 발사 횟수(연사 수), 주기, 탄속 상승 (나영이 특전사가 발사관을 막고 있으면 공격 불가)
    if (s.spinTimer <= 0 && s.sealedTimer <= 0 && !ship.isDestroyed) {
      s.fireCooldown--;
      if (s.fireCooldown <= 0 && s.x > 60 && s.x < W - 60) {
        const slowFactor = s.slowTimer > 0 ? 1.55 : 1.0;
        const swarmPenalty = s.swarmCount > 0 ? 1.35 : 1.0;
        s.fireCooldown = Math.floor((s.spec.fireIntervalMin + Math.random() * s.spec.fireIntervalVar) * slowFactor * swarmPenalty);
        playEnemyBombSound(s.level);

        const count = s.spec.burstCount;
        for (let b = 0; b < count; b++) {
          const spreadVx = count === 1 ? 0 : (b - (count - 1) / 2) * 1.15;
          enemyBombs.push({
            x: s.x + (b - (count - 1) / 2) * 18,
            y: s.y - s.h * 0.5,
            vx: spreadVx,
            vy: -(s.spec.bombSpeed + Math.random() * 0.6),
            dmg: s.spec.bombDmg,
            level: s.level,
            shooter: s.name
          });
        }
      }
    }

    let curSpeed = s.baseSpeed;
    if (s.slowTimer > 0) { s.slowTimer--; curSpeed *= 0.45; }
    if (s.spinTimer > 0) { s.spinTimer--; s.spinAngle += 0.24; curSpeed *= 0.45; }
    else { s.spinAngle = 0; }

    // 체력 30% 미만 시 몰려든 수중 생물군에 의해 이동 속도 및 조향 크게 방해
    if (s.swarmCount > 0) {
      const dragFactor = Math.max(0.28, 1 - s.swarmCount * 0.14);
      curSpeed *= dragFactor;
      s.y += Math.sin(waveTick * 4 + i) * 1.1;
      s.y = Math.max(waterY + 45, Math.min(H - 65, s.y));
    }

    if (s.smokeTimer > 0) {
      s.smokeTimer--;
      if (s.smokeTimer % 4 === 0) {
        particles.push({
          x: s.x + (Math.random() - 0.5) * 40,
          y: s.y - 12,
          vx: (Math.random() - 0.5) * 0.8,
          vy: -1.4 - Math.random() * 0.8,
          r: 6 + Math.random() * 7,
          color: '#334155',
          alpha: 0.85,
          isSmoke: true
        });
      }
    }

    // 잠수함 추진 속도 + 해당 수심 조류의 흐름 합산
    const streamVx = getCurrentVxAtDepth(s.y);
    s.x += s.dir * curSpeed + streamVx * 0.55;
    s.bobPhase += 0.05;

    if (s.dir > 0 && s.x > W + 165) s.dir = -1;
    else if (s.dir < 0 && s.x < -165) s.dir = 1;
  }

  // 2-1) 나영이 특전사 침투 & 5초간 발사관 봉쇄 업데이트
  for (let i = commandoUnits.length - 1; i >= 0; i--) {
    const cm = commandoUnits[i];
    cm.swimPhase += 0.25;

    // 목표 잠수함이 격침되었거나 선체 분해 중이면 다른 활성 잠수함으로 즉시 환승
    if (!cm.targetSub || !submarines.includes(cm.targetSub) || cm.targetSub.strippingTimer > 0) {
      const nextTarget = submarines.find(s => s.strippingTimer === 0);
      if (nextTarget && cm.clingTimer > 0) {
        cm.targetSub = nextTarget;
        cm.state = 'diving';
      } else {
        cm.state = 'returning';
      }
    }

    if (cm.state === 'diving') {
      const destX = cm.targetSub.x + cm.targetSub.dir * 12;
      const destY = cm.targetSub.y - cm.targetSub.h * 0.45;
      const dx = destX - cm.x;
      const dy = destY - cm.y;
      const dist = Math.hypot(dx, dy);

      if (dist < 18) {
        cm.state = 'clinging';
        cm.targetSub.sealedTimer = cm.clingTimer;
        playImpactSound(false);
        createEffect(cm.x, cm.y, '#10b981', 20, '🤿 발사관 봉쇄 완료!', '🔒 5초간 적 폭격 차단!');
      } else {
        const spd = 9.2;
        cm.x += (dx / dist) * spd;
        cm.y += (dy / dist) * spd;
        if (Math.random() < 0.6) {
          particles.push({
            x: cm.x,
            y: cm.y,
            vx: (Math.random() - 0.5) * 1.2,
            vy: -1.0,
            r: 3,
            color: '#6ee7b7',
            alpha: 0.85,
            isSmoke: false
          });
        }
      }
    } else if (cm.state === 'clinging') {
      cm.clingTimer--;
      cm.targetSub.sealedTimer = cm.clingTimer;
      cm.x = cm.targetSub.x + cm.targetSub.dir * 10;
      cm.y = cm.targetSub.y - cm.targetSub.h * 0.48 + Math.sin(cm.targetSub.bobPhase) * 3;

      if (cm.clingTimer <= 0) {
        cm.state = 'returning';
        createEffect(cm.x, cm.y, '#34d399', 14, '🤿 작전 완료! 함선 복귀!', '');
      }
    } else if (cm.state === 'returning') {
      const dx = ship.x - cm.x;
      const dy = (waterY - 6) - cm.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 18 || cm.y <= waterY) {
        commandoUnits.splice(i, 1);
      } else {
        cm.x += (dx / dist) * 8.5;
        cm.y += (dy / dist) * 8.5;
      }
    }
  }

  // 3) 진상 수중 폭탄 업데이트 (조류에 밀리며 상승)
  for (let i = enemyBombs.length - 1; i >= 0; i--) {
    const eb = enemyBombs[i];
    const streamVx = getCurrentVxAtDepth(eb.y);
    eb.x += eb.vx + streamVx * 0.5;
    eb.y += eb.vy;

    if (Math.random() < 0.55) {
      particles.push({
        x: eb.x + (Math.random() - 0.5) * 4,
        y: eb.y + 10,
        vx: 0,
        vy: 0.6,
        r: 2.5 + eb.level * 0.4,
        color: eb.level >= 3 ? '#f87171' : '#fde047',
        alpha: 0.78,
        isSmoke: false
      });
    }

    if (eb.y <= waterY + 4) {
      if (!ship.isDestroyed && Math.abs(eb.x - ship.x) < 74) {
        ship.hp = Math.max(0, ship.hp - eb.dmg);
        ship.hitFlash = 12;
        shakeTime = 14;
        updateShipHpUI();
        speakRobotLine(`${eb.shooter} 명중`, 3);
        createEffect(eb.x, waterY - 12, '#ef4444', 28, `${eb.shooter} [${eb.level}단계] 폭격 명중!`, `💥 선체 피격! -${eb.dmg}HP`);

        if (ship.hp <= 0) {
          ship.isDestroyed = true;
          const goBox = document.getElementById('gameOverBox');
          if (goBox) goBox.style.display = 'flex';
        }
      } else {
        playImpactSound(false);
        createEffect(eb.x, waterY, '#bae6fd', 14);
      }
      enemyBombs.splice(i, 1);
    }
  }

  for (let i = hullDebris.length - 1; i >= 0; i--) {
    const d = hullDebris[i];
    d.x += d.vx + getCurrentVxAtDepth(d.y) * 0.3;
    d.y += d.vy;
    d.rot += d.vRot;
    d.alpha -= 0.014;
    if (d.alpha <= 0) hullDebris.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    if (pt.isSmoke) { pt.r += 0.15; pt.alpha -= 0.015; }
    else { pt.alpha -= 0.024; }
    if (pt.alpha <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy;
    ft.alpha -= 0.011;
    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  }
}

function destroySubmarine(idx, isMega = false) {
  const s = submarines[idx];
  kills++;
  const pts = s.spec.score * (isMega ? 2 : 1);
  score += pts;
  const killEl = document.getElementById('killCnt');
  const scoreEl = document.getElementById('scoreVal');
  if (killEl) killEl.textContent = kills;
  if (scoreEl) scoreEl.textContent = score;
  shakeTime = isMega ? 26 : 18;
  playImpactSound(true);

  const exitScream = `${s.name} 꺼져라`;
  if (!isMega) {
    playWeaponEmotionalVoice(s.name, 4);
  }

  // 격침된 자리에 수중 생물들이 모여들어 잔해를 뜯어먹는 포식 구역 생성
  carcassFeedZones.push({
    x: s.x,
    y: s.y,
    name: s.name,
    color: s.spec.hullColor,
    timer: 320
  });

  createEffect(s.x, s.y, '#ef4444', isMega ? 70 : 45, exitScream, `💥 [${s.level}단계 ${s.name}] 격침! +${pts}점 (생물떼 포식 시작!)`);
  submarines.splice(idx, 1);
}

/* ==================== 그리기 렌더링 ==================== */
function draw() {
  ctx.save();
  if (shakeTime > 0) {
    ctx.translate((Math.random() - 0.5) * 11, (Math.random() - 0.5) * 11);
  }

  // 밤하늘 배경
  const skyGrad = ctx.createLinearGradient(0, 0, 0, waterY);
  skyGrad.addColorStop(0, '#0f172a');
  skyGrad.addColorStop(0.6, '#1e3a8a');
  skyGrad.addColorStop(1, '#38bdf8');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, waterY);

  ctx.fillStyle = 'rgba(254, 240, 138, 0.85)';
  ctx.beginPath();
  ctx.arc(W - 140, 50, 23, 0, Math.PI * 2);
  ctx.fill();

  // 수중 다층 그라데이션 배경
  const seaGrad = ctx.createLinearGradient(0, waterY, 0, H);
  seaGrad.addColorStop(0, '#0284c7');
  seaGrad.addColorStop(0.35, '#0369a1');
  seaGrad.addColorStop(0.7, '#075985');
  seaGrad.addColorStop(1, '#082f49');
  ctx.fillStyle = seaGrad;
  ctx.fillRect(0, waterY, W, H - waterY);

  // 깊이별 4층 조류 구분선 및 해류 가이드 라벨 표시
  const waterH = Math.max(100, H - waterY);
  const bandH = waterH / CURRENT_LAYERS.length;
  CURRENT_LAYERS.forEach((layer, idx) => {
    const topY = waterY + idx * bandH;
    if (idx > 0) {
      ctx.save();
      ctx.strokeStyle = 'rgba(186, 230, 253, 0.16)';
      ctx.setLineDash([8, 8]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, topY);
      ctx.lineTo(W, topY);
      ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(224, 242, 254, 0.42)';
    ctx.font = '700 10.5px "Malgun Gothic", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`〰 ${layer.name}`, 12, topY + 15);
  });

  // 조류 흐름 물결 화살표 라인 렌더링
  currentStreams.forEach(st => {
    const layer = CURRENT_LAYERS[st.layerIdx];
    ctx.strokeStyle = layer.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(st.x, st.y);
    ctx.lineTo(st.x + st.len, st.y);
    const tipX = layer.vx > 0 ? st.x + st.len : st.x;
    const dir = layer.vx > 0 ? -1 : 1;
    ctx.lineTo(tipX + dir * 6, st.y - 3.5);
    ctx.moveTo(tipX, st.y);
    ctx.lineTo(tipX + dir * 6, st.y + 3.5);
    ctx.stroke();
  });

  // 수중 기포
  ctx.fillStyle = 'rgba(224, 242, 254, 0.35)';
  bubbles.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // 격침된 진상 잔해 포식 구역 그리기
  carcassFeedZones.forEach(cz => {
    ctx.save();
    ctx.translate(cz.x, cz.y);
    ctx.globalAlpha = Math.min(1, cz.timer / 60);
    ctx.fillStyle = '#1e293b';
    ctx.strokeStyle = cz.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-26, 6);
    ctx.lineTo(-10, -8);
    ctx.lineTo(8, 2);
    ctx.lineTo(24, -6);
    ctx.lineTo(20, 10);
    ctx.lineTo(-22, 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#fde047';
    ctx.font = '800 10.5px "Malgun Gothic", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`🐟 [${cz.name}] 잔해 포식 중!`, 0, -14);
    ctx.restore();
  });

  // 수중 생물군 그리기 (상어, 아귀, 문어, 게, 뱀장어)
  seaCreatures.forEach(c => drawSeaCreature(c));

  // 해저 지형 & 해초 & 바위
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, H - 16, W, 16);

  seaweeds.forEach(sw => {
    const sway = Math.sin(waveTick + sw.phase) * 10;
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sw.x, H - 12);
    ctx.quadraticCurveTo(sw.x + sway, H - 12 - sw.h * 0.5, sw.x - sway * 0.6, H - 12 - sw.h);
    ctx.stroke();
  });

  seabedRocks.forEach(r => {
    ctx.fillStyle = '#334155';
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(r.x - r.w * 0.5, H - 10);
    ctx.lineTo(r.x - r.w * 0.3, H - r.h);
    ctx.lineTo(r.x + r.w * 0.15, H - r.h * 0.9);
    ctx.lineTo(r.x + r.w * 0.5, H - 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });

  if (!ship.isDestroyed) {
    drawDestroyer(ship.x, waterY + Math.sin(waveTick * 1.5) * 3);
  }

  submarines.forEach(s => drawSubmarine(s));

  commandoUnits.forEach(cm => drawNayoungCommando(cm));

  hullDebris.forEach(d => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, d.alpha);
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    ctx.fillStyle = d.color;
    ctx.strokeStyle = '#fde047';
    ctx.lineWidth = 1.5;
    ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
    ctx.strokeRect(-d.w / 2, -d.h / 2, d.w, d.h);
    ctx.restore();
  });

  projectiles.forEach(p => drawProjectile(p));
  enemyBombs.forEach(eb => drawEnemyBomb(eb));

  // 해수면 파도선
  ctx.strokeStyle = '#bae6fd';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 20) {
    const wy = waterY + Math.sin(x * 0.025 + waveTick * 2) * 3.5;
    if (x === 0) ctx.moveTo(x, wy);
    else ctx.lineTo(x, wy);
  }
  ctx.stroke();

  particles.forEach(pt => {
    ctx.globalAlpha = Math.max(0, pt.alpha);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  floatingTexts.forEach(ft => {
    ctx.globalAlpha = Math.max(0, Math.min(1, ft.alpha));
    ctx.font = ft.isScream ? '900 19px "Malgun Gothic", sans-serif' : '900 14.5px "Malgun Gothic", sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 4;
    ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillStyle = ft.isScream ? '#ffffff' : '#fde047';
    ctx.fillText(ft.text, ft.x, ft.y);
  });
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawSeaCreature(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  const facing = c.vx >= 0 ? 1 : -1;
  ctx.scale(facing, 1);

  const isHunting = c.state === 'swarm' || c.state === 'feast';
  ctx.globalAlpha = isHunting ? 0.96 : 0.72;
  const wag = Math.sin(waveTick * (isHunting ? 4.5 : 2) + c.id) * 4;

  if (c.kind === 'shark') {
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, c.size, c.size * 0.36, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-2, -c.size * 0.3);
    ctx.lineTo(-10, -c.size * 0.72);
    ctx.lineTo(6, -c.size * 0.3);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-c.size * 0.85, 0);
    ctx.lineTo(-c.size * 1.35, -c.size * 0.38 + wag);
    ctx.lineTo(-c.size * 1.35, c.size * 0.38 + wag);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = isHunting ? '#ef4444' : '#ffffff';
    ctx.beginPath();
    ctx.arc(c.size * 0.55, -3, 2.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (c.kind === 'octopus') {
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.arc(0, -4, c.size * 0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = c.accent;
    ctx.lineWidth = 3;
    for (let t = -2; t <= 2; t++) {
      ctx.beginPath();
      ctx.moveTo(t * 4, 4);
      ctx.quadraticCurveTo(t * 7 + wag, 14, t * 5 - wag, 22);
      ctx.stroke();
    }
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(4, -5, 2.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (c.kind === 'crab') {
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.ellipse(0, 2, c.size * 0.55, c.size * 0.38, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = c.accent;
    ctx.beginPath();
    ctx.arc(c.size * 0.58, -6 + wag * 0.4, 5.5, 0, Math.PI * 2);
    ctx.arc(-c.size * 0.58, -6 - wag * 0.4, 5.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (c.kind === 'angler') {
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.arc(0, 0, c.size * 0.48, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fef08a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(4, -c.size * 0.42);
    ctx.quadraticCurveTo(14, -c.size * 0.85, 18, -c.size * 0.45);
    ctx.stroke();
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(18, -c.size * 0.45, 3.5, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.strokeStyle = c.color;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-c.size, wag);
    ctx.quadraticCurveTo(-c.size * 0.3, -wag, c.size * 0.3, wag);
    ctx.lineTo(c.size, 0);
    ctx.stroke();
    ctx.fillStyle = c.accent;
    ctx.beginPath();
    ctx.arc(c.size * 0.85, -2, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawDestroyer(x, y) {
  ctx.save();
  ctx.translate(x, y);

  const bw = 90;
  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  ctx.fillRect(-bw / 2, -68, bw, 7);
  ctx.fillStyle = ship.hp > 30 ? '#34d399' : '#ef4444';
  ctx.fillRect(-bw / 2, -68, bw * (ship.hp / ship.maxHp), 7);

  ctx.fillStyle = ship.hitFlash > 0 ? '#fca5a5' : '#cbd5e1';
  ctx.fillRect(-26, -34, 48, 18);
  ctx.fillStyle = '#94a3b8';
  ctx.fillRect(-14, -46, 22, 12);
  ctx.strokeStyle = '#f8fafc';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-3, -46); ctx.lineTo(-3, -58);
  ctx.moveTo(-12, -55); ctx.lineTo(6, -55);
  ctx.stroke();

  ctx.fillStyle = '#475569';
  ctx.fillRect(32, -23, 18, 8);
  ctx.fillRect(-48, -23, 16, 8);

  ctx.fillStyle = ship.hitFlash > 0 ? '#fecaca' : '#e2e8f0';
  ctx.beginPath();
  ctx.moveTo(-76, -16);
  ctx.lineTo(82, -16);
  ctx.lineTo(66, 6);
  ctx.lineTo(-64, 6);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#dc2626';
  ctx.fillRect(-64, 2, 130, 4);

  ctx.fillStyle = '#0f172a';
  ctx.font = '900 11.5px "Malgun Gothic", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('23시 하오동', 2, -2);

  ctx.restore();
}

function drawEnemyBomb(eb) {
  ctx.save();
  ctx.translate(eb.x, eb.y);
  const r = 6 + eb.level * 1.4;
  ctx.fillStyle = eb.level === 4 ? '#ef4444' : eb.level === 3 ? '#a855f7' : eb.level === 2 ? '#3b82f6' : '#10b981';
  ctx.strokeStyle = '#fef08a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#fef08a';
  ctx.beginPath();
  ctx.moveTo(0, -r - 6);
  ctx.lineTo(4, -r + 1);
  ctx.lineTo(-4, -r + 1);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawSubmarine(s) {
  ctx.save();
  const by = s.y + Math.sin(s.bobPhase) * 3;
  ctx.translate(s.x, by);

  ctx.save();
  if (s.spinTimer > 0) {
    ctx.rotate(s.spinAngle);
  }

  if (s.strippedLayers < 1) {
    ctx.save();
    ctx.scale(s.dir, 1);
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(6, -s.h * 0.45);
    ctx.lineTo(6, -s.h * 0.85);
    ctx.lineTo(15, -s.h * 0.85);
    ctx.stroke();

    ctx.fillStyle = s.hitFlash > 0 ? '#ffffff' : s.spec.towerColor;
    ctx.fillRect(-16, -s.h * 0.68, 32, s.h * 0.35);

    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(-s.w * 0.54, -8, 7, 16);
    ctx.restore();
  }

  if (s.strippedLayers > 0) {
    ctx.fillStyle = '#334155';
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-s.w * 0.46, -s.h * 0.38, s.w * 0.92, s.h * 0.76, 12);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(-35, -6, 70, 12);
  }

  if (s.strippedLayers < 4) {
    const hullColor = s.hitFlash > 0 ? '#ffffff' : s.spec.hullColor;
    const strokeColor = s.spec.strokeColor;
    const shrink = s.strippedLayers * 18;

    ctx.fillStyle = hullColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.roundRect(-s.w * 0.5 + shrink, -s.h * 0.45, Math.max(20, s.w - shrink * 2), s.h * 0.9, 18);
    ctx.fill();
    ctx.stroke();
  }

  if (s.slowTimer > 0) {
    ctx.fillStyle = '#713f12';
    ctx.beginPath();
    ctx.arc(-22, -4, 9, 0, Math.PI * 2);
    ctx.arc(24, 5, 8, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = '#ffffff';
  ctx.font = '900 12.5px "Malgun Gothic", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`[${s.level}단] ${s.name}`, 0, 1);

  ctx.restore();

  if (s.strippingTimer === 0) {
    const bw = 82;
    const barY = -s.h * 0.95 - 12;
    const isCritical = (s.hp / s.maxHp) < 0.3;

    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx.fillRect(-bw / 2, barY, bw, 7);
    ctx.fillStyle = isCritical ? '#ef4444' : s.spec.strokeColor;
    ctx.fillRect(-bw / 2, barY, bw * (s.hp / s.maxHp), 7);

    ctx.font = '800 10.5px Consolas, sans-serif';
    ctx.fillStyle = isCritical ? '#fca5a5' : '#fef08a';
    ctx.textAlign = 'center';
    const warnTag = s.sealedTimer > 0
      ? ` 🔒봉쇄(${(s.sealedTimer / 60).toFixed(1)}s)`
      : (isCritical ? ' 🦈포위중!' : '');
    ctx.fillText(`${s.hp}/${s.maxHp}${warnTag}`, 0, barY - 3);
  }

  ctx.restore();
}

// 나영이 특전사 캐릭터 & 발사관 봉쇄 쉴드 렌더링
function drawNayoungCommando(cm) {
  ctx.save();
  ctx.translate(cm.x, cm.y);

  // 잠수함 발사관에 달라붙어 봉쇄 중일 때 녹색 방어막 표시
  if (cm.state === 'clinging' && cm.targetSub) {
    const pulse = 1 + Math.sin(cm.swimPhase * 1.5) * 0.08;
    ctx.strokeStyle = 'rgba(52, 211, 153, 0.85)';
    ctx.fillStyle = 'rgba(16, 185, 129, 0.16)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(0, 14, (cm.targetSub.w * 0.56) * pulse, (cm.targetSub.h * 0.72) * pulse, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 남은 봉쇄 시간 게이지
    const ratio = Math.max(0, cm.clingTimer / 300);
    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx.fillRect(-26, -24, 52, 5);
    ctx.fillStyle = '#34d399';
    ctx.fillRect(-26, -24, 52 * ratio, 5);
  }

  // 잠수복 몸체 & 오리발
  const kick = Math.sin(cm.swimPhase) * 4;
  ctx.fillStyle = '#065f46';
  ctx.strokeStyle = '#34d399';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.roundRect(-8, -6, 16, 14, 5);
  ctx.fill();
  ctx.stroke();

  // 오리발
  ctx.fillStyle = '#fde047';
  ctx.fillRect(-13, -2 + kick * 0.4, 6, 4);
  ctx.fillRect(-13, 3 - kick * 0.4, 6, 4);

  // 잠수 헬멧 & 수경
  ctx.fillStyle = '#10b981';
  ctx.beginPath();
  ctx.arc(4, -8, 6.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#bae6fd';
  ctx.fillRect(4, -10, 6, 4);

  // 이름표
  ctx.fillStyle = '#ecfdf5';
  ctx.strokeStyle = '#064e3b';
  ctx.lineWidth = 3;
  ctx.font = '900 11px "Malgun Gothic", sans-serif';
  ctx.textAlign = 'center';
  ctx.strokeText('🤿나영이특전사', 0, -29);
  ctx.fillText('🤿나영이특전사', 0, -29);

  ctx.restore();
}

function drawProjectile(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);

  if (p.type === 0) {
    ctx.fillStyle = '#78350f';
    ctx.strokeStyle = '#fde047';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 5, 11, 5, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, 0, 8, 4.5, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, -5, 4.5, 3.5, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  } else if (p.type === 1) {
    ctx.fillStyle = '#e0f2fe';
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 2;
    ctx.fillRect(-5, -12, 10, 20);
    ctx.strokeRect(-5, -12, 10, 20);
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(-4, -4, 8, 11);
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 8); ctx.lineTo(0, 20);
    ctx.stroke();
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(-7, -16, 14, 3);
  } else if (p.type === 2) {
    ctx.fillStyle = '#94a3b8';
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-11, -4);
    ctx.lineTo(-4, -12);
    ctx.lineTo(8, -10);
    ctx.lineTo(13, 1);
    ctx.lineTo(5, 11);
    ctx.lineTo(-9, 9);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  } else if (p.type === 3) {
    ctx.fillStyle = '#0f172a';
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 2, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, -12); ctx.lineTo(5, -18);
    ctx.stroke();
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(6, -19, 4, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = '#dc2626';
    ctx.strokeStyle = '#fef08a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 18);
    ctx.lineTo(7, -10);
    ctx.lineTo(0, -5);
    ctx.lineTo(-7, -10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

resize();
initAmbientLife();
renderQueueUI();
updateShipHpUI();
loop();
</script>
