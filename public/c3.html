<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W = 1280, H = 720, waterY = 135;
function resize() {
  W = canvas.width = canvas.parentElement.clientWidth;
  H = canvas.height = canvas.parentElement.clientHeight;
  waterY = Math.round(H * 0.21);
  buildSeabed();
  buildCurrentStreams();
}
window.addEventListener('resize', resize);

/* ==================== 토스트 안내 메시지 (alert 대체) ==================== */
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toastBox');
  el.textContent = msg;
  el.style.opacity = '1';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1800);
}

/* ==================== 기계음(TTS) & Web Audio 효과음 엔진 ==================== */
let soundOn = true;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function toggleSound() {
  soundOn = !soundOn;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundOn ? '🔊 기계음 ON' : '🔇 기계음 OFF';
  btn.className = soundOn ? 'btn mute' : 'btn';
  if (!soundOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
}

// 기계음 비프 프리앰블 + Web Speech API 로봇/기계음 TTS 발화
function speakRobotVoice(text, weaponType = 0) {
  if (!soundOn) return;

  // 짧은 전자 기계음 비프(합성음)로 로봇 발화 느낌 강화
  try {
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    const baseFreq = weaponType === 4 ? 220 : weaponType === 3 ? 310 : 440;
    osc.frequency.setValueAtTime(baseFreq, now);
    osc.frequency.setValueAtTime(baseFreq * 1.35, now + 0.045);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  } catch (e) {}

  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    const voices = window.speechSynthesis.getVoices().filter(v => v.lang.includes('ko'));
    if (voices.length > 0) {
      utter.voice = voices[0];
    }
    // 기계음 느낌의 또박또박하고 평탄한 피치 및 속도 설정
    utter.pitch = weaponType === 4 ? 0.65 : weaponType === 3 ? 1.35 : 0.82;
    utter.rate = weaponType === 4 ? 1.05 : 1.24;
    utter.volume = 1.0;
    window.speechSynthesis.speak(utter);
  } catch (e) {}
}

function playShipHitTaunt() {
  if (!soundOn) return;
  try {
    initAudio();
    const now = audioCtx.currentTime;
    const notes = [
      { f: 783.99, t: 0.00, d: 0.11 },
      { f: 659.25, t: 0.12, d: 0.11 },
      { f: 880.00, t: 0.24, d: 0.11 },
      { f: 659.25, t: 0.36, d: 0.22 }
    ];
    notes.forEach(n => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(n.f, now + n.t);
      gain.gain.setValueAtTime(0.16, now + n.t);
      gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + n.t); osc.stop(now + n.t + n.d + 0.02);
    });
  } catch (e) {}
}

function playDropSound(wType) {
  if (!soundOn) return;
  try {
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    if (wType === 4) {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.35);
    } else if (wType === 0) {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(95, now + 0.14);
    } else if (wType === 1) {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(780, now);
      osc.frequency.exponentialRampToValueAtTime(260, now + 0.18);
    } else if (wType === 2) {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(170, now);
      osc.frequency.exponentialRampToValueAtTime(55, now + 0.22);
    } else {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(950, now);
      osc.frequency.exponentialRampToValueAtTime(220, now + 0.45);
    }
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.46);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.47);
  } catch (e) {}
}

function playEnemyTorpedoSound(level = 1) {
  if (!soundOn) return;
  try {
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = level >= 3 ? 'sawtooth' : 'square';
    osc.frequency.setValueAtTime(160 + level * 35, now);
    osc.frequency.exponentialRampToValueAtTime(480 + level * 60, now + 0.2);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.21);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.22);
  } catch (e) {}
}

function playImpactSound(isMega) {
  if (!soundOn) return;
  try {
    initAudio();
    const now = audioCtx.currentTime;
    const duration = isMega ? 0.72 : 0.22;
    const bufferSize = Math.floor(audioCtx.sampleRate * duration);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(isMega ? 780 : 380, now);
    filter.frequency.exponentialRampToValueAtTime(38, now + duration);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(isMega ? 0.4 : 0.17, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start(now);
  } catch (e) {}
}

/* ==================== 무기 5종 & 기계음 대사 정의 ==================== */
const WEAPONS = [

  { name: '폭탄',   dmg: 40,  cdMs: 60000, scream: '뒤져라!' },
  { name: '어뢰',   dmg: 999, cdMs: 60000, scream: '꺼져라!' }
];
const lastFireTime = [0, 0, 0, 0, 0];
let currentWeapon = 0;

function selectWeapon(idx) {
  currentWeapon = idx;
  [0, 1, 2, 3, 4].forEach(i => {
    document.getElementById('w' + i).classList.toggle('active', i === idx);
  });
}

function updateWeaponCooldownUI() {
  const now = Date.now();
  WEAPONS.forEach((w, idx) => {
    const elapsed = now - lastFireTime[idx];
    const remainMs = Math.max(0, w.cdMs - elapsed);
    const pct = Math.min(100, (elapsed / w.cdMs) * 100);
    const btn = document.getElementById('w' + idx);
    const bar = document.getElementById('wBar' + idx);
    const sub = document.getElementById('wSub' + idx);

    bar.style.width = pct.toFixed(1) + '%';
    if (remainMs > 0 && idx > 0) {
      btn.classList.add('cooling');
      sub.textContent = `${(remainMs / 1000).toFixed(1)}초`;
    } else {
      btn.classList.remove('cooling');
      if (idx === 0) sub.textContent = '앗 드러워!';
      else if (idx === 1) sub.textContent = '준비 (5초)';
      else if (idx === 2) sub.textContent = '준비 (10초)';
      else sub.textContent = '준비 (60초)';
    }
  });
}

function getWaterCurrentAtY(y) {
  if (y <= waterY) return 0;
  const seaDepth = Math.max(1, (H - 16) - waterY);
  const ratio = Math.max(0, Math.min(0.999, (y - waterY) / seaDepth));
  for (const layer of CURRENT_LAYERS) {
    if (ratio >= layer.ratioStart && ratio < layer.ratioEnd) {
      return layer.vx;
    }
  }
  return 0;
}

function buildCurrentStreams() {
  currentStreams = [];
  const seaDepth = Math.max(100, (H - 16) - waterY);
  CURRENT_LAYERS.forEach((layer, lIdx) => {
    const yTop = waterY + seaDepth * layer.ratioStart;
    const yBot = waterY + seaDepth * layer.ratioEnd;
    for (let i = 0; i < 8; i++) {
      currentStreams.push({
        x: Math.random() * W,
        y: yTop + 10 + Math.random() * Math.max(12, (yBot - yTop) - 20),
        len: 42 + Math.abs(layer.vx) * 28 + Math.random() * 25,
        vx: layer.vx,
        layerIdx: lIdx,
        alpha: 0.22 + Math.random() * 0.2
      });
    }
  });
}

/* ==================== 지정 출격 대기열 ==================== */
let spawnQueue = [
  { name: '김진상', level: 1 },
  { name: '박진상', level: 2 },
  { name: '최진상', level: 3 },
  { name: '왕진상', level: 4 }
];
let autoDeployCooldown = 30;

function renderQueueUI() {
  const box = document.getElementById('queueList');
  if (spawnQueue.length === 0) {
    box.innerHTML = `<span style="font-size:11.5px;color:#94a3b8;font-weight:700">※ 출격 대기열이 비어 있습니다. 왼쪽에서 단계와 이름을 입력해 등록하세요.</span>`;
    return;
  }
  box.innerHTML = `<span style="font-size:11px;color:#38bdf8;font-weight:800">대기(${spawnQueue.length}):</span>` +
    spawnQueue.map((item, idx) => `
      <span class="q-tag lv${item.level}">
        ${idx + 1}. [Lv.${item.level}] ${item.name}
        <button onclick="removeFromQueue(${idx})" title="삭제">×</button>
      </span>
    `).join('');
}

function enqueueVillain() {
  const inp = document.getElementById('newVillain');
  const level = parseInt(document.getElementById('newLevel').value, 10) || 1;
  const name = inp.value.trim();
  if (!name) {
    showToast('⚠️ 출격할 진상 이름을 입력해주세요!');
    inp.focus();
    return;
  }
  spawnQueue.push({ name, level });
  inp.value = '';
  inp.focus();
  renderQueueUI();
}

function removeFromQueue(idx) {
  spawnQueue.splice(idx, 1);
  renderQueueUI();
}

function clearQueue() {
  spawnQueue = [];
  renderQueueUI();
}

function launchNextFromQueue() {
  if (spawnQueue.length === 0) {
    showToast('대기열이 비어 있습니다. 먼저 진상을 등록하세요!');
    return;
  }
  const next = spawnQueue.shift();
  renderQueueUI();
  deploySubmarine(next.name, next.level);
}

function spawnRandomWave() {
  const samples = ['이진상', '정진상', '강진상', '조진상', '윤진상', '장진상', '임진상', '한진상'];
  const name = samples[Math.floor(Math.random() * samples.length)];
  const level = 1 + Math.floor(Math.random() * 4);

}

function buildSeabed() {
  seabedRocks = [];
  seaweeds = [];
  const rockCount = Math.max(6, Math.floor(W / 190));
  for (let i = 0; i < rockCount; i++) {
    const rx = (W / rockCount) * i + 60 + Math.random() * 70;
    const rw = 65 + Math.random() * 65;
    const rh = 38 + Math.random() * 48;
    seabedRocks.push({ x: rx, y: H, w: rw, h: rh });
  }
  for (let i = 0; i < 24; i++) {
    seaweeds.push({
      x: Math.random() * W,
      h: 40 + Math.random() * 65,
      phase: Math.random() * Math.PI * 2,
      color: Math.random() > 0.5 ? '#059669' : '#0d9488'
    });
  }
}

function deploySubmarine(name, level) {
  const spec = VILLAIN_LEVELS[level] || VILLAIN_LEVELS[1];
  const fromLeft = Math.random() < 0.5;
  const depthMin = waterY + 75;
  const depthMax = H - 105;
  const y = depthMin + Math.random() * Math.max(60, depthMax - depthMin);

  submarines.push({
    x: fromLeft ? -150 : W + 150,
    y,
    dir: fromLeft ? 1 : -1,
    level: spec.lv,
    spec,
    baseSpeed: spec.baseSpeed + Math.random() * 0.35,
    w: spec.w,
    h: spec.h,
    hp: spec.hp,
    maxHp: spec.hp,
    name,
    hitFlash: 0,
    bobPhase: Math.random() * Math.PI * 2,
    slowTimer: 0,
    smokeTimer: 0,
    spinTimer: 0,
    spinAngle: 0,
    strippingTimer: 0,
    strippedLayers: 0,
    fireCooldown: Math.floor(spec.fireInterval * (0.55 + Math.random() * 0.5))
  });
}

function fireWeapon() {
  if (ship.isDestroyed) return;
  initAudio();
  const now = Date.now();
  const w = WEAPONS[currentWeapon];
  if (now - lastFireTime[currentWeapon] < w.cdMs) return;

  lastFireTime[currentWeapon] = now;
  playDropSound(currentWeapon);

  projectiles.push({
    x: ship.x,
    y: waterY + 10,
    vx: 0,
    vy: currentWeapon === 4 ? 5.2 : currentWeapon === 1 ? 6.5 : currentWeapon === 2 ? 5.0 : currentWeapon === 3 ? 4.4 : 3.5,
    type: currentWeapon,
    dmg: w.dmg,
    rot: 0,
    life: 520
  });
}

  initAudio();

  ship.vx = (clickX - ship.x) * 0.08;

/* ==================== 파티클 & 말풍선 & 파편 ==================== */
function createEffect(x, y, color, count = 20, screamText = '', dmgText = '') {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 5.2;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      r: 3 + Math.random() * 5,
      color: i % 2 === 0 ? color : '#fef08a',
      alpha: 1,
      isSmoke: false
    });
  }
  if (screamText) {
    floatingTexts.push({ x, y: y - 32, text: `🤖 ${screamText}`, alpha: 1.45, vy: -0.9, isScream: true });
  }
  if (dmgText) {
    floatingTexts.push({ x, y: y - 10, text: dmgText, alpha: 1.0, vy: -1.6, isScream: false });
  }
}

function spawnHullArmorPeel(s, layerIdx) {
  const side = layerIdx % 2 === 0 ? -1 : 1;
  hullDebris.push({
    x: s.x + (Math.random() - 0.5) * 50,
    y: s.y + side * 10,
    vx: (Math.random() - 0.5) * 4,
    vy: side * (2.5 + Math.random() * 2.5),
    w: 34 + Math.random() * 18,
    h: 12 + Math.random() * 6,
    rot: 0,
    vRot: (Math.random() - 0.5) * 0.25,
    color: s.spec.hullColor,
    alpha: 1
  });
}

/* ==================== 업데이트 루프 ==================== */
function update() {
  waveTick += 0.04;
  if (shakeTime > 0) shakeTime--;
  if (ship.hitFlash > 0) ship.hitFlash--;
  updateWeaponCooldownUI();

  // 대기열 자동 출격 (동시 최대 4척 유지)
  if (autoDeployCooldown > 0) autoDeployCooldown--;
  if (spawnQueue.length > 0 && submarines.length < 4 && autoDeployCooldown === 0) {
    launchNextFromQueue();
    autoDeployCooldown = 140;
  }

  // 조류 흐름선 애니메이션 업데이트
  currentStreams.forEach(st => {
    st.x += st.vx * 1.15;
    if (st.vx > 0 && st.x > W + 80) st.x = -80;
    else if (st.vx < 0 && st.x < -80) st.x = W + 80;
  });

  // 아군 구축함 이동
  if (!ship.isDestroyed) {
    if (keys['ArrowLeft'] || keys['KeyA']) ship.vx = -ship.speed;
    else if (keys['ArrowRight'] || keys['KeyD']) ship.vx = ship.speed;
    else ship.vx *= 0.85;

    ship.x += ship.vx;
    ship.x = Math.max(85, Math.min(W - 85, ship.x));
  }

  // 수중 기포 (조류에 약간 휩쓸리며 상승)
  bubbles.forEach(b => {
    const cur = getWaterCurrentAtY(b.y);
    b.y -= b.vy;
    b.x += cur * 0.35;
    if (b.x < 0) b.x += W;
    if (b.x > W) b.x -= W;
    if (b.y < waterY + 5) { b.y = H - 20; b.x = Math.random() * W; }
  });

  // 수중 생물 군집 AI 업데이트 (자유 유영 -> 체력 30% 미만 진상 포위 -> 격침 후 잔해 포식 잔치)
  updateSeaCreatures();

  // 1) 아군 투하 무기 업데이트 (수심별 조류 X축 물리 적용)
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life--;

    const currentVx = getWaterCurrentAtY(p.y);

    if (p.type === 0) {
      // 💩 똥: 가벼워서 조류에 가장 크게 휩쓸림
      p.vy = Math.min(6.0, p.vy + 0.065);
      p.vx = Math.sin(p.life * 0.18) * 0.45 + currentVx * 0.95;
    } else if (p.type === 1) {
      // 💉 주사기: 날렵하지만 중층/심층 조류에 편향됨
      p.vy = 7.2;
      p.vx = currentVx * 0.65;
    } else if (p.type === 2) {
      // 🪨 돌맹이: 무거워서 조류 영향을 적게 받음
      p.vy = Math.min(8.8, p.vy + 0.16);
      p.vx = currentVx * 0.42;
      p.rot += 0.12;
    } else if (p.type === 3) {
      // 💣 폭탄: 조류를 타고 대각선으로 낙하
      p.vy = Math.min(7.8, p.vy + 0.12);
      p.vx = currentVx * 0.58;
    } else if (p.type === 4) {
      // 🚀 어뢰: 유도 추진 + 조류 저항 보정
      let nearest = null, minDist = 99999;
      submarines.forEach(s => {
        if (s.strippingTimer > 0) return;
        const d = Math.hypot(s.x - p.x, s.y - p.y);
        if (d < minDist) { minDist = d; nearest = s; }
      });
      if (nearest) {
        const ang = Math.atan2(nearest.y - p.y, nearest.x - p.x);
        p.vx += Math.cos(ang) * 0.58 + currentVx * 0.14;
        p.vy += Math.sin(ang) * 0.58;
        const spd = Math.hypot(p.vx, p.vy);
        if (spd > 7.4) { p.vx = (p.vx / spd) * 7.4; p.vy = (p.vy / spd) * 7.4; }
        p.rot = Math.atan2(p.vy, p.vx) - Math.PI / 2;
      } else {
        p.vx = currentVx * 0.5;
        p.vy += 0.1;
      }
      if (Math.random() < 0.7) {
        particles.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*0.6, vy: -0.6, r: 3, color: '#fca5a5', alpha: 0.9, isSmoke: false });
      }
    }

    p.x += p.vx;
    p.y += p.vy;

    // 적 폭탄/어뢰 수중 요격 판정
    let intercepted = false;
    for (let k = enemyTorpedoes.length - 1; k >= 0; k--) {
      const et = enemyTorpedoes[k];
      if (Math.hypot(p.x - et.x, p.y - et.y) < 23) {
        intercepted = true;
        enemyTorpedoes.splice(k, 1);
        score += 30;
        document.getElementById('scoreVal').textContent = score;
        playImpactSound(false);
        createEffect(et.x, et.y, '#38bdf8', 16, '', '🛡️ 적 폭탄 요격! +30');
        break;
      }
    }
    if (intercepted) {
      projectiles.splice(i, 1);
      continue;
    }

    let hitRock = false;
    for (const r of seabedRocks) {
      if (Math.abs(p.x - r.x) < r.w * 0.42 && p.y > H - r.h * 0.75) {
        hitRock = true;
        break;
      }
    }
    if (hitRock || p.y > H - 15 || p.life <= 0) {
      createEffect(p.x, p.y, '#94a3b8', 8);
      projectiles.splice(i, 1);
      continue;
    }

    // 잠수함 명중 판정
    let hitSub = false;
    for (let j = submarines.length - 1; j >= 0; j--) {
      const s = submarines[j];
      if (s.strippingTimer > 0) continue;
      if (Math.abs(p.x - s.x) < s.w * 0.52 && Math.abs(p.y - s.y) < s.h * 0.6) {
        hitSub = true;
        s.hitFlash = 8;

        const wInfo = WEAPONS[p.type];
        const screamLine = `${s.name} ${wInfo.scream}`;

        if (p.type === 4) {
          // 5번 어뢰 직격: "[이름] 굿바이!"
          speakRobotVoice(screamLine, 4);
          s.strippingTimer = 75;
          s.strippedLayers = 0;
          shakeTime = 14;
          playImpactSound(false);
          createEffect(p.x, p.y, '#f43f5e', 28, screamLine, '🚀 어뢰 직격!! 선체 분해!');
        } else {
          s.hp = Math.max(0, s.hp - p.dmg);

          if (s.hp <= 0) {
            // 일반 무기(1~4번)로 막타 격침 시에도 "[이름] 굿바이!" 발화 및 말풍선 출력
            destroySubmarine(j, false);
          } else {
            // 생존 시 무기별 지정 기계음 대사 발화
            speakRobotVoice(screamLine, p.type);
            if (p.type === 0) {
              s.slowTimer = 300;
              createEffect(p.x, p.y, '#854d0e', 18, screamLine, `-${p.dmg} (둔화!)`);
              playImpactSound(false);
            } else if (p.type === 1) {
              s.smokeTimer = 360;
              createEffect(p.x, p.y, '#e2e8f0', 22, screamLine, `-${p.dmg} (연기!)`);
              playImpactSound(false);
            } else if (p.type === 2) {
              s.spinTimer = 210;
              createEffect(p.x, p.y, '#94a3b8', 24, screamLine, `-${p.dmg} (회전!)`);
              playImpactSound(false);
            } else if (p.type === 3) {
              shakeTime = 16;
              createEffect(p.x, p.y, '#ef4444', 42, screamLine, `-${p.dmg} 대폭발!!`);
              playImpactSound(true);
            }
          }
        }
        break;
      }
    }
    if (hitSub) {
      projectiles.splice(i, 1);
    }
  }

  // 2) 진상 잠수함(1~4단계) 이동(조류 영향) & 단계별 역습 폭탄(어뢰) 발사 업데이트
  for (let i = submarines.length - 1; i >= 0; i--) {
    const s = submarines[i];
    if (s.hitFlash > 0) s.hitFlash--;

    if (s.strippingTimer > 0) {
      s.strippingTimer--;
      s.x += (Math.random() - 0.5) * 6;
      s.y += (Math.random() - 0.5) * 4;
      if (s.strippingTimer % 14 === 0 && s.strippedLayers < 4) {
        s.strippedLayers++;
        spawnHullArmorPeel(s, s.strippedLayers);
        playImpactSound(false);
        createEffect(s.x, s.y, '#fbbf24', 12);
      }
      if (s.strippingTimer <= 0) {
        destroySubmarine(i, true);
      }
      continue;
    }

    // 단계별 역습 폭탄/어뢰 발사 로직
    if (s.spinTimer <= 0 && !ship.isDestroyed) {
      s.fireCooldown--;
      if (s.fireCooldown <= 0 && s.x > 60 && s.x < W - 60) {
        const slowFactor = s.slowTimer > 0 ? 1.55 : 1.0;
        s.fireCooldown = Math.floor(s.spec.fireInterval * slowFactor * (0.85 + Math.random() * 0.3));
        playEnemyTorpedoSound(s.level);

        if (s.level === 1 || s.level === 2) {
          // 1~2단계: 단발 상향 어뢰
          enemyTorpedoes.push({
            x: s.x,
            y: s.y - s.h * 0.5,
            vx: (ship.x - s.x) * 0.002,
            vy: s.spec.torpedoVy,
            dmg: s.spec.torpedoDmg,
            level: s.level,
            shooter: s.name
          });
        } else if (s.level === 3) {
          // 3단계: 55% 확률로 2연발 쌍둥이 폭탄 발사
          const isDouble = Math.random() < 0.55;
          const offsets = isDouble ? [-22, 22] : [0];
          offsets.forEach(ox => {
            enemyTorpedoes.push({
              x: s.x + ox,
              y: s.y - s.h * 0.5,
              vx: (ship.x - (s.x + ox)) * 0.0035,
              vy: s.spec.torpedoVy,
              dmg: s.spec.torpedoDmg,
              level: s.level,
              shooter: s.name
            });
          });
        } else if (s.level === 4) {
          // 4단계(보스급): 3발 부채꼴 폭격 사격!
          const spreadVxs = [-1.45, 0, 1.45];
          const aimBias = Math.max(-1.2, Math.min(1.2, (ship.x - s.x) * 0.004));
          spreadVxs.forEach(svx => {
            enemyTorpedoes.push({
              x: s.x + svx * 12,
              y: s.y - s.h * 0.5,
              vx: svx + aimBias,
              vy: s.spec.torpedoVy,
              dmg: s.spec.torpedoDmg,
              level: s.level,
              shooter: s.name
            });
          });
        }
      }
    }

    let curSpeed = s.baseSpeed;
    if (s.slowTimer > 0) { s.slowTimer--; curSpeed *= 0.45; }
    if (s.spinTimer > 0) { s.spinTimer--; s.spinAngle += 0.24; curSpeed *= 0.5; }
    else { s.spinAngle = 0; }

    if (s.smokeTimer > 0) {
      s.smokeTimer--;
      if (s.smokeTimer % 4 === 0) {
        particles.push({
          x: s.x + (Math.random() - 0.5) * 40,
          y: s.y - 12,
          vx: (Math.random() - 0.5) * 0.8,
          vy: -1.4 - Math.random() * 0.8,
          r: 6 + Math.random() * 7,
          color: '#334155',
          alpha: 0.85,
          isSmoke: true
        });
      }
    }

    // 수심별 조류가 잠수함 이동 속도에도 물리적으로 작용 (순류 시 가속, 역류 시 감속)
    let subCurrentVx = getWaterCurrentAtY(s.y) * 0.42;

    // 체력 30% 미만 빈사 상태 시 주변 수중 생물 포위로 인해 조류 타기 및 이동 흐름 방해
    const isCritical = s.hp > 0 && s.hp < s.maxHp * 0.3 && s.strippingTimer === 0;
    s.swarmedCount = 0;
    if (isCritical) {
      let nearbyCount = 0;
      seaCreatures.forEach(c => {
        if (Math.hypot(c.x - s.x, c.y - s.y) < 155) nearbyCount++;
      });
      s.swarmedCount = nearbyCount;
      const dragPenalty = Math.max(0.28, 1 - nearbyCount * 0.06);
      curSpeed *= dragPenalty;
      subCurrentVx *= 0.15; // 수중 생물 떼가 선체를 에워싸 조류 추진 흐름 차단
      s.y += Math.sin(waveTick * 6 + s.bobPhase) * 0.85; // 에워싼 생물들과 부딪히며 선체 흔들림
    }

    s.x += s.dir * curSpeed + subCurrentVx;
    s.bobPhase += 0.05;

    if (s.dir > 0 && s.x > W + 160) s.dir = -1;
    else if (s.dir < 0 && s.x < -160) s.dir = 1;
  }

  // 3) 진상 잠수함이 쏜 폭탄/어뢰 업데이트 (상승 중 다층 조류 X축 영향 받음)
  for (let i = enemyTorpedoes.length - 1; i >= 0; i--) {
    const et = enemyTorpedoes[i];
    const layerCurrent = getWaterCurrentAtY(et.y);
    et.x += (et.vx || 0) + layerCurrent * 0.55;
    et.y += et.vy;

    if (Math.random() < 0.55) {
      particles.push({
        x: et.x + (Math.random() - 0.5) * 4,
        y: et.y + 10,
        vx: 0,
        vy: 0.6,
        r: et.level >= 3 ? 3.5 : 2.5,
        color: et.level === 4 ? '#fb923c' : '#fca5a5',
        alpha: 0.78,
        isSmoke: false
      });
    }

    if (et.y <= waterY + 4) {
      if (!ship.isDestroyed && Math.abs(et.x - ship.x) < 74) {
        ship.hp = Math.max(0, ship.hp - et.dmg);
        ship.hitFlash = 12;
        shakeTime = 14;
        updateShipHpUI();
        playShipHitTaunt();
        createEffect(et.x, waterY - 12, '#ef4444', 28, `[Lv.${et.level}] ${et.shooter} 폭탄 명중!`, `💥 선체 피격! -${et.dmg}HP`);

        if (ship.hp <= 0) {
          ship.isDestroyed = true;
          document.getElementById('gameOverBox').style.display = 'flex';
        }
      } else {
        playImpactSound(false);
        createEffect(et.x, waterY, '#bae6fd', 14);
      }
      enemyTorpedoes.splice(i, 1);
    }
  }

  for (let i = hullDebris.length - 1; i >= 0; i--) {
    const d = hullDebris[i];
    d.x += d.vx; d.y += d.vy;
    d.rot += d.vRot;
    d.alpha -= 0.014;
    if (d.alpha <= 0) hullDebris.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy;
    if (pt.isSmoke) { pt.r += 0.15; pt.alpha -= 0.015; }
    else { pt.alpha -= 0.024; }
    if (pt.alpha <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy;
    ft.alpha -= 0.012;
    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  }
}

function updateSeaCreatures() {
  // 1) 포식 구역(격침 잔해 먹이 잔치) 타이머 감소
  for (let i = feastZones.length - 1; i >= 0; i--) {
    feastZones[i].timer--;
    // 잔해 뜯어먹는 파편/기포 이펙트
    if (feastZones[i].timer % 5 === 0) {
      particles.push({
        x: feastZones[i].x + (Math.random() - 0.5) * 70,
        y: feastZones[i].y + (Math.random() - 0.5) * 40,
        vx: (Math.random() - 0.5) * 2.2,
        vy: -0.6 - Math.random() * 1.2,
        r: 2.5 + Math.random() * 3,
        color: Math.random() > 0.4 ? '#fde047' : '#f87171',
        alpha: 0.95,
        isSmoke: false
      });
    }
    if (feastZones[i].timer <= 0) {
      feastZones.splice(i, 1);
    }
  }

  // 2) 체력 30% 미만 빈사 상태 잠수함 탐색
  const dyingSubs = submarines.filter(s => s.hp > 0 && s.hp < s.maxHp * 0.3 && s.strippingTimer === 0);

  seaCreatures.forEach((c, idx) => {
    c.chompPhase += 0.24;

    if (feastZones.length > 0) {
      // 최우선: 격침된 진상 잠수함 잔해로 몰려들어 뜯어먹는 포식 연출
      const fz = feastZones[idx % feastZones.length];
      c.state = 'feast';
      c.orbitAngle += c.orbitSpeed * 2.4;
      const lungeR = 14 + Math.abs(Math.sin(c.chompPhase * 1.5)) * 34;
      const tx = fz.x + Math.cos(c.orbitAngle) * lungeR;
      const ty = fz.y + Math.sin(c.orbitAngle) * (lungeR * 0.6);
      const dx = tx - c.x;
      const dy = ty - c.y;
      c.x += dx * 0.14;
      c.y += dy * 0.14;
      if (Math.abs(dx) > 0.3) c.facing = dx >= 0 ? 1 : -1;
    } else if (dyingSubs.length > 0) {
      // 2순위: 체력 30% 미만 빈사 잠수함 주변으로 몰려들어 포위 및 흐름 방해
      let targetSub = dyingSubs[0];
      let minDist = Math.hypot(targetSub.x - c.x, targetSub.y - c.y);
      for (let k = 1; k < dyingSubs.length; k++) {
        const d = Math.hypot(dyingSubs[k].x - c.x, dyingSubs[k].y - c.y);
        if (d < minDist) { minDist = d; targetSub = dyingSubs[k]; }
      }

      c.state = 'swarm';
      c.orbitAngle += c.orbitSpeed;
      const rx = targetSub.w * 0.56 + (idx % 3) * 14;
      const ry = targetSub.h * 0.78 + (idx % 3) * 10;
      const tx = targetSub.x + Math.cos(c.orbitAngle) * rx;
      const ty = targetSub.y + Math.sin(c.orbitAngle) * ry;
      const dx = tx - c.x;
      const dy = ty - c.y;
      c.x += dx * 0.085;
      c.y += dy * 0.085;
      if (Math.abs(dx) > 0.25) c.facing = dx >= 0 ? 1 : -1;

      // 입맛을 다시며 군침 기포 뿜기
      if (minDist < 120 && Math.random() < 0.04) {
        particles.push({
          x: c.x + c.facing * (c.size * 0.5),
          y: c.y,
          vx: c.facing * 0.6,
          vy: -0.9,
          r: 2.2,
          color: '#e0f2fe',
          alpha: 0.85,
          isSmoke: false
        });
      }
    } else {
      // 평상시: 다층 조류를 타고 자유 유영
      c.state = 'wander';
      const cur = getWaterCurrentAtY(c.y);
      c.x += c.vx + cur * 0.28;
      c.y += Math.sin(waveTick * 1.4 + c.id) * 0.35;
      c.facing = (c.vx + cur * 0.28) >= 0 ? 1 : -1;

      if (c.x > W + 90) c.x = -90;
      if (c.x < -90) c.x = W + 90;
      c.y = Math.max(waterY + 35, Math.min(H - 45, c.y));
    }
  });
}

function destroySubmarine(idx, isMega = false) {
  const s = submarines[idx];
  kills++;
  const pts = s.spec.score * (isMega ? 2 : 1);
  score += pts;
  document.getElementById('killCnt').textContent = kills;
  document.getElementById('scoreVal').textContent = score;
  shakeTime = isMega ? 26 : 18;
  playImpactSound(true);

  const goodbyeLine = `${s.name} 꺼져라!`;
  if (!isMega) {
    // 1~4번 일반 무기로 막타 격침 시에도 "[이름] 꺼져라!" 기계음 발화
    speakRobotVoice(goodbyeLine, 4);
  }
  createEffect(s.x, s.y, '#ef4444', isMega ? 70 : 45, goodbyeLine, `💥 [Lv.${s.level} ${s.name}] 격침! +${pts}점`);

  // 격침 위치에 수중 생물 포식 잔치 구역 생성 + 먹이 파편 살포
  feastZones.push({ x: s.x, y: s.y, timer: 165 });
  floatingTexts.push({ x: s.x, y: s.y + 24, text: '🦈🐟 수중 생물 떼 포식 잔치 개시!', alpha: 1.5, vy: -0.55, isScream: true });
  for (let k = 0; k < 10; k++) {
    hullDebris.push({
      x: s.x + (Math.random() - 0.5) * 40,
      y: s.y + (Math.random() - 0.5) * 20,
      vx: (Math.random() - 0.5) * 3.5,
      vy: (Math.random() - 0.5) * 2.5,
      w: 14 + Math.random() * 12,
      h: 7 + Math.random() * 5,
      rot: Math.random() * Math.PI,
      vRot: (Math.random() - 0.5) * 0.2,
      color: k % 2 === 0 ? s.spec.hullColor : '#fbbf24',
      alpha: 1.3
    });
  }

  submarines.splice(idx, 1);
}

/* ==================== 그리기 렌더링 ==================== */
function draw() {
  ctx.save();
  if (shakeTime > 0) {
    ctx.translate((Math.random() - 0.5) * 11, (Math.random() - 0.5) * 11);
  }

  // 하늘
  const skyGrad = ctx.createLinearGradient(0, 0, 0, waterY);
  skyGrad.addColorStop(0, '#0f172a');
  skyGrad.addColorStop(0.6, '#1e3a8a');
  skyGrad.addColorStop(1, '#38bdf8');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, waterY);

  ctx.fillStyle = 'rgba(254, 240, 138, 0.85)';
  ctx.beginPath();
  ctx.arc(W - 140, 50, 23, 0, Math.PI * 2);
  ctx.fill();

  // 바다 배경
  const seaGrad = ctx.createLinearGradient(0, waterY, 0, H);
  seaGrad.addColorStop(0, '#0284c7');
  seaGrad.addColorStop(0.45, '#0369a1');
  seaGrad.addColorStop(1, '#082f49');
  ctx.fillStyle = seaGrad;
  ctx.fillRect(0, waterY, W, H - waterY);

  // 다층 조류(해류) 구역 경계, 흐름선 애니메이션 및 수심 가이드 라벨 렌더링
  drawCurrentLayers();

  // 수중 기포
  ctx.fillStyle = 'rgba(224, 242, 254, 0.35)';
  bubbles.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // 수중 생물 군집 렌더링 (평상시 유영 / 빈사 진상 포위 / 격침 잔해 포식)
  drawSeaCreatures();

  // 해저 바닥 & 해초 & 암초
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, H - 16, W, 16);

  seaweeds.forEach(sw => {
    const sway = Math.sin(waveTick + sw.phase) * 10;
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sw.x, H - 12);
    ctx.quadraticCurveTo(sw.x + sway, H - 12 - sw.h * 0.5, sw.x - sway * 0.6, H - 12 - sw.h);
    ctx.stroke();
  });

  seabedRocks.forEach(r => {
    ctx.fillStyle = '#334155';
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(r.x - r.w * 0.5, H - 10);
    ctx.lineTo(r.x - r.w * 0.3, H - r.h);
    ctx.lineTo(r.x + r.w * 0.15, H - r.h * 0.9);
    ctx.lineTo(r.x + r.w * 0.5, H - 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });

  if (!ship.isDestroyed) {
    drawDestroyer(ship.x, waterY + Math.sin(waveTick * 1.5) * 3);
  }

  submarines.forEach(s => drawSubmarine(s));

  hullDebris.forEach(d => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, d.alpha);
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    ctx.fillStyle = d.color;
    ctx.strokeStyle = '#fde047';
    ctx.lineWidth = 1.5;
    ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
    ctx.strokeRect(-d.w / 2, -d.h / 2, d.w, d.h);
    ctx.restore();
  });

  projectiles.forEach(p => drawProjectile(p));
  enemyTorpedoes.forEach(et => drawEnemyTorpedo(et));

  // 수면 파도선
  ctx.strokeStyle = '#bae6fd';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 20) {
    const wy = waterY + Math.sin(x * 0.025 + waveTick * 2) * 3.5;
    if (x === 0) ctx.moveTo(x, wy);
    else ctx.lineTo(x, wy);
  }
  ctx.stroke();

  particles.forEach(pt => {
    ctx.globalAlpha = Math.max(0, pt.alpha);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  floatingTexts.forEach(ft => {
    ctx.globalAlpha = Math.max(0, Math.min(1, ft.alpha));
    ctx.font = ft.isScream ? '900 18.5px "Malgun Gothic", sans-serif' : '900 15px "Malgun Gothic", sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 4;
    ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillStyle = ft.isScream ? '#ffffff' : '#fde047';
    ctx.fillText(ft.text, ft.x, ft.y);
  });
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawCurrentLayers() {
  const seaDepth = Math.max(1, (H - 16) - waterY);

  CURRENT_LAYERS.forEach((layer, idx) => {
    const yTop = waterY + seaDepth * layer.ratioStart;
    const yBot = waterY + seaDepth * layer.ratioEnd;
    const midY = (yTop + yBot) * 0.5;

    // 수심 층 경계 점선
    if (idx > 0) {
      ctx.save();
      ctx.strokeStyle = 'rgba(186, 230, 253, 0.22)';
      ctx.setLineDash([8, 8]);
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(0, yTop);
      ctx.lineTo(W, yTop);
      ctx.stroke();
      ctx.restore();
    }

    // 좌측 수심 가이드 라벨 (조류 방향 및 세기 표시)
    ctx.save();
    const signStr = layer.vx > 0 ? `+${layer.vx.toFixed(1)}` : `${layer.vx.toFixed(1)}`;
    const labelText = `🌊 ${layer.name} (${signStr}) ${layer.arrow}`;
    ctx.font = '800 11px "Malgun Gothic", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(15, 23, 42, 0.42)';
    ctx.fillRect(10, yTop + 6, 205, 19);
    ctx.fillStyle = layer.vx > 0 ? '#bae6fd' : '#fde68a';
    ctx.fillText(labelText, 16, yTop + 19);
    ctx.restore();
  });

  // 반투명 조류 흐름선 & 방향 화살표 애니메이션
  currentStreams.forEach(st => {
    ctx.save();
    ctx.strokeStyle = st.vx > 0 ? `rgba(186, 230, 253, ${st.alpha})` : `rgba(253, 224, 71, ${st.alpha * 0.9})`;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';

    const dir = st.vx >= 0 ? 1 : -1;
    const startX = st.x - dir * st.len * 0.5;
    const endX = st.x + dir * st.len * 0.5;

    ctx.beginPath();
    for (let px = 0; px <= st.len; px += 10) {
      const curX = startX + dir * px;
      const waveY = st.y + Math.sin(curX * 0.05 + waveTick * 2.5) * 2.5;
      if (px === 0) ctx.moveTo(curX, waveY);
      else ctx.lineTo(curX, waveY);
    }
    ctx.stroke();

    // 흐름 끝 화살촉
    const tipY = st.y + Math.sin(endX * 0.05 + waveTick * 2.5) * 2.5;
    ctx.beginPath();
    ctx.moveTo(endX, tipY);
    ctx.lineTo(endX - dir * 7, tipY - 4);
    ctx.moveTo(endX, tipY);
    ctx.lineTo(endX - dir * 7, tipY + 4);
    ctx.stroke();

    ctx.restore();
  });
}

function drawDestroyer(x, y) {
  ctx.save();
  ctx.translate(x, y);

  const bw = 90;
  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  ctx.fillRect(-bw / 2, -68, bw, 7);
  ctx.fillStyle = ship.hp > 30 ? '#34d399' : '#ef4444';
  ctx.fillRect(-bw / 2, -68, bw * (ship.hp / ship.maxHp), 7);

  ctx.fillStyle = ship.hitFlash > 0 ? '#fca5a5' : '#cbd5e1';
  ctx.fillRect(-26, -34, 48, 18);
  ctx.fillStyle = '#94a3b8';
  ctx.fillRect(-14, -46, 22, 12);
  ctx.strokeStyle = '#f8fafc';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-3, -46); ctx.lineTo(-3, -58);
  ctx.moveTo(-12, -55); ctx.lineTo(6, -55);
  ctx.stroke();

  ctx.fillStyle = '#475569';
  ctx.fillRect(32, -23, 18, 8);
  ctx.fillRect(-48, -23, 16, 8);

  ctx.fillStyle = ship.hitFlash > 0 ? '#fecaca' : '#e2e8f0';
  ctx.beginPath();
  ctx.moveTo(-76, -16);
  ctx.lineTo(82, -16);
  ctx.lineTo(66, 6);
  ctx.lineTo(-64, 6);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#dc2626';
  ctx.fillRect(-64, 2, 130, 4);

  ctx.fillStyle = '#0f172a';
  ctx.font = '900 11.5px "Malgun Gothic", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('23시 하오동', 2, -2);

  ctx.restore();
}

function drawEnemyTorpedo(et) {
  ctx.save();
  ctx.translate(et.x, et.y);
  const angle = Math.atan2(et.vy, et.vx || 0) + Math.PI / 2;
  ctx.rotate(angle);

  const isBoss = et.level === 4;
  ctx.fillStyle = isBoss ? '#f97316' : et.level === 3 ? '#c084fc' : '#ef4444';
  ctx.strokeStyle = '#fef08a';
  ctx.lineWidth = isBoss ? 2.2 : 1.6;
  const scale = isBoss ? 1.25 : 1.0;
  ctx.scale(scale, scale);

  ctx.beginPath();
  ctx.moveTo(0, -15);
  ctx.lineTo(5, 8);
  ctx.lineTo(0, 4);
  ctx.lineTo(-5, 8);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawSubmarine(s) {
  ctx.save();
  const by = s.y + Math.sin(s.bobPhase) * 3;
  ctx.translate(s.x, by);

  ctx.save();
  if (s.spinTimer > 0) {
    ctx.rotate(s.spinAngle);
  }

  // 4단계 보스급 외곽 붉은 오라 링
  if (s.level === 4 && s.strippingTimer === 0) {
    ctx.strokeStyle = 'rgba(248, 113, 113, 0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 0, s.w * 0.56, s.h * 0.65, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  if (s.strippedLayers < 1) {
    ctx.save();
    ctx.scale(s.dir, 1);
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(6, -s.h * 0.45);
    ctx.lineTo(6, -s.h * 0.85);
    ctx.lineTo(15, -s.h * 0.85);
    ctx.stroke();

    ctx.fillStyle = s.hitFlash > 0 ? '#ffffff' : s.spec.towerColor;
    ctx.fillRect(-16, -s.h * 0.68, 32, s.h * 0.35);

    // 3~4단계 상부 포탑 강화 포신
    if (s.level >= 3) {
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(-10, -s.h * 0.82, 5, 10);
      if (s.level === 4) ctx.fillRect(4, -s.h * 0.82, 5, 10);
    }

    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(-s.w * 0.54, -8, 7, 16);
    ctx.restore();
  }

  if (s.strippedLayers > 0) {
    ctx.fillStyle = '#334155';
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-s.w * 0.46, -s.h * 0.38, s.w * 0.92, s.h * 0.76, 12);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(-35, -6, 70, 12);
  }

  if (s.strippedLayers < 4) {
    const hullColor = s.hitFlash > 0 ? '#ffffff' : s.spec.hullColor;
    const strokeColor = s.spec.strokeColor;
    const shrink = s.strippedLayers * 18;

    ctx.fillStyle = hullColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = s.level === 4 ? 3.2 : 2.4;
    ctx.beginPath();
    ctx.roundRect(-s.w * 0.5 + shrink, -s.h * 0.45, Math.max(20, s.w - shrink * 2), s.h * 0.9, 18);
    ctx.fill();
    ctx.stroke();
  }

  if (s.slowTimer > 0) {
    ctx.fillStyle = '#713f12';
    ctx.beginPath();
    ctx.arc(-22, -4, 9, 0, Math.PI * 2);
    ctx.arc(24, 5, 8, 0, Math.PI * 2);
    ctx.fill();
  }

  // 통합 진상 등급 배지 + 이름
  const icon = s.level === 4 ? '👑' : '👾';
  ctx.fillStyle = '#ffffff';
  ctx.font = '900 12.5px "Malgun Gothic", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`${icon} [${s.spec.tag}] ${s.name}`, 0, 1);

  ctx.restore();

  if (s.strippingTimer === 0) {
    const bw = Math.max(76, s.w * 0.56);
    const barY = -s.h * 0.95 - 12;
    const isCritical = s.hp > 0 && s.hp < s.maxHp * 0.3;

    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx.fillRect(-bw / 2, barY, bw, 7);
    ctx.fillStyle = isCritical ? '#ef4444' : s.spec.strokeColor;
    ctx.fillRect(-bw / 2, barY, bw * (s.hp / s.maxHp), 7);

    ctx.font = '800 10.5px Consolas, sans-serif';
    ctx.fillStyle = isCritical ? '#fca5a5' : '#fef08a';
    ctx.textAlign = 'center';
    ctx.fillText(`${s.hp}/${s.maxHp}`, 0, barY - 3);

    // 체력 30% 미만 시 포위 및 포식 대기 경고 배지 표시
    if (isCritical) {
      const pulse = 0.85 + Math.sin(waveTick * 6) * 0.15;
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.font = '900 11.5px "Malgun Gothic", sans-serif';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 3.5;
      const warnText = '🐟 수중생물 포위! 포식 대기중...';
      ctx.strokeText(warnText, 0, barY - 17);
      ctx.fillStyle = '#fde047';
      ctx.fillText(warnText, 0, barY - 17);
      ctx.restore();
    }
  }

  ctx.restore();
}

function drawSeaCreatures() {
  seaCreatures.forEach(c => {
    ctx.save();
    ctx.translate(c.x, c.y);
    if (c.facing < 0) ctx.scale(-1, 1);

    const isHungry = c.state === 'swarm' || c.state === 'feast';
    ctx.globalAlpha = isHungry ? 0.96 : 0.62;

    // 포위/포식 상태일 때 입을 뻐끔거리며(벌렸다 닫았다) 먹이 노리는 모션 계산
    const mouthOpen = isHungry ? (0.18 + Math.abs(Math.sin(c.chompPhase * (c.state === 'feast' ? 1.8 : 1.0))) * 0.42) : 0.05;

    if (c.kind === 'shark') {
      // 상어 몸통 + 등지느러미 + 벌어지는 턱
      ctx.fillStyle = c.color;
      ctx.beginPath();
      ctx.moveTo(c.size, 0);
      ctx.quadraticCurveTo(0, -c.size * 0.46, -c.size * 0.9, -c.size * 0.12);
      ctx.lineTo(-c.size * 1.35, -c.size * 0.42);
      ctx.lineTo(-c.size * 1.12, 0);
      ctx.lineTo(-c.size * 1.35, c.size * 0.42);
      ctx.lineTo(-c.size * 0.9, c.size * 0.12);
      ctx.quadraticCurveTo(0, c.size * 0.42, c.size * 0.85, c.size * 0.12);
      ctx.closePath();
      ctx.fill();

      // 등지느러미
      ctx.beginPath();
      ctx.moveTo(-c.size * 0.1, -c.size * 0.34);
      ctx.lineTo(-c.size * 0.35, -c.size * 0.72);
      ctx.lineTo(-c.size * 0.45, -c.size * 0.28);
      ctx.closePath();
      ctx.fill();

      // 포식 모드일 때 붉은 입과 날카로운 이빨 연출
      if (isHungry) {
        ctx.fillStyle = '#991b1b';
        ctx.beginPath();
        ctx.moveTo(c.size * 0.35, 0);
        ctx.lineTo(c.size * 0.98, -c.size * mouthOpen * 0.55);
        ctx.lineTo(c.size * 0.92, c.size * mouthOpen * 0.65);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(c.size * 0.75, -c.size * mouthOpen * 0.35);
        ctx.lineTo(c.size * 0.82, 0);
        ctx.lineTo(c.size * 0.89, -c.size * mouthOpen * 0.42);
        ctx.fill();
      }
    } else if (c.kind === 'squid' || c.kind === 'jellyfish') {
      // 오징어 / 해파리 + 촉수 흔들림
      ctx.fillStyle = c.color;
      ctx.beginPath();
      ctx.ellipse(c.size * 0.15, 0, c.size * 0.65, c.size * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = c.belly;
      ctx.lineWidth = 2.2;
      for (let t = -2; t <= 2; t++) {
        const wave = Math.sin(c.chompPhase + t) * 5;
        ctx.beginPath();
        ctx.moveTo(-c.size * 0.4, t * 4);
        ctx.quadraticCurveTo(-c.size * 0.85, t * 4 + wave, -c.size * 1.25, t * 5 - wave);
        ctx.stroke();
      }
    } else {
      // 일반 물고기 떼 (입 뻐끔 모션 포함)
      ctx.fillStyle = c.color;
      ctx.beginPath();
      ctx.arc(0, 0, c.size * 0.68, mouthOpen, Math.PI * 2 - mouthOpen);
      ctx.lineTo(0, 0);
      ctx.closePath();
      ctx.fill();

      // 꼬리지느러미
      const tailSwing = Math.sin(c.chompPhase * 1.3) * 4;
      ctx.beginPath();
      ctx.moveTo(-c.size * 0.6, 0);
      ctx.lineTo(-c.size * 1.15, -c.size * 0.42 + tailSwing);
      ctx.lineTo(-c.size * 1.15, c.size * 0.42 + tailSwing);
      ctx.closePath();
      ctx.fill();
    }

    // 눈동자 (포식 상태일 때 번뜩이는 노란/붉은 눈)
    ctx.fillStyle = isHungry ? '#fef08a' : '#ffffff';
    ctx.beginPath();
    ctx.arc(c.size * 0.36, -c.size * 0.16, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = isHungry ? '#dc2626' : '#0f172a';
    ctx.beginPath();
    ctx.arc(c.size * 0.4, -c.size * 0.16, 1.7, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  });
}

function drawProjectile(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);

  if (p.type === 0) {
    ctx.fillStyle = '#78350f';
    ctx.strokeStyle = '#fde047';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 5, 11, 5, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, 0, 8, 4.5, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, -5, 4.5, 3.5, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  } else if (p.type === 1) {
    ctx.fillStyle = '#e0f2fe';
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 2;
    ctx.fillRect(-5, -12, 10, 20);
    ctx.strokeRect(-5, -12, 10, 20);
    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(-4, -4, 8, 11);
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 8); ctx.lineTo(0, 20);
    ctx.stroke();
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(-7, -16, 14, 3);
  } else if (p.type === 2) {
    ctx.fillStyle = '#94a3b8';
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-11, -4);
    ctx.lineTo(-4, -12);
    ctx.lineTo(8, -10);
    ctx.lineTo(13, 1);
    ctx.lineTo(5, 11);
    ctx.lineTo(-9, 9);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  } else if (p.type === 3) {
    ctx.fillStyle = '#0f172a';
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 2, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, -12); ctx.lineTo(5, -18);
    ctx.stroke();
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(6, -19, 4, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = '#dc2626';
    ctx.strokeStyle = '#fef08a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 18);
    ctx.lineTo(7, -10);
    ctx.lineTo(0, -5);
    ctx.lineTo(-7, -10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

resize();
initAmbientLife();
renderQueueUI();
updateShipHpUI();
loop();
</script>
