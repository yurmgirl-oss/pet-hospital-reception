<style>

  /* 5종 무기 & 쿨타임 게이지 버튼 */

    font-size: 11px;
    font-weight: 800;

    bottom: 0;
    left: 0;

    font-size: 11.5px;
    font-weight: 800;

  .q-tag.lv3 { background: #6b21a8; border: 1px solid #c084fc; color: #f3e8ff; }

    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(148, 163, 184, 0.4);

    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 700;
    color: #e2e8f0;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast-msg {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(220, 38, 38, 0.92);
    border: 1px solid #fca5a5;
    color: #fff;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 800;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 30;

  .gameover-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.76);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    z-index: 20;

  .pause-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.68);
    backdrop-filter: blur(2px);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    z-index: 25;
  }

function togglePause() {
  if (ship.isDestroyed) return;
  isPaused = !isPaused;
  const btn = document.getElementById('pauseBtn');
  const overlay = document.getElementById('pauseBox');

  if (isPaused) {
    pauseStartTime = Date.now();
    btn.textContent = '▶ 계속하기';
    btn.classList.add('paused-active');
    overlay.style.display = 'flex';
    if ('speechSynthesis' in window) {
      try { window.speechSynthesis.pause(); } catch (e) {}
    }
  } else {
    const pausedDuration = Date.now() - pauseStartTime;
    for (let i = 0; i < lastFireTime.length; i++) {
      if (lastFireTime[i] > 0) lastFireTime[i] += pausedDuration;
    }
    btn.textContent = '⏸ 일시정지';
    btn.classList.remove('paused-active');
    overlay.style.display = 'none';
    if ('speechSynthesis' in window) {
      try { window.speechSynthesis.resume(); } catch (e) {}
    }
  }
}

function fireWeapon(weaponIdx = currentWeapon) {
  if (ship.isDestroyed || isPaused) return;
  initAudio();
  selectWeapon(weaponIdx);
  const now = Date.now();
  const w = WEAPONS[weaponIdx];
  if (now - lastFireTime[weaponIdx] < w.cdMs) return;

  lastFireTime[weaponIdx] = now;
  playDropSound(weaponIdx);

  projectiles.push({
    x: ship.x,
    y: waterY + 10,
    vx: 0,
    vy: weaponIdx === 4 ? 5.2 : weaponIdx === 1 ? 6.5 : weaponIdx === 2 ? 5.0 : weaponIdx === 3 ? 4.4 : 3.5,
    type: weaponIdx,
    dmg: w.dmg,
    rot: 0,
    life: 520
  });

/* ==================== 입력 이벤트 ==================== */
window.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  if (e.code === 'Backspace') {
    e.preventDefault();
    togglePause();
    return;
  }

  if (isPaused) return;

  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); fireWeapon(0); }
  else if (e.code === 'KeyA') { e.preventDefault(); fireWeapon(1); }
  else if (e.code === 'KeyS') { e.preventDefault(); fireWeapon(2); }
  else if (e.code === 'KeyD') { e.preventDefault(); fireWeapon(3); }
  else if (e.code === 'KeyW') { e.preventDefault(); fireWeapon(4); }
  else if (e.key === '1') selectWeapon(0);
  else if (e.key === '2') selectWeapon(1);
  else if (e.key === '3') selectWeapon(2);
  else if (e.key === '4') selectWeapon(3);
  else if (e.key === '5') selectWeapon(4);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('mousedown', e => {
  if (ship.isDestroyed || isPaused) return;
  initAudio();
  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  ship.vx = (clickX - ship.x) * 0.08;
  fireWeapon(currentWeapon);
});
