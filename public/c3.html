<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>23시 해상 구축함 · 진상손님 잠수함 격침 작전</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0;
    background: #0b192c;
    color: #f8fafc;
    font-family: 'Malgun Gothic', 'Pretendard', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(90deg, #0f172a, #1e293b);
    border-bottom: 2px solid #38bdf8;
    padding: 7px 16px;
    gap: 12px;
    flex-shrink: 0;
  }
  .hud-left { display: flex; align-items: center; gap: 12px; }
  .title { font-size: 18px; font-weight: 900; color: #38bdf8; letter-spacing: -0.3px; }
  .stat-pill {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(56,189,248,0.4);
    padding: 4px 11px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 800;
  }
  .stat-pill b { color: #fbbf24; font-size: 16px; }

  .weapons { display: flex; gap: 6px; }
  .w-btn {
    border: 1.5px solid #475569;
    background: #1e293b;
    color: #cbd5e1;
    border-radius: 7px;
    padding: 5px 10px;
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.12s;
  }
  .w-btn.active {
    background: #2563eb;
    border-color: #60a5fa;
    color: #fff;
    box-shadow: 0 0 12px rgba(37, 99, 235, 0.7);
    transform: translateY(-1px);
  }

  .custom-add { display: flex; gap: 4px; align-items: center; }
  .custom-add input {
    background: #0f172a;
    border: 1px solid #475569;
    color: #fff;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12.5px;
    width: 135px;
    user-select: text;
  }
  .btn {
    border: 0;
    background: #10b981;
    color: #fff;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
  }
  .btn.mute { background: #475569; }

  .canvas-wrap {
    flex: 1;
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .guide-bar {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.78);
    border: 1px solid rgba(148, 163, 184, 0.4);
    padding: 5px 16px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 700;
    color: #e2e8f0;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>

<header class="hud">
  <div class="hud-left">
    <div class="title">🚢 진상손님 잠수함 소탕작전</div>
    <div class="stat-pill">격침: <b id="killCnt">0</b>척</div>
    <div class="stat-pill">점수: <b id="scoreVal">0</b></div>
  </div>

  <div class="weapons">
    <button class="w-btn active" id="w0" onclick="selectWeapon(0)">[1] 💣폭뢰(포탄)</button>
    <button class="w-btn" id="w1" onclick="selectWeapon(1)">[2] 🚀고속어뢰</button>
    <button class="w-btn" id="w2" onclick="selectWeapon(2)">[3] 🎯유도미사일</button>
    <button class="w-btn" id="w3" onclick="selectWeapon(3)">[4] 🪨왕돌투하</button>
  </div>

  <div class="custom-add">
    <input id="newVillain" placeholder="진상 이름 추가 (예: 억지환불)" onkeydown="if(event.key==='Enter')addVillain()">
    <button class="btn" onclick="addVillain()">+잠수함출격</button>
    <button class="btn mute" id="soundBtn" onclick="toggleSound()">🔊 효과음 ON</button>
  </div>
</header>

<div class="canvas-wrap">
  <canvas id="gameCanvas"></canvas>
  <div class="guide-bar">
    조작: <b>[← / →]</b> 또는 <b>[A / D]</b> 함선 이동 · <b>[Space]</b> 또는 <b>[마우스 클릭]</b> 투하 · <b>[1~4]</b> 무기 전환 (폭뢰·어뢰·유도미사일·왕돌)
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W = 1280, H = 720, waterY = 145;
function resize() {
  W = canvas.width = canvas.parentElement.clientWidth;
  H = canvas.height = canvas.parentElement.clientHeight;
  waterY = Math.round(H * 0.21);
  buildSeabed();
}
window.addEventListener('resize', resize);

/* ==================== 효과음 신디사이저 (Web Audio API) ==================== */
let soundOn = true;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function toggleSound() {
  soundOn = !soundOn;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundOn ? '🔊 효과음 ON' : '🔇 효과음 OFF';
  btn.className = soundOn ? 'btn mute' : 'btn';
}

function playDropSound(wType) {
  if (!soundOn) return;
  try {
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    if (wType === 2) { // 유도미사일 쉬익~
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(620, now);
      osc.frequency.exponentialRampToValueAtTime(180, now + 0.25);
    } else if (wType === 3) { // 돌 묵직한 투하
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.exponentialRampToValueAtTime(65, now + 0.22);
    } else { // 포탄/어뢰 풍덩
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.16);
    }
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.27);
  } catch (e) {}
}

function playExplosionSound(isKill = true) {
  if (!soundOn) return;
  try {
    initAudio();
    const now = audioCtx.currentTime;
    // 화이트 노이즈 기반 폭발음
    const bufferSize = audioCtx.sampleRate * (isKill ? 0.55 : 0.25);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(isKill ? 520 : 320, now);
    filter.frequency.exponentialRampToValueAtTime(55, now + (isKill ? 0.52 : 0.22));

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(isKill ? 0.45 : 0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + (isKill ? 0.54 : 0.24));

    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start(now);

    if (isKill) {
      // 격침 시 통쾌한 저음 쾅 + 승전 비프
      const sub = audioCtx.createOscillator();
      const sGain = audioCtx.createGain();
      sub.type = 'triangle';
      sub.frequency.setValueAtTime(130, now);
      sub.frequency.exponentialRampToValueAtTime(32, now + 0.45);
      sGain.gain.setValueAtTime(0.4, now);
      sGain.gain.exponentialRampToValueAtTime(0.001, now + 0.46);
      sub.connect(sGain); sGain.connect(audioCtx.destination);
      sub.start(now); sub.stop(now + 0.47);
    }
  } catch (e) {}
}

/* ==================== 게임 데이터 & 엔티티 ==================== */
const villainNames = [
  '진상손님', '막무가내환불', '새벽전화폭탄', '공짜진료요구',
  '악성별점테러', '예약노쇼왕', '소리지르는손님', '무조건우기기',
  '할인강요빌런', '말안통하는진상'
];

let score = 0, kills = 0, currentWeapon = 0, shakeTime = 0, waveTick = 0;
const keys = {};

const ship = {
  x: 600,
  vx: 0,
  speed: 6.5,
  width: 145,
  height: 44,
  cooldown: 0
};

let projectiles = [];
let submarines = [];
let particles = [];
let floatingTexts = [];
let seabedRocks = [];
let seaweeds = [];
let bigFishes = [];
let bubbles = [];

function buildSeabed() {
  seabedRocks = [];
  seaweeds = [];
  const rockCount = Math.max(6, Math.floor(W / 190));
  for (let i = 0; i < rockCount; i++) {
    const rx = (W / rockCount) * i + 60 + Math.random() * 70;
    const rw = 65 + Math.random() * 65;
    const rh = 38 + Math.random() * 48;
    seabedRocks.push({ x: rx, y: H, w: rw, h: rh });
  }
  for (let i = 0; i < 24; i++) {
    seaweeds.push({
      x: Math.random() * W,
      h: 40 + Math.random() * 65,
      phase: Math.random() * Math.PI * 2,
      color: Math.random() > 0.5 ? '#059669' : '#0d9488'
    });
  }
}

function initAmbientLife() {
  bigFishes = [
    { x: 200, y: H * 0.42, vx: 1.1, size: 46, color: '#38bdf8', type: 'whale' },
    { x: 900, y: H * 0.68, vx: -1.4, size: 34, color: '#f59e0b', type: 'tuna' },
    { x: 520, y: H * 0.80, vx: 0.85, size: 38, color: '#a78bfa', type: 'ray' }
  ];
  for (let i = 0; i < 35; i++) {
    bubbles.push({
      x: Math.random() * W,
      y: waterY + Math.random() * (H - waterY),
      r: 2 + Math.random() * 4,
      vy: 0.5 + Math.random() * 1.1
    });
  }
}

function spawnSubmarine(customName = null) {
  const fromLeft = Math.random() < 0.5;
  const depthMin = waterY + 75;
  const depthMax = H - 115;
  const y = depthMin + Math.random() * Math.max(60, depthMax - depthMin);
  const isBoss = Math.random() < 0.22;
  const hp = isBoss ? 3 : 1;
  const speed = (1.3 + Math.random() * 1.6) * (isBoss ? 0.85 : 1);
  const name = customName || villainNames[Math.floor(Math.random() * villainNames.length)];

  submarines.push({
    x: fromLeft ? -130 : W + 130,
    y,
    vx: fromLeft ? speed : -speed,
    w: isBoss ? 148 : 118,
    h: isBoss ? 44 : 36,
    hp,
    maxHp: hp,
    name,
    isBoss,
    hitFlash: 0,
    bobPhase: Math.random() * Math.PI * 2
  });
}

function addVillain() {
  const inp = document.getElementById('newVillain');
  const name = inp.value.trim();
  if (!name) return;
  villainNames.push(name);
  spawnSubmarine(name);
  inp.value = '';
  inp.blur();
}

function selectWeapon(idx) {
  currentWeapon = idx;
  [0, 1, 2, 3].forEach(i => {
    document.getElementById('w' + i).className = i === idx ? 'w-btn active' : 'w-btn';
  });
}

function fireWeapon() {
  if (ship.cooldown > 0) return;
  initAudio();
  const wType = currentWeapon;
  // 0: 폭뢰(포탄), 1: 고속어뢰, 2: 유도미사일, 3: 왕돌
  const cooldowns = [16, 22, 32, 26];
  ship.cooldown = cooldowns[wType];
  playDropSound(wType);

  projectiles.push({
    x: ship.x,
    y: waterY + 8,
    vx: wType === 3 ? (Math.random() - 0.5) * 1.2 : 0,
    vy: wType === 1 ? 6.2 : wType === 3 ? 4.8 : 3.2,
    type: wType,
    rot: 0,
    life: 400
  });
}

/* ==================== 입력 이벤트 ==================== */
window.addEventListener('keydown', e => {
  if (document.activeElement.tagName === 'INPUT') return;
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); fireWeapon(); }
  if (e.key === '1') selectWeapon(0);
  if (e.key === '2') selectWeapon(1);
  if (e.key === '3') selectWeapon(2);
  if (e.key === '4') selectWeapon(3);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('mousedown', e => {
  initAudio();
  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  // 클릭 위치 쪽으로 살짝 이동하며 발사
  ship.vx = (clickX - ship.x) * 0.08;
  fireWeapon();
});

/* ==================== 파티클 & 폭발 연출 ==================== */
function createExplosion(x, y, color, count = 26, text = '') {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 5.5;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      r: 3 + Math.random() * 5,
      color: i % 2 === 0 ? color : '#fef08a',
      alpha: 1
    });
  }
  if (text) {
    floatingTexts.push({ x, y: y - 15, text, alpha: 1, vy: -1.3 });
  }
}

/* ==================== 업데이트 루프 ==================== */
function update() {
  waveTick += 0.04;
  if (shakeTime > 0) shakeTime--;
  if (ship.cooldown > 0) ship.cooldown--;

  // 함선 이동
  if (keys['ArrowLeft'] || keys['KeyA']) ship.vx = -ship.speed;
  else if (keys['ArrowRight'] || keys['KeyD']) ship.vx = ship.speed;
  else ship.vx *= 0.85;

  ship.x += ship.vx;
  ship.x = Math.max(85, Math.min(W - 85, ship.x));

  // 잠수함 스폰 유지
  if (submarines.length < 6 && Math.random() < 0.025) {
    spawnSubmarine();
  }

  // 물방울 & 큰 물고기 업데이트
  bubbles.forEach(b => {
    b.y -= b.vy;
    if (b.y < waterY + 5) {
      b.y = H - 20;
      b.x = Math.random() * W;
    }
  });

  bigFishes.forEach(f => {
    f.x += f.vx;
    if (f.vx > 0 && f.x > W + 100) f.x = -100;
    if (f.vx < 0 && f.x < -100) f.x = W + 100;
  });

  // 투하 무기 업데이트
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life--;

    if (p.type === 0) { // 일반 폭뢰 (가속 낙하)
      p.vy = Math.min(6.8, p.vy + 0.08);
    } else if (p.type === 1) { // 고속 어뢰
      p.vy = 7.8;
    } else if (p.type === 2) { // 유도 미사일 (가장 가까운 잠수함 추적)
      let nearest = null, minDist = 99999;
      submarines.forEach(s => {
        const d = Math.hypot(s.x - p.x, s.y - p.y);
        if (d < minDist) { minDist = d; nearest = s; }
      });
      if (nearest) {
        const ang = Math.atan2(nearest.y - p.y, nearest.x - p.x);
        p.vx += Math.cos(ang) * 0.45;
        p.vy += Math.sin(ang) * 0.45;
        const spd = Math.hypot(p.vx, p.vy);
        if (spd > 6.5) { p.vx = (p.vx / spd) * 6.5; p.vy = (p.vy / spd) * 6.5; }
        p.rot = Math.atan2(p.vy, p.vx) - Math.PI / 2;
      } else {
        p.vy += 0.1;
      }
      // 유도미사일 궤적 거품
      if (Math.random() < 0.6) {
        particles.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*0.6, vy: -0.5, r: 2.5, color: '#e0f2fe', alpha: 0.8 });
      }
    } else if (p.type === 3) { // 왕돌 (중력 가속 + 회전)
      p.vy = Math.min(9.5, p.vy + 0.18);
      p.rot += 0.08;
    }

    p.x += p.vx;
    p.y += p.vy;

    // 해저 바위 장애물 충돌 체크
    let hitRock = false;
    for (const r of seabedRocks) {
      if (Math.abs(p.x - r.x) < r.w * 0.42 && p.y > H - r.h * 0.75) {
        hitRock = true;
        break;
      }
    }
    if (hitRock || p.y > H - 15 || p.life <= 0) {
      createExplosion(p.x, p.y, p.type === 3 ? '#94a3b8' : '#38bdf8', 10);
      projectiles.splice(i, 1);
      continue;
    }

    // 잠수함 충돌 판정
    const dmg = (p.type === 2 || p.type === 3) ? 2 : 1;
    let hitSub = false;
    for (let j = submarines.length - 1; j >= 0; j--) {
      const s = submarines[j];
      if (Math.abs(p.x - s.x) < s.w * 0.52 && Math.abs(p.y - s.y) < s.h * 0.58) {
        hitSub = true;
        s.hp -= dmg;
        s.hitFlash = 8;
        if (s.hp <= 0) {
          // 잠수함 격침!
          kills++;
          const pts = s.isBoss ? 300 : 100;
          score += pts;
          document.getElementById('killCnt').textContent = kills;
          document.getElementById('scoreVal').textContent = score;
          shakeTime = 12;
          playExplosionSound(true);
          createExplosion(s.x, s.y, '#ef4444', 34, `💥 ${s.name} 격침! +${pts}`);
          submarines.splice(j, 1);
        } else {
          playExplosionSound(false);
          createExplosion(p.x, p.y, '#f59e0b', 14, `장갑 타격! (남은체력 ${s.hp})`);
        }
        break;
      }
    }
    if (hitSub) {
      projectiles.splice(i, 1);
    }
  }

  // 잠수함 이동 업데이트
  for (let i = submarines.length - 1; i >= 0; i--) {
    const s = submarines[i];
    s.x += s.vx;
    s.bobPhase += 0.05;
    if (s.hitFlash > 0) s.hitFlash--;
    if ((s.vx > 0 && s.x > W + 180) || (s.vx < 0 && s.x < -180)) {
      submarines.splice(i, 1);
    }
  }

  // 파티클 & 플로팅 텍스트
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy;
    pt.alpha -= 0.025;
    if (pt.alpha <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy;
    ft.alpha -= 0.016;
    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  }
}

/* ==================== 그리기 렌더링 ==================== */
function draw() {
  ctx.save();
  if (shakeTime > 0) {
    ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
  }

  // 1. 하늘 배경 (석양/야간 개항 분위기)
  const skyGrad = ctx.createLinearGradient(0, 0, 0, waterY);
  skyGrad.addColorStop(0, '#0f172a');
  skyGrad.addColorStop(0.6, '#1e3a8a');
  skyGrad.addColorStop(1, '#38bdf8');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, waterY);

  // 달/태양 광원
  ctx.fillStyle = 'rgba(254, 240, 138, 0.85)';
  ctx.beginPath();
  ctx.arc(W - 140, 58, 26, 0, Math.PI * 2);
  ctx.fill();

  // 2. 바닷속 배경 그라데이션
  const seaGrad = ctx.createLinearGradient(0, waterY, 0, H);
  seaGrad.addColorStop(0, '#0284c7');
  seaGrad.addColorStop(0.45, '#0369a1');
  seaGrad.addColorStop(1, '#082f49');
  ctx.fillStyle = seaGrad;
  ctx.fillRect(0, waterY, W, H - waterY);

  // 수중 물방울
  ctx.fillStyle = 'rgba(224, 242, 254, 0.35)';
  bubbles.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // 3. 수중 큰 물고기 (배경 생태계)
  bigFishes.forEach(f => {
    ctx.save();
    ctx.translate(f.x, f.y);
    if (f.vx < 0) ctx.scale(-1, 1);
    ctx.fillStyle = f.color;
    ctx.globalAlpha = 0.55;
    // 몸통
    ctx.beginPath();
    ctx.ellipse(0, 0, f.size, f.size * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
    // 꼬리 지느러미
    ctx.beginPath();
    ctx.moveTo(-f.size * 0.85, 0);
    ctx.lineTo(-f.size * 1.35, -f.size * 0.38);
    ctx.lineTo(-f.size * 1.35, f.size * 0.38);
    ctx.closePath();
    ctx.fill();
    // 눈
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(f.size * 0.55, -f.size * 0.1, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // 4. 해저 모래바닥, 해초 및 바위 장애물
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, H - 16, W, 16);

  // 해초
  seaweeds.forEach(sw => {
    const sway = Math.sin(waveTick + sw.phase) * 10;
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sw.x, H - 12);
    ctx.quadraticCurveTo(sw.x + sway, H - 12 - sw.h * 0.5, sw.x - sway * 0.6, H - 12 - sw.h);
    ctx.stroke();
  });

  // 해저 바위
  seabedRocks.forEach(r => {
    ctx.fillStyle = '#334155';
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(r.x - r.w * 0.5, H - 10);
    ctx.lineTo(r.x - r.w * 0.3, H - r.h);
    ctx.lineTo(r.x + r.w * 0.15, H - r.h * 0.9);
    ctx.lineTo(r.x + r.w * 0.5, H - 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  });

  // 5. 멋진 해상 구축함 (원장님 배)
  drawDestroyer(ship.x, waterY + Math.sin(waveTick * 1.5) * 3);

  // 6. 진상손님 잠수함들 그리기
  submarines.forEach(s => drawSubmarine(s));

  // 7. 투하 무기 그리기
  projectiles.forEach(p => drawProjectile(p));

  // 8. 파도 물결 라인
  ctx.strokeStyle = '#bae6fd';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 20) {
    const wy = waterY + Math.sin(x * 0.025 + waveTick * 2) * 3.5;
    if (x === 0) ctx.moveTo(x, wy);
    else ctx.lineTo(x, wy);
  }
  ctx.stroke();

  // 9. 폭발 파티클 & 플로팅 텍스트
  particles.forEach(pt => {
    ctx.globalAlpha = Math.max(0, pt.alpha);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  floatingTexts.forEach(ft => {
    ctx.globalAlpha = Math.max(0, ft.alpha);
    ctx.font = '900 18px "Malgun Gothic", sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 4;
    ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillStyle = '#fde047';
    ctx.fillText(ft.text, ft.x, ft.y);
  });
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawDestroyer(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // 함교 & 레이더 마스트
  ctx.fillStyle = '#cbd5e1';
  ctx.fillRect(-26, -34, 48, 18);
  ctx.fillStyle = '#94a3b8';
  ctx.fillRect(-14, -46, 22, 12);
  // 레이더 안테나
  ctx.strokeStyle = '#f8fafc';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-3, -46); ctx.lineTo(-3, -58);
  ctx.moveTo(-12, -55); ctx.lineTo(6, -55);
  ctx.stroke();

  // 함포(앞뒤 포탑)
  ctx.fillStyle = '#475569';
  ctx.fillRect(32, -23, 18, 8);
  ctx.fillRect(-48, -23, 16, 8);

  // 메인 선체 (날렵한 구축함 실루엣)
  ctx.fillStyle = '#e2e8f0';
  ctx.beginPath();
  ctx.moveTo(-72, -16);
  ctx.lineTo(78, -16);
  ctx.lineTo(62, 6);
  ctx.lineTo(-60, 6);
  ctx.closePath();
  ctx.fill();

  // 흘수선 붉은 띠
  ctx.fillStyle = '#dc2626';
  ctx.fillRect(-60, 2, 122, 4);

  // 함선 이름표
  ctx.fillStyle = '#0f172a';
  ctx.font = '900 11px "Malgun Gothic", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('23시 구축함', 2, -2);

  ctx.restore();
}

function drawSubmarine(s) {
  ctx.save();
  const by = s.y + Math.sin(s.bobPhase) * 3;
  ctx.translate(s.x, by);
  const dir = s.vx >= 0 ? 1 : -1;

  // 잠망경 & 상부 탑(Conning Tower)
  ctx.save();
  ctx.scale(dir, 1);
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(6, -s.h * 0.45);
  ctx.lineTo(6, -s.h * 0.85);
  ctx.lineTo(15, -s.h * 0.85);
  ctx.stroke();

  ctx.fillStyle = s.hitFlash > 0 ? '#ffffff' : (s.isBoss ? '#7f1d1d' : '#1e293b');
  ctx.fillRect(-16, -s.h * 0.68, 32, s.h * 0.35);

  // 꼬리 스크류
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(-s.w * 0.54, -8, 7, 16);
  ctx.restore();

  // 잠수함 본체 캡슐
  ctx.fillStyle = s.hitFlash > 0 ? '#ffffff' : (s.isBoss ? '#991b1b' : '#334155');
  ctx.strokeStyle = s.isBoss ? '#fca5a5' : '#94a3b8';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.roundRect(-s.w * 0.5, -s.h * 0.45, s.w, s.h * 0.9, 18);
  ctx.fill();
  ctx.stroke();

  // 선체 중앙 진상손님 이름표 (항상 정방향으로 읽기 쉽게 표시)
  ctx.fillStyle = s.isBoss ? '#fef08a' : '#ffffff';
  ctx.font = `900 ${s.isBoss ? 14 : 12.5}px "Malgun Gothic", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(s.name, 0, 1);

  // 보스 잠수함 체력바
  if (s.maxHp > 1) {
    const bw = 64;
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(-bw / 2, -s.h * 0.95 - 8, bw, 6);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-bw / 2, -s.h * 0.95 - 8, bw * (s.hp / s.maxHp), 6);
  }

  ctx.restore();
}

function drawProjectile(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);

  if (p.type === 0) { // 폭뢰 (드럼통 폭탄)
    ctx.fillStyle = '#1e293b';
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 2;
    ctx.fillRect(-7, -9, 14, 18);
    ctx.strokeRect(-7, -9, 14, 18);
  } else if (p.type === 1) { // 고속 어뢰
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(0, 14);
    ctx.lineTo(5, -10);
    ctx.lineTo(-5, -10);
    ctx.closePath();
    ctx.fill();
  } else if (p.type === 2) { // 유도 미사일
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.moveTo(0, 15);
    ctx.lineTo(6, -8);
    ctx.lineTo(0, -4);
    ctx.lineTo(-6, -8);
    ctx.closePath();
    ctx.fill();
  } else { // 왕돌 (거대 바위)
    ctx.fillStyle = '#94a3b8';
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// 초기 실행
resize();
initAmbientLife();
for (let i = 0; i < 4; i++) spawnSubmarine();
loop();
</script>
