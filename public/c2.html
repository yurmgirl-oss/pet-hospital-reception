<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C2 · 23시 하단오거리 동물병원 아날로그 계기판 & ICU 장부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #dfe7f1;
    --navy: #16243b;
    --blue: #2563eb;
    --green: #15803d;
    --amber: #d97706;
    --red: #dc2626;
    --muted: #52647c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: linear-gradient(135deg, #dce5f2 0%, #e9eff7 50%, #d8e3f0 100%);
    color: var(--navy);
    font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
    padding: 5px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 5px;
    overflow: hidden;
  }
  .mono { font-family: 'Consolas', 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

  /* 상단 헤더 */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(90deg, #16243b 0%, #23385c 100%);
    color: #f8fafc;
    border-radius: 9px;
    padding: 4px 12px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(22, 36, 59, 0.18);
  }
  .topbar h1 { margin: 0; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; letter-spacing: -0.3px; }
  .badge { background: #38bdf8; color: #0f172a; padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: 900; }
  .top-right { display: flex; align-items: center; gap: 7px; }
  .clock-pill { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); padding: 2px 9px; border-radius: 6px; font-size: 14.5px; font-weight: 800; color: #7dd3fc; }

  .btn {
    border: 1px solid #cbd5e1;
    background: #ffffff;
    color: var(--navy);
    border-radius: 5px;
    padding: 3px 7px;
    font-size: 11px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: 0.12s;
    white-space: nowrap;
  }
  .btn:hover { background: #f1f5f9; border-color: #94a3b8; }
  .btn.active { background: #2563eb; border-color: #1d4ed8; color: #fff; }
  .btn.green { background: #16a34a; border-color: #15803d; color: #fff; }
  .btn.amber { background: #d97706; border-color: #b45309; color: #fff; }
  .btn.red { background: #dc2626; border-color: #b91c1c; color: #fff; }

  /* 5단 가로 배치 메인 그리드 */
  .five-grid {
    display: grid;
    grid-template-columns: 0.92fr 1.32fr 1.02fr 0.92fr 1.42fr;
    gap: 6px;
    flex: 1;
    min-height: 0;
  }
  .frame {
    border-radius: 11px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-height: 0;
    min-width: 0;
    box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);
  }
  .zone-timer  { background: linear-gradient(180deg, #fff5f5 0%, #ffeaea 100%); border: 1.5px solid #fecaca; }
  .zone-chrono { background: linear-gradient(180deg, #f0f7ff 0%, #e3effd 100%); border: 1.5px solid #bfdbfe; }
  .zone-touch  { background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%); border: 1.5px solid #fde68a; }
  .zone-bp     { background: linear-gradient(180deg, #f5f3ff 0%, #ede9fe 100%); border: 1.5px solid #ddd6fe; }
  .zone-icu    { background: linear-gradient(180deg, #f0fdf4 0%, #e2f8ea 100%); border: 1.5px solid #bbf7d0; }

  .frame-head {
    font-size: 13px;
    font-weight: 800;
    color: var(--navy);
    border-bottom: 1.5px solid rgba(15, 23, 42, 0.1);
    padding-bottom: 3px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }

  /* 1열: 타이머존 (3슬롯) */
  .v-stack-3 { display: grid; grid-template-rows: repeat(3, 1fr); gap: 5px; flex: 1; min-height: 0; }

  /* 2열: 경과시간존 (6슬롯 = 2열 × 3행) */
  .grid-2x3 { display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); gap: 5px; flex: 1; min-height: 0; }

  .clock-card {
    background: rgba(255, 255, 255, 0.94);
    border: 1.5px solid #cbd5e1;
    border-radius: 9px;
    padding: 4px 5px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
    transition: 0.2s;
    box-shadow: 0 2px 5px rgba(15, 23, 42, 0.04);
  }
  .clock-card.running { border-color: #2563eb; background: #ffffff; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15); }
  .clock-card.warn { border-color: #f59e0b; background: #fffbeb; animation: pulseWarn 1.2s infinite; }
  .clock-card.alarm { border-color: #dc2626; background: #fef2f2; animation: pulseAlarm 0.6s infinite; }
  @keyframes pulseWarn { 50% { box-shadow: 0 0 12px rgba(245, 158, 11, 0.55); } }
  @keyframes pulseAlarm { 50% { box-shadow: 0 0 16px rgba(220, 38, 38, 0.75); } }

  .card-input {
    width: 100%;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    border-radius: 4px;
    padding: 2px 4px;
    font-size: 11.5px;
    font-weight: 800;
    font-family: inherit;
    text-align: center;
    color: var(--navy);
    flex-shrink: 0;
  }
  .card-input:focus { outline: none; border-color: var(--blue); background: #fff; }

  /* 시계 SVG 영역을 가득 키움 */
  .svg-box {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    min-width: 0;
    width: 100%;
    padding: 1px;
  }
  .svg-box svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 2px 3px rgba(15,23,42,0.12));
  }

  .mini-presets { display: flex; gap: 2px; justify-content: center; width: 100%; }
  .mini-presets button {
    flex: 1;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    border-radius: 4px;
    padding: 1.5px 0;
    font-size: 10px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    color: #334155;
  }
  .mini-presets button:hover { background: var(--red); color: #fff; border-color: var(--red); }
  .mini-act { display: grid; grid-template-columns: 36px 1fr 1fr; gap: 2px; width: 100%; margin-top: 2px; }
  .mini-act input {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    text-align: center;
    font-size: 11px;
    font-weight: 800;
    padding: 1px;
  }
  .mini-act-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 100%; flex-shrink: 0; }

  /* 3열 & 4열 상하 2분할 스택 */
  .v-stack-2 { display: grid; grid-template-rows: 1fr 1fr; gap: 5px; flex: 1; min-height: 0; }

  /* 3열: 터치존 카드 (2개) */
  .touch-card {
    background: rgba(255, 255, 255, 0.95);
    border: 1.5px solid #fcd34d;
    border-radius: 10px;
    padding: 5px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-height: 0;
    overflow: hidden;
  }
  .mode-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; flex-shrink: 0; }
  .touch-pad {
    flex: 1;
    background: linear-gradient(180deg, #fffdf7, #fef9e7);
    border: 1.5px solid #f59e0b;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    padding: 2px;
    text-align: center;
    transition: 0.08s;
    min-height: 0;
    overflow: hidden;
  }
  .touch-pad svg {
    width: 100%;
    height: 100%;
    flex: 1;
    min-height: 0;
    display: block;
  }
  .touch-pad:active, .touch-pad.pulse { transform: scale(0.985); border-color: var(--blue); box-shadow: 0 0 12px rgba(37, 99, 235, 0.25); }
  .prog-bar { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
  .prog-fill { height: 100%; width: 0%; background: var(--blue); transition: width 0.1s linear; }

  /* 4열: 혈압존 카드 (2개) */
  .bp-card {
    background: rgba(255, 255, 255, 0.95);
    border: 1.5px solid #c4b5fd;
    border-radius: 10px;
    padding: 5px 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 3px;
    min-height: 0;
    overflow: hidden;
  }
  .bp-dial-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
    width: 100%;
  }
  .bp-dial-area svg {
    width: 100%;
    height: 100%;
    flex: 1;
    min-height: 0;
    display: block;
  }
  .bp-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; align-items: end; flex-shrink: 0; }
  .bp-field label { display: block; font-size: 10px; font-weight: 800; color: var(--muted); margin-bottom: 1px; text-align: center; }
  .bp-field input {
    width: 100%;
    border: 1.5px solid #cbd5e1;
    border-radius: 5px;
    padding: 3px 2px;
    font-size: 15px;
    font-weight: 800;
    text-align: center;
    color: var(--navy);
  }
  .bp-map-pill {
    background: #f3e8ff;
    border: 1.5px solid #d8b4fe;
    border-radius: 5px;
    padding: 3px 2px;
    text-align: center;
    font-size: 14.5px;
    font-weight: 900;
    color: #581c87;
  }

  /* 5열: 집중 ICU존 (상하 2개) */
  .icu-box {
    border: 1.5px solid #86efac;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 10px;
    padding: 5px 7px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
  }
  .icu-box.icu1 { border-color: #93c5fd; }
  .icu-top { display: flex; align-items: center; gap: 4px; }
  .icu-tag { background: var(--blue); color: #fff; font-size: 11px; font-weight: 800; padding: 3px 6px; border-radius: 5px; white-space: nowrap; }
  .icu-box.icu2 .icu-tag { background: var(--green); }
  .icu-pt { flex: 1; border: 1px solid #cbd5e1; border-radius: 5px; padding: 3px 6px; font-size: 12px; font-weight: 800; font-family: inherit; min-width: 0; }

  .gauges-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    background: #f1f5f9;
    padding: 3px 5px;
    border-radius: 6px;
    font-size: 10.5px;
    font-weight: 800;
  }
  .gauges-4 input[type=range] { width: 100%; margin: 0; height: 12px; accent-color: var(--blue); cursor: pointer; }

  .icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
  .ico-btn {
    border: 1px solid #cbd5e1;
    background: #ffffff;
    border-radius: 5px;
    padding: 2.5px 1px;
    font-size: 10.5px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    color: var(--navy);
    transition: 0.1s;
  }
  .ico-btn:hover { background: #eff6ff; border-color: #3b82f6; }
  .ico-btn.selected { background: #1d4ed8; border-color: #1e40af; color: #ffffff; }
  .icu-box.icu2 .ico-btn.selected { background: #15803d; border-color: #166534; }

  .icu-input-row { display: flex; gap: 4px; }
  .icu-input-row input {
    flex: 1;
    border: 1px solid #cbd5e1;
    border-radius: 5px;
    padding: 3px 6px;
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    min-width: 0;
  }
  .icu-textarea {
    flex: 1;
    width: 100%;
    border: 1px solid #cbd5e1;
    background: #fffef7;
    border-radius: 6px;
    padding: 4px 6px;
    font-family: 'Pretendard', 'Consolas', sans-serif;
    font-size: 11.5px;
    line-height: 1.4;
    resize: none;
    color: var(--navy);
  }
</style>
</head>
<body>

<!-- 상단 헤더 -->
<header class="topbar">
  <h1><span class="badge">23시 하단오거리 동물병원</span> 아날로그 임상 계기판 & 집중 ICU 처치 장부</h1>
  <div class="top-right">
    <div class="clock-pill mono" id="mainClock">00:00:00</div>
    <button class="btn active" id="btnSound" onclick="toggleAudio()">🔊 차임벨 ON</button>
    <button class="btn active" id="btnVoice" onclick="toggleVoice()">🗣️ 음성알람 ON</button>
    <button class="btn red" onclick="stopAllAlarms()">🔕 모든 알람 끄기</button>
  </div>
</header>

<!-- 5단 가로 배치 메인 그리드 -->
<main class="five-grid">

  <!-- [1] 타이머존 (3슬롯 입체 크로노그래프 시계) -->
  <section class="frame zone-timer">
    <div class="frame-head"><span><i class="dot" style="background:#dc2626"></i>1. 타이머존</span><span style="font-size:11px;color:#b91c1c">알람 타이머</span></div>
    <div class="v-stack-3" id="timerStack"></div>
  </section>

  <!-- [2] 경과시간존 (6슬롯 2x3 아날로그 스톱워치) -->
  <section class="frame zone-chrono">
    <div class="frame-head"><span><i class="dot" style="background:#2563eb"></i>2. 경과시간존 (6개)</span><span style="font-size:11px;color:#1d4ed8">아날로그 계측</span></div>
    <div class="grid-2x3" id="chronoGrid"></div>
  </section>

  <!-- [3] 터치존 (상·하 2개 독립 계측기) -->
  <section class="frame zone-touch">
    <div class="frame-head"><span><i class="dot" style="background:#d97706"></i>3. 터치존 (2개)</span><span style="font-size:11px;color:#b45309">호흡·드랍·심박</span></div>
    <div class="v-stack-2" id="touchStack"></div>
  </section>

  <!-- [4] 혈압존 (상·하 2개 독립 혈압계) -->
  <section class="frame zone-bp">
    <div class="frame-head"><span><i class="dot" style="background:#7c3aed"></i>4. 혈압존 (2개)</span><span style="font-size:11px;color:#6d28d9">SBP·DBP·MAP</span></div>
    <div class="v-stack-2" id="bpStack"></div>
  </section>

  <!-- [5] 집중 ICU존 (상·하 2개 처치 장부) -->
  <section class="frame zone-icu">
    <div class="frame-head"><span><i class="dot" style="background:#16a34a"></i>5. 집중 ICU존 (2베드)</span><span style="font-size:11px;color:#15803d">아이콘기록 · TXT저장</span></div>
    <div class="v-stack-2" id="icuStack"></div>
  </section>

</main>

<script>
const $ = id => document.getElementById(id);
let soundEnabled = true, voiceEnabled = true, audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playChime(type = 'info') {
  if (!soundEnabled) return;
  try {
    ensureAudio();
    const now = audioCtx.currentTime;
    const freqs = type === 'alarm' ? [880, 1174.66, 880, 1174.66] : type === 'warn' ? [659.25, 523.25] : [783.99, 1046.5];
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now + i * 0.18);
      gain.gain.setValueAtTime(0.22, now + i * 0.18);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.25);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + i * 0.18); osc.stop(now + i * 0.18 + 0.26);
    });
  } catch (e) {}
}

function speakText(txt) {
  if (!voiceEnabled || !('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'ko-KR'; u.rate = 1.05;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function toggleAudio() {
  soundEnabled = !soundEnabled;
  $('btnSound').textContent = soundEnabled ? '🔊 차임벨 ON' : '🔇 차임벨 OFF';
  $('btnSound').className = soundEnabled ? 'btn active' : 'btn';
  if (soundEnabled) playChime('info');
}

function toggleVoice() {
  voiceEnabled = !voiceEnabled;
  $('btnVoice').textContent = voiceEnabled ? '🗣️ 음성알람 ON' : '🤐 음성알람 OFF';
  $('btnVoice').className = voiceEnabled ? 'btn active' : 'btn';
}

setInterval(() => { $('mainClock').textContent = new Date().toTimeString().slice(0, 8); }, 1000);
$('mainClock').textContent = new Date().toTimeString().slice(0, 8);

/* ==================== 시계 눈금 & 부채꼴 헬퍼 ==================== */
function buildFancyTicks(cx, cy, rOut, rInMaj, rInMin, numColor = '#1e293b') {
  let s = '';
  for (let i = 0; i < 60; i++) {
    const rad = (i * 6 - 90) * Math.PI / 180;
    const maj = i % 5 === 0;
    const r1 = maj ? rInMaj : rInMin;
    s += `<line x1="${(cx + r1 * Math.cos(rad)).toFixed(1)}" y1="${(cy + r1 * Math.sin(rad)).toFixed(1)}" x2="${(cx + rOut * Math.cos(rad)).toFixed(1)}" y2="${(cy + rOut * Math.sin(rad)).toFixed(1)}" stroke="${maj ? '#0f172a' : '#94a3b8'}" stroke-width="${maj ? 2.4 : 1.1}"/>`;
    if (maj) {
      const val = i === 0 ? 60 : i;
      const rt = rInMaj - 11;
      const isQuarter = i % 15 === 0;
      s += `<text x="${(cx + rt * Math.cos(rad)).toFixed(1)}" y="${(cy + rt * Math.sin(rad) + 4).toFixed(1)}" text-anchor="middle" font-size="${isQuarter ? 12 : 9.5}" font-weight="${isQuarter ? 900 : 700}" fill="${isQuarter ? '#dc2626' : numColor}">${val}</text>`;
    }
  }
  return s;
}

function describeSector(cx, cy, r, startDeg, endDeg) {
  if (endDeg <= startDeg) return '';
  if (endDeg - startDeg >= 359.9) return `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx - 0.01} ${cy - r} Z`;
  const r1 = (startDeg - 90) * Math.PI / 180, r2 = (endDeg - 90) * Math.PI / 180;
  const x1 = cx + r * Math.cos(r1), y1 = cy + r * Math.sin(r1);
  const x2 = cx + r * Math.cos(r2), y2 = cy + r * Math.sin(r2);
  return `M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${endDeg - startDeg > 180 ? 1 : 0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z`;
}

/* ==================== [1] 타이머존 (3슬롯 · 대형 크로노그래프 시계) ==================== */
const timerNames = ['타이머 1 (PCV재검)', '타이머 2 (인슐린)', '타이머 3 (처치/멸균)'];
const timers = Array.from({ length: 3 }, (_, i) => ({ id: i, remain: 0, running: false, alarming: false, warned: false }));

function renderTimers() {
  const ticks = buildFancyTicks(70, 70, 61, 52, 57);
  $('timerStack').innerHTML = timers.map(t => `
    <div class="clock-card" id="tCard${t.id}">
      <input class="card-input" id="tName${t.id}" placeholder="${timerNames[t.id]}">
      <div class="svg-box">
        <svg viewBox="0 0 140 140" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="bezelGrad${t.id}" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#334155"/>
              <stop offset="50%" stop-color="#0f172a"/>
              <stop offset="100%" stop-color="#475569"/>
            </linearGradient>
            <radialGradient id="dialGrad${t.id}" cx="50%" cy="45%" r="55%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="85%" stop-color="#f8fafc"/>
              <stop offset="100%" stop-color="#e2e8f0"/>
            </radialGradient>
          </defs>
          <rect x="63" y="0" width="14" height="6" rx="2" fill="#475569"/>
          <circle cx="70" cy="71" r="68" fill="url(#bezelGrad${t.id})"/>
          <circle cx="70" cy="71" r="63" fill="url(#dialGrad${t.id})" stroke="#cbd5e1" stroke-width="1"/>
          <g transform="translate(0,1)">
            <path id="tSec${t.id}" d="" fill="rgba(220, 38, 38, 0.24)"/>
            ${ticks}

function fmtMMSS(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function updateTimerUI(id) {
  const t = timers[id];
  $('tTxt' + id).textContent = fmtMMSS(t.remain);
  const deg = Math.min(360, (t.remain / 3600) * 360);
  $('tHand' + id).setAttribute('transform', `rotate(${deg.toFixed(1)} 70 70)`);
  $('tSec' + id).setAttribute('d', describeSector(70, 70, 51, 0, deg));
  const card = $('tCard' + id), btn = $('tBtn' + id);
  card.classList.remove('running', 'warn', 'alarm');
  if (t.alarming) { card.classList.add('alarm'); btn.textContent = '알람끔'; btn.className = 'btn red'; }
  else if (t.running) { card.classList.add(t.remain <= 120 ? 'warn' : 'running'); btn.textContent = '정지'; btn.className = 'btn amber'; }
  else { btn.textContent = '시작'; btn.className = 'btn green'; }
}

function setTimer(id, min) {
  ensureAudio();
  const t = timers[id];
  t.remain = min * 60; t.running = true; t.alarming = false; t.warned = false;
  $('tMin' + id).value = min;
  updateTimerUI(id);
}

function toggleTimer(id) {
  ensureAudio();
  const t = timers[id];
  if (t.alarming) { resetTimer(id); return; }
  if (!t.running) {
    if (t.remain <= 0) t.remain = Math.max(1, parseFloat($('tMin' + id).value) || 10) * 60;
    t.running = true;
  } else t.running = false;
  updateTimerUI(id);
}

function resetTimer(id) {
  const t = timers[id];
  t.running = false; t.remain = 0; t.alarming = false; t.warned = false;
  updateTimerUI(id);
}

function stopAllAlarms() {
  timers.forEach(t => { if (t.alarming) resetTimer(t.id); });
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

setInterval(() => {
  timers.forEach(t => {
    if (t.running && t.remain > 0) {
      t.remain--;
      if (t.remain === 120 && !t.warned) { t.warned = true; playChime('warn'); }
      if (t.remain === 0) {
        t.running = false; t.alarming = true;
        const lbl = $('tName' + t.id).value.trim() || timerNames[t.id];
        playChime('alarm'); speakText(`${lbl} 시간입니다.`);
      }
      updateTimerUI(t.id);
    } else if (t.alarming && Math.floor(Date.now() / 1000) % 6 === 0) playChime('alarm');
  });
}, 1000);

function buildTachoTicks(maxVal) {
  let html = '';
  for (let i = 0; i <= 16; i++) {
    const val = (maxVal / 16) * i;
    const deg = -110 + (val / maxVal) * 220;
    const rad = (deg - 90) * Math.PI / 180;
    const maj = i % 2 === 0;
    const r1 = maj ? 76 : 82, r2 = 90;
    html += `<line x1="${(110 + r1 * Math.cos(rad)).toFixed(1)}" y1="${(108 + r1 * Math.sin(rad)).toFixed(1)}" x2="${(110 + r2 * Math.cos(rad)).toFixed(1)}" y2="${(108 + r2 * Math.sin(rad)).toFixed(1)}" stroke="#334155" stroke-width="${maj ? 2 : 1.1}"/>`;
    if (maj) {
      const rt = 63;
      html += `<text x="${(110 + rt * Math.cos(rad)).toFixed(1)}" y="${(108 + rt * Math.sin(rad) + 4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#1e293b">${Math.round(val)}</text>`;
    }
  }
  return html;
}

function setTMode(id, mode) {
  const st = touchStates[id];
  st.mode = mode;
  ['rr', 'drop', 'hr'].forEach(m => $(`tm_${id}_${m}`).className = m === mode ? 'btn active' : 'btn');
  $('tDropBar' + id).style.display = mode === 'drop' ? 'flex' : 'none';
  $('tTicks' + id).innerHTML = buildTachoTicks(mode === 'rr' ? 80 : mode === 'drop' ? 120 : 240);
  resetT(id);
}

function setTDrop(id, df) {
  touchStates[id].dropFactor = df;
  $('tDf_' + id + '_20').className = df === 20 ? 'btn active' : 'btn';
  $('tDf_' + id + '_60').className = df === 60 ? 'btn active' : 'btn';
  resetT(id);
}

function setTDur(id, sec) {
  touchStates[id].dur = sec;
  [15, 30, 60].forEach(d => $(`td_${id}_${d}`).className = d === sec ? 'btn active' : 'btn');
  resetT(id);
}

function tapT(id) {
  ensureAudio();
  const st = touchStates[id];
  if (st.done) resetT(id);
  const now = Date.now();
  if (st.taps.length === 0) {
    st.startMs = now;
    st.timer = setInterval(() => tickT(id), 100);
  }
  st.taps.push(now);
  const pad = $('tPad' + id);
  pad.classList.add('pulse');
  setTimeout(() => pad.classList.remove('pulse'), 100);

  const rate = st.taps.length >= 2
    ? Math.round(((st.taps.length - 1) / ((now - st.taps[0]) / 1000)) * 60)
    : Math.round(60 / st.dur);
  updateTVisual(id, rate);
}

function tickT(id) {
  const st = touchStates[id];
  if (!st.startMs) return;
  const elapsed = (Date.now() - st.startMs) / 1000;
  $('tProg' + id).style.width = Math.min(100, (elapsed / st.dur) * 100) + '%';
  $('tElap' + id).textContent = `${Math.min(st.dur, elapsed).toFixed(0)}s·${st.taps.length}회`;
  if (elapsed >= st.dur) {
    clearInterval(st.timer); st.timer = null; st.done = true;
    const finalRate = Math.round(st.taps.length * (60 / st.dur));
    updateTVisual(id, finalRate);
    $('tHint' + id).textContent = `✅ 완료 (${st.taps.length}회/${st.dur}초)`;
    playChime('info'); speakText(`측정 완료. 분당 ${finalRate}회 입니다.`);
  }
}

function updateTVisual(id, rate) {
  const st = touchStates[id];
  const maxS = st.mode === 'rr' ? 80 : st.mode === 'drop' ? 120 : 240;
  const deg = -110 + (Math.max(0, Math.min(maxS, rate)) / maxS) * 220;
  $('tNeedle' + id).setAttribute('transform', `rotate(${deg.toFixed(1)} 110 108)`);
  if (st.mode === 'rr') {
    $('tVal' + id).textContent = `${rate} 회/분`;
    $('tVal' + id).setAttribute('fill', rate > 40 ? '#dc2626' : rate > 30 ? '#d97706' : '#16a34a');
    $('tExtra' + id).textContent = rate > 30 ? '⚠ 30회 초과 주의' : '✓ 정상 호흡수';
    st.summary = `🫁 호흡수 : ${rate} 회/분 (${st.dur}초)`;
  } else if (st.mode === 'drop') {
    const mlHr = ((rate * 60) / st.dropFactor).toFixed(1);
    $('tVal' + id).textContent = `${rate} gtt/m`;
    $('tVal' + id).setAttribute('fill', '#1d4ed8');
    $('tExtra' + id).textContent = `약 ${mlHr} mL/hr (${st.dropFactor}방울)`;
    st.summary = `🧴 수액속도 : ${mlHr} mL/hr (${rate}방울/분, ${st.dropFactor}gtt)`;
  } else {
    $('tVal' + id).textContent = `${rate} BPM`;
    $('tVal' + id).setAttribute('fill', rate > 180 || rate < 60 ? '#dc2626' : '#16a34a');
    $('tExtra' + id).textContent = `심박수 ${rate} bpm`;
    st.summary = `❤️ 심박수 : ${rate} BPM (${st.dur}초)`;
  }
}

function resetT(id) {
  const st = touchStates[id];
  clearInterval(st.timer); st.timer = null; st.taps = []; st.startMs = 0; st.done = false; st.summary = '';
  $('tNeedle' + id).setAttribute('transform', 'rotate(-110 110 108)');
  $('tVal' + id).textContent = st.mode === 'drop' ? '0 gtt/m' : st.mode === 'hr' ? '0 BPM' : '0 회/분';
  $('tVal' + id).setAttribute('fill', '#1e293b');
  $('tExtra' + id).textContent = '';
  $('tProg' + id).style.width = '0%';
  $('tElap' + id).textContent = '0s·0회';
  $('tHint' + id).textContent = `터치계기 #${id + 1} · 박자마다 클릭`;
}

function sendTToIcu(id, icuIdx) {
  const st = touchStates[id];
  if (!st.summary) { alert('먼저 측정을 진행해주세요.'); return; }
  const [tag, val] = st.summary.split(' : ');
  appendIcuLine(icuIdx, tag, val);
}

function calcBp(id) {
  const sys = parseFloat($('bpSys' + id).value) || 0;
  const dia = parseFloat($('bpDia' + id).value) || 0;
  const map = Math.round(dia + (sys - dia) / 3);
  $('bpMap' + id).textContent = `${map}`;

  const clamped = Math.max(60, Math.min(200, sys));
  const deg = -75 + ((clamped - 60) / 140) * 150;
  $('bpNeedle' + id).setAttribute('transform', `rotate(${deg.toFixed(1)} 110 112)`);

  const st = $('bpStat' + id);
  if (sys < 90 || map < 65) { st.textContent = '🚨 저혈압 경고 (관류 저하)'; st.style.color = '#dc2626'; }
  else if (sys > 160) { st.textContent = '🚨 고혈압 경고 (장기손상 주의)'; st.style.color = '#dc2626'; }
  else if (sys > 140) { st.textContent = '⚠ 경계성 고혈압'; st.style.color = '#d97706'; }
  else { st.textContent = '✓ 정상 혈압 (SBP 90~140)'; st.style.color = '#16a34a'; }
}

function sendBpToIcu(bpId, icuIdx) {
  const sys = $('bpSys' + bpId).value || '-';
  const dia = $('bpDia' + bpId).value || '-';
  const map = $('bpMap' + bpId).textContent;
  appendIcuLine(icuIdx, '🩸 혈압측정', `${sys}/${dia} mmHg (MAP ${map})`);
}

/* ==================== [5] 집중 ICU존 (우측 2베드 · 아이콘 선택 연동) ==================== */
const icuIcons = [
  { ico: '💧', name: '물(음수)' },
  { ico: '🍚', name: '밥(식이)' },
  { ico: '🟡', name: '오줌(배뇨)' },
  { ico: '💩', name: '변(배변)' },
  { ico: '💉', name: '주사투약' },
  { ico: '🧴', name: '수액처치' },
  { ico: '🫧', name: '산소공급' },
  { ico: '🌡️', name: '실내온도' },
  { ico: '🩺', name: '체온측정' },
  { ico: '🫁', name: '호흡수' },
  { ico: '⚖️', name: '체중측정' }
];
const selectedIcuIcon = ['🩺 체온측정', '🩺 체온측정'];

function renderIcuStack() {
  $('icuStack').innerHTML = [0, 1].map(idx => `
    <div class="icu-box ${idx === 0 ? 'icu1' : 'icu2'}">
      <div class="icu-top">
        <span class="icu-tag">ICU #${idx + 1}</span>
        <input class="icu-pt" id="icuPt${idx}" placeholder="환자명 · 품종 · 체중 · 진단명">
        <button class="btn" style="padding:2px 6px;font-size:11px" onclick="copyIcu(${idx})">복사</button>
        <button class="btn ${idx === 0 ? 'active' : 'green'}" style="padding:2px 7px;font-size:11px" onclick="saveIcuTxt(${idx})">TXT저장</button>
      </div>

      <div class="gauges-4">
        <div><div style="display:flex;justify-content:space-between"><span>🍚밥</span><span id="gF${idx}">50%</span></div><input type="range" min="0" max="100" step="10" value="50" oninput="$('gF${idx}').textContent=this.value+'%'"></div>
        <div><div style="display:flex;justify-content:space-between"><span>💧물</span><span id="gW${idx}">50%</span></div><input type="range" min="0" max="100" step="10" value="50" oninput="$('gW${idx}').textContent=this.value+'%'"></div>
        <div><div style="display:flex;justify-content:space-between"><span>⚡활력</span><span id="gV${idx}">50%</span></div><input type="range" min="0" max="100" step="10" value="50" oninput="$('gV${idx}').textContent=this.value+'%'"></div>
        <div><div style="display:flex;justify-content:space-between"><span>🧴수액</span><span id="gL${idx}">100%</span></div><input type="range" min="0" max="100" step="5" value="100" oninput="$('gL${idx}').textContent=this.value+'%'"></div>
      </div>

      <div class="icon-grid" id="icoGrid${idx}">
        ${icuIcons.map(item => {
          const fullLabel = `${item.ico} ${item.name}`;
          const isSel = selectedIcuIcon[idx] === fullLabel ? 'selected' : '';
          return `<button type="button" class="ico-btn ${isSel}" onclick="selectAndLogIcon(${idx}, '${fullLabel}', this)">${item.ico}${item.name.split('(')[0]}</button>`;
        }).join('')}
        <button type="button" class="ico-btn" style="background:#fef2f2;border-color:#fca5a5;color:#b91c1c" onclick="if(confirm('장부를 비울까요?'))$('icuLog${idx}').value=''">🗑️비움</button>
      </div>

      <div class="icu-input-row">
        <input id="icuNote${idx}" placeholder="[🩺 체온측정] 선택됨 — 수치/내용 입력 후 Enter" onkeydown="if(event.key==='Enter') submitSelectedIconNote(${idx})">
        <button class="btn ${idx === 0 ? 'active' : 'green'}" style="padding:3px 8px;font-size:11px" onclick="submitSelectedIconNote(${idx})">+ 기록</button>
      </div>

      <textarea class="icu-textarea" id="icuLog${idx}" placeholder="아이콘을 누르면 해당 아이콘 이름으로 시각과 함께 자동 기록됩니다. 내용을 입력 후 Enter를 눌러도 선택된 아이콘 이름으로 기록됩니다."></textarea>
    </div>
  `).join('');
}
renderIcuStack();

function selectAndLogIcon(idx, fullLabel, btnEl) {
  selectedIcuIcon[idx] = fullLabel;
  $('icoGrid' + idx).querySelectorAll('.ico-btn').forEach(b => b.classList.remove('selected'));
  btnEl.classList.add('selected');

  const noteInput = $('icuNote' + idx);
  noteInput.placeholder = `[${fullLabel}] 선택됨 — 수치/내용 입력 후 Enter`;
  const typed = noteInput.value.trim();
  appendIcuLine(idx, fullLabel, typed);
  noteInput.value = '';
  noteInput.focus();
}

function submitSelectedIconNote(idx) {
  const noteInput = $('icuNote' + idx);
  const typed = noteInput.value.trim();
  const tag = selectedIcuIcon[idx] || '🩺 체온측정';
  appendIcuLine(idx, tag, typed);
  noteInput.value = '';
  noteInput.focus();
}

function appendIcuLine(idx, tag, detail = '') {
  const nowStr = new Date().toTimeString().slice(0, 5);
  const area = $('icuLog' + idx);
  area.value += `[${nowStr}] ${tag}${detail ? ' : ' + detail : ''}\n`;
  area.scrollTop = area.scrollHeight;
}

function buildIcuReport(idx) {
  const pt = $('icuPt' + idx).value.trim() || `ICU_${idx + 1}번환자`;
  const today = new Date().toISOString().slice(0, 10);
  return `[23시 하단오거리 동물병원 집중 ICU #${idx + 1} 처치 장부 - ${today}]
- 환자정보: ${pt}
- 상태게이지: 밥 ${$('gF' + idx).textContent} | 물 ${$('gW' + idx).textContent} | 활력 ${$('gV' + idx).textContent} | 수액잔량 ${$('gL' + idx).textContent}
--------------------------------------------------
${$('icuLog' + idx).value.trim() || '(기록된 처치 내역 없음)'}`;
}

function copyIcu(idx) {
  navigator.clipboard.writeText(buildIcuReport(idx)).then(() => alert(`집중 ICU #${idx + 1} 장부가 복사되었습니다.`));
}

function saveIcuTxt(idx) {
  const pt = ($('icuPt' + idx).value.trim() || `ICU_${idx + 1}번`).replace(/[\\/:*?"<>|]/g, '_');
  const today = new Date().toISOString().slice(0, 10);
  const blob = new Blob([buildIcuReport(idx)], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${pt}_${today}_ICU장부.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
</script>
</body>
</html>
