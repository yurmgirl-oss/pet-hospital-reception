<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C2 · 23시 동물병원 5단 아날로그 임상 계기판 & ICU 장부</title>
<style>
  :root {
    --bg: #edf2f7;
    --panel: #ffffff;
    --border: #c5d3e3;
    --navy: #1e293b;
    --blue: #2563eb;
    --green: #16a34a;
    --amber: #d97706;
    --red: #dc2626;
    --muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--navy);
    font-family: 'Malgun Gothic', 'Segoe UI', Arial, sans-serif;
    padding: 6px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow: hidden;
  }
  .mono { font-family: 'Consolas', 'Courier New', monospace; }

  /* 상단 헤더 */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 4px 12px;
    flex-shrink: 0;
  }
  .topbar h1 { margin: 0; font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .badge { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; padding: 2px 7px; border-radius: 5px; font-size: 11.5px; }
  .top-right { display: flex; align-items: center; gap: 8px; }
  .clock-pill { background: #f8fafc; border: 1px solid #cbd5e1; padding: 2px 9px; border-radius: 6px; font-size: 15px; font-weight: 800; }

  .btn {
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    color: var(--navy);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.1s;
    white-space: nowrap;
  }
  .btn:hover { background: #e2e8f0; }
  .btn.active { background: var(--blue); border-color: #1d4ed8; color: #fff; }
  .btn.green { background: var(--green); border-color: #15803d; color: #fff; }
  .btn.amber { background: var(--amber); border-color: #b45309; color: #fff; }
  .btn.red { background: var(--red); border-color: #b91c1c; color: #fff; }

  /* 5단 가로 나란히 프레임 그리드 */
  .five-grid {
    display: grid;
    grid-template-columns: 0.85fr 0.85fr 1.05fr 0.92fr 1.55fr;
    gap: 7px;
    flex: 1;
    min-height: 0;
  }
  .frame {
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 7px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
    min-width: 0;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
  }
  .frame-head {
    font-size: 14px;
    font-weight: 800;
    color: var(--navy);
    border-bottom: 1.5px solid #e2e8f0;
    padding-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }

  /* 1 & 2 프레임: 세로 3슬롯 정사각형 시계 카드 */
  .v-stack-3 {
    display: grid;
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
    flex: 1;
    min-height: 0;
  }
  .clock-card {
    background: #f8fafc;
    border: 1.5px solid #cbd5e1;
    border-radius: 9px;
    padding: 5px 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    min-height: 0;
    transition: 0.2s;
  }
  .clock-card.running { border-color: #3b82f6; background: #f0f7ff; }
  .clock-card.warn { border-color: #f59e0b; background: #fffbeb; animation: pulseWarn 1.2s infinite; }
  .clock-card.alarm { border-color: #dc2626; background: #fef2f2; animation: pulseAlarm 0.6s infinite; }
  @keyframes pulseWarn { 50% { box-shadow: 0 0 9px rgba(245, 158, 11, 0.45); } }
  @keyframes pulseAlarm { 50% { box-shadow: 0 0 14px rgba(220, 38, 38, 0.65); } }

  .card-input {
    width: 100%;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    border-radius: 4px;
    padding: 2px 5px;
    font-size: 12px;
    font-weight: 800;
    text-align: center;
    color: var(--navy);
  }
  .svg-box {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    width: 100%;
  }
  .svg-box svg { height: 100%; max-height: 112px; width: auto; }
  .mini-presets { display: flex; gap: 2px; justify-content: center; width: 100%; }
  .mini-presets button {
    flex: 1;
    border: 1px solid #cbd5e1;
    background: #fff;
    border-radius: 4px;
    padding: 1.5px 0;
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .mini-presets button:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
  .mini-act { display: grid; grid-template-columns: 38px 1fr 1fr; gap: 3px; width: 100%; margin-top: 2px; }
  .mini-act input {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    padding: 1px;
  }
  .mini-act-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 100%; }

  /* 3 프레임: 터치존 (호흡수 · 수액드랍 · 심박수) */
  .mode-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .touch-pad {
    flex: 1;
    background: linear-gradient(180deg, #fffdf9, #f1f5f9);
    border: 2px solid #94a3b8;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    padding: 6px;
    text-align: center;
    transition: 0.08s;
    min-height: 0;
  }
  .touch-pad:active, .touch-pad.pulse { transform: scale(0.985); border-color: var(--blue); box-shadow: 0 0 14px rgba(37, 99, 235, 0.25); }
  .sub-box {
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 6px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .prog-bar { width: 100%; height: 7px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
  .prog-fill { height: 100%; width: 0%; background: var(--blue); transition: width 0.1s linear; }

  /* 4 프레임: 혈압존 */
  .bp-dial-wrap {
    background: linear-gradient(180deg, #fffdf9, #f1f5f9);
    border: 1.5px solid #cbd5e1;
    border-radius: 10px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .bp-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .bp-field label { display: block; font-size: 11px; font-weight: 800; color: var(--muted); margin-bottom: 2px; }
  .bp-field input {
    width: 100%;
    border: 1.5px solid #cbd5e1;
    border-radius: 6px;
    padding: 5px 6px;
    font-size: 17px;
    font-weight: 800;
    text-align: center;
    color: var(--navy);
  }
  .bp-map-box {
    background: #eff6ff;
    border: 1.5px solid #bfdbfe;
    border-radius: 8px;
    padding: 6px 8px;
    text-align: center;
  }
  .bp-hist {
    flex: 1;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    padding: 5px;
    font-size: 11.5px;
    overflow-y: auto;
    line-height: 1.45;
  }

  /* 5 프레임: 집중 ICU존 (상하 2개) */
  .icu-stack {
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 7px;
    flex: 1;
    min-height: 0;
  }
  .icu-box {
    border: 1.5px solid #93c5fd;
    background: #fbfdff;
    border-radius: 10px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
  }
  .icu-box.icu2 { border-color: #86efac; background: #fafffc; }
  .icu-top { display: flex; align-items: center; gap: 4px; }
  .icu-tag { background: var(--blue); color: #fff; font-size: 11px; font-weight: 800; padding: 3px 6px; border-radius: 5px; white-space: nowrap; }
  .icu-box.icu2 .icu-tag { background: var(--green); }
  .icu-pt { flex: 1; border: 1px solid #cbd5e1; border-radius: 5px; padding: 3px 6px; font-size: 12px; font-weight: 800; min-width: 0; }

  .gauges-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    background: #f1f5f9;
    padding: 3px 5px;
    border-radius: 6px;
    font-size: 10.5px;
    font-weight: 800;
  }
  .gauges-4 input[type=range] { width: 100%; margin: 0; height: 12px; accent-color: var(--blue); cursor: pointer; }

  .icon-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 3px;
  }
  .ico-btn {
    border: 1px solid #cbd5e1;
    background: #ffffff;
    border-radius: 5px;
    padding: 2.5px 1px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    color: var(--navy);
    transition: 0.1s;
  }
  .ico-btn:hover { background: #eff6ff; border-color: #3b82f6; }
  .ico-btn.selected {
    background: #1d4ed8;
    border-color: #1e40af;
    color: #ffffff;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25);
  }
  .icu-box.icu2 .ico-btn.selected {
    background: #15803d;
    border-color: #166534;
    box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.25);
  }

  .icu-input-row { display: flex; gap: 4px; }
  .icu-input-row input {
    flex: 1;
    border: 1px solid #cbd5e1;
    border-radius: 5px;
    padding: 3px 6px;
    font-size: 12px;
    font-weight: 700;
    min-width: 0;
  }
  .icu-textarea {
    flex: 1;
    width: 100%;
    border: 1px solid #cbd5e1;
    background: #fffef7;
    border-radius: 6px;
    padding: 4px 6px;
    font-family: 'Consolas', 'Malgun Gothic', monospace;
    font-size: 11.5px;
    line-height: 1.38;
    resize: none;
    color: var(--navy);
  }
</style>
</head>
<body>

<!-- 상단 헤더 -->
<header class="topbar">
  <h1><span class="badge">23시 동물병원</span> 5단 아날로그 임상 계기판 & 집중 ICU 처치 장부</h1>
  <div class="top-right">
    <div class="clock-pill mono" id="mainClock">00:00:00</div>
    <button class="btn active" id="btnSound" onclick="toggleAudio()">🔊 차임벨 ON</button>
    <button class="btn active" id="btnVoice" onclick="toggleVoice()">🗣️ 음성알람 ON</button>
    <button class="btn red" onclick="stopAllAlarms()">🔕 알람 끄기</button>
  </div>
</header>

<!-- 5단 가로 배치 메인 그리드 -->
<main class="five-grid">

  <!-- [1] 타이머존 -->
  <section class="frame">
    <div class="frame-head"><span><i class="dot" style="background:#dc2626"></i>1. 타이머존</span><span style="font-size:11px;color:var(--muted)">알람시계</span></div>
    <div class="v-stack-3" id="timerStack"></div>
  </section>

  <!-- [2] 경과시간존 -->
  <section class="frame">
    <div class="frame-head"><span><i class="dot" style="background:#2563eb"></i>2. 경과시간존</span><span style="font-size:11px;color:var(--muted)">스톱워치</span></div>
    <div class="v-stack-3" id="chronoStack"></div>
  </section>

  <!-- [3] 터치존 (호흡수 · 수액드랍 · 심박수) -->
  <section class="frame">
    <div class="frame-head"><span><i class="dot" style="background:#d97706"></i>3. 터치존</span><span style="font-size:11px;color:var(--muted)">탭 계측기</span></div>
    <div class="mode-tabs">
      <button class="btn active" id="mBtn_rr" onclick="setTouchMode('rr')">🫁 호흡수</button>
      <button class="btn" id="mBtn_drop" onclick="setTouchMode('drop')">💧 수액드랍</button>
      <button class="btn" id="mBtn_hr" onclick="setTouchMode('hr')">❤️ 심박수</button>
    </div>

    <!-- 수액드랍 전용 방울수(Drop factor) 선택 바 -->
    <div id="dropFactorBar" style="display:none;gap:4px;align-items:center;background:#eff6ff;padding:4px 6px;border-radius:6px;border:1px solid #bfdbfe;font-size:11.5px;font-weight:800">
      <span>수액세트:</span>
      <button class="btn active" id="df20" style="flex:1;padding:2px" onclick="setDropFactor(20)">20방울/mL</button>
      <button class="btn" id="df60" style="flex:1;padding:2px" onclick="setDropFactor(60)">60방울/mL</button>
    </div>

    <!-- 대형 아날로그 타코미터 터치 패드 -->
    <div class="touch-pad" id="touchPad" onclick="tapTouchZone()">
      <svg viewBox="0 0 210 148" style="width:100%;max-height:165px">
        <circle cx="105" cy="108" r="88" fill="#fffdf7" stroke="#334155" stroke-width="3.5"/>
        <path id="tArcGreen" d="M 32 132 A 78 78 0 0 1 82 33" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
        <path id="tArcAmber" d="M 82 33 A 78 78 0 0 1 105 30" fill="none" stroke="#f59e0b" stroke-width="8"/>
        <path id="tArcRed" d="M 105 30 A 78 78 0 0 1 178 132" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
        <g id="touchTicks"></g>
        <rect x="65" y="114" width="80" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
        <text id="touchMainVal" x="105" y="129" text-anchor="middle" font-family="Consolas,monospace" font-size="14" font-weight="800" fill="#1e293b">0 회/분</text>
        <g id="touchNeedle" transform="rotate(-110 105 108)" style="transition:transform 0.16s">
          <polygon points="102.5,113 107.5,113 105.6,35 104.4,35" fill="#dc2626"/>
          <circle cx="105" cy="108" r="7" fill="#1e293b" stroke="#fff" stroke-width="1.5"/>
        </g>
        <text id="touchSubUnit" x="105" y="82" text-anchor="middle" font-size="10" font-weight="800" fill="#64748b">BREATHS / MIN</text>
      </svg>
      <div id="touchExtraDisp" class="mono" style="font-size:13px;font-weight:800;color:#1d4ed8;margin-top:2px"></div>
      <div id="touchHint" style="font-size:11.5px;font-weight:800;color:#475569;margin-top:3px">터치패드를 박자에 맞춰 클릭하세요</div>
    </div>

    <div class="sub-box">
      <div style="display:flex;gap:3px">
        <button class="btn active" id="tDur15" style="flex:1;padding:2px" onclick="setTouchDur(15)">15초</button>
        <button class="btn" id="tDur30" style="flex:1;padding:2px" onclick="setTouchDur(30)">30초</button>
        <button class="btn" id="tDur60" style="flex:1;padding:2px" onclick="setTouchDur(60)">60초</button>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:2px">
          <span>경과 (<span id="tTargetLbl">15</span>s)</span>
          <span class="mono" id="tElapsedLbl">0.0s · 0회</span>
        </div>
        <div class="prog-bar"><div class="prog-fill" id="tProgFill"></div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px">
        <button class="btn active" style="padding:3px 2px" onclick="sendTouchToIcu(0)">→ICU1</button>
        <button class="btn green" style="padding:3px 2px" onclick="sendTouchToIcu(1)">→ICU2</button>
        <button class="btn" style="padding:3px 2px" onclick="resetTouch()">리셋</button>
      </div>
    </div>
  </section>

  <!-- [4] 혈압존 -->
  <section class="frame">
    <div class="frame-head"><span><i class="dot" style="background:#7c3aed"></i>4. 혈압존</span><span style="font-size:11px;color:var(--muted)">SBP·DBP·MAP</span></div>
    <div class="bp-dial-wrap">
      <svg viewBox="0 0 200 120" style="width:100%;max-height:125px">
        <path d="M 20 102 A 80 80 0 0 1 180 102" fill="#fffdf7" stroke="#334155" stroke-width="3"/>
        <!-- 저혈압(<90 적색), 정상(90~140 녹색), 경계(140~160 황색), 고혈압(>160 적색) -->
        <path d="M 26 100 A 74 74 0 0 1 68 36" fill="none" stroke="#dc2626" stroke-width="8"/>
        <path d="M 68 36 A 74 74 0 0 1 132 36" fill="none" stroke="#16a34a" stroke-width="8"/>
        <path d="M 132 36 A 74 74 0 0 1 154 50" fill="none" stroke="#f59e0b" stroke-width="8"/>
        <path d="M 154 50 A 74 74 0 0 1 174 100" fill="none" stroke="#dc2626" stroke-width="8"/>
        <text x="24" y="114" font-size="9" font-weight="800" fill="#dc2626">60</text>
        <text x="64" y="28" font-size="9" font-weight="800" fill="#16a34a">90</text>
        <text x="130" y="28" font-size="9" font-weight="800" fill="#d97706">140</text>
        <text x="166" y="114" font-size="9" font-weight="800" fill="#dc2626">200</text>
        <g id="bpNeedle" transform="rotate(0 100 102)" style="transition:transform 0.25s">
          <line x1="100" y1="102" x2="100" y2="32" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
          <circle cx="100" cy="102" r="6" fill="#dc2626" stroke="#fff" stroke-width="1.5"/>
        </g>
      </svg>
      <div id="bpStatusTxt" style="font-size:12px;font-weight:800;color:#16a34a">정상 혈압 범위 (SBP 90~140)</div>
    </div>

    <div class="bp-inputs">
      <div class="bp-field">
        <label>수축기 SBP</label>
        <input type="number" id="bpSys" value="120" oninput="calcBp()">
      </div>
      <div class="bp-field">
        <label>이완기 DBP</label>
        <input type="number" id="bpDia" value="80" oninput="calcBp()">
      </div>
    </div>

    <div class="bp-map-box">
      <div style="font-size:11px;font-weight:800;color:#1d4ed8">평균동맥압 (MAP)</div>
      <div class="mono" id="bpMapVal" style="font-size:21px;font-weight:900;color:#1e293b">93 mmHg</div>
      <div style="font-size:10.5px;color:#475569;font-weight:700">신장·뇌 관류 유지 기준: MAP ≥ 60~70</div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">
      <button class="btn active" style="padding:4px" onclick="recordBp(0)">→ ICU1 기록</button>
      <button class="btn green" style="padding:4px" onclick="recordBp(1)">→ ICU2 기록</button>
    </div>

    <div class="bp-hist" id="bpHistList">
      <div style="color:var(--muted);font-weight:700">혈압 측정 이력이 여기에 표시됩니다.</div>
    </div>
  </section>

  <!-- [5] ICU존 (우측 상·하 2개 집중 장부) -->
  <section class="frame">
    <div class="frame-head"><span><i class="dot" style="background:#16a34a"></i>5. 집중 ICU존</span><span style="font-size:11px;color:var(--muted)">아이콘 선택 → 내용 입력 → TXT저장</span></div>
    <div class="icu-stack" id="icuStack"></div>
  </section>

</main>

<script>
const $ = id => document.getElementById(id);
let soundEnabled = true, voiceEnabled = true, audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playChime(type = 'info') {
  if (!soundEnabled) return;
  try {
    ensureAudio();
    const now = audioCtx.currentTime;
    const freqs = type === 'alarm' ? [880, 1174.66, 880, 1174.66] : type === 'warn' ? [659.25, 523.25] : [783.99, 1046.5];
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now + i * 0.18);
      gain.gain.setValueAtTime(0.22, now + i * 0.18);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.25);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + i * 0.18); osc.stop(now + i * 0.18 + 0.26);
    });
  } catch (e) {}
}

function speakText(txt) {
  if (!voiceEnabled || !('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();

/* ==================== SVG 눈금/부채꼴 헬퍼 ==================== */
function buildClockTicks(cx, cy, rOut, rInMaj, rInMin) {
  let s = '';
  for (let i = 0; i < 60; i++) {
    const rad = (i * 6 - 90) * Math.PI / 180;
    const maj = i % 5 === 0;
    const r1 = maj ? rInMaj : rInMin;
    s += `<line x1="${(cx + r1 * Math.cos(rad)).toFixed(1)}" y1="${(cy + r1 * Math.sin(rad)).toFixed(1)}" x2="${(cx + rOut * Math.cos(rad)).toFixed(1)}" y2="${(cy + rOut * Math.sin(rad)).toFixed(1)}" stroke="${maj ? '#1e293b' : '#94a3b8'}" stroke-width="${maj ? 1.8 : 1}"/>`;
    if (i % 15 === 0) {
      const val = i === 0 ? 60 : i;
      const rt = rInMaj - 10;
      s += `<text x="${(cx + rt * Math.cos(rad)).toFixed(1)}" y="${(cy + rt * Math.sin(rad) + 3.5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="#334155">${val}</text>`;
    }
  }
  return s;
}

function describeSector(cx, cy, r, startDeg, endDeg) {
  if (endDeg <= startDeg) return '';
  if (endDeg - startDeg >= 359.9) return `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx - 0.01} ${cy - r} Z`;
  const r1 = (startDeg - 90) * Math.PI / 180, r2 = (endDeg - 90) * Math.PI / 180;
  const x1 = cx + r * Math.cos(r1), y1 = cy + r * Math.sin(r1);
  const x2 = cx + r * Math.cos(r2), y2 = cy + r * Math.sin(r2);
  return `M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${endDeg - startDeg > 180 ? 1 : 0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z`;
}

function fmtMMSS(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function updateTimerUI(id) {
  const t = timers[id];
  $('tTxt' + id).textContent = fmtMMSS(t.remain);
  const deg = Math.min(360, (t.remain / 3600) * 360);
  $('tHand' + id).setAttribute('transform', `rotate(${deg.toFixed(1)} 65 65)`);
  $('tSec' + id).setAttribute('d', describeSector(65, 65, 48, 0, deg));
  const card = $('tCard' + id), btn = $('tBtn' + id);
  card.classList.remove('running', 'warn', 'alarm');
  if (t.alarming) { card.classList.add('alarm'); btn.textContent = '알람끔'; btn.className = 'btn red'; }
  else if (t.running) { card.classList.add(t.remain <= 120 ? 'warn' : 'running'); btn.textContent = '정지'; btn.className = 'btn amber'; }
  else { btn.textContent = '시작'; btn.className = 'btn green'; }
}

function setTimer(id, min) {
  ensureAudio();
  const t = timers[id];
  t.remain = min * 60; t.running = true; t.alarming = false; t.warned = false;
  $('tMin' + id).value = min;
  updateTimerUI(id);
}

function toggleTimer(id) {
  ensureAudio();
  const t = timers[id];
  if (t.alarming) { resetTimer(id); return; }
  if (!t.running) {
    if (t.remain <= 0) t.remain = Math.max(1, parseFloat($('tMin' + id).value) || 10) * 60;
    t.running = true;
  } else t.running = false;
  updateTimerUI(id);
}

function resetTimer(id) {
  const t = timers[id];
  t.running = false; t.remain = 0; t.alarming = false; t.warned = false;
  updateTimerUI(id);
}

function stopAllAlarms() {
  timers.forEach(t => { if (t.alarming) resetTimer(t.id); });
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

setInterval(() => {

      if (t.remain === 0) {

      }
      updateTimerUI(t.id);
    } else if (t.alarming && Math.floor(Date.now() / 1000) % 6 === 0) playChime('alarm');
  });
}, 1000);

/* ==================== [3] 터치존 (호흡수 · 수액드랍 · 심박수) ==================== */
let touchMode = 'rr'; // 'rr' | 'drop' | 'hr'
let dropFactor = 20;  // 20 or 60 gtt/mL
let touchDur = 15;
let touchTaps = [];
let touchStartMs = 0;
let touchTimer = null;
let touchDone = false;
let lastTouchSummary = '';

function drawTouchTicks(maxVal) {
  const g = $('touchTicks');
  let html = '';
  const step = maxVal / 8;
  for (let i = 0; i <= 16; i++) {
    const val = (maxVal / 16) * i;
    const deg = -110 + (val / maxVal) * 220;
    const rad = (deg - 90) * Math.PI / 180;
    const maj = i % 2 === 0;
    const r1 = maj ? 69 : 74, r2 = 81;
    html += `<line x1="${(105 + r1 * Math.cos(rad)).toFixed(1)}" y1="${(108 + r1 * Math.sin(rad)).toFixed(1)}" x2="${(105 + r2 * Math.cos(rad)).toFixed(1)}" y2="${(108 + r2 * Math.sin(rad)).toFixed(1)}" stroke="#334155" stroke-width="${maj ? 1.8 : 1}"/>`;
    if (maj) {
      const rt = 57;
      html += `<text x="${(105 + rt * Math.cos(rad)).toFixed(1)}" y="${(108 + rt * Math.sin(rad) + 3.5).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#1e293b">${Math.round(val)}</text>`;
    }
  }
  g.innerHTML = html;
}
drawTouchTicks(80);

function setTouchMode(mode) {
  touchMode = mode;
  ['rr', 'drop', 'hr'].forEach(m => $('mBtn_' + m).className = m === mode ? 'btn active' : 'btn');
  $('dropFactorBar').style.display = mode === 'drop' ? 'flex' : 'none';
  if (mode === 'rr') {
    drawTouchTicks(80);
    $('touchSubUnit').textContent = 'BREATHS / MIN';
  } else if (mode === 'drop') {
    drawTouchTicks(120);
    $('touchSubUnit').textContent = 'DROPS / MIN';
  } else {
    drawTouchTicks(240);
    $('touchSubUnit').textContent = 'HEART BPM';
  }
  resetTouch();
}

function setDropFactor(df) {
  dropFactor = df;
  $('df20').className = df === 20 ? 'btn active' : 'btn';
  $('df60').className = df === 60 ? 'btn active' : 'btn';
  resetTouch();
}

function setTouchDur(sec) {
  touchDur = sec;
  [15, 30, 60].forEach(d => $('tDur' + d).className = d === sec ? 'btn active' : 'btn');
  $('tTargetLbl').textContent = sec;
  resetTouch();
}

function tapTouchZone() {
  ensureAudio();
  if (touchDone) resetTouch();
  const now = Date.now();
  if (touchTaps.length === 0) {
    touchStartMs = now;
    touchTimer = setInterval(updateTouchTick, 100);
  }
  touchTaps.push(now);

  const pad = $('touchPad');
  pad.classList.add('pulse');
  setTimeout(() => pad.classList.remove('pulse'), 100);

  const ratePerMin = touchTaps.length >= 2
    ? Math.round(((touchTaps.length - 1) / ((now - touchTaps[0]) / 1000)) * 60)
    : Math.round(60 / touchDur);
  renderTouchRate(ratePerMin);
}

function updateTouchTick() {
  if (!touchStartMs) return;
  const elapsed = (Date.now() - touchStartMs) / 1000;
  $('tProgFill').style.width = Math.min(100, (elapsed / touchDur) * 100) + '%';
  $('tElapsedLbl').textContent = `${Math.min(touchDur, elapsed).toFixed(1)}s · ${touchTaps.length}회`;

  if (elapsed >= touchDur) {
    clearInterval(touchTimer); touchTimer = null; touchDone = true;
    const finalRate = Math.round(touchTaps.length * (60 / touchDur));
    renderTouchRate(finalRate);
    $('touchHint').textContent = `✅ ${touchDur}초 측정 완료 (${touchTaps.length}회)`;
    playChime('info');
    speakText(`측정 완료. 분당 ${finalRate}회 입니다.`);
  } else {
    $('touchHint').textContent = `측정 진행 중... 박자마다 터치`;
  }
}

function renderTouchRate(rate) {
  let maxScale = touchMode === 'rr' ? 80 : touchMode === 'drop' ? 120 : 240;
  const clamped = Math.max(0, Math.min(maxScale, rate));
  const deg = -110 + (clamped / maxScale) * 220;
  $('touchNeedle').setAttribute('transform', `rotate(${deg.toFixed(1)} 105 108)`);

  if (touchMode === 'rr') {
    $('touchMainVal').textContent = `${rate} 회/분`;
    $('touchMainVal').setAttribute('fill', rate > 40 ? '#dc2626' : rate > 30 ? '#d97706' : '#16a34a');
    $('touchExtraDisp').textContent = rate > 30 ? '⚠ 안정 호흡수(30회) 초과' : '✓ 정상 호흡수 범위';
    lastTouchSummary = `🫁 호흡수 : ${rate} 회/분 (${touchDur}초)`;
  } else if (touchMode === 'drop') {
    const mlHr = ((rate * 60) / dropFactor).toFixed(1);
    $('touchMainVal').textContent = `${rate} gtt/m`;
    $('touchMainVal').setAttribute('fill', '#1d4ed8');
    $('touchExtraDisp').textContent = `환산 속도: 약 ${mlHr} mL/hr (${dropFactor}방울세트)`;
    lastTouchSummary = `🧴 수액속도 : ${mlHr} mL/hr (${rate}방울/분, ${dropFactor}gtt)`;
  } else {
    $('touchMainVal').textContent = `${rate} BPM`;
    $('touchMainVal').setAttribute('fill', rate > 180 || rate < 60 ? '#dc2626' : '#16a34a');
    $('touchExtraDisp').textContent = `심박수 ${rate} bpm`;
    lastTouchSummary = `❤️ 심박수 : ${rate} BPM (${touchDur}초)`;
  }
}

function resetTouch() {
  clearInterval(touchTimer); touchTimer = null; touchTaps = []; touchStartMs = 0; touchDone = false; lastTouchSummary = '';
  $('touchNeedle').setAttribute('transform', 'rotate(-110 105 108)');
  $('touchMainVal').textContent = touchMode === 'drop' ? '0 gtt/m' : touchMode === 'hr' ? '0 BPM' : '0 회/분';
  $('touchMainVal').setAttribute('fill', '#1e293b');
  $('touchExtraDisp').textContent = '';
  $('tProgFill').style.width = '0%';
  $('tElapsedLbl').textContent = '0.0s · 0회';
  $('touchHint').textContent = '터치패드를 박자에 맞춰 클릭하세요';
}

  if (!lastTouchSummary) { alert('먼저 터치존에서 측정을 진행해주세요.'); return; }

    st.textContent = '✓ 정상 혈압 범위 (SBP 90~140)'; st.style.color = '#16a34a';
  }
}

        <div><div style="display:flex;justify-content:space-between"><span>💧물</span><span id="gW${idx}">50%</span></div><input type="range" min="0" max="100" step="10" value="50" oninput="$('gW${idx}').textContent=this.value+'%'"></div>
        <div><div style="display:flex;justify-content:space-between"><span>⚡활력</span><span id="gV${idx}">50%</span></div><input type="range" min="0" max="100" step="10" value="50" oninput="$('gV${idx}').textContent=this.value+'%'"></div>
        <div><div style="display:flex;justify-content:space-between"><span>🧴수액</span><span id="gL${idx}">100%</span></div><input type="range" min="0" max="100" step="5" value="100" oninput="$('gL${idx}').textContent=this.value+'%'"></div>
      </div>

      <div class="icon-grid" id="icoGrid${idx}">
        ${icuIcons.map((item, i) => {
          const fullLabel = `${item.ico} ${item.name}`;
          const isSel = selectedIcuIcon[idx] === fullLabel ? 'selected' : '';
          return `<button type="button" class="ico-btn ${isSel}" onclick="selectAndLogIcon(${idx}, '${fullLabel}', this)">${item.ico}${item.name.split('(')[0]}</button>`;
        }).join('')}
        <button type="button" class="ico-btn" style="background:#fef2f2;border-color:#fca5a5;color:#b91c1c" onclick="if(confirm('장부를 비울까요?'))$('icuLog${idx}').value=''">🗑️비움</button>
      </div>

      <div class="icu-input-row">
        <input id="icuNote${idx}" placeholder="[🩺 체온측정] 선택됨 — 수치/내용 입력 후 Enter (또는 아이콘 클릭)" onkeydown="if(event.key==='Enter') submitSelectedIconNote(${idx})">
        <button class="btn ${idx === 0 ? 'active' : 'green'}" style="padding:3px 8px;font-size:11.5px" onclick="submitSelectedIconNote(${idx})">+ 기록</button>
      </div>

      <textarea class="icu-textarea" id="icuLog${idx}" placeholder="아이콘을 누르면 해당 아이콘 이름으로 시각과 함께 자동 기록됩니다. 내용을 입력 후 Enter를 눌러도 선택된 아이콘 이름으로 기록됩니다."></textarea>
    </div>
  `).join('');
}
renderIcuStack();

function selectAndLogIcon(idx, fullLabel, btnEl) {
  selectedIcuIcon[idx] = fullLabel;
  // 버튼 선택 하이라이트 갱신
  $('icoGrid' + idx).querySelectorAll('.ico-btn').forEach(b => b.classList.remove('selected'));
  btnEl.classList.add('selected');

  const noteInput = $('icuNote' + idx);
  noteInput.placeholder = `[${fullLabel}] 선택됨 — 수치/내용 입력 후 Enter`;

  // 현재 입력창에 적힌 내용이 있으면 그 내용과 함께 기록, 없으면 아이콘 이름만 즉시 기록
  const typed = noteInput.value.trim();
  appendIcuLine(idx, fullLabel, typed);
  noteInput.value = '';
  noteInput.focus();
}

function submitSelectedIconNote(idx) {
  const noteInput = $('icuNote' + idx);
  const typed = noteInput.value.trim();
  const tag = selectedIcuIcon[idx] || '🩺 체온측정';
  appendIcuLine(idx, tag, typed);
  noteInput.value = '';
  noteInput.focus();
}

function appendIcuLine(idx, tag, detail = '') {
  const nowStr = new Date().toTimeString().slice(0, 5);
  const area = $('icuLog' + idx);
  area.value += `[${nowStr}] ${tag}${detail ? ' : ' + detail : ''}\n`;
  area.scrollTop = area.scrollHeight;
}

function buildIcuReport(idx) {
  const pt = $('icuPt' + idx).value.trim() || `ICU_${idx + 1}번환자`;
  const today = new Date().toISOString().slice(0, 10);
  return `[23시 동물병원 집중 ICU #${idx + 1} 처치 장부 - ${today}]
- 환자정보: ${pt}
- 상태게이지: 밥 ${$('gF' + idx).textContent} | 물 ${$('gW' + idx).textContent} | 활력 ${$('gV' + idx).textContent} | 수액잔량 ${$('gL' + idx).textContent}
--------------------------------------------------
${$('icuLog' + idx).value.trim() || '(기록된 처치 내역 없음)'}`;
}

function copyIcu(idx) {
  navigator.clipboard.writeText(buildIcuReport(idx)).then(() => alert(`집중 ICU #${idx + 1} 장부가 복사되었습니다.`));
}

function saveIcuTxt(idx) {
  const pt = ($('icuPt' + idx).value.trim() || `ICU_${idx + 1}번`).replace(/[\\/:*?"<>|]/g, '_');
  const today = new Date().toISOString().slice(0, 10);
  const blob = new Blob([buildIcuReport(idx)], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${pt}_${today}_ICU장부.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
</script>
</body>
</html>
