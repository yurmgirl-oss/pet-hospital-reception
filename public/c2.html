<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C2 · 23시 동물병원 아날로그 계기판 & 집중 ICU 장부</title>
<style>
  :root {
    --bg: #eef2f6;
    --card: #ffffff;
    --border: #cbd5e1;
    --navy: #1e293b;
    --blue: #2563eb;
    --green: #16a34a;
    --amber: #d97706;
    --red: #dc2626;
    --muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--navy);
    font-family: 'Malgun Gothic', 'Segoe UI', Arial, sans-serif;
    padding: 7px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 7px;
    overflow: hidden;
  }
  .mono { font-family: 'Consolas', 'Courier New', monospace; }

  /* 상단 헤더 */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 5px 14px;
    flex-shrink: 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .topbar h1 { margin: 0; font-size: 18px; font-weight: 800; color: var(--navy); display: flex; align-items: center; gap: 8px; }
  .badge { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; padding: 2px 8px; border-radius: 5px; font-size: 12px; }
  .top-right { display: flex; align-items: center; gap: 12px; }
  .clock-pill { background: #f8fafc; border: 1px solid #cbd5e1; padding: 3px 10px; border-radius: 7px; font-size: 16px; font-weight: 800; color: var(--navy); }
  .btn {
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    color: var(--navy);
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.1s;
  }
  .btn:hover { background: #e2e8f0; }
  .btn.active { background: var(--blue); border-color: #1d4ed8; color: #fff; }
  .btn.green { background: var(--green); border-color: #15803d; color: #fff; }
  .btn.amber { background: var(--amber); border-color: #b45309; color: #fff; }
  .btn.red { background: var(--red); border-color: #b91c1c; color: #fff; }

  /* 16:9 메인 그리드: 좌측 계기판(62%) + 우측 집중 ICU 장부 2개(38%) */
  .main-grid {
    display: grid;
    grid-template-columns: 1.62fr 1fr;
    gap: 8px;
    flex: 1;
    min-height: 0;
  }

  /* 좌측 3단 정사각형 계기판 영역 */
  .left-deck {
    display: grid;
    grid-template-rows: 1fr 1fr 1.05fr;
    gap: 7px;
    min-height: 0;
  }
  .row-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; min-height: 0; }
  .row-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; min-height: 0; }

  /* 정사각형 스타일 계기 카드 */
  .sq-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    min-height: 0;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    position: relative;
  }
  .sq-card.running { border-color: #3b82f6; background: #f8fbff; }
  .sq-card.warn { border-color: #f59e0b; background: #fffbeb; animation: pulseWarn 1.2s infinite; }
  .sq-card.alarm { border-color: #dc2626; background: #fef2f2; animation: pulseAlarm 0.6s infinite; }
  @keyframes pulseWarn { 50% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.45); } }
  @keyframes pulseAlarm { 50% { box-shadow: 0 0 15px rgba(220, 38, 38, 0.65); } }

  .sq-title-input {
    width: 100%;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    border-radius: 5px;
    padding: 3px 6px;
    font-size: 12.5px;
    font-weight: 800;
    text-align: center;
    color: var(--navy);
  }
  .sq-title-input:focus { outline: none; border-color: var(--blue); background: #fff; }

  .clock-svg-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    width: 100%;
  }
  .clock-svg-wrap svg {
    height: 100%;
    max-height: 138px;
    width: auto;
  }

  .sq-controls {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .preset-row { display: flex; justify-content: center; gap: 3px; }
  .preset-row button {
    border: 1px solid #cbd5e1;
    background: #fff;
    border-radius: 4px;
    padding: 1.5px 5px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    color: #334155;
  }
  .preset-row button:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
  .act-row { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 3px; }
  .act-row input {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    text-align: center;
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px;
  }
  .act-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 100%; }

  /* 호흡수 계기 카드 (하단 2개) */
  .rr-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 7px 10px;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 8px;
    align-items: center;
    min-height: 0;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
  }
  .rr-dial-btn {
    height: 100%;
    background: linear-gradient(180deg, #fffdf9, #f1f5f9);
    border: 1.5px solid #94a3b8;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    padding: 3px;
    transition: 0.08s;
  }
  .rr-dial-btn:active, .rr-dial-btn.pulse { transform: scale(0.98); border-color: var(--blue); box-shadow: 0 0 12px rgba(37, 99, 235, 0.25); }
  .rr-right { display: flex; flex-direction: column; justify-content: space-between; height: 100%; gap: 4px; }
  .prog-bar { width: 100%; height: 7px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
  .prog-fill { height: 100%; width: 0%; background: var(--blue); transition: width 0.1s linear; }

  /* 우측 집중 ICU 처치 장부 2개 */
  .right-icu {
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    min-height: 0;
  }
  .icu-card {
    background: #ffffff;
    border: 2px solid #93c5fd;
    border-radius: 12px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-height: 0;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.06);
  }
  .icu-card.icu2 { border-color: #86efac; box-shadow: 0 2px 8px rgba(22, 163, 74, 0.06); }
  .icu-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    border-bottom: 1.5px solid #e2e8f0;
    padding-bottom: 5px;
  }
  .icu-badge {
    background: #2563eb;
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .icu-card.icu2 .icu-badge { background: #16a34a; }
  .icu-patient-input {
    flex: 1;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    border-radius: 5px;
    padding: 3px 7px;
    font-size: 13px;
    font-weight: 800;
    color: var(--navy);
  }

  /* 상태 미니 게이지 4종 */
  .icu-gauges {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 7px;
    padding: 4px 6px;
  }
  .g-item { display: flex; flex-direction: column; gap: 2px; font-size: 11px; font-weight: 800; color: #334155; }
  .g-item input[type=range] { width: 100%; margin: 0; accent-color: #2563eb; height: 14px; cursor: pointer; }

  /* 11종 처치 아이콘 팔레트 */
  .icon-palette {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 3.5px;
  }
  .ico-btn {
    border: 1px solid #cbd5e1;
    background: #ffffff;
    border-radius: 6px;
    padding: 3px 2px;
    font-size: 11.5px;
    font-weight: 800;
    color: #1e293b;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: 0.1s;
  }
  .ico-btn:hover { background: #eff6ff; border-color: #3b82f6; transform: translateY(-1px); }
  .ico-btn:active { transform: scale(0.96); }

  /* 빠른 수치/메모 입력 + 장부 로그창 */
  .icu-quick-row { display: flex; gap: 4px; }
  .icu-quick-row input {
    flex: 1;
    border: 1px solid #cbd5e1;
    border-radius: 5px;
    padding: 3px 7px;
    font-size: 12px;
    font-weight: 700;
  }
  .icu-log {
    flex: 1;
    width: 100%;
    border: 1px solid #cbd5e1;
    background: #fffef7;
    border-radius: 6px;
    padding: 5px 7px;
    font-family: 'Consolas', 'Malgun Gothic', monospace;
    font-size: 12px;
    line-height: 1.4;
    color: #1e293b;
    resize: none;
  }
</style>
</head>
<body>

<!-- 상단 바 -->
<header class="topbar">
  <h1><span class="badge">23시 동물병원</span> 아날로그 임상 계기판 & 집중 ICU 처치 장부</h1>
  <div class="top-right">
    <div class="clock-pill mono" id="mainClock">00:00:00</div>
    <button class="btn active" id="btnSound" onclick="toggleAudio()">🔊 차임벨 ON</button>
    <button class="btn active" id="btnVoice" onclick="toggleVoice()">🗣️ 음성알람 ON</button>
    <button class="btn red" onclick="stopAllAlarms()">🔕 알람 끄기</button>
  </div>
</header>

<!-- 16:9 메인 그리드 -->
<main class="main-grid">

  <!-- 좌측: 정사각형 아날로그 계기판 10개 (타이머4 + 경과시계4 + 호흡수2) -->
  <div class="left-deck">
    <!-- 1행: 큼직한 시계형 아날로그 타이머 4개 -->
    <div class="row-4" id="timerRow"></div>

    <!-- 2행: 경과 시간 아날로그 스톱워치 시계 4개 -->
    <div class="row-4" id="chronoRow"></div>

    <!-- 3행: 아날로그 호흡수(SRR) 계기판 2개 -->
    <div class="row-2" id="rrRow"></div>
  </div>

  <!-- 우측: 집중 ICU 처치 장부 2개 -->
  <div class="right-icu" id="icuCol"></div>

</main>

<script>
const $ = id => document.getElementById(id);
let soundEnabled = true, voiceEnabled = true, audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playChime(type = 'info') {
  if (!soundEnabled) return;
  try {
    ensureAudio();
    const now = audioCtx.currentTime;
    const freqs = type === 'alarm' ? [880, 1174.66, 880, 1174.66] : type === 'warn' ? [659.25, 523.25] : [783.99, 1046.5];
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now + i * 0.18);
      gain.gain.setValueAtTime(0.22, now + i * 0.18);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.25);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + i * 0.18); osc.stop(now + i * 0.18 + 0.26);
    });
  } catch (e) {}
}

function speakText(txt) {
  if (!voiceEnabled || !('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'ko-KR'; u.rate = 1.05;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function toggleAudio() {
  soundEnabled = !soundEnabled;
  $('btnSound').textContent = soundEnabled ? '🔊 차임벨 ON' : '🔇 차임벨 OFF';
  $('btnSound').className = soundEnabled ? 'btn active' : 'btn';
  if (soundEnabled) playChime('info');
}

function toggleVoice() {
  voiceEnabled = !voiceEnabled;
  $('btnVoice').textContent = voiceEnabled ? '🗣️ 음성알람 ON' : '🤐 음성알람 OFF';
  $('btnVoice').className = voiceEnabled ? 'btn active' : 'btn';
}

setInterval(() => {
  $('mainClock').textContent = new Date().toTimeString().slice(0, 8);
}, 1000);
$('mainClock').textContent = new Date().toTimeString().slice(0, 8);

/* ==================== SVG 눈금 생성 헬퍼 ==================== */
function buildDialTicks(cx, cy, rOuter, rInnerMajor, rInnerMinor, showNumbers = true) {
  let s = '';
  for (let i = 0; i < 60; i++) {
    const deg = i * 6;
    const rad = (deg - 90) * Math.PI / 180;
    const isMajor = i % 5 === 0;
    const r1 = isMajor ? rInnerMajor : rInnerMinor;
    const x1 = cx + r1 * Math.cos(rad), y1 = cy + r1 * Math.sin(rad);
    const x2 = cx + rOuter * Math.cos(rad), y2 = cy + rOuter * Math.sin(rad);
    s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${isMajor ? '#1e293b' : '#94a3b8'}" stroke-width="${isMajor ? 2 : 1}"/>`;
    if (showNumbers && i % 15 === 0) {
      const val = i === 0 ? 60 : i;
      const rt = rInnerMajor - 11;
      const xt = cx + rt * Math.cos(rad), yt = cy + rt * Math.sin(rad) + 4;
      s += `<text x="${xt.toFixed(1)}" y="${yt.toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#334155">${val}</text>`;
    }
  }
  return s;
}

function describeSector(cx, cy, r, startAngle, endAngle) {
  if (endAngle <= startAngle) return '';
  if (endAngle - startAngle >= 359.9) {
    return `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx - 0.01} ${cy - r} Z`;
  }
  const startRad = (startAngle - 90) * Math.PI / 180;
  const endRad = (endAngle - 90) * Math.PI / 180;
  const x1 = cx + r * Math.cos(startRad), y1 = cy + r * Math.sin(startRad);
  const x2 = cx + r * Math.cos(endRad), y2 = cy + r * Math.sin(endRad);
  const largeArc = endAngle - startAngle > 180 ? 1 : 0;
  return `M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z`;
}

/* ==================== [1] 시계형 아날로그 타이머 4개 ==================== */
const timerDefaults = ['타이머 1 (PCV재검)', '타이머 2 (인슐린)', '타이머 3 (처치/약)', '타이머 4 (멸균/장비)'];
const timers = Array.from({ length: 4 }, (_, i) => ({ id: i, total: 0, remain: 0, running: false, alarming: false, warned: false }));

function renderTimers() {
  const ticks = buildDialTicks(70, 70, 62, 54, 58, true);
  $('timerRow').innerHTML = timers.map(t => `
    <div class="sq-card" id="tCard${t.id}">
      <input class="sq-title-input" id="tName${t.id}" placeholder="${timerDefaults[t.id]}">
      <div class="clock-svg-wrap">
        <svg viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="66" fill="#fffdf9" stroke="#334155" stroke-width="3.5"/>
          <!-- 부채꼴 잔여 시간 게이지 (60분 기준) -->
          <path id="tSector${t.id}" d="" fill="rgba(37, 99, 235, 0.22)"/>
          ${ticks}
          <!-- 중앙 디지털 보조 표시 -->
          <rect x="43" y="84" width="54" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
          <text id="tText${t.id}" x="70" y="97" text-anchor="middle" font-family="Consolas,monospace" font-size="12.5" font-weight="800" fill="#1e293b">00:00</text>
          <!-- 아날로그 바늘 -->
          <g id="tHand${t.id}" transform="rotate(0 70 70)">
            <line x1="70" y1="74" x2="70" y2="16" stroke="#dc2626" stroke-width="2.8" stroke-linecap="round"/>
            <circle cx="70" cy="70" r="5" fill="#1e293b" stroke="#fff" stroke-width="1.5"/>
          </g>
        </svg>
      </div>
      <div class="sq-controls">
        <div class="preset-row">
          <button onclick="setTimer(${t.id},5)">5m</button>
          <button onclick="setTimer(${t.id},15)">15m</button>
          <button onclick="setTimer(${t.id},30)">30m</button>
          <button onclick="setTimer(${t.id},60)">60m</button>
        </div>
        <div class="act-row">
          <input type="number" id="tMin${t.id}" value="10" min="1" max="180" title="분 입력">
          <button class="btn green" id="tBtn${t.id}" style="padding:2px;font-size:11.5px" onclick="toggleTimer(${t.id})">시작</button>
          <button class="btn" style="padding:2px;font-size:11.5px" onclick="resetTimer(${t.id})">리셋</button>
        </div>
      </div>
    </div>
  `).join('');
}
renderTimers();

function fmtTime(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function updateTimerVisual(id) {
  const t = timers[id];
  $('tText' + id).textContent = fmtTime(t.remain);
  // 60분(3600초) 기준 각도 계산 (60분 초과 시 360도 풀표시)
  const deg = Math.min(360, (t.remain / 3600) * 360);
  $('tHand' + id).setAttribute('transform', `rotate(${deg.toFixed(1)} 70 70)`);
  const sector = $('tSector' + id);
  sector.setAttribute('d', describeSector(70, 70, 52, 0, deg));
  sector.setAttribute('fill', t.remain <= 120 && t.remain > 0 ? 'rgba(217, 119, 6, 0.28)' : 'rgba(37, 99, 235, 0.22)');

  const card = $('tCard' + id), btn = $('tBtn' + id);
  card.classList.remove('running', 'warn', 'alarm');
  if (t.alarming) {
    card.classList.add('alarm'); btn.textContent = '알람끔'; btn.className = 'btn red';
  } else if (t.running) {
    card.classList.add(t.remain <= 120 ? 'warn' : 'running');
    btn.textContent = '정지'; btn.className = 'btn amber';
  } else {
    btn.textContent = '시작'; btn.className = 'btn green';
  }
}

function setTimer(id, min) {
  ensureAudio();
  const t = timers[id];
  t.total = min * 60; t.remain = min * 60; t.running = true; t.alarming = false; t.warned = false;
  $('tMin' + id).value = min;
  updateTimerVisual(id);
}

function toggleTimer(id) {
  ensureAudio();
  const t = timers[id];
  if (t.alarming) { resetTimer(id); return; }
  if (!t.running) {
    if (t.remain <= 0) {
      const m = Math.max(1, parseFloat($('tMin' + id).value) || 10);
      t.total = Math.round(m * 60); t.remain = t.total;
    }
    t.running = true;
  } else {
    t.running = false;
  }
  updateTimerVisual(id);
}

function resetTimer(id) {
  const t = timers[id];
  t.running = false; t.total = 0; t.remain = 0; t.alarming = false; t.warned = false;
  updateTimerVisual(id);
}

function stopAllAlarms() {
  timers.forEach(t => { if (t.alarming) resetTimer(t.id); });
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

setInterval(() => {
  timers.forEach(t => {
    if (t.running && t.remain > 0) {
      t.remain--;
      if (t.remain === 120 && !t.warned) { t.warned = true; playChime('warn'); }
      if (t.remain === 0) {
        t.running = false; t.alarming = true;
        const lbl = $('tName' + t.id).value.trim() || timerDefaults[t.id];
        playChime('alarm');
        speakText(`${lbl} 시간입니다.`);
      }
      updateTimerVisual(t.id);
    } else if (t.alarming && Math.floor(Date.now() / 1000) % 6 === 0) {
      playChime('alarm');
    }
  });
}, 1000);

/* ==================== [2] 경과 시간 아날로그 시계 4개 ==================== */
const chronoDefaults = ['진료 경과 시계', '마취 경과 시계', '수액 경과 시계', '처치/대기 경과'];
const chronos = Array.from({ length: 4 }, (_, i) => ({ id: i, running: false, startMs: 0, accumSec: 0 }));

function renderChronos() {
  const ticks = buildDialTicks(70, 70, 62, 54, 58, true);
  $('chronoRow').innerHTML = chronos.map(c => `
    <div class="sq-card" id="cCard${c.id}">
      <input class="sq-title-input" id="cName${c.id}" placeholder="${chronoDefaults[c.id]}">
      <div class="clock-svg-wrap">
        <svg viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="66" fill="#f8fafc" stroke="#475569" stroke-width="3.5"/>
          ${ticks}
          <rect x="38" y="84" width="64" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <text id="cText${c.id}" x="70" y="97" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="800" fill="#1e293b">00:00:00</text>
          <!-- 분침(검정) & 초침(파랑) -->
          <line id="cMin${c.id}" x1="70" y1="73" x2="70" y2="26" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
          <line id="cSec${c.id}" x1="70" y1="78" x2="70" y2="15" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="70" cy="70" r="4.5" fill="#1e293b"/>
        </svg>
      </div>
      <div class="act-row-2">
        <button class="btn green" id="cBtn${c.id}" style="padding:3px;font-size:11.5px" onclick="toggleChrono(${c.id})">▶ 시작</button>
        <button class="btn" style="padding:3px;font-size:11.5px" onclick="resetChrono(${c.id})">초기화</button>
      </div>
    </div>
  `).join('');
}
renderChronos();

function toggleChrono(id) {
  const c = chronos[id];
  if (!c.running) {
    c.startMs = Date.now();
    c.running = true;
    $('cCard' + id).classList.add('running');
    $('cBtn' + id).textContent = '⏸ 정지';
    $('cBtn' + id).className = 'btn amber';
  } else {
    c.accumSec += Math.floor((Date.now() - c.startMs) / 1000);
    c.running = false;
    $('cCard' + id).classList.remove('running');
    $('cBtn' + id).textContent = '▶ 재개';
    $('cBtn' + id).className = 'btn green';
  }
}

function resetChrono(id) {
  const c = chronos[id];
  c.running = false; c.accumSec = 0;
  $('cCard' + id).classList.remove('running');
  $('cText' + id).textContent = '00:00:00';
  $('cSec' + id).setAttribute('transform', 'rotate(0 70 70)');
  $('cMin' + id).setAttribute('transform', 'rotate(0 70 70)');
  $('cBtn' + id).textContent = '▶ 시작';
  $('cBtn' + id).className = 'btn green';
}

setInterval(() => {
  chronos.forEach(c => {
    if (!c.running) return;
    const sec = c.accumSec + Math.floor((Date.now() - c.startMs) / 1000);
    const h = String(Math.floor(sec / 3600)).padStart(2, '0');
    const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    $('cText' + c.id).textContent = `${h}:${m}:${s}`;
    $('cSec' + c.id).setAttribute('transform', `rotate(${(sec % 60) * 6} 70 70)`);
    $('cMin' + c.id).setAttribute('transform', `rotate(${((sec / 60) % 60) * 6} 70 70)`);
  });
}, 500);

/* ==================== [3] 아날로그 호흡수·심박수 계기 2개 ==================== */
const rrGauges = Array.from({ length: 2 }, (_, i) => ({
  id: i, duration: 15, taps: [], startMs: 0, timer: null, done: false, lastBpm: 0
}));

function buildRrTicksSvg() {
  let html = '';
  for (let val = 0; val <= 80; val += 5) {
    const deg = -110 + (val / 80) * 220;
    const rad = (deg - 90) * Math.PI / 180;
    const isMajor = val % 10 === 0;
    const r1 = isMajor ? 66 : 71, r2 = 77;
    const x1 = 105 + r1 * Math.cos(rad), y1 = 105 + r1 * Math.sin(rad);
    const x2 = 105 + r2 * Math.cos(rad), y2 = 105 + r2 * Math.sin(rad);
    html += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#334155" stroke-width="${isMajor ? 1.8 : 1}"/>`;
    if (isMajor) {
      const rt = 55;
      html += `<text x="${(105 + rt * Math.cos(rad)).toFixed(1)}" y="${(105 + rt * Math.sin(rad) + 3.5).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#1e293b">${val}</text>`;
    }
  }
  return html;
}

function renderRrGauges() {
  const ticks = buildRrTicksSvg();
  $('rrRow').innerHTML = rrGauges.map(g => `
    <div class="rr-card">
      <div class="rr-dial-btn" id="rrPad${g.id}" onclick="tapRr(${g.id})">
        <svg viewBox="0 0 210 142" style="width:100%;max-height:132px">
          <circle cx="105" cy="105" r="84" fill="#fffdf7" stroke="#334155" stroke-width="3.5"/>
          <path d="M 35 127 A 74 74 0 0 1 83 34" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
          <path d="M 83 34 A 74 74 0 0 1 105 31" fill="none" stroke="#f59e0b" stroke-width="8"/>
          <path d="M 105 31 A 74 74 0 0 1 175 127" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
          ${ticks}
          <rect x="75" y="113" width="60" height="20" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
          <text id="rrVal${g.id}" x="105" y="127" text-anchor="middle" font-family="Consolas,monospace" font-size="14" font-weight="800" fill="#1e293b">0 BPM</text>
          <g id="rrNeedle${g.id}" transform="rotate(-110 105 105)" style="transition:transform 0.16s">
            <polygon points="102.5,110 107.5,110 105.6,36 104.4,36" fill="#dc2626"/>
            <circle cx="105" cy="105" r="6.5" fill="#1e293b" stroke="#fff" stroke-width="1.5"/>
          </g>
        </svg>
        <div style="font-size:11px;font-weight:800;color:#2563eb" id="rrHint${g.id}">호흡마다 클릭 (측정 시작)</div>
      </div>

      <div class="rr-right">
        <input class="sq-title-input" id="rrLabel${g.id}" placeholder="호흡수 계기 #${g.id + 1} (환자명)">
        <div style="display:flex;gap:3px">
          <button class="btn active" id="rrDur${g.id}_15" style="flex:1;padding:2px;font-size:11px" onclick="setRrDur(${g.id},15)">15초</button>
          <button class="btn" id="rrDur${g.id}_30" style="flex:1;padding:2px;font-size:11px" onclick="setRrDur(${g.id},30)">30초</button>
          <button class="btn" id="rrDur${g.id}_60" style="flex:1;padding:2px;font-size:11px" onclick="setRrDur(${g.id},60)">60초</button>
        </div>
        <div style="font-size:11.5px;font-weight:700;color:#475569">
          <div style="display:flex;justify-content:space-between;margin-bottom:2px">
            <span>경과 (<span id="rrTarget${g.id}">15</span>s)</span>
            <span class="mono" id="rrElapsed${g.id}">0.0s · 0회</span>
          </div>
          <div class="prog-bar"><div class="prog-fill" id="rrProg${g.id}"></div></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px">
          <button class="btn active" style="padding:3px 2px;font-size:11px" onclick="sendRrToIcu(${g.id},0)">→ICU1</button>
          <button class="btn green" style="padding:3px 2px;font-size:11px" onclick="sendRrToIcu(${g.id},1)">→ICU2</button>
          <button class="btn" style="padding:3px 2px;font-size:11px" onclick="resetRr(${g.id})">리셋</button>
        </div>
      </div>
    </div>
  `).join('');
}
renderRrGauges();

function setRrDur(id, sec) {
  const g = rrGauges[id];
  g.duration = sec;
  [15, 30, 60].forEach(d => $(`rrDur${id}_${d}`).className = d === sec ? 'btn active' : 'btn');
  $('rrTarget' + id).textContent = sec;
  resetRr(id);
}

function tapRr(id) {
  ensureAudio();
  const g = rrGauges[id];
  if (g.done) resetRr(id);
  const now = Date.now();
  if (g.taps.length === 0) {
    g.startMs = now;
    g.timer = setInterval(() => updateRrTick(id), 100);
  }
  g.taps.push(now);

  const pad = $('rrPad' + id);
  pad.classList.add('pulse');
  setTimeout(() => pad.classList.remove('pulse'), 100);

  let bpm = g.taps.length >= 2 ? Math.round(((g.taps.length - 1) / ((now - g.taps[0]) / 1000)) * 60) : Math.round(60 / g.duration);
  g.lastBpm = bpm;
  updateRrNeedle(id, bpm);
}

function updateRrTick(id) {
  const g = rrGauges[id];
  if (!g.startMs) return;
  const elapsed = (Date.now() - g.startMs) / 1000;
  $('rrProg' + id).style.width = Math.min(100, (elapsed / g.duration) * 100) + '%';
  $('rrElapsed' + id).textContent = `${Math.min(g.duration, elapsed).toFixed(1)}s · ${g.taps.length}회`;

  if (elapsed >= g.duration) {
    clearInterval(g.timer); g.timer = null; g.done = true;
    const finalBpm = Math.round(g.taps.length * (60 / g.duration));
    g.lastBpm = finalBpm;
    updateRrNeedle(id, finalBpm);
    $('rrHint' + id).textContent = `✅ 완료: 분당 ${finalBpm}회 (${g.taps.length}회/${g.duration}s)`;
    playChime('info');
    speakText(`호흡수 측정 완료. 분당 ${finalBpm}회 입니다.`);
  } else {
    $('rrHint' + id).textContent = `측정 중... 호흡마다 클릭`;
  }
}

function updateRrNeedle(id, bpm) {
  const clamped = Math.max(0, Math.min(80, bpm));
  const deg = -110 + (clamped / 80) * 220;
  $('rrNeedle' + id).setAttribute('transform', `rotate(${deg.toFixed(1)} 105 105)`);
  const txt = $('rrVal' + id);
  txt.textContent = `${bpm} BPM`;
  txt.setAttribute('fill', bpm > 40 ? '#dc2626' : bpm > 30 ? '#d97706' : '#15803d');
}

function resetRr(id) {
  const g = rrGauges[id];
  clearInterval(g.timer); g.timer = null; g.taps = []; g.startMs = 0; g.done = false; g.lastBpm = 0;
  $('rrNeedle' + id).setAttribute('transform', 'rotate(-110 105 105)');
  $('rrVal' + id).textContent = '0 BPM';
  $('rrVal' + id).setAttribute('fill', '#1e293b');
  $('rrProg' + id).style.width = '0%';
  $('rrElapsed' + id).textContent = '0.0s · 0회';
  $('rrHint' + id).textContent = '호흡마다 클릭 (측정 시작)';
}

function sendRrToIcu(rrId, icuId) {
  const g = rrGauges[rrId];
  if (!g.lastBpm) { alert('먼저 호흡수를 측정해주세요.'); return; }
  appendIcuEntry(icuId, '🫁 호흡수', `${g.lastBpm} 회/분 (${g.duration}초 측정)`);
}

/* ==================== [4] 우측 집중 ICU 처치 장부 2개 ==================== */
const icuIcons = [
  { ico: '💧', label: '물(음수)' },
  { ico: '🍚', label: '밥(식이)' },
  { ico: '🟡', label: '오줌(배뇨)' },
  { ico: '💩', label: '변(배변)' },
  { ico: '💉', label: '주사투약' },
  { ico: '🧴', label: '수액처치' },
  { ico: '🫧', label: '산소공급' },
  { ico: '🌡️', label: '실내온도' },
  { ico: '🩺', label: '체온측정' },
  { ico: '🫁', label: '호흡수' },
  { ico: '⚖️', label: '체중측정' }
];

function renderIcuCards() {
  $('icuCol').innerHTML = [0, 1].map(idx => `
    <section class="icu-card ${idx === 1 ? 'icu2' : ''}">
      <div class="icu-head">
        <span class="icu-badge">집중 ICU #${idx + 1}</span>
        <input class="icu-patient-input" id="icuPatient${idx}" placeholder="환자명 · 품종 · 체중 · 주요진단">
        <button class="btn" style="padding:3px 7px;font-size:11.5px" onclick="copyIcuTxt(${idx})">📋 복사</button>
        <button class="btn ${idx === 0 ? 'active' : 'green'}" style="padding:3px 8px;font-size:11.5px" onclick="saveIcuTxt(${idx})">💾 TXT저장</button>
      </div>

      <!-- 상태 게이지 4종 -->
      <div class="icu-gauges">
        <div class="g-item">
          <div style="display:flex;justify-content:space-between"><span>🍚 식욕</span><span id="gFoodV${idx}">50%</span></div>
          <input type="range" min="0" max="100" step="10" value="50" oninput="$('gFoodV${idx}').textContent=this.value+'%'">
        </div>
        <div class="g-item">
          <div style="display:flex;justify-content:space-between"><span>💧 음수</span><span id="gWaterV${idx}">50%</span></div>
          <input type="range" min="0" max="100" step="10" value="50" oninput="$('gWaterV${idx}').textContent=this.value+'%'">
        </div>
        <div class="g-item">
          <div style="display:flex;justify-content:space-between"><span>⚡ 활력</span><span id="gVitalV${idx}">50%</span></div>
          <input type="range" min="0" max="100" step="10" value="50" oninput="$('gVitalV${idx}').textContent=this.value+'%'">
        </div>
        <div class="g-item">
          <div style="display:flex;justify-content:space-between"><span>🧴 수액잔량</span><span id="gFluidV${idx}">100%</span></div>
          <input type="range" min="0" max="100" step="5" value="100" oninput="$('gFluidV${idx}').textContent=this.value+'%'">
        </div>
      </div>

      <!-- 원클릭 처치/관찰 아이콘 팔레트 -->
      <div class="icon-palette">
        ${icuIcons.map(item => `
          <button type="button" class="ico-btn" onclick="clickIcuIcon(${idx}, '${item.ico} ${item.label}')">${item.ico}${item.label.split('(')[0]}</button>
        `).join('')}
        <button type="button" class="ico-btn" style="background:#fef2f2;border-color:#fca5a5;color:#b91c1c" onclick="clearIcuLog(${idx})">🗑️비움</button>
      </div>

      <!-- 간단한 수치/내용 입력 + 장부 텍스트 영역 -->
      <div class="icu-quick-row">
        <input id="icuNote${idx}" placeholder="간단한 수치·메모 입력 후 아이콘 클릭 또는 엔터 (예: 38.5도, 20mL 급여)" onkeydown="if(event.key==='Enter') addQuickNote(${idx})">
        <button class="btn" style="padding:3px 9px;font-size:11.5px" onclick="addQuickNote(${idx})">+ 메모추가</button>
      </div>
      <textarea class="icu-log" id="icuLog${idx}" placeholder="위 아이콘(물, 밥, 오줌, 변, 주사, 수액, 산소, 온도, 체온, 호흡, 체중)을 누르면 현재 시각과 함께 자동 기록됩니다."></textarea>
    </section>
  `).join('');
}
renderIcuCards();

function appendIcuEntry(idx, tag, extraText = '') {
  const nowStr = new Date().toTimeString().slice(0, 5);
  const noteInput = $('icuNote' + idx);
  const noteVal = extraText || noteInput.value.trim();
  const log = $('icuLog' + idx);
  const line = `[${nowStr}] ${tag}${noteVal ? ' : ' + noteVal : ''}\n`;
  log.value += line;
  log.scrollTop = log.scrollHeight;
  if (!extraText) noteInput.value = '';
  noteInput.focus();
}

function clickIcuIcon(idx, tag) {
  appendIcuEntry(idx, tag);
}

function addQuickNote(idx) {
  const noteVal = $('icuNote' + idx).value.trim();
  if (!noteVal) return;
  appendIcuEntry(idx, '📝 관찰메모', noteVal);
  $('icuNote' + idx).value = '';
}

function clearIcuLog(idx) {
  if (confirm(`집중 ICU #${idx + 1} 장부 내용을 초기화할까요?`)) {
    $('icuLog' + idx).value = '';
  }
}

function buildIcuExportText(idx) {
  const p = $('icuPatient' + idx).value.trim() || `집중ICU_${idx + 1}번환자`;
  const today = new Date().toISOString().slice(0, 10);
  const food = $('gFoodV' + idx).textContent;
  const water = $('gWaterV' + idx).textContent;
  const vital = $('gVitalV' + idx).textContent;
  const fluid = $('gFluidV' + idx).textContent;
  const body = $('icuLog' + idx).value.trim();
  return `[23시 동물병원 집중관리 ICU 처치 장부 - ${today}]
- 환자정보: ${p}
- 현재 상태 게이지: 식욕 ${food} | 음수 ${water} | 활력 ${vital} | 수액잔량 ${fluid}
--------------------------------------------------
${body || '(기록된 처치 내역 없음)'}`;
}

function copyIcuTxt(idx) {
  const txt = buildIcuExportText(idx);
  navigator.clipboard.writeText(txt).then(() => alert(`집중 ICU #${idx + 1} 장부가 클립보드에 복사되었습니다.`));
}

function saveIcuTxt(idx) {
  const p = ($('icuPatient' + idx).value.trim() || `ICU_${idx + 1}번`).replace(/[\\/:*?"<>|]/g, '_');
  const today = new Date().toISOString().slice(0, 10);
  const content = buildIcuExportText(idx);
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${p}_${today}_ICU처치장부.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
</script>
</body>
</html>
