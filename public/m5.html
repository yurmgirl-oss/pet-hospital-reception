<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>23시 하단오거리 동물병원 · 대기 현황판 (m5)</title>
<style>
:root {
  --green: #16875a;
  --deep: #075b3c;
  --mint: #e8f8ee;
  --ink: #12382e;
  --line: #d6eee0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  color: var(--ink);
  background: #edf5f0;
}
body {
  padding: 8px;
  display: flex;
  flex-direction: column;
}
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid #cce8d4;
  box-shadow: 0 8px 24px rgba(18, 64, 42, 0.08);
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  background: linear-gradient(115deg, #e4f7e6, #ffffff 48%, #c9edcf);
  border-bottom: 2px solid #dcefe2;
}
.brandname {
  font-size: 19px;
  font-weight: 950;
  letter-spacing: -0.04em;
  color: #0b3425;
}
.clockbox {
  background: #ffffffd9;
  border: 1px solid #d2ead7;
  padding: 4px 12px;
  border-radius: 10px;
  font-size: 20px;
  font-weight: 950;
  color: #055535;
  font-variant-numeric: tabular-nums;
}

/* 좌우 분할 */
.split-container {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 12px;
  background: #f4faf6;
  overflow: hidden;
}
.col-panel {
  display: flex;
  flex-direction: column;
  background: #ffffff;
  border-radius: 14px;
  border: 1.5px solid #c5e3cf;
  box-shadow: 0 4px 14px rgba(12, 58, 36, 0.06);
  overflow: hidden;
}

.col-header {
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid #d5ecd9;
}
.col-qr .col-header {
  background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
  border-bottom-color: #bae6fd;
}
.col-normal .col-header {
  background: linear-gradient(135deg, #fef3c7 0%, #f0fdf4 100%);
  border-bottom-color: #fde68a;
}
.col-title {
  font-size: 16px;
  font-weight: 950;
}
.col-qr .col-title { color: #0369a1; }
.col-normal .col-title { color: #b45309; }

.col-count {
  font-size: 13px;
  font-weight: 900;
  padding: 3px 10px;
  border-radius: 99px;
  background: #ffffff;
  border: 1px solid rgba(0, 0, 0, 0.08);
}

/* 4열 테이블 헤더 [번호 / 동물명 / 분류 / 소요시간] */
.table-header {
  display: grid;
  grid-template-columns: 46px 1fr 90px 115px;
  padding: 8px 12px;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  font-size: 12px;
  font-weight: 900;
  color: #64748b;
  text-align: center;
}

.table-body {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px;
}

/* 대기 줄 */
.table-row {
  display: grid;
  grid-template-columns: 46px 1fr 90px 115px;
  align-items: center;
  padding: 8px 10px;
  border-radius: 10px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  transition: all 0.15s ease;
}
.table-row.treating {
  background: #eff6ff;
  border: 1.5px solid #93c5fd;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.12);
}

.col-cell-num { text-align: center; }
.num-badge {
  display: inline-block;
  padding: 4px 6px;
  border-radius: 7px;
  font-size: 14px;
  font-weight: 950;
  min-width: 34px;
}
.col-qr .num-badge { background: #e0f2fe; color: #0369a1; }
.col-normal .num-badge { background: #fef3c7; color: #b45309; }
.table-row.treating .num-badge { background: #2563eb; color: #fff; }

.col-cell-pet { padding-left: 8px; min-width: 0; }
.pet-name {
  font-size: 16px;
  font-weight: 1000;
  color: #0f172a;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pet-status-tag {
  font-size: 10px;
  font-weight: 800;
  color: #16a34a;
  display: block;
  margin-top: 2px;
}
.table-row.treating .pet-status-tag { color: #2563eb; font-weight: 900; }

.col-cell-category { text-align: center; }
.category-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 900;
  padding: 3px 6px;
  border-radius: 6px;
  background: #f1f5f9;
  color: #334155;
  border: 1px solid #cbd5e1;
  white-space: nowrap;
}

.col-cell-time {
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: right;
}
.est-badge {
  font-size: 12px;
  font-weight: 950;
  color: #047857;
  background: #ecfdf5;
  border: 1px solid #a7f3d0;
  padding: 2px 4px;
  border-radius: 6px;
  text-align: center;
  white-space: nowrap;
}
.exp-badge {
  font-size: 11px;
  font-weight: 900;
  color: #c2410c;
  background: #fff7ed;
  border: 1px solid #fed7aa;
  padding: 2px 4px;
  border-radius: 6px;
  text-align: center;
  white-space: nowrap;
}

.empty-col {
  padding: 40px 10px;
  text-align: center;
  color: #94a3b8;
  font-size: 13px;
  font-weight: 700;
}

footer {
  display: flex;
  justify-content: space-between;
  padding: 6px 16px;
  color: #64748b;
  font-size: 11px;
  font-weight: 700;
  background: #f8fafc;
  border-top: 1px solid #e2e8f0;
}
</style>
</head>
<body>
<div class="screen">
  <header>
    <div class="brand">
      <div class="brandname">🐾 23시 하단오거리 동물병원 · 실시간 접수 대기판</div>
    </div>
    <div class="clockbox" id="clock">00:00:00</div>
  </header>

  <main class="split-container">
    
    <!-- [왼쪽] QR 사전접수 (21번대 시작) -->
    <section class="col-panel col-qr">
      <div class="col-header">
        <div class="col-title">📱 QR 사전접수</div>
        <div class="col-count" id="count-qr">0명 대기</div>
      </div>
      <div class="table-header">
        <div>번호</div>
        <div style="text-align: left; padding-left: 8px;">동물명</div>
        <div>분류</div>
        <div>소요시간</div>
      </div>
      <div class="table-body" id="list-qr">
        <div class="empty-col">대기 중인 QR접수가 없습니다.</div>
      </div>
    </section>

    <!-- [오른쪽] 일반 현장예약 (31번대 시작) -->
    <section class="col-panel col-normal">
      <div class="col-header">
        <div class="col-title">🏥 일반 현장예약</div>
        <div class="col-count" id="count-normal">0명 대기</div>
      </div>
      <div class="table-header">
        <div>번호</div>
        <div style="text-align: left; padding-left: 8px;">동물명</div>
        <div>분류</div>
        <div>소요시간</div>
      </div>
      <div class="table-body" id="list-normal">
        <div class="empty-col">등록된 일반예약이 없습니다.</div>
      </div>
    </section>

  </main>

  <footer>
    <span>진료 상황에 따라 예상 소요시간은 달라질 수 있습니다.</span>
    <span id="updated">연결 중</span>
  </footer>
</div>

<script>
const API_BASE = "https://m5-api.yurmgirl.workers.dev";
const RECEPTION_API = "/api/receptions";
const listQrEl = document.getElementById("list-qr");
const listNormalEl = document.getElementById("list-normal");
const countQrEl = document.getElementById("count-qr");
const countNormalEl = document.getElementById("count-normal");
const updatedEl = document.getElementById("updated");

function tickClock(){
  const d = new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString("ko-KR", {hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit"});
}
tickClock();
setInterval(tickClock, 1000);

function safeText(v){ return v == null ? "" : String(v); }
function estimateMinutes(v){
  if(v === null || v === undefined || v === "" || v === "unknown") return null;
  const n = Number(v);
  return Number.isFinite(n) && n > 0 ? n : null;
}
function clockText(d){
  return d.toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", hour12: false});
}
function make(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}

function createRow(displayNum, petName, category, minutes, cumulativeMinutes, cumulativeKnown, status){
  const treating = status === "진료중";
  const row = make("div", "table-row" + (treating ? " treating" : ""));

  // 1. 번호
  const cellNum = make("div", "col-cell-num");
  cellNum.append(make("span", "num-badge", String(displayNum)));

  // 2. 동물명
  const cellPet = make("div", "col-cell-pet");
  const nameDiv = make("div", "pet-name", petName);
  const statusTag = make("span", "pet-status-tag", treating ? "● 진료 진행 중" : "접수 대기중");
  cellPet.append(nameDiv, statusTag);

  // 3. 분류
  const cellCat = make("div", "col-cell-category");
  cellCat.append(make("span", "category-badge", category || "일반진료"));

  // 4. 소요시간
  const cellTime = make("div", "col-cell-time");
  const estBadge = make("span", "est-badge", minutes === null ? "소요 미정" : `${minutes}분`);
  const expBadge = make("span", "exp-badge", cumulativeKnown 
    ? clockText(new Date(Date.now() + cumulativeMinutes * 60000)) + " 예정" 
    : "시각 미정");
  cellTime.append(estBadge, expBadge);

  row.append(cellNum, cellPet, cellCat, cellTime);
  return row;
}

function render(qrItems, estimates, categories, qrStatuses, manualBookings){
  // 1. QR 목록 (21번대 시작, 진료완료 제외)
  const activeQr = (Array.isArray(qrItems) ? qrItems : []).filter(item => {
    const k = String(item.id ?? item.reception_id ?? "");
    const st = qrStatuses[k] || item.status || "접수대기";
    return !["완료", "진료완료", "취소", "종료"].includes(st);
  }).sort((a,b)=>{
    const ta = Date.parse(a.created_at || a.createdAt || 0) || 0;
    const tb = Date.parse(b.created_at || b.createdAt || 0) || 0;
    return ta - tb;
  });

  listQrEl.replaceChildren();
  countQrEl.textContent = `${activeQr.length}명 대기`;

  if(!activeQr.length){
    listQrEl.append(make("div", "empty-col", "대기 중인 QR접수가 없습니다."));
  } else {
    let cumulative = 0, known = true;
    activeQr.forEach((item, idx) => {
      const key = String(item.id ?? item.reception_id ?? "");
      const petName = safeText(item.pet_name || item.animal_name || "이름 미입력");
      const category = categories && categories[key] ? categories[key] : (item.category || "일반진료");
      const status = qrStatuses[key] || item.status || "접수대기";
      const minutes = estimateMinutes(estimates && estimates[key]);
      if(minutes === null) known = false; else cumulative += minutes;

      const displayNum = 21 + idx; // 21번대 시작
      listQrEl.append(createRow(displayNum, petName, category, minutes, cumulative, known, status));
    });
  }

  // 2. 일반예약 목록 (31번대 시작, 진료완료 제외)
  const activeManual = (Array.isArray(manualBookings) ? manualBookings : []).filter(item => {
    return item.status !== "진료완료";
  });

  listNormalEl.replaceChildren();
  countNormalEl.textContent = `${activeManual.length}명 대기`;

  if(!activeManual.length){
    listNormalEl.append(make("div", "empty-col", "등록된 일반예약이 없습니다."));
  } else {
    let cumulativeM = 0, knownM = true;
    activeManual.forEach((item, idx) => {
      const minutes = estimateMinutes(item.minutes);
      if(minutes === null) knownM = false; else cumulativeM += minutes;

      const displayNum = 31 + idx; // 31번대 시작
      listNormalEl.append(createRow(displayNum, item.petName, item.category, minutes, cumulativeM, knownM, item.status));
    });
  }
}

async function refresh(){
  try {
    const [r, e] = await Promise.all([
      fetch(RECEPTION_API, { cache: "no-store" }),
      fetch(API_BASE + "/estimates", { cache: "no-store" })
    ]);
    const qrData = r.ok ? await r.json() : [];
    const estimateData = e.ok ? await e.json() : {};

    const savedCategories = JSON.parse(localStorage.getItem("m6_categories") || "{}");
    const savedQrStatuses = JSON.parse(localStorage.getItem("m6_qr_statuses") || "{}");
    const manualBookings = JSON.parse(localStorage.getItem("m6_manual_bookings") || "[]");

    render(
      Array.isArray(qrData) ? qrData : (qrData.items || []),
      estimateData.estimates || {},
      savedCategories,
      savedQrStatuses,
      manualBookings
    );
    updatedEl.textContent = "갱신 " + new Date().toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", second: "2-digit"});
  } catch(err) {
    updatedEl.textContent = "연결 상태 확인 필요";
    console.error(err);
  }
}

refresh();
setInterval(refresh, 5000);
window.addEventListener("storage", refresh);
</script>
</body>
</html>
