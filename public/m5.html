<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>23시 하단오거리 동물병원 · 접수 안내 (m5)</title>
<style>
:root {
  --green: #16875a;
  --deep: #075b3c;
  --mint: #e8f8ee;
  --ink: #12382e;
  --line: #d6eee0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  color: var(--ink);
  background: #edf5f0;
}
body {
  padding: 8px;
  display: flex;
  flex-direction: column;
}
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid #cce8d4;
  box-shadow: 0 8px 24px rgba(18, 64, 42, 0.08);
}

/* Header 영역 */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  background: linear-gradient(115deg, #e4f7e6, #ffffff 48%, #c9edcf);
  border-bottom: 2px solid #dcefe2;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo { font-size: 24px; }
.brandname {
  font-size: 19px;
  font-weight: 950;
  letter-spacing: -0.04em;
  color: #0b3425;
}
.clockbox {
  background: #ffffffd9;
  border: 1px solid #d2ead7;
  padding: 4px 12px;
  border-radius: 10px;
  font-size: 20px;
  font-weight: 950;
  color: #055535;
  font-variant-numeric: tabular-nums;
}

/* 좌우 5:5 분할 메인 컨테이너 */
.split-container {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr; /* 반반 분할 */
  gap: 12px;
  padding: 12px;
  background: #f4faf6;
  overflow: hidden;
}

/* 좌우 분할 패널 (QR예약 / 일반접수) */
.col-panel {
  display: flex;
  flex-direction: column;
  background: #ffffff;
  border-radius: 14px;
  border: 1.5px solid #c5e3cf;
  box-shadow: 0 4px 14px rgba(12, 58, 36, 0.06);
  overflow: hidden;
}

/* 패널 상단 타이틀 바 */
.col-header {
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid #d5ecd9;
}
.col-qr .col-header {
  background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
  border-bottom-color: #bae6fd;
}
.col-normal .col-header {
  background: linear-gradient(135deg, #fef3c7 0%, #f0fdf4 100%);
  border-bottom-color: #fde68a;
}
.col-title {
  font-size: 16px;
  font-weight: 950;
  display: flex;
  align-items: center;
  gap: 6px;
}
.col-qr .col-title { color: #0369a1; }
.col-normal .col-title { color: #b45309; }

.col-count {
  font-size: 13px;
  font-weight: 900;
  padding: 3px 10px;
  border-radius: 99px;
  background: #ffffff;
  border: 1px solid rgba(0, 0, 0, 0.08);
}

/* 테이블 줄(Row) 헤더 (번호 / 동물이름 / 소요시간) */
.table-header {
  display: grid;
  grid-template-columns: 50px 1fr 140px;
  padding: 8px 14px;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  font-size: 12px;
  font-weight: 900;
  color: #64748b;
  text-align: center;
}

/* 스크롤 가능한 줄 목록 본문 */
.table-body {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px;
}

/* 각 대기 줄(Row) */
.table-row {
  display: grid;
  grid-template-columns: 50px 1fr 140px;
  align-items: center;
  padding: 8px 10px;
  border-radius: 10px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  transition: all 0.15s ease;
}
.table-row:hover {
  background: #f8fafc;
  border-color: #cbd5e1;
}

/* 진료 진행 중인 줄 하이라이트 */
.table-row.treating {
  background: #eff6ff;
  border: 1.5px solid #93c5fd;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.12);
}

/* 1. 번호 */
.col-cell-num {
  text-align: center;
}
.num-badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 8px;
  background: #e2e8f0;
  color: #334155;
  font-size: 14px;
  font-weight: 950;
  min-width: 34px;
}
.table-row.treating .num-badge {
  background: #2563eb;
  color: #fff;
}

/* 2. 동물이름 및 아이콘 */
.col-cell-pet {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-left: 8px;
  min-width: 0;
}
.pet-icon {
  font-size: 24px;
  flex: none;
}
.pet-name-wrap {
  min-width: 0;
}
.pet-name {
  font-size: 17px;
  font-weight: 1000;
  color: #0f172a;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pet-status-tag {
  font-size: 10px;
  font-weight: 800;
  color: #16a34a;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.table-row.treating .pet-status-tag {
  color: #2563eb;
}

/* 3. 소요시간 및 진료시간 */
.col-cell-time {
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: right;
  padding-right: 4px;
}
.est-badge {
  font-size: 12px;
  font-weight: 950;
  color: #047857;
  background: #ecfdf5;
  border: 1px solid #a7f3d0;
  padding: 2px 6px;
  border-radius: 6px;
  text-align: center;
  white-space: nowrap;
}
.exp-badge {
  font-size: 11px;
  font-weight: 900;
  color: #c2410c;
  background: #fff7ed;
  border: 1px solid #fed7aa;
  padding: 2px 6px;
  border-radius: 6px;
  text-align: center;
  white-space: nowrap;
}

.empty-col {
  padding: 40px 10px;
  text-align: center;
  color: #94a3b8;
  font-size: 14px;
  font-weight: 700;
}

/* 하단 푸터 */
footer {
  display: flex;
  justify-content: space-between;
  padding: 6px 16px;
  color: #64748b;
  font-size: 11px;
  font-weight: 700;
  background: #f8fafc;
  border-top: 1px solid #e2e8f0;
}
</style>
</head>
<body>
<div class="screen">
  <header>
    <div class="brand">
      <div class="logo">🐶🐱</div>
      <div class="brandname">23시 하단오거리 동물병원 · 실시간 대기 현황판</div>
    </div>
    <div class="clockbox" id="clock">00:00:00</div>
  </header>

  <!-- 좌우 5:5 분할 영역 -->
  <main class="split-container">
    
    <!-- [왼쪽] QR 사전예약 대기열 -->
    <section class="col-panel col-qr">
      <div class="col-header">
        <div class="col-title">📱 QR 사전예약</div>
        <div class="col-count" id="count-qr">0명 대기</div>
      </div>
      <div class="table-header">
        <div>번호</div>
        <div style="text-align: left; padding-left: 8px;">동물이름</div>
        <div>소요시간</div>
      </div>
      <div class="table-body" id="list-qr">
        <div class="empty-col">대기 중인 예약 환자가 없습니다.</div>
      </div>
    </section>

    <!-- [오른쪽] 일반 현장접수 대기열 -->
    <section class="col-panel col-normal">
      <div class="col-header">
        <div class="col-title">🏥 일반 현장접수</div>
        <div class="col-count" id="count-normal">0명 대기</div>
      </div>
      <div class="table-header">
        <div>번호</div>
        <div style="text-align: left; padding-left: 8px;">동물이름</div>
        <div>소요시간</div>
      </div>
      <div class="table-body" id="list-normal">
        <div class="empty-col">대기 중인 접수 환자가 없습니다.</div>
      </div>
    </section>

  </main>

  <footer>
    <span>진료 상황 및 응급 환자에 따라 예상 소요시간은 달라질 수 있습니다.</span>
    <span id="updated">연결 중</span>
  </footer>
</div>

<script>
const API_BASE = "https://m5-api.yurmgirl.workers.dev";
const RECEPTION_API = "/api/receptions";
const listQrEl = document.getElementById("list-qr");
const listNormalEl = document.getElementById("list-normal");
const countQrEl = document.getElementById("count-qr");
const countNormalEl = document.getElementById("count-normal");
const updatedEl = document.getElementById("updated");

function tickClock(){
  const d = new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString("ko-KR", {hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit"});
}
tickClock();
setInterval(tickClock, 1000);

function safeText(v){ return v == null ? "" : String(v); }
function getPayload(item){
  let p = item?.payload;
  if(typeof p === "string"){
    try{ p = JSON.parse(p); }catch{ p = {}; }
  }
  return p && typeof p === "object" ? p : {};
}
function statusOf(item){ return safeText(item.status || "접수대기"); }
function active(item){
  const s = statusOf(item);
  return !["완료", "진료완료", "취소", "종료"].includes(s);
}
function estimateMinutes(v){
  if(v === null || v === undefined || v === "" || v === "unknown") return null;
  const n = Number(v);
  return Number.isFinite(n) && n > 0 ? n : null;
}
function clockText(d){
  return d.toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", hour12: false});
}
function make(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}

const ANIMALS = {
  dog: { label: "강아지", emoji: "🐶" },
  cat: { label: "고양이", emoji: "🐱" },
  small_mammal: { label: "소동물", emoji: "🐹" },
  bird: { label: "조류", emoji: "🦜" },
  reptile: { label: "파충류", emoji: "🦎" },
  other: { label: "기타 동물", emoji: "🐾" }
};

// QR 예약 여부 판별 함수 (payload 및 item 프로퍼티 검사)
function isQrReservation(item, payload){
  const source = safeText(item.source || item.type || payload.type || payload.source || payload.channel || "").toLowerCase();
  const isQr = item.is_qr || payload.is_qr || item.qr || payload.qr;
  return isQr || source.includes("qr") || source.includes("사전") || source.includes("예약");
}

function createRow(item, index, cumulativeMinutes, cumulativeKnown, estimates, animalTypes){
  const key = String(item.id ?? item.reception_id ?? "");
  const s = statusOf(item);
  const treating = /진료중|진료 중|치료중|치료 중/.test(s);
  
  const row = make("div", "table-row" + (treating ? " treating" : ""));

  // 1. 번호
  const cellNum = make("div", "col-cell-num");
  const numBadge = make("span", "num-badge", String(index + 1).padStart(2, "0"));
  cellNum.append(numBadge);

  // 2. 동물이름 & 아이콘
  const animalType = animalTypes && animalTypes[key] ? animalTypes[key] : "other";
  const animal = ANIMALS[animalType] || ANIMALS.other;
  const cellPet = make("div", "col-cell-pet");
  const petIcon = make("span", "pet-icon", animal.emoji);
  const nameWrap = make("div", "pet-name-wrap");
  const petName = make("div", "pet-name", safeText(item.pet_name || item.animal_name || "이름 미입력"));
  const statusTag = make("span", "pet-status-tag", treating ? "● 진료 진행 중" : "대기 중");
  nameWrap.append(petName, statusTag);
  cellPet.append(petIcon, nameWrap);

  // 3. 소요시간 & 예상시간
  const cellTime = make("div", "col-cell-time");
  const val = estimates && Object.prototype.hasOwnProperty.call(estimates, key) ? estimates[key] : null;
  const minutes = estimateMinutes(val);
  const estBadge = make("span", "est-badge", minutes === null ? "소요 미정" : `소요 ${minutes}분`);
  const expBadge = make("span", "exp-badge", cumulativeKnown 
    ? clockText(new Date(Date.now() + cumulativeMinutes * 60000)) + " 예정" 
    : "시각 미정");
  cellTime.append(estBadge, expBadge);

  row.append(cellNum, cellPet, cellTime);
  return row;
}

function render(items, estimates, animalTypes){
  const activeItems = (Array.isArray(items) ? items : []).filter(active).sort((a,b)=>{
    const ta = Date.parse(a.created_at || a.createdAt || 0) || 0;
    const tb = Date.parse(b.created_at || b.createdAt || 0) || 0;
    return ta - tb;
  });

  listQrEl.replaceChildren();
  listNormalEl.replaceChildren();

  const qrList = [];
  const normalList = [];

  activeItems.forEach(item => {
    const payload = getPayload(item);
    if(isQrReservation(item, payload)){
      qrList.push(item);
    } else {
      normalList.push(item);
    }
  });

  countQrEl.textContent = `${qrList.length}명 대기`;
  countNormalEl.textContent = `${normalList.length}명 대기`;

  // QR 목록 렌더링
  if(!qrList.length){
    listQrEl.append(make("div", "empty-col", "대기 중인 QR예약이 없습니다."));
  } else {
    let cumulative = 0, known = true;
    qrList.forEach((item, idx) => {
      const key = String(item.id ?? item.reception_id ?? "");
      const minutes = estimateMinutes(estimates[key]);
      if(minutes === null) known = false; else cumulative += minutes;
      listQrEl.append(createRow(item, idx, cumulative, known, estimates, animalTypes));
    });
  }

  // 일반 접수 목록 렌더링
  if(!normalList.length){
    listNormalEl.append(make("div", "empty-col", "대기 중인 일반접수가 없습니다."));
  } else {
    let cumulative = 0, known = true;
    normalList.forEach((item, idx) => {
      const key = String(item.id ?? item.reception_id ?? "");
      const minutes = estimateMinutes(estimates[key]);
      if(minutes === null) known = false; else cumulative += minutes;
      listNormalEl.append(createRow(item, idx, cumulative, known, estimates, animalTypes));
    });
  }
}

async function refresh(){
  try {
    const [r, e] = await Promise.all([
      fetch(RECEPTION_API, { cache: "no-store" }),
      fetch(API_BASE + "/estimates", { cache: "no-store" })
    ]);
    if(!r.ok) throw new Error("접수 목록 조회 실패 (" + r.status + ")");
    if(!e.ok) throw new Error("예상시간 서버 조회 실패 (" + e.status + ")");
    const receptions = await r.json();
    const estimateData = await e.json();
    render(
      Array.isArray(receptions) ? receptions : (receptions.items || []),
      estimateData.estimates || {},
      estimateData.animalTypes || {}
    );
    updatedEl.textContent = "갱신 " + new Date().toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", second: "2-digit"});
  } catch(err) {
    updatedEl.textContent = "연결 상태 확인 필요";
    console.error(err);
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
