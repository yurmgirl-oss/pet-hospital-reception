<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>23시 하단오거리 동물병원 · 접수 안내</title>
<style>
:root {
  --green: #16875a;
  --deep: #075b3c;
  --mint: #e8f8ee;
  --ink: #12382e;
  --line: #d6eee0;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  color: var(--ink);
  background: #f5fbf6;
}
body {
  padding: clamp(10px, 1.8vw, 24px);
  background: radial-gradient(ellipse at 15% 8%, #e6f8e8 0, transparent 35%),
              radial-gradient(ellipse at 90% 15%, #d9f4e1 0, transparent 30%),
              #f7fbf8;
}
.screen {
  max-width: 1650px;
  margin: auto;
  border-radius: 28px;
  overflow: hidden;
  background: linear-gradient(135deg, #effbf2 0%, #ffffff 48%, #e8f7ed 100%);
  border: 1px solid #d6eee0;
  box-shadow: 0 18px 55px #155e3b18;
}

/* Header 영역 */
header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 20px;
  padding: 20px 30px;
  background: linear-gradient(115deg, #e6f8e8, #ffffff 48%, #c9edcf);
  border-bottom: 2px solid #dcefe2;
}
.brand {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
}
.logo {
  width: 82px;
  height: 72px;
  display: grid;
  place-items: center;
  flex: none;
  border-radius: 22px;
  background: #ffffffbd;
  border: 1px solid #d2ead7;
  font-size: 38px;
  box-shadow: 0 6px 16px #14532d12;
}
.brandname {
  font-size: clamp(26px, 2.8vw, 42px);
  font-weight: 950;
  letter-spacing: -0.05em;
  color: #0b3425;
  line-height: 1.15;
}
.tagline {
  font-size: clamp(13px, 1.1vw, 16px);
  color: #4f7463;
  margin-top: 6px;
  font-weight: 700;
}
.datebox, .clockbox {
  border: 1px solid #ffffffd9;
  background: #ffffffd9;
  border-radius: 20px;
  box-shadow: 0 7px 20px #14532d0c;
  text-align: center;
}
.datebox {
  padding: 12px 18px;
  min-width: 140px;
  color: #3f6e59;
  font-size: 14px;
}
.datebox strong {
  display: block;
  font-size: 20px;
  color: #123d2e;
  margin-top: 4px;
}
.clockbox {
  padding: 10px 22px;
  min-width: 240px;
  color: #055535;
  font-size: clamp(34px, 4.2vw, 58px);
  font-weight: 950;
  letter-spacing: -0.045em;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}

/* 섹션 타이틀 바 */
.sectionbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 30px 14px;
  background: #ffffffc9;
  border-bottom: 1px solid #e1f2e6;
}
.sectiontitle {
  font-size: clamp(24px, 2.2vw, 32px);
  font-weight: 950;
  letter-spacing: -0.04em;
  color: #0b3a29;
}
.hint {
  font-size: clamp(13px, 1vw, 16px);
  color: #557566;
  font-weight: 700;
}
.live {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  background: #d8f5e1;
  color: #17683e;
  border-radius: 99px;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 900;
  white-space: nowrap;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #10b84f;
  box-shadow: 0 0 0 4px #bdf1cf;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  50% { opacity: .45; transform: scale(.8); }
}

/* 접수 카드 그리드 리스트 */
.list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
  align-items: stretch;
  gap: 20px;
  padding: 18px 24px 26px;
}

/* 카드 본체: 고정 구획 그리드로 내부 요소의 수평선 완벽 일치 */
.entry {
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 120px auto auto auto; /* [상단:번호/아이콘/이름] [병명 넉넉하게 120px] [상태] [예상소요] [예상진료] */
  gap: 12px;
  border-radius: 24px;
  border: 2px solid #c9e6d3;
  background: linear-gradient(180deg, #ffffff 0%, #f7fdf9 65%, #e6f6ec 100%);
  box-shadow: 0 10px 26px #155e3b14;
  padding: 18px 18px 20px;
}
.entry:before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 8px;
  background: linear-gradient(90deg, #22c55e, #86efac);
}

/* 1. 상단: 순번, 동물 아이콘, 이름 */
.cardtop {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  position: relative;
  width: 100%;
  padding-top: 6px;
}
.num {
  position: absolute;
  top: 0;
  left: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 58px;
  height: 40px;
  padding: 0 10px;
  border-radius: 12px;
  background: linear-gradient(145deg, #16a34a, #0d7945);
  color: #fff;
  font-size: clamp(20px, 1.7vw, 25px);
  font-weight: 950;
  box-shadow: 0 4px 10px #0f9f6c36;
}
.patient {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
}
.animal {
  width: clamp(100px, 9vw, 135px);
  height: clamp(100px, 9vw, 135px);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  border-radius: 28px;
  background: radial-gradient(circle at 35% 25%, #ffffff 0, #e2f8e8 55%, #d4eedd 100%);
  border: 2px solid #c8e7d2;
  font-size: clamp(70px, 6.8vw, 100px);
  line-height: 1;
  box-shadow: inset 0 0 0 5px #ffffffc9, 0 8px 16px #155e3b12;
}
.petinfo {
  width: 100%;
  height: 58px; /* 이름 영역 높이를 일정하게 고정하여 아래 행 위치 일치 */
  display: flex;
  align-items: center;
  justify-content: center;
}
/* 환자 이름 대폭 강조 */
.pet {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(28px, 2.6vw, 38px);
  font-weight: 1000;
  letter-spacing: -0.04em;
  color: #06432b;
  background: #fffffffa;
  padding: 4px 22px;
  border-radius: 16px;
  border: 1.5px solid #c2e5cb;
  box-shadow: 0 4px 10px #0000000a;
  max-width: 95%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 2. 병명 / 내원 사유: 넉넉한 고정 공간 및 정가운데 완벽 정렬 */
.reason {
  height: 120px; /* 병명 박스 높이를 넉넉하게 120px로 동일하게 고정 */
  padding: 12px 14px;
  border-radius: 18px;
  background: linear-gradient(135deg, #fff3f1, #ffe5e0);
  border: 2px solid #fca595;
  color: #991b1b;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  box-shadow: 0 5px 12px #dc26260d;
}
.reason-title {
  color: #c2410c;
  font-size: clamp(12px, 1vw, 14px);
  font-weight: 900;
  margin-bottom: 6px;
  white-space: nowrap;
}
.reason-text {
  font-size: clamp(20px, 1.8vw, 27px);
  font-weight: 950;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: keep-all;
}

/* 3. 접수/진료 상태 뱃지 (높이 통일) */
.status-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 44px;
  margin-top: 4px;
}
.status {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 99px;
  padding: 8px 24px;
  font-size: clamp(16px, 1.3vw, 20px);
  font-weight: 950;
  width: 100%;
}
.status.wait {
  background: #d4f7de;
  color: #0d683a;
  border: 1px solid #b7edc8;
}
.status.wait .sdot {
  width: 10px;
  height: 10px;
  background: #16a34a;
  border-radius: 50%;
  animation: pulse 1.15s infinite;
}
.status.treat {
  background: #dbeafe;
  color: #1e40af;
  border: 1px solid #bfdbfe;
}
.status.treat .sdot {
  width: 10px;
  height: 10px;
  background: #2563eb;
  border-radius: 50%;
  animation: pulse 1.7s infinite;
}

/* 4. 예상 소요시간 (크기 대폭 확대 및 파란색 강조) */
.estimate {
  height: 56px; /* 모든 카드 수평선 일치 */
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(24px, 2.1vw, 32px);
  font-weight: 1000;
  color: #ffffff;
  background: linear-gradient(135deg, #1d4ed8, #4338ca);
  border-radius: 16px;
  padding: 0 14px;
  width: 100%;
  text-align: center;
  box-shadow: 0 6px 16px #3730a335;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

/* 5. 예상 진료시간 (오렌지 박스) */
.expected {
  height: 52px; /* 모든 카드 수평선 일치 */
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(21px, 1.8vw, 28px);
  font-weight: 1000;
  color: #7c2d12;
  background: linear-gradient(135deg, #ffedd5, #fed7aa);
  border: 2px solid #fb923c;
  border-radius: 16px;
  padding: 0 14px;
  width: 100%;
  text-align: center;
  box-shadow: 0 4px 12px #ea580c18;
  white-space: nowrap;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  border: 2px dashed #b1d8bf;
  border-radius: 24px;
  background: #ffffffbd;
  color: #4d7060;
  font-size: clamp(22px, 2.2vw, 30px);
  white-space: pre-line;
  line-height: 1.6;
}

/* 공지사항 및 푸터 */
.notice {
  display: grid;
  grid-template-columns: minmax(200px, 0.8fr) minmax(0, 2.2fr) 44px;
  align-items: center;
  gap: 16px;
  padding: 18px 26px;
  background: linear-gradient(105deg, #156d4f, #289569);
  color: #fff;
}
.notice-label {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: clamp(18px, 1.5vw, 23px);
  font-weight: 950;
}
.notice-label small {
  display: block;
  font-size: 10px;
  letter-spacing: .1em;
  opacity: .8;
  font-weight: 800;
}
.notice-text {
  border-radius: 99px;
  background: #fffffffa;
  color: #1a4235;
  padding: 14px 22px;
  font-size: clamp(16px, 1.4vw, 21px);
  font-weight: 950;
  text-align: center;
  white-space: normal;
  line-height: 1.4;
  box-shadow: 0 4px 12px #00000010;
}
.notice-end {
  text-align: center;
  font-size: 26px;
}
footer {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 24px;
  color: #638475;
  font-size: 13px;
  font-weight: 700;
  background: #f1f9f3;
}

/* 모바일 반응형 */
@media(max-width: 768px) {
  body { padding: 0; }
  .screen { border-radius: 0; min-height: 100vh; }
  header { grid-template-columns: 1fr auto; gap: 10px; padding: 14px 16px; }
  .brand { gap: 10px; }
  .logo { width: 54px; height: 50px; font-size: 28px; }
  .brandname { font-size: 20px; }
  .tagline { font-size: 11px; }
  .datebox { display: none; }
  .clockbox { min-width: 0; padding: 8px 12px; font-size: 24px; }
  .sectionbar { padding: 14px 16px; }
  .sectiontitle { font-size: 20px; }
  .hint { display: none; }
  .list { grid-template-columns: 1fr; padding: 12px 14px 18px; gap: 14px; }
  .num { position: static; margin-bottom: 4px; }
  .notice { grid-template-columns: 1fr 34px; padding: 12px 16px; gap: 8px; }
  .notice-label { display: none; }
  .notice-text { grid-column: 1; font-size: 14px; padding: 10px 14px; border-radius: 12px; }
  .notice-end { grid-column: 2; grid-row: 1; font-size: 20px; }
  footer { font-size: 11px; flex-direction: column; gap: 6px; padding: 10px 16px; }
}
</style>
</head>
<body>
<div class="screen">
  <header>
    <div class="brand">
      <div class="logo">🐶🐱</div>
      <div>
        <div class="brandname">23시 하단오거리 동물병원</div>
        <div class="tagline">우리 아이의 건강한 오늘, 23시 하단오거리가 함께합니다. 💚</div>
      </div>
    </div>
    <div class="datebox" id="datebox">
      📅 날짜 확인 중<strong id="day">오늘</strong>
    </div>
    <div class="clockbox" id="clock">00:00:00</div>
  </header>

  <div class="sectionbar">
    <div class="sectiontitle">🐾 접수 현황 안내</div>
    <div class="hint">순서와 예상 소요시간을 확인하세요</div>
    <div class="live"><span class="dot"></span> 실시간 안내 중</div>
  </div>

  <main>
    <section id="list" class="list">
      <div class="empty">접수 현황을 확인하고 있습니다…</div>
    </section>
  </main>

  <div class="notice">
    <div class="notice-label">
      <span>📢</span>
      <div>병원 안내 · 공지사항<small>HOSPITAL NOTICE</small></div>
    </div>
    <div class="notice-text" id="notice">병원 출발 전, 미리 사전접수! 기다림은 줄이고 진료는 편리하게 😊</div>
    <div class="notice-end">🔊</div>
  </div>

  <footer>
    <span>진료 상황 및 응급 환자에 따라 예상 소요시간은 달라질 수 있습니다.</span>
    <span id="updated">연결 중</span>
  </footer>
</div>

<script>
const API_BASE = "https://m5-api.yurmgirl.workers.dev";
const RECEPTION_API = "/api/receptions";
const listEl = document.getElementById("list");
const updatedEl = document.getElementById("updated");

function tickClock(){
  const d = new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString("ko-KR", {hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit"});
  document.getElementById("datebox").firstChild.textContent = "📅 " + d.toLocaleDateString("ko-KR", {year: "numeric", month: "long", day: "numeric"});
  document.getElementById("day").textContent = d.toLocaleDateString("ko-KR", {weekday: "long"});
}
tickClock();
setInterval(tickClock, 1000);

function safeText(v){ return v == null ? "" : String(v); }
function getPayload(item){
  let p = item?.payload;
  if(typeof p === "string"){
    try{ p = JSON.parse(p); }catch{ p = {}; }
  }
  return p && typeof p === "object" ? p : {};
}
function statusOf(item){ return safeText(item.status || "접수대기"); }
function active(item){
  const s = statusOf(item);
  return !["완료", "진료완료", "취소", "종료"].includes(s);
}
function estimateMinutes(v){
  if(v === null || v === undefined || v === "" || v === "unknown") return null;
  const n = Number(v);
  return Number.isFinite(n) && n > 0 ? n : null;
}
function clockText(d){
  return d.toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", hour12: false});
}
function make(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}

const ANIMALS = {
  dog: { label: "강아지", emoji: "🐶" },
  cat: { label: "고양이", emoji: "🐱" },
  small_mammal: { label: "소동물", emoji: "🐹" },
  bird: { label: "조류", emoji: "🦜" },
  reptile: { label: "파충류", emoji: "🦎" },
  other: { label: "기타 동물", emoji: "🐾" }
};

function render(items, estimates, animalTypes){
  const activeItems = (Array.isArray(items) ? items : []).filter(active).sort((a,b)=>{
    const ta = Date.parse(a.created_at || a.createdAt || 0) || 0;
    const tb = Date.parse(b.created_at || b.createdAt || 0) || 0;
    return ta - tb;
  });

  listEl.replaceChildren();
  if(!activeItems.length){
    listEl.append(make("div", "empty", "현재 대기 중인 접수가 없습니다.\n접수가 등록되면 이 화면에 표시됩니다."));
    return;
  }

  let cumulativeMinutes = 0;
  let cumulativeKnown = true;

  activeItems.forEach((item, index)=>{
    const row = make("article", "entry");
    
    // 1. 상단: 순번, 동물, 이름
    const top = make("div", "cardtop");
    const num = make("div", "num", String(index + 1).padStart(2, "0"));
    const key = String(item.id ?? item.reception_id ?? "");
    
    const pet = make("div", "pet", safeText(item.pet_name || item.animal_name || "이름 미입력"));
    const animalType = animalTypes && animalTypes[key] ? animalTypes[key] : "other";
    const animal = ANIMALS[animalType] || ANIMALS.other;
    const illustration = make("div", "animal", animal.emoji);
    illustration.setAttribute("aria-label", animal.label);
    
    const petinfo = make("div", "petinfo");
    petinfo.append(pet);
    
    const patient = make("div", "patient");
    patient.append(illustration, petinfo);
    top.append(num, patient);

    // 2. 병명 및 내원사유 (120px 넉넉한 공간 & 중앙 정렬)
    const payload = getPayload(item);
    const reasonText = safeText(payload.disease || item.disease || payload.diagnosis || item.diagnosis || payload.reason || item.symptom || item.symptoms || "병명·내원 사유 확인 중");
    const why = make("div", "reason");
    const whyTitle = make("div", "reason-title", "🩺 병명 · 증상 / 내원 사유");
    const whyContent = make("div", "reason-text", reasonText);
    why.append(whyTitle, whyContent);

    // 3. 접수/진료 상태 뱃지
    const s = statusOf(item);
    const treating = /진료중|진료 중|치료중|치료 중/.test(s);
    const statusWrap = make("div", "status-wrap");
    const badge = make("div", "status " + (treating ? "treat" : "wait"));
    badge.append(make("span", "sdot"), document.createTextNode(treating ? "진료 진행 중" : "접수 대기중"));
    statusWrap.append(badge);

    // 4. 예상 소요시간 & 예상 진료시간 계산
    const val = estimates && Object.prototype.hasOwnProperty.call(estimates, key) ? estimates[key] : null;
    const minutes = estimateMinutes(val);
    if(minutes === null) cumulativeKnown = false;
    else cumulativeMinutes += minutes;

    const estimateLabel = minutes === null ? "예상 소요시간 미정" : `예상 소요시간 ${minutes}분`;
    const estimateBox = make("div", "estimate", estimateLabel);

    const expectedText = cumulativeKnown 
      ? "예상 진료시간 " + clockText(new Date(Date.now() + cumulativeMinutes * 60000))
      : "예상 진료시간 미정";
    const expectedBox = make("div", "expected", expectedText);

    // 카드에 정해진 순서대로 추가 (누적 대기시간은 제거됨)
    row.append(top, why, statusWrap, estimateBox, expectedBox);
    listEl.append(row);
  });
}

async function refresh(){
  try {
    const [r, e] = await Promise.all([
      fetch(RECEPTION_API, { cache: "no-store" }),
      fetch(API_BASE + "/estimates", { cache: "no-store" })
    ]);
    if(!r.ok) throw new Error("접수 목록 조회 실패 (" + r.status + ")");
    if(!e.ok) throw new Error("예상시간 서버 조회 실패 (" + e.status + ")");
    const receptions = await r.json();
    const estimateData = await e.json();
    render(
      Array.isArray(receptions) ? receptions : (receptions.items || []),
      estimateData.estimates || {},
      estimateData.animalTypes || {}
    );
    updatedEl.textContent = "마지막 갱신 " + new Date().toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", second: "2-digit"});
  } catch(err) {
    updatedEl.textContent = "연결 상태 확인 필요";
    if(!listEl.children.length || listEl.querySelector(".empty")) {
      listEl.replaceChildren(make("div", "empty", "서버에 연결하지 못했습니다.\n네트워크 및 서버 상태를 확인해 주세요."));
    }
    console.error(err);
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
