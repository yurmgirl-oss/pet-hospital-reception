<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>23시 하단오거리 동물병원 · 대기 현황판 (m5 키오스크)</title>
<style>
:root {
  --primary-green: #059669;
  --deep-green: #064e3b;
  --bg-main: #f0fdf4;
  --ink: #0f172a;
}
* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
  user-select: none;
}
html, body {
  width: 100%;
  height: 100%;
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color: var(--ink);
  background: #0f172a;
  overflow: hidden;
}
body {
  padding: 8px;
  display: flex;
  flex-direction: column;
}
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  border-radius: 20px;
  overflow: hidden;
  border: 2px solid #334155;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  position: relative;
}

/* 상단 헤더 & 시계 */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: linear-gradient(135deg, #dcfce7 0%, #ffffff 45%, #e0f2fe 100%);
  border-bottom: 2.5px solid #bbf7d0;
}
.brandname {
  font-size: clamp(22px, 3.8vw, 28px);
  font-weight: 1000;
  letter-spacing: -0.04em;
  color: #064e3b;
}
.clockbox {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  border: 2px solid #86efac;
  padding: 4px 18px;
  border-radius: 14px;
  box-shadow: 0 3px 10px rgba(16, 185, 129, 0.15);
}
.clock-date {
  font-size: 13px;
  font-weight: 900;
  color: #059669;
}
.clock-time {
  font-size: clamp(26px, 4.4vw, 34px);
  font-weight: 1000;
  color: #064e3b;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1.05;
}

/* 상하 2단 컨테이너 */
.vertical-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 10px;
  background: #f1f5f9;
  overflow: hidden;
}
.row-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  border-radius: 18px;
  border: 2.5px solid #cbd5e1;
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
  overflow: hidden;
}

/* 패널 헤더 */
.panel-header {
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2.5px solid #e2e8f0;
}
.panel-qr .panel-header {
  background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
  border-bottom-color: #93c5fd;
}
.panel-normal .panel-header {
  background: linear-gradient(135deg, #fef3c7 0%, #fff7ed 100%);
  border-bottom-color: #fcd34d;
}
.panel-title {
  font-size: clamp(22px, 3.6vw, 28px);
  font-weight: 1000;
  letter-spacing: -0.03em;
}
.panel-qr .panel-title { color: #0284c7; }
.panel-normal .panel-title { color: #d97706; }

.panel-count {
  font-size: 16px;
  font-weight: 1000;
  padding: 4px 14px;
  border-radius: 999px;
  background: #ffffff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
.panel-qr .panel-count { color: #0369a1; border: 1.5px solid #bae6fd; }
.panel-normal .panel-count { color: #b45309; border: 1.5px solid #fde68a; }

/* 📐 [균형 재배치된 5개 열 그리드]
   [번호 70px] - [동물명 1.8fr] - [상태 1fr] - [분류 1.3fr] - [소요시간 1.3fr] */
.table-header {
  display: grid;
  grid-template-columns: 70px 1.8fr 1fr 1.3fr 1.3fr;
  align-items: center;
  padding: 10px 16px;
  background: #f8fafc;
  border-bottom: 2px solid #cbd5e1;
  font-size: 17px;
  font-weight: 1000;
  color: #64748b;
  text-align: center;
}

.table-body {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px 12px;
}

/* 대기 줄(Row) - 높이를 넉넉하게 키워 5개 기준 꽉 차도록 설정 */
.table-row {
  display: grid;
  grid-template-columns: 70px 1.8fr 1fr 1.3fr 1.3fr;
  align-items: center;
  min-height: 104px;
  padding: 8px 16px;
  border-radius: 18px;
  background: #ffffff;
  border: 2.5px solid #e2e8f0;
  box-shadow: 0 3px 12px rgba(0,0,0,0.04);
  transition: all 0.2s ease;
}

.table-row.treating {
  background: linear-gradient(90deg, #eff6ff 0%, #ffffff 100%);
  border: 3.5px solid #2563eb;
  box-shadow: 0 6px 22px rgba(37, 99, 235, 0.28);
  animation: glowCard 1.8s infinite alternate;
}
@keyframes glowCard {
  0% { border-color: #2563eb; box-shadow: 0 0 15px rgba(37, 99, 235, 0.3); }
  100% { border-color: #60a5fa; box-shadow: 0 0 26px rgba(96, 165, 250, 0.55); }
}

/* 1. 번호 */
.col-cell-num { display: flex; justify-content: center; align-items: center; }
.num-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 64px;
  height: 64px;
  border-radius: 16px;
  font-size: clamp(28px, 4vw, 36px);
  font-weight: 1000;
  letter-spacing: -0.02em;
}
.panel-qr .num-badge { background: #e0f2fe; color: #0284c7; border: 2.5px solid #93c5fd; }
.panel-normal .num-badge { background: #fef3c7; color: #d97706; border: 2.5px solid #fcd34d; }
.table-row.treating .num-badge { 
  background: linear-gradient(135deg, #2563eb, #1d4ed8); 
  color: #ffffff; 
  border-color: #93c5fd; 
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
}

/* 2. 동물명 */
.col-cell-pet {
  display: flex;
  align-items: center;
  padding-left: 12px;
  overflow: hidden;
}
.pet-name {
  font-size: clamp(36px, 5.2vw, 54px);
  font-weight: 1000;
  color: #0f172a;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -0.04em;
  line-height: 1.1;
}

/* 3. 진료 상태 배지 */
.col-cell-status { display: flex; justify-content: center; align-items: center; }
.pet-status-badge {
  font-size: clamp(20px, 2.6vw, 26px);
  font-weight: 1000;
  padding: 10px 20px;
  border-radius: 16px;
  white-space: nowrap;
  letter-spacing: -0.02em;
}
.pet-status-badge.wait {
  background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
  color: #14532d;
  border: 2px solid #86efac;
}
.pet-status-badge.treat {
  background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
  color: #ffffff;
  border: 2px solid #93c5fd;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
  animation: pulseTreat 1.2s infinite;
}
@keyframes pulseTreat {
  50% { opacity: 0.88; transform: scale(0.96); }
}

/* 4. 진료분류 배지 */
.col-cell-category { display: flex; justify-content: center; align-items: center; padding: 0 4px; }
.category-badge {
  display: inline-block;
  font-size: clamp(20px, 2.6vw, 26px);
  font-weight: 1000;
  padding: 10px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
  color: #1e293b;
  border: 2px solid #cbd5e1;
  white-space: nowrap;
}

/* 5. 소요시간 배지 */
.col-cell-time { display: flex; justify-content: center; align-items: center; padding: 0 4px; }
.est-badge {
  font-size: clamp(20px, 2.6vw, 28px);
  font-weight: 1000;
  color: #ffffff;
  background: linear-gradient(135deg, #059669 0%, #047857 100%);
  border: 2px solid #34d399;
  padding: 10px 20px;
  border-radius: 16px;
  white-space: nowrap;
  letter-spacing: -0.02em;
  box-shadow: 0 4px 12px rgba(5, 150, 105, 0.35);
}
.table-row.treating .est-badge {
  background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
  border-color: #60a5fa;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
}

.empty-col {
  padding: 70px 10px;
  text-align: center;
  color: #94a3b8;
  font-size: 22px;
  font-weight: 900;
}

/* 하단 배너 & 푸터 */
.notice-bar {
  display: flex;
  align-items: center;
  padding: 10px 20px;
  background: linear-gradient(90deg, #059669, #10b84f 50%, #0284c7 100%);
  color: #ffffff;
  font-size: 15px;
  font-weight: 950;
  gap: 12px;
  overflow: hidden;
}
.notice-label {
  flex: none;
  background: #ffffff;
  color: #064e3b;
  padding: 5px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 1000;
}
.notice-text {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
footer {
  display: flex;
  justify-content: space-between;
  padding: 8px 20px;
  color: #64748b;
  font-size: 13px;
  font-weight: 800;
  background: #f8fafc;
  border-top: 1.5px solid #e2e8f0;
}

/* 긴급 공지 오버레이 */
.urgent-overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(8px);
  z-index: 999;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.urgent-box {
  background: #ffffff;
  border: 6px solid #ef4444;
  border-radius: 28px;
  padding: 34px 28px;
  width: 90%;
  text-align: center;
  box-shadow: 0 20px 50px rgba(239, 68, 68, 0.45);
  animation: urgentBlink 1.2s infinite alternate ease-in-out;
}
@keyframes urgentBlink {
  0% { border-color: #ef4444; transform: scale(0.98); }
  100% { border-color: #f59e0b; transform: scale(1.02); }
}
.urgent-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #fee2e2;
  color: #b91c1c;
  border: 2px solid #ef4444;
  padding: 8px 20px;
  border-radius: 999px;
  font-size: 18px;
  font-weight: 1000;
  margin-bottom: 18px;
}
.urgent-text-content {
  font-size: clamp(24px, 3.4vw, 34px);
  font-weight: 1000;
  color: #1e293b;
  line-height: 1.4;
  word-break: keep-all;
}
.urgent-sub {
  margin-top: 16px;
  font-size: 15px;
  color: #64748b;
  font-weight: 800;
}
</style>
</head>
<body>
<div class="screen">

  <div id="urgent-modal" class="urgent-overlay">
    <div class="urgent-box">
      <div class="urgent-badge">
        <span>🚨</span>
        <span>병원 안내 · 긴급 공지</span>
      </div>
      <div id="urgent-modal-text" class="urgent-text-content">
        응급 처치 진행 중입니다. 잠시만 대기해 주세요.
      </div>
      <div class="urgent-sub">보호자님의 너른 양해 부탁드립니다. 🙏</div>
    </div>
  </div>

  <header>
    <div class="brand">
      <div class="brandname">🐾 23시 하단오거리 동물병원</div>
    </div>
    <div class="clockbox">
      <div class="clock-date" id="clock-date">00월 00일 (요일)</div>
      <div class="clock-time" id="clock-time">00:00:00</div>
    </div>
  </header>

  <main class="vertical-container">
    
    <!-- [상단] 📱 QR 사전접수 -->
    <section class="row-panel panel-qr">
      <div class="panel-header">
        <div class="panel-title">📱 QR 사전접수</div>
        <div class="panel-count" id="count-qr">0명 대기</div>
      </div>
      <div class="table-header">
        <div>번호</div>
        <div style="text-align: left; padding-left: 14px;">동물명</div>
        <div>진료상태</div>
        <div>진료분류</div>
        <div>소요시간</div>
      </div>
      <div class="table-body" id="list-qr">
        <div class="empty-col">대기 중인 QR접수가 없습니다.</div>
      </div>
    </section>

    <!-- [하단] 🏥 일반 현장예약 -->
    <section class="row-panel panel-normal">
      <div class="panel-header">
        <div class="panel-title">🏥 일반 현장예약</div>
        <div class="panel-count" id="count-normal">0명 대기</div>
      </div>
      <div class="table-header">
        <div>번호</div>
        <div style="text-align: left; padding-left: 14px;">동물명</div>
        <div>진료상태</div>
        <div>진료분류</div>
        <div>소요시간</div>
      </div>
      <div class="table-body" id="list-normal">
        <div class="empty-col">등록된 일반예약이 없습니다.</div>
      </div>
    </section>

  </main>

  <div class="notice-bar">
    <div class="notice-label">📢 안내</div>
    <div class="notice-text">출발 전 사전접수하시면 대기시간이 단축됩니다 😊</div>
  </div>

  <footer>
    <span>진료 상황에 따라 소요시간이 변동될 수 있습니다.</span>
    <span id="updated">중앙 서버 연결 중</span>
  </footer>
</div>

<script>
const SYNC_API = "https://m5-api.yurmgirl.workers.dev/sync";
const RECEPTION_API = "/api/receptions";

const listQrEl = document.getElementById("list-qr");
const listNormalEl = document.getElementById("list-normal");
const countQrEl = document.getElementById("count-qr");
const countNormalEl = document.getElementById("count-normal");
const updatedEl = document.getElementById("updated");
const clockDateEl = document.getElementById("clock-date");
const clockTimeEl = document.getElementById("clock-time");

const urgentModal = document.getElementById("urgent-modal");
const urgentModalText = document.getElementById("urgent-modal-text");

const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

function tickClock(){
  const d = new Date();
  const m = d.getMonth() + 1;
  const day = d.getDate();
  const w = WEEKDAYS[d.getDay()];
  clockDateEl.textContent = `${m}월 ${day}일 (${w})`;

  clockTimeEl.textContent = d.toLocaleTimeString("ko-KR", {
    hour12: false, 
    hour: "2-digit", 
    minute: "2-digit", 
    second: "2-digit"
  });
}
tickClock();
setInterval(tickClock, 1000);

function safeText(v){ return v == null ? "" : String(v); }
function estimateMinutes(v){
  if(v === null || v === undefined || v === "" || v === "unknown") return null;
  const n = Number(v);
  return Number.isFinite(n) && n > 0 ? n : null;
}
function make(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}

function handleUrgentNotice(un){
  if(un && un.active && un.text){
    urgentModalText.textContent = un.text;
    urgentModal.style.display = "flex";
  } else {
    urgentModal.style.display = "none";
  }
}

function createRow(displayNum, petName, category, minutes, status){
  const treating = status === "진료중";
  const row = make("div", "table-row" + (treating ? " treating" : ""));

  // 1. 번호
  const cellNum = make("div", "col-cell-num");
  cellNum.append(make("span", "num-badge", String(displayNum)));

  // 2. 동물명
  const cellPet = make("div", "col-cell-pet");
  const nameDiv = make("div", "pet-name", petName);
  cellPet.append(nameDiv);

  // 3. 진료상태
  const cellStatus = make("div", "col-cell-status");
  const statusBadge = make("span", "pet-status-badge " + (treating ? "treat" : "wait"), treating ? "진료중" : "대기중");
  cellStatus.append(statusBadge);

  // 4. 진료분류
  const cellCat = make("div", "col-cell-category");
  cellCat.append(make("span", "category-badge", category || "일반진료"));

  // 5. 소요시간
  const cellTime = make("div", "col-cell-time");
  const estBadge = make("span", "est-badge", minutes === null ? "시간 미정" : `소요 ${minutes}분`);
  cellTime.append(estBadge);

  row.append(cellNum, cellPet, cellStatus, cellCat, cellTime);
  return row;
}

function render(qrItems, serverState){
  const categories = serverState.categories || {};
  const qrStatuses = serverState.qrStatuses || {};
  const qrMinutes = serverState.qrMinutes || {};
  const deletedKeys = serverState.qrDeleted || [];
  const manualBookings = serverState.manualBookings || [];

  handleUrgentNotice(serverState.urgentNotice);

  // 1. QR 목록
  const activeQr = (Array.isArray(qrItems) ? qrItems : []).filter(item => {
    const k = String(item.id ?? item.reception_id ?? "");
    if (deletedKeys.includes(k)) return false;
    const st = qrStatuses[k] || item.status || "접수대기";
    return !["완료", "진료완료", "자료삭제", "취소", "종료"].includes(st);
  }).sort((a,b)=>{
    const ta = Date.parse(a.created_at || a.createdAt || 0) || 0;
    const tb = Date.parse(b.created_at || b.createdAt || 0) || 0;
    return ta - tb;
  });

  listQrEl.replaceChildren();
  countQrEl.textContent = `${activeQr.length}명 대기`;

  if(!activeQr.length){
    listQrEl.append(make("div", "empty-col", "대기 중인 QR접수가 없습니다."));
  } else {
    activeQr.forEach((item, idx) => {
      const key = String(item.id ?? item.reception_id ?? "");
      const petName = safeText(item.pet_name || item.animal_name || "이름 미입력");
      const category = categories[key] || item.category || "일반진료";
      const status = qrStatuses[key] || item.status || "접수대기";
      const minutes = estimateMinutes(qrMinutes[key] !== undefined ? qrMinutes[key] : 15);

      listQrEl.append(createRow(21 + idx, petName, category, minutes, status));
    });
  }

  // 2. 일반예약 목록
  const activeManual = manualBookings.filter(item => {
    return item.status !== "진료완료" && item.status !== "자료삭제";
  });

  listNormalEl.replaceChildren();
  countNormalEl.textContent = `${activeManual.length}명 대기`;

  if(!activeManual.length){
    listNormalEl.append(make("div", "empty-col", "등록된 일반예약이 없습니다."));
  } else {
    activeManual.forEach((item, idx) => {
      const minutes = estimateMinutes(item.minutes);
      listNormalEl.append(createRow(31 + idx, item.petName, item.category, minutes, item.status));
    });
  }
}

async function refresh(){
  try {
    const [r, s] = await Promise.all([
      fetch(RECEPTION_API, { cache: "no-store" }),
      fetch(SYNC_API, { cache: "no-store" })
    ]);
    const qrData = r.ok ? await r.json() : [];
    const serverState = s.ok ? await s.json() : {};

    render(
      Array.isArray(qrData) ? qrData : (qrData.items || []),
      serverState
    );
    updatedEl.textContent = "실시간 서버 동기화 중 " + new Date().toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit", second: "2-digit"});
  } catch(err) {
    updatedEl.textContent = "동기화 연결 확인 필요";
  }
}

// ⏱️ 요청하신 대로 3초 주기(3000ms) 실시간 폴링으로 설정
refresh();
setInterval(refresh, 3000);

window.addEventListener("message", (e) => {
  if (e.data === "reload_m5") refresh();
});
</script>
</body>
</html>
