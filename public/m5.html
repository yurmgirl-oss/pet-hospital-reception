<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b4d3b">
<title>접수알림모니터 | 23시 하단오거리동물병원</title>
<style>
  :root {
    color-scheme: light;
    --green: #0b6248;
    --green-dark: #084b38;
    --green-soft: #eaf5ef;
    --ink: #15251f;
    --muted: #6b7a73;
    --line: #dce8e1;
    --amber: #9a5b00;
    --amber-bg: #fff4d9;
    --blue: #225ca8;
    --blue-bg: #eaf2ff;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; min-height: 100%; margin: 0; }
  body {
    background: #f4f8f5;
    color: var(--ink);
    font-family: Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  .page {
    width: min(100%, 1500px);
    min-height: 100vh;
    margin: 0 auto;
    padding: clamp(18px, 3vw, 42px);
    display: flex;
    flex-direction: column;
    gap: clamp(18px, 2vw, 28px);
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    padding-bottom: 22px;
    border-bottom: 3px solid var(--green);
  }
  .brand { display: flex; flex-direction: column; gap: 8px; }
  .clinic { font-size: clamp(14px, 1.5vw, 21px); color: var(--green); font-weight: 800; letter-spacing: .02em; }
  h1 { margin: 0; font-size: clamp(28px, 4vw, 52px); line-height: 1.12; letter-spacing: -.04em; }
  .sub { margin-top: 6px; color: var(--muted); font-size: clamp(13px, 1.35vw, 18px); }
  .live {
    flex: 0 0 auto; display: flex; align-items: center; gap: 9px;
    background: white; border: 1px solid var(--line); border-radius: 999px;
    padding: 11px 16px; color: var(--green); font-size: clamp(12px, 1.2vw, 16px); font-weight: 800;
  }
  .dot { width: 10px; height: 10px; background: #1aa66b; border-radius: 50%; box-shadow: 0 0 0 5px #dff5e9; }
  .summary { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
  .summary h2 { margin: 0; font-size: clamp(20px, 2.2vw, 28px); }
  #updated { color: var(--muted); font-size: clamp(11px, 1vw, 14px); }
  #cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(12px, 1.5vw, 22px);
    align-content: start;
  }
  .card {
    min-width: 0; background: white; border: 1px solid var(--line);
    border-radius: 20px; padding: clamp(18px, 2.2vw, 30px);
    box-shadow: 0 5px 18px rgba(22, 64, 44, .045);
    display: flex; flex-direction: column; gap: 16px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .number { color: #8a9b92; font-size: clamp(15px, 1.5vw, 20px); font-weight: 900; letter-spacing: .06em; }
  .status {
    flex: 0 0 auto; border-radius: 999px; padding: 8px 13px;
    font-size: clamp(12px, 1.15vw, 16px); font-weight: 900;
    background: var(--amber-bg); color: var(--amber);
  }
  .status.progress { background: var(--blue-bg); color: var(--blue); }
  .pet {
    margin: 0; font-size: clamp(28px, 3.5vw, 46px); font-weight: 900;
    line-height: 1.12; letter-spacing: -.035em; overflow-wrap: anywhere;
  }
  .reason-label { color: var(--muted); font-size: clamp(12px, 1.1vw, 15px); font-weight: 800; }
  .reason {
    margin: 0; font-size: clamp(17px, 1.8vw, 24px); line-height: 1.5;
    font-weight: 600; white-space: pre-line; overflow-wrap: anywhere;
  }
  .empty, .error {
    grid-column: 1 / -1; background: white; border: 1px solid var(--line);
    border-radius: 20px; padding: clamp(35px, 7vw, 90px) 20px; text-align: center;
  }
  .empty strong { display: block; font-size: clamp(22px, 3vw, 36px); margin-bottom: 12px; }
  .empty span, .error { color: var(--muted); font-size: clamp(14px, 1.4vw, 18px); }
  footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); color: #839188; text-align: center; font-size: clamp(11px, 1vw, 14px); }
  @media (max-width: 760px) {
    .page { padding: 18px; }
    header { align-items: flex-start; }
    .live { padding: 8px 10px; }
    #cards { grid-template-columns: 1fr; }
    .card { border-radius: 16px; }
  }
  @media (min-width: 1500px) {
    #cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <div class="brand">
      <div class="clinic">23시 하단오거리동물병원</div>
      <div>
        <h1>접수 알림</h1>
        <div class="sub">진료 접수 현황을 안내해 드립니다.</div>
      </div>
    </div>
    <div class="live"><span class="dot"></span><span>실시간 현황</span></div>
  </header>

  <section class="summary" aria-live="polite">
    <h2>현재 접수 현황</h2>
    <div id="updated">접수 내역을 확인하는 중입니다…</div>
  </section>

  <section id="cards" aria-live="polite" aria-label="접수 목록">
    <div class="empty"><strong>접수 현황을 확인하고 있습니다.</strong><span>잠시만 기다려 주세요.</span></div>
  </section>

  <footer>진료 진행 상황에 따라 순서가 달라질 수 있습니다.</footer>
</main>
<script>
(() => {
  'use strict';
  const cards = document.getElementById('cards');
  const updated = document.getElementById('updated');
  let requestInProgress = false;

  function text(value, fallback = '') {
    if (value === null || value === undefined) return fallback;
    const result = String(value).trim();
    return result || fallback;
  }

  function unwrapPayload(raw) {
    let current = raw;
    try {
      while (typeof current === 'string') current = JSON.parse(current);
    } catch (_) {
      return {};
    }
    return current && typeof current === 'object' ? current : {};
  }

  function getReason(item) {
    const payload = unwrapPayload(item.payload);
    return text(payload.reason) ||
      text(item.symptom) ||
      text(item.symptoms) ||
      '내원 사유가 접수되지 않았습니다.';
  }

  function getStatus(item) {
    const status = text(item.status);
    if (status === '진료중') return { label: '진료 중', progress: true };
    if (status === '접수대기' || status === '대기') return { label: '접수중', progress: false };
    return null;
  }

  function createCard(item, index) {
    const status = getStatus(item);
    const card = document.createElement('article');
    card.className = 'card';

    const top = document.createElement('div');
    top.className = 'card-top';

    const number = document.createElement('div');
    number.className = 'number';
    number.textContent = String(index + 1).padStart(2, '0');

    const badge = document.createElement('div');
    badge.className = 'status' + (status && status.progress ? ' progress' : '');
    badge.textContent = status ? status.label : '접수중';

    const pet = document.createElement('h3');
    pet.className = 'pet';
    pet.textContent = text(item.pet_name, '이름 미기재');

    const reasonLabel = document.createElement('div');
    reasonLabel.className = 'reason-label';
    reasonLabel.textContent = '내원 사유';

    const reason = document.createElement('p');
    reason.className = 'reason';
    reason.textContent = getReason(item);

    top.append(number, badge);
    card.append(top, pet, reasonLabel, reason);
    return card;
  }

  function showMessage(title, detail, className = 'empty') {
    const box = document.createElement('div');
    box.className = className;
    const strong = document.createElement('strong');
    strong.textContent = title;
    box.appendChild(strong);
    if (detail) {
      const span = document.createElement('span');
      span.textContent = detail;
      box.appendChild(span);
    }
    cards.replaceChildren(box);
  }

  async function refresh() {
    if (requestInProgress) return;
    requestInProgress = true;
    try {
      const response = await fetch('/api/receptions', {
        method: 'GET',
        cache: 'no-store',
        headers: { 'Accept': 'application/json' }
      });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      if (!Array.isArray(data)) throw new Error('Unexpected response');

      // 접수 대기와 진료 중만 공개하고, 완료된 건은 표시하지 않습니다.
      const active = data
        .filter(item => item && getStatus(item))
        .sort((a, b) => {
          const ta = Date.parse(text(a.created_at).replace(' ', 'T')) || 0;
          const tb = Date.parse(text(b.created_at).replace(' ', 'T')) || 0;
          return ta - tb;
        });

      if (active.length === 0) {
        showMessage('현재 접수 중인 환자가 없습니다.', '접수가 등록되면 이 화면에 표시됩니다.');
      } else {
        const fragment = document.createDocumentFragment();
        active.forEach((item, index) => fragment.appendChild(createCard(item, index)));
        cards.replaceChildren(fragment);
      }
      updated.textContent = '마지막 확인 ' + new Date().toLocaleTimeString('ko-KR', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    } catch (error) {
      console.error('접수 현황 조회 실패:', error);
      updated.textContent = '서버 연결 확인 필요';
      if (!cards.querySelector('.card')) {
        showMessage('접수 현황을 불러오지 못했습니다.', '네트워크 연결을 확인해 주세요.', 'error');
      }
    } finally {
      requestInProgress = false;
    }
  }

  refresh();
  window.setInterval(refresh, 5000);
})();
</script>
</body>
</html>
