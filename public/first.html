<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초진 접수서 - 23시 하단오거리동물병원</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap">
  <style>
    body { 
      font-family: 'Pretendard', sans-serif; 
      background-color: #f8fafc;
      background-image: 
        linear-gradient(to right, rgba(203, 213, 225, 0.35) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(203, 213, 225, 0.35) 1px, transparent 1px);
      background-size: 26px 26px;
    }
    .font-serif-title {
      font-family: 'Nanum Myeongjo', serif;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 p-3 sm:p-6 flex justify-center items-start">

  <div class="w-full max-w-xl space-y-4 my-2">

    <!-- 상단 네비게이션 & 타이틀 -->
    <header class="flex items-center justify-between bg-white p-3.5 px-4 rounded-2xl border border-slate-200/80 shadow-sm">
      <a href="index.html" class="inline-flex items-center gap-1 text-xs font-bold text-slate-500 hover:text-[#006257] transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        <span>메인으로</span>
      </a>
      <div class="text-right">
        <h1 class="text-sm font-extrabold text-[#006257] tracking-tight">초진(신규) 접수증</h1>
        <p class="text-[10px] text-slate-400">23시 하단오거리동물병원</p>
      </div>
    </header>

    <form id="firstRegistrationForm" onsubmit="submitForm(event)" class="space-y-4">

      <!-- 1. 보호자 정보 카드 -->
      <section class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/90 shadow-sm space-y-3">
        <div class="flex items-center justify-between border-b border-slate-100 pb-2">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-lg bg-teal-50 text-[#006257] flex items-center justify-center font-bold text-xs">👤</span>
            <h2 class="text-sm font-extrabold text-slate-900">보호자 정보</h2>
          </div>
          <span class="text-[11px] text-amber-600 font-semibold">* 필수 입력</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
          <div>
            <label class="block font-bold text-slate-700 mb-1">보호자 성함 <span class="text-rose-500">*</span></label>
            <input 
              type="text" 
              id="ownerName" 
              required 
              placeholder="보호자님 성함" 
              class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-[#006257] focus:ring-1 focus:ring-[#006257] focus:outline-none transition"
            >
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">휴대폰 번호 <span class="text-rose-500">*</span></label>
            <input 
              type="tel" 
              id="ownerPhone" 
              required 
              placeholder="010-0000-0000" 
              oninput="autoHyphen(this)"
              maxlength="13"
              class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-[#006257] focus:ring-1 focus:ring-[#006257] focus:outline-none transition tabular-nums"
            >
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1 text-xs">거주 지역 (동 이름 또는 도로명)</label>
          <input 
            type="text" 
            id="ownerAddress" 
            placeholder="예: 부산 사하구 하단동" 
            class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-[#006257] focus:outline-none transition"
          >
        </div>
      </section>

      <!-- 2. 반려동물 정보 카드 (컴팩트 최적화) -->
      <section class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/90 shadow-sm space-y-3.5">
        <div class="flex items-center justify-between border-b border-slate-100 pb-2">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-lg bg-teal-50 text-[#006257] flex items-center justify-center font-bold text-xs">🐾</span>
            <h2 class="text-sm font-extrabold text-slate-900">반려동물 정보</h2>
          </div>
          <span class="text-[11px] text-slate-400">안전한 진료를 위해 꼼꼼히 적어주세요</span>
        </div>

        <!-- 1행: 이름 & 품종 -->
        <div class="grid grid-cols-2 gap-2.5 text-xs">
          <div>
            <label class="block font-bold text-slate-700 mb-1">동물 이름 <span class="text-rose-500">*</span></label>
            <input 
              type="text" 
              id="petName" 
              required 
              placeholder="아이 이름" 
              class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-[#006257] focus:ring-1 focus:ring-[#006257] focus:outline-none transition"
            >
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">품종</label>
            <input 
              type="text" 
              id="petBreed" 
              placeholder="예: 말티즈, 코숏, 푸들" 
              class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-[#006257] focus:outline-none transition"
            >
          </div>
        </div>

        <!-- 2행: 동물 종류 (슬림 칩) -->
        <div class="text-xs">
          <label class="block font-bold text-slate-700 mb-1">동물 종류 <span class="text-rose-500">*</span></label>
          <div class="grid grid-cols-4 sm:grid-cols-7 gap-1" id="speciesGroup">
            <button type="button" onclick="selectSpecies(this, '강아지')" class="species-btn py-1.5 px-1 rounded-lg font-bold border border-[#006257] bg-[#006257] text-white transition text-center text-xs">강아지</button>
            <button type="button" onclick="selectSpecies(this, '고양이')" class="species-btn py-1.5 px-1 rounded-lg font-semibold border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition text-center text-xs">고양이</button>
            <button type="button" onclick="selectSpecies(this, '햄스터')" class="species-btn py-1.5 px-1 rounded-lg font-semibold border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition text-center text-xs">햄스터</button>
            <button type="button" onclick="selectSpecies(this, '앵무새')" class="species-btn py-1.5 px-1 rounded-lg font-semibold border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition text-center text-xs">앵무새</button>
            <button type="button" onclick="selectSpecies(this, '파충류')" class="species-btn py-1.5 px-1 rounded-lg font-semibold border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition text-center text-xs">파충류</button>
            <button type="button" onclick="selectSpecies(this, '토끼')" class="species-btn py-1.5 px-1 rounded-lg font-semibold border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition text-center text-xs">토끼</button>
            <button type="button" onclick="selectSpecies(this, '기타')" class="species-btn py-1.5 px-1 rounded-lg font-semibold border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition text-center text-xs">기타</button>
          </div>
          <input type="hidden" id="selectedSpecies" value="강아지">
        </div>

        <!-- 3행: 성별 & 중성화 (인라인 결합) -->
        <div class="text-xs">
          <label class="block font-bold text-slate-700 mb-1">성별 & 중성화 <span class="text-rose-500">*</span></label>
          <div class="flex items-center gap-1.5">
            <button type="button" id="btnFemale" onclick="selectGender('암컷')" class="flex-1 py-2 rounded-xl font-bold border border-[#006257] bg-teal-50 text-[#006257] transition text-xs">암컷</button>
            <button type="button" id="btnMale" onclick="selectGender('수컷')" class="flex-1 py-2 rounded-xl font-semibold border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition text-xs">수컷</button>
            
            <label class="flex items-center gap-1.5 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 transition whitespace-nowrap select-none">
              <input type="checkbox" id="isNeutered" class="w-4 h-4 text-[#006257] rounded border-slate-300 focus:ring-[#006257]">
              <span class="font-bold text-slate-700 text-xs">중성화 완료</span>
            </label>
          </div>
          <input type="hidden" id="selectedGender" value="암컷">
        </div>

        <!-- 4행: 나이 & 생년월일 (스마트 동시 계산) -->
        <div class="bg-slate-50/80 p-3 rounded-xl border border-slate-200/70 space-y-2">
          <div class="flex items-center justify-between">
            <label class="font-bold text-slate-800 text-xs flex items-center gap-1">
              <span>생년월일 및 나이</span>
              <span class="text-rose-500">*</span>
            </label>
            
            <!-- 빠른 나이 입력 -->
            <div class="flex items-center gap-1">
              <span class="text-[11px] text-slate-500 font-semibold">대략 나이:</span>
              <div class="relative w-16">
                <input 
                  type="number" 
                  id="quickAgeInput" 
                  min="0" 
                  max="35" 
                  placeholder="0" 
                  oninput="syncFromAge(this.value)"
                  class="w-full px-2 py-1 pr-5 text-right font-bold text-xs bg-white rounded-lg border border-slate-200 focus:border-[#006257] focus:outline-none"
                >
                <span class="absolute right-1.5 top-1 text-[11px] text-slate-500 font-bold pointer-events-none">살</span>
              </div>
            </div>
          </div>

          <!-- 드롭다운 년/월/일 -->
          <div class="grid grid-cols-3 gap-1.5">
            <select id="birthYear" onchange="syncFromDate()" class="w-full px-2 py-1.5 bg-white text-xs rounded-lg border border-slate-200 focus:border-[#006257] font-medium"></select>
            <select id="birthMonth" onchange="syncFromDate()" class="w-full px-2 py-1.5 bg-white text-xs rounded-lg border border-slate-200 focus:border-[#006257] font-medium"></select>
            <select id="birthDay" onchange="syncFromDate()" class="w-full px-2 py-1.5 bg-white text-xs rounded-lg border border-slate-200 focus:border-[#006257] font-medium"></select>
          </div>

          <div class="flex items-center justify-between text-[11px] text-slate-500 pt-0.5">
            <span>날짜를 잘 모르면 <strong class="text-[#006257]">'대략 나이'</strong>만 적어주세요.</span>
            <span id="calculatedAgeBadge" class="font-bold text-[#006257] bg-teal-100/80 px-2 py-0.5 rounded">약 0살</span>
          </div>
        </div>

        <!-- 5행: 체중 & 성격 -->
        <div class="grid grid-cols-2 gap-2.5 text-xs">
          <div>
            <label class="block font-bold text-slate-700 mb-1">체중 (선택)</label>
            <div class="relative">
              <input 
                type="number" 
                step="0.1" 
                id="petWeight" 
                placeholder="예: 3.5" 
                class="w-full pl-3 pr-8 py-2 text-sm rounded-xl border border-slate-200 focus:border-[#006257] focus:outline-none transition"
              >
              <span class="absolute right-3 top-2.5 text-xs text-slate-400 font-bold">kg</span>
            </div>
          </div>

          <div>
            <label class="block font-bold text-slate-700 mb-1">성격 <span class="text-rose-500">*</span></label>
            <div class="grid grid-cols-3 gap-1" id="personalityGroup">
              <button type="button" onclick="selectPersonality(this, '온순')" class="person-btn py-2 text-xs rounded-xl font-bold border border-[#006257] bg-teal-50 text-[#006257] transition text-center">온순</button>
              <button type="button" onclick="selectPersonality(this, '활발')" class="person-btn py-2 text-xs rounded-xl font-semibold border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition text-center">활발</button>
              <button type="button" onclick="selectPersonality(this, '예민')" class="person-btn py-2 text-xs rounded-xl font-semibold border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition text-center">예민</button>
            </div>
            <input type="hidden" id="selectedPersonality" value="온순">
          </div>
        </div>
      </section>

      <!-- 3. 진료 목적 및 증상 문진표 (직접 서술형 강화) -->
      <section class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/90 shadow-sm space-y-3 text-xs">
        <div class="flex items-center justify-between border-b border-slate-100 pb-2">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-lg bg-teal-50 text-[#006257] flex items-center justify-center font-bold text-xs">🩺</span>
            <h2 class="text-sm font-extrabold text-slate-900">내원 사유 & 증상</h2>
          </div>
          <span class="text-[11px] text-amber-600 font-semibold">* 필수 입력</span>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="block font-bold text-slate-700">보호자님이 느끼신 증상 및 상태 <span class="text-rose-500">*</span></label>
            <span class="text-[10px] text-slate-400">사소한 변화도 진료에 큰 도움이 됩니다</span>
          </div>
          <textarea 
            id="symptomDetail" 
            required
            rows="4" 
            placeholder="언제부터 아이의 어떤 점이 평소와 달랐는지, 걱정되거나 불편해 보이는 부분을 보호자님의 시선에서 편안하게 자세히 적어주세요." 
            class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:border-[#006257] focus:ring-1 focus:ring-[#006257] focus:outline-none transition leading-relaxed resize-none bg-slate-50/50"
          ></textarea>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">기존 질환 / 복용 중인 약 / 알레르기 (선택)</label>
          <input 
            type="text" 
            id="medicalHistory" 
            placeholder="과거 앓았던 병이나 복용 중인 약이 있다면 적어주세요." 
            class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:border-[#006257] focus:outline-none transition"
          >
        </div>
      </section>

      <!-- 4. 개인정보 수집 동의 & 제출 버튼 -->
      <section class="space-y-3 pt-1">
        <label class="flex items-start gap-2 bg-white p-3.5 rounded-2xl border border-slate-200/80 cursor-pointer select-none">
          <input type="checkbox" required class="w-4 h-4 mt-0.5 text-[#006257] rounded border-slate-300 focus:ring-[#006257]">
          <span class="text-xs text-slate-600 leading-snug">
            [필수] 원활한 진료 접수, 진료 알림 및 병원 안내를 위한 <strong>개인정보 수집 및 이용</strong>에 동의합니다.
          </span>
        </label>

        <button 
          type="submit" 
          class="w-full py-4 rounded-2xl bg-gradient-to-r from-[#006257] to-[#004d44] hover:from-[#004d44] hover:to-[#003831] text-white font-extrabold text-base shadow-lg shadow-teal-900/20 active:scale-[0.99] transition duration-150 flex items-center justify-center gap-2"
        >
          <span>초진 접수 등록 완료하기</span>
          <span class="text-lg">✓</span>
        </button>
      </section>

    </form>
  </div>

  <!-- 접수 완료 확인 모달 -->
  <div id="completeModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-slate-100 text-center space-y-4 animate-in fade-in zoom-in duration-150">
      <div class="w-14 h-14 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto text-2xl font-bold">
        ✓
      </div>
      <div>
        <span class="text-xs font-bold text-[#006257] bg-teal-50 px-2.5 py-1 rounded-md">접수 완료</span>
        <h3 class="text-xl font-extrabold text-slate-900 mt-2">초진 접수가 등록되었습니다!</h3>
        <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">
          데스크에 접수 내역이 전달되었습니다.<br>잠시 대기실에서 대기해 주시면 호명해 드리겠습니다.
        </p>
      </div>

      <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 text-xs text-left space-y-1">
        <p class="text-slate-600"><strong>반려동물:</strong> <span id="modalPetInfo" class="text-slate-900 font-bold"></span></p>
        <p class="text-slate-600"><strong>보호자:</strong> <span id="modalOwnerInfo" class="text-slate-900 font-bold"></span></p>
      </div>

      <button 
        type="button" 
        onclick="window.location.href='index.html'" 
        class="w-full py-3 rounded-xl bg-[#006257] text-white font-bold text-xs hover:bg-teal-800 transition shadow-md shadow-teal-900/10"
      >
        확인 (메인 화면으로 이동)
      </button>
    </div>
  </div>

  <!-- 기능 스크립트 -->
  <script>
    const currentYear = new Date().getFullYear();
    const yearSelect = document.getElementById('birthYear');
    const monthSelect = document.getElementById('birthMonth');
    const daySelect = document.getElementById('birthDay');

    // 1. 년, 월, 일 드롭다운 옵션 자동 생성
    for (let y = currentYear; y >= currentYear - 25; y--) {
      yearSelect.add(new Option(`${y}년`, y));
    }
    for (let m = 1; m <= 12; m++) {
      monthSelect.add(new Option(`${m}월`, m));
    }
    for (let d = 1; d <= 31; d++) {
      daySelect.add(new Option(`${d}일`, d));
    }
    yearSelect.value = currentYear;
    monthSelect.value = 1;
    daySelect.value = 1;

    // 2. 나이(살) 입력 시 생년월일 동기화
    function syncFromAge(ageVal) {
      const age = parseInt(ageVal, 10);
      const badge = document.getElementById('calculatedAgeBadge');

      if (isNaN(age) || age < 0) {
        badge.textContent = '나이 계산 중';
        return;
      }

      const calculatedYear = currentYear - age;
      yearSelect.value = calculatedYear;
      monthSelect.value = 1;
      daySelect.value = 1;
      badge.textContent = `약 ${age}살 (${calculatedYear}년생)`;
    }

    // 3. 드롭다운 날짜 변경 시 나이 동기화
    function syncFromDate() {
      const selYear = parseInt(yearSelect.value, 10);
      const age = currentYear - selYear;
      const badge = document.getElementById('calculatedAgeBadge');
      const ageInput = document.getElementById('quickAgeInput');

      ageInput.value = age >= 0 ? age : 0;
      badge.textContent = `약 ${age}살 (${selYear}년생)`;
    }

    // 4. 동물 종류 선택
    function selectSpecies(btn, val) {
      document.querySelectorAll('.species-btn').forEach(b => {
        b.className = 'species-btn py-1.5 px-1 rounded-lg font-semibold border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition text-center text-xs';
      });
      btn.className = 'species-btn py-1.5 px-1 rounded-lg font-bold border border-[#006257] bg-[#006257] text-white transition text-center text-xs';
      document.getElementById('selectedSpecies').value = val;
    }

    // 5. 성별 선택
    function selectGender(val) {
      const btnFemale = document.getElementById('btnFemale');
      const btnMale = document.getElementById('btnMale');

      if (val === '암컷') {
        btnFemale.className = 'flex-1 py-2 rounded-xl font-bold border border-[#006257] bg-teal-50 text-[#006257] transition text-xs';
        btnMale.className = 'flex-1 py-2 rounded-xl font-semibold border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition text-xs';
      } else {
        btnMale.className = 'flex-1 py-2 rounded-xl font-bold border border-[#006257] bg-teal-50 text-[#006257] transition text-xs';
        btnFemale.className = 'flex-1 py-2 rounded-xl font-semibold border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition text-xs';
      }
      document.getElementById('selectedGender').value = val;
    }

    // 6. 성격 선택
    function selectPersonality(btn, val) {
      document.querySelectorAll('.person-btn').forEach(b => {
        b.className = 'person-btn py-2 text-xs rounded-xl font-semibold border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition text-center';
      });
      btn.className = 'person-btn py-2 text-xs rounded-xl font-bold border border-[#006257] bg-teal-50 text-[#006257] transition text-center';
      document.getElementById('selectedPersonality').value = val;
    }

    // 7. 전화번호 자동 하이픈 (-)
    function autoHyphen(target) {
      target.value = target.value
        .replace(/[^0-9]/g, '')
        .replace(/^(\d{2,3})(\d{3,4})(\d{4})$/, `$1-$2-$3`);
    }

    // 8. 접수 제출 처리 (로컬 스토리지에 저장하여 데스크 counter.html과 연동)
    function submitForm(e) {
      e.preventDefault();

      const ownerName = document.getElementById('ownerName').value.trim();
      const ownerPhone = document.getElementById('ownerPhone').value.trim();
      const ownerAddress = document.getElementById('ownerAddress').value.trim();

      const petName = document.getElementById('petName').value.trim();
      const petBreed = document.getElementById('petBreed').value.trim() || '믹스/미입력';
      const species = document.getElementById('selectedSpecies').value;
      const gender = document.getElementById('selectedGender').value;
      const isNeutered = document.getElementById('isNeutered').checked;
      
      const birthYear = document.getElementById('birthYear').value;
      const birthMonth = document.getElementById('birthMonth').value;
      const birthDay = document.getElementById('birthDay').value;
      const age = currentYear - parseInt(birthYear, 10);

      const petWeight = document.getElementById('petWeight').value.trim();
      const personality = document.getElementById('selectedPersonality').value;
      const symptomDetail = document.getElementById('symptomDetail').value.trim();
      const medicalHistory = document.getElementById('medicalHistory').value.trim();

      const registrationData = {
        id: 'REG_' + Date.now(),
        type: '초진',
        time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }),
        status: '접수대기',
        owner: {
          name: ownerName,
          phone: ownerPhone,
          address: ownerAddress
        },
        pet: {
          name: petName,
          breed: petBreed,
          species: species,
          gender: gender,
          isNeutered: isNeutered,
          birthDate: `${birthYear}-${String(birthMonth).padStart(2, '0')}-${String(birthDay).padStart(2, '0')}`,
          age: age,
          weight: petWeight ? `${petWeight}kg` : '-',
          personality: personality
        },
        symptoms: symptomDetail,
        history: medicalHistory
      };

      // 기존 접수 리스트 불러와서 추가 저장
      const existingList = JSON.parse(localStorage.getItem('hospital_receptions') || '[]');
      existingList.unshift(registrationData);
      localStorage.setItem('hospital_receptions', JSON.stringify(existingList));

      // 완료 모달 표시
      document.getElementById('modalPetInfo').textContent = `${petName} (${species} / ${gender}${isNeutered ? '・중성화' : ''} / ${age}살)`;
      document.getElementById('modalOwnerInfo').textContent = `${ownerName} (${ownerPhone})`;
      document.getElementById('completeModal').classList.remove('hidden');
    }
  </script>
</body>
</html>
