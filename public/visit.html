*{box-sizing:border-box}body{margin:0;padding:18px 12px;background:#fffaf3;font-family:Pretendard,system-ui,sans-serif;color:#24333c}.wrap{max-width:620px;margin:auto}.brand{text-align:center;padding:14px;border:2px solid #b6e9df;border-radius:22px;background:white;box-shadow:0 5px 0 #e2f1ed;font-size:clamp(19px,4vw,27px);font-weight:950}.brand em{font-style:normal;color:#0b9e94}.intro{text-align:center;padding:22px 4px 16px}.intro h1{font-size:clamp(28px,6vw,38px);margin:0 0 7px}.intro p{color:#647580;margin:0}.panel{background:white;border:1px solid #f0e7dc;border-radius:22px;padding:clamp(16px,4vw,26px);box-shadow:0 12px 30px #7c59310d}.field{margin-bottom:14px}label{display:block;font-weight:800;margin-bottom:6px}input,textarea{width:100%;min-width:0;border:1.5px solid #d9e0e2;border-radius:10px;padding:10px;font:inherit;font-size:15px}textarea{min-height:90px;resize:vertical}.personal-grid{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px}.personal-grid .field{min-width:0;margin-bottom:14px}.personal-grid label{font-size:13px;white-space:nowrap}.personal-grid input{padding:10px 8px;font-size:14px}.schedule-wrap{position:relative;cursor:pointer}.schedule-wrap input{cursor:pointer}.hint{font-size:12px;color:#738087;margin-top:5px}@media(max-width:520px){body{padding:12px 8px}.panel{padding:14px}.personal-grid{gap:5px}.personal-grid label{font-size:12px}.personal-grid input{padding:10px 5px;font-size:13px}.grid{gap:6px}.opt span{font-size:13px;min-height:43px;padding:6px}}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt input{position:absolute;opacity:0;width:1px}.opt span{display:flex;justify-content:center;align-items:center;min-height:47px;border:1.5px solid #dfe5e5;border-radius:12px;padding:8px;text-align:center;font-size:14px;font-weight:750}.opt input:checked+span{border-color:#0b9e94;background:#eaf8f5;color:#087c73}.submit{width:100%;border:0;border-radius:14px;padding:16px;background:linear-gradient(#ff9949,#f36a28);box-shadow:0 5px 0 #d9541c;color:white;font:inherit;font-size:18px;font-weight:950}.submit:disabled{opacity:.6}.msg{display:none;margin-top:13px;padding:12px;border-radius:12px;line-height:1.5}.ok{display:block;background:#e9f8ef;color:#17633b}.err{display:block;background:#fff0ed;color:#a63b2b}footer{text-align:center;color:#7a878d;font-size:12px;margin:18px 0}</style></head><body><main class="wrap"><div class="brand">🐾 <em>23시</em> 하단오거리동물병원</div><section class="intro"><h1>방문 · 상담 접수</h1><p>방문 목적과 요청 사항을 남겨주세요.</p></section><form id="f" class="panel">
<div class="personal-grid">
<div class="field"><label for="name">보호자 이름 *</label><input id="name" name="visitor_name" required maxlength="80" autocomplete="name" placeholder="이름"></div>
<div class="field"><label for="phone">연락처 *</label><input id="phone" name="phone" type="tel" required maxlength="30" inputmode="tel" autocomplete="tel" placeholder="전화번호"></div>
<div class="field"><label for="animal">동물이름 / 업체이름</label><input id="animal" name="animal_name" maxlength="80" placeholder="동물 또는 업체명"></div>
</div>
<div class="field"><label for="scheduled_at">방문 일정 *</label><div class="schedule-wrap" id="scheduleWrap"><input id="scheduled_at" name="scheduled_at" type="datetime-local" required aria-label="방문 날짜와 시간 선택"></div><div class="hint">날짜와 시간을 선택해주세요. 입력 칸의 어느 부분을 눌러도 달력·시간 선택을 열 수 있습니다.</div></div>
<div class="field"><label>방문 목적 *</label><div class="grid">
<label class="opt"><input type="radio" name="purpose" value="일반 상담" required><span>💬 일반 상담</span></label><label class="opt"><input type="radio" name="purpose" value="서류발급및 수령"><span>📄 서류발급및 수령</span></label><label class="opt"><input type="radio" name="purpose" value="약처방및 수령"><span>💊 약처방및 수령</span></label><label class="opt"><input type="radio" name="purpose" value="검사 결과"><span>🧾 검사 결과</span></label><label class="opt"><input type="radio" name="purpose" value="업체 방문"><span>🏢 업체 방문</span></label><label class="opt"><input type="radio" name="purpose" value="사료·용품 문의"><span>🛍️ 사료·용품 문의</span></label><label class="opt"><input type="radio" name="purpose" value="기타 방문"><span>🏥 기타 방문</span></label></div></div>
<div class="field"><label for="details">요청 사항 *</label><textarea id="details" name="request_details" required maxlength="1500" placeholder="예: 상담 내용, 발급 서류, 처방약 수령, 업체명, 사료·용품 문의 내용 등"></textarea></div><button id="submit" class="submit">방문·상담 접수하기 →</button><div class="msg" id="msg" role="status"></div><p style="font-size:12px;color:#6f7b82;line-height:1.5">입력 정보는 방문·상담 업무 처리 목적으로만 사용됩니다. 불필요한 개인정보는 입력하지 마세요.</p></form><footer>부산시 사하구 하신중앙로 340 1층 · TEL 051-264-8275</footer></main>
<script>const f=document.querySelector('#f'),b=document.querySelector('#submit'),m=document.querySelector('#msg'),schedule=document.querySelector('#scheduled_at'),scheduleWrap=document.querySelector('#scheduleWrap');function openSchedule(){if(typeof schedule.showPicker==='function'){try{schedule.showPicker();return}catch(e){}}schedule.focus();}scheduleWrap.addEventListener('click',openSchedule);schedule.addEventListener('click',e=>{if(typeof schedule.showPicker==='function'){try{schedule.showPicker()}catch(err){}}});const now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());schedule.min=now.toISOString().slice(0,16);f.addEventListener('submit',async e=>{e.preventDefault();m.className='msg';const data=Object.fromEntries(new FormData(f).entries());if(!data.scheduled_at){m.className='msg err';m.textContent='방문 날짜와 시간을 선택해주세요.';return}b.disabled=true;b.textContent='접수 중...';try{const r=await fetch('/api/visits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'접수 서버에 연결되지 않았습니다.');f.reset();m.className='msg ok';m.textContent='접수가 완료되었습니다. 직원에게 말씀해 주시면 확인해 드리겠습니다.'}catch(e){m.className='msg err';m.textContent=e.message==='Failed to fetch'?'접수 서버가 아직 연결되지 않았습니다. 관리자에게 문의해주세요.':e.message}finally{b.disabled=false;b.textContent='방문·상담 접수하기 →'}});</script></body></html>
