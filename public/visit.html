<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>23시 하단오거리동물병원 | 방문·상담 접수</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><style>
*{box-sizing:border-box}body{margin:0;padding:18px 12px;background:#fffaf3;font-family:Pretendard,system-ui,sans-serif;color:#24333c}.wrap{max-width:620px;margin:auto}.brand{text-align:center;padding:14px;border:2px solid #b6e9df;border-radius:22px;background:white;box-shadow:0 5px 0 #e2f1ed;font-size:clamp(19px,4vw,27px);font-weight:950}.brand em{font-style:normal;color:#0b9e94}.intro{text-align:center;padding:22px 4px 16px}.intro h1{font-size:clamp(28px,6vw,38px);margin:0 0 7px}.intro p{color:#647580;margin:0}.panel{background:white;border:1px solid #f0e7dc;border-radius:22px;padding:clamp(16px,4vw,26px);box-shadow:0 12px 30px #7c59310d}.field{margin-bottom:14px}label{display:block;font-weight:800;margin-bottom:6px}input,textarea{width:100%;min-width:0;border:1.5px solid #d9e0e2;border-radius:10px;padding:10px;font:inherit;font-size:15px}textarea{min-height:90px;resize:vertical}.personal-grid{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px}.personal-grid .field{min-width:0;margin-bottom:14px}.personal-grid label{font-size:13px;white-space:nowrap}.personal-grid input{padding:10px 8px;font-size:14px}.schedule-wrap{position:relative;cursor:pointer}.schedule-wrap input{cursor:pointer}.hint{font-size:12px;color:#738087;margin-top:5px}
/* 주요 입력란은 형광펜 효과로 강조 */
.personal-grid .field:nth-child(1) label,.personal-grid .field:nth-child(2) label,.highlight-label{display:table;width:max-content;max-width:100%;padding:2px 6px;border-radius:5px;background:linear-gradient(transparent 12%,#fff078 12%,#fff078 92%,transparent 92%);font-weight:950;color:#263238}
.personal-grid .field:nth-child(1) input,.personal-grid .field:nth-child(2) input{border:2px solid #e5c93a;background:#fffef0;font-weight:750;box-shadow:0 0 0 2px #fff5b8}
.schedule-row{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;width:100%}
.schedule-wrap{flex:0 1 36%;min-width:0;width:36%}
.schedule-wrap input{width:100%;min-width:0;padding:8px 3px;font-size:12px;letter-spacing:-.4px}
.quick-times{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;flex:1;min-width:0}
.quick-times button{border:1.5px solid #e5c93a;border-radius:8px;background:#fff8a8;color:#514400;font:inherit;font-size:12px;font-weight:900;padding:9px 1px;cursor:pointer;white-space:nowrap;min-width:0}
.quick-times button:active{transform:translateY(1px);background:#ffed68}
.field:has(#scheduled_at),.field:has(input[name="purpose"]),.field:has(#details),.personal-grid .field:has(#animal){padding:10px;border:1px solid #f0df73;border-radius:12px;background:#fffef0}
.field:has(#scheduled_at)>label,.field:has(input[name="purpose"])>label,.field:has(#details)>label,.personal-grid .field:has(#animal)>label{display:table;padding:2px 7px;border-radius:5px;background:linear-gradient(transparent 10%,#fff078 10%,#fff078 95%,transparent 95%);font-weight:950;color:#263238}
.field:has(#details) textarea,.personal-grid .field:has(#animal) input{border:2px solid #e5c93a;background:#fffef8;font-weight:750}.required-badge{display:inline-block;margin-left:5px;padding:2px 6px;border-radius:5px;background:#e32636;color:#fff;font-size:10px;font-weight:950;vertical-align:middle;letter-spacing:.2px}.quick-times button.now-btn{background:#ffe1e4;border-color:#e32636;color:#a20d1b}
@media(max-width:520px){body{padding:12px 8px}.panel{padding:14px}.personal-grid{gap:5px}.personal-grid label{font-size:12px}.personal-grid input{padding:10px 5px;font-size:13px}.grid{gap:6px}.opt span{font-size:13px;min-height:43px;padding:6px}}
@media(max-width:520px){.schedule-row{gap:4px;flex-wrap:nowrap}.schedule-wrap{flex:0 0 35%;width:35%;min-width:0}.schedule-wrap input{padding:8px 2px;font-size:11px}.quick-times{flex:1;min-width:0;gap:3px}.quick-times button{padding:9px 0;font-size:11px;letter-spacing:-.5px}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt input{position:absolute;opacity:0;width:1px}.opt span{display:flex;justify-content:center;align-items:center;min-height:47px;border:1.5px solid #dfe5e5;border-radius:12px;padding:8px;text-align:center;font-size:14px;font-weight:750}.opt input:checked+span{border-color:#0b9e94;background:#eaf8f5;color:#087c73}.submit{width:100%;border:0;border-radius:14px;padding:16px;background:linear-gradient(#ff9949,#f36a28);box-shadow:0 5px 0 #d9541c;color:white;font:inherit;font-size:18px;font-weight:950}.submit:disabled{opacity:.6}.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.secondary{width:100%;border:1.5px solid #cbd5d9;border-radius:14px;padding:13px 10px;background:#f8fafb;color:#33434c;font:inherit;font-size:15px;font-weight:850;cursor:pointer}.home-btn{background:#123b70;border-color:#0b2b53;color:#fff;box-shadow:0 3px 0 #071d39}.secondary:active{transform:translateY(1px)}.msg{display:none;margin-top:13px;padding:12px;border-radius:12px;line-height:1.5}.ok{display:block;background:#e9f8ef;color:#17633b}.err{display:block;background:#fff0ed;color:#a63b2b}footer{text-align:center;color:#7a878d;font-size:12px;margin:18px 0}</style></head><body><main class="wrap"><div class="brand">🐾 <em>23시</em> 하단오거리동물병원</div><section class="intro"><h1>방문 · 상담 접수</h1><p>방문 목적과 요청 사항을 남겨주세요.</p></section><form id="f" class="panel">
<div class="personal-grid">
<div class="field"><label for="name">보호자 이름 <span class="required-badge">필수</span></label><input id="name" name="visitor_name" required maxlength="80" autocomplete="name" placeholder="이름"></div>
<div class="field"><label for="phone">연락처 <span class="required-badge">필수</span></label><input id="phone" name="phone" type="tel" required maxlength="30" inputmode="tel" autocomplete="tel" placeholder="전화번호"></div>
<div class="field"><label for="animal">동물이름 / 업체이름 <span class="required-badge">필수</span></label><input id="animal" name="animal_name" required maxlength="80" placeholder="동물 또는 업체명"></div>
</div>
<div class="field"><label for="scheduled_at">방문 일정 <span class="required-badge">필수</span></label><div class="schedule-row"><div class="schedule-wrap" id="scheduleWrap"><input id="scheduled_at" name="scheduled_at" type="datetime-local" required aria-label="방문 날짜와 시간 선택"></div><div class="quick-times" aria-label="방문 일정 빠른 선택"><button type="button" id="nowBtn" class="now-btn">지금</button><button type="button" id="todayBtn">오늘</button><button type="button" data-hour="10">오전</button><button type="button" data-hour="14">오후</button><button type="button" data-hour="20">야간</button></div></div><div class="hint">날짜와 시간을 직접 선택하거나, 오늘·오전·오후·야간 버튼으로 빠르게 입력하세요.</div></div>
<div class="field"><label>방문 목적 <span class="required-badge">필수</span></label><div class="grid">
<label class="opt"><input type="radio" name="purpose" value="일반 상담" required><span>💬 일반 상담</span></label><label class="opt"><input type="radio" name="purpose" value="서류발급및 수령"><span>📄 서류발급및 수령</span></label><label class="opt"><input type="radio" name="purpose" value="약처방및 수령"><span>💊 약처방및 수령</span></label><label class="opt"><input type="radio" name="purpose" value="검사 결과"><span>🧾 검사 결과</span></label><label class="opt"><input type="radio" name="purpose" value="업체 방문"><span>🏢 업체 방문</span></label><label class="opt"><input type="radio" name="purpose" value="사료·용품 문의"><span>🛍️ 사료·용품 문의</span></label><label class="opt"><input type="radio" name="purpose" value="기타 방문"><span>🏥 기타 방문</span></label></div></div>
<div class="field"><label for="details">요청 사항 <span style="display:inline-block;margin-left:5px;padding:2px 6px;border-radius:5px;background:#e8edf0;color:#52616b;font-size:10px;font-weight:900;vertical-align:middle">선택</span></label><textarea id="details" name="request_details" maxlength="1500" placeholder="예: 상담 내용, 발급 서류, 처방약 수령, 업체명, 사료·용품 문의 내용 등"></textarea></div><button id="submit" class="submit">방문·상담 접수하기 →</button><div class="msg" id="msg" role="status"></div><p style="font-size:12px;color:#6f7b82;line-height:1.5">입력 정보는 방문·상담 업무 처리 목적으로만 사용됩니다. 불필요한 개인정보는 입력하지 마세요.</p><div class="form-actions"><button type="button" id="resetForm" class="secondary">↻ 입력 초기화</button><button type="button" id="goHome" class="secondary home-btn">⌂ 홈으로 돌아가기</button></div></form><footer>부산시 사하구 하신중앙로 340 1층 · TEL 051-264-8275</footer></main>
<script>const f=document.querySelector('#f'),b=document.querySelector('#submit'),m=document.querySelector('#msg'),schedule=document.querySelector('#scheduled_at'),scheduleWrap=document.querySelector('#scheduleWrap');function openSchedule(){if(typeof schedule.showPicker==='function'){try{schedule.showPicker();return}catch(e){}}schedule.focus();}scheduleWrap.addEventListener('click',openSchedule);schedule.addEventListener('click',e=>{if(typeof schedule.showPicker==='function'){try{schedule.showPicker()}catch(err){}}});function setSchedule(hour){const d=new Date();d.setHours(hour,0,0,0);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());schedule.value=d.toISOString().slice(0,16);}document.querySelector('#nowBtn').addEventListener('click',()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());schedule.value=d.toISOString().slice(0,16);});document.querySelector('#todayBtn').addEventListener('click',()=>{const current=schedule.value?new Date(schedule.value):new Date();const h=schedule.value?current.getHours():10;setSchedule(h);});document.querySelectorAll('.quick-times [data-hour]').forEach(btn=>btn.addEventListener('click',()=>setSchedule(Number(btn.dataset.hour))));document.querySelector('#phone').addEventListener('input',e=>{let digits=e.target.value.replace(/\D/g,'').slice(0,11);if(digits.length>7)digits=digits.slice(0,3)+'-'+digits.slice(3,7)+'-'+digits.slice(7);else if(digits.length>3)digits=digits.slice(0,3)+'-'+digits.slice(3);e.target.value=digits;});document.querySelector('#resetForm').addEventListener('click',()=>{if(confirm('입력한 내용을 모두 지우고 초기화할까요?')){f.reset();m.className='msg';m.textContent='';}});document.querySelector('#goHome').addEventListener('click',()=>{window.location.href='/';});const now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());schedule.min=now.toISOString().slice(0,16);f.addEventListener('submit',async e=>{e.preventDefault();m.className='msg';const data=Object.fromEntries(new FormData(f).entries());if(!data.scheduled_at){m.className='msg err';m.textContent='방문 날짜와 시간을 선택해주세요.';return}b.disabled=true;b.textContent='접수 중...';try{const r=await fetch('/api/visits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'접수 서버에 연결되지 않았습니다.');f.reset();m.className='msg ok';m.textContent='접수가 완료되었습니다. 직원에게 말씀해 주시면 확인해 드리겠습니다.'}catch(e){m.className='msg err';m.textContent=e.message==='Failed to fetch'?'접수 서버가 아직 연결되지 않았습니다. 관리자에게 문의해주세요.':e.message}finally{b.disabled=false;b.textContent='방문·상담 접수하기 →'}});</script></body></html>
