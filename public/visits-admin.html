<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>방문·상담 현황판 | 23시 하단오거리동물병원</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{--ink:#20323d;--teal:#087f75;--mint:#e8f7f3;--line:#dce5e8;--muted:#647580}
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f5f8fa;font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--ink)}
main{max-width:1500px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.head h1{font-size:clamp(24px,3vw,34px);margin:0;letter-spacing:-.04em}.sub{color:var(--muted);margin:7px 0 0}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px;box-shadow:0 8px 24px #1f394a08}.login{display:grid;grid-template-columns:minmax(200px,1fr) auto;gap:10px;align-items:end}.field{display:flex;flex-direction:column;gap:7px}label{font-weight:800}input,select,button{font:inherit}input,select{border:1px solid #cbd5dc;border-radius:10px;padding:11px 12px;min-width:0;background:#fff;color:var(--ink)}button{border:0;border-radius:10px;padding:11px 15px;background:var(--teal);color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:#eaf0f3;color:#334b58}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:200px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:var(--mint);padding:10px 14px;border-radius:12px;font-weight:800}.status-msg{margin-top:12px;font-weight:700;line-height:1.5}.err{color:#b42318}.ok{color:#18734b}.table-wrap{overflow:auto;margin-top:14px}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1050px;font-size:14px}th,td{padding:12px 10px;border-bottom:1px solid #e7edf0;text-align:left;vertical-align:top}th{background:#f0f6f6;position:sticky;top:0;white-space:nowrap}td.details{white-space:pre-wrap;min-width:180px;max-width:300px;overflow-wrap:anywhere}.status-select{min-width:100px;padding:8px}.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}
@media(max-width:600px){body{padding:10px}.panel{padding:13px}.login{grid-template-columns:1fr}.head{align-items:flex-start}}
</style>
</head>
<body>
<main>
<header class="head">
<div><h1>방문·상담 현황판</h1><p class="sub">23시 하단오거리동물병원 · 기존 진료접수와 분리 운영</p></div>
<div class="toolbar"><button id="exportBtn" class="secondary hidden" type="button">엑셀 저장 (.csv)</button><button id="refreshBtn" class="secondary" type="button">목록 새로고침</button><button id="logoutBtn" class="secondary hidden" type="button">인증 해제</button></div>
</header>
<section class="panel" id="loginPanel">
<h2 style="margin:0 0 8px">관리자 인증</h2>
<p class="small">Cloudflare Worker의 ADMIN_TOKEN 값을 입력하세요. 토큰은 이 페이지의 브라우저 메모리에만 보관됩니다.</p>
<form id="loginForm" class="login">
<div class="field"><label for="token">관리자 토큰</label><input id="token" type="password" autocomplete="current-password" required placeholder="ADMIN_TOKEN 값"></div>
<button type="submit">인증하고 접수 목록 열기</button>
</form>
<div id="loginMessage" class="status-msg" role="status"></div>
</section>
<section class="panel hidden" id="dataPanel">
<div class="toolbar">
<input id="search" type="search" placeholder="이름, 연락처, 동물 이름, 요청 사항 검색">
<select id="statusFilter" aria-label="상태 필터"><option value="">전체 상태</option><option>접수</option><option>처리 중</option><option>완료</option><option>취소</option></select>
</div>
<div class="stats" id="stats" style="margin-top:14px"></div>
<div id="dataMessage" class="status-msg" role="status"></div>
<div class="table-wrap"><table><thead><tr><th>접수번호</th><th>접수 시각</th><th>방문 예정</th><th>방문자</th><th>연락처</th><th>동물 이름</th><th>방문 목적</th><th>요청 사항</th><th>처리 상태</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
</main>
<script>
const API = "https://23si-visit-api.yurmgirl.workers.dev";
let adminToken = "";
let items = [];
const $ = (id) => document.getElementById(id);
const statusOptions = ["접수","처리 중","완료","취소"];
function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function dateText(value) {
  if (!value) return "—";
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
}
function setMessage(id, text, kind="") { $(id).className = "status-msg " + kind; $(id).textContent = text; }
async function loadVisits() {
  if (!adminToken) return;
  $("refreshBtn").disabled = true;
  setMessage("dataMessage","접수 목록을 불러오는 중...");
  try {
    const res = await fetch(`${API}/api/visits`, {headers:{Authorization:`Bearer ${adminToken}`}});
    const data = await res.json().catch(()=>({}));
    if (res.status === 401) {
      adminToken = "";
      $("dataPanel").classList.add("hidden");
      $("loginPanel").classList.remove("hidden");
      $("logoutBtn").classList.add("hidden");
      throw new Error("인증 실패: ADMIN_TOKEN 값을 확인해 주세요.");
    }
    if (!res.ok) throw new Error(data.error || `조회 실패 (${res.status})`);
    items = Array.isArray(data.items) ? data.items : [];
    $("loginPanel").classList.add("hidden");
    $("dataPanel").classList.remove("hidden");
    $("logoutBtn").classList.remove("hidden");
    $("exportBtn").classList.remove("hidden");
    render();
    setMessage("dataMessage",`총 ${items.length}건을 불러왔습니다.`, "ok");
  } catch (e) { setMessage("dataMessage",e.message || "목록 조회 중 오류가 발생했습니다.","err"); }
  finally { $("refreshBtn").disabled = false; }
}
function render() {
  const q = $("search").value.trim().toLowerCase();
  const status = $("statusFilter").value;
  const filtered = items.filter(item => {
    const haystack = [item.visitor_name,item.phone,item.animal_name,item.purpose,item.request_details,item.scheduled_at].join(" ").toLowerCase();
    return (!q || haystack.includes(q)) && (!status || item.status === status);
  });
  $("stats").innerHTML = [
    `<div class="stat">전체 ${items.length}건</div>`,
    ...statusOptions.map(s => `<div class="stat">${escapeHTML(s)} ${items.filter(i=>i.status===s).length}건</div>`)
  ].join("");
  if (!filtered.length) {
    $("rows").innerHTML = `<tr><td colspan="9">조건에 맞는 접수 내역이 없습니다.</td></tr>`;
    return;
  }
  $("rows").innerHTML = filtered.map(item => `
    <tr>
      <td><span class="pill">#${escapeHTML(item.id)}</span></td>
      <td>${escapeHTML(dateText(item.created_at))}</td>
      <td>${escapeHTML(dateText(item.scheduled_at))}</td>
      <td>${escapeHTML(item.visitor_name)}</td>
      <td>${escapeHTML(item.phone)}</td>
      <td>${escapeHTML(item.animal_name || "—")}</td>
      <td>${escapeHTML(item.purpose)}</td>
      <td class="details">${escapeHTML(item.request_details)}</td>
      <td><select class="status-select" data-id="${escapeHTML(item.id)}" aria-label="접수번호 ${escapeHTML(item.id)} 상태 변경">
        ${statusOptions.map(s=>`<option ${item.status===s?"selected":""}>${escapeHTML(s)}</option>`).join("")}
      </select></td>
    </tr>`).join("");
  $("rows").querySelectorAll("select[data-id]").forEach(sel => sel.addEventListener("change", async () => {
    const id = sel.dataset.id, nextStatus = sel.value, oldItem = items.find(i=>String(i.id)===String(id));
    sel.disabled = true;
    try {
      const res = await fetch(`${API}/api/visits/${encodeURIComponent(id)}`, {
        method:"PATCH", headers:{"Content-Type":"application/json",Authorization:`Bearer ${adminToken}`},
        body:JSON.stringify({status:nextStatus})
      });
      const data = await res.json().catch(()=>({}));
      if (!res.ok) throw new Error(data.error || `상태 변경 실패 (${res.status})`);
      if (oldItem) oldItem.status = nextStatus;
      render();
      setMessage("dataMessage",`접수번호 ${id}번 상태를 '${nextStatus}'(으)로 변경했습니다.`, "ok");
    } catch (e) {
      setMessage("dataMessage",e.message || "상태 변경 중 오류가 발생했습니다.","err");
      await loadVisits();
    } finally { sel.disabled = false; }
  }));
}

function csvCell(value) {
  let s = String(value ?? "");
  // Prevent spreadsheet formula injection for untrusted text.
  if (/^[\s]*[=+\-@]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
function exportCSV() {
  const q = $("search").value.trim().toLowerCase();
  const status = $("statusFilter").value;
  const filtered = items.filter(item => {
    const haystack = [item.visitor_name,item.phone,item.animal_name,item.purpose,item.request_details,item.scheduled_at].join(" ").toLowerCase();
    return (!q || haystack.includes(q)) && (!status || item.status === status);
  });
  const headers = ["접수번호","접수시각","방문예정일시","방문자 성함","연락처","동물 이름","방문 목적","요청 사항","처리 상태"];
  const rows = filtered.map(item => [
    item.id, dateText(item.created_at), dateText(item.scheduled_at), item.visitor_name,
    item.phone, item.animal_name || "", item.purpose, item.request_details, item.status
  ]);
  const csv = "\\uFEFF" + [headers, ...rows].map(row => row.map(csvCell).join(",")).join("\\r\\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const now = new Date();
  const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}_${String(now.getHours()).padStart(2,"0")}${String(now.getMinutes()).padStart(2,"0")}`;
  a.href = url; a.download = `방문상담접수_${stamp}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  setMessage("dataMessage", `${filtered.length}건을 엑셀 호환 CSV 파일로 저장했습니다. Excel에서 열 수 있습니다.`, "ok");
}
$("exportBtn").addEventListener("click", exportCSV);

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  adminToken = $("token").value.trim();
  setMessage("loginMessage","인증 확인 중...");
  await loadVisits();
  if (!$("dataPanel").classList.contains("hidden")) $("token").value = "";
});
$("refreshBtn").addEventListener("click", loadVisits);
$("logoutBtn").addEventListener("click", () => {
  adminToken = ""; items = [];
  $("dataPanel").classList.add("hidden"); $("loginPanel").classList.remove("hidden"); $("logoutBtn").classList.add("hidden"); $("exportBtn").classList.add("hidden");
  $("token").value = ""; $("rows").innerHTML = ""; setMessage("loginMessage","인증이 해제되었습니다.");
});
$("search").addEventListener("input", render);
$("statusFilter").addEventListener("change", render);
</script>
</body>
</html>
